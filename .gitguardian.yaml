# GitGuardian's pull request check. The repo's secret gate is gitleaks
# (`.gitleaks.toml`, `@libs/tools-harness-ts#verify:secrets`); this only
# silences the fixtures GitGuardian misreads as credentials.
version: 2
secret:
  ignored_paths:
    # Harness database snapshots: session tokens drawn from the seeded,
    # in-memory id source, valid nowhere.
    - 'libs/*-harness-ts/fixtures/snapshots/*.json'
    # Placeholder broker credentials (`u` / `p`) against an in-memory broker.
    - 'pkgs/pubsub-mqtt-harness-ts/tests/create-mqtt-pubsub.test.ts'
