apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: health-job-failure
spec:
  description: "The hourly Health run fails its objectives job, and GitHub notifies the people watching the repository. Works with no dashboard service."
  target: github-actions
---
apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: grafana-irm-page
spec:
  description: "Grafana raises the alert into Grafana IRM, whose paging chain notifies the person on call with their important notification rules."
  target: grafana-irm
---
apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: grafana-irm-push
spec:
  description: "Grafana raises the alert into Grafana IRM, whose push chain notifies the person on call with their default notification rules and never pages."
  target: grafana-irm
---
apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: grafana-daily-digest
spec:
  description: "Grafana holds the alert and sends it in one summary a day."
  target: grafana
---
