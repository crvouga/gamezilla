apiVersion: openslo/v1
kind: AlertPolicy
metadata:
  name: the-app-answers-people-quickly-fast-burn
  displayName: "The app answers people quickly: fast-burn"
  labels:
    slo:
      - the-app-answers-people-quickly
    severity:
      - page
spec:
  description: "page: The app answers people quickly is spending its error budget at a rate that ends it within hours: \"At least 19 in every 20 requests people wait on are answered within half a second\" burns at 14.4x or more over 1h and over 5m."
  alertWhenNoData: false
  alertWhenResolved: true
  alertWhenBreaching: true
  conditions:
    - conditionRef: the-app-answers-people-quickly-fast-burn-over-1h
    - conditionRef: the-app-answers-people-quickly-fast-burn-over-5m
  notificationTargets:
    - targetRef: health-job-failure
    - targetRef: grafana-notification-policy
---
