<div class="startup-shell" data-startup-shell>
  <main>
    <div class="opening-header">
      <h1 tabindex="-1">%BRAND_NAME%</h1>
      <a href="/more" data-testid="global-menu-settings">Settings</a>
    </div>
    <nav aria-label="Navigation">
      <strong>%BRAND_NAME%</strong>
      <a href="/" data-startup-focus="tab-spaces"><span class="opening-art" aria-hidden="true"><img width="32" height="32" alt="" src="/node_modules/@pkgs/ui-root-client-ts/assets/fluent-emoji/video-game.svg" /></span>Spaces</a>
      <a href="/search" data-startup-focus="tab-search"><span class="opening-art" aria-hidden="true"><img width="32" height="32" alt="" src="/node_modules/@pkgs/ui-root-client-ts/assets/fluent-emoji/magnifying-glass-tilted-left.svg" /></span>Search</a>
      <a href="/notifications" data-startup-focus="tab-notifications"><span class="opening-art" aria-hidden="true"><img width="32" height="32" alt="" src="/node_modules/@pkgs/ui-root-client-ts/assets/fluent-emoji/bell.svg" /></span>Notifications</a>
      <a href="/profile" data-startup-focus="tab-profile"><span class="opening-art" aria-hidden="true"><img width="32" height="32" alt="" src="/node_modules/@pkgs/ui-root-client-ts/assets/fluent-emoji/bust-in-silhouette.svg" /></span>Profile</a>
    </nav>
    <div class="opening-create" data-route="/" hidden>
      <p role="status">Reading your spaces…</p>
      <button type="button" data-startup-create data-startup-focus="space-create">New space</button>
    </div>
    <div data-route="/search" hidden>
      <input type="text" name="people-search" aria-label="Search people" placeholder="Search people by username"
        autocapitalize="none" autocorrect="off" autocomplete="off"
        data-testid="search-input" data-sensitive="true" />
    </div>
    <div data-route="/more" hidden>
      <a href="/more/sound" data-testid="settings-sound">Sound</a>
    </div>
    <div data-route="/more/sound" hidden>
      <p role="status">Opening sound settings…</p>
    </div>
  </main>
</div>
<script>
  (() => {
    const shell = document.querySelector('[data-startup-shell]');
    const title = shell.querySelector('h1');
    const links = Array.from(shell.querySelectorAll('a[href]'));
    const views = shell.querySelectorAll('[data-route]');
    const create = shell.querySelector('[data-startup-create]');
    create.addEventListener('click', () => {
      create.disabled = true;
      create.textContent = 'Opening…';
    });
    const search = shell.querySelector('input[name="people-search"]');
    search.addEventListener('compositionstart', () => search.setAttribute('data-composing', ''));
    search.addEventListener('compositionend', () => search.removeAttribute('data-composing'));
    function showLocation() {
      if (location.pathname !== '/') {
        create.disabled = false;
        create.textContent = 'New space';
      }
      const active = links.find(link => link.pathname === location.pathname);
      title.textContent = active ? active.textContent : document.title;
      for (const link of links) {
        if (link === active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
      for (const view of views) view.hidden = view.dataset.route !== location.pathname;
    }
    shell.addEventListener('click', event => {
      const link = event.target.closest('a[href]');
      if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      event.stopPropagation();
      if (location.href !== link.href) {
        history.pushState(null, '', link.href);
        window.dispatchEvent(new PopStateEvent('popstate'));
      }
      const focus = location.pathname === '/search' ? search : title;
      focus.focus();
    });
    showLocation();
    window.addEventListener('popstate', showLocation);
    const removal = new MutationObserver(() => {
      if (shell.isConnected) return;
      window.removeEventListener('popstate', showLocation);
      removal.disconnect();
    });
    removal.observe(shell.parentNode, { childList: true });
  })();
</script>
