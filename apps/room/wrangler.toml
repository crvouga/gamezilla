# Room Durable Object Worker — owns the Room DO class (not @apps/server).
name = "gamezilla-room"
main = "src/room.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1-room"
new_sqlite_classes = ["Room"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Production publishes as gamezilla-room-production (see PROJECT_CONFIG).
[env.production]

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.production.migrations]]
tag = "v1-room"
new_sqlite_classes = ["Room"]
