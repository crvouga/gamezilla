  <script>
    // The theme the app mounts with (`ThemePreferenceProvider`), set before
    // first paint so boot never flashes from one scheme to the other.
    (function () {
      var scheme;
      try {
        var stored = JSON.parse(localStorage.getItem('ui.prefs/color-scheme'));
        scheme = stored && stored['ui.prefs/value'];
      } catch (_) {}
      if (scheme !== 'light' && scheme !== 'dark') {
        scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', scheme);
    })();
  </script>
  <style>
    /* Boot paint, before any stylesheet or script: the design tokens'
       values written out (`tests/startup-shell.test.ts` holds every color to
       `design-tokens.json` and the indicator to `activityIndicatorSvg`). The
       tokens take over once their stylesheet loads. */
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      background: var(--ui-color-background, hsla(0, 0%, 0%, 1));
      color: var(--ui-color-text, hsla(0, 0%, 96%, 1));
      color-scheme: dark;
    }

    html[data-theme="light"],
    html[data-theme="light"] body {
      background: var(--ui-color-background, hsla(0, 0%, 100%, 1));
      color: var(--ui-color-text, hsla(0, 0%, 5%, 1));
      color-scheme: light;
    }

    /* Mirrors the in-app BootLoadingShell (LoadingState size="lg"), so boot
       shows one loading state from first paint to ready. */
    .startup-shell {
      align-items: center;
      display: flex;
      flex-direction: column;
      font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      gap: 8px;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .activity-indicator {
      animation: activity-step 1000ms steps(12, end) infinite;
      color: hsla(0, 0%, 66%, 1);
    }

    html[data-theme="light"] .activity-indicator {
      color: hsla(0, 0%, 42%, 1);
    }

    .startup-shell-failed {
      gap: 12px;
    }

    .startup-shell-mark {
      align-items: center;
      background: hsla(355, 90%, 60%, 0.16);
      border-radius: 9999px;
      color: hsla(355, 90%, 66%, 1);
      display: flex;
      font-size: 20px;
      font-weight: 700;
      height: 48px;
      justify-content: center;
      width: 48px;
    }

    .startup-shell-guidance {
      color: hsla(0, 0%, 66%, 1);
    }

    .startup-shell-detail {
      color: hsla(355, 90%, 66%, 1);
      max-width: min(640px, calc(100vw - 32px));
      overflow-wrap: anywhere;
      text-align: center;
    }

    .startup-shell-reload {
      background: hsla(204, 100%, 39%, 1);
      border: 0;
      border-radius: 8px;
      color: hsla(0, 0%, 100%, 1);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      margin-top: 4px;
      min-height: 44px;
      padding: 0 16px;
    }

    html[data-theme="light"] .startup-shell-mark {
      background: hsla(355, 78%, 50%, 0.10);
      color: hsla(355, 78%, 45%, 1);
    }

    html[data-theme="light"] .startup-shell-guidance {
      color: hsla(0, 0%, 42%, 1);
    }

    html[data-theme="light"] .startup-shell-detail {
      color: hsla(355, 78%, 45%, 1);
    }

    @keyframes activity-step {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .activity-indicator {
        animation: none;
      }
    }
  </style>
