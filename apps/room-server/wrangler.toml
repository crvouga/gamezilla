# Room server Durable Object Worker — owns RoomServerDurableObject (not @apps/server).
name = "gamezilla-room"
main = "src/room.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"

[[migrations]]
tag = "v1-room"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2-room-server-durable-object"

  [[migrations.renamed_classes]]
  from = "Room"
  to = "RoomServerDurableObject"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Production publishes as gamezilla-room-production (see PROJECT_CONFIG).
[env.production]

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"

[[env.production.migrations]]
tag = "v1-room"
new_sqlite_classes = ["Room"]

[[env.production.migrations]]
tag = "v2-room-server-durable-object"

  [[env.production.migrations.renamed_classes]]
  from = "Room"
  to = "RoomServerDurableObject"
