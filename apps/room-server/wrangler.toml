# Room server Durable Object Worker — owns RoomServerDurableObject (not @apps/server).
# Env-agnostic code config: the deployed name comes from libs/infra
# (render-wrangler). Migrations may add or rename classes, never delete one.
name = "gamezilla-room"
main = "src/room.ts"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"

[[migrations]]
tag = "v1-room"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2-room-server-durable-object"

  [[migrations.renamed_classes]]
  from = "Room"
  to = "RoomServerDurableObject"

[observability]
[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
