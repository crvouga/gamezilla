# Local API preview only. Production ships apps/product-ts/wrangler.toml,
# which includes the client assets and this entrypoint in one application.
# Nothing deploys it, so it has no name: `wrangler dev` runs it as `worker`.
main = "src/server.ts"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

# Rooms are owned by the same script as the API.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"
[[migrations]]
tag = "v1-app-room"
new_sqlite_classes = ["RoomServerDurableObject"]

[triggers]
crons = ["*/1 * * * *"]

[observability]
[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
