  <style>
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #000000;
      color: #E7E9EA;
      color-scheme: dark;
    }

    /* Mirrors the in-app BootLoadingShell (LoadingState size="large" +
       caption) so boot shows one loading state from first paint to ready. */
    .startup-shell {
      align-items: center;
      display: flex;
      flex-direction: column;
      font: 500 0.875rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      gap: 0.5rem;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .startup-shell-spinner {
      animation: startup-spin 900ms linear infinite;
      color: #1D9BF0;
      height: 48px;
      width: 48px;
    }

    .startup-shell-caption {
      color: #8B98A5;
      font-size: 12px;
      letter-spacing: 0.01em;
      line-height: 18px;
    }

    .startup-shell-failed {
      gap: 0.75rem;
    }

    .startup-shell-mark {
      align-items: center;
      background: #16181C;
      border: 1px solid #F4212E;
      border-radius: 0.75rem;
      color: #F4646E;
      display: flex;
      font-size: 1.125rem;
      height: 3rem;
      justify-content: center;
      width: 3rem;
    }

    .startup-shell-guidance {
      color: #8B98A5;
    }

    .startup-shell-detail {
      color: #F4646E;
      max-width: min(40rem, calc(100vw - 2rem));
      overflow-wrap: anywhere;
      text-align: center;
    }

    .startup-shell-reload {
      background: #E7E9EA;
      border: 0;
      border-radius: 0.5rem;
      color: #000000;
      cursor: pointer;
      font: inherit;
      margin-top: 0.25rem;
      padding: 0.625rem 1rem;
    }

    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes startup-pulse {
      50% {
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-shell-spinner {
        animation: startup-pulse 1600ms ease-in-out infinite;
      }
    }
  </style>
