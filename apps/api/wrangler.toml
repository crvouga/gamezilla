name = "gamezilla-api"
main = "src/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

routes = [{ pattern = "api.gamezilla.app", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Cloudflare DO migrations are append-only and identified by tag; never edit a
# tag that has already been applied in production. Free-plan Workers require
# SQLite-backed DOs (`new_sqlite_classes`); `new_classes` is paid-plan only.
# The earlier `v1-room-relay` / `v2-rename-room` tags never deployed
# successfully (all prior deploys failed with Cloudflare error 10097 before
# the namespace was created), so replacing them with a single SQLite-backed
# migration is safe.
[[migrations]]
tag = "v1-room-sqlite"
new_sqlite_classes = ["Room"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
