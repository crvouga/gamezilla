name = "gamezilla-api"
main = "src/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

routes = [{ pattern = "api.gamezilla.app", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Cloudflare DO migrations are append-only and identified by tag; never edit
# a tag that has already been applied in production. The original v1 created
# the `RoomRelay` class; v2 renames the existing class to `Room` so the
# Durable Object storage and IDs are preserved.
[[migrations]]
tag = "v1-room-relay"
new_classes = ["RoomRelay"]

[[migrations]]
tag = "v2-rename-room"
renamed_classes = [{ from = "RoomRelay", to = "Room" }]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
