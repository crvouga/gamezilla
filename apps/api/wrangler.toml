name = "gamezilla"
main = "src/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Cloudflare DO migrations are append-only and identified by tag; never edit a
# tag that has already been applied in production. Free-plan Workers require
# SQLite-backed DOs (`new_sqlite_classes`); `new_classes` is paid-plan only.
# `v1-room-sqlite` provisioned the original `Room` class. We do not need to
# preserve any of its state, so `v2-replace-room-with-space` deletes `Room`
# (destroying any existing DO storage) and creates the new SQLite-backed
# `Space` class in a single deploy. If `v1-room-sqlite` was never actually
# applied, both migrations run in order on the next deploy: `Room` is
# created and immediately deleted, then `Space` is created — net result is
# the same.
# `v3-rename-space-do-class-to-room` deletes the `Space` class and introduces a
# new SQLite-backed `Room` class (new DO storage); binding key becomes `ROOM`.
# `v4-matchmaking-ticker` introduced the singleton ticker DO that owned the
# alarm-driven `Matchmaking.tick()` loop. Superseded by
# `v5-drop-matchmaking-ticker` which removes that class; pass + sweep now run
# server-side under `pg_cron`.
[[migrations]]
tag = "v1-room-sqlite"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2-replace-room-with-space"
deleted_classes = ["Room"]
new_sqlite_classes = ["Space"]

[[migrations]]
tag = "v3-rename-space-do-class-to-room"
deleted_classes = ["Space"]
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v4-matchmaking-ticker"
new_sqlite_classes = ["MatchmakingTicker"]

[[migrations]]
tag = "v5-drop-matchmaking-ticker"
deleted_classes = ["MatchmakingTicker"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Production deploy (`wrangler deploy --env production`) serves the Expo web
# export from `apps/client/dist` and binds custom domains on the apex + www
# hostnames. `run_worker_first` invokes this Worker only for API paths; all
# other requests are served from the assets binding (SPA fallback).
#
# Without `name` here wrangler would publish as `gamezilla-production`.
# `durable_objects` / `migrations` are not inherited by named environments —
# duplicate them here so production deploy keeps ROOM bindings + DO migrations.
[env.production]
name = "gamezilla"
routes = [
  { pattern = "gamezilla.app", custom_domain = true },
  { pattern = "www.gamezilla.app", custom_domain = true },
]

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Production uses a single migration — the historical v1–v5 chain only exists at
# the top level for local `wrangler dev`. DO state is not preserved across deploys
# (see comments on `[[migrations]]` above).
[[env.production.migrations]]
tag = "v1-unified-worker-room"
new_sqlite_classes = ["Room"]

[env.production.assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
