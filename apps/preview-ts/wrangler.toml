# PR previews: one assets-only Worker whose Cloudflare Previews are the pull
# requests' environments (`wrangler preview --name pr-<number>`). A Preview is
# the web bundle and nothing else — no Worker script, no Durable Objects, no
# bindings, no secrets. The whole system (API fleet, Postgres, rooms, simulated
# vendors) runs in the visitor's browser.
#
# `{namespace}` resolves from the product identity when the preview scripts
# render this file. The Worker's own deployment is the main branch's build.
name = "{namespace}-preview"
compatibility_date = "2026-09-21"
workers_dev = false
preview_urls = true

# `preview.{domain}` serves the main branch and each pull request's Preview is
# `pr-<number>.preview.{domain}`: Cloudflare gives every Preview of a Worker a
# name under a custom domain that has Previews enabled.
[[routes]]
pattern = "preview.{domain}"
custom_domain = true
previews_enabled = true

# A Preview adds nothing to the Worker above: no vars, no bindings.
[previews]

# The built `apps/harness-ts`. No `not_found_handling`: the harness is the one
# page at `/` and keeps its state in the query string, so nothing needs a
# single-page fallback (Cloudflare applies none to an assets-only Preview).
[assets]
directory = "../harness-ts/dist"
