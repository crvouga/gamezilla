name = "gamezilla-api"
main = "src/server.ts"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

# RoomServerDurableObject lives on @apps/room-server (gamezilla-room). API binds cross-script.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"
script_name = "gamezilla-room"

[triggers]
crons = ["*/1 * * * *"]

[observability]
[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[env.production]
routes = [
  { pattern = "api.gamezilla.app", custom_domain = true },
]

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServerDurableObject"
script_name = "gamezilla-room-production"
