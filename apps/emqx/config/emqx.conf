## Node ##
node {
  name = "emqx@127.0.0.1"
  cookie = "gamezilla_emqx_local"
  data_dir = "data"
}

## Dashboard + HTTP API ##
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

## MQTT TCP ##
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

## MQTT WebSocket (/mqtt) ##
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

## Auth ##
authentication = [
  {
    mechanism = "password_based"
    backend = "built_in_database"
    enable = true
  }
]

authorization {
  no_match = "allow"
  deny_action = "ignore"
}

## API keys bootstrap file (key:secret per line) ##
api_key {
  bootstrap_file = "data/api-keys.bootstrap"
}
