<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <script>
    // The theme the app mounts with (`ThemePreferenceProvider`), set before
    // first paint so boot never flashes from one scheme to the other.
    (function () {
      var scheme;
      // The harness console keeps no stored preference: it follows the system.
      var harness = /^\/harness(\/|$)/.test(location.pathname);
      try {
        var stored = JSON.parse(localStorage.getItem('ui.prefs/color-scheme'));
        scheme = !harness && stored && stored['ui.prefs/value'];
      } catch (_) {}
      if (scheme !== 'light' && scheme !== 'dark') {
        scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', scheme);
    })();
  </script>
  <style>
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #000000;
      color: #E7E9EA;
      color-scheme: dark;
    }

    /* The script above sets `data-theme` before first paint; the tokens take
       over once their stylesheet loads. */
    html[data-theme="light"],
    html[data-theme="light"] body {
      background: var(--ui-color-background, #FFFFFF);
      color: var(--ui-color-text, #0D1216);
      color-scheme: light;
    }

    /* Mirrors the in-app BootLoadingShell (LoadingState size="large") so
       boot shows one loading state from first paint to ready. */
    .startup-shell {
      align-items: center;
      display: flex;
      flex-direction: column;
      font: 500 0.875rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      gap: 0.5rem;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .startup-shell-spinner {
      animation: startup-spin 900ms linear infinite;
      color: #1D9BF0;
      height: 48px;
      width: 48px;
    }


    .startup-shell-failed {
      gap: 0.75rem;
    }

    .startup-shell-mark {
      align-items: center;
      background: #16181C;
      border: 1px solid #F4212E;
      border-radius: 0.75rem;
      color: #F4646E;
      display: flex;
      font-size: 1.125rem;
      height: 3rem;
      justify-content: center;
      width: 3rem;
    }

    .startup-shell-guidance {
      color: #8B98A5;
    }

    .startup-shell-detail {
      color: #F4646E;
      max-width: min(40rem, calc(100vw - 2rem));
      overflow-wrap: anywhere;
      text-align: center;
    }

    .startup-shell-reload {
      background: #E7E9EA;
      border: 0;
      border-radius: 0.5rem;
      color: #000000;
      cursor: pointer;
      font: inherit;
      margin-top: 0.25rem;
      padding: 0.625rem 1rem;
    }

    html[data-theme="light"] .startup-shell-mark {
      background: #F6F8F8;
      border-color: #C81924;
      color: #C81924;
    }

    html[data-theme="light"] .startup-shell-guidance {
      color: #52606B;
    }

    html[data-theme="light"] .startup-shell-detail {
      color: #C81924;
    }

    html[data-theme="light"] .startup-shell-reload {
      background: #0D1216;
      color: #FFFFFF;
    }

    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes startup-pulse {
      50% {
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-shell-spinner {
        animation: startup-pulse 1600ms ease-in-out infinite;
      }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Gamezilla</title>
</head>

<body>
  <div id="root">
    <div class="startup-shell" role="status" aria-label="Loading Gamezilla" data-startup-shell>
      <svg class="startup-shell-spinner" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21.5" stroke="currentColor" stroke-width="5" fill="none" opacity="0.25" />
        <circle cx="24" cy="24" r="21.5" stroke="currentColor" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-dasharray="33.77 101.32" />
      </svg>
    </div>
  </div>
  <script type="module" src="./src/root.ts"></script>
</body>

</html>
