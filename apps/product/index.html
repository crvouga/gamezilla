<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101014" />
  <style>
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #101014;
      color: #f5f6f8;
      color-scheme: dark;
    }

    /* Mirrors the in-app BootLoadingShell (LoadingState size="large" +
       caption) so boot shows one loading state from first paint to ready. */
    .startup-shell {
      align-items: center;
      display: flex;
      flex-direction: column;
      font: 500 0.875rem/1.5 Nunito, ui-sans-serif, system-ui, sans-serif;
      gap: 0.5rem;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .startup-shell-spinner {
      animation: startup-spin 900ms linear infinite;
      color: hsl(213, 92%, 68%);
      height: 48px;
      width: 48px;
    }

    .startup-shell-caption {
      color: hsl(215, 6%, 70%);
      font-size: 12px;
      letter-spacing: 0.01em;
      line-height: 18px;
    }

    .startup-shell-failed {
      gap: 0.75rem;
    }

    .startup-shell-mark {
      align-items: center;
      background: #26262d;
      border: 1px solid #9b3d47;
      border-radius: 0.75rem;
      color: #ffb4bd;
      display: flex;
      font-size: 1.125rem;
      height: 3rem;
      justify-content: center;
      width: 3rem;
    }

    .startup-shell-guidance {
      color: #aaabb3;
    }

    .startup-shell-detail {
      color: #ffb4bd;
      max-width: min(40rem, calc(100vw - 2rem));
      overflow-wrap: anywhere;
      text-align: center;
    }

    .startup-shell-reload {
      background: #f5f6f8;
      border: 0;
      border-radius: 0.5rem;
      color: #101014;
      cursor: pointer;
      font: inherit;
      margin-top: 0.25rem;
      padding: 0.625rem 1rem;
    }

    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes startup-pulse {
      50% {
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-shell-spinner {
        animation: startup-pulse 1600ms ease-in-out infinite;
      }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Gamezilla</title>
</head>

<body>
  <div id="root">
    <div class="startup-shell" role="status" aria-label="Starting Gamezilla" data-startup-shell>
      <svg class="startup-shell-spinner" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21.5" stroke="currentColor" stroke-width="5" fill="none" opacity="0.25" />
        <circle cx="24" cy="24" r="21.5" stroke="currentColor" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-dasharray="33.77 101.32" />
      </svg>
      <span class="startup-shell-caption">Starting…</span>
    </div>
  </div>
  <script type="module" src="./src/root.ts"></script>
</body>

</html>
