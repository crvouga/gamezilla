name = "gamezilla-client"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

# Assets-only Worker: no `main` script → Cloudflare serves static files with
# zero Worker compute. SPA fallback rewrites unknown paths to index.html.
# Super-app: `/` = wall client, `/simulator` = Simulator.
# Env-agnostic: the deployed name comes from libs/infra (render-wrangler) and
# the apex / www hostnames from the OpenTofu edge stack.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
