name = "gamezilla-console"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

# Assets-only Worker: no `main` script → Cloudflare serves static files with
# zero Worker compute. SPA fallback rewrites unknown paths to index.html.
# No `name` under `[env.production]` → wrangler publishes as
# `gamezilla-console-production` (must match `PRODUCT_CONFIG.cloudflare.consoleWorker`).
[env.production]
routes = [
  { pattern = "console.gamezilla.app", custom_domain = true },
]

[env.production.assets]
directory = "./dist"
not_found_handling = "single-page-application"
