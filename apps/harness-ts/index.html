<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171823" />
  <meta name="color-scheme" content="dark" />

  <style>
    /* Boot paint, before any stylesheet or script: the design tokens'
       values written out (`tests/startup-shell.test.ts` holds every color to
       `design-tokens.json` and the indicator to `activityIndicatorSvg`). The
       tokens take over once their stylesheet loads. */
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      background-color: var(--ui-color-background, #171823);
      background-image: linear-gradient(180deg, var(--ui-color-surface, #222433), var(--ui-color-background, #171823));
      color: var(--ui-color-text, #f4f3fa);
      color-scheme: dark;
    }

    /* Mirrors the in-app BootLoadingShell (LoadingState size="lg"), so boot
       shows one loading state from first paint to ready. */
    .startup-shell {
      align-items: center;
      display: flex;
      flex-direction: column;
      font: 400 15px/22px var(--ui-font-sans, system-ui), sans-serif;
      gap: 8px;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .activity-indicator {
      animation: activity-step 1000ms steps(12, end) infinite;
      color: var(--ui-color-tint, #bda9ff);
    }

    .startup-shell-failed {
      gap: 12px;
    }

    .startup-shell-mark {
      align-items: center;
      background: var(--ui-color-destructive-surface, #f8717121);
      border-radius: 9999px;
      color: var(--ui-color-destructive, #f87171);
      display: flex;
      font-size: 20px;
      font-weight: 700;
      height: 48px;
      justify-content: center;
      width: 48px;
    }

    .startup-shell-guidance {
      color: var(--ui-color-text-secondary, #b7b7ca);
    }

    .startup-shell-detail {
      color: var(--ui-color-destructive, #f87171);
      max-width: min(640px, calc(100vw - 32px));
      overflow-wrap: anywhere;
      text-align: center;
    }

    .startup-shell-reload {
      background: var(--ui-color-tint-active, #9274f5);
      border: 0;
      border-radius: var(--ui-radius-control, 12px);
      color: var(--ui-color-on-primary, #181326);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      margin-top: 4px;
      min-height: 44px;
      padding: 0 16px;
    }



    @keyframes activity-step {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .activity-indicator {
        animation: none;
      }
    }
  </style>
  <title>%BRAND_NAME% harness</title>
</head>

<body>
  <div id="root">
    <div class="startup-shell" role="status" aria-label="Loading %BRAND_NAME% harness" data-startup-shell>
      <svg class="activity-indicator" width="40" height="40" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(0 50 50)" opacity="1"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(330 50 50)" opacity="0.936"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(300 50 50)" opacity="0.873"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(270 50 50)" opacity="0.809"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(240 50 50)" opacity="0.745"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(210 50 50)" opacity="0.682"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(180 50 50)" opacity="0.618"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(150 50 50)" opacity="0.555"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(120 50 50)" opacity="0.491"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(90 50 50)" opacity="0.427"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(60 50 50)" opacity="0.364"/><rect x="45.5" y="5" width="9" height="26" rx="4.5" transform="rotate(30 50 50)" opacity="0.3"/></svg>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
