app = "gamezilla-worker"
primary_region = "iad"

[build]
  dockerfile = "../../../Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[processes]
  worker = "bun run packages/app/src/worker.ts"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
