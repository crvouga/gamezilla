app = "gamezilla-emqx"
primary_region = "iad"

[build]
  dockerfile = "../emqx-image/Dockerfile"

[env]
  EMQX_NODE_NAME = "emqx@gamezilla-emqx.internal"

[mounts]
  source = "emqx_data"
  destination = "/opt/emqx/data"

[[services]]
  internal_port = 1883
  protocol = "tcp"

  [[services.ports]]
    port = 1883

[[services]]
  internal_port = 8083
  protocol = "tcp"

  [[services.ports]]
    port = 8083

[[services]]
  internal_port = 18083
  protocol = "tcp"

  [[services.ports]]
    port = 18083

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
