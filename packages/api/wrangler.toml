name = "gamezilla-api"
main = "src/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = false
preview_urls = false

routes = [{ pattern = "api.gamezilla.app", custom_domain = true }]

[durable_objects]
bindings = []

[[migrations]]
tag = "v1"
new_classes = ["PubSubDurableObject"]

[[migrations]]
tag = "v2"
deleted_classes = ["PubSubDurableObject"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
