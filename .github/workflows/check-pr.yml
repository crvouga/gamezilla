name: Check PR
run-name: "Check PR · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || 'manual' }}"

# Check PR is the merge gate (README "Checks and CI"): every package gate —
# lint, architecture boundaries, typecheck, unit tests, Gherkin specs, contract
# suites, Quint models, schema evolution, bundles, security scans.
#
# Three jobs. `check:start` plans the shards, `check:shards (N)` run them with
# fail-fast off, and `check:end` has the ending word: one verdict that names
# every failure. The jobs keep the `check:` prefix wherever the gate runs, so
# `check:end` is the one required status and its name never moves.
#
# Only uncached work starts a runner. `check:start` asks the remote cache about
# every task, packs the misses into as many shards as their measured durations
# need, and records the cached verdicts itself. A fully cached run is the start
# and the end, with no shard at all.
#
# It runs on every pull request, where `check:end` is the required status:
# a green pull request is releasable, and merging it deploys. It also runs from
# a manual dispatch, from Deploy (`workflow_call`) on the exact commit it
# ships, and from Check Nightly at the nightly profile's depth. `bun check-pr`
# runs the same gate locally.
#
# The `pr` profile (`libs/tools/scripts/check-profile.ts`) is bounded and never
# explores: each Quint model replays the fewest drawn traces that take every
# bound action, the same ones every run. It keeps no test report: no JUnit
# file, no trace, snapshot or coverage upload, no publication. A failure is
# read from the job log and the run summary. The artifacts below carry the
# plan, the shard verdicts and build outputs from one job to the next, and
# `check:end` deletes them. Every report step is the `nightly` profile's.

permissions:
  contents: read
  actions: write
  id-token: write
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      shards:
        description: Most shards a run may start
        type: choice
        options: [8, 12, 16, 24, 32, 40, 48, 64]
        default: 64
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold (cold forces execution without deleting remote caches)
        type: choice
        options: [normal, cold]
        default: normal
  workflow_call:
    inputs:
      shards:
        description: Most shards a run may start
        type: number
        default: 64
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold
        type: string
        default: normal
      profile:
        description: pr (the merge gate) or nightly (deeper budgets, reports kept)
        type: string
        default: pr

# A newer push supersedes a pull request's run; dispatched and release runs
# each own a group and never cancel one another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  TURBO_UI: stream
  TURBO_CACHE_DIR: .turbo/cache
  RAYON_NUM_THREADS: 1
  CHECK_LINT_THREADS: 1
  CHECK_TEST_CONCURRENCY: 1
  GOMAXPROCS: 1
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
  JVM_GC_ARGS: -XX:+UseParallelGC -Xmx2048m -Xms512m
  MODEL_CHECK_CONCURRENCY: 2
  CHECK_SOLVER_SLOTS: 1
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
  GH_EVENT: ${{ github.event_name }}
  PR_BASE: ${{ github.event.pull_request.base.sha }}
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  # Forty runners left a cold corpus — every cache missed — packed past the
  # 1200s shard deadline once each solver had a runner of its own
  # (Check run 38328597240). Sixty-four keeps that pack inside the deadline.
  CHECK_SHARDS: ${{ inputs.shards || vars.CHECK_SHARDS || '64' }}
  CHECK_CONCURRENCY: ${{ inputs.concurrency || vars.CHECK_CONCURRENCY || '1' }}
  CHECK_CACHE_MODE: ${{ inputs.cache-mode || 'normal' }}
  CHECK_PROFILE: ${{ inputs.profile || 'pr' }}

jobs:
  check-start:
    name: check:start
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'nightly' && 70 || 30 }}
    # One entry per shard with work, naming none of them: GitHub drops a job
    # output that contains a masked secret, and one dev secret is the digit 1.
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: bun opentofu
      # The plan fingerprints the renderer; browser shards must match it.
      # Chrome normally installs in well under a minute. Two minutes is the
      # hard cap so a hung download cannot spend the shard's budget.
      - uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # Shards are packed by the durations the newest run of this profile
      # measured on these runners (`check:end` saves them); the key never
      # matches, so the prefix restores the newest from this pull request,
      # else from main.
      - name: Restore measured task durations
        uses: actions/cache/restore@v5
        with:
          path: .cache/check-ci/measured-costs.json
          key: check-task-costs-v1-${{ inputs.profile == 'nightly' && 'nightly' || 'gate' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-task-costs-v1-${{ inputs.profile == 'nightly' && 'nightly' || 'gate' }}-
      - name: Plan all owners once
        id: plan
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/tools/scripts/check-plan.ts
      - name: Export immutable plan
        run: bun run libs/tools/scripts/check-plan-transfer.ts --export
      # Transfer artifacts carry state between this run's jobs and are not
      # reports: `check:end` deletes them, and one day bounds a cancelled run.
      # The nightly profile keeps them, failed reports included.
      - name: Upload immutable plan
        uses: actions/upload-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci/plan.payload
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}
      # A shard with nothing to execute starts no runner; its cached verdicts
      # travel from here to `check:end`.
      - name: Transfer cached shard verdicts
        uses: actions/upload-artifact@v6
        with:
          name: check-results-cached
          path: .cache/check-ci/cached/results-*.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}
      - name: Transfer cached shard evidence
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-cached
          path: .cache/check-ci/cached/evidence-*.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}
      # A failed build is recorded in this shard's verdict, which `check:end`
      # reports; the shards still run so one red build does not hide every
      # other failure.
      - name: Build shared prerequisites and warm their cache
        continue-on-error: true
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-shard-run.ts "$CHECK_SHARDS"
      - name: Transfer prerequisite outputs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-${{ env.CHECK_SHARDS }}
          path: .cache/check-ci/evidence-${{ env.CHECK_SHARDS }}.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}

      - name: Transfer prerequisite verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-results-${{ env.CHECK_SHARDS }}
          path: .cache/check-ci/results-${{ env.CHECK_SHARDS }}.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}

  # Shard N is the Nth entry of the matrix `check:start` planned.
  check-shards:
    name: check:shards (${{ strategy.job-index }})
    needs: [check-start]
    # An empty matrix is an error, so a fully cached plan skips the job.
    if: needs.check-start.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'nightly' && 70 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.check-start.outputs.shards) }}
    env:
      CHECK_SHARD: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: --include-lazy
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci
      - name: Restore immutable plan and required prerequisites
        run: bun run libs/tools/scripts/check-stage-transfer.ts
      - name: Select browser tasks
        id: browser
        run: bun run libs/tools/scripts/check-browser-tasks.ts
      - name: Install renderer for browser tasks
        if: steps.browser.outputs.needed == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/visual-renderer
      - name: check
        timeout-minutes: ${{ inputs.profile == 'nightly' && 60 || 25 }}
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-shard-run.ts "$CHECK_SHARD"
      # Reports are the nightly profile's; the `pr` profile keeps none.
      - name: Upload queryable trace artifacts
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            apps/*/.cache/harness-report/*/traces/*.ndjson
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload turbo run summary
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}-${{ strategy.job-index }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      # Transfer verdicts and the exact cache artifacts consumers need; the
      # nightly profile adds failed reports.
      - name: Transfer raw evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-${{ strategy.job-index }}
          path: .cache/check-ci/evidence-${{ strategy.job-index }}.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}

      - name: Transfer shard verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-results-${{ strategy.job-index }}
          path: .cache/check-ci/results-${{ strategy.job-index }}.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}

  # The ending word, and the only required status on a pull request; Deploy
  # consumes this verdict. It runs after red shards too: the fan-in suites
  # report their own failures, then one verdict names every suite and every
  # failing task. A missing, failed or cancelled job fails it; skipped shards
  # pass only when the plan scheduled none. The nightly profile's reports are
  # published last and never decide it.
  check-end:
    name: check:end
    needs: [check-start, check-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'nightly' && 110 || 50 }}
    steps:
      # The reports are filed under the pull request's head, whose specs are
      # read from Git; the default checkout holds only the merge commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci
      # Does nothing when the plan left the fan-in stage nothing to execute.
      - name: Run fan-in consumers
        timeout-minutes: ${{ inputs.profile == 'nightly' && 60 || 25 }}
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-consumers.ts
      - name: Upload queryable trace artifacts
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}-consumers
          path: |
            apps/*/.cache/harness-report/*/traces/*.ndjson
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload turbo run summary
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}-consumers
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Transfer raw evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-consumers
          path: .cache/check-ci/evidence-*.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ inputs.profile == 'nightly' && 14 || 1 }}
      # Only the small verdicts: the evidence is gigabytes of snapshots.
      - name: Transfer shard verdicts
        if: always() && !cancelled()
        run: bun run libs/tools/scripts/check-artifact-download.ts check-results- .cache/check-ci/transfers verdict || echo "::warning::No shard verdicts to aggregate"
      - name: Summarize every suite
        if: always() && !cancelled()
        env:
          START_RESULT: ${{ needs.check-start.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        run: bun run libs/tools/scripts/check-verdict.ts
      # A red run still measured every task that passed.
      - name: Save measured task durations
        if: always() && !cancelled() && hashFiles('.cache/check-ci/measured-costs.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/check-ci/measured-costs.json
          key: check-task-costs-v1-${{ inputs.profile == 'nightly' && 'nightly' || 'gate' }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Everything below is the nightly profile's reporting. The `pr` profile
      # ends by deleting the artifacts that carried state between its jobs.
      - name: Retain the verdict
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: check-verdict
          path: |
            .cache/check-ci/verdict.json
            .cache/check-ci/verdict.md
            .cache/check-ci/verdict.junit.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
      # Publication never changes the verdict above. Health's `health:cleanup`
      # prunes stale reports.
      - name: Aggregate and publish bounded evidence
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        continue-on-error: true
        timeout-minutes: 40
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/tools/scripts/check-reports.ts
      - name: Retain sanitized planning and timing details
        if: always() && !cancelled() && env.CHECK_PROFILE == 'nightly'
        uses: actions/upload-artifact@v6
        with:
          name: check-ci-details
          path: |
            .cache/check-ci/plan.json
            .cache/check-ci/planning.json
            .cache/check-ci/profile.json
            .cache/check-ci/results/*.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Delete transfer artifacts
        if: always() && !cancelled() && env.CHECK_PROFILE != 'nightly'
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("check-")) | .id' |
            while read -r id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
