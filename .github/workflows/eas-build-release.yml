# https://github.com/crvouga/gamezilla/actions/workflows/eas-build-release.yml
#
# Manual native mobile build + store release. Routine pushes to `main` only
# publish an OTA `eas update` (the `publish-client-eas-update` phase inside
# `infra deploy`); native deps rarely change, so a full native binary +
# App Store / Play Store submission is a rare, deliberate action gated behind
# `workflow_dispatch`.
#
# Runs `infra build-client-native`, which fires a single
# `eas build --platform all --profile <profile>` (parallel iOS + Android on
# EAS workers) and appends `--auto-submit` for `production` (uses the
# `production` submit profile in `apps/client/eas.json`). The job WAITS for
# the cloud builds so a failed build / submission surfaces here.
#
# Prerequisite: production iOS/Android store credentials must be configured on
# EAS for `--auto-submit` to succeed in `--non-interactive` mode.
name: EAS Build + Release (manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile / channel to build
        required: true
        type: choice
        default: production
        options:
          - production
          - development

jobs:
  eas-build-release:
    runs-on: ubuntu-latest
    # One native release at a time; never cancel an in-flight build (cloud
    # builds + store submissions are expensive and non-idempotent).
    concurrency:
      group: eas-build-release
      cancel-in-progress: false
    # Waits for parallel iOS + Android builds and (production) store
    # submission, which can take well over an hour combined.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          eas: 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
      - name: Build native binaries + submit to stores
        working-directory: libs/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          EAS_PROFILE: ${{ inputs.profile }}
        run: bun run infra build-client-native
