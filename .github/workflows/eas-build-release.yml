# Manual native mobile build + store release.
name: EAS Build + Release (manual)

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile / channel to build
        required: true
        type: choice
        default: production
        options:
          - production
          - development

jobs:
  eas-build-release:
    runs-on: ubuntu-latest
    concurrency:
      group: eas-build-release
      cancel-in-progress: false
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - name: Install CLI tools
        run: bun run --filter @tools install:cli
      - name: Build native binaries + submit to stores
        env:
          SECRETS_ENV: prd
          EAS_PROFILE: ${{ inputs.profile }}
        run: bun run --filter @apps/client deploy:native
