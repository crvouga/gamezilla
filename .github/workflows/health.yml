name: Health

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Health · ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"

# Health: is the deployment good? `bun health` dispatches this workflow.
# Each job runs `bun run health:local` (`@apps/product-ts#health`, turbo
# `health` with `--only`, so nothing is deployed):
# every Gherkin scenario in specs/health/ and specs/journeys/ against
# the resources a secrets env points at — Postgres, R2, EMQX, Grafana Cloud,
# vendor credentials, the Workers, DNS and TLS — plus the critical user
# journeys, driven in a real browser (the runner's preinstalled Chrome)
# against the production web client. The Release workflow runs the same
# probes as its last step (`//#deploy` → `health`); this schedule catches drift in
# between (expired tokens, revoked keys, a dead Railway service).
#
# One job per environment in libs/infra-shared-ts/tofu/envs/<env>.tfvars.json
# (health:matrix reads them — libs/infra-shared-ts/scripts/workflow-env-matrix.ts — from
# a job with no secrets); adding an env file needs no edit here. On `main`, envs
# with `protection: "production"` run in the GitHub `production` environment and
# keep their critical-journey evidence on failure. Scenarios only production
# can run (`HOST_LIMITS` in apps/product-ts/scripts/health.ts) skip elsewhere.
#
# Every health run records each live feature's verdict as one sample of
# synthetic.check.result in Grafana Cloud (apps/product-ts/scripts/health.ts),
# so the team's checks are objectives' evidence wherever they run.
#
# On main, health:objectives checks each environment's service level objectives
# (the `# live` files in specs/, `health:objectives` in @apps/product-ts): that the
# team's checks (these runs and Grafana Synthetic Monitoring's every minute) find
# the app answering, and that the requests people really make succeed and are
# answered quickly, all read from Grafana Cloud's Prometheus API with the
# environment's read secrets. Each objective is judged over its last
# 7 days and by its burn-rate alert policies; a policy that fires fails this
# job with the owner, runbook and `bun obs` command in the log, which is how an
# alert reaches people while no Grafana instance is active
# (libs/observability-shared-ts/README.md, "Service level objectives"). Objectives
# never run inside `health`, which gates every deploy: a bad month must not
# block a fix. Branch Health runs verify current probes without attaching that
# historical deficit to the fix's PR. Scheduled and manual main runs retain the
# objective.

# Least privilege: read the code and run metadata. Jobs that read secrets or
# AWS add the OIDC token they trust.
permissions:
  contents: read # check out the code
  actions: read # read run state (gh run list, job metadata)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: Optional live feature path to investigate (empty runs every feature)
        type: string
        default: ''

env:
  TURBO_UI: stream

concurrency:
  group: health
  cancel-in-progress: false

# Every job runs on a GitHub-hosted `ubuntu-24.04` runner, and every `run:` step is bash.
defaults:
  run:
    shell: bash

jobs:
  health-repository-policy:
    name: health:repository-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read # check out the reviewed repository configuration
      id-token: write # read administration and encrypted-state credentials through OIDC
    concurrency:
      group: repository-policy
      cancel-in-progress: false
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Assert administration credential was injected from the secret store
        run: |
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo "::error::Add GITHUB_ADMIN_TOKEN to the shared secret-store environment. CI needs repository administration access; the built-in workflow token cannot configure repository protections."
            exit 1
          fi
      - name: Detect repository configuration drift through OpenTofu
        run: bunx turbo run @libs/infra-server-ts#drift:repository-policy

  health-cleanup:
    name: health:cleanup
    needs: health-matrix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # delete stale report branches
      pull-requests: read # keep branches that have an open pull request
      id-token: write # mint the OIDC token Infisical and AWS trust
    concurrency:
      group: reports-cleanup
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - env: ${{ fromJSON(needs.health-matrix.outputs.all)[0] }}
    environment: ${{ github.ref == 'refs/heads/main' && contains(fromJSON(needs.health-matrix.outputs.production), matrix.env) && 'production' || '' }}
    env:
      SECRETS_ENV: ${{ matrix.env }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: bun gh
          secrets-environment: ${{ matrix.env }}
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Remove unused branches and stale reports
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/harness-ts/scripts/report-cleanup.ts --apply --branches

  health-matrix:
    name: health:matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      production: ${{ steps.envs.outputs.production }}
      all: ${{ steps.envs.outputs.all }}
      idle: ${{ steps.deploying.outputs.idle }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: envs
        id: envs
        run: bun run libs/infra-shared-ts/scripts/workflow-env-matrix.ts >> "$GITHUB_OUTPUT"

      # Release and Health run the same journeys, as the same synthetic
      # accounts, against the same environment, and both plan the same
      # OpenTofu state. Run together they take each other's matches and
      # state lock, and a deploy fails for what the other was doing. A
      # scheduled check yields to a deploy under way; the next one runs.
      # Release waits out a check that is already running (deploy.yml).
      - name: deploying
        id: deploying
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$GH_EVENT" = "schedule" ] && [ "$active" != "0" ]; then
            echo "A deploy is under way ($active run(s)); this scheduled check yields to it." >> "$GITHUB_STEP_SUMMARY"
            echo "idle=false" >> "$GITHUB_OUTPUT"
          else
            echo "idle=true" >> "$GITHUB_OUTPUT"
          fi

  health-env:
    name: health:${{ matrix.env }}
    needs: health-matrix
    if: needs.health-matrix.outputs.all != '[]' && needs.health-matrix.outputs.idle == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 30
    # No GitHub environment ('') for a standard env. Only `main` may enter the
    # `production` environment (its deployment branch policy), so a branch run
    # checks a production env without it: the read-only Health role trusts a
    # branch, and the deploy role trusts only `production` and `main`.
    environment: ${{ github.ref == 'refs/heads/main' && contains(fromJSON(needs.health-matrix.outputs.production), matrix.env) && 'production' || '' }}
    strategy:
      # One unhealthy environment should not cancel (and hide) another's probes.
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.health-matrix.outputs.all) }}
    env:
      HEALTH_SPEC: ${{ inputs.spec || '' }}
      SECRETS_ENV: ${{ matrix.env }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      # Health refreshes the declared AWS resources but must never mutate them.
      AWS_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup
        with:
          secrets-environment: ${{ matrix.env }}
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}


      - name: health:${{ matrix.env }}
        # Above `CI_RUN_DEADLINE_SECONDS` (libs/tools-harness-ts/scripts/verify-budget.ts)
        # on purpose: turbo-ci-run hits its own deadline first and names the
        # probe that hung, instead of GitHub cancelling the job silently.
        timeout-minutes: 25
        run: bun run health:local

      # Critical journeys (specs/journeys/, apps/product-ts/tests/steps/live-world.ts)
      # save a screenshot, the page HTML and the browser console per failure.
      - name: Upload critical journey evidence
        if: failure()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload critical-journeys-"${GITHUB_RUN_ID}-${SECRETS_ENV}"
          apps/product-ts/.cache/critical-journeys

  # One job for every env, not a matrix. Runs after the checks (whatever
  # their result) so this run's checks count too.
  health-objectives:
    name: health:objectives
    needs: [health-matrix, health-env]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.health-matrix.outputs.all != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
    env:
      ENVS: ${{ needs.health-matrix.outputs.all }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Every env is checked even when one misses its objectives.
      - name: health:objectives
        run: |
          status=0
          for env in $(bun -p 'JSON.parse(process.env.ENVS).join("\n")'); do
            SECRETS_ENV="$env" bun run --filter @apps/product-ts health:objectives || status=1
          done
          exit "$status"
