# https://github.com/crvouga/gamezilla/actions/workflows/seed-chess-puzzles.yml
#
# Manual workflow that runs `libs/chess/scripts/seed-chess-puzzles.ts`
# against the Doppler `prd` config (Postgres `DB_URL`). Idempotent:
# content-addressed patch IDs + `INSERT … ON CONFLICT DO NOTHING` skip
# unchanged rows, and the script resumes from the saved cursor when the
# source ETag is unchanged.
#
# The seed itself does not run schema migrations (that would couple
# `@libs/chess` to `@libs/auth` / Better Auth and create a
# workspace-level dependency cycle). We run `@apps/api db:migrate`
# as a separate step first so the `patches` / `snapshots` tables and the
# `pdb_idx_chess_puzzle__*` declarative indexes exist before the seed
# starts pumping rows in.
#
# The seed uses a fast-path that writes `patches` + `snapshots` in one
# transaction (no per-batch CTE re-read, no snapshot UPDATE). Default knobs
# (`batch_size=1000`, `pace_ms=250`, `checkpoint_every=25`,
# `progress_every=10`) keep WAL pressure low enough to fit comfortably in
# the PlanetScale free-tier 10 GB cap, at the cost of taking longer than a
# full-throttle seed.
#
# Connection budget: the seed opens **exactly one** TCP session (`pg.Client`,
# not `pg.Pool`) so it never trips PlanetScale's "high connections on
# primary" warning. Sessions are sequential — one batch transaction at a
# time with serial CHECKPOINT / VACUUM / progress writes between batches —
# so a pool would only add idle connections without any throughput gain.
#
# All production credentials come from Doppler — the only repository secret
# this workflow needs is `DOPPLER_SERVICE_TOKEN`. `doppler run -- …` injects
# `DB_URL` (and any other prod secrets) into each step's process env.
name: Seed chess puzzles (prod)

permissions:
  contents: read

# `DOPPLER_SERVICE_TOKEN` is a project token — not config-scoped. Use
# `scripts/doppler-run.ts` (defaults from `doppler.yaml`) with
# `DOPPLER_CONFIG=prd` for prod steps.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional max number of puzzle rows to process (blank = no limit, full dataset)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Parse the CSV but skip all database writes'
        required: false
        default: false
        type: boolean
      no_resume:
        description: 'Ignore the saved cursor and reseed from the start of the source'
        required: false
        default: false
        type: boolean
      batch_size:
        description: 'Rows per fast-path INSERT transaction (default 1000). Smaller = less WAL per commit.'
        required: false
        default: '1000'
        type: string
      pace_ms:
        description: 'Sleep (ms) after each batch flush so autovacuum / WAL writer keep up (default 250).'
        required: false
        default: '250'
        type: string
      checkpoint_every:
        description: 'Issue CHECKPOINT + lightweight VACUUM ANALYZE every N batches (default 25, set 0 to disable).'
        required: false
        default: '25'
        type: string
      progress_every:
        description: 'Persist the resume cursor every N batches instead of every batch (default 10).'
        required: false
        default: '10'
        type: string
      rebuild_indexes:
        description: 'After the seed completes, REINDEX `pdb_idx_chess_puzzle__*` concurrently to reclaim index bloat.'
        required: false
        default: false
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    # Serialize prod seeds. `cancel-in-progress: false` so a queued manual run
    # never preempts an in-flight seed mid-batch (the script is resumable, but
    # interrupting wastes the partially-streamed CSV).
    concurrency:
      group: seed-chess-puzzles-prod
      cancel-in-progress: false
    # Throttled seed (small batches + per-batch sleep + periodic CHECKPOINT)
    # is significantly slower than the legacy 5k-batch path. 600 minutes is a
    # generous ceiling for a full ~2.65M-row pass; resume-from-cursor will
    # pick up where a previous run left off if we still hit the cap.
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Cache the downloaded `.csv.zst` archive between runs. The script
      # writes to `libs/chess/.cache/lichess/<name>` and stores an
      # ETag manifest alongside it; the cache key uses the workflow file hash
      # so a manual rerun on the same SHA reuses the archive, and a new push
      # that bumps this workflow forces a fresh fetch (cheap relative to a
      # full seed).
      - name: Cache Lichess puzzle archive
        uses: actions/cache@v5
        with:
          path: libs/chess/.cache/lichess
          key: lichess-puzzles-${{ runner.os }}-${{ hashFiles('.github/workflows/seed-chess-puzzles.yml') }}
          restore-keys: |
            lichess-puzzles-${{ runner.os }}-

      - name: Apply Postgres migrations → Doppler `prd`
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          # `db:migrate` runs the canonical patch-db + KV + Better Auth
          # migration set against the `prd` Postgres. Idempotent: existing
          # tables and `pdb_idx_*` indexes are left in place.
          DOPPLER_CONFIG=prd bun run scripts/doppler-run.ts -- \
            bun run --filter '@apps/api' db:migrate

      - name: Seed chess puzzles → Doppler `prd` Postgres
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          SEED_LIMIT: ${{ inputs.limit }}
          SEED_DRY_RUN: ${{ inputs.dry_run }}
          SEED_NO_RESUME: ${{ inputs.no_resume }}
          SEED_BATCH_SIZE: ${{ inputs.batch_size }}
          SEED_PACE_MS: ${{ inputs.pace_ms }}
          SEED_CHECKPOINT_EVERY: ${{ inputs.checkpoint_every }}
          SEED_PROGRESS_EVERY: ${{ inputs.progress_every }}
          SEED_REBUILD_INDEXES: ${{ inputs.rebuild_indexes }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SEED_LIMIT}" ]; then
            args+=(--limit "${SEED_LIMIT}")
          fi
          if [ "${SEED_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${SEED_NO_RESUME}" = "true" ]; then
            args+=(--no-resume)
          fi
          if [ -n "${SEED_BATCH_SIZE}" ]; then
            args+=(--batch-size "${SEED_BATCH_SIZE}")
          fi
          if [ -n "${SEED_PACE_MS}" ]; then
            args+=(--pace-ms "${SEED_PACE_MS}")
          fi
          if [ -n "${SEED_CHECKPOINT_EVERY}" ]; then
            args+=(--checkpoint-every "${SEED_CHECKPOINT_EVERY}")
          fi
          if [ -n "${SEED_PROGRESS_EVERY}" ]; then
            args+=(--progress-every "${SEED_PROGRESS_EVERY}")
          fi
          if [ "${SEED_REBUILD_INDEXES}" = "true" ]; then
            args+=(--rebuild-indexes)
          fi
          # `--no-pretty` for clean GH Actions log lines (no ANSI carriage
          # returns). `doppler run` injects `DB_URL` from the `prd` config so
          # the script's `createDopplerSecretStoreForScripts()` can also read
          # any additional secrets it needs.
          DOPPLER_CONFIG=prd bun run scripts/doppler-run.ts -- \
            bun run --filter '@libs/chess' seed:puzzles \
              --no-pretty \
              "${args[@]}"
