# https://github.com/crvouga/gamezilla/actions/workflows/seed-chess-puzzles.yml
#
# Manual workflow that runs `libs/chess/scripts/seed-chess-puzzles.ts`
# against the selected secrets env (`dev` or `prd` Postgres `DATABASE_URL`).
# Idempotent: content-addressed patch IDs + `INSERT … ON CONFLICT DO NOTHING`
# skip unchanged rows, and the script resumes from the saved cursor when the
# source ETag is unchanged.
#
# The seed itself does not run schema migrations (that would couple
# `@libs/chess` to `@libs/auth` / legacy auth and create a
# workspace-level dependency cycle). We run `@apps/api db:migrate`
# as a separate step first so the `patches` / `snapshots` tables and the
# `pdb_idx_chess_puzzle__*` declarative indexes exist before the seed
# starts pumping rows in.
#
# Production (`environment: prod` → secrets env `prd`) Postgres is Neon. The free
# tier's 512 MB project cap cannot hold the full ~2.65M-row Lichess dataset
# once patches, snapshots, and btree indexes land — upgrade Neon storage
# before expecting a complete prod seed. The script is resumable: a failed
# run picks up from the saved cursor after you scale the project.
#
# Tuning is automatic: the seed picks a `fast` or `managed` profile from a
# CHECKPOINT probe (Neon denies CHECKPOINT). With `--defer-indexes` (default)
# secondary btrees are dropped only when streaming will run, then recreated by
# post-seed `db:migrate`. Already-complete datasets skip the drop entirely.
#
# Connection budget: the seed opens **exactly one** TCP session (`pg.Client`,
# not `pg.Pool`) so it never trips Neon's connection warnings.
#
# All credentials come from the secret store via OIDC. `secrets-run -- …` injects
# `DATABASE_URL` (and any other secrets) into each step's process env.
name: Seed chess puzzles

permissions:
  contents: read
  id-token: write

# CI authenticates via GitHub Actions OIDC. Use `scripts/secrets-run.ts`
# (defaults from `.infisical.json`) with `SECRETS_ENV` set from the dispatch
# `environment` input (`dev` or `prod` → `prd`).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target database (secrets env dev or prd)'
        required: true
        type: choice
        options:
          - dev
          - prod
      limit:
        description: 'Optional max number of puzzle rows to process (blank = no limit, full dataset)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Parse the CSV but skip all database writes'
        required: false
        default: false
        type: boolean
      no_resume:
        description: 'Ignore the saved cursor and reseed from the start of the source'
        required: false
        default: false
        type: boolean
      defer_indexes:
        description: 'Drop chess-puzzle snapshot secondary indexes before streaming; post-seed migrate recreates them.'
        required: false
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      SECRETS_ENV: ${{ inputs.environment == 'prod' && 'prd' || 'dev' }}
    # Serialize seeds per environment. `cancel-in-progress: false` so a queued
    # manual run never preempts an in-flight seed mid-batch (the script is
    # resumable, but interrupting wastes the partially-streamed CSV).
    concurrency:
      group: seed-chess-puzzles-${{ inputs.environment }}
      cancel-in-progress: false
    # Full ~2.65M-row pass at profile batch sizes is still multi-hour; resume
    # from cursor picks up where a previous run left off if we hit the cap.
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ inputs.environment == 'prod' && 'prd' || 'dev' }}

      # Cache the downloaded `.csv.zst` archive between runs. The script
      # writes to `libs/chess/.cache/lichess/<name>` and stores an
      # ETag manifest alongside it; the cache key uses the workflow file hash
      # so a manual rerun on the same SHA reuses the archive, and a new push
      # that bumps this workflow forces a fresh fetch (cheap relative to a
      # full seed).
      - name: Cache Lichess puzzle archive
        uses: actions/cache@v5
        with:
          path: libs/chess/.cache/lichess
          key: lichess-puzzles-${{ runner.os }}-${{ hashFiles('.github/workflows/seed-chess-puzzles.yml') }}
          restore-keys: |
            lichess-puzzles-${{ runner.os }}-

      - name: Apply Postgres migrations → Infisical `${{ env.SECRETS_ENV }}`
        run: |
          set -euo pipefail
          bun run scripts/secrets-run.ts -- \
            bun run --filter '@apps/api' db:migrate

      - name: Seed chess puzzles → Infisical `${{ env.SECRETS_ENV }}` Postgres
        env:
          SEED_LIMIT: ${{ inputs.limit }}
          SEED_DRY_RUN: ${{ inputs.dry_run }}
          SEED_NO_RESUME: ${{ inputs.no_resume }}
          SEED_DEFER_INDEXES: ${{ inputs.defer_indexes }}
        run: |
          set -euo pipefail
          args=(--no-pretty)
          if [ "${SEED_DEFER_INDEXES}" = "true" ]; then
            args+=(--defer-indexes)
          else
            args+=(--no-defer-indexes)
          fi
          if [ -n "${SEED_LIMIT}" ]; then
            args+=(--limit "${SEED_LIMIT}")
          fi
          if [ "${SEED_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${SEED_NO_RESUME}" = "true" ]; then
            args+=(--no-resume)
          fi
          bun run scripts/secrets-run.ts -- \
            bun run --filter '@libs/chess' seed:puzzles \
              "${args[@]}"

      - name: Recreate chess puzzle indexes → Infisical `${{ env.SECRETS_ENV }}`
        if: ${{ inputs.defer_indexes && !inputs.dry_run }}
        run: |
          set -euo pipefail
          bun run scripts/secrets-run.ts -- \
            bun run --filter '@apps/api' db:migrate
