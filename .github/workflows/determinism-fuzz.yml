# Nightly fuzz: many random seeds for *.sim.test.ts
name: Determinism Fuzz

permissions:
  contents: read

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      seed_count:
        description: Number of random seeds to try
        required: false
        default: '32'

env:
  TURBO_UI: stream

jobs:
  sim-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Fuzz *.sim.test.ts across seeds
        run: bun run --filter @sim/test test:fuzz -- --seed-count ${{ github.event.inputs.seed_count || '32' }}
