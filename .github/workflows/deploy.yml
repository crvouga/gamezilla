name: Deploy

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Deploy · ${{ github.event_name == 'push' && 'push' || 'manual' }}"

# Every merge to `main` ships, in order:
#
#   deploy:guard    refuse anything that is not `main`
#   deploy:check    the full Check PR gate on this exact commit
#   deploy:fleet    secrets shared by every environment, the auth relay, the fleet stack
#   deploy:dev      migrate, ship the Workers, run the health probes
#   deploy:prd      the same, in production, only once dev is green
#   deploy:release  tag the commit and publish a GitHub release
#
# `bun deploy` (or "Run workflow" on `main`) does the same by hand. Running it
# with `rehearsal` on a branch runs deploy:check, then only plans dev's
# foundation (deploy:rehearsal) and ships nothing. Every environment file
# (libs/infra-shared/tofu/envs/<env>.tfvars.json) needs its own job below; a
# test fails until it has one.

permissions:
  contents: read
  actions: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Check this branch and plan dev's foundation, without applying or deploying
        type: boolean
        required: false
        default: false

env:
  TURBO_UI: stream

# One deploy at a time: each environment is a shared singleton.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-guard:
    name: deploy:guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A manual run on another ref must not ship. A direct push to main does.
      - name: Ship only main
        if: ${{ !inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy ships refs/heads/main only (got ${GITHUB_REF})."
            exit 1
          fi

  # The same gate a pull request merges on. Nothing below starts unless it is
  # green, and its cached results are what the environment jobs restore.
  deploy-check:
    name: deploy:check
    needs: deploy-guard
    uses: ./.github/workflows/check-pr.yml

  deploy-rehearsal:
    name: deploy:rehearsal
    if: ${{ inputs.rehearsal }}
    needs: deploy-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Plan dev's foundation without changing infrastructure
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @libs/infra-server plan:foundation

  # What every environment shares (libs/infra-shared/tofu/stacks/fleet): the
  # shared secrets, the auth relay that forwards to every env, and each env's
  # secrets environment. It runs before any environment deploys.
  deploy-fleet:
    name: deploy:fleet
    if: ${{ !inputs.rehearsal }}
    needs: deploy-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: shared
      # The fleet apply reads its state passphrase from shared.
      - name: Promote shared secrets
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/secrets-server/scripts/secrets-reconcile-shared.ts promote
      # The fleet stack binds the relay's hostname, so its Worker must exist.
      - name: Deploy the auth relay
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @apps/auth-relay deploy
      - name: Apply the fleet stack
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @libs/infra-server apply:fleet
      # Every env now imports shared: drop the copies that shadow it.
      - name: Prune secrets that shadow shared ones
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/secrets-server/scripts/secrets-reconcile-shared.ts prune

  deploy-dev:
    name: deploy:dev
    needs: deploy-fleet
    runs-on: ubuntu-24.04
    # Above `DEPLOY_RUN_DEADLINE_SECONDS` (45 min) plus setup, so
    # turbo-ci-run's own deadline fires first and names what wedged.
    timeout-minutes: 55
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
      # Check fingerprints this Chrome into the cache key of every test, so
      # without it each task reruns here instead of restoring.
      - uses: ./.github/actions/visual-renderer
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # Foundation, migrations, Workers, edge, billing sync, then health.
      - name: Deploy dev
        id: deploy
        run: bun run deploy:local
      - name: Keep the critical journeys' evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}-dev
          path: apps/product/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:dev
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  deploy-prd:
    name: deploy:prd
    needs: deploy-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: production
    env:
      SECRETS_ENV: prd
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
      - uses: ./.github/actions/visual-renderer
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - name: Deploy prd
        id: deploy
        run: bun run deploy:local
      - name: Keep the critical journeys' evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}-prd
          path: apps/product/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:prd
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  deploy-release:
    name: deploy:release
    needs: deploy-prd
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: release-${{ github.run_number }}
    steps:
      - name: Tag the commit and publish the release
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Verified and deployed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} at ${GITHUB_SHA}."
