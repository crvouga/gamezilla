name: Deploy

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Deploy · ${{ github.event_name == 'push' && 'push' || 'manual' }}"

# Deploy: ships the code. `main` is what ships, in two stages:
#
#   deploy-dev — the full dev replica (libs/infra/tofu/envs/dev.tfvars.json):
#                OpenTofu foundation apply → migrations → the three Workers →
#                OpenTofu edge apply → billing sync → every `health` task.
#   deploy-prd — the same chain for production. Runs only when deploy-dev
#                succeeded, so every change has run in a real environment
#                first. `health` probes Workers, DNS/TLS, Postgres, R2, EMQX,
#                Grafana Cloud, vendor credentials and OpenTofu drift; the
#                Health workflow (.github/workflows/health.yml) runs the same
#                probes hourly.
#
# Infrastructure changes only through libs/infra/scripts/tofu.ts: plan to a
# file, refuse it if libs/infra/policy/stateful.rego denies it (deleting or
# replacing anything that may hold data), then apply exactly that plan.
#
# SECRETS_ENV is set at the job level rather than through the `deploy:dev` /
# `deploy:prd` aliases, which force TURBO_UI=tui (a TTY UI).
#
# This never runs on pull requests: the dev environment is a shared
# singleton, so concurrent PRs would clobber each other's dev infrastructure,
# migrations and secrets.
# PRs get `bun run check` in the Check workflow (.github/workflows/check.yml)
# instead.

permissions:
  contents: read
  actions: write
  id-token: write
  # Pre-checkout guard reads PR association for the pushed commit
  # (GET /repos/{owner}/{repo}/commits/{sha}/pulls → "Pull requests": read).
  pull-requests: read

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TURBO_UI: stream

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: deploy:dev
    runs-on: ubuntu-latest
    # Above `DEPLOY_RUN_DEADLINE_SECONDS` (45 min) plus setup, so
    # turbo-ci-run's own deadline fires first and names what wedged.
    timeout-minutes: 55
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      # `main` only moves through a merged PR. Branch protection enforces that
      # (libs/infra/tofu/modules/repository, applied by `bun run
      # infra:bootstrap`); this guard is the Deploy workflow's own layer, so a direct
      # push can never ship even if protection drifts. Fails before checkout:
      # the deploy steps themselves never run.
      - name: Assert the commit came from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/pulls" --jq 'length')"
          if [ "$prs" -eq 0 ]; then
            echo "::error::${GITHUB_SHA} is not associated with a pull request — main only moves through merged PRs."
            exit 1
          fi
          echo "guard: ${GITHUB_SHA} arrived through ${prs} pull request(s)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: deploy:dev
        id: deploy
        run: bun run deploy

      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:dev
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  deploy-prd:
    name: deploy:prd
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      SECRETS_ENV: prd
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd

      - name: deploy:prd
        id: deploy
        run: bun run deploy

      # The deploy ends with every `health` task, the critical journeys too.
      - name: Upload critical journey evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}
          path: apps/product/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:prd
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts
