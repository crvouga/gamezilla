name: Release

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
# A rehearsal is labelled apart, so duration checks read only real releases.
run-name: "Release · ${{ inputs.rehearsal && 'rehearsal' || github.event_name == 'push' && 'push' || 'manual' }}"

# Every push to main verifies the exact commit with the production verification gate,
# then releases the shared services and deploys development and production independently.
# Rehearsals verify and plan without releasing.
#
# Every job stops within 10 minutes. Development and production each run
# their release gate after deploying (`@apps/product-ts#health:release`: every
# @synthetic probe and the critical journeys); the hourly Health workflow
# runs the full journey suite against both. Repository policy and the
# Storybook site release beside the shared services, off the path to the
# environments.

# Least privilege: read the code and run metadata. Each job that reads secrets
# or AWS adds the OIDC token they trust; only `deploy-release` writes (its tag).
permissions:
  contents: read # check out the code
  actions: read # read run state (gh run list, job metadata)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Verify this branch and plan fleet and dev's foundation, without applying or releasing
        type: boolean
        required: false
        default: false
      abandoned-bootstrap-lock:
        description: Exact lock UUID from a completed runner; confirm no bootstrap operation is active before recovery
        type: string
        required: false
      abandoned-foundation-lock:
        description: Exact foundation/dev lock UUID from a completed runner; confirm no foundation operation is active before recovery
        type: string
        required: false

env:
  TURBO_UI: stream

# One release at a time: each environment is a shared singleton.
# Keep the newest pending release; never interrupt an active apply or migration.
concurrency:
  group: ${{ inputs.rehearsal && format('deploy-rehearsal-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: false

# Every job runs on a GitHub-hosted `ubuntu-24.04` runner, and every `run:` step is bash.
defaults:
  run:
    shell: ci-budget-shell {0}  # zizmor: ignore[misfeature] -- invokes bash with the remaining workflow budget

jobs:
  deploy-verify:
    name: Verify commit
    permissions:
      contents: read # check out the code
      actions: write # delegated verify:end reads run state and deletes this run's transfer artifacts
      id-token: write # mint the OIDC token Infisical and AWS trust
    uses: ./.github/workflows/verify-full.yml
    with:
      profile: release
      deployment: true
      shards: 6
      concurrency: 3
      require-main: ${{ !inputs.rehearsal }}
      # Pull requests do not run the advisory audit; nightly enforces it. A
      # registry that moved must not fail a deploy.
      advisories: report

  deploy-rehearsal:
    name: Preview infrastructure changes
    concurrency:
      group: repository-policy
      cancel-in-progress: false
    if: ${{ inputs.rehearsal }}
    needs: deploy-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 10
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
    steps:
      - &budget
        name: Check remaining workflow time
        id: budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_SECONDS: '600'
        run: |
          set -euo pipefail
          created=$(timeout 10 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          deadline=$(( $(date -d "$created" +%s) + STAGE_SECONDS ))
          remaining=$(( deadline - $(date +%s) ))
          if (( remaining <= 0 )); then
            message="Verification incomplete at job admission: $(( STAGE_SECONDS - remaining ))s elapsed since workflow creation (budget: ${STAGE_SECONDS}s)."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI_STAGE_DEADLINE=$deadline" >> "$GITHUB_ENV"
          echo "minutes=$(( (remaining + 59) / 60 ))" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ci-budget"
          cat > "$RUNNER_TEMP/ci-budget/ci-budget-shell" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          remaining=$(( CI_STAGE_DEADLINE - $(date +%s) ))
          if (( remaining <= 1 )); then
            echo "::error::The workflow deadline expired."
            exit 124
          fi
          exec timeout --kill-after=1 "$(( remaining - 1 ))" bash --noprofile --norc -eo pipefail "$@"
          SH
          chmod +x "$RUNNER_TEMP/ci-budget/ci-budget-shell"
          echo "$RUNNER_TEMP/ci-budget" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node gh opentofu conftest infisical
          tofu-providers: 'true'
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Assert administration credential was injected from the secret store
        run: |
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo "::error::Add GITHUB_ADMIN_TOKEN to the shared secret-store environment. CI needs repository administration access; the built-in workflow token cannot configure repository protections."
            exit 1
          fi
      - name: Release explicitly identified abandoned bootstrap lock
        if: ${{ inputs.abandoned-bootstrap-lock != '' }}
        env:
          TOFU_ABANDONED_LOCK_ID: ${{ inputs.abandoned-bootstrap-lock }}
        run: bunx turbo run @libs/infra-server-ts#unlock:repository-policy
      - name: Release explicitly identified abandoned foundation lock
        if: ${{ inputs.abandoned-foundation-lock != '' }}
        env:
          TOFU_ABANDONED_LOCK_ID: ${{ inputs.abandoned-foundation-lock }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bunx turbo run @libs/infra-server-ts#unlock:foundation
      - name: Plan repository policy without changing configuration
        run: bunx turbo run @libs/infra-server-ts#plan:repository-policy
      - name: Plan alert delivery and independent probes
        run: bunx turbo run @libs/infra-server-ts#plan:alerting
      - name: Plan fleet without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:fleet
      - name: Plan dev's foundation without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:foundation
      - name: Confirm completion within the workflow deadline
        run: 'true'


  deploy-repository-policy:
    name: Enforce repository policy
    if: ${{ !inputs.rehearsal && github.ref == 'refs/heads/main' && needs.deploy-verify.outputs.reuse-shared != '+' }}
    needs: deploy-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read # check out the reviewed repository configuration
      id-token: write # read administration and encrypted-state credentials through OIDC
      actions: read # read the workflow creation time
    concurrency:
      group: repository-policy
      cancel-in-progress: false
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node gh opentofu conftest infisical
          tofu-providers: 'true'
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Assert administration credential was injected from the secret store
        run: |
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo "::error::Add GITHUB_ADMIN_TOKEN to the shared secret-store environment. CI needs repository administration access; the built-in workflow token cannot configure repository protections."
            exit 1
          fi
      - name: Apply reviewed repository configuration through OpenTofu
        run: bunx turbo run @libs/infra-server-ts#apply:repository-policy
      - name: Apply reviewed alert delivery and independent probes
        run: bunx turbo run @libs/infra-server-ts#apply:alerting
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # Health uses the same synthetic accounts. Stop a running check alongside
  # verification, then confirm it has stopped before changing the shared fleet.
  # Health plans without a state lock and runs again on its hourly schedule.
  # regression: release-timeout-spent-waiting-for-health
  deploy-await-health:
    name: Wait for a running Health check
    if: ${{ !inputs.rehearsal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # list Health runs and stop one still running
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - *budget
      - name: Wait for a running Health check, then stop it
        run: |
          running() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow health.yml \
              --json databaseId,status --jq '.[] | select(.status == "in_progress") | .databaseId'
          }
          ids=$(running)
          [[ -z "$ids" ]] && exit 0
          for id in $ids; do
            echo "::warning::Stopping Health run $id so this release keeps its time limit."
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          for _ in $(seq 1 12); do
            ids=$(running)
            [[ -z "$ids" ]] && exit 0
            sleep 5
          done
          echo "::error::A Health check is still running after it was stopped."
          exit 1
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # What every environment shares (libs/infra-shared-ts/tofu/stacks/fleet): the
  # shared secrets, the auth relay that forwards to every env, and each env's
  # secrets environment. It runs before any environment deploys.
  deploy-fleet:
    name: Release shared services
    if: ${{ !inputs.rehearsal && needs.deploy-verify.outputs.reuse-shared != '+' }}
    needs: [deploy-verify, deploy-await-health]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 10
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node gh opentofu conftest infisical
          tofu-providers: 'true'
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # The fleet apply reads its state passphrase from shared.
      - name: Reconcile shared secrets
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts promote
      # The fleet stack binds the relay's hostname, so its Worker must exist.
      - name: Release the auth relay
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @apps/auth-relay-ts deploy
      - name: Apply the fleet stack
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts apply:fleet
      # Every env now imports shared: drop the copies that shadow it.
      - name: Prune secrets that shadow shared ones
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts prune
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # The team's Storybook site: one global assets-only Worker, built from main.
  # Beside the shared services rather than before them, so a cold Storybook
  # build never delays an environment. The fleet stack binds its hostname, so
  # a fleet built from nothing applies once this job has released the Worker.
  deploy-storybook:
    name: Release the Storybook site
    if: ${{ !inputs.rehearsal }}
    needs: deploy-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 10
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node infisical
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Release the Storybook site
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bunx turbo run @apps/storybook-ts#deploy
      - name: Confirm completion within the workflow deadline
        run: 'true'


  deploy-dev:
    name: Release development
    needs: [deploy-verify, deploy-await-health, deploy-fleet]
    if: >-
      !cancelled() && !inputs.rehearsal && github.ref == 'refs/heads/main' &&
      needs.deploy-verify.result == 'success' && needs.deploy-await-health.result == 'success' &&
      (needs.deploy-fleet.result == 'success' ||
       (needs.deploy-verify.outputs.reuse-shared == '+' && needs.deploy-fleet.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    # The deploy step's own deadline (VERIFY_DEADLINE_SECONDS) fires first
    # and names what wedged.
    timeout-minutes: 10
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: &deploy-environment
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node gh opentofu conftest infisical
          tofu-providers: 'true'
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          secrets-environment: ${{ env.SECRETS_ENV }}
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # Verification fingerprints this Chrome into the cache key of every test, so
      # without it each task reruns here instead of restoring.
      - uses: ./.github/actions/visual-renderer
      # Same UUID-scoped recovery as rehearsal: a completed runner can leave
      # foundation/<env>.tfstate locked; unlock before apply when asked.
      - name: Release explicitly identified abandoned foundation lock
        if: ${{ inputs.abandoned-foundation-lock != '' && env.SECRETS_ENV == 'dev' }}
        env:
          TOFU_ABANDONED_LOCK_ID: ${{ inputs.abandoned-foundation-lock }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bunx turbo run @libs/infra-server-ts#unlock:foundation
      # A release that cannot finish before the run's deadline never starts:
      # stopping OpenTofu or a migration midway strands a state lock or a
      # half-applied change. What does start, turbo-ci-run stops cleanly
      # (SIGTERM, then SIGKILL 15 s later) before the step's shell would.
      - name: Check the release fits the time left
        env:
          RELEASE_SECONDS: '360'
        run: |
          remaining=$(( CI_STAGE_DEADLINE - $(date +%s) ))
          if (( remaining < RELEASE_SECONDS )); then
            echo "::error::${remaining}s of the run's time budget left; releasing ${SECRETS_ENV} takes about ${RELEASE_SECONDS}s, so nothing was changed."
            exit 1
          fi
          echo "VERIFY_DEADLINE_SECONDS=$(( remaining - 30 ))" >> "$GITHUB_ENV"
      # Foundation, migrations, Workers, edge, billing sync, then the release
      # gate (`@apps/product-ts#health:release`).
      - name: Release and verify environment
        id: deploy
        env:
          # Turbo's product build embeds this commit, so the bundle its
          # verifications check is the bundle the deploy uploads, unrebuilt.
          VITE_COMMIT_HASH: ${{ github.sha }}
        run: bun run deploy:local
      - name: Keep the critical journeys' evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-journeys-${{ github.run_id }}-${{ env.SECRETS_ENV }}
          path: apps/product-ts/.cache/critical-journeys
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: ${{ github.job }}
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools-harness-ts/scripts/write-workflow-summary.ts
      - name: Confirm completion within the workflow deadline
        run: 'true'


  deploy-prd:
    name: Release production
    needs: [deploy-verify, deploy-await-health, deploy-fleet, deploy-repository-policy]
    if: >-
      !cancelled() && !inputs.rehearsal && github.ref == 'refs/heads/main' &&
      needs.deploy-verify.result == 'success' && needs.deploy-await-health.result == 'success' &&
      ((needs.deploy-fleet.result == 'success' && needs.deploy-repository-policy.result == 'success') ||
       (needs.deploy-verify.outputs.reuse-shared == '+' && needs.deploy-fleet.result == 'skipped' && needs.deploy-repository-policy.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 10
    environment: production
    env:
      SECRETS_ENV: prd
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: *deploy-environment

  deploy-release:
    name: Publish release
    needs: deploy-prd
    if: ${{ !cancelled() && needs.deploy-prd.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # publish the release tag
      actions: read # read the workflow creation time
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: release-${{ github.run_number }}
    steps:
      - *budget
      - name: Tag the commit and publish the release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Verified and deployed by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at ${GITHUB_SHA}."
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # The run's verdict where people look: the job summary, the one open
  # "Release is failing on main" issue (opened on the first red run, closed by
  # the next green one), one open issue per check failing in verification
  # (pull requests run four tasks; everything else is first run here, and its
  # issue is how a failure is queued and fixed: ci-check-issues.ts), and `ci.workflow.result` in every environment's
  # Grafana, whose alert pages until Release on main is green again
  # (libs/tools-harness-ts/scripts/ci-workflow-alert.ts).
  deploy-verdict:
    name: Release verdict
    needs:
      - deploy-verify
      - deploy-await-health
      - deploy-repository-policy
      - deploy-fleet
      - deploy-storybook
      - deploy-dev
      - deploy-prd
      - deploy-release
    if: ${{ !cancelled() && !inputs.rehearsal && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      actions: read # download this run's verification verdict artifact
      issues: write # open, update or close the Release issue and the check issues
      id-token: write # mint the OIDC token Infisical trusts (Grafana metrics credentials)
    env:
      CI_WORKFLOW: Release
      CI_TRIAGE_OWNER: ${{ vars.CI_TRIAGE_OWNER || github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          product-identity-mode: configured
          tools: bun gh infisical
      # Absent when verification never reached its verdict; the check issues
      # then stay as they are and the Release issue alone reports the run.
      - name: Fetch the verification verdict
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts download release-verdict .cache/release-verdict
          || echo "::warning::No verification verdict to read; check issues are unchanged"
      - name: File the Release issue
        id: verdict
        env:
          CI_VERDICT_PATH: .cache/release-verdict/verdict.json
        run: bun run libs/tools-harness-ts/scripts/ci-workflow-alert.ts
      - name: Record the verdict in Grafana
        env:
          PASSED: ${{ steps.verdict.outputs.passed }}
        run: >-
          bun run apps/product-ts/scripts/ci-workflow-result.ts --workflow release
          --passed "$PASSED"
          --envs "$(bun run libs/infra-shared-ts/scripts/workflow-env-matrix.ts | sed -n 's/^all=//p')"
      - name: Confirm completion within the workflow deadline
        run: 'true'
