name: Release

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Release · ${{ github.event_name == 'push' && 'push' || 'manual' }}"

# Every push to main verifies the exact commit with the full release profile,
# then releases shared services, development, and production in order.
# Rehearsals verify and plan without releasing.

# Least privilege: read the code and run metadata. Each job that reads secrets
# or AWS adds the OIDC token they trust; only `deploy-release` writes (its tag).
permissions:
  contents: read # check out the code
  actions: read # read run state (gh run list, job metadata)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Verify this branch and plan fleet and dev's foundation, without applying or releasing
        type: boolean
        required: false
        default: false

env:
  TURBO_UI: stream

# One release at a time: each environment is a shared singleton.
concurrency:
  group: deploy-main
  queue: max
  cancel-in-progress: false

# Every job runs on a GitHub-hosted `ubuntu-24.04` runner, and every `run:` step is bash.
defaults:
  run:
    shell: bash

jobs:
  deploy-verify:
    name: Verify commit
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    uses: ./.github/workflows/verify-pr.yml
    with:
      profile: release
      require-main: ${{ !inputs.rehearsal }}
      # The pull request already enforced advisories on this code. A registry
      # that moved since then must not fail a deploy of a verified commit.
      advisories: report

  deploy-rehearsal:
    name: Preview infrastructure changes
    if: ${{ inputs.rehearsal }}
    needs: deploy-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 20
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Assert administration credential was injected from the secret store
        run: |
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo "::error::Add GITHUB_ADMIN_TOKEN to the shared secret-store environment. CI needs repository administration access; the built-in workflow token cannot configure repository protections."
            exit 1
          fi
      - name: Plan repository policy without changing configuration
        run: bunx turbo run @libs/infra-server-ts#plan:repository-policy
      - name: Plan fleet without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:fleet
      - name: Plan dev's foundation without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:foundation

  deploy-repository-policy:
    name: Enforce repository policy
    if: ${{ !inputs.rehearsal && github.ref == 'refs/heads/main' }}
    needs: deploy-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read # check out the reviewed repository configuration
      id-token: write # read administration and encrypted-state credentials through OIDC
    concurrency:
      group: repository-policy
      cancel-in-progress: false
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Assert administration credential was injected from the secret store
        run: |
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo "::error::Add GITHUB_ADMIN_TOKEN to the shared secret-store environment. CI needs repository administration access; the built-in workflow token cannot configure repository protections."
            exit 1
          fi
      - name: Apply reviewed repository configuration through OpenTofu
        run: bunx turbo run @libs/infra-server-ts#apply:repository-policy

  # What every environment shares (libs/infra-shared-ts/tofu/stacks/fleet): the
  # shared secrets, the auth relay that forwards to every env, and each env's
  # secrets environment. It runs before any environment deploys.
  deploy-fleet:
    name: Release shared services
    if: ${{ !inputs.rehearsal }}
    needs: [deploy-verify, deploy-repository-policy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 20
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          secrets-environment: shared
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # The fleet apply reads its state passphrase from shared.
      - name: Reconcile shared secrets
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts promote
      # The fleet stack binds the relay's hostname, so its Worker must exist.
      - name: Release the auth relay
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @apps/auth-relay-ts deploy
      - name: Apply the fleet stack
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts apply:fleet
      # Every env now imports shared: drop the copies that shadow it.
      - name: Prune secrets that shadow shared ones
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts prune

  deploy-dev:
    name: Release development
    needs: deploy-fleet
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    # Above `DEPLOY_RUN_DEADLINE_SECONDS` (45 min) plus setup, so
    # turbo-ci-run's own deadline fires first and names what wedged.
    timeout-minutes: 55
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: &deploy-environment
      # A Health check already running journeys as the synthetic accounts, or
      # planning this environment's OpenTofu state, would take this deploy's
      # matches and state lock. health.yml yields to a deploy; this waits out
      # one that started first.
      - name: Wait for a running Health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow health.yml \
              --json status --jq '[.[] | select(.status == "in_progress")] | length')
            [ "$running" = "0" ] && exit 0
            echo "A Health check is running ($running); waiting for it to finish."
            sleep 30
          done
          echo "::error::A Health check is still running after 30 minutes."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
        with:
          secrets-environment: ${{ env.SECRETS_ENV }}
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # Verification fingerprints this Chrome into the cache key of every test, so
      # without it each task reruns here instead of restoring.
      - uses: ./.github/actions/visual-renderer
      # Foundation, migrations, Workers, edge, billing sync, then health.
      - name: Release and verify environment
        id: deploy
        run: bun run deploy:local
      - name: Keep the critical journeys' evidence
        if: failure()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload critical-journeys-"${GITHUB_RUN_ID}-${SECRETS_ENV}"
          apps/product-ts/.cache/critical-journeys
      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: ${{ github.job }}
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools-harness-ts/scripts/write-workflow-summary.ts

  deploy-prd:
    name: Release production
    needs: deploy-dev
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: 55
    environment: production
    env:
      SECRETS_ENV: prd
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: *deploy-environment

  deploy-release:
    name: Publish release
    needs: deploy-prd
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # publish the release tag
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: release-${{ github.run_number }}
    steps:
      - name: Tag the commit and publish the release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Verified and deployed by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at ${GITHUB_SHA}."
