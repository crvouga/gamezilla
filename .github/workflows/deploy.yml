name: Deploy

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Deploy · ${{ github.event_name == 'push' && 'push' || 'manual' }}"

# Verify the exact commit, deploy shared services, then development and
# production, then publish a release. A rehearsal verifies and plans only.
# Environment deployment steps are defined once and reused below.

permissions:
  contents: read
  actions: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Verify this branch and plan fleet and dev's foundation, without applying or deploying
        type: boolean
        required: false
        default: false

env:
  TURBO_UI: stream

# One deploy at a time: each environment is a shared singleton.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Every job runs on whichever self-hosted runner is free — Linux, macOS or
# Windows — so every `run:` step is bash (Git Bash on Windows).
defaults:
  run:
    shell: bash

jobs:
  deploy-verify:
    name: Verify commit
    uses: ./.github/workflows/verify-pr.yml
    with:
      require-main: ${{ !inputs.rehearsal }}
      # The pull request already enforced advisories on this code. A registry
      # that moved since then must not fail a deploy of a verified commit.
      advisories: report

  deploy-rehearsal:
    name: Preview infrastructure changes
    if: ${{ inputs.rehearsal }}
    needs: deploy-verify
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Plan fleet without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:fleet
      - name: Plan dev's foundation without changing infrastructure
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:foundation

  # What every environment shares (libs/infra-shared-ts/tofu/stacks/fleet): the
  # shared secrets, the auth relay that forwards to every env, and each env's
  # secrets environment. It runs before any environment deploys.
  deploy-fleet:
    name: Deploy shared services
    if: ${{ !inputs.rehearsal }}
    needs: deploy-verify
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SECRETS_ENV: shared
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: shared
      # The fleet apply reads its state passphrase from shared.
      - name: Reconcile shared secrets
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts promote
      # The fleet stack binds the relay's hostname, so its Worker must exist.
      - name: Deploy the auth relay
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @apps/auth-relay-ts deploy
      - name: Apply the fleet stack
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts apply:fleet
      # Every env now imports shared: drop the copies that shadow it.
      - name: Prune secrets that shadow shared ones
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/secrets-server-ts/scripts/secrets-reconcile-shared.ts prune

  deploy-dev:
    name: Deploy development
    needs: deploy-fleet
    runs-on: self-hosted
    # Above `DEPLOY_RUN_DEADLINE_SECONDS` (45 min) plus setup, so
    # turbo-ci-run's own deadline fires first and names what wedged.
    timeout-minutes: 55
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: &deploy-environment
      # A Health check already running journeys as the synthetic accounts, or
      # planning this environment's OpenTofu state, would take this deploy's
      # matches and state lock. health.yml yields to a deploy; this waits out
      # one that started first.
      - name: Wait for a running Health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow health.yml \
              --json status --jq '[.[] | select(.status == "in_progress")] | length')
            [ "$running" = "0" ] && exit 0
            echo "A Health check is running ($running); waiting for it to finish."
            sleep 30
          done
          echo "::error::A Health check is still running after 30 minutes."
          exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
      # Verification fingerprints this Chrome into the cache key of every test, so
      # without it each task reruns here instead of restoring.
      - uses: ./.github/actions/visual-renderer
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ env.SECRETS_ENV }}
      # Foundation, migrations, Workers, edge, billing sync, then health.
      - name: Deploy and verify environment
        id: deploy
        run: bun run deploy:local
      - name: Keep the critical journeys' evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}-${{ env.SECRETS_ENV }}
          path: apps/product-ts/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: ${{ github.job }}
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools-harness-ts/scripts/write-workflow-summary.ts

  deploy-prd:
    name: Deploy production
    needs: deploy-dev
    runs-on: self-hosted
    timeout-minutes: 55
    environment: production
    env:
      SECRETS_ENV: prd
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps: *deploy-environment

  deploy-release:
    name: Publish release
    needs: deploy-prd
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: release-${{ github.run_number }}
    steps:
      - name: Tag the commit and publish the release
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Verified and deployed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} at ${GITHUB_SHA}."
