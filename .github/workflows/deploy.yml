name: Deploy

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Deploy · ${{ github.event_name == 'push' && 'push' || 'manual' }}"

# Deploy is the release: the only path to production. Every merge to `main`
# runs it — a pull request merges only when its `check:end` is green, so `main` is
# always releasable and every merge ships. `bun deploy` (or "Run workflow" on
# `main`) dispatches the same release by hand. Each
# environment job runs `bun run deploy:local`. One commit — `github.sha` — is
# verified and shipped, to every environment in
# libs/infra-shared/tofu/envs/<env>.tfvars.json — adding an env file needs no edit
# here:
#
#   deploy:matrix  reads the env files (libs/infra-shared/scripts/workflow-env-matrix.ts)
#                  from a job with no secrets and publishes the env lists.
#   deploy:verify  the full Check PR gate (check-pr.yml) on that commit:
#                  every suite runs, fail-fast off, one aggregated verdict.
#                  Nothing below starts unless it is green. Its cached
#                  verdicts and build outputs are the ones `//#deploy`
#                  restores, so the shipped bundles are the verified ones.
#   deploy:<env>   one job per `protection: "standard"` env, in parallel: the
#                  full replica's OpenTofu foundation apply → migrations → the
#                  three Workers → OpenTofu edge apply → billing sync →
#                  `@apps/product#health` (specs/health/, specs/journeys/).
#   deploy:<env>   then one job per `protection: "production"` env (GitHub
#                  environment `production`), the same chain. Runs only when
#                  every standard env deployed, so every change has run in a
#                  real environment first. `health` checks Workers, DNS/TLS,
#                  Postgres, R2, EMQX, Grafana Cloud, vendor credentials and
#                  OpenTofu drift; the Health workflow
#                  (.github/workflows/health.yml) runs the same probes hourly.
#
# Infrastructure changes only through libs/infra-server/scripts/tofu.ts: plan to a
# file, refuse it if libs/infra-shared/policy/stateful.rego denies it (deleting or
# replacing anything that may hold data), then apply exactly that plan.
#
# SECRETS_ENV is set at the job level rather than through the `deploy:dev` /
# `deploy:prd` package.json aliases, which force TURBO_UI=tui (a TTY UI).
#
#   deploy:release tags the shipped commit `release-<run number>` and
#                  publishes a GitHub release once production is live.
#
# The optional rehearsal verifies a branch and plans dev foundation without applying.
# Release jobs never run on a pull request or any ref other than `main`: each environment is a shared singleton,
# so concurrent PRs would clobber each other's infrastructure, migrations and
# secrets. Pull requests get the same gate (.github/workflows/check-pr.yml) as
# their required status instead. Check Nightly never gates a deploy.

permissions:
  contents: read
  actions: write
  id-token: write
  # Pre-checkout guard reads PR association for the pushed commit
  # (GET /repos/{owner}/{repo}/commits/{sha}/pulls → "Pull requests": read).
  pull-requests: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Verify a branch and plan dev foundation without applying or deploying
        type: boolean
        required: false
        default: false

env:
  TURBO_UI: stream

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-rehearsal:
    if: ${{ inputs.rehearsal }}
    name: deploy:rehearsal
    uses: ./.github/workflows/check-pr.yml

  deploy-plan:
    if: ${{ inputs.rehearsal }}
    name: deploy:plan
    needs: deploy-rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # The first standard env file is the one rehearsed; no env is named here.
      - name: envs
        id: envs
        run: bun run libs/infra-shared/scripts/workflow-env-matrix.ts >> "$GITHUB_OUTPUT"
      - name: Select the rehearsed environment
        env:
          REHEARSED: ${{ fromJSON(steps.envs.outputs.standard)[0] }}
        run: echo "SECRETS_ENV=$REHEARSED" >> "$GITHUB_ENV"
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ fromJSON(steps.envs.outputs.standard)[0] }}
      - name: Plan foundation without changing infrastructure
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @libs/infra-server plan:foundation

  deploy-cleanup:
    name: deploy:cleanup
    needs: deploy-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: reports-cleanup
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - env: ${{ fromJSON(needs.deploy-matrix.outputs.standard)[0] || fromJSON(needs.deploy-matrix.outputs.production)[0] }}
    environment: ${{ contains(fromJSON(needs.deploy-matrix.outputs.production), matrix.env) && 'production' || '' }}
    env:
      SECRETS_ENV: ${{ matrix.env }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          tools: bun gh
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ matrix.env }}
      - name: Remove unused branches and stale reports
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/harness/scripts/report-cleanup.ts --apply --branches

  deploy-matrix:
    if: ${{ !inputs.rehearsal }}
    name: deploy:matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      standard: ${{ steps.envs.outputs.standard }}
      production: ${{ steps.envs.outputs.production }}
      shared: ${{ steps.envs.outputs.shared }}
    steps:
      # `main` only moves through a merged PR. Branch protection enforces that
      # (libs/infra-shared/tofu/modules/repository, applied by `bun run
      # infra:bootstrap`); this guard is the Deploy workflow's own layer, so a
      # direct push can never ship even if protection drifts. Every deploy job
      # needs this one, so it fails before any deploy checks out.
      - name: Assert the commit came from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy ships refs/heads/main only (got ${GITHUB_REF})."
            exit 1
          fi
          prs="$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/pulls" --jq 'length')"
          if [ "$prs" -eq 0 ]; then
            echo "::error::${GITHUB_SHA} is not associated with a pull request — main only moves through merged PRs."
            exit 1
          fi
          echo "guard: ${GITHUB_SHA} arrived through ${prs} pull request(s)"

      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: envs
        id: envs
        run: bun run libs/infra-shared/scripts/workflow-env-matrix.ts >> "$GITHUB_OUTPUT"

  deploy-verify:
    name: deploy:verify
    needs: deploy-matrix
    uses: ./.github/workflows/check-pr.yml

  # Every env file's secrets environment and its import of the shared
  # credentials (libs/infra-shared/tofu/stacks/fleet), then no env may keep a local
  # copy that would shadow a shared one. A new env file gets its secrets
  # environment — and a route home through the OAuth relay — here, before its
  # first deploy reads it.
  deploy-fleet:
    name: deploy:fleet
    needs: [deploy-matrix, deploy-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_ENV: ${{ needs.deploy-matrix.outputs.shared }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ needs.deploy-matrix.outputs.shared }}

      # Promote first: the fleet apply reads its state passphrase from shared.
      - name: promote shared secrets
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/secrets-server/scripts/secrets-reconcile-shared.ts promote

      # The OAuth callback relay (auth.<zone>) forwards to every env file, so
      # it ships before any env deploys; the fleet apply then binds its
      # hostname (a custom domain needs its Worker to exist).
      - name: deploy auth relay
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @apps/auth-relay deploy

      - name: apply fleet
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run --filter @libs/infra-server apply:fleet

      # Only now does every env import shared: drop the copies that shadow it.
      - name: prune shadowing copies
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/secrets-server/scripts/secrets-reconcile-shared.ts prune

  deploy-standard:
    name: deploy:${{ matrix.env }}
    needs: [deploy-matrix, deploy-fleet]
    if: needs.deploy-matrix.outputs.standard != '[]'
    runs-on: ubuntu-24.04
    # Above `DEPLOY_RUN_DEADLINE_SECONDS` (45 min) plus setup, so
    # turbo-ci-run's own deadline fires first and names what wedged.
    timeout-minutes: 55
    strategy:
      # One red environment should not cancel (and hide) another's deploy.
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.deploy-matrix.outputs.standard) }}
    env:
      SECRETS_ENV: ${{ matrix.env }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup

      # Check fingerprints this Chrome into turbo-platform-key.json, a hash
      # input of every test and model check. Without it each task misses the
      # cache Check filled and reruns here on a small runner.
      - uses: ./.github/actions/visual-renderer

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ matrix.env }}

      - name: deploy:${{ matrix.env }}
        id: deploy
        run: bun run deploy:local

      # Same evidence as production: dev is the job that fails first, and
      # without the page the next fix is guessing.
      - name: Upload critical journey evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}-${{ matrix.env }}
          path: apps/product/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:${{ matrix.env }}
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  deploy-production:
    name: deploy:${{ matrix.env }}
    needs: [deploy-matrix, deploy-verify, deploy-fleet, deploy-standard]
    # Every standard env deployed — or there is none (the standard job is
    # skipped on an empty list, and a skipped `needs` would skip this job).
    if: >-
      !cancelled()
      && needs.deploy-matrix.result == 'success'
      && needs.deploy-verify.result == 'success'
      && needs.deploy-fleet.result == 'success'
      && needs.deploy-matrix.outputs.production != '[]'
      && (needs.deploy-standard.result == 'success'
        || (needs.deploy-standard.result == 'skipped'
          && needs.deploy-matrix.outputs.standard == '[]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: production
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.deploy-matrix.outputs.production) }}
    env:
      SECRETS_ENV: ${{ matrix.env }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup

      # Check fingerprints this Chrome into turbo-platform-key.json, a hash
      # input of every test and model check. Without it each task misses the
      # cache Check filled and reruns here on a small runner.
      - uses: ./.github/actions/visual-renderer

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ matrix.env }}

      - name: deploy:${{ matrix.env }}
        id: deploy
        run: bun run deploy:local

      # The deploy ends with `@apps/product#health`, the critical journeys too.
      - name: Upload critical journey evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journeys-${{ github.run_id }}-${{ matrix.env }}
          path: apps/product/.cache/critical-journeys/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Write workflow summary
        if: always() && steps.setup.outcome == 'success'
        env:
          WORKFLOW_JOB: deploy:${{ matrix.env }}
          WORKFLOW_OUTCOME: ${{ steps.deploy.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  # The verified, shipped commit gets a tag and a release; a red or partial
  # release gets neither.
  deploy-release:
    name: deploy:release
    needs: [deploy-production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: release-${{ github.run_number }}
    steps:
      - name: Tag and publish the release
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Verified and deployed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} at ${GITHUB_SHA}."
