# https://minimumcd.org/
name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate router types
        working-directory: packages/app
        run: bunx expo customize tsconfig.json

      - name: Check (tc + lint + test)
        run: bunx turbo check

  deploy:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prechecks
        run: bunx turbo deploy:prechecks

      - name: Deploy
        timeout-minutes: 45
        run: bunx turbo deploy

      - name: Postchecks
        run: bunx turbo deploy:postchecks

      - name: Summary
        run: bunx turbo deploy:summary
