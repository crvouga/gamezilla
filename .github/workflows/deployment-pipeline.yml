# https://minimumcd.org/
name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (format + tc + lint + test + build)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check

      - name: Syncpack (prod + dev)
        run: bun run syncpack:lint

      - name: Knip
        run: bun run knip:ci

      - name: Dependency cruiser
        run: bun run depcruise:ci

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash

      - name: Actionlint
        run: ./actionlint -color

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bun audit
        run: bun audit --audit-level high

  qa:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Resolve the actually-installed @playwright/test version (not the
      # caret range from package.json) so the browser cache key only
      # invalidates when Playwright itself bumps -- not on every unrelated
      # bun.lock change. Resolved from apps/qa because that's the package
      # that lists @playwright/test as a devDependency (bun install uses
      # isolated node_modules, so the package is not resolvable from repo
      # root). See https://playwright.dev/docs/ci#caching-browsers.
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/qa
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On cache miss: download browsers + install system deps (apt). On
      # cache hit: skip the browser download (~150MB) and only install the
      # apt deps -- GitHub-hosted runners are ephemeral, so even a cached
      # browser binary needs its system libs reinstalled each run.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter '@gamezilla/qa' install:browsers

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun --bun x playwright install-deps chromium

      - name: QA (API integration + Playwright + turbo preview)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa

      # Always upload the report (not just on failure) so the embedded
      # videos -- recorded for every test via `video: 'on'` in
      # `apps/qa/src/browser/playwright.config.ts` -- are available for
      # green runs too. `if: always()` excludes only manually cancelled
      # runs; use `if: !cancelled()` if you want those too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/qa/playwright-report/
          retention-days: 7

      - name: Upload Playwright report as Pages artifact
        if: ${{ always() && hashFiles('apps/qa/playwright-report/index.html') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/qa/playwright-report/

  publish-playwright-report:
    if: ${{ always() && needs.qa.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [qa]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, qa]
    runs-on: ubuntu-latest
    outputs:
      client_url: ${{ steps.deploy.outputs.client_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      turbo_cache_url: ${{ steps.deploy.outputs.turbo_cache_url }}
      pages_project_name: ${{ steps.deploy.outputs.pages_project_name }}
      pages_subdomain: ${{ steps.deploy.outputs.pages_subdomain }}
      cloudflare_nameservers: ${{ steps.deploy.outputs.cloudflare_nameservers }}
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Wrangler 4.x requires Node.js v22+. The `setup-bun` action sets up
      # Bun but not Node, and the runner's default Node is v20. Without
      # this step, `wrangler whoami` (and any other `wrangler …`
      # invocation) aborts with "Wrangler requires at least Node.js v22.0.0".
      - name: Setup Node.js (required by wrangler)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Use `npm install -g` rather than `bun add -g`: the latter produces
      # a Bun-runtime wrapper that, in non-TTY CI shells, writes
      # `--version` output to stderr with empty stdout, tripping the dep
      # version probe in `apps/infra/src/cli/deps/spawn.ts`. `npm` writes
      # a plain Node shebang script that prints to stdout cleanly.
      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Stripe CLI
        run: |
          STRIPE_VERSION=$(curl -fsSL https://api.github.com/repos/stripe/stripe-cli/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_VERSION}/stripe_${STRIPE_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin stripe
          stripe version

      - name: Deploy
        id: deploy
        timeout-minutes: 45
        working-directory: apps/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra deploy

  report:
    if: always()
    needs: [check, qa, publish-playwright-report, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: env DOPPLER_CONFIG=prod doppler run -- bun run apps/infra/src/bin/pipeline-report.ts
