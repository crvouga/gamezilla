# https://minimumcd.org/
# Remote Turbo cache: set TURBO_API, TURBO_TOKEN, TURBO_TEAM, TURBO_CACHE=remote:rw
# in Doppler `local` (used by DOPPLER_CONFIG=local in check/qa scripts).
name: Deployment Pipeline

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    concurrency:
      group: format-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Format
        run: bun run format:check

  tc:
    runs-on: ubuntu-latest
    concurrency:
      group: tc-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup
      - name: Typecheck
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:tc

  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup
      - name: Lint
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:lint

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
      - name: Test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:test

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
      - name: Build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:build

  i18n:
    runs-on: ubuntu-latest
    concurrency:
      group: i18n-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: i18n
        run: bun run i18n:check

  syncpack:
    runs-on: ubuntu-latest
    concurrency:
      group: syncpack-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Syncpack
        run: bun run syncpack:lint

  knip:
    runs-on: ubuntu-latest
    concurrency:
      group: knip-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Knip
        run: bun run knip:ci

  depcruise:
    runs-on: ubuntu-latest
    concurrency:
      group: depcruise-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Dependency cruiser
        run: bun run depcruise:ci

  actionlint:
    runs-on: ubuntu-latest
    concurrency:
      group: actionlint-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash
      - name: Actionlint
        run: ./actionlint -color

  gitleaks:
    runs-on: ubuntu-latest
    concurrency:
      group: gitleaks-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: audit-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Bun audit
        run: bun audit --audit-level high

  qa-api:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-api-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup
      - name: QA API integration
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:api

  qa-browser:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-browser-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup

      # Resolve the actually-installed @playwright/test version (not the
      # caret range from package.json) so the browser cache key only
      # invalidates when Playwright itself bumps -- not on every unrelated
      # bun.lock change. Resolved from apps/qa because that's the package
      # that lists @playwright/test as a devDependency (bun install uses
      # isolated node_modules, so the package is not resolvable from repo
      # root). See https://playwright.dev/docs/ci#caching-browsers.
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/qa
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On cache miss: download browsers + install system deps (apt). On
      # cache hit: skip the browser download (~150MB) and only install the
      # apt deps -- GitHub-hosted runners are ephemeral, so even a cached
      # browser binary needs its system libs reinstalled each run.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter '@gamezilla/qa' install:browsers

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun --bun x playwright install-deps chromium

      - name: QA Playwright + turbo preview
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:browser

      # Always upload the report (not just on failure) so the embedded
      # videos -- recorded for every test via `video: 'on'` in
      # `apps/qa/src/browser/playwright.config.ts` -- are available for
      # green runs too. `if: always()` excludes only manually cancelled
      # runs; use `if: !cancelled()` if you want those too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/qa/playwright-report/
          retention-days: 7

      - name: Upload Playwright report as Pages artifact
        if: ${{ always() && hashFiles('apps/qa/playwright-report/index.html') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/qa/playwright-report/

  publish-playwright-report:
    if: ${{ always() && needs.qa-browser.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [qa-browser]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        format,
        tc,
        lint,
        test,
        build,
        i18n,
        syncpack,
        knip,
        depcruise,
        actionlint,
        gitleaks,
        audit,
        qa-api,
        qa-browser,
      ]
    runs-on: ubuntu-latest
    outputs:
      client_url: ${{ steps.deploy.outputs.client_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      turbo_cache_url: ${{ steps.deploy.outputs.turbo_cache_url }}
      pages_project_name: ${{ steps.deploy.outputs.pages_project_name }}
      pages_subdomain: ${{ steps.deploy.outputs.pages_subdomain }}
      cloudflare_nameservers: ${{ steps.deploy.outputs.cloudflare_nameservers }}
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: ./.github/actions/setup

      # Wrangler 4.x requires Node.js v22+. The `setup-bun` action sets up
      # Bun but not Node, and the runner's default Node is v20. Without
      # this step, `wrangler whoami` (and any other `wrangler …`
      # invocation) aborts with "Wrangler requires at least Node.js v22.0.0".
      - name: Setup Node.js (required by wrangler)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Use `npm install -g` rather than `bun add -g`: the latter produces
      # a Bun-runtime wrapper that, in non-TTY CI shells, writes
      # `--version` output to stderr with empty stdout, tripping the dep
      # version probe in `apps/infra/src/cli/deps/spawn.ts`. `npm` writes
      # a plain Node shebang script that prints to stdout cleanly.
      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Install Stripe CLI
        run: |
          STRIPE_VERSION=$(curl -fsSL https://api.github.com/repos/stripe/stripe-cli/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_VERSION}/stripe_${STRIPE_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin stripe
          stripe version

      - name: Deploy
        id: deploy
        timeout-minutes: 45
        working-directory: apps/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra deploy

  report:
    if: always()
    needs:
      [
        format,
        tc,
        lint,
        test,
        build,
        i18n,
        syncpack,
        knip,
        depcruise,
        actionlint,
        gitleaks,
        audit,
        qa-api,
        qa-browser,
        publish-playwright-report,
        deploy,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup

      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: env DOPPLER_CONFIG=prod doppler run -- bun run apps/infra/src/bin/pipeline-report.ts
