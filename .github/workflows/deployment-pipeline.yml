# https://minimumcd.org/
name: Deployment Pipeline

# Turborepo reads this for all jobs/steps (`turbo.json` has no `logOrder` key).
env:
  TURBO_LOG_ORDER: stream

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate router types
        working-directory: packages/app
        run: bunx expo customize tsconfig.json

      - name: Check (tc + lint + test)
        run: bunx turbo check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wrangler
        run: bun add -g wrangler

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          echo "TF_TOKEN_app_terraform_io=$(doppler secrets get TF_TOKEN --plain)" >> "$GITHUB_ENV"
          echo "FLY_API_TOKEN=$(doppler secrets get FLY_API_TOKEN --plain)" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$(doppler secrets get CLOUDFLARE_API_TOKEN --plain)" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(doppler secrets get CLOUDFLARE_ACCOUNT_ID --plain)" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$(doppler secrets get DATABASE_URL --plain)" >> "$GITHUB_ENV"
          echo "EMQX_DASHBOARD_PASSWORD=$(doppler secrets get EMQX_DASHBOARD_PASSWORD --plain)" >> "$GITHUB_ENV"

      - name: Preflight
        working-directory: packages/infra-cli
        run: bun run infra preflight

      - name: Deploy
        timeout-minutes: 45
        working-directory: packages/infra-cli
        run: bun run infra deploy

      - name: Post-deploy
        timeout-minutes: 15
        working-directory: packages/infra-cli
        run: bun run infra post-deploy

      - name: Summary
        working-directory: packages/infra-cli
        run: bun run infra summary
