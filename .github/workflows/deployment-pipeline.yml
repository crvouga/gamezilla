# https://github.com/crvouga/gamezilla/actions/workflows/deployment-pipeline.yml
# https://minimumcd.org/
#
# CI/CD design guidelines (Turbo-first + atomic deploy):
#
# 1. Turbo-cacheable tasks fan out across parallel jobs — `turbo-gates`
#    (root `ci:*` + `check:secrets`), `turbo-verify` (`tc`/`lint`/`test`),
#    `turbo-build` (`build` excluding `@apps/client`). Each job uses
#    per-job `actions/cache` on `.turbo` (`.github/actions/turbo-cache`)
#    and `tools/scripts/turbo-ci-run.ts` with `--cache=local:rw,remote:rw`
#    when Vercel Remote Cache creds are present.
#
# 2. Non-Turbo tasks live in their own jobs only when they need a runner
#    shape Turbo can't share: `static` (actionlint + gitleaks both want
#    a fresh binary download, gitleaks needs `fetch-depth: 0`), `qa-api`,
#    `qa-browser` (Playwright browser cache, screenshots/videos as
#    artifacts).
#
# 3. The production deploy is a single atomic `deploy` job: one checkout,
#    one `infra-setup` install of wrangler + Stripe, and the
#    `infra deploy` CLI runs every phase (provision → migrate →
#    deploy-resources → stripe-sync → smoke → refresh-config →
#    ensure-destroyed) in one process so `InfraContext` flows
#    in-memory between phases. A tiny always-run `lock-release` job is
#    the safety net for the Postgres-backed global lock when `deploy`
#    is cancelled / crashed.
name: Deployment Pipeline

permissions:
  contents: read
  actions: write
  id-token: write

# CI authenticates to the secrets backend via GitHub Actions OIDC (no stored token).
# Repo scripts use `tools/scripts/secrets-run.ts`, which reads scope from `.secrets.json`.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

env:
  TURBO_UI: stream

jobs:
  # Root gates + live secret-store validate (dev + prd). Always full-repo —
  # these hash wide inputs and are not affected-filtered.
  turbo-gates:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    concurrency:
      group: turbo-gates-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/turbo-cache
        with:
          job: turbo-gates
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo gates + check:secrets
        run: bun run check:ci:gates
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: turbo-gates
          mode: save

  # Per-package tc / lint / test. On pull_request, only packages affected
  # since the PR base SHA (plus dependents) via TURBO_AFFECTED_BASE.
  turbo-verify:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      TURBO_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    concurrency:
      group: turbo-verify-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/turbo-cache
        with:
          job: turbo-verify
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo tc / lint / test
        run: bun run check:ci:verify
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: turbo-verify
          mode: save

  # Workspace build excluding @apps/client (qa-browser owns the E2E client
  # export). Same affected filter as turbo-verify on PRs.
  turbo-build:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      TURBO_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    concurrency:
      group: turbo-build-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/turbo-cache
        with:
          job: turbo-build
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo build (exclude @apps/client)
        run: bun run check:ci:build
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: turbo-build
          mode: save

  # Static repo gates that don't fit Turbo's task graph: actionlint
  # downloads its own binary, and gitleaks needs `fetch-depth: 0` for
  # PR-range diff scans. Grouped into one job to avoid two near-empty
  # runners.
  static:
    runs-on: ubuntu-latest
    concurrency:
      group: static-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` is for gitleaks PR-range scans (base..head).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash

      - name: Actionlint
        run: ./actionlint -color

      # `gitleaks/gitleaks-action@v2` pins gitleaks 8.24.3, which has a
      # bug where top-level `[[allowlists]]` are silently dropped when
      # combined with `[extend].useDefault = true` (fixed in 8.25+). It
      # also targets the deprecated Node.js 20 runtime. Install a pinned
      # release via `tools/scripts/install-gitleaks.ts` (retries on transient
      # GitHub CDN 502s) so our `.gitleaks.toml` allowlist actually applies.
      # Bun only — no `setup` composite (no `bun install`) so this job stays
      # a pair of binary downloads + scans.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install gitleaks
        run: bun run tools/scripts/install-gitleaks.ts

      - name: Gitleaks
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GH_EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --log-opts="$LOG_OPTS"

  qa-api:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-api-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/turbo-cache
        with:
          job: qa-api
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # Run setup + migrate in the foreground so DB failures surface in the job
      # log instead of a silent background death that only shows up as a
      # health-wait timeout. Then start wrangler only (`preview:serve`) — avoids
      # a second migrate racing qa-browser on the shared hosted dev Postgres.
      - name: Setup and migrate API
        run: bun run tools/scripts/secrets-run.ts -- bun run tools/scripts/turbo-ci-run.ts setup migrate --filter=@apps/api
      - name: Start API preview
        env:
          # Wrangler-only boot is usually seconds; keep headroom for cold starts.
          API_HEALTH_WAIT_MS: 240000
        run: |
          nohup bun run tools/scripts/secrets-run.ts -- bun run --filter @apps/api preview:serve > /tmp/api-preview.log 2>&1 &
          echo $! > /tmp/api-preview.pid
          API_PREVIEW_PID="$(cat /tmp/api-preview.pid)"
          export API_PREVIEW_PID
          export API_PREVIEW_LOG=/tmp/api-preview.log
          if ! bun run tools/scripts/secrets-run.ts -- bun run --filter @libs/integration-test wait-for-api-health; then
            echo "::group::api-preview.log (last 200 lines)"
            tail -n 200 /tmp/api-preview.log || true
            echo "::endgroup::"
            exit 1
          fi
      - name: QA API integration
        run: bun run qa:api
      - name: Stop API preview
        if: always()
        run: |
          if [ -f /tmp/api-preview.pid ]; then
            kill "$(cat /tmp/api-preview.pid)" 2>/dev/null || true
          fi
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: qa-api
          mode: save

  qa-browser:
    # Intentionally not `needs: [turbo-build]`. The CI `build` task filters
    # `@apps/client` out (see `check:ci:build` in root package.json),
    # so qa-browser is the only place the web client is actually built
    # in CI before deploy. Sequencing on turbo-* would just delay this
    # job for little cache benefit (remote cache already shared). CI starts
    # `turbo preview` in a prior step; Playwright never spawns servers —
    # it fails fast when the stack is down.
    runs-on: ubuntu-latest
    env:
      # Metro must SHA-1 Bun-store deps via Watchman (see apps/client/metro.config.js).
      EXPO_USE_WATCHMAN: '1'
    concurrency:
      group: qa-browser-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/turbo-cache
        with:
          job: qa-browser
          mode: restore
      - uses: ./.github/actions/setup
        with:
          watchman: true

      # Resolve the actually-installed @playwright/test version (not the
      # caret range from package.json) so the browser cache key only
      # invalidates when Playwright itself bumps -- not on every unrelated
      # bun.lock change. Resolved from libs/integration-test because that's
      # the package that lists @playwright/test as a dependency (bun install
      # uses isolated node_modules, so the package is not resolvable from
      # repo root). See https://playwright.dev/docs/ci#caching-browsers.
      - name: Resolve Playwright version
        id: playwright
        working-directory: libs/integration-test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On cache miss: download browsers + install system deps (apt). On
      # cache hit: skip the browser download (~150MB) and only install the
      # apt deps -- GitHub-hosted runners are ephemeral, so even a cached
      # browser binary needs its system libs reinstalled each run.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter '@libs/integration-test' install:browsers

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun --bun x playwright install-deps chromium

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # Preview depends on `setup`, workspace `^build`, and client `expo export`.
      # Build first so the wait step only covers migrate + wrangler + static server
      # startup — cold CI can exceed 240s when build + preview run together.
      - name: Build preview stack artifacts
        run: bun run tools/scripts/secrets-run.ts -- sh -c 'EXPO_PUBLIC_E2E=1 bun run tools/scripts/turbo-ci-run.ts setup build --filter=@apps/api --filter=@apps/client'
      - name: Start preview stack
        env:
          BROWSER_E2E_STACK_WAIT_MS: 480000
        run: |
          nohup bun run tools/scripts/secrets-run.ts -- sh -c 'EXPO_PUBLIC_E2E=1 bun turbo run preview --filter=@apps/api --filter=@apps/client --cache=local:rw --cache-workers=4' > /tmp/preview-stack.log 2>&1 &
          echo $! > /tmp/preview-stack.pid
          if ! bun run tools/scripts/secrets-run.ts -- bun run --filter @libs/integration-test wait-for-browser-e2e-stack; then
            echo "::group::preview-stack.log (last 200 lines)"
            tail -n 200 /tmp/preview-stack.log || true
            echo "::endgroup::"
            exit 1
          fi
      - name: QA Playwright
        run: bun run qa:browser
      - name: Stop preview stack
        if: always()
        run: |
          if [ -f /tmp/preview-stack.pid ]; then
            kill "$(cat /tmp/preview-stack.pid)" 2>/dev/null || true
          fi

      # Always upload the report (not just on failure) so the embedded
      # videos -- recorded for every test via `video: 'on'` in
      # `libs/integration-test/playwright/playwright.config.ts` -- are available for
      # green runs too. `if: always()` excludes only manually cancelled
      # runs; use `if: !cancelled()` if you want those too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 7
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: qa-browser
          mode: save

  # Resolve a durable URL for the Playwright HTML report on every main push
  # (green or red). Private repositories on the free plan cannot publish
  # GitHub Pages (`deploy-pages` 422: "current plan does not support private
  # GitHub Pages"), so we link the `playwright-report` Actions artifact that
  # `qa-browser` already uploads instead of calling deploy-pages.
  publish-playwright-report:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.qa-browser.result == 'success' || needs.qa-browser.result == 'failure')
    needs: [qa-browser]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.report.outputs.page_url }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - name: Resolve Playwright report artifact URL
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="playwright-report") | .id' | head -n 1)"
          if [ -z "${artifact_id}" ]; then
            echo "::warning::playwright-report artifact not found for run ${GITHUB_RUN_ID} (qa-browser likely failed before Upload Playwright report)"
            echo "page_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          page_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${artifact_id}"
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
          echo "Playwright report: ${page_url}"

  # ── Atomic production deploy ─────────────────────────────────────────
  # One job, one checkout, one `infra-setup`. `bun run infra deploy`
  # acquires the global Postgres lock, runs every phase in-process
  # (provision → migrate → deploy-resources → stripe-sync → smoke →
  # refresh-config → publish-client-eas-update → ensure-destroyed), and
  # emits `lock_id` / deploy URLs / nameservers as step outputs for the
  # report and the always-run `lock-release` safety net below.
  #
  # `publish-client-eas-update` publishes an OTA `eas update` (JS bundle
  # only — no native build) after the API + web client are live and
  # smoke-tested, so the mobile client (which targets
  # https://api.gamezilla.app) never ships a bundle ahead of the matching
  # server / DB migrations / Stripe sync / client-config. Native binaries
  # are built rarely + manually via the `eas-build-release.yml` workflow
  # (`infra build-client-native`), not here.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [turbo-gates, turbo-verify, turbo-build, static, qa-api, qa-browser]
    runs-on: ubuntu-latest
    env:
      EXPO_USE_WATCHMAN: '1'
      # Metro `expo export --platform=all` during `eas update` OOMs on the
      # default ~2GB Node heap; keep in sync with EAS_UPDATE_MAX_OLD_SPACE_MB
      # in libs/infra/src/cli/lib/eas-mobile.ts.
      NODE_OPTIONS: --max-old-space-size=8192
      # Identity only — project UUID comes from `.secrets.json` via secrets-auth.
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    outputs:
      lock_id: ${{ steps.deploy.outputs.lock_id }}
      client_url: ${{ steps.deploy.outputs.client_url }}
      # api_url is derived in the report (the secrets action masks API_URL → GHA drops it)
      cloudflare_nameservers: ${{ steps.deploy.outputs.cloudflare_nameservers }}
      zone_id: ${{ steps.deploy.outputs.zone_id }}
    permissions:
      contents: read
      id-token: write
    # GitHub-level mutex (belt-and-suspenders alongside the Postgres
    # lock acquired inside `infra deploy`). `cancel-in-progress: false`
    # so a queued push to main never preempts an in-flight deploy mid
    # phase.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # 75m (was 60m): the deploy now also bundles + publishes the EAS OTA
    # update (`publish-client-eas-update` phase), which adds ~5-10 min of
    # Metro bundling on top of the web + API deploy. No native builds run
    # here (those are the manual `eas-build-release.yml` workflow).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - uses: ./.github/actions/infra-setup
        with:
          wrangler: 'true'
          eas: 'true'
          watchman: 'true'
      - name: Deploy (lock-acquire → provision → migrate → deploy-resources → stripe-sync → smoke → refresh-config → publish-client-eas-update → ensure-destroyed)
        id: deploy
        working-directory: libs/infra
        env:
          SECRETS_ENV: prd
        run: bun run infra deploy

  # Safety-net lock release. The happy-path release happens in-process
  # inside `infra deploy` (the same trap-handlers that release on
  # SIGINT / uncaughtException). This job runs only when `deploy`
  # crashed, was cancelled, or timed out so hard that the in-process
  # release couldn't finish; `releaseIfHeldById` is idempotent so it's
  # a no-op if the lock was already cleared. The lock id is emitted by
  # `infra deploy` immediately after acquire (before any mutating phase)
  # so `lock_id` is set even when a later phase fails hard.
  lock-release:
    if: always() && needs.deploy.result != 'success' && needs.deploy.result != 'skipped' && needs.deploy.outputs.lock_id != ''
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - uses: ./.github/actions/infra-setup
      - name: Release global deploy lock
        working-directory: libs/infra
        env:
          SECRETS_ENV: prd
          INFRA_LOCK_ID: ${{ needs.deploy.outputs.lock_id }}
        run: bun run infra lock-release

  report:
    if: always()
    needs:
      [
        turbo-gates,
        turbo-verify,
        turbo-build,
        static,
        qa-api,
        qa-browser,
        publish-playwright-report,
        deploy,
        lock-release,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Full setup (no Watchman) — needs workspace install for `@libs/infra`
      # imports; secrets CLI is cached inside the setup composite.
      - uses: ./.github/actions/setup

      # `GITHUB_TOKEN` is passed through so the report can call the GitHub
      # REST API to fetch per-job logs for any failed `needs.*` job and embed
      # them in an LLM fix prompt appended to the step summary. Needs the
      # workflow-level `actions: write` permission (which includes read).
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: SECRETS_ENV=prd bun run tools/scripts/secrets-run.ts -- bun run libs/infra/src/bin/pipeline-report.ts
