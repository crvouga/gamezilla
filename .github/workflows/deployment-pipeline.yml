# https://github.com/crvouga/gamezilla/actions/workflows/deployment-pipeline.yml
name: Deployment Pipeline

permissions:
  contents: read
  actions: write
  id-token: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

env:
  TURBO_UI: stream
  TURBO_LOG_ORDER: stream
  TURBO_OUTPUT_LOGS: new-only
  TURBO_CONCURRENCY: "8"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || '' }}
    env:
      EXPO_USE_WATCHMAN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/turbo-cache
        with:
          job: deploy
          mode: restore

      - uses: ./.github/actions/jest-cache
        with:
          mode: restore

      - uses: ./.github/actions/setup
        with:
          watchman: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prd' || 'dev' }}

      - name: Deploy
        id: deploy
        env:
          SECRETS_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prd' || 'dev' }}
        run: |
          set -euo pipefail
          # Heartbeat: turbo cache restore / long tasks can go quiet.
          # GitHub SIGTERM's a step with no log output (~10 min, exit 143).
          (
            while sleep 120; do
              echo "deploy: still running $(date -u +%H:%M:%SZ)"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          bun run deploy 2>&1 | tee "${RUNNER_TEMP}/deploy.log"

      - name: Write pipeline summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_LOG_PATH: ${{ runner.temp }}/deploy.log
          SECRETS_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prd' || 'dev' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run tools/scripts/write-pipeline-summary.ts

      - uses: ./.github/actions/jest-cache
        if: always()
        with:
          mode: save

      - uses: ./.github/actions/turbo-cache
        if: always()
        with:
          job: deploy
          mode: save
