# https://github.com/crvouga/gamezilla/actions/workflows/deployment-pipeline.yml
# https://minimumcd.org/
#
# CI/CD design guidelines (Turbo-first + atomic deploy):
#
# 1. Turbo-cacheable tasks fan out across parallel jobs — `check-gates`
#    (root `ci:*` + `check:secrets`), `check-verify` (`tc`/`test` + root
#    Biome `ci:lint`), `check-build` (`@apps/server|minio|postgres#build`).
#    Each job uses per-job `actions/cache` on `.turbo`
#    (`.github/actions/turbo-cache`). `check-gates` / `check-verify` also
#    persist Jest transform caches via `.github/actions/jest-cache`.
#    `tools/scripts/turbo-ci-run.ts` uses `--cache=local:rw,remote:rw`
#    when Vercel Remote Cache creds are present.
#
# 2. Jobs that need a distinct runner shape stay separate even though the
#    same scripts are root Turbo tasks locally (`//#check:*` in turbo.json):
#    `check-static` (actionlint + gitleaks; gitleaks needs `fetch-depth: 0`),
#    `check-api` (live preview Worker + Hono integration).
#    Local `bun check` is one offline `turbo-ci-run` (no live
#    `check:api`; that stays CI / opt-in).
#
# 3. The production deploy is a single atomic `deploy` job: one checkout,
#    one `infra-setup` install of wrangler + Stripe, and the
#    `infra deploy` CLI runs every phase (provision → migrate →
#    deploy-resources → stripe-sync → smoke →
#    ensure-destroyed) in one process so `InfraContext` flows
#    in-memory between phases. A tiny always-run `lock-release` job is
#    the safety net for the Postgres-backed global lock when `deploy`
#    is cancelled / crashed.
name: Deployment Pipeline

permissions:
  contents: read
  actions: write
  id-token: write

# CI authenticates to the secrets backend via GitHub Actions OIDC (no stored token).
# Repo scripts use `tools/scripts/secrets-run.ts`, which reads scope from `.secrets.json`.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

env:
  TURBO_UI: stream

jobs:
  # Root gates + live secret-store validate (dev + prd). Always full-repo —
  # these hash wide inputs and are not affected-filtered.
  check-gates:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    concurrency:
      group: check-gates-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/turbo-cache
        with:
          job: check-gates
          mode: restore
      - uses: ./.github/actions/jest-cache
        with:
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo gates + check:secrets
        run: bun run check:ci:gates
      - uses: ./.github/actions/jest-cache
        if: always() && !cancelled()
        with:
          mode: save
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: check-gates
          mode: save

  # Per-package tc / test, then root Biome lint. On pull_request, turbo tasks
  # only cover packages affected since the PR base SHA (plus dependents) via
  # TURBO_AFFECTED_BASE, plus root `//` so `ci:lint` always runs.
  check-verify:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      TURBO_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    concurrency:
      group: check-verify-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/turbo-cache
        with:
          job: check-verify
          mode: restore
      - uses: ./.github/actions/jest-cache
        with:
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo tc / test + Biome lint
        run: bun run check:ci:verify
      - uses: ./.github/actions/jest-cache
        if: always() && !cancelled()
        with:
          mode: save
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: check-verify
          mode: save

  # Workspace build excluding @apps/client (Expo web export happens in deploy).
  # Same affected filter as check-verify on PRs.
  check-build:
    runs-on: ubuntu-latest
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      TURBO_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    concurrency:
      group: check-build-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/turbo-cache
        with:
          job: check-build
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Turbo build (exclude @apps/client)
        run: bun run check:ci:build
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: check-build
          mode: save

  # Static repo gates that don't fit Turbo's task graph: actionlint
  # downloads its own binary, and gitleaks needs `fetch-depth: 0` for
  # PR-range diff scans. Grouped into one job to avoid two near-empty
  # runners.
  check-static:
    runs-on: ubuntu-latest
    concurrency:
      group: check-static-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` is for gitleaks PR-range scans (base..head).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash

      - name: Actionlint
        run: ./actionlint -color

      # `gitleaks/gitleaks-action@v2` pins gitleaks 8.24.3, which has a
      # bug where top-level `[[allowlists]]` are silently dropped when
      # combined with `[extend].useDefault = true` (fixed in 8.25+). It
      # also targets the deprecated Node.js 20 runtime. Install a pinned
      # release via `tools/scripts/install-gitleaks.ts` (retries on transient
      # GitHub CDN 502s) so our `.gitleaks.toml` allowlist actually applies.
      # Bun only — no `setup` composite (no `bun install`) so this job stays
      # a pair of binary downloads + scans.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install gitleaks
        run: bun run tools/scripts/install-gitleaks.ts

      - name: Gitleaks
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GH_EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --log-opts="$LOG_OPTS"

  check-api:
    runs-on: ubuntu-latest
    concurrency:
      group: check-api-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/turbo-cache
        with:
          job: check-api
          mode: restore
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # SECRETS_ENV=dev points the API at loopback Postgres. Boot embedded
      # Postgres from pkgs (not bun dev) before setup/migrate.
      - name: Start local Postgres
        run: |
          set -euo pipefail
          bun run --filter @pkgs/postgres-embedded install:deps
          bun run --filter @pkgs/postgres-embedded setup
          nohup bun run tools/scripts/secrets-run.ts -- bun run tools/scripts/boot-embedded-postgres.ts > /tmp/postgres.log 2>&1 &
          echo $! > /tmp/postgres.pid
          for _ in $(seq 1 120); do
            if grep -q '\[postgres\] ready' /tmp/postgres.log 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/postgres.pid)" 2>/dev/null; then
              echo "::group::postgres.log (last 200 lines)"
              tail -n 200 /tmp/postgres.log || true
              echo "::endgroup::"
              exit 1
            fi
            sleep 1
          done
          echo "::error::timed out waiting for embedded Postgres"
          echo "::group::postgres.log (last 200 lines)"
          tail -n 200 /tmp/postgres.log || true
          echo "::endgroup::"
          exit 1
      # Run setup + migrate in the foreground so DB failures surface in the job
      # log instead of a silent background death that only shows up as a
      # health-wait timeout. Then start wrangler only (`preview:serve`).
      - name: Setup and migrate API
        run: bun run tools/scripts/secrets-run.ts -- bun run tools/scripts/turbo-ci-run.ts setup migrate --filter=@apps/server
      - name: Start API preview
        env:
          # Wrangler-only boot is usually seconds; keep headroom for cold starts.
          API_HEALTH_WAIT_MS: 240000
        run: |
          nohup bun run tools/scripts/secrets-run.ts -- bun run --filter @apps/server preview:serve > /tmp/api-preview.log 2>&1 &
          echo $! > /tmp/api-preview.pid
          API_PREVIEW_PID="$(cat /tmp/api-preview.pid)"
          export API_PREVIEW_PID
          export API_PREVIEW_LOG=/tmp/api-preview.log
          if ! bun run tools/scripts/secrets-run.ts -- bun run tools/scripts/wait-for-api-health.ts; then
            echo "::group::api-preview.log (last 200 lines)"
            tail -n 200 /tmp/api-preview.log || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Check API integration
        run: bun run check:api
      - name: Stop API preview
        if: always()
        run: |
          if [ -f /tmp/api-preview.pid ]; then
            kill "$(cat /tmp/api-preview.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/postgres.pid ]; then
            kill "$(cat /tmp/postgres.pid)" 2>/dev/null || true
          fi
      - uses: ./.github/actions/turbo-cache
        if: always() && !cancelled()
        with:
          job: check-api
          mode: save

  # ── Atomic production deploy ─────────────────────────────────────────
  # One job, one checkout, one `infra-setup`. `bun run infra deploy`
  # acquires the global Postgres lock, runs every phase in-process
  # (provision → migrate → deploy-resources → stripe-sync → smoke →
  # publish-client-eas-update → ensure-destroyed), and
  # emits `lock_id` / deploy URLs / nameservers as step outputs for the
  # report and the always-run `lock-release` safety net below.
  #
  # `publish-client-eas-update` publishes an OTA `eas update` (JS bundle
  # only — no native build) after the API + web client are live and
  # smoke-tested, so the mobile client (which targets
  # https://api.gamezilla.app) never ships a bundle ahead of the matching
  # server / DB migrations / Stripe sync / client-config. Native binaries
  # are built rarely + manually via the `eas-build-release.yml` workflow
  # (`infra build-client-native`), not here.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check-gates, check-verify, check-build, check-static, check-api]
    runs-on: ubuntu-latest
    env:
      EXPO_USE_WATCHMAN: '1'
      # Metro `expo export --platform=all` during `eas update` OOMs on the
      # default ~2GB Node heap; keep in sync with EAS_UPDATE_MAX_OLD_SPACE_MB
      # in libs/infra/src/cli/lib/eas-mobile.ts.
      NODE_OPTIONS: --max-old-space-size=8192
      # Identity only — project UUID comes from `.secrets.json` via secrets-auth.
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    outputs:
      lock_id: ${{ steps.deploy.outputs.lock_id }}
      client_url: ${{ steps.deploy.outputs.client_url }}
      # api_url is derived in the report (the secrets action masks API_URL → GHA drops it)
      cloudflare_nameservers: ${{ steps.deploy.outputs.cloudflare_nameservers }}
      zone_id: ${{ steps.deploy.outputs.zone_id }}
    permissions:
      contents: read
      id-token: write
    # GitHub-level mutex (belt-and-suspenders alongside the Postgres
    # lock acquired inside `infra deploy`). `cancel-in-progress: false`
    # so a queued push to main never preempts an in-flight deploy mid
    # phase.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # 75m (was 60m): the deploy now also bundles + publishes the EAS OTA
    # update (`publish-client-eas-update` phase), which adds ~5-10 min of
    # Metro bundling on top of the web + API deploy. No native builds run
    # here (those are the manual `eas-build-release.yml` workflow).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - uses: ./.github/actions/infra-setup
        with:
          wrangler: 'true'
          eas: 'true'
          watchman: 'true'
      - name: Deploy (lock-acquire → provision → migrate → deploy-resources → stripe-sync → smoke → publish-client-eas-update → ensure-destroyed)
        id: deploy
        working-directory: libs/infra
        env:
          SECRETS_ENV: prd
        run: bun run infra deploy

  # Safety-net lock release. The happy-path release happens in-process
  # inside `infra deploy` (the same trap-handlers that release on
  # SIGINT / uncaughtException). This job runs only when `deploy`
  # crashed, was cancelled, or timed out so hard that the in-process
  # release couldn't finish; `releaseIfHeldById` is idempotent so it's
  # a no-op if the lock was already cleared. The lock id is emitted by
  # `infra deploy` immediately after acquire (before any mutating phase)
  # so `lock_id` is set even when a later phase fails hard.
  lock-release:
    if: always() && needs.deploy.result != 'success' && needs.deploy.result != 'skipped' && needs.deploy.outputs.lock_id != ''
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - uses: ./.github/actions/infra-setup
      - name: Release global deploy lock
        working-directory: libs/infra
        env:
          SECRETS_ENV: prd
          INFRA_LOCK_ID: ${{ needs.deploy.outputs.lock_id }}
        run: bun run infra lock-release

  report:
    if: always()
    needs:
      [
        check-gates,
        check-verify,
        check-build,
        check-static,
        check-api,
        deploy,
        lock-release,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Full setup (no Watchman) — needs workspace install for `@libs/infra`
      # imports; secrets CLI is cached inside the setup composite.
      - uses: ./.github/actions/setup

      # `GITHUB_TOKEN` is passed through so the report can call the GitHub
      # REST API to fetch per-job logs for any failed `needs.*` job and embed
      # them in an LLM fix prompt appended to the step summary. Needs the
      # workflow-level `actions: write` permission (which includes read).
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: prd
      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: SECRETS_ENV=prd bun run tools/scripts/secrets-run.ts -- bun run libs/infra/src/bin/pipeline-report.ts
