# https://minimumcd.org/
name: Deployment Pipeline

# Turborepo reads this for all jobs/steps (`turbo.json` has no `logOrder` key).
env:
  TURBO_LOG_ORDER: stream

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate router types
        working-directory: packages/client
        run: bunx expo customize tsconfig.json

      - name: Check (tc + lint + test)
        run: bunx turbo check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wrangler
        run: bun add -g wrangler

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Deploy
        timeout-minutes: 45
        working-directory: packages/infra-cli
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: bun run infra deploy
