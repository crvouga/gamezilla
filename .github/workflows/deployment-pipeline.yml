# https://github.com/crvouga/gamezilla/actions/workflows/deployment-pipeline.yml
# https://minimumcd.org/
# Remote Turbo cache: set TURBO_API, TURBO_TOKEN, TURBO_TEAM, TURBO_CACHE=remote:rw
# in Doppler `local` (used by DOPPLER_CONFIG=local in check/qa scripts).
name: Deployment Pipeline

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    concurrency:
      group: format-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Format
        run: bun run check:format

  tc:
    runs-on: ubuntu-latest
    concurrency:
      group: tc-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Typecheck
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:tc

  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Lint
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:lint

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:test

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run check:build

  i18n:
    runs-on: ubuntu-latest
    concurrency:
      group: i18n-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: i18n
        run: bun run i18n:check

  syncpack:
    runs-on: ubuntu-latest
    concurrency:
      group: syncpack-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Syncpack
        run: bun run syncpack:lint

  knip:
    runs-on: ubuntu-latest
    concurrency:
      group: knip-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Knip
        run: bun run knip:ci

  depcruise:
    runs-on: ubuntu-latest
    concurrency:
      group: depcruise-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Circular dependencies (packages/)
        run: bun run check:circular-deps
      - name: Dependency cruiser
        run: bun run depcruise:ci

  actionlint:
    runs-on: ubuntu-latest
    concurrency:
      group: actionlint-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash
      - name: Actionlint
        run: ./actionlint -color

  gitleaks:
    runs-on: ubuntu-latest
    concurrency:
      group: gitleaks-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Need full history so PR scans can diff base..head.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # `gitleaks/gitleaks-action@v2` pins gitleaks 8.24.3, which has a bug
      # where top-level `[[allowlists]]` are silently dropped when combined
      # with `[extend].useDefault = true` (fixed in 8.25+). It also targets
      # the deprecated Node.js 20 runtime. Install the latest gitleaks
      # release directly so our `.gitleaks.toml` allowlist actually applies.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GH_EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --log-opts="$LOG_OPTS"

  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: audit-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          doppler: 'false'
      - name: Bun audit
        run: bun audit --audit-level high

  qa-api:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-api-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: QA API integration
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:api

  qa-browser:
    # Intentionally not `needs: [build]`. The `build` job filters
    # `@gamezilla/client` out of `check:build` (see root package.json),
    # so qa-browser is the only place the web client is actually built
    # in CI before deploy. Sequencing on `build` would just delay this
    # job for no cache benefit -- the playwright `webServer` overrides
    # `EXPO_PUBLIC_API_URL` to a localhost origin before spawning
    # `turbo run preview`, so its `^build` hash for `@gamezilla/client`
    # would not match a prod-API build anyway (Turborepo's framework
    # inference auto-hashes `EXPO_PUBLIC_*` for Expo workspaces).
    runs-on: ubuntu-latest
    concurrency:
      group: qa-browser-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # Resolve the actually-installed @playwright/test version (not the
      # caret range from package.json) so the browser cache key only
      # invalidates when Playwright itself bumps -- not on every unrelated
      # bun.lock change. Resolved from packages/qa because that's the package
      # that lists @playwright/test as a devDependency (bun install uses
      # isolated node_modules, so the package is not resolvable from repo
      # root). See https://playwright.dev/docs/ci#caching-browsers.
      - name: Resolve Playwright version
        id: playwright
        working-directory: packages/qa
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On cache miss: download browsers + install system deps (apt). On
      # cache hit: skip the browser download (~150MB) and only install the
      # apt deps -- GitHub-hosted runners are ephemeral, so even a cached
      # browser binary needs its system libs reinstalled each run.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter '@gamezilla/qa' install:browsers

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun --bun x playwright install-deps chromium

      - name: QA Playwright + turbo preview
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:browser

      # Always upload the report (not just on failure) so the embedded
      # videos -- recorded for every test via `video: 'on'` in
      # `packages/qa/src/browser/playwright.config.ts` -- are available for
      # green runs too. `if: always()` excludes only manually cancelled
      # runs; use `if: !cancelled()` if you want those too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: packages/qa/playwright-report/
          retention-days: 7

      - name: Upload Playwright report as Pages artifact
        if: ${{ always() && hashFiles('packages/qa/playwright-report/index.html') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/qa/playwright-report/

  publish-playwright-report:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.qa-browser.result == 'success'
    needs: [qa-browser]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Deploy pipeline ──────────────────────────────────────────────────
  # The legacy single `deploy` job was decomposed into a chain of atomic
  # jobs (lock-acquire → provision → migrate → deploy-resources →
  # stripe-sync → smoke → refresh-config → lock-release). Each job calls
  # one `infra` subcommand; the global PlanetScale lock is held by
  # `lock-acquire` for the duration and removed by `lock-release` (which
  # runs `if: always()` so a crash in any phase still releases the lock).
  #
  # `InfraContext` (zoneId, nameservers, pagesSubdomain) is built up by
  # `provision` and round-tripped to downstream jobs as JSON via
  # `needs.provision.outputs.infra_context`.

  lock-acquire:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        format,
        tc,
        lint,
        test,
        build,
        i18n,
        syncpack,
        knip,
        depcruise,
        actionlint,
        gitleaks,
        audit,
        qa-api,
        qa-browser,
      ]
    runs-on: ubuntu-latest
    outputs:
      lock_id: ${{ steps.acquire.outputs.lock_id }}
    permissions:
      contents: read
    # GitHub-level mutex (belt-and-suspenders alongside the PlanetScale
    # lock). Only `lock-acquire` carries it, so the chain serializes at
    # the entrypoint without queuing every individual phase.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          postgres: 'true'
      - name: Acquire global deploy lock
        id: acquire
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra lock-acquire

  provision:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lock-acquire]
    runs-on: ubuntu-latest
    outputs:
      infra_context: ${{ steps.provision.outputs.infra_context }}
      zone_id: ${{ steps.provision.outputs.zone_id }}
      pages_subdomain: ${{ steps.provision.outputs.pages_subdomain }}
      cloudflare_nameservers: ${{ steps.provision.outputs.cloudflare_nameservers }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          wrangler: 'true'
          postgres: 'true'
      - name: Provision resources
        id: provision
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra provision

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [provision]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          postgres: 'true'
      - name: Migrate database
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra migrate

  deploy-resources:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [provision, migrate]
    runs-on: ubuntu-latest
    outputs:
      client_url: ${{ steps.deploy.outputs.client_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      turbo_cache_url: ${{ steps.deploy.outputs.turbo_cache_url }}
      pages_project_name: ${{ steps.deploy.outputs.pages_project_name }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          wrangler: 'true'
          postgres: 'true'
      - name: Deploy resources (turbo-cache, api-worker, client)
        id: deploy
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          INFRA_CONTEXT: ${{ needs.provision.outputs.infra_context }}
        run: bun run infra deploy-resources

  stripe-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-resources]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          stripe: 'true'
          postgres: 'true'
      - name: Sync Stripe catalog + webhooks
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra stripe-sync

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [provision, stripe-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          postgres: 'true'
      - name: Smoke tests (DNS + HTTP)
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          INFRA_CONTEXT: ${{ needs.provision.outputs.infra_context }}
        run: bun run infra smoke

  refresh-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [provision, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          postgres: 'true'
      - name: Refresh PatchDB client config
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          INFRA_CONTEXT: ${{ needs.provision.outputs.infra_context }}
        run: bun run infra refresh-config

  # Always-run safety net for the global deploy lock. Even on a crashed /
  # cancelled / timed-out upstream job, this still runs and removes the
  # lock row by id (`releaseIfHeldById` is idempotent if another run
  # somehow grabbed it). Replaces the inline `Unlock on failure` step
  # from the legacy single-job deploy.
  lock-release:
    if: always() && needs.lock-acquire.result == 'success' && needs.lock-acquire.outputs.lock_id != ''
    needs:
      [
        lock-acquire,
        provision,
        migrate,
        deploy-resources,
        stripe-sync,
        smoke,
        refresh-config,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          postgres: 'true'
      - name: Release global deploy lock
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          INFRA_LOCK_ID: ${{ needs.lock-acquire.outputs.lock_id }}
        run: bun run infra lock-release

  report:
    if: always()
    needs:
      [
        format,
        tc,
        lint,
        test,
        build,
        i18n,
        syncpack,
        knip,
        depcruise,
        actionlint,
        gitleaks,
        audit,
        qa-api,
        qa-browser,
        publish-playwright-report,
        lock-acquire,
        provision,
        migrate,
        deploy-resources,
        stripe-sync,
        smoke,
        refresh-config,
        lock-release,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # `GITHUB_TOKEN` is passed through so the report can call the GitHub
      # REST API to fetch per-job logs for any failed `needs.*` job and embed
      # them in an LLM fix prompt appended to the step summary. Needs the
      # workflow-level `actions: write` permission (which includes read).
      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: env DOPPLER_CONFIG=prod doppler run -- bun run packages/infra/src/bin/pipeline-report.ts
