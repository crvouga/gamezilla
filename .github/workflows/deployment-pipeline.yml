# https://minimumcd.org/
name: Deployment Pipeline

# Remote Turbo cache: GitHub-hosted runners are often blocked from custom domains (Cloudflare Access / WAF).
# After deploying turbo-cache with workers_dev, set repo var TURBO_CACHE_WORKERS_ORIGIN if your *.workers.dev URL differs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Default: worker name + account subdomain from packages/infra project-config; override via repo Settings → Variables.
  TURBO_API_CI: ${{ vars.TURBO_CACHE_WORKERS_ORIGIN || 'https://gamezilla-turbo-cache.crvouga.workers.dev' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify turbo-cache origin (workers.dev)
        run: curl -fsS "$TURBO_API_CI/health"

      - name: Check (tc + lint + test + build)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: env -u CURSOR_AGENT -u CURSOR_TRACE_ID doppler run -- env TURBO_API="$TURBO_API_CI" turbo --cache=remote:rw check build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --filter '@gamezilla/e2e' install:browsers

      - name: Verify turbo-cache origin (workers.dev)
        run: curl -fsS "$TURBO_API_CI/health"

      - name: E2E (Playwright + turbo preview)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: doppler run -- env TURBO_API="$TURBO_API_CI" bun run --filter '@gamezilla/e2e' e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wrangler
        run: bun add -g wrangler

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Deploy
        timeout-minutes: 45
        working-directory: packages/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: doppler run -- bun run infra deploy
