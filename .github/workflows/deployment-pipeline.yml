# https://github.com/crvouga/gamezilla/actions/workflows/deployment-pipeline.yml
# https://minimumcd.org/
#
# CI/CD design guidelines (Turbo-first + atomic deploy):
#
# 1. Turbo-cacheable tasks (format, syncpack/catalog, knip, depcruise,
#    circular-deps, audit, i18n, expo-go compat, tc, lint, test, build)
#    all run inside a
#    single `turbo-ci` job that invokes `bun run check:ci`. Turbo's task
#    graph + Vercel Remote Cache (driven by Doppler `dev`'s
#    `TURBO_TOKEN` + `TURBO_TEAM`) give us maximum parallelism and
#    cross-PR cache reuse with zero extra GitHub Actions machinery.
#
# 2. Non-Turbo tasks live in their own jobs only when they need a runner
#    shape Turbo can't share: `static` (actionlint + gitleaks both want
#    a fresh binary download, gitleaks needs `fetch-depth: 0`), `qa-api`,
#    `qa-browser` (Playwright browser cache, screenshots/videos as
#    artifacts).
#
# 3. The production deploy is a single atomic `deploy` job: one checkout,
#    one `infra-setup` install of wrangler + Stripe, and the
#    `infra deploy` CLI runs every phase (provision → migrate →
#    deploy-resources → stripe-sync → smoke → refresh-config →
#    ensure-destroyed) in one process so `InfraContext` flows
#    in-memory between phases. A tiny always-run `lock-release` job is
#    the safety net for the PlanetScale-backed global lock when `deploy`
#    is cancelled / crashed.
name: Deployment Pipeline

permissions:
  contents: read
  actions: write

# `DOPPLER_TOKEN_SHARED` is a project token — not config-scoped. Repo scripts
# use `scripts/doppler-run.ts`, which reads project/config from `doppler.yaml`.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

jobs:
  # Single Turbo-orchestrated job for every cacheable repo gate: format,
  # syncpack + catalog + no-patches, knip, depcruise, circular-deps,
  # audit, i18n, Expo Go compat (`ci:expo-go` native-module allowlist +
  # `ci:expo-go-deps` = `expo install --check` version pin), plus
  # per-package `tc` / `lint` / `test` / `build`. Turbo
  # parallelizes across the task graph and reuses Vercel Remote Cache
  # (via Doppler-injected `TURBO_TOKEN` + `TURBO_TEAM`) for cross-PR
  # hits. `check:ci` throttles cache HTTP (`--cache-workers=1` via
  # `scripts/turbo-ci-run.ts`) and writes artifacts to Vercel
  # (`--cache=local:rw,remote:rw` in CI). Per-task cache
  # status (`--output-logs=hash-only --summarize`) keeps logs readable.
  # TURBO_TOKEN/TURBO_TEAM come from Doppler
  # `dev` via `doppler run` (only DOPPLER_TOKEN_SHARED is a GH secret).
  turbo-ci:
    runs-on: ubuntu-latest
    concurrency:
      group: turbo-ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Verify Vercel remote cache via Doppler (fail fast)
        env:
          # Unlocks Doppler only — TURBO_TOKEN/TURBO_TEAM are injected by
          # `doppler run` from the `dev` config, not GitHub secrets.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          CI: true
          GITHUB_ACTIONS: true
        run: bun run scripts/doppler-run.ts -- bun run scripts/check-turbo-remote-cache.ts
      - name: Turbo CI (cacheable gates + tc/lint/test/build)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          # GHA runners can expose a pseudo-TTY; Turbo's interactive TUI then
          # buffers task logs and looks hung for 10+ min on `@apps/client`.
          TURBO_UI: stream
        run: bun run check:ci

  # Static repo gates that don't fit Turbo's task graph: actionlint
  # downloads its own binary, and gitleaks needs `fetch-depth: 0` for
  # PR-range diff scans. Grouped into one job to avoid two near-empty
  # runners.
  static:
    runs-on: ubuntu-latest
    concurrency:
      group: static-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` is for gitleaks PR-range scans (base..head).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
        shell: bash

      - name: Actionlint
        run: ./actionlint -color

      # `gitleaks/gitleaks-action@v2` pins gitleaks 8.24.3, which has a
      # bug where top-level `[[allowlists]]` are silently dropped when
      # combined with `[extend].useDefault = true` (fixed in 8.25+). It
      # also targets the deprecated Node.js 20 runtime. Install a pinned
      # release via `scripts/install-gitleaks.ts` (retries on transient
      # GitHub CDN 502s) so our `.gitleaks.toml` allowlist actually applies.
      # Bun only — no `setup` composite (no `bun install`) so this job stays
      # a pair of binary downloads + scans.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install gitleaks
        run: bun run scripts/install-gitleaks.ts

      - name: Gitleaks
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GH_EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --log-opts="$LOG_OPTS"

  qa-api:
    runs-on: ubuntu-latest
    concurrency:
      group: qa-api-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: QA API integration
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:api

  qa-browser:
    # Intentionally not `needs: [turbo-ci]`. The CI `build` task filters
    # `@apps/client` out (see `check:ci:build` in root package.json),
    # so qa-browser is the only place the web client is actually built
    # in CI before deploy. Sequencing on `turbo-ci` would just delay this
    # job for no cache benefit -- the playwright `webServer` overrides
    # `EXPO_PUBLIC_API_URL` to a localhost origin before spawning
    # `turbo run preview`, so its `^build` hash for `@apps/client`
    # would not match a prod-API build anyway (Turborepo's framework
    # inference auto-hashes `EXPO_PUBLIC_*` for Expo workspaces).
    runs-on: ubuntu-latest
    concurrency:
      group: qa-browser-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # Resolve the actually-installed @playwright/test version (not the
      # caret range from package.json) so the browser cache key only
      # invalidates when Playwright itself bumps -- not on every unrelated
      # bun.lock change. Resolved from libs/qa because that's the package
      # that lists @playwright/test as a devDependency (bun install uses
      # isolated node_modules, so the package is not resolvable from repo
      # root). See https://playwright.dev/docs/ci#caching-browsers.
      - name: Resolve Playwright version
        id: playwright
        working-directory: libs/qa
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On cache miss: download browsers + install system deps (apt). On
      # cache hit: skip the browser download (~150MB) and only install the
      # apt deps -- GitHub-hosted runners are ephemeral, so even a cached
      # browser binary needs its system libs reinstalled each run.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --filter '@libs/qa' install:browsers

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun --bun x playwright install-deps chromium

      - name: QA Playwright + turbo preview
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run qa:browser

      # Always upload the report (not just on failure) so the embedded
      # videos -- recorded for every test via `video: 'on'` in
      # `libs/qa/src/playwright/playwright.config.ts` -- are available for
      # green runs too. `if: always()` excludes only manually cancelled
      # runs; use `if: !cancelled()` if you want those too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: libs/qa/playwright-report/
          retention-days: 7

      - name: Upload Playwright report as Pages artifact
        if: ${{ always() && hashFiles('libs/qa/playwright-report/index.html') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: libs/qa/playwright-report/

  # Deploy the HTML report to GitHub Pages on every main push — green or
  # red — so the latest run is always one URL away. `always()` is required
  # so this job is not skipped when `qa-browser` fails; the pages artifact
  # step in that job already runs under `always()` too.
  publish-playwright-report:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.qa-browser.result == 'success' || needs.qa-browser.result == 'failure')
    needs: [qa-browser]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Native mobile build + OTA update ─────────────────────────────────
  # Triggers an EAS Build (native iOS/Android binaries, ~15-30 min in
  # Expo's cloud, fired with `--no-wait`) AND publishes an EAS Update so
  # the same commit's JS bundle is delivered over-the-air to dev clients
  # and Expo Go on the matching channel.
  #
  # Runs AFTER the atomic `deploy` job (`needs: [..., deploy]`): the mobile
  # client talks to https://api.gamezilla.app, so the server, DB
  # migrations, Stripe sync, and pushed client-config for this commit must
  # be live BEFORE we ship the matching native binaries / OTA bundle —
  # otherwise a freshly-updated client could hit an older API or a schema
  # that hasn't migrated yet. The `if` below uses `always()` + explicit
  # result checks so the gate still works on `workflow_dispatch`, where
  # `deploy` is intentionally skipped (manual `development` builds don't gate
  # on a prod deploy).
  #
  # `EXPO_TOKEN` is loaded from Doppler `dev` into `GITHUB_ENV`, then passed
  # to `expo-github-action` so EAS CLI is authenticated for every step.
  # Runs in `apps/client` so EAS resolves the right project (all EAS files
  # live there per https://docs.expo.dev/build-reference/build-with-monorepos).
  eas-mobile:
    needs: [turbo-ci, static, qa-api, qa-browser, deploy]
    if: >-
      always() &&
      needs.turbo-ci.result == 'success' &&
      needs.static.result == 'success' &&
      needs.qa-api.result == 'success' &&
      needs.qa-browser.result == 'success' &&
      (
        needs.deploy.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && needs.deploy.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: eas-mobile
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          doppler: 'true'

      # EAS CLI reads `EXPO_TOKEN` from the environment (not `doppler run`).
      # Load from Doppler `dev` and pass into expo-github-action so every
      # step in this job is authenticated.
      - name: Load EXPO_TOKEN from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: |
          set -euo pipefail
          token=$(doppler secrets get EXPO_TOKEN --plain -p gamezilla -c dev)
          if [ -z "${token}" ]; then
            echo "::error::EXPO_TOKEN is missing in Doppler project gamezilla config dev. Create a token at https://expo.dev/settings/access-tokens then run: doppler secrets set EXPO_TOKEN --project gamezilla --config dev"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "EXPO_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      # Two environments only: a push to `main` ships `production`; a manual
      # `workflow_dispatch` run ships `development`. Profile and update
      # channel always match by name.
      - name: Resolve EAS profile + channel
        id: eas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV=development
          else
            ENV=production
          fi
          echo "profile=$ENV" >> "$GITHUB_OUTPUT"
          echo "channel=$ENV" >> "$GITHUB_OUTPUT"

      - name: EAS Build (native binaries)
        env:
          EXPO_PUBLIC_COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          eas build --platform all --profile "${{ steps.eas.outputs.profile }}" --non-interactive --no-wait

      # Compile i18n + generate the bundled web/worker assets before the OTA
      # bundle (the `eas-build-post-install` hook only runs on EAS Build
      # workers, not for a locally-run `eas update`).
      - name: Prepare JS bundle
        run: bun run prebuild

      - name: EAS Update (OTA bundle for dev clients + Expo Go)
        env:
          EXPO_PUBLIC_COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          eas update --channel "${{ steps.eas.outputs.channel }}" --message "${{ github.sha }}" --non-interactive

  # ── Atomic production deploy ─────────────────────────────────────────
  # One job, one checkout, one `infra-setup`. `bun run infra deploy`
  # acquires the global PlanetScale lock, runs every phase in-process
  # (provision → migrate → deploy-resources → stripe-sync → smoke →
  # refresh-config → ensure-destroyed), and emits `lock_id` / deploy
  # URLs / nameservers as step outputs for the report and the
  # always-run `lock-release` safety net below.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [turbo-ci, static, qa-api, qa-browser]
    runs-on: ubuntu-latest
    outputs:
      lock_id: ${{ steps.deploy.outputs.lock_id }}
      client_url: ${{ steps.deploy.outputs.client_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      pages_project_name: ${{ steps.deploy.outputs.pages_project_name }}
      pages_subdomain: ${{ steps.deploy.outputs.pages_subdomain }}
      cloudflare_nameservers: ${{ steps.deploy.outputs.cloudflare_nameservers }}
      zone_id: ${{ steps.deploy.outputs.zone_id }}
    permissions:
      contents: read
    # GitHub-level mutex (belt-and-suspenders alongside the PlanetScale
    # lock acquired inside `infra deploy`). `cancel-in-progress: false`
    # so a queued push to main never preempts an in-flight deploy mid
    # phase.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
        with:
          wrangler: 'true'
          stripe: 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
      - name: Deploy (lock-acquire → provision → migrate → deploy-resources → stripe-sync → smoke → refresh-config → ensure-destroyed)
        id: deploy
        working-directory: libs/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun run infra deploy

  # Safety-net lock release. The happy-path release happens in-process
  # inside `infra deploy` (the same trap-handlers that release on
  # SIGINT / uncaughtException). This job runs only when `deploy`
  # crashed, was cancelled, or timed out so hard that the in-process
  # release couldn't finish; `releaseIfHeldById` is idempotent so it's
  # a no-op if the lock was already cleared. The lock id is emitted by
  # `infra deploy` immediately after acquire (before any mutating phase)
  # so `lock_id` is set even when a later phase fails hard.
  lock-release:
    if: always() && needs.deploy.result != 'success' && needs.deploy.result != 'skipped' && needs.deploy.outputs.lock_id != ''
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/infra-setup
      - name: Release global deploy lock
        working-directory: libs/infra
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          INFRA_LOCK_ID: ${{ needs.deploy.outputs.lock_id }}
        run: bun run infra lock-release

  report:
    if: always()
    needs:
      [
        turbo-ci,
        static,
        qa-api,
        qa-browser,
        publish-playwright-report,
        eas-mobile,
        deploy,
        lock-release,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # `GITHUB_TOKEN` is passed through so the report can call the GitHub
      # REST API to fetch per-job logs for any failed `needs.*` job and embed
      # them in an LLM fix prompt appended to the step summary. Needs the
      # workflow-level `actions: write` permission (which includes read).
      - name: Write pipeline report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DOPPLER_CONFIG=prd bun run scripts/doppler-run.ts -- bun run libs/infra/src/bin/pipeline-report.ts
