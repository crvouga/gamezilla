name: Verify Nightly

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Verify Nightly · ${{ github.event_name == 'schedule' && 'schedule' || inputs.group && inputs.group != 'all' && format('diagnostic {0}', inputs.group) || 'manual' }}"

# Verify Nightly is the comprehensive run: everything the merge gate runs, at a
# deeper budget, plus the suites too slow or too exploratory to block a merge.
# It never gates a merge or a deploy, and no pull request waits for it.
# `bun verify-nightly` runs the same profile on a laptop.
#
# One profile decides what differs from Verify PR — the tasks, their depth,
# their budgets and whether reports are kept
# (`libs/tools-harness-ts/scripts/verify-profile.ts`). No test exists only here: a suite
# below is an existing task, and whatever it finds is pinned as a regression
# in the suite that found it, which puts it in the merge gate.
#
#   verify-nightly:gate         the whole Verify PR gate through the same
#                              sharded jobs, replaying every drawn trace of
#                              every Quint model and five times the property
#                              runs. Reports are published and kept.
#   verify-nightly:random       property runs on fresh seeds and the
#                              determinism fuzz.
#   verify-nightly:browser      four rotating partitions of every spec suite in
#                              real browsers against a booted localhost
#                              stack; successive nights run the rest.
#   verify-nightly:visual       Every Storybook story rendered and tested in a
#                              real browser.
#   verify-nightly:coverage     coverage of the unit suites and the scripted
#                              mutants they must kill.
#   verify-nightly:performance  hot-path benchmarks.
#   verify-nightly:end          one verdict over every group. A red group never
#                              stops another; any red group fails the run and
#                              opens or updates the `verify-nightly` issue.
#
# It runs on the newest commit of `main` every night (a schedule always runs
# the default branch) and by hand: "Run workflow", or
# `gh workflow run verify-nightly.yml --ref <branch>` to rehearse a branch.
#
# Every group keeps its log, its seeds and its evidence as GitHub Actions
# artifacts for three days, on failure too. Each runs with dev secrets only; nothing here reads a
# production secret or deploys.
#
# No job runs longer than 45 minutes. A suite too large for one runner is a
# matrix (`shards` in verify-profile.ts): each runner takes its share from
# `NIGHTLY_SHARD=<k>/<n>`, keeps its own artifact, and the first red shard
# stops its siblings, since the group is red either way.

permissions:
  contents: read # check out the code

on:
  schedule:
    # GitHub cron is UTC: 10:23 is 03:23 MST (04:23 MDT), while the team sleeps.
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Diagnostic group, or all for comprehensive verification
        type: choice
        options: [all, gate, random, browser, visual, coverage, performance, storybook, pr-load]
        default: all
      pr-load-revisions:
        description: JSON array of distinct merged commit SHAs for a PR throughput diagnostic
        type: string
        default: '[]'
      storybook-pattern:
        description: Optional story-id regex for explicit Storybook diagnostics; empty runs every state
        type: string
        default: ''
      browser-journey:
        description: Optional journey feature path to run against the isolated production build and capture each step (browser group)
        type: string
        default: ''
      browser-partition:
        description: Optional browser partition number to run alone on one runner, as a night's job summary names it (browser group)
        type: string
        default: ''
      storybook-evidence-run:
        description: Export retained synthetic Storybook evidence for this exact run instead of running tests (group must be storybook)
        type: string
        default: ''
      storybook-evidence-key:
        description: Base64 PEM public key for encrypted evidence export; private key stays with the reviewer
        type: string
        default: ''

env:
  TURBO_UI: stream
  VERIFY_PROFILE: nightly
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}

# One nightly run per ref; a second waits rather than discarding a night.
concurrency:
  group: verify-nightly-${{ github.ref }}-${{ inputs.group || 'all' }}-${{ inputs.storybook-evidence-run || 'verify' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.group != '' && inputs.group != 'all' }}

# Every job runs on a GitHub-hosted `ubuntu-24.04` runner, and every `run:` step is bash.
defaults:
  run:
    shell: ci-budget-shell {0}  # zizmor: ignore[misfeature] -- invokes bash with the remaining workflow budget


jobs:
  verify-nightly-gate:
    name: verify-nightly:gate
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'gate' }}
    permissions:
      contents: read # check out the code
      actions: write # delegated verify:end reads run state and deletes this run's transfer artifacts
      id-token: write # mint the OIDC token Infisical and AWS trust
    uses: ./.github/workflows/verify-full.yml
    with:
      profile: nightly
      # Reserve six of the twenty account runners for releases and PRs.
      shards: 2
      # Match Release parallelism inside each gate runner.
      concurrency: 3

  verify-nightly-random:
    name: verify-nightly:random (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'random' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NIGHTLY_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
      actions: read # read the workflow creation time
    steps:
      - &budget
        name: Check remaining workflow time
        id: budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_SECONDS: '2700'
        run: |
          set -euo pipefail
          created=$(timeout 10 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          deadline=$(( $(date -d "$created" +%s) + STAGE_SECONDS ))
          remaining=$(( deadline - $(date +%s) ))
          if (( remaining <= 0 )); then
            message="Verification incomplete at job admission: $(( STAGE_SECONDS - remaining ))s elapsed since workflow creation (budget: ${STAGE_SECONDS}s)."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI_STAGE_DEADLINE=$deadline" >> "$GITHUB_ENV"
          echo "minutes=$(( (remaining + 59) / 60 ))" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ci-budget"
          cat > "$RUNNER_TEMP/ci-budget/ci-budget-shell" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          remaining=$(( CI_STAGE_DEADLINE - $(date +%s) ))
          if (( remaining <= 1 )); then
            echo "::error::The workflow deadline expired."
            exit 124
          fi
          exec timeout --kill-after=1 "$(( remaining - 1 ))" bash --noprofile --norc -eo pipefail "$@"
          SH
          chmod +x "$RUNNER_TEMP/ci-budget/ci-budget-shell"
          echo "$RUNNER_TEMP/ci-budget" >> "$GITHUB_PATH"
      # Steps every suite job shares (the checkout, the toolchain with dev
      # secrets, and the pinned renderer further down) are written once and
      # aliased, the way Release shares its deploy steps.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          tools: bun node conftest
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # The log holds every seed drawn and the replay command of a failure;
      # `apps/product-ts/.cache/randomized/` keeps the seeds as files. Each
      # shard runs every fourth file under seeds of its own.
      - name: verify-nightly:random
        timeout-minutes: 40
        # Each suite owns its own CPU worker pool; do not multiply those pools.
        env:
          TURBO_CONCURRENCY: '1'
          PBT_CONCURRENCY: '1'
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:random
      - name: Retain seeds and the run summary
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-random-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            apps/product-ts/.cache/randomized
            .turbo/runs/*.json
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  verify-nightly-browser:
    name: verify-nightly:browser (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'browser' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        # The whole suite is about 50 runner-hours, so a night runs four of
        # its 24-minute partitions (`apps/product-ts/scripts/stack-shards.ts`)
        # and successive nights run the rest; each runner's job summary names
        # its partition. A focused journey or named partition is one runner.
        shard: ${{ fromJSON(inputs.group == 'browser' && (inputs.browser-journey != '' || inputs.browser-partition != '') && '[1]' || '[1, 2, 3, 4]') }}
    env:
      NIGHTLY_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
      actions: read # read the workflow creation time
    steps:
      - *budget
      - *checkout
      - &setup
        uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - &renderer
        uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      # The night's turn follows the run's UTC day, so the runners of one run
      # take different partitions even across midnight.
      - name: Read the night's UTC day
        if: ${{ inputs.group != 'browser' || !inputs.browser-journey }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(timeout 10 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "NIGHTLY_NIGHT=$(( $(date -u -d "$created" +%s) / 86400 ))" >> "$GITHUB_ENV"
      - name: verify-nightly:browser
        if: ${{ inputs.group != 'browser' || !inputs.browser-journey }}
        timeout-minutes: 40
        env:
          BROWSER_PARTITION: ${{ inputs.browser-partition }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:browser
      - name: Capture one production browser journey
        if: ${{ inputs.group == 'browser' && inputs.browser-journey != '' }}
        timeout-minutes: 40
        env:
          BROWSER_JOURNEY: ${{ inputs.browser-journey }}
          JOURNEY_CAPTURE_STEPS: '1'
        run: |
          [[ "$BROWSER_JOURNEY" =~ ^specs/(journeys/[a-z0-9-]+|billing/open-provider-pages)\.feature$ ]]
          bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bunx turbo run test:release-journeys --filter=@apps/product-ts -- "$BROWSER_JOURNEY"
      # Step timelines, screenshots, recordings and traces of every scenario,
      # and the partition's runs with their expected and measured seconds.
      - name: Retain browser reports and traces
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-browser-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            .turbo/runs/*.json
            apps/*/.cache/harness-report
            apps/product-ts/.cache/stack-shard
            apps/product-ts/.cache/critical-journeys/release-all/*/steps
            libs/*/.cache/harness-report
            pkgs/*/.cache/harness-report
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # A focused, manual browser diagnostic in the shared baseline environment.
  # Authoring is explicit; the ordinary nightly and PR gates never update PNGs.
  # pkgs/ui-root-harness-ts/README.md documents artifact review and application.
  verify-nightly-storybook:
    name: verify-nightly:storybook
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.group == 'storybook' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STORYBOOK_PATTERN: ${{ inputs.storybook-pattern }}
      STORYBOOK_EVIDENCE_RUN: ${{ inputs.storybook-evidence-run }}
      STORYBOOK_EVIDENCE_PUBLIC_KEY: ${{ inputs.storybook-evidence-key }}
    permissions:
      contents: read # check out the code
      actions: read # export a retained run's Storybook artifact
      id-token: write # mint the OIDC token Infisical trusts
    steps:
      - *budget
      - *checkout
      - *setup
      - name: Prepare Storybook renderer
        if: ${{ !inputs.storybook-evidence-run }}
        uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      - name: Verify diagnostic tooling
        run: bunx turbo run lint tc test ci:goals --filter=@libs/tools-harness-ts --concurrency=1
      - name: Export retained Storybook evidence only
        if: ${{ inputs.storybook-evidence-run != '' }}
        run: bun run libs/tools-harness-ts/scripts/storybook-evidence.ts --export
      - name: Build canonical Storybook
        if: ${{ !inputs.storybook-evidence-run }}
        run: bun run storybook:build
      - name: Check PR Storybook states
        if: ${{ !inputs.storybook-evidence-run && !inputs.storybook-pattern }}
        run: bunx turbo run ci:storybook:0 ci:storybook:1 ci:storybook:2 ci:storybook:3 ci:storybook:4 ci:storybook:5 ci:storybook:6 ci:storybook:7 ci:storybook:8 ci:storybook:9 ci:storybook:10 ci:storybook:11 ci:storybook:12 ci:storybook:13 --filter=@pkgs/ui-root-harness-ts --concurrency=1
      - name: Check selected Storybook states
        if: ${{ !inputs.storybook-evidence-run && inputs.storybook-pattern != '' }}
        run: bun run storybook:test --grep "$STORYBOOK_PATTERN"
      - name: Retain Storybook results
        if: ${{ always() && !cancelled() && !inputs.storybook-evidence-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-storybook-${{ github.run_id }}
          path: pkgs/ui-root-harness-ts/.cache/storybook-test-results
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  verify-nightly-visual:
    name: verify-nightly:visual (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'visual' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      STORYBOOK_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
      actions: read # read the workflow creation time
    steps:
      - *budget
      - *checkout
      - *setup
      - *renderer
      - name: verify-nightly:visual
        timeout-minutes: 40
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:visual
      - name: Retain the run summaries
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-visual-${{ github.run_id }}-${{ matrix.shard }}
          path: .turbo/runs/*.json
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  verify-nightly-coverage:
    name: verify-nightly:coverage
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'coverage' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
      actions: read # read the workflow creation time
    steps:
      - *budget
      - *checkout
      - *setup
      - name: verify-nightly:coverage
        timeout-minutes: 40
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:coverage
      - name: Retain the coverage report
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-coverage-${{ github.run_id }}
          path: |
            .cache/coverage
            .turbo/runs/*.json
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  verify-nightly-performance:
    name: verify-nightly:performance
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'performance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token Infisical and AWS trust
      actions: read # read the workflow creation time
    steps:
      - *budget
      - *checkout
      - *setup
      # The log is the result: each benchmark prints its own measurements,
      # and nothing else in this step prints, so the log is kept as a file.
      - name: verify-nightly:performance
        timeout-minutes: 40
        env:
          TURBO_OUTPUT_LOGS: full
        run: |
          set -o pipefail
          mkdir -p .cache/verify-nightly
          bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:performance 2>&1 | tee .cache/verify-nightly/performance.log
      - name: Retain the benchmark results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-nightly-performance-${{ github.run_id }}
          path: |
            .cache/verify-nightly/performance.log
            .turbo/runs/*.json
          retention-days: 3
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Confirm completion within the workflow deadline
        run: 'true'


  verify-nightly-pr-load:
    name: verify-nightly:pr-load (${{ matrix.revision }})
    if: github.event_name == 'workflow_dispatch' && inputs.group == 'pr-load'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the sampled merged revision
      id-token: write # access the verification cache through dev OIDC
      actions: read # read the workflow creation time
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(inputs.pr-load-revisions || '[]') }}
    env:
      REVISION: ${{ matrix.revision }}
      VERIFY_CI_STAGE: pr
      VERIFY_PROFILE: release
      VERIFY_DEADLINE_SECONDS: '1500'
      GH_EVENT: pull_request
      GH_TOKEN: ${{ github.token }}
    steps:
      - *budget
      - *checkout
      - name: Select a merged workload
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          cp libs/tools-harness-ts/scripts/ci-stage.ts "$RUNNER_TEMP/pr-tasks.ts"
          cp libs/tools-harness-ts/scripts/pr-load.sh "$RUNNER_TEMP/pr-load.sh"
          git switch --detach "$REVISION"
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          tools: bun node gh opentofu gitleaks actionlint
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Execute PR checks
        run: bash "$RUNNER_TEMP/pr-load.sh"
      - name: Retain measurements
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-load-${{ matrix.revision }}
          path: .cache/pr-load/metrics.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Confirm completion within the workflow deadline
        run: 'true'


  # The ending word. Every group ran to its own result; any group that did
  # not succeed fails the night, and the failure is filed where people look.
  verify-nightly-end:
    name: ${{ inputs.group && inputs.group != 'all' && 'verify-nightly:diagnostic' || 'verify-nightly:end' }}
    needs:
      - verify-nightly-gate
      - verify-nightly-random
      - verify-nightly-browser
      - verify-nightly-visual
      - verify-nightly-coverage
      - verify-nightly-performance
      - verify-nightly-storybook
      - verify-nightly-pr-load
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      issues: write # open or update the Verify Nightly issue
      id-token: write # mint the OIDC token Infisical trusts (Grafana metrics credentials)
      actions: read # read the workflow creation time
    env:
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
      NIGHTLY_OWNER: ${{ vars.CI_TRIAGE_OWNER || github.repository_owner }}
      NIGHTLY_GROUP: ${{ github.event_name == 'schedule' && 'all' || inputs.group || 'all' }}
      STORYBOOK_EVIDENCE_RUN: ${{ inputs.storybook-evidence-run }}
    steps:
      - *budget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          tools: bun gh infisical
      - name: verify-nightly:end
        id: verdict
        run: bun run libs/tools-harness-ts/scripts/verify-nightly-verdict.ts
      # The same verdict in every environment's Grafana: its alert pages
      # until a complete night on main is green again. Diagnostics and
      # branch rehearsals record nothing.
      - name: Record the verdict in Grafana
        env:
          PASSED: ${{ steps.verdict.outputs.passed }}
        if: ${{ always() && steps.verdict.outputs.passed != '' && github.ref == 'refs/heads/main' && env.NIGHTLY_GROUP == 'all' }}
        run: >-
          bun run apps/product-ts/scripts/ci-workflow-result.ts --workflow verify-nightly
          --passed "$PASSED"
          --envs "$(bun run libs/infra-shared-ts/scripts/workflow-env-matrix.ts | sed -n 's/^all=//p')"
      - name: Confirm completion within the workflow deadline
        run: 'true'
