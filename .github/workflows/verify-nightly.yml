name: Verify Nightly

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Verify Nightly · ${{ github.event_name == 'schedule' && 'schedule' || inputs.group && inputs.group != 'all' && format('diagnostic {0}', inputs.group) || 'manual' }}"

# Verify Nightly is the comprehensive run: everything the merge gate runs, at a
# deeper budget, plus the suites too slow or too exploratory to block a merge.
# It never gates a merge or a deploy, and no pull request waits for it.
# `bun verify-nightly` runs the same profile on a laptop.
#
# One profile decides what differs from Verify PR — the tasks, their depth,
# their budgets and whether reports are kept
# (`libs/tools-harness-ts/scripts/verify-profile.ts`). No test exists only here: a suite
# below is an existing task, and whatever it finds is pinned as a regression
# in the suite that found it, which puts it in the merge gate.
#
#   verify-nightly:gate         the whole Verify PR gate through the same
#                              sharded jobs, replaying every drawn trace of
#                              every Quint model and five times the property
#                              runs. Reports are published and kept.
#   verify-nightly:random       property runs on fresh seeds, the determinism
#                              fuzz and the scripted mutants.
#   verify-nightly:browser      every spec suite in real browsers against a
#                              booted localhost stack.
#   verify-nightly:visual       UI quality of every recorded product state,
#                              judged on the corpus the gate job produced.
#   verify-nightly:coverage     coverage of the unit suites.
#   verify-nightly:performance  hot-path benchmarks.
#   verify-nightly:end          one verdict over every group. A red group never
#                              stops another; any red group fails the run and
#                              opens or updates the `verify-nightly` issue.
#
# It runs on the newest commit of `main` every night (a schedule always runs
# the default branch) and by hand: "Run workflow", or
# `gh workflow run verify-nightly.yml --ref <branch>` to rehearse a branch.
#
# Every group keeps its log, its seeds and its evidence as CI artifacts
# (`libs/tools-harness-ts/scripts/ci-artifacts.ts`), on failure too. Each runs with dev secrets only; nothing here reads a
# production secret or deploys.

permissions:
  contents: read

on:
  schedule:
    # GitHub cron is UTC: 10:23 is 03:23 MST (04:23 MDT), while the team sleeps.
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Diagnostic group, or all for comprehensive verification
        type: choice
        options: [all, gate, random, browser, visual, coverage, performance]
        default: all

env:
  TURBO_UI: stream
  VERIFY_PROFILE: nightly
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}

# One nightly run per ref; a second waits rather than discarding a night.
concurrency:
  group: verify-nightly-${{ github.ref }}-${{ inputs.group || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.group != '' && inputs.group != 'all' }}

# Every job runs on a `boat` runner (boat.dev), and every `run:` step is bash.
defaults:
  run:
    shell: bash

jobs:
  verify-nightly-gate:
    name: verify-nightly:gate
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'gate' || inputs.group == 'visual' }}
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: ./.github/workflows/verify-pr.yml
    with:
      profile: nightly

  verify-nightly-random:
    name: verify-nightly:random
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'random' }}
    runs-on: boat
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      # Steps every suite job shares (the checkout, the toolchain with dev
      # secrets, and the pinned renderer further down) are written once and
      # aliased, the way Release shares its deploy steps.
      - &checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - &setup
        uses: ./.github/actions/setup
        with:
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # The log holds every seed drawn and the replay command of a failure;
      # `apps/product-ts/.cache/randomized/` keeps the seeds as files.
      - name: verify-nightly:random
        timeout-minutes: 170
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:random
      - name: Retain seeds and the run summary
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-nightly-random-${{ github.run_id }}
          apps/product-ts/.cache/randomized '.turbo/runs/*.json'

  verify-nightly-browser:
    name: verify-nightly:browser
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'browser' }}
    runs-on: boat
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup
      - &renderer
        uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      - name: verify-nightly:browser
        timeout-minutes: 320
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:browser
      # Step timelines, screenshots, recordings and traces of every scenario.
      - name: Retain browser reports and traces
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-nightly-browser-${{ github.run_id }}
          '.turbo/runs/*.json' 'apps/*/.cache/harness-report' 'libs/*/.cache/harness-report' 'pkgs/*/.cache/harness-report'

  # Judges the snapshots the gate job's spec parts recorded, restored from
  # the remote cache, so it waits for that job and runs whatever its result.
  verify-nightly-visual:
    name: verify-nightly:visual
    needs: [verify-nightly-gate]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'visual') }}
    runs-on: boat
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup
      - *renderer
      # The pinned model is larger than the remote cache's artifact limit.
      - name: Prepare the visual model
        timeout-minutes: 20
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts @apps/product-ts#prepare:ui-quality-model
      - name: verify-nightly:visual
        timeout-minutes: 150
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:visual
      # Scores, failing screenshots and context clips.
      - name: Retain the visual report
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-nightly-visual-${{ github.run_id }}
          '.turbo/runs/*.json' apps/product-ts/.cache/ui-quality apps/product-ts/.cache/harness-report/ui-quality

  verify-nightly-coverage:
    name: verify-nightly:coverage
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'coverage' }}
    runs-on: boat
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup
      - name: verify-nightly:coverage
        timeout-minutes: 110
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:coverage
      - name: Retain the coverage report
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-nightly-coverage-${{ github.run_id }}
          .cache/coverage '.turbo/runs/*.json'

  verify-nightly-performance:
    name: verify-nightly:performance
    if: ${{ github.event_name == 'schedule' || !inputs.group || inputs.group == 'all' || inputs.group == 'performance' }}
    runs-on: boat
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup
      # The log is the result: each benchmark prints its own measurements,
      # and nothing else in this step prints, so the log is kept as a file.
      - name: verify-nightly:performance
        timeout-minutes: 50
        env:
          TURBO_OUTPUT_LOGS: full
        run: |
          set -o pipefail
          mkdir -p .cache/verify-nightly
          bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify-nightly:performance 2>&1 | tee .cache/verify-nightly/performance.log
      - name: Retain the benchmark results
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-nightly-performance-${{ github.run_id }}
          .cache/verify-nightly/performance.log '.turbo/runs/*.json'

  # The ending word. Every group ran to its own result; any group that did
  # not succeed fails the night, and the failure is filed where people look.
  verify-nightly-end:
    name: ${{ inputs.group && inputs.group != 'all' && 'verify-nightly:diagnostic' || 'verify-nightly:end' }}
    needs:
      - verify-nightly-gate
      - verify-nightly-random
      - verify-nightly-browser
      - verify-nightly-visual
      - verify-nightly-coverage
      - verify-nightly-performance
    if: always() && !cancelled()
    runs-on: boat
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
      NIGHTLY_GROUP: ${{ github.event_name == 'schedule' && 'all' || inputs.group || 'all' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          tools: bun gh
      - name: verify-nightly:end
        run: bun run libs/tools-harness-ts/scripts/verify-nightly-verdict.ts
