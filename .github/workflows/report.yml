name: Report

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Report · ${{ 'manual' }}"

# Report: what does every spec do? `bun check:report` dispatches this instead
# of running the suites on a laptop. It runs every spec part with UI snapshots
# (`HARNESS_FRAMES=1`; a cache entry of its own that Check never fills, so the
# first run of a commit is cold) and publishes each part to the shared reports
# store (one R2 bucket, keyed by commit sha; libs/harness/scripts/report-publish.ts)
# the moment its shard finishes. Every deployment's API reads that store, so
# the report is at `/reports/<sha>` on any of them and fills in live:
#
#   report:matrix   one shard per spec part, from a job with no secrets
#   report:open     the commit's record and snapshot stylesheet, first
#   report:shard    shard k runs `test:spec:<k>` of every package (cache hits
#                   restore their buckets, misses run) and publishes them
#   report:close    mark the commit complete, then fail if a shard did
#
# The bucket and its credentials are declared in libs/infra/tofu (`reports`
# in global.tfvars.json; the fleet and foundation stacks).

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      frames:
        description: UI snapshots on every step; off gives step timelines only
        type: boolean
        default: true

env:
  TURBO_UI: stream

concurrency:
  group: report-${{ github.sha }}-${{ inputs.frames }}
  cancel-in-progress: true

jobs:
  report-matrix:
    name: report:matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: parts
        id: parts
        run: bun run libs/tools/scripts/report-matrix.ts >> "$GITHUB_OUTPUT"

  report-open:
    name: report:open
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      FRAMES: ${{ inputs.frames }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: open
        run: |
          flag=""
          if [ "$FRAMES" != "true" ]; then flag="--no-frames"; fi
          # shellcheck disable=SC2086 # empty or one flag
          bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/harness/scripts/report-publish.ts open $flag

  report-shard:
    name: report:shard
    needs: report-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One red shard should not hide another's report.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.report-matrix.outputs.parts) }}
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      FRAMES: ${{ inputs.frames }}
      PART: ${{ matrix.part }}
      # A cold run with snapshots outlasts the Check gate's deadline.
      CHECK_DEADLINE_SECONDS: 2400
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: suites
        timeout-minutes: 40
        run: |
          # Snapshots are an env value of their own in every part's cache key,
          # so unset (not empty) when off: that reuses Check's cache entries.
          if [ "$FRAMES" = "true" ]; then export HARNESS_FRAMES=1; fi
          bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/tools/scripts/turbo-ci-run.ts --restore-outputs "test:spec:${PART}"

      # Published even when a suite is red: the report shows what failed.
      - name: publish
        if: always()
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/harness/scripts/report-publish.ts source "part-${PART}"

  report-close:
    name: report:close
    needs: [report-matrix, report-open, report-shard]
    if: always() && needs.report-open.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: close
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/harness/scripts/report-publish.ts close

      # The report is published even when a suite is red; the run still is.
      - name: verdict
        env:
          SHARDS: ${{ needs.report-shard.result }}
        run: test "$SHARDS" = success
