name: Verify PR
run-name: "Verify PR · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || 'manual' }}"

# Verify PR runs the gate (README "Verification and CI") at one of two
# depths (`libs/tools-harness-ts/scripts/verify-profile.ts`):
# - `release`, on every pull request and from Release on the exact commit it
#   ships: the whole gate, the Gherkin spec parts, Quint models, contract
#   models and release journeys included. A pull request runs exactly what
#   Release runs, so it is red whenever Release would be, and every task it
#   passes has the hash Release restores from the shared remote cache.
# - `nightly`, from Verify Nightly: the whole gate deeper, with reports.
#
# Three jobs, on GitHub-hosted `ubuntu-24.04` runners. `verify:start` plans the
# shards, `verify:shards (N)` run them with fail-fast off, and `verify:end` has
# the ending word: one verdict that names every failure. The jobs keep the
# `verify:` prefix wherever the gate runs, so `verify:end` is the one required
# status and its name never moves.
#
# Packages declare the platforms they build for (docs/POLYGLOT.md). CI
# verifies every package but the native (Swift) ones, which `bun verify`
# checks on a host that builds them.
#
# Only uncached work starts a runner. `verify:start` asks the remote cache about
# every task, packs the misses into as many shards as their measured durations
# need, and records the cached verdicts itself. A fully cached run is the start
# and the end, with no shard at all.
#
# It runs on every pull request, where `verify:end` is the required status. A
# green pull request is mergeable; Release runs the same gate again on
# `main` before anything ships, restoring what the pull request proved. It
# also runs from a manual dispatch, from Release (`workflow_call`), and from
# Verify Nightly. `bun verify` runs the whole gate locally.
#
# The `release` profile is bounded and never explores: each Quint model
# replays the fewest drawn traces that take every bound action, the same ones
# every run. It keeps no test report: no JUnit
# file, no trace, snapshot or coverage upload, no publication. A failure is
# read from the job log and the run summary. The CI artifacts below
# (`libs/tools-harness-ts/scripts/ci-artifacts.ts`, in the CI artifacts
# bucket, not GitHub's artifact storage) carry the plan, the shard verdicts
# and build outputs from one job to the next, and `verify:end` deletes them.
# Every report step is the `nightly` profile's.

# Least privilege: read the code and run metadata. Each job adds the OIDC
# token the secrets backend trusts. A pull request from a fork gets neither
# OIDC nor secrets (GitHub withholds both), so its run stops at setup with the
# reason.
permissions:
  contents: read # check out the code
  actions: read # read run state (gh run list, job metadata)
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      shards:
        description: Most shards a run may start
        type: choice
        options: [8, 12, 16, 24, 32, 40, 48, 64]
        default: 64
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold (cold forces execution without deleting remote caches)
        type: choice
        options: [normal, cold]
        default: normal
  workflow_call:
    inputs:
      require-main:
        description: Refuse a release from any ref other than main
        type: boolean
        default: false
      shards:
        description: Most shards a run may start
        type: number
        default: 64
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold
        type: string
        default: normal
      profile:
        description: release (the whole gate, on every pull request and before Release ships) or nightly (deeper budgets, reports kept)
        type: string
        default: release
      advisories:
        description: enforce (a current advisory fails the gate) or report (the registry's verdict is logged, not enforced)
        type: string
        default: enforce

# A newer push supersedes a pull request's run; dispatched and release runs
# each own a group and never cancel one another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.pull_request.number) || format('verify-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  TURBO_UI: stream
  TURBO_CACHE_DIR: .turbo/cache
  RAYON_NUM_THREADS: 1
  VERIFY_LINT_THREADS: 1
  VERIFY_TEST_CONCURRENCY: 1
  GOMAXPROCS: 1
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
  JVM_GC_ARGS: -XX:+UseParallelGC -Xmx2048m -Xms512m
  MODEL_VERIFY_CONCURRENCY: 2
  VERIFY_SOLVER_SLOTS: 1
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
  GH_EVENT: ${{ github.event_name }}
  PR_BASE: ${{ github.event.pull_request.base.sha }}
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  # A cap, not the count. The plan sizes shards to the work: each holds at
  # least three times a shard's setup (`VERIFY_SHARD_SETUP_SECONDS`, 30 s)
  # and no less than the longest indivisible task group, and it starts no
  # more than the cap unless the shard deadline needs more
  # (libs/tools-harness-ts/scripts/verify-plan.ts). The log's `shards:` line
  # says why.
  # Forty left a cold corpus — every cache missed — packed past the 1200s
  # shard deadline once each solver had a runner of its own (Verify run
  # 38328597240); sixty-four keeps that pack inside the deadline.
  VERIFY_SHARDS: ${{ inputs.shards || vars.VERIFY_SHARDS || '64' }}
  VERIFY_CONCURRENCY: ${{ inputs.concurrency || vars.VERIFY_CONCURRENCY || '1' }}
  VERIFY_CACHE_MODE: ${{ inputs.cache-mode || 'normal' }}
  VERIFY_PROFILE: ${{ inputs.profile || 'release' }}
  VERIFY_ADVISORIES: ${{ inputs.advisories || 'enforce' }}

# Every job runs on a GitHub-hosted `ubuntu-24.04` runner, and every `run:` step is bash.
defaults:
  run:
    shell: bash

jobs:
  verify-start:
    name: verify:start
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: ${{ inputs.profile == 'nightly' && 70 || 30 }}
    # One entry per shard with work, naming none of them: GitHub drops a job
    # output that contains a masked secret, and one dev secret is the digit 1.
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Validate release branch
        if: ${{ inputs.require-main }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release ships refs/heads/main only (got ${GITHUB_REF})."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: bun opentofu
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      # The plan fingerprints the renderer; browser shards must match it.
      # Chrome normally installs in well under a minute. Two minutes is the
      # hard cap so a hung download cannot spend the shard's budget.
      - uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      # Shards are packed by the durations the newest run of this profile
      # measured on these runners (`verify:end` saves them); the key never
      # matches, so the prefix restores the newest from this pull request,
      # else from main. Each profile keeps its own: a save keeps only the tasks
      # its plan held, so a narrower plan sharing the key would erase the
      # rest.
      - name: Restore measured task durations
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/verify-ci/measured-costs.json
          key: verify-task-costs-v2-${{ env.VERIFY_PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verify-task-costs-v2-${{ env.VERIFY_PROFILE }}-
      - name: Plan all owners once
        id: plan
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/verify-plan.ts
      - name: Export immutable plan
        run: bun run libs/tools-harness-ts/scripts/verify-plan-transfer.ts --export
      # Transfer artifacts carry state between this run's jobs and are not
      # reports: `verify:end` deletes them, and the bucket expires what a
      # cancelled run left after a week. The nightly profile keeps them,
      # failed reports included.
      - name: Upload immutable plan
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-plan
          .cache/verify-ci/plan.payload
      # A shard with nothing to execute starts no runner; its cached verdicts
      # travel from here to `verify:end`.
      - name: Transfer cached shard verdicts
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-results-cached
          '.cache/verify-ci/cached/results-*.tar.gz'
      - name: Transfer cached shard evidence
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-evidence-cached
          '.cache/verify-ci/cached/evidence-*.tar.gz'
      # A failed build is recorded in this shard's verdict, which `verify:end`
      # reports; the shards still run so one red build does not hide every
      # other failure.
      - name: Build shared prerequisites and warm their cache
        continue-on-error: true
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$VERIFY_CONCURRENCY" bun run libs/tools-harness-ts/scripts/verify-shard-run.ts "$VERIFY_SHARDS"
      - name: Transfer prerequisite outputs
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-evidence-"${VERIFY_SHARDS}"
          .cache/verify-ci/evidence-"${VERIFY_SHARDS}".tar.gz

      - name: Transfer prerequisite verdict
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-results-"${VERIFY_SHARDS}"
          .cache/verify-ci/results-"${VERIFY_SHARDS}".tar.gz

  # Shard N is the Nth entry of the matrix `verify:start` planned.
  verify-shards:
    name: verify:shards (${{ strategy.job-index }})
    needs: [verify-start]
    # An empty matrix is an error, so a fully cached plan skips the job.
    if: needs.verify-start.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: ${{ inputs.profile == 'nightly' && 70 || 30 }}
    strategy:
      fail-fast: false
      # GitHub's free plan runs 20 jobs at once across every workflow, and
      # queues the rest in no particular order. A run that queues all its
      # shards at once holds other runs' `verify:start` and `verify:end`
      # behind them. Holding four slots back, and queuing the next shard only
      # as one finishes, lets a small run through between a large run's
      # shards. `VERIFY_MAX_PARALLEL` is the concurrent-job limit minus four.
      max-parallel: ${{ fromJSON(vars.VERIFY_MAX_PARALLEL || '16') }}
      matrix:
        shard: ${{ fromJSON(needs.verify-start.outputs.shards) }}
    env:
      VERIFY_SHARD: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: --include-lazy
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Download immutable plan
        run: bun run libs/tools-harness-ts/scripts/ci-artifacts.ts download verify-plan .cache/verify-ci
      - name: Restore immutable plan and required prerequisites
        run: bun run libs/tools-harness-ts/scripts/verify-stage-transfer.ts
      - name: Select browser tasks
        id: browser
        run: bun run libs/tools-harness-ts/scripts/verify-browser-tasks.ts
      - name: Install renderer for browser tasks
        if: steps.browser.outputs.needed == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/visual-renderer
      - name: verify
        timeout-minutes: ${{ inputs.profile == 'nightly' && 60 || 25 }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$VERIFY_CONCURRENCY" bun run libs/tools-harness-ts/scripts/verify-shard-run.ts "$VERIFY_SHARD"
      # Reports are the nightly profile's; the `release` profile keeps none. One
      # artifact per shard every night, kept for the bucket's week.
      - name: Upload queryable trace artifacts
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload observability-traces-"${GITHUB_RUN_ID}-${VERIFY_SHARD}"
          'apps/*/.cache/harness-report/*/traces/*.ndjson' 'libs/*/.cache/harness-report/*/traces/*.ndjson' 'pkgs/*/.cache/harness-report/*/traces/*.ndjson'
      - name: Upload turbo run summary
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload turbo-summary-"${GITHUB_RUN_ID}-${VERIFY_SHARD}"
          '.turbo/runs/*.json'
      # Transfer verdicts and the exact cache artifacts consumers need; the
      # nightly profile adds failed reports.
      - name: Transfer raw evidence
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-evidence-"${VERIFY_SHARD}"
          .cache/verify-ci/evidence-"${VERIFY_SHARD}".tar.gz

      - name: Transfer shard verdict
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-results-"${VERIFY_SHARD}"
          .cache/verify-ci/results-"${VERIFY_SHARD}".tar.gz

  # The ending word, and the only required status on a pull request; Release
  # consumes this verdict. It runs after red shards too: the fan-in suites
  # report their own failures, then one verdict names every suite and every
  # failing task. A missing, failed or cancelled job fails it; skipped shards
  # pass only when the plan scheduled none. The nightly profile's reports are
  # published last and never decide it.
  verify-end:
    name: verify:end
    needs: [verify-start, verify-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      actions: read # read run state (gh run list, job metadata)
      id-token: write # mint the OIDC token Infisical and AWS trust
    timeout-minutes: ${{ inputs.profile == 'nightly' && 110 || 50 }}
    steps:
      # The reports are filed under the pull request's head, whose specs are
      # read from Git; the default checkout holds only the merge commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Download immutable plan
        run: bun run libs/tools-harness-ts/scripts/ci-artifacts.ts download verify-plan .cache/verify-ci
      # Does nothing when the plan left the fan-in stage nothing to execute.
      - name: Run fan-in consumers
        timeout-minutes: ${{ inputs.profile == 'nightly' && 60 || 25 }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$VERIFY_CONCURRENCY" bun run libs/tools-harness-ts/scripts/verify-consumers.ts
      # What Release would apply, planned against the real state for this merge
      # result, on a pull request that changes the infrastructure. Some
      # configuration errors only a plan finds (a `removed` block whose
      # resource is still in state, a project the provider cannot find); each
      # failed Release after the pull request had passed. Read-only: the plan
      # applies nothing and the AWS role it uses cannot mutate. They run after
      # the fan-in consumers so those still report, and each runs when the
      # other failed so one red plan does not hide the other.
      - name: Find infrastructure changes
        id: infra
        if: always() && !cancelled() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet "$PR_BASE...$PR_HEAD" -- libs/infra-shared-ts libs/infra-server-ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the fleet stack
        if: always() && !cancelled() && steps.infra.outputs.changed == 'true'
        timeout-minutes: 15
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:fleet
      # Foundation also reads AWS. Bootstrap sets the variable in the same
      # apply that lets the read-only role trust a pull request.
      - name: Plan dev's foundation stack
        if: always() && !cancelled() && steps.infra.outputs.changed == 'true' && vars.INFRA_PLAN_ON_PULL_REQUEST == 'true'
        timeout-minutes: 15
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run --filter @libs/infra-server-ts plan:foundation
      - name: Upload queryable trace artifacts
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload observability-traces-"${GITHUB_RUN_ID}"-consumers
          'apps/*/.cache/harness-report/*/traces/*.ndjson' 'libs/*/.cache/harness-report/*/traces/*.ndjson' 'pkgs/*/.cache/harness-report/*/traces/*.ndjson'
      - name: Upload turbo run summary
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload turbo-summary-"${GITHUB_RUN_ID}"-consumers
          '.turbo/runs/*.json'
      - name: Transfer raw evidence
        if: always() && !cancelled()
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-evidence-consumers
          '.cache/verify-ci/evidence-*.tar.gz'
      # Only the small verdicts: the evidence is gigabytes of snapshots.
      - name: Transfer shard verdicts
        if: always() && !cancelled()
        run: bun run libs/tools-harness-ts/scripts/verify-artifact-download.ts verify-results- .cache/verify-ci/transfers verdict || echo "::warning::No shard verdicts to aggregate"
      - name: Summarize every suite
        if: always() && !cancelled()
        env:
          START_RESULT: ${{ needs.verify-start.result }}
          SHARD_RESULT: ${{ needs.verify-shards.result }}
        run: bun run libs/tools-harness-ts/scripts/verify-verdict.ts
      # A red run still measured every task that passed.
      - name: Save measured task durations
        if: always() && !cancelled() && hashFiles('.cache/verify-ci/measured-costs.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/verify-ci/measured-costs.json
          key: verify-task-costs-v2-${{ env.VERIFY_PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Everything below is the nightly profile's reporting. The `release` profile
      # ends by deleting the artifacts that carried state between its jobs.
      - name: Retain the verdict
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-verdict
          .cache/verify-ci/verdict.json .cache/verify-ci/verdict.md .cache/verify-ci/verdict.junit.xml
      # Publication never changes the verdict above. Health's `health:cleanup`
      # prunes stale reports.
      - name: Aggregate and publish bounded evidence
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        continue-on-error: true
        timeout-minutes: 40
        run: bun run libs/secrets-server-ts/scripts/secrets-run.ts -- bun run libs/tools-harness-ts/scripts/verify-reports.ts
      - name: Retain sanitized planning and timing details
        if: always() && !cancelled() && env.VERIFY_PROFILE == 'nightly'
        run: >-
          bun run libs/tools-harness-ts/scripts/ci-artifacts.ts upload verify-ci-details
          .cache/verify-ci/plan.json .cache/verify-ci/planning.json .cache/verify-ci/profile.json '.cache/verify-ci/results/*.json'
      - name: Delete transfer artifacts
        if: always() && !cancelled() && env.VERIFY_PROFILE != 'nightly'
        run: bun run libs/tools-harness-ts/scripts/ci-artifacts.ts delete verify-
