name: Verify PR
run-name: "Verify PR · ${{ format('pr #{0}', github.event.pull_request.number) }}"
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read # check out the proposed change

env:
  GH_TOKEN: ${{ github.token }}
  TURBO_UI: stream
  TURBO_CACHE_DIR: .turbo/cache
  RAYON_NUM_THREADS: 1
  VERIFY_LINT_THREADS: 1
  VERIFY_TEST_CONCURRENCY: 1
  GOMAXPROCS: 1
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
  GH_EVENT: ${{ github.event_name }}
  PR_BASE: ${{ github.event.pull_request.base.sha }}
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  VERIFY_PROFILE: release
  VERIFY_CI_STAGE: pr

defaults:
  run:
    shell: ci-budget-shell {0}  # zizmor: ignore[misfeature] -- invokes bash with the remaining workflow budget

jobs:
  verify-end:
    name: verify:end
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read # check out the proposed change
      actions: read # read the workflow deadline
      id-token: write # authenticate to the dev verification secret store
    steps:
      - name: Check remaining workflow time
        id: budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Reserve ten seconds for checkout cleanup and verdict publication.
          STAGE_SECONDS: '170'
        run: |
          set -euo pipefail
          read_created() { timeout 10 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at; }
          created=$(read_created) || {
            status=$?
            (( status == 124 )) || exit "$status"
            created=$(read_created)
          }
          created_epoch=$(date -d "$created" +%s)
          deadline=$(( created_epoch + STAGE_SECONDS ))
          remaining=$(( deadline - $(date +%s) ))
          if (( remaining <= 0 )); then
            message="Verification incomplete at job admission: $(( STAGE_SECONDS - remaining ))s elapsed since workflow creation (budget: ${STAGE_SECONDS}s)."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI_STAGE_DEADLINE=$deadline" >> "$GITHUB_ENV"
          echo "utc_day=$(( created_epoch / 86400 ))" >> "$GITHUB_OUTPUT"
          echo "minutes=$(( (remaining + 59) / 60 ))" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ci-budget"
          cat > "$RUNNER_TEMP/ci-budget/ci-budget-shell" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          remaining=$(( CI_STAGE_DEADLINE - $(date +%s) ))
          if (( remaining <= 1 )); then
            echo "::error::The workflow deadline expired."
            exit 124
          fi
          exec timeout --kill-after=1 "$(( remaining - 1 ))" bash --noprofile --norc -eo pipefail "$@"
          SH
          chmod +x "$RUNNER_TEMP/ci-budget/ci-budget-shell"
          echo "$RUNNER_TEMP/ci-budget" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether the PR needs workspace dependencies
        id: scope
        run: |
          result=0
          git diff --quiet --no-renames "$PR_BASE...$PR_HEAD" -- . ':!README.md' ':!AGENTS.md' ':(exclude,glob)docs/**/*.md' || result=$?
          case "$result" in
            0) echo "docs=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "docs=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - uses: ./.github/actions/setup
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          product-identity-json: ${{ vars.PRODUCT_IDENTITY_JSON }}
          workspace: ${{ steps.scope.outputs.docs != 'true' }}
          tools: ${{ steps.scope.outputs.docs == 'true' && 'bun gitleaks' || 'bun node gitleaks actionlint' }}
          secrets-environment: dev
          secrets-identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          secrets-project-id: ${{ vars.SECRETS_PROJECT_ID }}
      - name: Check branding in changed package research
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -o pipefail
          export VERIFY_BRAND_IDENTITY_JSON="${PRODUCT_IDENTITY_JSON:-}"
          git diff --no-renames --diff-filter=AMT --name-only -z "$PR_BASE...$PR_HEAD" -- \
            ':(glob)apps/**/MARKET_RESEARCH.md' ':(glob)libs/**/MARKET_RESEARCH.md' ':(glob)pkgs/**/MARKET_RESEARCH.md' |
            xargs -0 -r bun libs/tools-harness-ts/scripts/verify-brand-policy.ts
      - name: Run the pull request gate
        env:
          VERIFY_DEADLINE_SECONDS: '120'
          DOCS_ONLY: ${{ steps.scope.outputs.docs }}
        run: |
          if [[ "$DOCS_ONLY" == true ]]; then
            exec bun libs/tools-harness-ts/scripts/verify-secrets.ts
          fi
          exec bun run libs/secrets-server-ts/scripts/secrets-run.ts --fixture -- bun run libs/tools-harness-ts/scripts/turbo-ci-run.ts verify:ci
      - name: Confirm completion within the workflow deadline
        run: 'true'
