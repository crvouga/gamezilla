name: Preview

# Run title, identical shape in every workflow (enforced by
# libs/tools-harness-ts/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Preview · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || github.event_name == 'schedule' && 'schedule' || 'manual' }}"

# Every pull request gets the web bundle as its own Cloudflare Worker Preview
# (`pr-<number>`): static files only, with the whole system — API servers,
# Postgres, rooms, simulated vendors — running in the visitor's browser
# (`apps/harness-ts`). No Worker script, no Durable Object, no secret is deployed.
# Beside it, under the same name, the pull request's Storybook: a Preview of
# the Storybook site's Worker (`apps/storybook-ts`), with the same lifecycle.
# It is built (or restored from the Turborepo cache) and uploaded while the
# harness uploads, so it never holds the harness Preview back.
# - opened, reopened, new commit: build, check the bundle, upload, check again.
# - push to main: the same build, deployed as the Worker itself, which is what
#   `preview.<domain>` serves; pull requests are `pr-<number>.preview.<domain>`.
#   Storybook Previews are `pr-<number>.storybook.<domain>`; the Storybook site
#   itself is the Release workflow's to deploy, never this one's.
# - closed or merged: delete the Preview and confirm Cloudflare reports it gone.
# - schedule: remove Previews whose pull request is closed or went quiet.
# Each step is one command of apps/preview-ts/scripts/preview.ts, the same
# program `mise run preview:<command>` runs on a laptop. See
# docs/PREVIEW_ENVIRONMENTS.md.
#
# A pull request from a fork is skipped: GitHub withholds OIDC and secrets from
# it, and its code never runs beside the Cloudflare credential.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per pull request. A newer commit cancels the run for the
# one before it, so the latest is what gets built, at once; a run re-reads the
# head before it uploads, so an older commit never replaces a newer one. The
# main branch's deploy and the sweep are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'preview-main' || 'preview-sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: preview
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read # check out the code
      id-token: write # the OIDC token the secrets backend trusts
      pull-requests: write # the preview section of the pull request description
      deployments: write # deployment statuses for the preview environment
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Nothing below waits for anything it does not need. A checkout, then
      # the tools, then the dependencies, each after the one before, was a
      # third of every deploy; here the three run side by side, and the
      # secrets are fetched while the dependencies still install.
      #
      # - The checkout is the head itself, not the merge with main: the
      #   deployed commit is the one the pull request shows. It never fetches
      #   or writes the reference screenshots (four fifths of the
      #   repository), and it writes the package manifests first, which is
      #   all the install reads. The repository is public, so it needs no
      #   token and leaves none in `.git/config`.
      # - The tools are the versions `mise.toml` pins, installed by a mise
      #   binary held to its published checksum.
      # - The install runs no script of any dependency and none of the
      #   repository's postinstall generation, and it starts before any secret
      #   is in the environment. The build generates the derived files a
      #   bundle reads, and only those.
      - name: Start the checkout, the tools and the install side by side
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MISE_VERSION: 2026.9.13
          MISE_SHA256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
        run: |
          export BOOT="$RUNNER_TEMP/boot"
          mkdir -p "$BOOT"
          cat > "$BOOT/checkout.sh" <<'SH'
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --depth=1 --filter=blob:none origin "$PREVIEW_SHA"
          git sparse-checkout set --no-cone /mise.toml /bun.lock /bunfig.toml /package.json '/apps/*/package.json' '/libs/*/package.json' '/pkgs/*/package.json'
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          touch "$BOOT/manifests"
          git sparse-checkout set --no-cone '/*' '!**/baselines/**'
          SH
          cat > "$BOOT/install.sh" <<'SH'
          set -euo pipefail
          curl -fsSL --retry 3 -o "$BOOT/mise" "https://github.com/jdx/mise/releases/download/v$MISE_VERSION/mise-v$MISE_VERSION-linux-x64"
          echo "$MISE_SHA256  $BOOT/mise" | sha256sum --check --quiet
          chmod +x "$BOOT/mise"
          until [ -e "$BOOT/manifests" ]; do
            [ ! -e "$BOOT/checkout.code" ] || exit 1
            sleep 0.1
          done
          cd "$GITHUB_WORKSPACE"
          export MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE" MISE_YES=1
          "$BOOT/mise" install bun node
          "$BOOT/mise" bin-paths bun node > "$BOOT/paths"
          touch "$BOOT/tools"
          PATH="$(paste -sd: "$BOOT/paths"):$PATH"
          bun install --frozen-lockfile --ignore-scripts
          SH
          for part in checkout install; do
            nohup bash -c "bash '$BOOT/$part.sh'; echo \$? > '$BOOT/$part.code'" > "$BOOT/$part.log" 2>&1 < /dev/null &
          done
      - name: Wait for the checkout and the tools
        run: |  # zizmor: ignore[github-env] -- the paths of the tools mise just installed
          BOOT="$RUNNER_TEMP/boot"
          timeout 300 bash -c "until [ -e '$BOOT/checkout.code' ] && { [ -e '$BOOT/tools' ] || [ -e '$BOOT/install.code' ]; }; do sleep 0.1; done" || true
          cat "$BOOT/checkout.log"
          [ "$(cat "$BOOT/checkout.code")" = 0 ]
          [ -e "$BOOT/tools" ] || { cat "$BOOT/install.log"; exit 1; }
          cat "$BOOT/paths" >> "$GITHUB_PATH"
      - name: Inject secrets
        uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Wait for the install and name the build's identity
        env:
          REPOSITORY_IDENTITY_JSON: ${{ vars.PRODUCT_IDENTITY_JSON }}
          PRODUCT_IDENTITY_MODE: configured
        run: |
          BOOT="$RUNNER_TEMP/boot"
          timeout 600 bash -c "until [ -e '$BOOT/install.code' ]; do sleep 0.1; done" || true
          cat "$BOOT/install.log"
          [ "$(cat "$BOOT/install.code")" = 0 ]
          bun run libs/secrets-server-ts/scripts/export-product-identity.ts
      # One command for the whole of it (decide, build, upload, check; or
      # remove; or sweep), so nothing waits on a step boundary: the pull
      # request is told while the bundle builds.
      - name: Deploy, remove or sweep
        run: |
          bun run libs/tools-harness-ts/scripts/materialize-product-identity.ts
          bun run apps/preview-ts/scripts/preview.ts ci run
      - name: Report a run that failed before the upload
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: bun run apps/preview-ts/scripts/preview.ts ci failed
