name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate router types
        run: bunx expo customize tsconfig.json

      - name: Type check
        run: bun run tc

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  assert-deploy-ready:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require AWS Actions secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: bun run scripts/ci.ts require-aws-secrets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Assert AWS caller identity
        run: bun run scripts/ci.ts assert-aws

      # Gate waits for a stable stack; it does not call CancelUpdateStack.
      - name: CloudFormation deploy gate
        run: bun run scripts/ci.ts gate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, assert-deploy-ready]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate router types
        run: bunx expo customize tsconfig.json

      - name: Assert stack still deployable immediately before CDK
        run: bun run scripts/ci.ts pre-cdk

      - name: CDK deploy
        timeout-minutes: 45
        run: bun run scripts/ci.ts cdk-deploy

      - name: Read CDK outputs
        id: cdk
        run: bun run scripts/ci.ts read-cdk-outputs

      - name: Build and deploy web app
        env:
          SYNC_URL: ${{ steps.cdk.outputs.sync_url }}
          WEB_BUCKET: ${{ steps.cdk.outputs.web_bucket }}
          WEB_DIST: ${{ steps.cdk.outputs.web_dist }}
        run: bun run scripts/ci.ts deploy-web

      - name: Build and deploy sim-viz
        env:
          VIZ_BUCKET: ${{ steps.cdk.outputs.viz_bucket }}
          VIZ_DIST: ${{ steps.cdk.outputs.viz_dist }}
        run: bun run scripts/ci.ts deploy-viz

      - name: Deployment summary
        env:
          CI_WEB_URL: ${{ steps.cdk.outputs.web_url }}
          CI_VIZ_URL: ${{ steps.cdk.outputs.viz_url }}
          CI_SYNC_URL: ${{ steps.cdk.outputs.sync_url }}
          CI_NAMESERVERS: ${{ steps.cdk.outputs.nameservers }}
        run: bun run scripts/ci.ts write-deploy-summary
