name: Check
run-name: "Check · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || 'manual' }}"

# Check is the release gate (README "Checks and CI"): every package gate —
# lint, architecture boundaries, typecheck, unit tests, Gherkin specs, contract
# suites, Quint models, schema evolution, bundles, security scans.
# Duration-balanced shards, fail-fast off, then `check:verify` aggregates every
# failure into one summary.
#
# Only uncached work starts a runner. `check:plan` asks the remote cache about
# every task, packs the misses into as many shards as their measured durations
# need, and records the cached verdicts itself; `check:schedule` hands the
# workflow the shards that have work. A fully cached run is the plan and the
# verdict, with no shard at all.
#
# It runs on every pull request, where the `check` job is the required status:
# a green pull request is releasable, and merging it deploys. It also runs from
# a manual dispatch and from Deploy (`workflow_call`) on the exact commit it
# ships. `bun check` and `bun verify` run the same gate locally.
#
# The gate is bounded and never explores: each Quint model replays the fewest
# drawn traces that take every bound action, the same ones every run. The
# Nightly workflow calls this one with `explore` to replay every trace.

permissions:
  contents: read
  actions: write
  id-token: write
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      shards:
        description: Most shards a run may start
        type: choice
        options: [8, 12, 16, 24, 32, 40, 48, 64]
        default: 40
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold (cold forces execution without deleting remote caches)
        type: choice
        options: [normal, cold]
        default: normal
  workflow_call:
    inputs:
      shards:
        description: Most shards a run may start
        type: number
        default: 40
      concurrency:
        description: Turbo slots per shard
        type: number
        default: 1
      cache-mode:
        description: normal or cold
        type: string
        default: normal
      explore:
        description: Replay every drawn trace of every Quint model
        type: boolean
        default: false

# A newer push supersedes a pull request's run; dispatched and release runs
# each own a group and never cancel one another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  TURBO_UI: stream
  TURBO_CACHE_DIR: .turbo/cache
  RAYON_NUM_THREADS: 1
  CHECK_LINT_THREADS: 1
  CHECK_TEST_CONCURRENCY: 1
  GOMAXPROCS: 1
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
  JVM_GC_ARGS: -XX:+UseParallelGC -Xmx2048m -Xms512m
  MODEL_CHECK_CONCURRENCY: 2
  CHECK_SOLVER_SLOTS: 1
  SECRETS_ENV: dev
  SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
  GH_EVENT: ${{ github.event_name }}
  PR_BASE: ${{ github.event.pull_request.base.sha }}
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  CHECK_SHARDS: ${{ inputs.shards || vars.CHECK_SHARDS || '40' }}
  CHECK_CONCURRENCY: ${{ inputs.concurrency || vars.CHECK_CONCURRENCY || '1' }}
  CHECK_CACHE_MODE: ${{ inputs.cache-mode || 'normal' }}
  # Empty is the gate's bounded default (`@pkgs/quint-shared/wall`); only a
  # caller that asks to explore replays every trace.
  QUINT_REPLAY_TRACES: ${{ inputs.explore && 'all' || '' }}

jobs:
  check-plan:
    name: check:plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: bun opentofu
      # The plan fingerprints the renderer; browser shards must match it.
      # Chrome normally installs in well under a minute. Two minutes is the
      # hard cap so a hung download cannot spend the shard's budget.
      - uses: ./.github/actions/visual-renderer
        timeout-minutes: 2
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      # Shards are packed by the durations the newest Check measured on these
      # runners (`check:verify` saves them); the key never matches, so the
      # prefix restores the newest from this pull request, else from main. An
      # exploring run takes far longer per spec part, so it keeps its own.
      - name: Restore measured task durations
        uses: actions/cache/restore@v5
        with:
          path: .cache/check-ci/measured-costs.json
          key: check-task-costs-v1-${{ inputs.explore && 'explore' || 'gate' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-task-costs-v1-${{ inputs.explore && 'explore' || 'gate' }}-
      - name: Plan all owners once
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/tools/scripts/check-plan.ts
      - name: Export immutable plan
        run: bun run libs/tools/scripts/check-plan-transfer.ts --export
      - name: Upload immutable plan
        uses: actions/upload-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci/plan.payload
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: 7
      # Shard indexes only. It is an artifact, not a job output: this job
      # holds masked secrets, and GitHub suppresses an output beside them.
      - name: Upload the shard schedule
        uses: actions/upload-artifact@v6
        with:
          name: check-schedule
          path: .cache/check-ci/schedule.json
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: 7
      # A shard with nothing to execute starts no runner; its cached verdicts
      # travel from here to `check:verify` and `check:reports`.
      - name: Transfer cached shard verdicts
        uses: actions/upload-artifact@v6
        with:
          name: check-results-cached
          path: .cache/check-ci/cached/results-*.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: 7
      - name: Transfer cached shard evidence
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-cached
          path: .cache/check-ci/cached/evidence-*.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: 7
      # A failed build is recorded in this shard's verdict, which
      # `check:verify` reports; the shards still run so one red build does
      # not hide every other failure.
      - name: Build shared prerequisites and warm their cache
        continue-on-error: true
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-shard-run.ts "$CHECK_SHARDS"
      - name: Transfer prerequisite outputs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-${{ env.CHECK_SHARDS }}
          path: .cache/check-ci/evidence-${{ env.CHECK_SHARDS }}.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Transfer prerequisite verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-results-${{ env.CHECK_SHARDS }}
          path: .cache/check-ci/results-${{ env.CHECK_SHARDS }}.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  # The shards with uncached work, read from the plan's schedule. This job
  # loads no secrets, so its outputs reach the matrix unsuppressed.
  check-schedule:
    name: check:schedule
    needs: [check-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.schedule.outputs.shards }}
      consumers: ${{ steps.schedule.outputs.consumers }}
    steps:
      - name: Download the shard schedule
        uses: actions/download-artifact@v6
        with:
          name: check-schedule
          path: .cache/check-ci
      - name: Publish the shard schedule
        id: schedule
        run: |
          jq -e '(.shards | type == "array" and all(.[]; type == "number")) and (.consumers | type == "boolean")' .cache/check-ci/schedule.json > /dev/null
          {
            echo "shards=$(jq -c '.shards' .cache/check-ci/schedule.json)"
            echo "consumers=$(jq -r '.consumers' .cache/check-ci/schedule.json)"
          } >> "$GITHUB_OUTPUT"

  check-shards:
    name: check:shards
    needs: [check-schedule]
    # An empty matrix is an error, so a fully cached plan skips the job.
    if: needs.check-schedule.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.check-schedule.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: --include-lazy
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci
      - name: Restore immutable plan and required prerequisites
        env:
          CHECK_SHARD: ${{ matrix.shard }}
        run: bun run libs/tools/scripts/check-stage-transfer.ts --prerequisites
      - name: Select browser tasks
        id: browser
        env:
          CHECK_SHARD: ${{ matrix.shard }}
        run: bun run libs/tools/scripts/check-browser-tasks.ts
      - name: Install renderer for browser tasks
        if: steps.browser.outputs.needed == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/visual-renderer
      - name: check
        timeout-minutes: 25
        env:
          CHECK_SHARD: ${{ matrix.shard }}
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-shard-run.ts "$CHECK_SHARD"
      - name: Upload queryable trace artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            apps/*/.cache/harness-report/*/traces/*.ndjson
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload turbo run summary
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}-${{ matrix.shard }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      # Transfer verdicts, failed reports, and exact artifacts needed by consumers.
      - name: Transfer raw evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-${{ matrix.shard }}
          path: .cache/check-ci/evidence-${{ matrix.shard }}.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Transfer shard verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-results-${{ matrix.shard }}
          path: .cache/check-ci/results-${{ matrix.shard }}.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  # Runs after red shards too: fan-in suites report their own failures in
  # the same run instead of waiting for the next one.
  check-consumers:
    name: check:consumers
    needs: [check-plan, check-schedule, check-shards]
    if: always() && !cancelled() && needs.check-plan.result == 'success' && needs.check-schedule.outputs.consumers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci
      - name: Restore immutable plan and producers
        run: bun run libs/tools/scripts/check-stage-transfer.ts
      - name: Consume producer evidence and required cache artifacts
        run: bun run libs/tools/scripts/check-artifact-download.ts check-evidence- .cache/check-ci/transfers consumers
      - name: check
        timeout-minutes: 25
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY="$CHECK_CONCURRENCY" bun run libs/tools/scripts/check-shard-run.ts "$((CHECK_SHARDS + 1))"
      - name: Upload queryable trace artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}-final
          path: |
            apps/*/.cache/harness-report/*/traces/*.ndjson
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload turbo run summary
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}-final
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      # Transfer verdicts, failed reports, and exact artifacts needed by consumers.
      - name: Transfer raw evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence-${{ env.CHECK_SHARDS }}-consumer
          path: .cache/check-ci/evidence-*.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Transfer consumer verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-results-${{ env.CHECK_SHARDS }}-consumer
          path: .cache/check-ci/results-*.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  # One verdict for the whole full run: every suite, every failing task, the
  # artifact holding its evidence. Missing, failed, skipped and cancelled
  # jobs fail; a stage is allowed to be skipped only when the plan scheduled
  # nothing for it. Reports never enter this job's dependency graph.
  check-verify:
    name: check:verify
    needs: [check-plan, check-schedule, check-shards, check-consumers]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          tools: bun gh
      - name: Transfer raw evidence
        run: bun run libs/tools/scripts/check-artifact-download.ts check-results- .cache/check-ci/transfers verdict || echo "::warning::No shard verdicts to aggregate"
      - name: Summarize every suite
        env:
          PLAN_RESULT: ${{ needs.check-plan.result }}
          SCHEDULE_RESULT: ${{ needs.check-schedule.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
          CONSUMER_RESULT: ${{ needs.check-consumers.result }}
        run: bun run libs/tools/scripts/check-verdict.ts
      # A red run still measured every task that passed.
      - name: Save measured task durations
        if: always() && !cancelled() && hashFiles('.cache/check-ci/measured-costs.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/check-ci/measured-costs.json
          key: check-task-costs-v1-${{ inputs.explore && 'explore' || 'gate' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain the verdict
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-verdict
          path: |
            .cache/check-ci/verdict.json
            .cache/check-ci/verdict.md
            .cache/check-ci/verdict.junit.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # The only required status on a pull request; Deploy consumes this verdict.
  check:
    name: check
    needs: [check-verify]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require release verification
        env:
          VERIFY_RESULT: ${{ needs.check-verify.result }}
        run: test "$VERIFY_RESULT" = success

  # Deploy's `deploy:cleanup` prunes stale reports.
  check-reports:
    name: check:reports
    needs: [check-plan, check-shards, check-consumers]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The reports are filed under the pull request's head, whose specs are
      # read from Git; the default checkout holds only the merge commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: bun gh
      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev
      - name: Download immutable plan
        uses: actions/download-artifact@v6
        with:
          name: check-plan
          path: .cache/check-ci
      - name: Aggregate and publish bounded evidence
        run: bun run libs/secrets-server/scripts/secrets-run.ts -- bun run libs/tools/scripts/check-reports.ts
      - name: Retain sanitized planning and timing details
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: check-ci-details
          path: |
            .cache/check-ci/plan.json
            .cache/check-ci/planning.json
            .cache/check-ci/results/*.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
