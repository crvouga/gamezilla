name: Check

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Check · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || 'manual' }}"

permissions:
  contents: read
  actions: write
  id-token: write

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  TURBO_UI: stream

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Check: is the code good? One gate — the //#check leaf set `bun run check`
  # runs — spread over several runners, because a GitHub-hosted runner has 2
  # cores and a wide change misses ~200 tasks. New checks belong in //#check in
  # turbo.json (or a `ci:*` root task), never in a new job here.
  #
  #   check:plan   dry-run the gate once; split the cache misses across shards
  #                (libs/tools/scripts/check-shards.ts)
  #   check:matrix publish the split as job outputs, from a job with no secrets:
  #                the runner masks every Infisical value in a job that loads
  #                them and drops any output containing one (`[0,1,…]` does)
  #   check:shard  one runner per shard runs its task ids through turbo
  #   check        the one required check: green only if the plan and every
  #                shard are green
  #   check:report fold the plan's and every shard's report fragment into the
  #                one HTML report (libs/tools/scripts/check-report.ts) and
  #                link it from the run summary; never part of the verdict
  check-plan:
    name: check:plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      # libs/tools/scripts/secrets-scan-range.ts scopes the gitleaks scan
      # (@libs/tools#check:secrets) to the commits this PR adds. The plan
      # hashes it too, so plan and shards must see the same range.
      GH_EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: plan
        env:
          SHARD_PLAN_PATH: ${{ runner.temp }}/shard-plan.txt
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/tools/scripts/turbo-ci-run.ts --plan-shards "--report-fragment=${RUNNER_TEMP}/check-report/plan.json" check

      # Every gate task with its turbo hash and cache status: the report's
      # task set, so a task no shard reached still shows as not run.
      - name: Upload report fragment
        uses: actions/upload-artifact@v6
        with:
          name: check-report-plan
          path: ${{ runner.temp }}/check-report/plan.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload shard plan
        uses: actions/upload-artifact@v6
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan.txt
          if-no-files-found: error
          retention-days: 1

  check-matrix:
    name: check:matrix
    needs: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.publish.outputs.shards }}
      assignment: ${{ steps.publish.outputs.assignment }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: shard-plan
          path: ${{ runner.temp }}

      - name: publish
        id: publish
        run: cat "${RUNNER_TEMP}/shard-plan.txt" >> "$GITHUB_OUTPUT"

  check-shard:
    name: check:shard
    needs: check-matrix
    if: needs.check-matrix.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job: setup + the check step + summary. The
    # check step has its own tighter limit below.
    timeout-minutes: 30
    strategy:
      # Keep every shard running: one red shard should not hide another's.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.check-matrix.outputs.shards) }}
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      GH_EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      SHARD_TASKS: ${{ join(fromJSON(needs.check-matrix.outputs.assignment)[matrix.shard], ' ') }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: check
        id: check
        # Above `CI_RUN_DEADLINE_SECONDS` (libs/tools/scripts/check-budget.ts)
        # on purpose: turbo-ci-run hits its own deadline first and names the
        # task that wedged, instead of GitHub cancelling the step silently.
        timeout-minutes: 25
        run: |
          # shellcheck disable=SC2086 # one word per task id
          bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/tools/scripts/turbo-ci-run.ts "--report-fragment=${RUNNER_TEMP}/check-report/shard-${SHARD}.json" $SHARD_TASKS

      # What this shard ran: outcomes, failing logs, scenario results.
      - name: Upload report fragment
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/check-report/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload queryable trace artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}-shard-${{ matrix.shard }}
          # One bucket per spec part (libs/* and pkgs/* suites); keep
          # upload-artifact out of the repository-wide ** walk (node_modules
          # makes that path pathological).
          path: |
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      # Per-task CI seconds for check-task-costs.json
      # (`check-shards.ts --harvest <run id>`).
      - name: Upload turbo run summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Write workflow summary
        if: always()
        env:
          WORKFLOW_JOB: check:shard ${{ matrix.shard }}
          WORKFLOW_OUTCOME: ${{ steps.check.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

  check:
    name: check
    needs: [check-plan, check-matrix, check-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verdict
        env:
          PLAN: ${{ needs.check-plan.result }}
          MATRIX: ${{ needs.check-matrix.result }}
          SHARDS: ${{ needs.check-shard.result }}
          SHARD_COUNT: ${{ needs.check-matrix.outputs.shards }}
        # Skipped shards are green only when the plan found nothing to run.
        run: |
          echo "check:plan=$PLAN check:matrix=$MATRIX check:shard=$SHARDS shards=$SHARD_COUNT"
          test "$PLAN" = success
          test "$MATRIX" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$SHARD_COUNT" = '[]'; }

  # The one HTML report of this run, linked from the run summary (the PR's
  # Checks tab): its id is the gate fingerprint, the same `bun check` prints
  # for the same inputs. Reporting only, so not a required check: a red
  # report job never blocks a merge, and the verdict never waits on it.
  check-report:
    name: check:report
    needs: [check-plan, check-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Download report fragments
        uses: actions/download-artifact@v7
        with:
          pattern: check-report-*
          path: ${{ runner.temp }}/check-report

      - name: merge
        id: merge
        env:
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun run libs/tools/scripts/check-report.ts --merge "${RUNNER_TEMP}/check-report" --out-dir "${RUNNER_TEMP}/check-report-html" --origin "$ORIGIN" >> "$GITHUB_OUTPUT"

      # One unzipped file, so the artifact link opens the report itself.
      - name: Upload report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.merge.outputs.path }}
          archive: false
          retention-days: 30

      - name: Link report
        env:
          REPORT_ID: ${{ steps.merge.outputs.id }}
          VERDICT: ${{ steps.merge.outputs.verdict }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "::notice title=bun check report (${VERDICT})::${URL}"
          {
            echo "## bun check report · \`${VERDICT}\`"
            echo ""
            echo "[check-report-${REPORT_ID}.html](${URL}) — report \`${REPORT_ID}\` (the gate fingerprint; \`bun check\` over the same inputs writes the same id)."
          } >> "$GITHUB_STEP_SUMMARY"
