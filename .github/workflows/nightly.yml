name: Nightly

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Nightly · ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"

# Nightly is where the checks explore. Check, the gate on every pull request
# and every release, is bounded: each Quint model replays only the fewest
# drawn traces that take every bound action. Once a night this workflow runs
# the same sharded Check on `main` with `explore`, which replays every drawn
# trace of every model through the product.
#
# It gates nothing: no pull request waits on it and no deploy reads it. A red
# night is a defect to fix on `main`; pin the failing trace as a regression
# (`regressions` in the model's binding) so the gate replays it from then on.
# Run it by hand with `gh workflow run nightly.yml`.

permissions:
  contents: read
  actions: write
  id-token: write

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly-explore:
    name: nightly:explore
    uses: ./.github/workflows/check.yml
    with:
      explore: true
