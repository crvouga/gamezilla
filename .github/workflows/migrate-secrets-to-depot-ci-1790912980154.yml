name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          AWS_HEALTH_ROLE_ARN: ${{ vars.AWS_HEALTH_ROLE_ARN }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
          SECRETS_PROJECT_ID: ${{ vars.SECRETS_PROJECT_ID }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add AWS_HEALTH_ROLE_ARN="$AWS_HEALTH_ROLE_ARN" AWS_ROLE_ARN="$AWS_ROLE_ARN" SECRETS_IDENTITY_ID="$SECRETS_IDENTITY_ID" SECRETS_PROJECT_ID="$SECRETS_PROJECT_ID" --repo crvouga/gamezilla
  cleanup:
    needs: [variables]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
