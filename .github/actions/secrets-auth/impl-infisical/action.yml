# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Inject secrets via Infisical OIDC
description: Provider adapter — Infisical machine identity OIDC → GITHUB_ENV

inputs:
  identity-id:
    description: Infisical machine identity ID for OIDC
    required: true
  project-id:
    description: Infisical project slug / id
    required: true
  environment:
    description: Infisical environment slug (dev or prd)
    required: true
  endpoint:
    description: Infisical API domain (empty → Infisical Cloud default)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Normalize queryless token URLs before the action appends &audience.
    - name: Prepare OIDC request URL
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" != *\?* ]]; then
          printf 'ACTIONS_ID_TOKEN_REQUEST_URL=%s?\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_ENV"
        fi

    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: oidc
        oidc-audience: https://github.com/${{ github.repository_owner }}
        identity-id: ${{ inputs.identity-id }}
        project-slug: ${{ inputs.project-id }}
        env-slug: ${{ inputs.environment }}
        domain: ${{ inputs.endpoint != '' && inputs.endpoint || 'https://app.infisical.com' }}

    # Infisical/secrets-action injects secret *values* only. Admin CLI
    # paths (`bun health`, `@libs/infra` OpenTofu applies) re-auth via OIDC using
    # `resolveInfisicalAccessTokenForWrites`, which needs the machine
    # identity id in the job env (not merely as this action's input).
    #
    # `inputs.project-id` is the Infisical *slug* (secrets-action
    # `project-slug`). Export the workspace UUID from `.secrets.json` as
    # `SECRETS_PROJECT_ID` — machine-identity `infisical export` 404s on a slug.
    - name: Export secrets auth coords for admin CLI
      shell: bash
      run: |
        set -euo pipefail
        echo "SECRETS_IDENTITY_ID=${{ inputs.identity-id }}" >> "$GITHUB_ENV"
        project_id="$(bun -p 'require("./.secrets.json").projectId ?? ""')"
        if [ -z "$project_id" ] || [ "$project_id" = "null" ]; then
          echo "::error::.secrets.json missing projectId (Infisical workspace UUID)"
          exit 1
        fi
        echo "SECRETS_PROJECT_ID=${project_id}" >> "$GITHUB_ENV"

    # Infisical holds TURBO_TEAM=local, and a bare `turbo run` (the setup
    # action's postinstall generation) lets that env var override
    # `remoteCache.teamSlug`: Vercel answers 403 and Turbo drops the remote
    # cache for the run. Laptops hide it behind the teamId in the ignored
    # .turbo/config.json. Pin both to the root turbo.json, as turbo-ci-run does.
    - name: Pin the Turbo Remote Cache team
      shell: bash
      run: |
        set -euo pipefail
        echo "TURBO_TEAM=$(bun -p 'require("./turbo.json").remoteCache.teamSlug')" >> "$GITHUB_ENV"
        echo "TURBO_API=$(bun -p 'require("./turbo.json").remoteCache.apiUrl')" >> "$GITHUB_ENV"
