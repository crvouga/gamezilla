name: Checkout (synced after Format)
description: >
  Checkout the triggering commit. When this workflow was started by a
  successful Format `workflow_run`, fast-forward to the branch tip so
  auto-format commits pushed during that run are included.

inputs:
  fetch-depth:
    description: Passed through to actions/checkout
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: >-
          ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Sync to branch tip after Format auto-commit
      if: github.event_name == 'workflow_run'
      shell: bash
      run: |
        set -euo pipefail
        branch="${{ github.event.workflow_run.head_branch }}"
        git fetch origin "$branch"
        git checkout "$branch"
        git pull --ff-only origin "$branch"
