# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo + deploy CLI tooling
description: Wraps ./.github/actions/setup and installs wrangler / EAS / static-check CLIs via @tools

inputs:
  wrangler:
    description: Install wrangler via @tools install:cli
    required: false
    default: 'false'
  eas:
    description: Install EAS CLI via @tools install:cli
    required: false
    default: 'false'
  watchman:
    description: Install Watchman for Metro client bundling
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        watchman: ${{ inputs.watchman }}

    - name: Install deploy CLI tools
      if: inputs.wrangler == 'true' || inputs.eas == 'true'
      shell: bash
      run: bun run --filter @tools install:cli
