name: Pinned visual renderer
description: Install the fixed Chrome release only for tasks that need a native browser
runs:
  using: composite
  steps:
    # Windows Chrome is installed by the action; no Linux system-package or
    # kernel sandbox changes run on the host.
    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        chrome-version: '154.0.8037.92'
        install-dependencies: false
    - name: Select visual renderer
      shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: echo "BUN_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
