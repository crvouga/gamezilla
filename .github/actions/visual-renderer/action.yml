name: Pinned visual renderer
description: Install the fixed Chrome release only for tasks that need a native browser
runs:
  using: composite
  steps:
    # A self-hosted Linux runner must already have these libraries. `true`
    # runs apt-get and upgrades mesa; that download stalled past the step cap
    # (Verify run 37668279155, mesa-libgallium). The action default is false.
    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        chrome-version: '154.0.8037.92'
        install-dependencies: false
    - name: Select visual renderer
      shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: echo "BUN_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
    # Chrome's sandbox needs unprivileged user namespaces. Ubuntu's AppArmor
    # profile grants them to the system Chrome's path only, so the pinned
    # Chrome for Testing exits as it starts ("Chrome process closed the pipe",
    # Verify run 38197118122).
    - name: Allow the pinned Chrome its sandbox
      shell: bash
      run: |
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
    # Chrome's own reason, if it cannot start, in seconds: the tests that use
    # it print only that the process went away.
    - name: Start the renderer once
      shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # Bun, not `timeout`: macOS has no `timeout`.
      run: |
        bun -e '
          let started = false;
          try {
            const run = Bun.spawnSync([process.env.CHROME_PATH, "--headless=new", "--dump-dom", "about:blank"], { stdout: "ignore", timeout: 30000 });
            started = run.exitCode === 0;
          } catch {}
          if (!started) console.log("::warning::The pinned Chrome did not start");
        '
