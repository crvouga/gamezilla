# zizmor `github-env`: the `$GITHUB_ENV`/`$GITHUB_PATH` writes below carry
# runner values and this repository's own files. They could only escalate
# where untrusted code shares a job with privileged credentials; no workflow
# here has such a trigger (`pull_request_target`, `workflow_run`;
# libs/tools-harness-ts/scripts/workflow-pinning.test.ts refuses them), and a
# fork's pull request gets no secret or OIDC token to steal.
name: Pinned visual renderer
description: Install the fixed Chrome release only for tasks that need a native browser
runs:
  using: composite
  steps:
    # The Chrome for Testing build mise.toml pins, unpacked by mise: no
    # browser installer action. No system packages are installed: the
    # GitHub-hosted Ubuntu image already has Chrome's libraries (a package
    # upgrade stalled past the step cap in Verify run 37668279155,
    # mesa-libgallium).
    - name: Install the pinned Chrome
      shell: bash
      run: mise install http:chrome-for-testing
    - name: Select visual renderer
      id: chrome
      shell: bash
      run: |  # zizmor: ignore[github-env] -- see the note at the top of this file
        chrome_path="$(bun run libs/tools-harness-ts/scripts/chrome-for-testing.ts)"
        echo "BUN_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
        echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
    # Chrome's sandbox needs unprivileged user namespaces. Ubuntu's AppArmor
    # profile grants them to the system Chrome's path only, so the pinned
    # Chrome for Testing exits as it starts ("Chrome process closed the pipe",
    # Verify run 38197118122).
    - name: Allow the pinned Chrome its sandbox
      shell: bash
      run: |
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
    # Chrome's own reason, if it cannot start, in seconds. The renderer
    # starts it the way the tests do — Bun.WebView over
    # --remote-debugging-pipe — with Chrome's stderr shown: a bare
    # `chrome --dump-dom` can start while every Bun.WebView fails with
    # "Chrome process closed the pipe" (Verify run 40571328806).
    - name: Start the renderer once
      shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        bun -e '
          const view = new Bun.WebView({
            backend: { type: "chrome", url: false, path: process.env.CHROME_PATH, argv: ["--headless=new"], stderr: "inherit" },
          });
          const started = await Promise.race([
            view.navigate("about:blank").then(() => true, (error) => { console.log(String(error)); return false; }),
            Bun.sleep(30000).then(() => false),
          ]);
          if (!started) console.log("::warning::The pinned Chrome did not start under Bun.WebView; its output is above");
          Bun.WebView.closeAll();
          process.exit(0);
        '
