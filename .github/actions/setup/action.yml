# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo (mise tools + deps)
description: mise-pinned tools (Bun, Node, CLIs), cached dependency trees and frozen dependency install (run actions/checkout first)

inputs:
  tools:
    description: Pinned mise tools to install; empty installs the full check toolchain
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Every system tool — Bun, Node, gh, gitleaks, actionlint, the secrets
    # backend CLI, EMQX — at the version pinned in the repo's mise.toml, the
    # same file a laptop runs `mise install` against. Installs are cached on
    # a key over mise.toml; the action puts the tools on PATH for later steps.
    # Later steps (check:actionlint, check:secrets) `mise exec` against the
    # same file, so trust the checkout for the whole job.
    - name: Trust mise.toml
      shell: bash
      run: echo "MISE_TRUSTED_CONFIG_PATHS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

    - name: Install pinned tools (mise.toml)
      uses: jdx/mise-action@v4
      with:
        version: 2026.9.13
        # jdx/mise-action defaults to `bun opentofu` when this is blank. The
        # full Check jobs need every tool pinned in mise.toml, including the
        # lazy tools used by model and security checks. Callers that need a
        # smaller toolchain pass an explicit list (for example `bun gh`).
        install_args: ${{ inputs.tools || '--include-lazy' }}

    # The installed trees, shared by every job of every workflow. One extract
    # of them leaves the frozen install below a no-op check: 291 MB restored
    # in 9 s (Check run 36783674561) against a 15-20 s install from the
    # registry (Check run 38198242466). The key is content alone — the
    # lockfile, the pinned tools and this file — and exact, so a tree never
    # answers for another lockfile. The frozen install runs whether or not
    # the cache answers.
    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          libs/*/node_modules
          pkgs/*/node_modules
        key: dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'mise.toml', '.github/actions/setup/action.yml') }}

    - name: Install dependencies
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: bun install --frozen-lockfile

    # Saved here, not when the job ends: `check:plan` misses first and every
    # shard behind it restores, whatever the rest of this job does.
    - name: Save installed dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          libs/*/node_modules
          pkgs/*/node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
