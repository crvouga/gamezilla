name: Setup repo (Node + Bun + deps)
description: Node 22, Bun, cache install store, bun install, optional Vault CLI (run actions/checkout first)

inputs:
  vault:
    description: Whether to install the OpenBao CLI (bao) for vault kv passthrough
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Cache Bun install store
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install OpenBao CLI (bao)
      if: inputs.vault == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v bao >/dev/null 2>&1; then
          echo "bao already on PATH"
          exit 0
        fi
        BAO_VERSION="2.2.0"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64) BAO_ARCH="amd64" ;;
          aarch64|arm64) BAO_ARCH="arm64" ;;
          *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
        esac
        URL="https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/bao_${BAO_VERSION}_linux_${BAO_ARCH}.zip"
        curl -fsSL "$URL" -o /tmp/bao.zip
        unzip -o /tmp/bao.zip -d /tmp/bao-bin
        sudo install -m 0755 /tmp/bao-bin/bao /usr/local/bin/bao
        # Passthrough subcommands the wrapper would delegate to the real binary.
        sudo ln -sf /usr/local/bin/bao /usr/local/bin/vault
        bao version
