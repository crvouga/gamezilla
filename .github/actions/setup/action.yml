name: Setup repo (Node + Bun + deps)
description: Node 22, Bun, cache install store, bun install (run actions/checkout first)

inputs:
  watchman:
    description: >-
      Install Watchman so Metro can SHA-1 Bun-store deps resolved via
      apps/client/node_modules symlinks (required for client bundle/export in CI).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Cache Bun install store
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install Watchman
      if: inputs.watchman == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y watchman
        watchman version
