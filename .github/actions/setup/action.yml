# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo (Node + Bun + deps)
description: Node 22, Bun, cache install store, bun install (run actions/checkout first)

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - name: Cache Bun install store
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # check:secrets (and other admin secret I/O) shells out to the secrets
    # backend CLI. secrets-auth injects secret values + SECRETS_IDENTITY_ID
    # (for OIDC → INFISICAL_TOKEN); secrets-run passes them to children.
    # Export of both `dev` and `prd` still needs the CLI on PATH.
    # GITHUB_TOKEN authenticates GitHub API fallbacks when resolving the
    # secrets-backend CLI release (shared runner IPs often exhaust unauth quota).
    # Cache the user-local binary so parallel CI jobs skip the GitHub CDN
    # download on hit; bump the key suffix when the CLI must be force-upgraded.
    - name: Cache secrets backend CLI
      uses: actions/cache@v5
      with:
        # Binary basename is owned by the secrets-backend adapter package.
        path: ~/.local/bin/infisical
        key: secrets-backend-cli-${{ runner.os }}-v1
        restore-keys: |
          secrets-backend-cli-${{ runner.os }}-

    # This step is a composition root: the GitHub-release installer it falls
    # back to on Linux (no Homebrew) needs an injected OsFs, and `bun -e` is
    # not wrapped by the repo's wall-injection entrypoints.
    - name: Install secrets backend CLI
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        bun -e '
          import { wallOsFs } from "@pkgs/os";
          import { createSecretBackendCli } from "@pkgs/secret-provider";
          const cli = createSecretBackendCli({ osFs: wallOsFs() });
          const status = cli.check();
          if (!status.ok) {
            cli.install();
          }
          cli.verify();
          console.log(`secrets-backend-cli: ${cli.version() ?? "unknown"}`);
        '
