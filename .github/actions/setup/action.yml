# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo (mise tools + deps)
description: mise-pinned tools (Bun, Node, CLIs), cached node_modules, bun install (run actions/checkout first)

inputs:
  tools:
    description: Pinned mise tools to install; empty installs the full check toolchain
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Every system tool — Bun, Node, gh, gitleaks, actionlint, the secrets
    # backend CLI, EMQX — at the version pinned in the repo's mise.toml, the
    # same file a laptop runs `mise install` against. Installs are cached on
    # a key over mise.toml; the action puts the tools on PATH for later steps.
    # Later steps (check:actionlint, check:secrets) `mise exec` against the
    # same file, so trust the checkout for the whole job.
    - name: Trust mise.toml
      shell: bash
      run: echo "MISE_TRUSTED_CONFIG_PATHS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

    - name: Install pinned tools (mise.toml)
      uses: jdx/mise-action@v4
      with:
        version: 2026.9.13
        install_args: ${{ inputs.tools }}

    # The installed trees, not just the package store: restoring the store and
    # then linking ~1GB of node_modules out of it cost ~13s a run; one extract
    # of the finished trees leaves `bun install` a no-op check. Exact key only
    # (mise.toml is hashed so a Bun upgrade re-keys it); on a miss the store
    # cache below makes the install cheap and the post step saves new trees.
    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          libs/*/node_modules
          pkgs/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'mise.toml', '.github/actions/setup/action.yml') }}

    - name: Cache Bun install store
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
