# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# zizmor `github-env`: the `$GITHUB_ENV`/`$GITHUB_PATH` writes below carry
# runner values and this repository's own files. They could only escalate
# where untrusted code shares a job with privileged credentials; no workflow
# here has such a trigger (`pull_request_target`, `workflow_run`;
# libs/tools-harness-ts/scripts/workflow-pinning.test.ts refuses them), and a
# fork's pull request gets no secret or OIDC token to steal.
name: Setup repo (mise tools + deps)
description: mise-pinned tools (Bun, Node, CLIs) and frozen dependency install (run actions/checkout first)

inputs:
  tools:
    description: Pinned mise tools to install; empty installs the full verify toolchain
    required: false
    default: ''
  secrets-environment:
    description: Secrets environment to inject (dev, prd, shared) after the install; empty injects none
    required: false
    default: ''
  secrets-identity-id:
    description: Secrets backend machine identity ID for OIDC (with secrets-environment)
    required: false
    default: ''
  secrets-project-id:
    description: Secrets project id / slug (with secrets-environment)
    required: false
    default: ''
  product-identity-json:
    description: Public identity document supplied by workflow configuration
    required: false
    default: ''
  product-identity-mode:
    description: fixture for deterministic verification; configured for deployment and live operations
    required: false
    default: fixture
  tofu-providers:
    description: Restore and save the OpenTofu provider cache (jobs that run tofu init)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Every system tool — Bun, Node, gh, gitleaks, actionlint, zizmor, the
    # secrets backend CLI, EMQX — at the version pinned in the repo's
    # mise.toml, the same file a laptop runs `mise install` against. The
    # action puts the tools on PATH for later steps.
    # Later steps (verify:actionlint, verify:secrets) `mise exec` against the
    # same file, so trust the checkout for the whole job.
    # Coding-agent tools (graphify, serena) are laptop-only, and their
    # Python native builds need a C compiler (MSVC on Windows: Verify run
    # 40532833763), so CI never installs them. Nor Swift (1.1 GB, Linux
    # only): CI verifies no native package (package-hosts.ts `ciFilters`).
    - name: Trust mise.toml
      shell: bash
      run: |  # zizmor: ignore[github-env] -- see the note at the top of this file
        echo "MISE_TRUSTED_CONFIG_PATHS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
        echo "MISE_DISABLE_TOOLS=pipx:graphifyy,pipx:serena-agent,swift" >> "$GITHUB_ENV"

    # mise and most pinned tools download from GitHub release assets. When
    # that host is down (504s on 2026-11-09 failed every job), the install
    # falls back to the last toolchain main installed, kept in the Actions
    # cache, which is separate storage. Pull requests never save it (each
    # would store its own ~1 GB copy); Release and scheduled runs on main do,
    # and every pull request can restore main's.
    - name: Tool snapshot key
      id: tool-snapshot
      shell: bash
      env:
        TOOLS: ${{ inputs.tools || '--include-lazy' }}
        CONFIG_HASH: ${{ hashFiles('mise.toml') }}
      run: |
        tools_hash="$(printf '%s' "$TOOLS" | sha256sum | cut -c1-16)"
        echo "key=mise-tools-v1-${RUNNER_OS}-${RUNNER_ARCH}-${CONFIG_HASH}-${tools_hash}" >> "$GITHUB_OUTPUT"

    - name: Install pinned tools (mise.toml)
      id: mise
      continue-on-error: true
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.9.13
        # Fresh GitHub-hosted runners install pinned tools directly. The 952 MB tool
        # archive stalled setup for 20 minutes in run 41039477627; installing
        # the same tools directly took 25 seconds. Keep dependency and Turbo
        # caches below, without this optional tool archive.
        cache: false
        # jdx/mise-action defaults to `bun opentofu` when this is blank. The
        # full Verify jobs need every tool pinned in mise.toml, including the
        # lazy tools used by model and security verifications. Callers that need a
        # smaller toolchain pass an explicit list (for example `bun gh`).
        install_args: ${{ inputs.tools || '--include-lazy' }}

    - name: Restore the last good toolchain (download outage)
      if: steps.mise.outcome == 'failure'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: ${{ steps.tool-snapshot.outputs.key }}
        fail-on-cache-miss: true

    - name: Activate the restored toolchain
      if: steps.mise.outcome == 'failure'
      shell: bash
      env:
        TOOLS: ${{ inputs.tools || '--include-lazy' }}
      run: |  # zizmor: ignore[github-env] -- see the note at the top of this file
        echo "::warning::GitHub release downloads failed; using the cached toolchain from main"
        data="$HOME/.local/share/mise"
        export PATH="$data/bin:$data/shims:$PATH" MISE_YES=1
        {
          echo "$data/bin"
          echo "$data/shims"
        } >> "$GITHUB_PATH"
        echo "MISE_YES=1" >> "$GITHUB_ENV"
        # Every pinned tool is already present, so this installs nothing.
        # shellcheck disable=SC2086 -- TOOLS is a mise argument list
        mise install $TOOLS
        mise reshim -f
        mise env --paths >> "$GITHUB_PATH"
        mise env --json | jq -r 'to_entries[] | select(.key != "PATH") | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

    - name: Look up the toolchain snapshot
      if: steps.mise.outcome == 'success' && github.event_name != 'pull_request'
      id: tool-snapshot-lookup
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: ${{ steps.tool-snapshot.outputs.key }}
        lookup-only: true

    - name: Save the toolchain snapshot
      if: steps.tool-snapshot-lookup.outcome == 'success' && steps.tool-snapshot-lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: ${{ steps.tool-snapshot.outputs.key }}

    # OpenTofu providers download from GitHub release assets too. A provider
    # already in the plugin cache that matches the committed lock file is
    # used without downloading (Release run 42565242851 failed on 504s).
    - name: Restore OpenTofu providers
      if: inputs.tofu-providers == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: libs/infra-server-ts/.cache/tofu/plugins
        key: tofu-providers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libs/infra-shared-ts/tofu/stacks/*/.terraform.lock.hcl') }}
        restore-keys: tofu-providers-v1-${{ runner.os }}-${{ runner.arch }}-

    # The install runs before any secret is in the environment: dependency
    # install scripts (`trustedDependencies`) and the postinstall generation
    # are code this repository does not review line by line, so they never see
    # a credential. Generation outputs come from the GitHub cache below, not
    # the token-guarded remote cache.
    #
    # No cache of the installed node_modules trees: bun links packages into
    # them, and an archive of links does not survive every OS. Bun's download
    # cache is restored instead, so the frozen install below is a link step.
    - name: Restore bun's download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-install-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-install-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore generation artifacts
      # Reuse only Turbo's immutable generation artifacts. Turbo still hashes
      # current inputs and restores outputs; frozen install still runs below.
      # This cache is separate from the verification artifacts and verdicts.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: generation
      with:
        path: .cache/setup-generation
        key: setup-generation-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'mise.toml') }}-${{ github.sha }}
        restore-keys: setup-generation-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'mise.toml') }}-

    - name: Install dependencies and restore generated outputs
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
        TURBO_CACHE_DIR: .cache/setup-generation
      run: bun install --frozen-lockfile

    - name: Save generation artifacts
      if: steps.generation.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/setup-generation
        key: ${{ steps.generation.outputs.cache-primary-key }}

    # Secrets go in only after the install. Every later Turbo run reads and
    # writes the Vercel Remote Cache with the TURBO_TOKEN this injects, the
    # same cache a laptop uses.
    - name: Inject secrets
      if: inputs.secrets-environment != ''
      uses: ./.github/actions/secrets-auth
      with:
        identity-id: ${{ inputs.secrets-identity-id }}
        project-id: ${{ inputs.secrets-project-id }}
        environment: ${{ inputs.secrets-environment }}
    - name: Inject public build identity
      shell: bash
      env:
        REPOSITORY_IDENTITY_JSON: ${{ inputs.product-identity-json }}
        PRODUCT_IDENTITY_MODE: ${{ inputs.product-identity-mode }}
      run: bun run libs/secrets-server-ts/scripts/export-product-identity.ts

    - name: Configure deployment identity
      if: inputs.product-identity-mode == 'configured'
      shell: bash
      run: bun run identity:configure
