# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Turbo local cache
description: >-
  Restore or save `.turbo` with a per-job primary key so parallel jobs do not
  race on the same SHA key. The Turbo *remote* cache (TURBO_TOKEN)
  is what makes repeat runs cheap; this only keeps the local artifacts warm
  between steps of the same job.
inputs:
  job:
    description: Job slug used in the primary cache key (e.g. pr-check)
    required: true
  mode:
    description: restore | save
    required: true

runs:
  using: composite
  steps:
    - name: Restore Turbo local artifacts
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.job }}-
          ${{ runner.os }}-turbo-

    - name: Save Turbo local artifacts
      if: inputs.mode == 'save'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.job }}-${{ github.sha }}
