# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Jest transform cache
description: >-
  Restore or save Jest transform caches for jest-expo packages (`@test/ui`,
  `@pkgs/ui-testing`, `@pkgs/simulation`) so cold CI runs skip babel-jest work.
inputs:
  mode:
    description: restore | save
    required: true

runs:
  using: composite
  steps:
    - name: Restore Jest transform caches
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: |
          test/ui/.cache/jest
          pkgs/ui-testing/.cache/jest
          pkgs/simulation/.cache/jest
        key: ${{ runner.os }}-jest-${{ hashFiles('bun.lock', 'test/ui/jest.config.cjs', 'test/ui/babel.config.js', 'pkgs/ui-testing/jest.config.cjs', 'pkgs/ui-testing/jest-transform-ignore.cjs', 'pkgs/simulation/jest.config.cjs') }}
        restore-keys: |
          ${{ runner.os }}-jest-

    - name: Save Jest transform caches
      if: inputs.mode == 'save'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          test/ui/.cache/jest
          pkgs/ui-testing/.cache/jest
          pkgs/simulation/.cache/jest
        key: ${{ runner.os }}-jest-${{ hashFiles('bun.lock', 'test/ui/jest.config.cjs', 'test/ui/babel.config.js', 'pkgs/ui-testing/jest.config.cjs', 'pkgs/ui-testing/jest-transform-ignore.cjs', 'pkgs/simulation/jest.config.cjs') }}
