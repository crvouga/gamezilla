# Every system tool the repo shells out to, pinned. `mise install` puts these
# exact versions on a laptop; `jdx/mise-action` (`.github/actions/setup`) does
# the same on CI. npm tooling (turbo, wrangler, biome, …) is not here — it is a
# devDependency in `package.json` and arrives with `bun install`.
#
# Bump a version here and nowhere else — except Bun, which Turborepo also reads
# from `package.json` `packageManager`: keep the two equal. `bun install-system`
# bumps every tool here (and npm tooling) to its latest release and keeps Bun
# in step; commit what it changes.
#
# Native toolchains (docs/POLYGLOT.md): `swift` below, and Xcode in `[vars]`
# at the end, which mise cannot install but every Apple task reads from here.

[tools]
bun = "1.4.3"
node = "26.12.0"
gh = "2.102.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
# Security audit of .github/ (verify:workflow-security): the repository is
# public, so every pull request is untrusted.
zizmor = "1.31.1"
duckdb = "1.5.6"
# Infrastructure as code (libs/infra): plans, policy gate over plan JSON.
opentofu = "1.13.1"
conftest = "0.71.1"
tflint = "0.64.0"
railway = "5.71.0"
# ast-grep: structural (syntax-tree) search and rewrite for coding agents
# (`ast-grep run -l tsx -p 'useQuery($$$)'`). Wired to Claude Code and Codex
# through the `ast-grep` skills in `skills-lock.json` (`.agents/skills`).
ast-grep = "0.51.0"
# Python toolchain for `pipx:` tools: mise's pypi backend installs through uv,
# which fetches the interpreter graphify needs (3.10+) itself.
uv = "0.13.3"
# Executable specs (specs/README.md): the JVM that runs Alloy (structural
# invariants, `.als`) and Apalache (Quint model checking, `quint verify`).
java = "temurin-21.0.12+8.0.LTS"
# Swift for SwiftPM packages on Linux. Lazy: `mise exec` installs it (1.1 GB)
# the first time a Swift task runs, so a runner or laptop that builds no Swift
# never downloads it. macOS uses the Swift inside the pinned Xcode, which must
# be this version (`libs/tools-harness-ts/scripts/native-toolchain.ts` checks both). Bump
# it with `xcode_version`, never alone.
swift = { version = "6.4.0", os = ["linux"], lazy = true }

# Graphify: turns the repo into a queryable knowledge graph for coding agents
# (`graphify query` / `path` / `explain`). The PyPI package is `graphifyy`
# (double y); the command is `graphify`. `bun run graphify:install` registers its
# skill for Claude Code and Codex (libs/tools-harness-ts/scripts/graphify-install.ts).
# `terraform` adds the HCL parser for libs/infra-shared-ts/tofu.
"pipx:graphifyy" = { version = "0.9.92", extras = "terraform" }

# Serena: semantic code navigation and editing (language servers) for coding
# agents, served over MCP. The PyPI package is `serena-agent`; the command is
# `serena`. Python 3.13 is the one its docs install with. Every agent's MCP entry
# is generated by `bun run agents:sync` (libs/tools-harness-ts/scripts/sync-agent-mcp.ts).
[tools."pipx:serena-agent"]
version = "2.1.0"
uvx_args = "--python 3.13"

# Alloy 6: checks `specs/<context>/*.als` and audits stored snapshots against
# them (`@pkgs/alloy`). A single jar; `mise where http:alloy` holds `alloy.jar`.
[tools."http:alloy"]
version = "6.2.0"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v{{version}}/org.alloytools.alloy.dist.jar"
bin = "alloy.jar"
checksum = "sha256:6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

# Apalache: the model checker behind `quint verify` (`@pkgs/quint`). Keep the
# version equal to the Apalache the pinned Quint expects (its
# DEFAULT_APALACHE_VERSION_TAG), so Quint never downloads one itself.
[tools."http:apalache"]
version = "0.56.1"
url = "https://github.com/apalache-mc/apalache/releases/download/v{{version}}/apalache-{{version}}.tgz"
checksum = "sha256:a61c07569d7195ddc589f01037fa10fafef4fb0796af2f1c9cb45226375dfbfc"

# Chrome for Testing: the pinned renderer browser tests and visual checks use
# in CI (`.github/actions/visual-renderer`, `libs/tools-harness-ts/scripts/chrome-for-testing.ts`).
# mise unpacks it the same way on Linux, macOS and Windows. Lazy: a laptop's
# `mise install` skips it, since browser tests find the installed Chrome.
# Keep `version` equal to the Chrome the visual cache key expects.
[tools."http:chrome-for-testing"]
version = "154.0.8037.92"
lazy = true
# Callers ask `mise where` for the executable (its path differs by OS); mise
# needs a shim name for a lazy tool, and this one shadows no real command.
lazy_bins = ["chrome-for-testing"]

# Google publishes no checksums: each is the SHA-256 of that version's zip,
# computed when the version was pinned. Bump `version` and every checksum
# together (download each zip and run `shasum -a 256`).
[tools."http:chrome-for-testing".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/linux64/chrome-linux64.zip", checksum = "sha256:ff43322f335e436b2f4dcdfeeec5db032299e335a7e8c1c618b326e100ce8732" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/mac-arm64/chrome-mac-arm64.zip", checksum = "sha256:b62e904b6571c5ff5108ed7812cf93ac6d1c4027f10ae47ac34d8e229ed88001" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/mac-x64/chrome-mac-x64.zip", checksum = "sha256:9ddd0959603a3cdb90926427b2942279d81414c9aad856c97d405bb406d50e8b" }
windows-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/win64/chrome-win64.zip", checksum = "sha256:b897ef3601c947ac0620c784556dec719ac602b0159ce105927acf645ee0f598" }

# Infisical CLI (secrets backend). Its release assets are named
# `cli_<version>_<os>_<arch>.tar.gz`, which mise's default match does not pick
# reliably, so each platform names its own asset. Never collapse this to one
# `asset_pattern` on `infisical = {...}`: `mise upgrade --bump` (install-system)
# resolves a templated pattern on the laptop and writes that laptop's platform
# back, and Linux CI then installs a macOS binary (ENOEXEC).
[tools.infisical]
version = "0.44.3"
platforms= { macos-arm64 = { asset_pattern = "cli_{{ version }}_darwin_arm64.tar.gz" }, macos-x64 = { asset_pattern = "cli_{{ version }}_darwin_amd64.tar.gz" }, linux-arm64 = { asset_pattern = "cli_{{ version }}_linux_arm64.tar.gz" }, linux-x64 = { asset_pattern = "cli_{{ version }}_linux_amd64.tar.gz" }, windows-x64 = { asset_pattern = "cli_{{ version }}_windows_amd64.zip" }, windows-arm64 = { asset_pattern = "cli_{{ version }}_windows_arm64.zip" } }

# Local MQTT broker for `@pkgs/emqx-server-ts` (fidelity-max harnesses and the
# broker contract, which is `test:posix`: EMQX 5 publishes no Windows build, so
# no CI job needs it and Windows skips it).
# Keep in step with the version pin in libs/pubsub-shared-ts/emqx-deploy/Dockerfile.
[tools."github:emqx/emqx"]
version = "5.8.6"
bin_path = "bin"
os = ["linux", "macos"]

# Checksums are EMQX's published `<asset>.sha256` files for this version.
[tools."github:emqx/emqx".platforms]
macos-arm64 = { asset_pattern = "emqx-*-macos14-arm64.zip", checksum = "sha256:1c0c7abc2231567bec07653a877d3966ac0ff947f82cc03615916f9603156539" }
macos-x64 = { asset_pattern = "emqx-*-macos13-amd64.zip", checksum = "sha256:4330af979586d890242ae2f95523b6490578e9f07a5fad3472e1c3890f1d173e" }
linux-arm64 = { asset_pattern = "emqx-*-ubuntu22.04-arm64.tar.gz", checksum = "sha256:7c9e58b6b5d3b55b5dac3b14be0371ccbffd867a3b97b3d3e70930a80cddd9b2" }
linux-x64 = { asset_pattern = "emqx-*-ubuntu22.04-amd64.tar.gz", checksum = "sha256:cda8ca0c44e403de7284d7a4e65101cdaee428385a3ebdb1e34355c46b98eeb8" }

# Apple toolchain. mise cannot install Xcode, so these are read, not
# installed: the Apple task wrappers (`libs/tools-harness-ts/scripts/xcode-task.ts`) find
# this Xcode (`DEVELOPER_DIR`, the active one, or `/Applications/Xcode*.app`)
# and refuse any other. CI verifies no native package, so no CI job uses it;
# only a Mac's `bun verify` does. `[vars]` are not exported to the environment.
[vars]
xcode_version = "27.1"
ios_simulator_runtime = "27.0"
ios_simulator_device = "iPhone 17"
