# Every system tool the repo shells out to, pinned. `mise install` puts these
# exact versions on a laptop; `jdx/mise-action` (`.github/actions/setup`) does
# the same on CI. npm tooling (turbo, wrangler, biome, …) is not here — it is a
# devDependency in `package.json` and arrives with `bun install`.
#
# Bump a version here and nowhere else — except Bun, which Turborepo also reads
# from `package.json` `packageManager`: keep the two equal. `bun install-system`
# bumps every tool here (and npm tooling) to its latest release and keeps Bun
# in step; commit what it changes.

[tools]
bun = "1.4.2"
node = "26.10.0"
gh = "2.102.0"
depot = "2.102.15"
gitleaks = "8.30.1"
actionlint = "1.7.12"
infisical = { version = "0.43.138", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
duckdb = "1.5.6"
# Infrastructure as code (libs/infra): plans, policy gate over plan JSON.
opentofu = "1.13.0"
conftest = "0.71.0"
tflint = "0.64.0"
# Executable specs (specs/README.md): the JVM that runs Alloy (structural
# invariants, `.als`) and Apalache (Quint model checking, `quint verify`).
java = "temurin-21.0.12+8.0.LTS"

# Alloy 6: checks `specs/<context>/*.als` and audits stored snapshots against
# them (`@pkgs/alloy`). A single jar; `mise where http:alloy` holds `alloy.jar`.
[tools."http:alloy"]
version = "6.2.0"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v{{version}}/org.alloytools.alloy.dist.jar"
bin = "alloy.jar"
checksum = "sha256:6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

# Apalache: the model checker behind `quint verify` (`@pkgs/quint`). Keep the
# version equal to the Apalache the pinned Quint expects (its
# DEFAULT_APALACHE_VERSION_TAG), so Quint never downloads one itself.
[tools."http:apalache"]
version = "0.56.1"
url = "https://github.com/apalache-mc/apalache/releases/download/v{{version}}/apalache-{{version}}.tgz"
checksum = "sha256:a61c07569d7195ddc589f01037fa10fafef4fb0796af2f1c9cb45226375dfbfc"

# Local MQTT broker for `@pkgs/emqx-server` (fidelity-max harnesses, test:contract).
# Keep in step with the version pin in libs/pubsub/emqx-deploy/Dockerfile.
[tools."github:emqx/emqx"]
version = "5.8.6"
bin_path = "bin"

[tools."github:emqx/emqx".platforms]
macos-arm64 = { asset_pattern = "emqx-*-macos14-arm64.zip" }
macos-x64 = { asset_pattern = "emqx-*-macos13-amd64.zip" }
linux-arm64 = { asset_pattern = "emqx-*-ubuntu22.04-arm64.tar.gz" }
linux-x64 = { asset_pattern = "emqx-*-ubuntu22.04-amd64.tar.gz" }
