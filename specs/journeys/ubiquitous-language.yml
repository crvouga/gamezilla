# The Journeys context's ubiquitous language: the critical journeys across
# every context, told in the terms those contexts publish (from: <domain>).
# The shared kernel needs no borrowing. See the context map.
context: Journeys
purpose: >-
  The flows people rely on most, followed end to end as a person lives them,
  which must never break anywhere people use the app.

terms:
  - term: critical journey
    definition: >-
      A flow people rely on most, followed from a fresh device through to what
      the person gets out of it. It must never break anywhere people use the
      app.
    forms: [critical journeys]
    avoid: [smoke test, synthetic monitor, happy path]

  - term: opening screen
    definition: >-
      What the app shows while it is opening, before the person reaches the
      tabs. A critical journey never stops there.
    forms: [gets past its opening screen]
    avoid: [boot screen, booting, splash screen, loading screen, spinner]

