# live
# People can open the app at its address, and the app answers them.
# Reaching the app and Serving people require that right now. They do not
# say how often; the rate below is the most the team's regular checks can
# tell apart.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: team-checks-passing
  displayName: The team's checks that find the app answering people
spec:
  description: >-
    Of the team's regular checks from outside, the share that find people can
    open the app at its address and that the app answers people. That is what
    Reaching the app and Serving people ask the team to see. A check that did
    not run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which people could open
            the app at its address and the app answered people.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can open the app at its address and whether it answers
            people.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: the-app-answers-people
  displayName: The app answers people
  labels:
    tier: "0"
spec:
  description: >-
    In at least 97 of every 100 hours in which the team checked, every check
    found people can open the app and that it answers them, judged over the
    last week. The team checks about once an hour, so a week holds at most
    about 170 checks: this is the strictest rate those checks can tell apart
    from chance. The team's minute-by-minute checks (The app is always
    reachable) watch the same promise far more closely.
  service: runtime
  indicatorRef: team-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: In at least 97 of every 100 checked hours the app answers people
      target: 0.97
      timeSliceTarget: 1
      timeSliceWindow: 1h
