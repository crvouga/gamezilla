# live
# Reliability is judged from observed outcomes; missing evidence is not a pass.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: team-tool-checks-passing
  displayName: The team's checks that find its own tools working
spec:
  description: >-
    Of the team's regular checks from outside, the share in which the team
    could follow a request's trail, find a person's trouble and see that the
    environment matches its plan. A check that did not run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which every one of the
            team's own tools worked.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of the
            team's own tools.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: the-team-can-see-what-happened
  displayName: The team can see what happened
  labels:
    tier: "2"
spec:
  description: >-
    The team can see what happened. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: runtime
  indicatorRef: team-tool-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1h
