    missing evidence cannot establish that the promise is kept.
  service: runtime
  indicatorRef: outside-pings-answered-within-two-and-a-half-seconds
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
