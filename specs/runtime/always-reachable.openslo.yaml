# live
# Reliability is judged from observed outcomes; missing evidence is not a pass.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: outside-pings-answered
  displayName: The team's minute-by-minute checks that find the app open
spec:
  description: >-
    Every minute the team opens the app's address from outside, and asks the
    app whether it is ready to serve people, with what they saved within its
    reach. This is the share of those checks in which the app opened and said
    it was ready. A check that could not reach the app, waited too long, or
    got something other than the app counts as not answered.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's minute-by-minute checks from outside in which the app
            opened at its address and said it was ready to serve people.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's minute-by-minute checks from outside of
            whether the app opens at its address and is ready.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: outside-pings-answered-within-a-second
  displayName: The team's minute-by-minute checks answered within a second
spec:
  description: >-
    The same checks, counted by the share the app answered completely within
    a second, from looking up its address to the last of the answer, as a
    person's first visit of the day would.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's minute-by-minute checks from outside that the app
            answered completely within a second.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's minute-by-minute checks from outside.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: outside-pings-answered-within-two-and-a-half-seconds
  displayName: The team's minute-by-minute checks answered in 2.5 seconds
spec:
  description: >-
    The same checks, counted by the share the app answered completely within
    two and a half seconds: past that a person assumes the app is broken.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's minute-by-minute checks from outside that the app
            answered completely within two and a half seconds.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's minute-by-minute checks from outside.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: the-app-is-always-reachable
  displayName: The app is always reachable
  labels:
    tier: "0"
spec:
  description: >-
    The app is always reachable. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: runtime
  indicatorRef: outside-pings-answered
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1m
---
apiVersion: openslo/v1
kind: SLO
