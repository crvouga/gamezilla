apiVersion: openslo/v1
kind: SLI
metadata:
  name: people-requests-answered-within-two-and-a-half-seconds
  displayName: Requests from people answered within two and a half seconds
spec:
  description: >-
    Of the requests people's devices make that they wait on (opening their
    spaces, reading and saving their changes, signing in, joining a room,
    paying), the share the app answers within two and a half seconds. It is
    the slowest answer a person still waits for rather than tapping again or
    giving up. Spoken words and other generated answers take seconds by
    nature and are left out, as are requests that machines make.
  ratioMetric:
    counter: true
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            Requests people wait on that the app answered within two and a
            half seconds.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every request people wait on, other than generated speech and
            text.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: saves-and-loads-are-quick
  displayName: Saves and loads are quick
  labels:
    tier: "0"
spec:
  description: >-
    Saves and loads are quick. At least 99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: runtime
  indicatorRef: saves-and-loads-answered-within-half-a-second
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 99% meet this promise
      target: 0.99
---
