---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: people-requests-answered-within-two-and-a-half-seconds
  displayName: Requests from people answered within two and a half seconds
spec:
  description: >-
    Of the requests people's devices make that they wait on (opening their
    spaces, reading and saving their changes, signing in, joining a room,
    paying), the share the app answers within two and a half seconds. It is
    the slowest answer a person still waits for rather than tapping again or
    giving up. Spoken words and other generated answers take seconds by
    nature and are left out, as are requests that machines make.
  ratioMetric:
    counter: true
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            Requests people wait on that the app answered within two and a
            half seconds.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every request people wait on, other than generated speech and
            text.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: saves-and-loads-are-quick
  displayName: Saves and loads are quick
  labels:
    tier: "0"
spec:
  description: >-
    At least 85 in every 100 reads and saves are answered within half a
    second, judged over the last week. Within about half a second a tap
    feels immediate. Today about 87 in 100 are; the team holds that line
    while it works towards 95 in 100, which a move in a game should feel
    like.
  service: runtime
  indicatorRef: saves-and-loads-answered-within-half-a-second
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 85 in every 100 reads and saves are answered within half a second
      target: 0.85
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: saves-and-loads-never-stall
  displayName: Saves and loads never stall
  labels:
    tier: "0"
spec:
  description: >-
    At least 97 in every 100 reads and saves are answered within a second,
    judged over the last week. A second is where a move or a change stops
    feeling live, so the slow ones are held to a promise of their own rather
    than hidden inside an average. Today about 98 in 100 are, a thin margin;
    the team works towards 99 in 100.
  service: runtime
  indicatorRef: saves-and-loads-answered-within-a-second
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 97 in every 100 reads and saves are answered within a second
      target: 0.97
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: signing-in-is-quick
  displayName: Signing in is quick
  labels:
    tier: "0"
spec:
  description: >-
    At least 95 in every 100 requests that sign people in or keep them
    signed in are answered within a quarter of a second, judged over the
    last week. They come before everything else a person does, so a slow one
    delays the whole visit.
  service: runtime
  indicatorRef: sign-in-requests-answered-within-a-quarter-second
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 95 in every 100 signing-in requests are answered within a quarter of a second
      target: 0.95
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: signing-in-never-stalls
  displayName: Signing in never stalls
  labels:
    tier: "0"
spec:
  description: >-
    At least 99 in every 100 requests that sign people in or keep them
    signed in are answered within a second, judged over the last week.
  service: runtime
  indicatorRef: sign-in-requests-answered-within-a-second
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 99 in every 100 signing-in requests are answered within a second
      target: 0.99
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: the-app-never-leaves-people-waiting
  displayName: The app never leaves people waiting
  labels:
    tier: "1"
spec:
  description: >-
    At least 99 in every 100 requests people wait on are answered within two
    and a half seconds, judged over the last week. Past that a person
    assumes something is broken, taps again, or leaves. It covers every
    request people wait on, joining a room and paying among them, which the
    promises above do not.
  service: runtime
  indicatorRef: people-requests-answered-within-two-and-a-half-seconds
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 99 in every 100 requests people wait on are answered within two and a half seconds
      target: 0.99
