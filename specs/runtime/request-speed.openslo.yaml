        spec:
          measures: >-
            Every request in which a person's device signs them in or keeps
            them signed in.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: sign-in-requests-answered-within-a-second
  displayName: Signing in answered within a second
spec:
  description: >-
    The same signing-in requests, counted by the share the app answers
