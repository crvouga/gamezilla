# live
# The app answers people quickly. Measured from the requests people's devices
# really make to the live app, so it is the wait people live with, not the
# wait on a quiet day in the team's own checks. Reading and saving (a move in
# a game among them) and signing in are held apart, so a slow one cannot hide
# inside a quick total.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: saves-and-loads-answered-within-half-a-second
  displayName: Saves and loads answered within half a second
spec:
  description: >-
    Of the requests in which people's devices read and save their spaces,
    games and changes (a move in a game among them), the share the app
    answers within half a second. Requests that machines make are not
    counted.
  ratioMetric:
    counter: true
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            Reads and saves from people's devices that the app answered
            within half a second.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every request in which a person's device reads or saves their
            spaces, games and changes.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: saves-and-loads-answered-within-a-second
  displayName: Saves and loads answered within a second
spec:
  description: >-
    The same reads and saves, counted by the share the app answers within a
    second.
  ratioMetric:
    counter: true
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            Reads and saves from people's devices that the app answered
            within a second.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every request in which a person's device reads or saves their
            spaces, games and changes.
---
