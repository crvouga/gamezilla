# The App context's ubiquitous language. Terms other contexts own are borrowed
# (from: <domain>); the shared kernel needs no borrowing. See the context map.
context: App
purpose: >-
  The app itself, as a person holds it: it opens, even offline, onto the
  tabs and Settings, keeps each person's place and choices, and carries on
  through lost connections and updates.

terms:
  - term: recovery copy
    definition: >-
      A separate copy of what people saved that the team keeps to recover
      from accidental loss. Ordinary personal data from a confirmed account
      deletion is erased from these copies within 30 days and cannot return
      to use during recovery.
    forms: [recovery copies, recovery copy's]

  - term: account deletion
    from: profile
  - term: personal data
    from: profile
  - term: retention
    from: profile
  - term: Settings
    definition: >-
      The place a person reaches from anywhere in the app to manage their
      account and preferences: the theme, sounds, About, and the devices on
      their account. Leaving it brings them back to the tab they left.
    avoid: [options, settings page, config, configuration]
    model: [Settings, openSettings, leaveSettings]
    published: true

  - term: tabs
    definition: >-
      The app's home once it has opened: Spaces, Notifications and Profile. A
      person lands on Spaces and moves between the tabs freely.
    forms: [tab, the tabs]
    avoid: [home screen, tab bar, navigation bar]
    model: [OnTab, openTab, _lastTab]
    published: true

  - term: first opening
    definition: >-
      The first time a person opens the app on a device: they land on Spaces
      in the tabs, as a guest. After its first opening the app opens again
      even with no connection.
    avoid: [first launch, first boot, install]
    model: [opened, open]

  - term: place in the app
    definition: >-
      Where a person is in the app right now: on one of the tabs, on Settings,
      on people search, in the space they host, or looking at a space they
      just ended. Each device keeps its own place, and being cut off never
      moves anyone.
    avoid: [screen, page, route]
    model: [Place, place]
    published: true

  - term: close and reopen the app
    definition: >-
      A person closing the app on a device and opening it again. It still has
      everything it had: their place in the app is back on the tabs, and their
      preferences are as they left them.
    forms: [closes and reopens the app, closed and reopened the app]
    avoid: [restart, relaunch, reload]

  - term: cut off
    definition: >-
      A device losing its connection. Nobody is thrown out of their place in
      the app; what needs a connection (signing in, searching, hosting or
      ending a space) waits until they are back online. Once the connection
      comes back, anything that needs one, such as signing in, is ready
      again.
    forms: [cuts off, is cut off]
    avoid: [load balancer, dropped socket]
    model: [offline, cutOff, reconnect]

  - term: address
    definition: >-
      Where people reach the app. An address the app does not have leads
      nowhere: the app says there is nothing there and offers the way back to
      Spaces.
    forms: [addresses, address that leads nowhere]
    avoid: [URL, route, hostname, domain name]
    published: true

  - term: outdated app
    definition: >-
      A version of the app older than the product still accepts. It asks the
      person to update the app instead of showing errors, and nothing they did
      on it is lost.
    forms: [outdated, older than the product accepts]
    avoid: [stale client, old build, deprecated version]

  - term: update the app
    definition: >-
      A person moving to a version of the app the product accepts. Everything
      they had is still there afterwards.
    forms: [updates the app, updating the app, asked to update]
    avoid: [reinstall, redeploy]

  - term: version of the app
    definition: >-
      Which release of the app a person has. They can see it in About.
    forms: [versions of the app]
    avoid: [build, build number]
    published: true

  - term: preference
    definition: >-
      A choice a person makes in Settings about how the app looks and sounds:
      the theme, and whether sounds are on. It is kept on the device after the
      app closes.
    forms: [preferences, look and sound choices]
    avoid: [config, local storage]

  - term: dark theme
    definition: >-
      How the app looks when a person prefers it dark, instead of the light
      theme; a preference.
    forms: [light theme]
    avoid: [dark mode, color scheme, skin]

  - term: sounds
    definition: The app's sound effects, which a person can turn off and on; a preference.
    avoid: [audio, sfx]
    published: true

  - term: About in Settings
    definition: The part of Settings that shows which version of the app a person has.

  - term: control
    definition: >-
      Anything in the app a person acts on to do something, such as going to
      one of the tabs, opening Settings or turning sounds off. Every control
      says what it does, to someone listening to the app too.
    forms: [controls]
    avoid: [button, widget, element, link text, field]
    published: true

  - term: listen to the app
    definition: >-
      Use the app by hearing it read aloud instead of seeing it, as people who
      cannot see it do. They hear what every control does and what every
      picture that means something shows.
    forms: [is listening to the app, listening to the app, listens to the app, hears, hear]
    avoid: [screen reader, assistive technology, accessible name, alt text, label]

  - term: keyboard
    definition: >-
      The keys a person can use the app with instead of a mouse or touch.
      Using the keyboard alone, a person moves from one control to the next,
      in the order the controls are shown, and acts on the one their keyboard
      is on. It never gets stuck anywhere, and whatever takes it gives it back
      where it was.
    forms: [keyboard's, keyboard alone, the keyboard alone]
    avoid: [focus, focused, focus ring, focus trap, tab key, tabbing, tab order, keyboard navigation]
    published: true

  - term: the team's plan
    definition: >-
      What the team has written down that an environment should have and how
      it is set up. An environment that differs from it has been changed by
      hand, lost something by accident, or is part-way through a release.
    forms: [as the team planned it, as the team planned them, planned it]
    avoid: [declared environment, infrastructure, config drift, IaC]

  - term: changed by hand
    definition: >-
      Changed by someone directly, outside the team's plan for the
      environment.
    forms: [change made by hand]
    avoid: [manual edit, click-ops]

  - term: release
    definition: >-
      The team putting out a new edition of the app in an environment. An
      unfinished release is one that got only part of the way.
    forms: [releases, unfinished release]
    avoid: [deploy, deployment, rollout]

  - term: the testing tool
    from: developer-tools

  - term: reach the app securely
    definition: >-
      People's devices can trust that an address really is the app, and
      nobody else can read what passes between them. The team checks it will
      still hold two weeks from now.
    forms: [reach every address of the app securely, reach it securely, stays secure]
    avoid: [TLS, SSL, certificate, HTTPS]

  - term: answer people
    definition: >-
      The app responding, right now in this environment, to what people do in
      it, with everything it needs to do so in place.
    forms: [answers people]
    avoid: [uptime, health endpoint, ping]

  - term: what people saved
    definition: >-
      Everything people have kept in the app, such as their accounts and
      progress. It must be ready for the app as it is now.
    avoid: [database, schema, tables, migration, data store]

  - term: setting the app needs
    definition: >-
      Something the team gives the app for this environment so it can run
      there, such as its access to an outside service. The app is given every
      one it needs.
    forms: [every setting it needs]
    avoid: [secret, env var, environment variable, config key]

  - term: outside service
    definition: >-
      A service another company runs that the app relies on to do its job,
      such as Google for signing in or the company that takes payments. The
      team gives the app what it needs to use each one, and each must still
      let the app use it.
    forms: [outside services]
    avoid: [vendor, third party, integration]

  - term: lets the app use it
    definition: >-
      An outside service still working for the app: the company has not
      withdrawn the app's use of it, and it has not run out.
    forms: [still lets the app use it]
    avoid: [accepts the app, credentials valid, token valid]

  - term: upload
    definition: >-
      Something a person puts in the app for it to keep, such as a picture.
      The app can keep one, show it again and remove it, and each
      environment's uploads stay apart from every other environment's.
    forms: [uploads, uploaded]
    avoid: [stored file, file, bucket, blob, object storage]

  - term: trail
    definition: >-
      What the app writes down, each time someone uses it, about what it did
      for them. People never see it; when someone runs into trouble, the team
      follows the trail to find out what happened.
    forms: [trails, leaves a trail, follow the trail, follows the trail]
    avoid: [request record, trace, traces, span, telemetry, logs]
    published: true

  - term: run into trouble
    definition: >-
      Something going wrong for a person in the app, such as an error or
      something not working as it should.
    forms: [runs into trouble, ran into trouble, what went wrong]
    published: true

  # Borrowed from Identity.
  - term: guest
    from: profile
  - term: account
    from: profile
  - term: sign in
    from: profile
    model: [signedIn, signIn]
  - term: username
    from: profile
  - term: Google
    from: profile
  - term: profile
    from: profile
  - term: avatar
    from: profile

  # Borrowed from Spaces.
  - term: space
    from: spaces
    model: [InSpace]
  - term: host
    from: spaces
    model: [host, hosting]
  - term: end a space
    from: spaces
    model: [end, Ended]

  # Borrowed from Friends.
  - term: people search
    from: friends
    model: [Search, Lookup, lookup, lookUp, _searchedFor, Denied, Nobody, Shows]

  # Borrowed from Billing.
  - term: Plus
    from: billing
