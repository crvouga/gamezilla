# The Operations context's ubiquitous language (specs/health/): the promises
# a live environment keeps, as the team sees them from outside. Terms other
# contexts own are borrowed (from: <domain>); the shared kernel is
# specs/ubiquitous-language.yml. Map: docs/CONTEXT_MAP.md.
context: Operations
purpose: >-
  The promises every live environment keeps right now — people reach the app
  securely, it answers them, live updates reach them, payments are real only
  in production — seen by the team from outside.

terms:
  - term: environment
    definition: >-
      One complete, separate copy of the product; production is one. "This
      environment" is the copy a health check is looking at.
    forms: [environments, environment's, this environment]
    avoid: [deployment, stage, stack, instance]

  - term: production environment
    definition: >-
      An environment real people use, and the only kind that takes real
      payments.
    forms: [production environments, production]
    avoid: [prod, live environment]

  - term: declared environment
    definition: >-
      What the team has written down that an environment should be:
      everything in it and how it is set up. An environment that differs has
      been changed by hand, lost something by accident, or is part-way
      through a release.
    forms: [as the team declared it, declared for it]
    avoid: [infrastructure, config drift, IaC]

  - term: changed by hand
    definition: >-
      Changed by someone directly, outside what the team declared for the
      environment.
    forms: [change made by hand]
    avoid: [manual edit, click-ops]

  - term: release
    definition: >-
      A new version of the app reaching an environment. An unfinished release
      is one that has reached it only in part.
    forms: [releases, unfinished release]
    avoid: [deploy, deployment, rollout]

  - term: the testing tool
    definition: >-
      A tool for the team, at its own address beside the app. People who use
      the app never need it.
    forms: [testing tool]
    avoid: [sim, Simulator, harness, dev tools]

  - term: reach the app securely
    definition: >-
      People's devices can trust that an address really is the app, and
      nobody else can read what passes between them. The team checks it will
      still hold two weeks from now.
    forms: [reach every address of the app securely, reach it securely, stays secure]
    avoid: [TLS, SSL, certificate, HTTPS]

  - term: answer people
    definition: >-
      The app responding, right now in this environment, to what people do in
      it, with everything it needs to do so in place.
    forms: [answers people]
    avoid: [uptime, health endpoint, ping]

  - term: what people saved
    definition: >-
      Everything people have kept in the app, such as their accounts and
      progress. It must be ready for the version of the app that is running.
    avoid: [database, schema, tables, migration, data store]

  - term: setting the app needs
    definition: >-
      Something the team gives the app for this environment so it can run
      there, such as its access to an outside service. The app is given every
      one it needs.
    forms: [every setting it needs]
    avoid: [secret, env var, environment variable, config key]

  - term: outside service
    definition: >-
      Something outside the product the app relies on to do its job, such as
      Google for signing in or the payment provider. The app must have access
      to each one, and each must still accept the app.
    forms: [outside services, service, services]
    avoid: [vendor, third party, integration]

  - term: accepts the app
    definition: >-
      An outside service still lets the app use it: its access has not been
      withdrawn or run out.
    forms: [accepting the app, still accepts it]
    avoid: [credentials valid, token valid]

  - term: live updates
    definition: >-
      What happens in a space reaching everyone in it as it happens. Only this
      environment's app sends them, and people's apps receive this
      environment's own.
    forms: [live update]
    avoid: [broker, pub/sub, websocket, push channel]

  - term: well-known password
    definition: >-
      A password anyone could try: the one live updates came with, or one
      published anywhere. Nobody can take over live updates with one.
    forms: [well-known passwords, default password, publicly known password]

  - term: live spaces
    definition: >-
      Spaces as people host and join them in this environment: they can run
      here, and the app can reach them.
    forms: [live space]

  - term: real payments
    definition: >-
      Money people actually pay. Only a production environment takes real
      payments; every other environment only pretends to.
    forms: [real money, payments in this environment are real, payments are real]
    avoid: [live mode, test mode]

  - term: stored file
    definition: >-
      A file the app keeps, such as a picture a person uploads. The app can
      keep one, read it back and remove it, and each environment's stored
      files stay apart from every other environment's.
    forms: [stored files, file, files]
    avoid: [bucket, blob, object storage]

  - term: request record
    definition: >-
      The team's record of what one thing a person asked of the app did. The
      app keeps one for each request, and the team can look it up when
      something goes wrong.
    forms: [request records, what each request did, what a request did, look up what a request did]
    avoid: [trace, traces, span, telemetry, logs]

  - term: way back to the app
    definition: >-
      Where Google sends a person once they have signed in: always back to the
      app they started from, in the environment they started in.

  - term: on the web
    definition: >-
      Using the app at its address rather than as an app installed on a
      device.

  # Borrowed from App.
  - term: address
    from: runtime
  - term: version of the app
    from: runtime

  # Borrowed from Identity.
  - term: sign in
    from: profile
  - term: Google
    from: profile
  - term: Apple
    from: profile

  # Borrowed from Billing.
  - term: Plus
    from: billing

  # Borrowed from Spaces.
  - term: space
    from: spaces
  - term: host
    from: spaces
  - term: join
    from: spaces
