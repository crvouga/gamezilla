# The app answering people, as the team sees it from outside: nearly every one
# of the team's regular checks finds that people can open the app at its
# address and that it answers them. The same promises as "Reaching the app"
# and "Serving people", kept nearly all the time.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: team-checks-passing
  displayName: The team's checks that find the app answering people
spec:
  description: >-
    Of the team's regular checks from outside, the share that find people can
    open the app at its address and that the app answers people.
  ratioMetric:
    counter: true
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which people could open
            the app at its address and the app answered people.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can open the app at its address and whether it answers
            people.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: the-app-answers-people
  displayName: The app answers people
spec:
  description: >-
    People can reach the app and it answers them nearly all the time: at
    least 99 in every 100 of the team's regular checks from outside find it
    so.
  service: health
  indicatorRef: team-checks-passing
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: At least 99 in every 100 checks find the app answering people
      target: 0.99
