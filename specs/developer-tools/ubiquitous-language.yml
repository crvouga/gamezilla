context: Developer tools
purpose: >-
  The team investigates separate copies of the app, keeps useful questions
  and checkpoints, reads automated evidence, and decides whether an edition
  of the app has met every release obligation.

terms:
  - term: spec
    definition: A written promise about what people can do and observe in the app.
    forms: [specs]

  - term: report part
    definition: >-
      One independently completed collection of automated evidence, combined
      with other collections for the same version of the app.
    forms: [report parts]

  - term: UI quality check
    definition: An automated judgement of how clearly and consistently the app is presented.
    forms: [UI quality checks]

  - term: performance check
    definition: An automated judgement of how promptly the app responds to people.
    forms: [performance checks]

  - term: the testing tool
    definition: >-
      The existing place beside the app where the team builds and
      investigates test worlds.
    forms: [testing tool]
    model: [reopenTool]
    published: true

  - term: test world
    definition: >-
      A separate copy of the app with named people and devices used for
      investigation.
    forms: [test worlds, test world's, test worlds']
    model: [world, changeWorld]

  - term: checkpoint
    definition: A saved test world the team can restore later.
    forms: [checkpoints, checkpoint's]
    model: [saveCheckpoint, interruptSave, failRestore, deleteCheckpoint, available, failure]

  - term: test run
    definition: >-
      One automated execution of checks against a particular edition of the app.
    forms: [test runs, test run's]

  - term: test report
    definition: >-
      The recorded outcomes, steps, and captured observations of a test run.
    forms: [test reports, test report's]

  - term: recorded moment
    definition: >-
      What a test run captured at one point, shown for each participating person.
    forms: [recorded moments, recorded moment's]

  - term: heatmap
    definition: >-
      A coloured view of a test report that shows which steps took the most
      time and marks steps that took longer than the team's chosen allowance.
    forms: [heatmaps, heatmap's]

  - term: data notebook
    definition: >-
      The team's saved questions about a selected test world's data and their answers.
    forms: [data notebooks, data notebook's]
    model:
      [
        shown,
        answered,
        cutOff,
        editQuestion,
        addSecond,
        moveLaterAhead,
        moveFirstAhead,
        openAutomatic,
        runWithinLimit,
        runPastLimit,
      ]

  - term: release check
    definition: >-
      The automated verdict that decides whether an edition of the app
      satisfies its required obligations.
    forms: [release checks, release check's]
    published: true

  - term: address
    from: runtime
  - term: version of the app
    from: runtime
  - term: keyboard
    from: runtime
  - term: control
    from: runtime
  - term: place in the app
    from: runtime
  - term: friend
    from: friends
  - term: space
    from: spaces

  - term: edition
    definition: >-
      The particular app the team is checking for release, with the evidence belonging to that same app.

  - term: progress
    definition: >-
      How far a person has reached in the app on their own test device.
