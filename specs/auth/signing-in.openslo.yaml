# live
# Reliability is judged from observed outcomes; missing evidence is not a pass.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: sign-in-checks-passing
  displayName: The team's checks that find people can sign in
spec:
  description: >-
    Of the team's regular checks from outside, the share in which people are
    offered Google sign-in, starting it hands them to Google with the way
    back, Google agrees to send them back, and a person finishing signing in
    knows whether it worked. A check that did not run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which signing in
            worked.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can sign in.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: people-can-sign-in
  displayName: People can sign in
  labels:
    tier: "0"
spec:
  description: >-
    People can sign in. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: auth
  indicatorRef: sign-in-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1h
