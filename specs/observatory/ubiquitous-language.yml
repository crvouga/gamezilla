context: Observatory
purpose: >-
  Authorized people observe whoever is online now, people and Synthetic
  Users alike, and watch anyone live, without ever seeing a person's private
  details.
terms:
  - term: User Observatory
    definition: >-
      Where authorized people see whoever is online now, each with its
      activity and whether it is a person or a Synthetic User, and watch any
      of them live. The Synthetic Users' own part of it, with their personas
      and controls, is the Synthetic Population panel.
    model: [openObservatory]
    published: true
  - term: online now
    definition: >-
      Using the app with a connection at this moment, whether a person or a
      Synthetic User. The User Observatory lists whoever is online now, with
      each one's activity and whether each is a person or a Synthetic User.
    model: [onlineNow, listShown, showing, showOnly, invListShowsOnlineNow, invOnlineNowMeansAppOpenAndConnected]
    published: true
  - term: activity
    definition: >-
      What someone online now is currently doing in the app: browsing,
      looking for a multiplayer opponent for a game, or playing a game.
    forms: [activities]
    model: [continueActivity]
  - term: watch live
    definition: >-
      Follow, from the User Observatory, what someone online now sees in the
      app as it changes: their place in the app and what is shown there.
      Anyone online now can be watched live, a person or a Synthetic User.
      Watching live stops when they are no longer online now.
    forms: [watches live, watching live, watched live]
    model: [watching, watchLive, watchEndedNotice, invWatchingOnlyOnlineNow]
    published: true
  - term: private details
    definition: >-
      Anything a person writes in the app, such as what they search for,
      and anything only they should see, such as their email address and how
      they sign in. Watching a person live never shows them.
    forms: [private detail]
    model: [privateDetailsShown, invPrivateDetailsHidden]
    published: true

  # Borrowed.
  - term: Synthetic User
    from: synthetic-population
  - term: daily schedule
    from: synthetic-population
  - term: place in the app
    from: runtime
    model: [placeShown, placeOf]
  - term: Settings
    from: runtime
    model: [openSettings]
  - term: people search
    from: friends
    model: [searchPeople]
  - term: sign-in method
    from: profile
    model: [viewSignInMethods]
  - term: sign in
    from: profile
  - term: Google
    from: profile
  - term: email address
    from: auth
  - term: game
    from: games
  - term: chess
    from: chess
  - term: Connect Four
    from: connect-four
  - term: multiplayer opponent
    from: chess
  - term: person
    from: kernel
  - term: connection
    from: kernel
    model: [connectionAvailable]
  - term: the app
    from: kernel
    model: [openApp, closeApp]
