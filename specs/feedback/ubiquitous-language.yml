context: Bug reports
purpose: >-
  Let anyone tell the team about a bug in a few moments, with screenshots and
  debug info that let the team reproduce it without asking the person again.
terms:
  - term: bug
    definition: Something the app does differently from what a person expects.
    forms: [bugs]
    avoid: [defect, glitch, issue]
  - term: bug report
    definition: >-
      What a person sends the team about a bug: a description, screenshots and
      debug info. A person opens one by choosing to report a bug, which the
      app offers in Settings, among its actions and wherever it says it has
      run into trouble, by shaking their phone, or by a three-finger press. A
      bug report from a
      signed-in person tells the team which account sent it, and a guest's
      says it came from a guest. The team has a bug report once it is on the
      team's list of work.
    forms:
      [bug reports, bug report's, report a bug, reports a bug, reporting a bug]
    avoid: [feedback, ticket, support request, issue]
    model: [sendBugReport, chooseToReport, closeBugReport, openBugReports]
  - term: the team's list of work
    definition: >-
      Where the team keeps everything it has to do. A bug report that reaches
      the team lands here, and the team has it once, however long it waited.
    avoid: [backlog, tracker, issue tracker, to-do list]
    model: [teamCopies]
  - term: description
    definition: >-
      What the person writes, in their own words, about the bug. It holds at
      most 4,000 characters; a person who reaches that is told the
      description is full, and nothing more is added.
    forms: [describe, describes, described, describing, description's]
    avoid: [summary, title, body, comment]
    model: [describeBug, described]
  - term: draft
    definition: >-
      A bug report its person has not sent yet. The device keeps one draft,
      with its description and screenshots, through closing the bug report
      and reopening the app, until its person sends it or discards it.
    forms: [drafts]
    model: [draft]
  - term: discard
    definition: >-
      Give up a draft. Its description and screenshots are removed from the
      device for good, and the team never gets them.
    forms: [discards, discarded, discarding]
    avoid: [delete, clear, cancel, throw away]
    model: [discardDraft]
  - term: kept bug report
    definition: >-
      A bug report its person has sent that the team does not have yet,
      because the device is offline, the team cannot receive bug reports
      right now, or the device is past the daily bug report limit. The device
      keeps it, through reopening the app, and sends it for the person as
      soon as it can reach the team, so it is never lost.
    forms: [kept bug reports]
    model: [kept]
  - term: screenshot
    definition: >-
      What the team sees of the app on a bug report. A bug report starts with
      one the app takes of what it was showing as the bug report opens. The
      person can remove it, and every picture they add becomes one more
      screenshot. A bug report carries at most 4.
    forms: [screenshots]
    avoid: [screen capture, image, attachment, recording]
    model: [screenshots, removeScreenshot]
  - term: picture
    definition: >-
      A photo or drawing a person has on their device. A picture of at most
      5 MB added to a bug report becomes one of its screenshots.
    forms: [pictures]
    avoid: [image, file, attachment]
    model: [addPicture]
  - term: debug info
    definition: >-
      A record the app always keeps of the last 5 minutes on a device: where
      the person went, what they chose, the trouble the app ran into, the
      connection, the device and the version of the app. It never holds what a
      person typed. Every bug report carries it so the team can reproduce the
      bug. A draft sent later carries both the 5 minutes before the bug report
      was first opened, when the bug happened, and the 5 minutes before it is
      sent.
    avoid: [diagnostics, logs, telemetry, trace]
  - term: shake
    definition: >-
      Moving a phone quickly back and forth, which opens a bug report while
      shake to report is on.
    forms: [shakes, shaking, shaken]
    model: [shakePhone]
  - term: shake to report
    definition: >-
      The choice that lets a shake open a bug report. It is on unless the
      person turns it off, it stays as the person set it when the app is
      reopened, and the person can turn it back on. A phone that asks before
      the app may notice shaking waits for the person to allow it.
    model:
      [
        shakeToReport,
        turnOffShakeToReport,
        turnOnShakeToReport,
        allowShakeToReport,
        refuseShakeToReport,
        phoneAllows,
      ]
  - term: three-finger press
    definition: >-
      Three fingers held still on the app for one second, which opens a bug
      report. Fewer or more fingers, a shorter hold, or fingers that move are
      not one. It works on any device a person uses by touch and needs
      nothing from the device: no choice to turn on and nothing the person
      has to allow. It is how a person reports a bug with their hands where
      a shake cannot open one.
    forms: [holds three fingers still on the app for one second]
    model: [threeFingerPress]
  - term: reproduce
    definition: Do what leads to the same bug again.
    forms: [reproducing, reproduced]
  - term: daily bug report limit
    definition: >-
      The 10 bug reports the team takes from one device in a day, whoever is
      using it, guest or signed in. The day turns at midnight UTC. A bug
      report sent past it is a kept bug report, and reaches the team once the
      limit starts again the next day.
    model: [takenToday]
  - term: the next day
    definition: >-
      The day after today. For bug reports a day turns at midnight UTC, and
      the daily bug report limit starts again then.
    forms: [the next day starts, next day]
    model: [dayPasses]
  - term: run into trouble
    from: runtime
  - term: Settings
    from: runtime
  - term: version of the app
    from: runtime
  - term: keyboard
    from: runtime
    model: [moveKeyboardThrough]
  - term: control
    from: runtime
  - term: listen to the app
    from: runtime
    forms: [hears, is listening to, listening to]
  - term: sign in
    from: profile
  - term: guest
    from: profile
  - term: account
    from: profile
  - term: the app
    from: kernel
    model: [reopenApp]
  - term: the team
    from: kernel
    model: [teamCannotReceive, teamCanReceiveAgain]
  - term: connection
    from: kernel
    model: [loseConnection, connectionReturns]
