    - Chooses Google online
    - Provider proves an existing account
    - SignedIn
    - Returns to their profile after signing in
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Opens chess choices
    - Opens chess puzzles
    - The puzzle becomes ready
    - Opens puzzle feed choices
    - Edits the feed with permission
    - Raises or lowers a feed target beyond its bounds
    - Changes the feed target within its bounds
    - Saves permitted feed choices online
    - Returns to puzzles after saving the feed
    - The puzzle becomes ready
    endsIn:
    - 'Puzzles: Solving'
    gherkin:
    - specs/games/puzzle-feed.feature
    - specs/games/puzzle-feed-sticks.feature
    tour: true
  A shared puzzle opens in practice without another rated start:
    description: An already played linked puzzle opens for practice and reaches that puzzle’s board.
