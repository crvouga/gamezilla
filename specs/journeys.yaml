# Journeys start at the whole-product root and replay through its regions.
journeys:
  A multiplayer draw offer does not freeze play:
    description: The sender's move keeps the offer; the recipient's move declines it while the game continues.
    events:
    - SignedIn
    - Returns to a hosted open space
    - Opens chess choices
    - Opens multiplayer chess
    - Returns to a multiplayer game with a waiting draw offer
    - The offering participant plays a legal multiplayer move
    - The offered participant plays a legal multiplayer move
    endsIn:
    - 'Multiplayer: Playing multiplayer'
    gherkin:
    - specs/games/matched-game-draw-offers.feature
  Offering the multiplayer draw back accepts it:
    description: The recipient's reciprocal draw offer ends the game as an agreed draw.
    events:
    - SignedIn
    - Returns to a hosted open space
    - Opens chess choices
    - Opens multiplayer chess
    - Returns to a multiplayer game with a waiting draw offer
    - Offers the multiplayer draw back
    endsIn:
    - 'Multiplayer: Drawn result'
    gherkin:
    - specs/games/matched-game-draw-offers.feature
  A Custom Game draw refusal needs the sender's next move:
    description: A declined offer cannot be repeated until its sender makes the next legal move.
    events:
    - Returns to a hosted open space
    - Opens chess choices
    - Opens a Custom Game
    - Returns to an active Custom Game
    - Offers a Custom Game draw
    - The other participant declines the Custom Game draw
    - Offers the declined Custom Game draw again before moving
    - The offering participant plays their next legal Custom Game move
    - Offers a Custom Game draw
    endsIn:
    - 'Custom Game: Draw offered'
    gherkin:
    - specs/games/custom-game-draw-offers.feature
  A Custom Game clock needs mating material for a win:
    description: A waiting draw offer does not stop the clock; expiration against a side unable to mate produces a draw.
    events:
    - Returns to a hosted open space
    - Opens chess choices
    - Opens a Custom Game
    - Returns to an active Custom Game
    - Offers a Custom Game draw
    - A Custom Game clock expires against a side unable to mate
    endsIn:
    - 'Custom Game: Drawn result'
    gherkin:
    - specs/chess/custom-game-material.feature
    - specs/games/custom-game-cannot-win.feature
  Returning to a puzzle observes the saved wrong-move result:
    description: Leaving for Profile and returning opens the saved attempt; retry remains an explicit choice.
    events:
    - Returns to a hosted open space
    - Opens chess choices
    - Opens chess puzzles
    - The puzzle becomes ready
    - Plays a legal wrong move
    - Opens Profile
    - Opens Spaces
    - Returns to a hosted open space
    - Opens chess choices
    - Opens chess puzzles
    - The saved attempt has a wrong-move result
    endsIn:
    - 'Puzzles: Wrong move'
    gherkin:
    - specs/games/puzzle-attempt-resume.feature
  Plus credit pays before an expired card:
    description: Unused yearly value becomes Plus credit on the monthly plan and a covered renewal remains active.
    events:
    - SignedIn
    - PaidAccessStarted
    - Opens Settings
    - Opens billing plans
    - Current billing information shows an active membership
    - Switches from yearly to monthly and keeps unused Plus credit
    - Plus credit covers renewal despite an expired card
    endsIn:
    - 'Billing: Active membership'
    - 'Access: Paid access'
    gherkin:
    - specs/billing/plus-credit.feature
  Signing out everywhere clears this device's current identity:
    description: The owned device list explains other signed-in devices; signing out everywhere ends the current session too.
    events:
    - SignedIn
    - Opens Profile
    - Opens account devices while signed in
    - Signs out everywhere
    - SignedOut
    endsIn:
    - 'Identity: Guest'
    - 'Profile: Viewing the profile'
    gherkin:
    - specs/profile/devices.feature
    - specs/profile/sessions.feature
  A left space can be joined again while open:
    description: Leaving succeeds in place and offers rejoining the same open space.
    events:
    - Opens an open space link
    - PersonJoined
    - Chooses to leave the space
    - Confirms leaving the space
    - PersonLeft
    - Joins the open space again
    - PersonJoined
    endsIn:
    - 'Spaces: Joined a space'
    gherkin:
    - specs/spaces/space-live-presence.feature
  Opening the app lands on Spaces:
    description: A fresh app starts on its Spaces tab; opening is the root initial state.
    events: []
    endsIn:
    - 'Identity: Guest'
    - 'Spaces: Lobby'
    gherkin:
    - specs/journeys/critical-journeys.feature
    - specs/runtime/app-shell.feature
    tour: true
  Google sign-in preserves the profile:
    description: Prove an account, finish signing in, and return to the current profile.
    events:
    - Starts signing in
    - Chooses Google online
    - Provider proves an existing account
    - SignedIn
    - Returns to their profile after signing in
    endsIn:
    - 'Identity: Account signed in'
    - 'Profile: Viewing the profile'
    gherkin:
    - specs/profile/sign-in.feature
    - specs/auth/matching-accounts.feature
    tour: true
  Signing out affects this device:
    description: Confirmation and success sign this device out while keeping a visible profile.
    events:
    - Starts signing in
    - Chooses Google online
    - Provider proves an existing account
    - SignedIn
    - Returns to their profile after signing in
    - Chooses to sign out
    - Confirms signing out
    - SignedOut
    endsIn:
    - 'Identity: Guest'
    - 'Profile: Viewing the profile'
    gherkin:
    - specs/journeys/critical-journeys.feature
    - specs/profile/sign-in.feature
    tour: true
  A refused profile edit can be corrected:
    description: A taken name keeps the current profile; a corrected edit then succeeds.
    events:
    - Opens Profile
    - Starts editing the profile
    - Saves a taken username
    - Changes the refused username
    - Saves an allowed profile
    - Returns to their profile
    endsIn:
    - 'Profile: Viewing the profile'
    gherkin:
    - specs/profile/profile-edit.feature
    - specs/profile/username-rules.feature
    tour: true
  Host, share, rename and end a space:
    description: Create a space, share its link, recover from a refused name, end it, then return to Spaces.
    events:
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Shares the space link
    - Closes space sharing
    - Renames the space
    - Saves a refused space name
    - Edits the space name again
    - Saves an allowed space name
    - Chooses to end the space
    - Confirms ending the space
    - SpaceEnded
    - Returns to Spaces
    endsIn:
    - 'Spaces: Lobby'
    gherkin:
    - specs/journeys/critical-journeys.feature
    - specs/spaces/space-create.feature
    - specs/spaces/space-end.feature
    tour: true
  Joining an open space keeps leaving available:
    description: A guest joins from a link, confirms leaving, and sees the left space with rejoining available.
    events:
    - Opens an open space link
    - PersonJoined
    - Chooses to leave the space
    - Confirms leaving the space
    - PersonLeft
    endsIn:
    - 'Spaces: Left space'
    gherkin:
    - specs/journeys/join-and-offline.feature
    tour: true
  An ended space link cannot restart its game:
    description: A link to an ended space explains the outcome and returns to Spaces.
    events:
    - Opens an ended space link
    - Returns to Spaces
    endsIn:
    - 'Spaces: Lobby'
    gherkin:
    - specs/journeys/join-and-offline.feature
    - specs/spaces/space-links.feature
    tour: true
  Solve a first puzzle and deliberately move on:
    description: The first puzzle is solved; moving on is a separate choice unless auto-advance is configured.
    events:
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Opens chess choices
    - Opens chess puzzles
    - The puzzle becomes ready
    - Solves the puzzle
    - Moves to another puzzle within the allowance
    - The puzzle becomes ready
    endsIn:
    - 'Puzzles: Solving'
    gherkin:
    - specs/journeys/critical-journeys.feature
    - specs/games/puzzle-attempt-resume.feature
    tour: true
  Hints, wrong moves and review keep one attempt:
    description: A wrong move needs retry; hints and review stay attached to the same puzzle.
    events:
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Opens chess choices
    - Opens chess puzzles
    - The puzzle becomes ready
    - Plays a legal wrong move
    - Tries the same puzzle again
    - Asks for the first hint
    - Asks for the second hint
    - Plays a correct continuation
    - Reviews an earlier reached position
    - Returns to the current puzzle position
    - Solves the puzzle
    endsIn:
    - 'Puzzles: Solved'
    gherkin:
    - specs/games/puzzle-refusals.feature
    - specs/games/puzzle-review.feature
    tour: true
  Signing in lifts the guest puzzle limit:
    description: At the allowance, the published sign-in result both changes identity and enables a fresh start.
    events:
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Opens chess choices
    - Opens chess puzzles
    - The puzzle becomes ready
    - Solves the puzzle
    - Requests another rated puzzle past the guest allowance
    - SignedIn
    - The puzzle becomes ready
    endsIn:
    - 'Identity: Account signed in'
    - 'Puzzles: Solving'
    gherkin:
    - specs/games/puzzle-quota.feature
    - specs/games/puzzle-limit-upgrade.feature
    tour: true
  A watched board catches up then its space ends:
    description: An offline watcher keeps their board, reconnects, then sees the space end.
    events:
    - Opens Spaces
    - Creates below the hosting limit online
    - SpaceOpened
    - Opens chess choices
    - Opens chess puzzles
    - Joins to watch the host’s puzzle
