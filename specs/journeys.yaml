    - Connection returns to the open space
    - SpaceEnded
    - Returns to Spaces
    endsIn:
    - 'Spaces: Lobby'
    gherkin:
    - specs/games/puzzle-offline.feature
    - specs/games/puzzle-late-watcher.feature
    - specs/spaces/space-end.feature
    tour: true
  Preview and save a puzzle feed then keep playing:
    description: The feed preview reaches its boundary, saves permitted choices, and returns to a fresh puzzle.
    events:
