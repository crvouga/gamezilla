# live
# People can host and join spaces, and the app can pass on what happens in a
# space to everyone in it as it happens. The team checks both from outside on
# every one of its regular checks (Spaces, Seeing each other play), and every
# ten minutes that people's apps can reach the place live updates pass
# through. Two people really seeing each other's moves is checked by the game
# journeys.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: space-checks-passing
  displayName: The team's checks that find people can host and join spaces
spec:
  description: >-
    Of the team's regular checks from outside, the share in which people
    could host a space and join it. A check that did not run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which hosting and
            joining a space worked.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can host and join spaces.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: live-update-checks-passing
  displayName: The team's checks that live updates can reach everyone
spec:
  description: >-
    Of the team's regular checks from outside, the share in which the app
    could pass on what happens in a space to everyone in it, people's apps
    followed this environment's spaces, and nobody could listen in with a
    well-known password. A check that did not run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which the app could
            pass on what happens in a space to everyone in it.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            the app can pass on what happens in a space.
---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: broker-pings-answered
  displayName: The team's checks that people's apps can reach live updates
spec:
  description: >-
    Every ten minutes the team asks, from outside, the place people's apps
    connect to for live updates whether it is there to connect to. This is
    the share of those checks it answered the way it answers a person's app
    starting to connect. A check that could not reach it, waited too long,
    or got any other answer counts as not answered.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's ten-minute checks from outside that found the place
            live updates pass through ready for people's apps to connect.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's ten-minute checks from outside of whether
            people's apps can reach the place live updates pass through.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: people-can-host-and-join-spaces
  displayName: People can host and join spaces
  labels:
    tier: "0"
spec:
  description: >-
    People can host and join spaces. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: spaces
  indicatorRef: space-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1h
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: live-updates-can-reach-everyone
  displayName: Live updates can reach everyone
  labels:
    tier: "0"
spec:
  description: >-
    Live updates can reach everyone. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: spaces
  indicatorRef: live-update-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1h
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: live-updates-can-connect
  displayName: Live updates can connect
  labels:
    tier: "0"
spec:
  description: >-
    Live updates can connect. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: spaces
  indicatorRef: broker-pings-answered
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 10m
