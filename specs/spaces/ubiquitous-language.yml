# The ubiquitous language of Spaces: every word its specs use for live spaces.
# Other contexts borrow the published terms (space, host, join, leave, end a
# space, open space, lobby, space link, hosting limit) with `from: spaces`;
# see the context map.
context: Spaces
purpose: >-
  Live places a person hosts and friends or anyone with the link join, so
  people can be somewhere together, right now.

terms:
  # Published language

  - term: space
    definition: >-
      A live place one person hosts and others join to be together. Everyone
      in it sees who else is there and what happens in it as it happens. It is
      open until its host ends it or leaves it. The host can use it without
      a connection; other people are disconnected while its host is offline.
    forms: [spaces, space's]
    avoid: [session, game room, lobby room, party]
    model: [InSpace, SpaceEvent, Space]
    published: true

  - term: host
    definition: >-
      The person whose space it is: the one who created it. Only the host can
      rename or end it, and it ends when they leave.
    forms: [hosts, hosting, hosted, host's]
    avoid: [owner, creator]
    model: [hostOf, host]
    published: true

  - term: join
    definition: >-
      Come into someone else's open space, from its space link or, for a
      friend's space, from the lobby. A person who joins is in the space.
    forms: [joins, joined, joining]
    avoid: [enter the space]
    model: [join, PersonJoined, joined]
    published: true

  - term: leave
    definition: >-
      Go out of a space for good. Someone who leaves no longer counts among
      the people there. When the host leaves, the space ends for everyone.
      Losing the connection or closing the app is not leaving.
    forms: [leaves, left, leaving]
    avoid: [quit, exit]
    model: [leave, leaveHost, Left, PersonLeft]
    published: true

  - term: end a space
    definition: >-
      The host closes their space for everyone. Everyone in it sees that it
      has ended, it leaves every lobby, and its space link says it has ended
      from then on.
    forms: [end, ends, ended, ending, ends the space, ended the space]
    avoid: [close the space, shut down, delete the space]
    model: [endSpace, Ended, SpaceEnded, EndedSpace]
    published: true

  - term: open space
    definition: >-
      A space that has not ended: people can still join it, and its host can
      return to it.
    forms: [open spaces]
    avoid: [live space, active space, running space]
    model: [_openSpaces, SpaceOpened, OpenSpace]
    published: true

  - term: lobby
    definition: >-
      Where a person finds spaces: it lists every open space they host or
      have joined, and every open space a friend of theirs hosts or has
      joined, each of which they can return to or join.
    forms: [lobby's, lobbies]
    avoid: [space list, dashboard]
    model: [Lobby, lobby, _listing]
    published: true

  - term: space link
    definition: >-
      The link to one space. Anyone who has it can join that space, even a
      guest; it always says where it leads: into an open space, or plainly to
      a space that has ended or does not exist.
    forms: [space links, space's link, the link]
    avoid: [invite link, invite code, room code]
    published: true

  - term: hosting limit
    definition: >-
      How many spaces a person may host at once: one for a guest or a free
      account, no limit for a Plus member. Reaching it is an invitation to
      Plus, never an error.
    forms: [hosting limits]
    avoid: [space limit, space quota]
    published: true

  # This context's own language

  - term: create a space
    definition: >-
      Start a new space. The person who creates it is its host and is in it
      straight away, and it is open, with or without a connection.
    forms: [creates a space, created a space, creates another space, creating a space]
    avoid: [start a space, make a space, open a space]
    model: [createSpace]
    published: true

  - term: return to a space
    definition: >-
      Go back into one's own open space from the lobby, as its host, after
      stepping out of it.
    forms: [returns to their space, returned to their space, returns to the space]
    avoid: [reopen the space, reopens their space]
    model: [returnToSpace]
    published: true

  - term: step out
    definition: >-
      Go from a space back to the lobby without leaving it. The space stays
      open, and the person can return to it or join it again.
    forms: [steps out, stepped out, stepping out]
    model: [stepOut]

  - term: go back to the lobby
    definition: >-
      Go to the lobby from wherever a person is in Spaces. From a space they
      are in, that is stepping out; from a space that has ended, it is all
      there is left to do.
    forms: [goes back to the lobby, gone back to the lobby, went back to the lobby]
    model: [goBackToLobby]

  - term: drop out
    definition: >-
      Stop counting among the people in a space after being without a
      connection for a while, or when its host goes offline, without having
      left it. Once both connections come back, the person is there again,
      once. The host keeps using their own space while offline.
    forms: [drops out, dropped out]
    model: [DroppedOut]

  - term: presence
    definition: >-
      Who is in a space right now, which everyone in it sees live as the
      people there and how many they are. Someone who leaves, steps out or
      drops out stops showing; nobody ever shows twice. An offline host sees
      only themselves; other people see nobody while the host is offline.
    avoid: [roster, member list]
    model: [presence, presenceOf, ViewingPresence, viewPresence, stopViewingPresence, _counting]

  - term: whereabouts
    definition: >-
      Where a person is in Spaces right now: the lobby, in a space, looking at
      who is in it, or looking at a space that has ended.
    model: [Whereabouts, RecoveryWhereabouts, whereabouts]

  - term: rename a space
    definition: >-
      The host gives their space a new name. Everyone in the space, and every
      friend whose lobby lists it, sees the new name.
    forms: [renames the space, renamed the space, rename the space, clears the space name, cleared the space name]
    model: [rename, lastRename, RenameResult, NoRename, NameSaved, NameNotAllowed]

  - term: space name
    definition: >-
      What a space is called: the name its host gave it, or, without one,
      the host's name as everyone sees it, their username or their stand-in
      name, followed by "'s space" (the space is then named after its host).
      A name is not allowed when it holds an offensive word (however
      disguised, but not one only inside an ordinary word such as
      Scunthorpe), a web or email address, or letters that are invisible or
      make the name read backwards. A name that is not allowed is refused and the space keeps
      the name it had. The host can clear the name, and the space is named
      after them again.
    forms: [space names, named after]
    model: [spaceName, givenName, NAMED_AFTER_HOST]

  - term: not allowed
    definition: >-
      Said of a space name the rules refuse (see space name). These standing
      rules never change; the team can also stop allowing other names on top
      of them.
    avoid: [banned, blocked, censored, moderated, inappropriate]
    model: [ALWAYS_REFUSED]

  - term: no longer allowed
    definition: >-
      Said of a space name given before the rules stopped allowing it. The
      host keeps it, but everyone sees the space named after its host, as if
      it had never been given a name.
    avoid: [banned, flagged, censored, moderated]
    model: [notAllowed]

  - term: invited to Plus
    definition: >-
      What a person sees on reaching their hosting limit: an offer of Plus so
      they can host more spaces, instead of an error.
    forms: [invited to get Plus, invitation to Plus]

  - term: joining needs a connection
    definition: >-
      Joining someone else's space needs both people to have a connection.
      Creating and using one's own space never needs a connection.

  - term: what happens in a space
    definition: >-
      What people do in a space, such as joining, leaving and moving pieces,
      as everyone else in it sees it within moments. This environment's app
      passes it on, and people's apps follow what happens in this
      environment's spaces, never another's.
    forms: [what happens in this environment's spaces, pass on what happens in a space]
    avoid: [live updates, broker, pub/sub, websocket, push channel]

  - term: listen in on spaces
    definition: >-
      Someone outside the team secretly seeing, or disturbing, what happens in
      people's spaces. Nobody can, not even with a well-known password.
    forms: [listen in, listen in on spaces or disturb them]

  - term: well-known password
    definition: >-
      A password anyone could try: the one something came with from its
      maker (the default password), or one published anywhere.
    forms: [well-known passwords, default password, publicly known password]

  # Borrowed language
  - term: account deletion
    from: profile
  - term: recently proven account
    from: profile

  - term: guest
    from: profile
  - term: account
    from: profile
  - term: sign in
    from: profile
  - term: Plus
    from: billing
  - term: Plus member
    from: billing
  - term: free account
    from: billing
  - term: friend
    from: friends
    model: [friend]
  - term: username
    from: profile
  - term: rename themselves
    from: profile
  - term: stand-in name
    from: profile
  - term: stop allowing
    from: profile
    model: [stopAllowing]
  - term: start allowing
    from: profile
    model: [startAllowing]
