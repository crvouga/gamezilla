# The ubiquitous language of Index tuning: the product keeping the lookups
# the team declares fast on its own. Index tuning stands alone
# (docs/CONTEXT_MAP.md): it borrows nothing from another context and
# publishes nothing. Its observer is the team, from outside the product.
context: Index tuning
purpose: >-
  The product gives every lookup the team declares the index it needs, and
  clears away the indexes nothing needs any more, without ever losing one
  that is still used or one the team keeps itself.

terms:
  - term: lookup
    definition: >-
      One kind of question the product asks of what it keeps, again and
      again, such as finding a person's notes by who wrote them. A lookup
      with an index finds its answer without reading everything.
    forms: [lookups]
    avoid: [query, statement]
    model: [Lookup]

  - term: notes by author
    definition: >-
      The lookup that finds the notes a person wrote.
    forms: [notes-by-author]
    model: [NotesByAuthor]

  - term: notes by owner
    definition: >-
      The lookup that finds the notes a person owns.
    forms: [notes-by-owner]
    model: [NotesByOwner]

  - term: declare
    definition: >-
      The team says which lookups the product makes now. What the team
      declares replaces what it declared before; declaring no lookups at all
      is allowed.
    forms: [declares, declared, declaring, no longer declares]
    avoid: [manifest, workload]
    model: [declare, declared]

  - term: index
    definition: >-
      A way of keeping what the product holds so that one lookup finds its
      answer quickly. Every index is either a tuned index or the team's own.
    forms: [indexes]

  - term: tuning
    definition: >-
      One pass the product makes over the declared lookups: it adds a tuned
      index for each declared lookup that has none, stops retiring any
      tuned index a declared lookup needs again, starts retiring each tuned
      index no declared lookup needs, and removes each retiring index whose
      retirement window has passed unused. Tuning again with nothing new to
      do changes nothing.
    forms: [tune, tunes, tuning runs, tuning has run]
    model: [tune]

  - term: tuned index
    definition: >-
      An index tuning added for a declared lookup. Only tuning adds or
      removes one; a lookup has at most one.
    forms: [tuned indexes]
    model: [tuned]

  - term: the team's own index
    definition: >-
      An index the team keeps itself. Tuning never adds, retires or removes
      one, however long it goes unused.
    forms: [its own index, own index]
    model: [teamIndex, keepOwnIndex]

  - term: retiring
    definition: >-
      A tuned index no declared lookup needs is retiring: it stays, so a
      lookup still using it keeps working, until a whole retirement window
      passes without it being used. Declaring its lookup again ends its
      retirement.
    forms: [retire, retires, retired, retirement, began retiring, not retiring]
    model: [retiring]

  - term: retirement window
    definition: >-
      How long a retiring index must go unused before tuning removes it.
      Each use starts the window again.
    forms: [retirement windows]

  - term: use
    definition: >-
      A lookup finding its answer through an index. The team can see how
      many times each tuned index has been used.
    forms: [uses, used, using]
    model: [use, uses]

  - term: day
    definition: >-
      A calendar day passing for the product. Retirement windows are
      counted in days.
    forms: [days, days pass, days have passed]
    model: [daysPass]
