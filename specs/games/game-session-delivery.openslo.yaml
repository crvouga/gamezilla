# Connected people see the agreed game session choices promptly, in every game.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: game-session-choice-arrival
  displayName: Time for a game session choice to reach another person
spec:
  description: >-
    Seconds from a connected creator's accepted choice until another
    connected person in the same space sees that choice.
  thresholdMetric:
    metricSource:
      type: product
      spec:
        measures: >-
          The seconds between an accepted game session choice and that
          choice showing to another connected person in the space.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: game-session-choices-arrive-promptly
  displayName: Game session choices arrive promptly
spec:
  description: >-
    At least 99 in every 100 accepted choices reach other connected
    people in the same space within five seconds over the last four weeks.
  service: games
  indicatorRef: game-session-choice-arrival
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: Almost every choice arrives within five seconds
      op: lte
      value: 5
      target: 0.99
