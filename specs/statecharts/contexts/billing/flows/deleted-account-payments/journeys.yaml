journeys:
  Deletion cancels future membership charges:
    description: Deletion cancels future membership charges
    startingConditions:
    - Alice has subscribed to Plus
    - Alice has a recently proven account
    events:
    - Alice confirms account deletion
    endsIn: Alice's membership cannot renew because the account was deleted — 1
    checks:
    - Alice's membership cannot renew because the account was deleted
    - Alice no longer has paid access
    gherkin:
    - specs/billing/deleted-account-payments.feature:8 — Deletion cancels future membership charges
    exampleRow: []
  An unfinished cancellation cannot be called complete:
    description: An unfinished cancellation cannot be called complete
    startingConditions:
    - Alice's account deletion has been confirmed
    - the payment provider has not yet confirmed cancellation
    events:
    - Alice views the account deletion outcome
    endsIn: Alice is told cancellation is still being completed — 2
    checks:
    - Alice is told cancellation is still being completed
    - Alice is not told the membership cancellation has completed
    gherkin:
    - specs/billing/deleted-account-payments.feature:15 — An unfinished cancellation cannot be called complete
    exampleRow: []
  A charge after confirmed deletion is refunded:
    description: A charge after confirmed deletion is refunded
    startingConditions:
    - Alice's account deletion has been confirmed
    events:
    - Alice's payment provider takes another membership payment
    endsIn: that payment is refunded in full because account deletion had already been confirmed — 3
    checks:
    - that payment is refunded in full because account deletion had already been confirmed
    gherkin:
    - specs/billing/deleted-account-payments.feature:22 — A charge after confirmed deletion is refunded
    exampleRow: []
  Minimum payment evidence remains available for accounting:
    description: Minimum payment evidence remains available for accounting
    startingConditions:
    - Alice's account deletion has completed
    - Alice made a membership payment less than 7 years ago
    events:
    - the team reviews that payment record for accounting
    endsIn: the team can see its minimum payment evidence — 4
    checks:
    - the team can see its minimum payment evidence
    gherkin:
    - specs/billing/deleted-account-payments.feature:29 — Minimum payment evidence remains available for accounting
    exampleRow: []
  A payment record cannot restore paid access:
    description: A payment record cannot restore paid access
    startingConditions:
    - Alice's account deletion has completed
    - Alice's payment record is still retained for accounting
    events:
    - Alice signs in with Google
    endsIn: Alice has free access — 5
    checks:
    - Alice has free access
    - Alice's payment record cannot restore the deleted account's membership
    gherkin:
    - specs/billing/deleted-account-payments.feature:35 — A payment record cannot restore paid access
    exampleRow: []
  Ordinary payment retention expires after seven years:
    description: Ordinary payment retention expires after seven years
    startingConditions:
    - Alice's payment record is 7 years old
    - no specific legal preservation obligation applies to it
    events:
    - the team reviews payment records due for erasure
    endsIn: that payment record cannot remain because its retention period has expired — 6
    checks:
    - that payment record cannot remain because its retention period has expired
    gherkin:
    - specs/billing/deleted-account-payments.feature:42 — Ordinary payment retention expires after seven years
    exampleRow: []
