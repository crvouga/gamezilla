journeys:
  A Plus member keeps their membership when the team switches payment provider:
    description: A Plus member keeps their membership when the team switches payment provider
    startingConditions:
    - Alice has subscribed to Plus
    events:
    - the team switches payment provider
    endsIn: Alice has paid access — 1
    checks:
    - Alice has paid access
    - Alice is not offered to subscribe
    - Alice's billing portal is the first payment provider's
    gherkin:
    - specs/billing/payment-provider-switch.feature:10 — A Plus member keeps their membership when the team switches
      payment provider
    exampleRow: []
  A renewal at the first payment provider keeps the membership going:
    description: A renewal at the first payment provider keeps the membership going
    startingConditions:
    - Alice has subscribed to Plus
    - the team has switched payment provider
    events:
    - Alice's billing period ends
    endsIn: Alice's membership is active — 2
    checks:
    - Alice's membership is active
    - Alice has paid access
    gherkin:
    - specs/billing/payment-provider-switch.feature:19 — A renewal at the first payment provider keeps the membership
      going
    exampleRow: []
  Canceling immediately at the first payment provider ends the membership:
    description: Canceling immediately at the first payment provider ends the membership
    startingConditions:
    - Alice has subscribed to Plus
    - the team has switched payment provider
    events:
    - Alice's membership is canceled immediately
    endsIn: Alice's membership has ended — 3
    checks:
    - Alice's membership has ended
    gherkin:
    - specs/billing/payment-provider-switch.feature:26 — Canceling immediately at the first payment provider ends
      the membership
    exampleRow: []
  Subscribing after the switch starts at the second payment provider:
    description: Subscribing after the switch starts at the second payment provider
    startingConditions:
    - Alice is signed in with Google
    - the team has switched payment provider
    events:
    - Alice subscribes to Plus when Alice is signed in with Google and the team has switched payment provider
    endsIn: Alice has paid access — 4
    checks:
    - Alice has paid access
    - Alice's membership is trialing
    - Alice's billing portal is the second payment provider's
    gherkin:
    - specs/billing/payment-provider-switch.feature:34 — Subscribing after the switch starts at the second payment
      provider
    exampleRow: []
  A person whose membership ended subscribes again at the second payment provider:
    description: A person whose membership ended subscribes again at the second payment provider
    startingConditions:
    - Alice has subscribed to Plus
    - Alice's membership has been canceled immediately
    - the team has switched payment provider
    events:
    - Alice subscribes to Plus when Alice has subscribed to Plus and Alice's membership has been canceled immediately
      and the team has switched payment provider
    endsIn: Alice's membership is trialing — 5
    checks:
    - Alice's membership is trialing
    - Alice's billing portal is the second payment provider's
    gherkin:
    - specs/billing/payment-provider-switch.feature:42 — A person whose membership ended subscribes again at the
      second payment provider
    exampleRow: []
  After switching back, subscribing again starts at the first payment provider:
    description: After switching back, subscribing again starts at the first payment provider
    startingConditions:
    - Alice's memberships have ended at both payment providers
    - the team has switched back to the first payment provider
    events:
    - Alice subscribes to Plus when Alice's memberships have ended at both payment providers and the team has switched
      back to the first payment provider
    endsIn: Alice's membership is trialing — 6
    checks:
    - Alice's membership is trialing
    - Alice's billing portal is the first payment provider's
    gherkin:
    - specs/billing/payment-provider-switch.feature:50 — After switching back, subscribing again starts at the first
      payment provider
    exampleRow: []
