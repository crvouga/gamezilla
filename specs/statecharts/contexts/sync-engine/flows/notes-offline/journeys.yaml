journeys:
  A note written offline shows for its writer but waits to reach others:
    description: A note written offline shows for its writer but waits to reach others
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice's app is offline
    events:
    - Alice writes the note 'Groceries' saying 'milk'
    endsIn: Alice sees the note "Groceries" at once — 1
    checks:
    - Alice sees the note "Groceries" at once
    - Bob does not see the note "Groceries"
    gherkin:
    - specs/sync-engine/notes-offline.feature:13 — A note written offline shows for its writer but waits to reach
      others
    exampleRow: []
  A note written offline reaches others once the app is back online:
    description: A note written offline reaches others once the app is back online
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice's app is offline
    - Alice has written the note "Groceries" saying "milk"
    events:
    - Alice's app comes back online when Alice and Bob are in the shared space 'Trip' and Alice's app is offline
      and Alice has written the note 'Groceries' saying 'milk'
    endsIn: Bob sees the note "Groceries" saying "milk" — 2
    checks:
    - Bob sees the note "Groceries" saying "milk"
    gherkin:
    - specs/sync-engine/notes-offline.feature:18 — A note written offline reaches others once the app is back online
    exampleRow: []
  Notes not yet sent still show after the app's data is cleared offline:
    description: Notes not yet sent still show after the app's data is cleared offline
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice's app is offline
    - Alice has written the note "Groceries" saying "milk"
    events:
    - Alice's app has its data cleared
    endsIn: Alice sees the note "Groceries" saying "milk" — 3
    checks:
    - Alice sees the note "Groceries" saying "milk"
    - Bob does not see the note "Groceries"
    gherkin:
    - specs/sync-engine/notes-offline.feature:24 — Notes not yet sent still show after the app's data is cleared
      offline
    exampleRow: []
  After offline edits cross what someone else wrote meanwhile, everyone agrees on every note:
    description: After offline edits cross what someone else wrote meanwhile, everyone agrees on every note
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice's app is offline
    - Alice has written the note "Groceries" saying "milk"
    - Alice has deleted the note "Hotel" before anyone wrote it
    - Alice has deleted the note "Groceries"
    - Bob has written the notes "Hotel" and "Groceries"
    events:
    - Alice's app comes back online when Alice and Bob are in the shared space 'Trip' and Alice's app is offline
      and Alice has written the note 'Groceries' saying 'milk' and Alice has deleted the note 'Hotel' before anyone
      wrote it and Alice has deleted the note 'Groceries' and Bob has written the notes 'Hotel' and 'Groceries'
    endsIn: Alice and Bob agree on every note — 4
    checks:
    - Alice and Bob agree on every note
    gherkin:
    - specs/sync-engine/notes-offline.feature:31 — After offline edits cross what someone else wrote meanwhile,
      everyone agrees on every note
    exampleRow: []
