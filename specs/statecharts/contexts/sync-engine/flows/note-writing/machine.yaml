        target: Bob sees all 65 notes saying "done" — 6
        meta:
          source:
          - specs/sync-engine/note-writing.feature:38
          condition:
          - Alice has written 65 notes that have reached Bob
          example: A change to 65 notes at once reaches everyone, each note once
      ? Alice writes the note 'Groceries' saying 'milk' when Alice and Bob have slow connections and live updates
        have stopped for a while and started again and the next live update to Bob will arrive garbled
      : target: Bob never sees the note "Groceries" without its text — 7
        meta:
          source:
          - specs/sync-engine/note-writing.feature:47
          condition:
          - Alice and Bob have slow connections
          - live updates have stopped for a while and started again
          - the next live update to Bob will arrive garbled
          example: A garbled live update never shows a note without its text
      Alice and Bob keep writing notes:
        target: neither Alice nor Bob ever sees a note go back to what it said before — 8
