journeys:
  Deletion with delayed cancellation:
    description: Account access ends even while the payment provider is being retried.
    events:
    - Requests deletion with proof less than ten minutes old
    - Confirms permanent deletion
    - Deletion is confirmed
    - Provider cancellation remains pending
    - Provider cancellation completes
    endsIn: Membership cancellation complete
  Export expires:
    description: The owner’s ready export ceases to be downloadable after seven days.
    events:
    - Requests an export online with recent proof
    - The complete export becomes ready within twenty-four hours
    - Seven days pass after export becomes ready
    endsIn: Personal-data export expired
