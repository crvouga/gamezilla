journeys:
  Confirming deletion withdraws the account from use:
    description: Confirming deletion withdraws the account from use
    startingConditions:
    - Alice has a recently proven account
    - Alice has reviewed the consequences of account deletion
    events:
    - Alice confirms account deletion when Alice has a recently proven account and Alice has reviewed the consequences
      of account deletion
    endsIn: Alice is signed out — 1
    checks:
    - Alice is signed out
    - Alice's account deletion is acknowledged with its completion deadline
    gherkin:
    - specs/profile/account-deletion.feature:8 — Confirming deletion withdraws the account from use
    exampleRow: []
  Cancelling confirmation keeps the account:
    description: Cancelling confirmation keeps the account
    startingConditions:
    - Alice has reviewed the consequences of account deletion
    events:
    - Alice cancels account deletion
    endsIn: Alice still has the same account because deletion was not confirmed — 2
    checks:
    - Alice still has the same account because deletion was not confirmed
    gherkin:
    - specs/profile/account-deletion.feature:15 — Cancelling confirmation keeps the account
    exampleRow: []
  Old proof requires signing in again:
    description: Old proof requires signing in again
    startingConditions:
    - Alice completed signing in more than 10 minutes ago
    events:
    - Alice confirms account deletion when Alice completed signing in more than 10 minutes ago
    endsIn: Alice is told to prove the account again before deletion — 3
    checks:
    - Alice is told to prove the account again before deletion
    - Alice still has the same account
    gherkin:
    - specs/profile/account-deletion.feature:20 — Old proof requires signing in again
    exampleRow: []
  Proof exactly ten minutes old requires signing in again:
    description: Proof exactly ten minutes old requires signing in again
    startingConditions:
    - Alice completed signing in exactly 10 minutes ago
    events:
    - Alice confirms account deletion when Alice completed signing in exactly 10 minutes ago
    endsIn: Alice is told to prove the account again before deletion — 4
    checks:
    - Alice is told to prove the account again before deletion
    - Alice still has the same account
    gherkin:
    - specs/profile/account-deletion.feature:26 — Proof exactly ten minutes old requires signing in again
    exampleRow: []
  A guest cannot delete an account they do not have:
    description: A guest cannot delete an account they do not have
    startingConditions:
    - Alice is a guest
    events:
    - Alice asks for account deletion
    endsIn: Alice is asked to sign in because deletion needs an account — 5
    checks:
    - Alice is asked to sign in because deletion needs an account
    gherkin:
    - specs/profile/account-deletion.feature:32 — A guest cannot delete an account they do not have
    exampleRow: []
  An offline confirmation never queues a deletion for later:
    description: An offline confirmation never queues a deletion for later
    startingConditions:
    - Alice has a recently proven account
    - Alice is offline
    events:
    - Alice confirms account deletion when Alice has a recently proven account and Alice is offline
    endsIn: Alice is told account deletion needs a connection — 6
    checks:
    - Alice is told account deletion needs a connection
    - Alice still has the same account
    gherkin:
    - specs/profile/account-deletion.feature:37 — An offline confirmation never queues a deletion for later
    exampleRow: []
  An online second device loses access to the deleted account:
    description: An online second device loses access to the deleted account
    startingConditions:
    - Alice has a recently proven account
    - Alice is also signed in on another device
    events:
    - Alice confirms account deletion when Alice has a recently proven account and Alice is also signed in on another
      device
    endsIn: Alice's other device is signed out within 150 seconds — 7
    checks:
    - Alice's other device is signed out within 150 seconds
    - Alice's other device cannot make changes as the deleted account
    gherkin:
    - specs/profile/account-deletion.feature:46 — An online second device loses access to the deleted account
    exampleRow: []
  An offline device loses deleted access when it returns:
    description: An offline device loses deleted access when it returns
    startingConditions:
    - Alice's account deletion has been confirmed on another device
    - Alice's phone is offline
    events:
    - Alice's phone comes back online
    endsIn: Alice's phone is signed out — 8
    checks:
    - Alice's phone is signed out
    - Alice's phone cannot restore the deleted account's personal data
    gherkin:
    - specs/profile/account-deletion.feature:53 — An offline device loses deleted access when it returns
    exampleRow: []
  Signing in after deletion starts afresh:
    description: Signing in after deletion starts afresh
    startingConditions:
    - Alice's account deletion has completed
    events:
    - Alice signs in with Google
    endsIn: Alice has a new account — 9
    checks:
    - Alice has a new account
    - Alice's deleted personal data cannot be recovered by that sign-in
    gherkin:
    - specs/profile/account-deletion.feature:60 — Signing in after deletion starts afresh
    exampleRow: []
  The person can make an informed deletion choice:
    description: The person can make an informed deletion choice
    startingConditions:
    - Alice is signed in
    events:
    - Alice reviews account deletion
    endsIn: Alice sees that account deletion is permanent and signs out every device — 10
    checks:
    - Alice sees that account deletion is permanent and signs out every device
    - Alice sees the personal-data export choice and the retention exceptions
    - Alice sees that hosted spaces and future membership charges will end
    gherkin:
    - specs/profile/account-deletion.feature:69 — The person can make an informed deletion choice
    exampleRow: []
