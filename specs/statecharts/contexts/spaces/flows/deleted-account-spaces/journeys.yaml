journeys:
  Deleting the host's account ends the space:
    description: Deleting the host's account ends the space
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Alice has a recently proven account
    events:
    - Alice confirms account deletion when Alice is hosting a space that Bob joined from the link and Alice has
      a recently proven account
    endsIn: Bob sees the space has ended within 15 seconds — 1
    checks:
    - Bob sees the space has ended within 15 seconds
    gherkin:
    - specs/spaces/deleted-account-spaces.feature:8 — Deleting the host's account ends the space
    exampleRow: []
  The ended space's link cannot admit another person:
    description: The ended space's link cannot admit another person
    startingConditions:
    - Alice's account deletion has ended Alice's space
    events:
    - Bob opens Alice's space link
    endsIn: Bob cannot join because the space has ended — 2
    checks:
    - Bob cannot join because the space has ended
    gherkin:
    - specs/spaces/deleted-account-spaces.feature:14 — The ended space's link cannot admit another person
    exampleRow: []
  The deleted person stops showing in presence:
    description: The deleted person stops showing in presence
    startingConditions:
    - Bob is hosting a space that Alice joined from the link
    - Alice has a recently proven account
    events:
    - Alice confirms account deletion when Bob is hosting a space that Alice joined from the link and Alice has
      a recently proven account
    endsIn: Bob sees only Bob in the space within 15 seconds — 3
    checks:
    - Bob sees only Bob in the space within 15 seconds
    - Bob's space has not ended
    gherkin:
    - specs/spaces/deleted-account-spaces.feature:21 — The deleted person stops showing in presence
    exampleRow: []
  The deleted account cannot rejoin the open space:
    description: The deleted account cannot rejoin the open space
    startingConditions:
    - Alice's account deletion has been confirmed
    events:
    - Alice's other device attempts to join Bob's open space as the deleted account
    endsIn: Alice is told to sign in again because the account was deleted — 4
    checks:
    - Alice is told to sign in again because the account was deleted
    gherkin:
    - specs/spaces/deleted-account-spaces.feature:28 — The deleted account cannot rejoin the open space
    exampleRow: []
