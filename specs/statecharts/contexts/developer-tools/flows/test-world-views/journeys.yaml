journeys:
  The team sees the selected person's device:
    description: The team sees the selected person's device
    startingConditions:
    - the testing tool has a test world with Alice's phone and Bob's phone
    events:
    - the team selects Bob's phone in the test world
    endsIn: the team sees Bob's app — 1
    checks:
    - the team sees Bob's app
    - Alice's phone keeps Alice's place in the app
    gherkin:
    - specs/developer-tools/test-world-views.feature:9 — The team sees the selected person's device
    exampleRow: []
  A missing device choice falls back to an available device:
    description: A missing device choice falls back to an available device
    startingConditions:
    - the testing tool has a test world with Alice's phone only
    events:
    - the team opens the test world's address for Bob's phone
    endsIn: the team sees Alice's app — 2
    checks:
    - the team sees Alice's app
    gherkin:
    - specs/developer-tools/test-world-views.feature:15 — A missing device choice falls back to an available device
    exampleRow: []
  Several people appear together:
    description: Several people appear together
    startingConditions:
    - the testing tool has a test world with Alice's phone and Bob's phone
    events:
    - the team shows several devices in the test world
    endsIn: the team sees Alice's app beside Bob's app — 3
    checks:
    - the team sees Alice's app beside Bob's app
    gherkin:
    - specs/developer-tools/test-world-views.feature:23 — Several people appear together
    exampleRow: []
  Returning to one person keeps the other person's place:
    description: Returning to one person keeps the other person's place
    startingConditions:
    - the testing tool shows Alice's phone beside Bob's phone
    - Bob's app has a place different from Alice's app
    events:
    - the team shows only Alice's phone in the test world
    endsIn: Bob's phone still keeps Bob's place in the app — 4
    checks:
    - Bob's phone still keeps Bob's place in the app
    gherkin:
    - specs/developer-tools/test-world-views.feature:28 — Returning to one person keeps the other person's place
    exampleRow: []
