          source:
          - specs/matchmaking/competing-waits.feature:44
          condition:
          - Alice has stopped waiting
          - Bob is waiting for a match
          example: A stopped wait is not paired with a later compatible person
      Alice stops waiting when Alice has been matched with Bob:
