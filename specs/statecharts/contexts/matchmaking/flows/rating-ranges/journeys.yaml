journeys:
  People exactly 50 points apart accept each other within 50 points:
    description: People exactly 50 points apart accept each other within 50 points
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 50 points
    - Bob is waiting with a rating of 1050, accepting anyone within 50 points
    events:
    - matchmaking pairs people up when Alice is waiting with a rating of 1000, accepting anyone within 50 points
      and Bob is waiting with a rating of 1050, accepting anyone within 50 points
    endsIn: Alice and Bob are matched with each other — 1
    checks:
    - Alice and Bob are matched with each other
    gherkin:
    - specs/matchmaking/rating-ranges.feature:9 — People exactly 50 points apart accept each other within 50 points
    exampleRow: []
  One point outside either person's range prevents a match:
    description: One point outside either person's range prevents a match
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 50 points
    - Bob is waiting with a rating of 1051, accepting anyone within 200 points
    events:
    - matchmaking pairs people up when Alice is waiting with a rating of 1000, accepting anyone within 50 points
      and Bob is waiting with a rating of 1051, accepting anyone within 200 points
    endsIn: Alice is still waiting — 2
    checks:
    - Alice is still waiting
    - Bob is still waiting
    gherkin:
    - specs/matchmaking/rating-ranges.feature:15 — One point outside either person's range prevents a match
    exampleRow: []
  Two waits accept a 60 point difference after one second:
    description: Two waits accept a 60 point difference after one second
    startingConditions:
    - Alice and Bob have growing ranges and ratings 60 points apart
    events:
    - 1 second passes
    endsIn: Alice and Bob accept each other — 3
    checks:
    - Alice and Bob accept each other
    gherkin:
    - specs/matchmaking/rating-ranges.feature:24 — Two waits accept a 60 point difference after one second
    exampleRow: []
  A new wait does not accept a 60 point difference:
    description: A new wait does not accept a 60 point difference
    startingConditions:
    - Alice and Bob have growing ranges and ratings 60 points apart
    events:
    - matchmaking pairs people up when Alice and Bob have growing ranges and ratings 60 points apart
    endsIn: Alice is still waiting — 4
    checks:
    - Alice is still waiting
    - Bob is still waiting
    gherkin:
    - specs/matchmaking/rating-ranges.feature:29 — A new wait does not accept a 60 point difference
    exampleRow: []
  Growing ranges accept exactly 400 points after 35 seconds:
    description: Growing ranges accept exactly 400 points after 35 seconds
    startingConditions:
    - Alice and Bob have growing ranges and ratings 400 points apart
    events:
    - 35 seconds pass
    endsIn: Alice and Bob accept each other — 5
    checks:
    - Alice and Bob accept each other
    gherkin:
    - specs/matchmaking/rating-ranges.feature:35 — Growing ranges accept exactly 400 points after 35 seconds
    exampleRow: []
  Growing ranges never accept 401 points even after a long wait:
    description: Growing ranges never accept 401 points even after a long wait
    startingConditions:
    - Alice and Bob have growing ranges and ratings 401 points apart
    - both have been waiting for 60 seconds
    events:
    - matchmaking pairs people up when Alice and Bob have growing ranges and ratings 401 points apart and both have
      been waiting for 60 seconds
    endsIn: Alice is still waiting — 6
    checks:
    - Alice is still waiting
    - Bob is still waiting
    gherkin:
    - specs/matchmaking/rating-ranges.feature:40 — Growing ranges never accept 401 points even after a long wait
    exampleRow: []
  Alice's later growing range starts at 50 points:
    description: Alice's later growing range starts at 50 points
    startingConditions:
    - Alice stopped a growing wait after 35 seconds
    events:
    - Alice waits with a growing range again
    endsIn: Alice accepts nobody more than 50 points away — 7
    checks:
    - Alice accepts nobody more than 50 points away
    gherkin:
    - specs/matchmaking/rating-ranges.feature:49 — Alice's later growing range starts at 50 points
    exampleRow: []
  Stopping does not carry a wide range into Alice's next wait:
    description: Stopping does not carry a wide range into Alice's next wait
    startingConditions:
    - Alice stopped a growing wait after 35 seconds
    - Alice has a new growing wait
    - Bob is waiting with a rating 400 points above Alice
    events:
    - matchmaking pairs people up when Alice stopped a growing wait after 35 seconds and Alice has a new growing
      wait and Bob is waiting with a rating 400 points above Alice
    endsIn: Alice is still waiting — 8
    checks:
    - Alice is still waiting
    - Bob is still waiting
    gherkin:
    - specs/matchmaking/rating-ranges.feature:54 — Stopping does not carry a wide range into Alice's next wait
    exampleRow: []
