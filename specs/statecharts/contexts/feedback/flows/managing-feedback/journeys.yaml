journeys:
  Changing a report keeps the updated writing:
    description: Changing a report keeps the updated writing
    startingConditions:
    - the team has kept local feedback titled "Board movement"
    events:
    - the team changes that feedback to 'Board polish' saying 'Animate every move'
    endsIn: feedback management shows "Board polish" saying "Animate every move" — 1
    checks:
    - feedback management shows "Board polish" saying "Animate every move"
    gherkin:
    - specs/feedback/managing-feedback.feature:8 — Changing a report keeps the updated writing
    exampleRow: []
  Someone else's feedback is unavailable for changing:
    description: Someone else's feedback is unavailable for changing
    startingConditions:
    - feedback titled "Private observation" belongs to another developer
    events:
    - the team tries to change that feedback
    endsIn: the change is refused because the feedback belongs to another developer — 2
    checks:
    - the change is refused because the feedback belongs to another developer
    gherkin:
    - specs/feedback/managing-feedback.feature:13 — Someone else's feedback is unavailable for changing
    exampleRow: []
  Deleting a draft removes it from feedback management:
    description: Deleting a draft removes it from feedback management
    startingConditions:
    - the team has a draft titled "Board movement" saying "Keep the last move visible"
    events:
    - the team confirms deleting that feedback when the team has a draft titled 'Board movement' saying 'Keep the
      last move visible'
    endsIn: feedback management does not show "Board movement" — 3
    checks:
    - feedback management does not show "Board movement"
    gherkin:
    - specs/feedback/managing-feedback.feature:20 — Deleting a draft removes it from feedback management
    exampleRow: []
  Deleting a report removes it from feedback management:
    description: Deleting a report removes it from feedback management
    startingConditions:
    - the team has kept local feedback titled "Board movement"
    events:
    - the team confirms deleting that feedback when the team has kept local feedback titled 'Board movement'
    endsIn: feedback management does not show "Board movement" — 4
    checks:
    - feedback management does not show "Board movement"
    gherkin:
    - specs/feedback/managing-feedback.feature:25 — Deleting a report removes it from feedback management
    exampleRow: []
  Cancelling deletion keeps the feedback:
    description: Cancelling deletion keeps the feedback
    startingConditions:
    - the team has kept local feedback titled "Board movement"
    events:
    - the team cancels deleting that feedback
    endsIn: feedback management shows "Board movement" — 5
    checks:
    - feedback management shows "Board movement"
    gherkin:
    - specs/feedback/managing-feedback.feature:30 — Cancelling deletion keeps the feedback
    exampleRow: []
  Management includes unfinished and sent feedback:
    description: Management includes unfinished and sent feedback
    startingConditions:
    - the team has kept local feedback titled "Board movement"
    - the team has a draft titled "Hint clarity" saying "Explain why this move works"
    events:
    - the team opens feedback management
    endsIn: feedback management shows "Board movement" — 6
    checks:
    - feedback management shows "Board movement"
    - the team can find the draft "Hint clarity" in feedback management
    gherkin:
    - specs/feedback/managing-feedback.feature:38 — Management includes unfinished and sent feedback
    exampleRow: []
