journeys:
  A requested promotion names each piece and gives the queen the keyboard:
    description: A requested promotion names each piece and gives the queen the keyboard
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8
    events:
    - Alice moves the piece from a7 to a8 when Alice has a chessboard ready for White's promotion from a7 to a8
    endsIn: Alice can identify queen, rook, bishop and knight as the promotion choices without sound — 1
    checks:
    - Alice can identify queen, rook, bishop and knight as the promotion choices without sound
    - Alice's keyboard is on the queen promotion choice
    - Alice sees the White pawn remaining on a7
    gherkin:
    - specs/chess-board/board-promotion.feature:9 — A requested promotion names each piece and gives the queen the
      keyboard
    exampleRow: []
  Disabled input cannot request a promotion choice:
    description: Disabled input cannot request a promotion choice
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8 with interactivity disabled
    events:
    - Alice moves the piece from a7 to a8 when Alice has a chessboard ready for White's promotion from a7 to a8
      with interactivity disabled
    endsIn: Alice cannot request promotion while interactivity is disabled — 2
    checks:
    - Alice cannot request promotion while interactivity is disabled
    - Alice is not offered a promotion choice
    - Alice sees the White pawn remaining on a7
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-promotion.feature:16 — Disabled input cannot request a promotion choice
    exampleRow: []
  A chosen promotion gives its destination the keyboard:
    description: A chosen promotion gives its destination the keyboard
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice chooses the promotion to a queen
    endsIn: Alice's keyboard is on a8 — 3
    checks:
    - Alice's keyboard is on a8
    - Alice sees a White queen on a8
    - Alice's activity receives one move promoting to a queen
    gherkin:
    - specs/chess-board/board-promotion.feature:27 — A chosen promotion gives its destination the keyboard
    exampleRow: []
  A cancelled promotion gives its source the keyboard:
    description: A cancelled promotion gives its source the keyboard
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice cancels the promotion
    endsIn: Alice's keyboard is on a7 — 4
    checks:
    - Alice's keyboard is on a7
    - Alice sees the White pawn remaining on a7
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-promotion.feature:35 — A cancelled promotion gives its source the keyboard
    exampleRow: []
  Choosing a pawn before its last-rank move offers no promotion choices:
    description: Choosing a pawn before its last-rank move offers no promotion choices
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8
    events:
    - Alice selects the piece on a7
    endsIn: Alice is not offered a promotion choice before requesting the last-rank move — 5
    checks:
    - Alice is not offered a promotion choice before requesting the last-rank move
    - Alice sees the White pawn remaining on a7
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-promotion.feature:42 — Choosing a pawn before its last-rank move offers no promotion
      choices
    exampleRow: []
  Escape before requesting promotion keeps the pawn and offers no choice:
    description: Escape before requesting promotion keeps the pawn and offers no choice
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8
    events:
    - Alice cancels the promotion with Escape
    endsIn: Alice is not offered a promotion choice before requesting the last-rank move — 6
    checks:
    - Alice is not offered a promotion choice before requesting the last-rank move
    - Alice sees the White pawn remaining on a7
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-promotion.feature:49 — Escape before requesting promotion keeps the pawn and offers
      no choice
    exampleRow: []
