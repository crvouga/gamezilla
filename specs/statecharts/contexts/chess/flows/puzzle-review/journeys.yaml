    exampleRow: []
  After showing the solution, the line steps back to its start in place:
    description: After showing the solution, the line steps back to its start in place
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice has shown the solution
    events:
    - Alice jumps to the start of the revealed line
    endsIn: Alice's board is at move 1 of the line within 20 seconds — 11
    checks:
    - Alice's board is at move 1 of the line within 20 seconds
    gherkin:
    - specs/chess/puzzle-review.feature:71 — After showing the solution, the line steps back to its start in place
    exampleRow: []
  A puzzle retired after it was played still opens in review:
    description: A puzzle retired after it was played still opens in review
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice has solved the puzzle
    - the puzzle has since been retired
    events:
    - Alice opens the puzzle's review from their game log when Alice is signed in and Alice is solving the four-move
