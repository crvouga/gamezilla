    endsIn: Alice's review is at move 4 of 4, reached without animation — 12
    checks:
    - Alice's review is at move 4 of 4, reached without animation
    gherkin:
    - specs/chess/puzzle-review.feature:76 — A puzzle retired after it was played still opens in review
