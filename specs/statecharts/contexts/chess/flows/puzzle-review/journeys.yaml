  The review after a failed attempt still covers the whole line:
    description: The review after a failed attempt still covers the whole line
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice has played a wrong move and skipped the puzzle
    events:
    - Alice opens the puzzle's review from their game log when Alice is signed in and Alice is solving the four-move
      mate-in-two puzzle and Alice has played a wrong move and skipped the puzzle
    endsIn: Alice's review is at move 4 of 4, reached without animation — 10
    checks:
    - Alice's review is at move 4 of 4, reached without animation
    gherkin:
