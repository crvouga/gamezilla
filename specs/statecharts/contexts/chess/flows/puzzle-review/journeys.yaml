journeys:
  The review opens on the final position and lists the moves in algebraic notation:
    description: The review opens on the final position and lists the moves in algebraic notation
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice has solved the puzzle
    events:
    - Alice opens the puzzle's review from their game log when Alice is signed in and Alice is solving the four-move
      mate-in-two puzzle and Alice has solved the puzzle
    endsIn: Alice's review is at move 4 of 4, reached without animation — 1
    checks:
    - Alice's review is at move 4 of 4, reached without animation
    - Alice's review lists the moves "Kh4, g5+, Kg3, Rg2#"
    gherkin:
    - specs/chess/puzzle-review.feature:20 — The review opens on the final position and lists the moves in algebraic
      notation
    exampleRow: []
  Stepping one move back animates:
    description: Stepping one move <way> animates
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice is reviewing the solved puzzle at move 4
    events:
    - Alice steps back one move in the review
    endsIn: Alice's review is at move 3 of 4, reached with animation — 2
    checks:
    - Alice's review is at move 3 of 4, reached with animation
    gherkin:
    - specs/chess/puzzle-review.feature:26 — Stepping one move <way> animates
    exampleRow:
    - '12'
  Stepping one move forward animates:
    description: Stepping one move <way> animates
    startingConditions:
    - Alice is signed in
    - Alice is solving the four-move mate-in-two puzzle
    - Alice is reviewing the solved puzzle at move 3
    events:
    - Alice steps forward one move in the review
    endsIn: Alice's review is at move 4 of 4, reached with animation — 3
    checks:
    - Alice's review is at move 4 of 4, reached with animation
    gherkin:
    - specs/chess/puzzle-review.feature:26 — Stepping one move <way> animates
    exampleRow:
    - '13'
  Jumping to the start of the review snaps:
