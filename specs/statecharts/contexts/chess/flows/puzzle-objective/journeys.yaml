journeys:
  Either rook delivers a valid checkmate:
    description: Either rook delivers a valid checkmate
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with more than one mate on the final move
    events:
    - Alice plays the move a7-a8
    endsIn: Alice's puzzle is solved within 20 seconds — 1
    checks:
    - Alice's puzzle is solved within 20 seconds
    - Alice's game log records that puzzle as solved
    - Alice's stats show 1 played, 1 solved, and 100% accuracy
    gherkin:
    - specs/chess/puzzle-objective.feature:8 — Either rook delivers a valid checkmate
    exampleRow:
    - '7'
