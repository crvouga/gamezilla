  A legal move that neither solves nor checkmates is wrong:
    description: A legal move that neither solves nor checkmates is wrong
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with more than one mate on the final move
    events:
    - Alice plays the move a7-a6
    endsIn: Alice is told the move was wrong — 3
