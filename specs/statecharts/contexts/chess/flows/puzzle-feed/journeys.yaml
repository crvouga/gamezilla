journeys:
  A new solver's feed serves unseen puzzles at their seed rating:
    description: A new solver's feed serves unseen puzzles at their seed rating
    startingConditions:
    - Alice is signed in
    - Alice is hosting a space
    events:
    - Alice opens puzzles in their space
    endsIn: Alice's feed history shows "Unseen" — 1
    checks:
    - Alice's feed history shows "Unseen"
    - Alice's feed targets 1500 automatically
    gherkin:
    - specs/chess/puzzle-feed.feature:13 — A new solver's feed serves unseen puzzles at their seed rating
    exampleRow: []
  A saved history filter shows on the feed:
    description: A saved history filter shows on the feed
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has chosen "Any" for the unsaved feed history
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
      has chosen 'Any' for the unsaved feed history
    endsIn: Alice's feed history shows "Any" — 2
    checks:
    - Alice's feed history shows "Any"
    - Alice has a puzzle on the board
    gherkin:
    - specs/chess/puzzle-feed.feature:19 — A saved history filter shows on the feed
    exampleRow: []
  Raising the rating offset previews the new target before saving:
    description: Raising the rating offset previews the new target before saving
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice is editing the feed settings
    events:
    - Alice raises the feed rating offset by 2 steps
    endsIn: Alice's feed rating offset is 100 — 3
    checks:
    - Alice's feed rating offset is 100
    - Alice's unsaved feed settings preview a target of 1600
    gherkin:
    - specs/chess/puzzle-feed.feature:26 — Raising the rating offset previews the new target before saving
    exampleRow: []
  A custom target replaces the automatic one:
    description: A custom target replaces the automatic one
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has chosen an unsaved custom feed target raised by 1 step
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
      has chosen an unsaved custom feed target raised by 1 step
    endsIn: Alice's feed targets a custom 1550 — 4
    checks:
    - Alice's feed targets a custom 1550
    gherkin:
    - specs/chess/puzzle-feed.feature:33 — A custom target replaces the automatic one
    exampleRow: []
  Reopening the feed settings keeps the custom target:
    description: Reopening the feed settings keeps the custom target
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has saved a custom feed target raised by 1 step
    events:
    - Alice starts editing the feed settings when Alice is signed in and Alice is playing puzzles in their space
      and Alice has saved a custom feed target raised by 1 step
    endsIn: Alice's unsaved feed settings preview a target of 1550 — 5
    checks:
    - Alice's unsaved feed settings preview a target of 1550
    gherkin:
    - specs/chess/puzzle-feed.feature:39 — Reopening the feed settings keeps the custom target
    exampleRow: []
  The feed settings show how many puzzles fit the target:
    description: The feed settings show how many puzzles fit the target
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has saved a custom feed target raised by 1 step
    events:
    - Alice starts editing the feed settings when Alice is signed in and Alice is playing puzzles in their space
      and Alice has saved a custom feed target raised by 1 step
    endsIn: Alice's unsaved feed settings preview a target of 1550 — 5
    checks:
    - Alice's feed settings show a pool of at least one matching puzzle
    gherkin:
    - specs/chess/puzzle-feed.feature:45 — The feed settings show how many puzzles fit the target
    exampleRow: []
  A custom target changes the rating window the puzzle is chosen from:
    description: A custom target changes the rating window the puzzle is chosen from
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has chosen an unsaved custom feed target raised by 2 steps
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
      has chosen an unsaved custom feed target raised by 2 steps
    endsIn: Alice's feed targets a custom 1600 — 7
    checks:
    - Alice's feed targets a custom 1600
    - Alice is served a puzzle rated between 1400 and 1800
    - Alice is solving a different puzzle than the one before
    gherkin:
    - specs/chess/puzzle-feed.feature:51 — A custom target changes the rating window the puzzle is chosen from
    exampleRow: []
  Saving keeps a previewed auto-advance choice:
    description: Saving keeps a previewed auto-advance choice
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has chosen unsaved auto-advance after one second
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
