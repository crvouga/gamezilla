    exampleRow: []
  '"Failed" brings back a failed puzzle, unrated':
    description: '"Failed" brings back a failed puzzle, unrated'
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has solved 2 puzzles and failed 1
    - Alice has chosen "Failed" for the unsaved feed history
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
      has solved 2 puzzles and failed 1 and Alice has chosen 'Failed' for the unsaved feed history
    endsIn: Alice is solving the puzzle they failed — 20
    checks:
    - Alice is solving the puzzle they failed
    - Alice is told the attempt is unrated
    gherkin:
    - specs/chess/puzzle-feed.feature:158 — "Failed" brings back a failed puzzle, unrated
    exampleRow: []
  '"Failed" with no failed attempt leaves the feed empty and says why':
    description: '"Failed" with no failed attempt leaves the feed empty and says why'
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has solved 2 puzzles in a row
    - Alice has chosen "Failed" for the unsaved feed history
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
      has solved 2 puzzles in a row and Alice has chosen 'Failed' for the unsaved feed history
    endsIn: Alice is told the feed is empty because they have no failed attempts — 21
    checks:
    - Alice is told the feed is empty because they have no failed attempts
    - Alice has no puzzle on the board
    gherkin:
    - specs/chess/puzzle-feed.feature:165 — "Failed" with no failed attempt leaves the feed empty and says why
    exampleRow: []
