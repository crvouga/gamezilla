    endsIn: Alice's saved feed advances after one second — 8
    checks:
    - Alice's saved feed advances after one second
    gherkin:
    - specs/chess/puzzle-feed.feature:62 — Saving keeps a previewed auto-advance choice
    exampleRow: []
  A saved rating offset moves the feed's target:
    description: A saved rating offset moves the feed's target
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has raised the unsaved feed rating offset by 2 steps
    events:
    - Alice saves the feed settings when Alice is signed in and Alice is playing puzzles in their space and Alice
