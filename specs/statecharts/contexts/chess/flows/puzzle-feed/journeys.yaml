  Choosing a theme serves a puzzle with that theme:
    description: Choosing a theme serves a puzzle with that theme
    startingConditions:
    - Alice is signed in
    - the puzzle pool holds puzzles with and without the "fork" theme
    - Alice is playing puzzles in their space
    events:
    - Alice limits the feed to the 'fork' theme
    endsIn: Alice is served a puzzle with the "fork" theme — 18
    checks:
    - Alice is served a puzzle with the "fork" theme
    gherkin:
    - specs/chess/puzzle-feed.feature:142 — Choosing a theme serves a puzzle with that theme
    exampleRow: []
  A puzzle without the chosen theme is not offered:
    description: A puzzle without the chosen theme is not offered
    startingConditions:
    - Alice is signed in
    - the puzzle pool holds puzzles with and without the "fork" theme
    - Alice is playing puzzles in their space
    - Alice has limited the feed to the "fork" theme
    - Alice has skipped the puzzle
    events:
    - Alice moves on to the next puzzle
    endsIn: Alice is not offered a puzzle without the "fork" theme — 19
    checks:
    - Alice is not offered a puzzle without the "fork" theme
    gherkin:
