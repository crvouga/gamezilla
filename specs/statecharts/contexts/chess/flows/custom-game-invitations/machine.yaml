        space and Carol is outside Alice's space
      : target: Carol cannot see the Custom Game — 5
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:32
          condition:
          - Alice has a configuring Custom Game
          - Bob is in Alice's space
          - Carol is outside Alice's space
          example: An outsider is never shown the invitation
      ? Bob accepts Black in the Custom Game when Alice has a configuring Custom Game and Black in the Custom Game
        is reserved for Bob
      : target: Black is Bob in the Custom Game — 6
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:41
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          example: An accepted invitation becomes a participant
      Carol accepts Black in the Custom Game:
        target: Carol is told that side is not their invitation — 7
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:48
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          - Carol is in Alice's space
          example: Another person cannot accept the invitation
      ? Bob declines Black in the Custom Game when Alice has a configuring Custom Game and Black in the Custom Game
        is reserved for Bob
      : target: Black is an open place in the Custom Game — 8
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:57
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          example: The invitee declines without becoming a participant
      Bob declines Black in the Custom Game when Alice has a Custom Game between Alice as White and Bob as Black:
        target: Bob is told that side is not their invitation — 9
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:63
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          example: Declining cannot remove an accepted participant
      ? Bob accepts Black in the Custom Game when Alice has a configuring Custom Game and Bob's invitation to Black
        has been revoked
      : target: Bob is told that side is not their invitation — 11
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:76
          condition:
          - Alice has a configuring Custom Game
          - Bob's invitation to Black has been revoked
          example: A revoked invitation cannot be accepted
      Bob accepts Black while Alice revokes its invitation:
        target: Black is either Bob or an open place in the Custom Game — 12
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:84
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          example: Simultaneous acceptance and revocation leave one valid side
      ? Bob accepts Black in the Custom Game when Alice has a configuring Custom Game and Black in the Custom Game
        is reserved for Bob and Black has since been replaced by a bot
      : target: Bob is told that side is not their invitation — 13
        meta:
          source:
          - specs/chess/custom-game-invitations.feature:91
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          - Black has since been replaced by a bot
          example: An invitation cannot survive replacement by a bot
