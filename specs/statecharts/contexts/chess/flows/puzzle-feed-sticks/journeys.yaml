journeys:
  The feed choices are kept after the app closes:
    description: The feed choices are kept after the app closes
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has saved a custom feed target raised by 1 step
    - Alice has closed and reopened the app
    events:
    - Alice returns to their space when Alice is signed in and Alice is playing puzzles in their space and Alice
      has saved a custom feed target raised by 1 step and Alice has closed and reopened the app
    endsIn: Alice's feed targets a custom 1550 — 1
    checks:
    - Alice's feed targets a custom 1550
    gherkin:
    - specs/chess/puzzle-feed-sticks.feature:14 — The feed choices are kept after the app closes
    exampleRow: []
  The feed choices reach the solver's other device:
    description: The feed choices reach the solver's other device
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has saved a custom feed target raised by 1 step
    events:
    - Alice's account opens on another device when Alice is signed in and Alice is playing puzzles in their space
      and Alice has saved a custom feed target raised by 1 step
    endsIn: Alice's other device's feed targets a custom 1550 within 30 seconds — 2
    checks:
    - Alice's other device's feed targets a custom 1550 within 30 seconds
    gherkin:
    - specs/chess/puzzle-feed-sticks.feature:20 — The feed choices reach the solver's other device
    exampleRow: []
  The history filter is kept after the app closes:
    description: The history filter is kept after the app closes
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has saved a custom feed target raised by 1 step
    - Alice has changed the feed history to "Any" and saved the feed settings
    - Alice has closed and reopened the app
    events:
    - Alice returns to their space when Alice is signed in and Alice is playing puzzles in their space and Alice
      has saved a custom feed target raised by 1 step and Alice has changed the feed history to 'Any' and saved
      the feed settings and Alice has closed and reopened the app
    endsIn: Alice's feed history shows "Any" — 3
    checks:
    - Alice's feed history shows "Any"
    gherkin:
    - specs/chess/puzzle-feed-sticks.feature:24 — The history filter is kept after the app closes
    exampleRow: []
  The chosen theme is kept after the app closes:
    description: The chosen theme is kept after the app closes
    startingConditions:
    - Alice is signed in
    - the puzzle pool holds puzzles with and without the "fork" theme
    - Alice is playing puzzles in their space
    - Alice has limited the feed to the "fork" theme
    - Alice has closed and reopened the app
    events:
    - Alice returns to their space when Alice is signed in and the puzzle pool holds puzzles with and without the
      'fork' theme and Alice is playing puzzles in their space and Alice has limited the feed to the 'fork' theme
      and Alice has closed and reopened the app
    endsIn: Alice's feed is limited to the "fork" theme — 4
    checks:
    - Alice's feed is limited to the "fork" theme
    gherkin:
    - specs/chess/puzzle-feed-sticks.feature:39 — The chosen theme is kept after the app closes
    exampleRow: []
  The chosen theme reaches the solver's other device:
    description: The chosen theme reaches the solver's other device
    startingConditions:
    - Alice is signed in
    - the puzzle pool holds puzzles with and without the "fork" theme
    - Alice is playing puzzles in their space
    - Alice has limited the feed to the "fork" theme
    events:
    - Alice's account opens on another device when Alice is signed in and the puzzle pool holds puzzles with and
      without the 'fork' theme and Alice is playing puzzles in their space and Alice has limited the feed to the
      'fork' theme
    endsIn: Alice's other device's feed is limited to the "fork" theme within 30 seconds — 5
    checks:
    - Alice's other device's feed is limited to the "fork" theme within 30 seconds
    gherkin:
    - specs/chess/puzzle-feed-sticks.feature:44 — The chosen theme reaches the solver's other device
    exampleRow: []
