    endsIn: Alice's puzzle remains skipped — 10
    checks:
    - Alice's puzzle remains skipped
    gherkin:
    - specs/chess/puzzle-attempt-resume.feature:66 — Reopening a finished puzzle retains its result
    exampleRow:
    - '48'
  Reopening a wrong move retains the chance to retry:
    description: Reopening a wrong move retains the chance to retry
    startingConditions:
