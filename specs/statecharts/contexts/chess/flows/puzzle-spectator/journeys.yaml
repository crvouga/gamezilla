journeys:
  The host drives the puzzle and the watcher only watches:
    description: The host drives the puzzle and the watcher only watches
    startingConditions:
    - Alice and Bob are friends
    - Alice is hosting a space that Bob joined from the lobby
    - Alice is playing puzzles in their space
    - Bob is watching Alice's puzzle
    events:
    - Alice plays the next move of the solution when Alice and Bob are friends and Alice is hosting a space that
      Bob joined from the lobby and Alice is playing puzzles in their space and Bob is watching Alice's puzzle
    endsIn: Alice is the host of the puzzle and can move pieces — 1
    checks:
    - Alice is the host of the puzzle and can move pieces
    - Bob is watching the puzzle and cannot move pieces
    gherkin:
    - specs/chess/puzzle-spectator.feature:14 — The host drives the puzzle and the watcher only watches
    exampleRow: []
  The host can move on from a finished puzzle:
    description: The host can move on from a finished puzzle
    startingConditions:
