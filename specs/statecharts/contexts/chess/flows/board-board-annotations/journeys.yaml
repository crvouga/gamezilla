journeys:
  A selected pawn distinguishes capture from an empty destination:
    description: A selected pawn distinguishes capture from an empty destination
    startingConditions:
    - Alice has a chessboard ready for a capture
    events:
    - Alice selects the piece on e4
    endsIn: Alice sees a capture ring on d5 — 1
    checks:
    - Alice sees a capture ring on d5
    - Alice sees a quiet destination dot on e5
    gherkin:
    - specs/chess-board/board-annotations.feature:8 — A selected pawn distinguishes capture from an empty destination
    exampleRow: []
  An en passant destination offers a capture ring before the move:
    description: An en passant destination offers a capture ring before the move
    startingConditions:
    - Alice has a chessboard ready for White to capture en passant from e5 to d6
    events:
    - Alice selects the piece on e5
    endsIn: Alice sees a capture ring on d6 — 2
    checks:
    - Alice sees a capture ring on d6
    - Alice sees a quiet destination dot on e6
    gherkin:
    - specs/chess-board/board-annotations.feature:15 — An en passant destination offers a capture ring before the
      move
    exampleRow: []
  An empty destination is not offered as a capture:
    description: An empty destination is not offered as a capture
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice selects the piece on e2 when Alice has an interactive chessboard
    endsIn: Alice is not offered a capture ring on e4 because e4 is empty — 3
    checks:
    - Alice is not offered a capture ring on e4 because e4 is empty
    - Alice sees a quiet destination dot on e4
    gherkin:
    - specs/chess-board/board-annotations.feature:21 — An empty destination is not offered as a capture
    exampleRow: []
  Activity arrows retain their chosen colors and line styles:
    description: Activity arrows retain their chosen colors and line styles
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice's activity supplies colored arrows
    endsIn: Alice sees a green solid arrow from e2 to e4 — 4
    checks:
    - Alice sees a green solid arrow from e2 to e4
    - Alice sees a blue dashed arrow from a1 to a8
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:30 — Activity arrows retain their chosen colors and line styles
    exampleRow: []
  Activity square marks stay on their assigned squares:
    description: Activity square marks stay on their assigned squares
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice's activity supplies square annotations
    endsIn: Alice sees a blue fill on d5 — 5
    checks:
    - Alice sees a blue fill on d5
    - Alice sees a gold ring on e4
    - Alice sees the badge named "Plan" on f3
    - Alice sees "Plan" in place of the usual badge symbol on f3
    gherkin:
    - specs/chess-board/board-annotations.feature:38 — Activity square marks stay on their assigned squares
    exampleRow: []
  Choosing a piece removes personal marks while preserving activity marks:
    description: Choosing a piece removes personal marks while preserving activity marks
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    events:
    - Alice selects the piece on e2 when Alice has personal arrows and circles alongside activity annotations
    endsIn: Alice sees no personal annotations — 6
    checks:
    - Alice sees no personal annotations
    - Alice sees the activity's arrows and square annotations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:46 — Choosing a piece removes personal marks while preserving
      activity marks
    exampleRow: []
  Choosing a piece clears completed personal marks after drawing is disabled:
    description: Choosing a piece clears completed personal marks after drawing is disabled
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    - Alice has personal annotations disabled
    events:
    - Alice selects the piece on e2 when Alice has personal arrows and circles alongside activity annotations and
      Alice has personal annotations disabled
    endsIn: Alice sees no personal annotations — 7
    checks:
    - Alice sees no personal annotations
    - Alice sees the activity's arrows and square annotations
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:54 — Choosing a piece clears completed personal marks after drawing
      is disabled
    exampleRow: []
  Keyboard selection clears completed personal marks after drawing is disabled:
    description: Keyboard selection clears completed personal marks after drawing is disabled
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    - Alice has personal annotations disabled
    events:
    - Alice selects the piece on e2 with the keyboard
    endsIn: Alice sees no personal annotations — 8
    checks:
    - Alice sees no personal annotations
    - Alice sees the activity's arrows and square annotations
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:64 — Keyboard selection clears completed personal marks after
      drawing is disabled
    exampleRow: []
  Choosing a piece announces empty personal arrows when there are no personal marks:
    description: Choosing a piece announces empty personal arrows when there are no personal marks
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice selects the piece on e2 when Alice has an interactive chessboard
    endsIn: Alice is not offered a capture ring on e4 because e4 is empty — 3
    checks:
    - Alice sees no personal annotations
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:74 — Choosing a piece announces empty personal arrows when there
      are no personal marks
    exampleRow: []
  Choosing an empty square clears personal marks and keeps activity marks:
    description: Choosing an empty square clears personal marks and keeps activity marks
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    events:
    - Alice selects the empty square e3
    endsIn: Alice sees no personal annotations — 10
    checks:
    - Alice sees no personal annotations
    - Alice sees the activity's arrows and square annotations
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:81 — Choosing an empty square clears personal marks and keeps
      activity marks
    exampleRow: []
  Removing activity annotations clears only those annotations:
    description: Removing activity annotations clears only those annotations
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    events:
    - Alice's activity removes its annotations
    endsIn: Alice sees no activity annotations — 11
    checks:
    - Alice sees no activity annotations
    - Alice still sees the personal arrow from e2 to e4 and circle on d5
    gherkin:
    - specs/chess-board/board-annotations.feature:89 — Removing activity annotations clears only those annotations
    exampleRow: []
  A completed personal arrow offers only arrows to the activity:
    description: A completed personal arrow offers only arrows to the activity
    startingConditions:
    - Alice is drawing a personal arrow from e2 to e4
    events:
    - Alice finishes drawing the personal arrow
    endsIn: Alice sees a personal arrow from e2 to e4 — 12
    checks:
    - Alice sees a personal arrow from e2 to e4
    - Alice's activity receives the personal arrow from e2 to e4 without square annotations
    - Alice sees the White pawn remaining on e2
    - Alice sees no selection or legal destinations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:97 — A completed personal arrow offers only arrows to the activity
    exampleRow: []
  Drawing an existing personal arrow removes it:
    description: Drawing an existing personal arrow removes it
    startingConditions:
    - Alice has a personal arrow from e2 to e4
    events:
    - Alice draws a personal arrow from e2 to e4 when Alice has a personal arrow from e2 to e4
    endsIn: Alice sees no personal arrow from e2 to e4 — 13
    checks:
    - Alice sees no personal arrow from e2 to e4
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:106 — Drawing an existing personal arrow removes it
    exampleRow: []
  A second personal arrow preserves the first arrow's identity and color:
    description: A second personal arrow preserves the first arrow's identity and color
    startingConditions:
    - Alice has a personal arrow from e2 to e4
    events:
    - Alice draws a personal arrow from g1 to f3
    endsIn: Alice's activity identifies the same primary green arrow from e2 to e4 alongside the new primary green
      arrow from g1 to f3 — 14
    checks:
    - Alice's activity identifies the same primary green arrow from e2 to e4 alongside the new primary green arrow
      from g1 to f3
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:113 — A second personal arrow preserves the first arrow's identity
      and color
    exampleRow: []
  Marking a square adds a personal circle:
    description: Marking a square adds a personal circle
    startingConditions:
    - Alice has a chessboard with personal annotations enabled
    events:
    - Alice marks e4 with a personal circle when Alice has a chessboard with personal annotations enabled
    endsIn: Alice sees a personal circle on e4 — 15
    checks:
    - Alice sees a personal circle on e4
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice sees the White pawn remaining on e2
    - Alice sees no selection or legal destinations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:119 — Marking a square adds a personal circle
    exampleRow: []
  Marking an existing personal circle removes it:
    description: Marking an existing personal circle removes it
    startingConditions:
    - Alice has a personal circle on e4
    events:
    - Alice marks e4 with a personal circle when Alice has a personal circle on e4
    endsIn: Alice sees no personal circle on e4 — 16
    checks:
    - Alice sees no personal circle on e4
    - Alice's activity receives exactly one empty set of personal arrows
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:128 — Marking an existing personal circle removes it
    exampleRow: []
  A circle change announces existing arrows without circle endpoints:
    description: A circle change announces existing arrows without circle endpoints
    startingConditions:
    - Alice has a personal arrow from e2 to e4 and circle on d5
    events:
    - Alice marks d5 with a personal circle
    endsIn: Alice sees no personal circle on d5 — 17
    checks:
    - Alice sees no personal circle on d5
    - Alice's activity receives the personal arrow from e2 to e4 without square annotations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:135 — A circle change announces existing arrows without circle
      endpoints
    exampleRow: []
  Disabled personal annotations refuse an arrow:
    description: Disabled personal annotations refuse an arrow
    startingConditions:
    - Alice has a chessboard with personal annotations disabled
    events:
    - Alice draws a personal arrow from e2 to e4 when Alice has a chessboard with personal annotations disabled
    endsIn: Alice cannot add a personal annotation while they are disabled — 18
    checks:
    - Alice cannot add a personal annotation while they are disabled
    - Alice sees no personal annotations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:142 — Disabled personal annotations refuse an arrow
    exampleRow: []
  Disabled personal annotations refuse a circle:
    description: Disabled personal annotations refuse a circle
    startingConditions:
    - Alice has a chessboard with personal annotations disabled
    events:
    - Alice marks e4 with a personal circle when Alice has a chessboard with personal annotations disabled
    endsIn: Alice cannot add a personal annotation while they are disabled — 19
    checks:
    - Alice cannot add a personal annotation while they are disabled
    - Alice sees no personal annotations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-annotations.feature:149 — Disabled personal annotations refuse a circle
    exampleRow: []
  Beginning an arrow shows its unfinished drawing:
    description: Beginning an arrow shows its unfinished drawing
    startingConditions:
    - Alice has a chessboard with personal annotations enabled
    events:
    - Alice begins drawing a personal arrow from e2 to e4
    endsIn: Alice sees an unfinished personal arrow from e2 to e4 — 20
    checks:
    - Alice sees an unfinished personal arrow from e2 to e4
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:158 — Beginning an arrow shows its unfinished drawing
    exampleRow: []
  Cancelling an unfinished arrow refuses its completion:
    description: Cancelling an unfinished arrow refuses its completion
    startingConditions:
    - Alice is drawing a personal arrow from e2 to e4
    events:
    - Alice cancels the personal arrow
    endsIn: Alice is not offered a completed personal arrow — 21
    checks:
    - Alice is not offered a completed personal arrow
    - Alice sees no unfinished personal arrow
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:164 — Cancelling an unfinished arrow refuses its completion
    exampleRow: []
  Disabling annotations cancels an unfinished arrow:
    description: Disabling annotations cancels an unfinished arrow
    startingConditions:
    - Alice is drawing a personal arrow from e2 to e4
    events:
    - Alice's board settings disable personal annotations
    endsIn: Alice sees no unfinished personal arrow — 22
    checks:
    - Alice sees no unfinished personal arrow
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:171 — Disabling annotations cancels an unfinished arrow
    exampleRow: []
  Re-enabling annotations permits the next drawing:
    description: Re-enabling annotations permits the next drawing
    startingConditions:
    - Alice has a chessboard with personal annotations disabled
    events:
    - Alice's board settings enable personal annotations
    endsIn: Alice can draw a personal arrow — 23
    checks:
    - Alice can draw a personal arrow
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:177 — Re-enabling annotations permits the next drawing
    exampleRow: []
  Replacing the position abandons only the unfinished drawing:
    description: Replacing the position abandons only the unfinished drawing
    startingConditions:
    - Alice is drawing a personal arrow alongside activity annotations
    events:
    - Alice's activity replaces the position
    endsIn: Alice sees no unfinished personal arrow — 24
    checks:
    - Alice sees no unfinished personal arrow
    - Alice sees the replacement position
    - Alice sees the activity's arrows and square annotations
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:183 — Replacing the position abandons only the unfinished drawing
    exampleRow: []
  Turning the chessboard preserves personal and activity annotations:
    description: Turning the chessboard preserves personal and activity annotations
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations
    events:
    - Alice changes the orientation when Alice has personal arrows and circles alongside activity annotations
    endsIn: Alice still sees the personal arrow from e2 to e4 and circle on d5 — 25
    checks:
    - Alice still sees the personal arrow from e2 to e4 and circle on d5
    - Alice sees the activity's arrows and square annotations
    - Alice's chessboard faces Black
    gherkin:
    - specs/chess-board/board-annotations.feature:194 — Turning the chessboard preserves personal and activity annotations
    exampleRow: []
  Turning the chessboard abandons an unfinished arrow:
    description: Turning the chessboard abandons an unfinished arrow
    startingConditions:
    - Alice is drawing a personal arrow from e2 to e4
    events:
    - Alice changes the orientation when Alice is drawing a personal arrow from e2 to e4
    endsIn: Alice sees no unfinished personal arrow — 26
    checks:
    - Alice sees no unfinished personal arrow
    - Alice's chessboard faces Black
    - Alice's activity receives no annotation changes
    gherkin:
    - specs/chess-board/board-annotations.feature:201 — Turning the chessboard abandons an unfinished arrow
    exampleRow: []
  Turning back preserves the same personal and activity annotations:
    description: Turning back preserves the same personal and activity annotations
    startingConditions:
    - Alice has personal arrows and circles alongside activity annotations on a chessboard facing Black
    events:
    - Alice changes the orientation when Alice has personal arrows and circles alongside activity annotations on
      a chessboard facing Black
    endsIn: Alice still sees the personal arrow from e2 to e4 and circle on d5 — 27
    checks:
    - Alice still sees the personal arrow from e2 to e4 and circle on d5
    - Alice sees the activity's arrows and square annotations
    - Alice's chessboard faces White
    gherkin:
    - specs/chess-board/board-annotations.feature:208 — Turning back preserves the same personal and activity annotations
    exampleRow: []
