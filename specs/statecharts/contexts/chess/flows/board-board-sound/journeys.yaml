journeys:
  An enabled move sounds once:
    description: An enabled move sounds once
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice moves the piece from e2 to e4 when Alice has an interactive chessboard
    endsIn: Alice hears one move sound — 1
    checks:
    - Alice hears one move sound
    gherkin:
    - specs/chess-board/board-sound.feature:8 — An enabled move sounds once
    exampleRow: []
  A silent chessboard stays silent through a move:
    description: A silent chessboard stays silent through a move
    startingConditions:
    - Alice has a silent chessboard
    events:
    - Alice moves the piece from e2 to e4 when Alice has a silent chessboard
    endsIn: Alice cannot hear chessboard sounds while sound is disabled — 2
    checks:
    - Alice cannot hear chessboard sounds while sound is disabled
    - Alice sees a White pawn on e4
    gherkin:
    - specs/chess-board/board-sound.feature:14 — A silent chessboard stays silent through a move
    exampleRow: []
  A silent capture stays silent:
    description: A silent capture stays silent
    startingConditions:
    - Alice has a silent chessboard ready for a capture
    events:
    - Alice moves the piece from e4 to d5
    endsIn: Alice hears no chessboard sounds — 3
    checks:
    - Alice hears no chessboard sounds
    - Alice sees a White pawn on d5
    gherkin:
    - specs/chess-board/board-sound.feature:20 — A silent capture stays silent
    exampleRow: []
  Enabling sound allows the next move:
    description: Enabling sound allows the next move
    startingConditions:
    - Alice has a silent chessboard
    - Alice has chessboard sound enabled
    events:
    - Alice moves the piece from e2 to e4 when Alice has a silent chessboard and Alice has chessboard sound enabled
    endsIn: Alice hears one move sound — 4
    checks:
    - Alice hears one move sound
    gherkin:
    - specs/chess-board/board-sound.feature:28 — Enabling sound allows the next move
    exampleRow: []
  Disabling sound during a capture prevents its delayed sound:
    description: Disabling sound during a capture prevents its delayed sound
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's board settings disable sound
    endsIn: Alice cannot hear chessboard sounds while sound is disabled — 5
    checks:
    - Alice cannot hear chessboard sounds while sound is disabled
    - Alice sees a White pawn on d5
    gherkin:
    - specs/chess-board/board-sound.feature:34 — Disabling sound during a capture prevents its delayed sound
    exampleRow: []
  A replaced position prevents the old capture sound:
    description: A replaced position prevents the old capture sound
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's activity replaces the position
    endsIn: Alice hears no chessboard sounds — 6
    checks:
    - Alice hears no chessboard sounds
    - Alice sees the replacement position
    gherkin:
    - specs/chess-board/board-sound.feature:41 — A replaced position prevents the old capture sound
    exampleRow: []
  Closing the chessboard prevents its delayed sound:
    description: Closing the chessboard prevents its delayed sound
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice closes the chessboard when Alice's capture from e4 to d5 is animating
    endsIn: Alice hears no chessboard sounds — 7
    checks:
    - Alice hears no chessboard sounds
    gherkin:
    - specs/chess-board/board-sound.feature:47 — Closing the chessboard prevents its delayed sound
    exampleRow: []
  Closing after a checking move preserves its move sound and prevents the later check sound:
    description: Closing after a checking move preserves its move sound and prevents the later check sound
    startingConditions:
    - Alice has just checkmated Black by moving the queen from g6 to g7 while the piece is arriving
    events:
    - Alice closes the chessboard when Alice has just checkmated Black by moving the queen from g6 to g7 while the
      piece is arriving
    endsIn: Alice has heard one move sound and cannot hear its delayed check sound — 8
    checks:
    - Alice has heard one move sound and cannot hear its delayed check sound
    gherkin:
    - specs/chess-board/board-sound.feature:52 — Closing after a checking move preserves its move sound and prevents
      the later check sound
    exampleRow: []
