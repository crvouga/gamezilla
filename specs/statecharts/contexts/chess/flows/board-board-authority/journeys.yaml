journeys:
  An enabled chessboard accepts a legal move:
    description: An enabled chessboard accepts a legal move
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice moves the piece from e2 to e4 when Alice has an interactive chessboard
    endsIn: Alice sees a White pawn on e4 — 1
    checks:
    - Alice sees a White pawn on e4
    - Alice's activity receives one move
    gherkin:
    - specs/chess-board/board-authority.feature:8 — An enabled chessboard accepts a legal move
    exampleRow: []
  Disabling interactivity puts a held piece back:
    description: Disabling interactivity puts a held piece back
    startingConditions:
    - Alice is dragging the piece on e2
    events:
    - Alice's board settings disable interactivity when Alice is dragging the piece on e2
    endsIn: Alice no longer holds a piece — 2
    checks:
    - Alice no longer holds a piece
    - Alice sees the White pawn remaining on e2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:15 — Disabling interactivity puts a held piece back
    exampleRow: []
  A disabled chessboard refuses a move:
    description: A disabled chessboard refuses a move
    startingConditions:
    - Alice has a chessboard with interactivity disabled
    events:
    - Alice moves the piece from e2 to e4 when Alice has a chessboard with interactivity disabled
    endsIn: Alice cannot move a piece while interactivity is disabled — 3
    checks:
    - Alice cannot move a piece while interactivity is disabled
    - Alice sees the White pawn remaining on e2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:22 — A disabled chessboard refuses a move
    exampleRow: []
  Disabling interactivity abandons a pending promotion choice:
    description: Disabling interactivity abandons a pending promotion choice
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice's board settings disable interactivity when Alice has a pending White promotion from a7 to a8
    endsIn: Alice sees the White pawn remaining on a7 — 4
    checks:
    - Alice sees the White pawn remaining on a7
    - Alice is not offered a promotion choice
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:29 — Disabling interactivity abandons a pending promotion choice
    exampleRow: []
  Re-enabling interactivity allows a future promotion request:
    description: Re-enabling interactivity allows a future promotion request
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8 with interactivity disabled
    events:
    - Alice's board settings enable interactivity
    endsIn: Alice can request promotion from a7 to a8 — 5
    checks:
    - Alice can request promotion from a7 to a8
    - Alice sees the White pawn remaining on a7
    gherkin:
    - specs/chess-board/board-authority.feature:36 — Re-enabling interactivity allows a future promotion request
    exampleRow: []
  A replacement position puts a held piece back:
    description: A replacement position puts a held piece back
    startingConditions:
    - Alice is dragging the piece on e2
    events:
    - Alice's activity replaces the position when Alice is dragging the piece on e2
    endsIn: Alice no longer holds a piece — 6
    checks:
    - Alice no longer holds a piece
    - Alice sees the replacement position
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:45 — A replacement position puts a held piece back
    exampleRow: []
  Replacing the same position preserves selection:
    description: Replacing the same position preserves selection
    startingConditions:
    - Alice has selected the piece on e2
    events:
    - Alice's activity supplies the same position again
    endsIn: Alice still has e2 selected — 7
    checks:
    - Alice still has e2 selected
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:53 — Replacing the same position preserves selection
    exampleRow: []
  A replacement position abandons a pending promotion choice:
    description: A replacement position abandons a pending promotion choice
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice's activity replaces the position when Alice has a pending White promotion from a7 to a8
    endsIn: Alice sees the replacement position — 8
    checks:
    - Alice sees the replacement position
    - Alice is not offered a promotion choice
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:59 — A replacement position abandons a pending promotion choice
    exampleRow: []
  An unrelated position clears the old move and selection:
    description: An unrelated position clears the old move and selection
    startingConditions:
    - Alice has a chessboard after White's move from e2 to e4 with e7 selected
    events:
    - Alice's activity replaces the position when Alice has a chessboard after White's move from e2 to e4 with e7
      selected
    endsIn: Alice sees the replacement position — 9
    checks:
    - Alice sees the replacement position
    - Alice sees no selection or legal destinations
    - Alice sees no last move marked
    - Alice hears no chessboard sounds
    gherkin:
    - specs/chess-board/board-authority.feature:66 — An unrelated position clears the old move and selection
    exampleRow: []
  An unrelated position clears the earlier move announcement:
    description: An unrelated position clears the earlier move announcement
    startingConditions:
    - Alice has a chessboard after White checkmated Black by moving the queen from g6 to g7
    events:
    - Alice's activity replaces the position when Alice has a chessboard after White checkmated Black by moving
      the queen from g6 to g7
    endsIn: Alice sees the replacement position — 10
    checks:
    - Alice sees the replacement position
    - Alice has no move announcement from the previous position
    gherkin:
    - specs/chess-board/board-authority.feature:75 — An unrelated position clears the earlier move announcement
    exampleRow: []
  Turning a held chessboard puts the piece back:
    description: Turning a held chessboard puts the piece back
    startingConditions:
    - Alice is dragging the piece on e2
    events:
    - Alice changes the orientation
    endsIn: Alice no longer holds a piece — 11
    checks:
    - Alice no longer holds a piece
    - Alice sees the White pawn remaining on e2
    - Alice's chessboard faces Black
    gherkin:
    - specs/chess-board/board-authority.feature:84 — Turning a held chessboard puts the piece back
    exampleRow: []
  A resized chessboard keeps its selected piece:
