    exampleRow: []
  Enabling automatic queen promotion applies to the next new request:
    description: Enabling automatic queen promotion applies to the next new request
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8
    events:
    - Alice's board settings enable automatic queen promotion when Alice has a chessboard ready for White's promotion
      from a7 to a8
    endsIn: Alice can request promotion from a7 to a8 automatically to a queen — 22
    checks:
    - Alice can request promotion from a7 to a8 automatically to a queen
    - Alice sees the White pawn remaining on a7
    gherkin:
    - specs/chess-board/board-authority.feature:174 — Enabling automatic queen promotion applies to the next new
      request
    exampleRow: []
  Disabling automatic queen promotion restores the next explicit choice:
    description: Disabling automatic queen promotion restores the next explicit choice
    startingConditions:
    - Alice has a chessboard ready for White's promotion from a7 to a8 with automatic queen promotion enabled
    events:
    - Alice's board settings disable automatic queen promotion
    endsIn: Alice can request promotion from a7 to a8 with an explicit promotion choice — 23
    checks:
    - Alice can request promotion from a7 to a8 with an explicit promotion choice
    - Alice sees the White pawn remaining on a7
    gherkin:
    - specs/chess-board/board-authority.feature:180 — Disabling automatic queen promotion restores the next explicit
      choice
    exampleRow: []
  Enabling automatic queen promotion preserves a pending explicit choice:
    description: Enabling automatic queen promotion preserves a pending explicit choice
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice's board settings enable automatic queen promotion when Alice has a pending White promotion from a7 to
      a8
    endsIn: Alice is still offered queen, rook, bishop and knight as the promotion choice — 24
    checks:
    - Alice is still offered queen, rook, bishop and knight as the promotion choice
    - Alice cannot complete the move until the pending promotion choice is decided
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:186 — Enabling automatic queen promotion preserves a pending explicit
      choice
    exampleRow: []
