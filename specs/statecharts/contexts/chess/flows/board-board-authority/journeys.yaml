    gherkin:
    - specs/chess-board/board-authority.feature:159 — An unusable supplied position keeps the last good position
    exampleRow: []
  An unusable initial position starts normal chess:
    description: An unusable initial position starts normal chess
    startingConditions:
    - Alice's activity has no chessboard yet
    events:
    - Alice's activity starts a chessboard with an unusable position
    endsIn: Alice sees the position before White's first move — 21
    checks:
    - Alice sees the position before White's first move
    - Alice sees White to move
    gherkin:
