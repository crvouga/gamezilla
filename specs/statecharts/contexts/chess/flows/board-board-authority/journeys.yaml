    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice cancels the drag when Alice has an interactive chessboard
    endsIn: Alice sees the White pawn remaining on e2 — 16
    checks:
    - Alice sees the White pawn remaining on e2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:125 — Cancelling without a held piece preserves the position
    exampleRow: []
  Confirmation preserves the offered move without offering it twice:
    description: Confirmation preserves the offered move without offering it twice
    startingConditions:
    - Alice has a chessboard after offering White's move from e2 to e4
    events:
    - Alice's activity confirms the offered position
    endsIn: Alice sees a White pawn on e4 — 17
    checks:
    - Alice sees a White pawn on e4
    - Alice sees e2 and e4 marked as the last move
    - Alice hears no chessboard sounds
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-authority.feature:133 — Confirmation preserves the offered move without offering it
      twice
    exampleRow: []
  Refusal restores the earlier position without sound:
    description: Refusal restores the earlier position without sound
    startingConditions:
    - Alice has a chessboard after offering White's move from e2 to e4
    events:
