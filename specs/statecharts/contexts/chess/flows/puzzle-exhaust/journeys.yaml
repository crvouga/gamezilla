journeys:
  No puzzle is served twice while unplayed ones remain:
    description: No puzzle is served twice while unplayed ones remain
    startingConditions:
    - the puzzle pool holds just three puzzles
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has solved 2 puzzles in a row
    - Alice has moved on to the next puzzle
    events:
    - Alice solves the puzzle
    endsIn: Alice's stats show 3 played, 3 solved, and 100% accuracy — 1
    checks:
    - Alice's stats show 3 played, 3 solved, and 100% accuracy
    gherkin:
    - specs/chess/puzzle-exhaust.feature:14 — No puzzle is served twice while unplayed ones remain
    exampleRow: []
  Once every puzzle is played, the feed comes round to the oldest one, unrated:
    description: Once every puzzle is played, the feed comes round to the oldest one, unrated
    startingConditions:
    - the puzzle pool holds just three puzzles
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has solved 3 puzzles in a row
    events:
    - Alice moves on to the next puzzle
    endsIn: Alice's feed comes round to the first puzzle they played within 15 seconds — 2
    checks:
    - Alice's feed comes round to the first puzzle they played within 15 seconds
    - Alice is told the attempt is unrated
    gherkin:
    - specs/chess/puzzle-exhaust.feature:20 — Once every puzzle is played, the feed comes round to the oldest one,
      unrated
    exampleRow: []
  A theme filter no puzzle fits empties the feed:
    description: A theme filter no puzzle fits empties the feed
    startingConditions:
    - the puzzle pool holds just three puzzles
    - Alice is signed in
    - Alice is playing puzzles in their space
    events:
    - Alice limits the feed to the 'zugzwang' theme
    endsIn: Alice is told the feed is empty within 15 seconds — 3
    checks:
    - Alice is told the feed is empty within 15 seconds
    - Alice has no puzzle on the board
    gherkin:
    - specs/chess/puzzle-exhaust.feature:28 — A theme filter no puzzle fits empties the feed
    exampleRow: []
  Including played puzzles recovers from an empty feed:
    description: Including played puzzles recovers from an empty feed
    startingConditions:
    - the puzzle pool holds just three puzzles
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has already played the pool's one "zugzwang" puzzle
    - Alice has limited the feed to the "zugzwang" theme and it is empty
    events:
    - Alice includes puzzles they have already played
    endsIn: Alice's feed history shows "Any" — 4
    checks:
    - Alice's feed history shows "Any"
    - Alice has a puzzle on the board
    gherkin:
    - specs/chess/puzzle-exhaust.feature:33 — Including played puzzles recovers from an empty feed
    exampleRow: []
