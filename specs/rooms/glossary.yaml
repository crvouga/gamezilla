# The ubiquitous language of Rooms: one room keeping the live state several
# people share. Rooms stands alone (docs/CONTEXT_MAP.md): it borrows nothing
# from another context. A few words here ("move", "opponent", "match",
# "refused", "accept", "end the match") are also another context's terms;
# in a room they mean what is defined below.
context: Rooms
purpose: >-
  One room keeps the live state several people share, such as a shared
  counter or a match clock, so everyone comes to agree on it however their
  connections, their apps or the room itself fail.

terms:
  # --- Rooms ------------------------------------------------------------------

  - term: room
    definition: >-
      A shared place several people's devices are in, where one authority,
      the room itself, keeps the live state everyone sees and decides every
      change to it. A room can crash and restart.
    avoid: [server, channel, session]

  - term: room is down
    definition: >-
      A room that has crashed is down: nothing reaches it until it restarts.
      Once it restarts it is up again, with everything it had.
    forms: [room is up]

  - term: crash
    definition: >-
      An app or a room stops without warning. A crashed app shows nothing
      until it restarts, but keeps the changes still waiting on it; a crashed
      room is down until it restarts.
    forms: [crashes, crashed, crashing]
    model: [Crashed, appCrashes]

  - term: restart
    definition: >-
      A crashed app or room starts again. A restarted app sends the changes
      that waited on it; a restarted room comes back with what it had, and
      anyone who was offline reconnects as it does.
    forms: [restarts, restarted, restarting]
    model: [appRestarts, roomRestarts]

  - term: present
    definition: >-
      In a room right now, as the room shows it: everyone whose device is in
      the room.

  - term: device state
    definition: >-
      Where a person's device stands with the room: online, offline, on a
      stalled network, or with its app crashed.
    model: [DeviceState, deviceState]

  - term: connection
    from: kernel
    model: [Online, Offline, goOffline]

  - term: reconnects
    definition: >-
      A person whose device was offline is back online and in the room again.
      What waited on their device reaches the room, and they see what the
      room has now.
    model: [reconnect]

  - term: stalled network
    definition: >-
      A person's network stops carrying anything in either direction while
      they are still in the room; it recovers later. Unlike being offline,
      the person's device does not know it is cut off, so it sees nothing
      new until the network recovers.
    forms:
      - stalled networks
      - network stalls
      - network has stalled
      - network recovers
      - network has recovered
    model: [Stalled, networkStalls, networkRecovers]

  - term: newer arrival
    definition: >-
      A person comes into the room again while their earlier arrival is still
      there, as when their app starts afresh. The newer arrival takes over
      from the earlier one, and nothing changes for anyone.
    model: [takeOver]

  # --- Changes ------------------------------------------------------------------

  - term: accepted change
    definition: >-
      A change the room has taken, which counts for everyone. A change the
      room does not accept is a refused change.
    forms: [room has accepted]

  - term: refused change
    definition: >-
      A change the room will not accept, reported to the person who made it.
      It is refused as invalid when the room does not understand it, and as
      not allowed when the room turns its sender away. A refused change
      alters nothing for anyone.

  - term: invalid change
    definition: >-
      A change the room does not understand. It is refused as invalid and
      never waits to be sent.
    forms: [refused as invalid]
    model: [makeInvalidChange]

  - term: refused as not allowed
    definition: >-
      How the room refuses any change from a person it turns away.

  - term: garbled change
    definition: >-
      Something a device sends the room that is not a change at all. The
      room ignores it, and nothing changes.
    forms: [garbled]
    model: [sendGarbledChange]

  - term: waiting change
    definition: >-
      A change a person made that has not reached the room yet, because their
      device is offline, their network has stalled, or their app crashed. It
      already shows on their own device and reaches the room once they are
      back.
    forms: [changes waiting, change waiting]
    model: [waitingChanges]

  - term: resend
    definition: >-
      A device sending the room a change again, not knowing whether it
      arrived. The room counts each change once, however many times it
      arrives.
    forms: [resends, resent, resending]
    model: [resend]

  # --- The shared counter -------------------------------------------------------

  - term: shared counter
    definition: >-
      A room holding one count that anyone in it can increment or decrement.
      No increment or decrement is ever lost or counted twice.
    forms: [shared counters]

  - term: room's count
    definition: >-
      The one true count a shared counter's room keeps.
    model: [roomCount]

  - term: shown count
    definition: >-
      The count a person's device shows: the room's count while it is
      online; while it is offline or its network has stalled, the count it
      last showed plus its waiting changes; nothing while its app is crashed.
    forms: [shows a count]
    model: [shownCount]

  - term: everyone agrees
    definition: >-
      "Everyone agrees on a count of 3": the room's count and the count
      every device in the room shows are all 3.

  - term: increment
    definition: >-
      Raise the count by one.
    forms: [increments, incremented, incrementing]
    model: [increment]

  - term: decrement
    definition: >-
      Lower the count by one.
    forms: [decrements, decremented, decrementing]
    model: [decrement]

  # --- The ownership room -------------------------------------------------------

  - term: ownership room
    definition: >-
      A room anyone may claim while nobody has, becoming its owner; after
      that only the owner's changes count. It can be set to turn a named
      person away.
    forms: [ownership rooms]

  - term: claim
    definition: >-
      Ask the room to settle something in one's favour: claiming an unclaimed
      ownership room makes the claimer its owner; claiming a flag has fallen
      asks the room to end the match. The room decides, and a claim it does
      not uphold changes nothing.
    forms: [claims, claiming, has claimed, unclaimed]

  - term: turn away
    definition: >-
      An ownership room set to turn a person away refuses every change they
      make as not allowed, even a claim, while everyone else's changes still
      count.
    forms: [turns away, turned away]

  # --- The match clock ----------------------------------------------------------

  - term: timed match
    definition: >-
      A timed match between White and Black that a room keeps. It is idle
      until someone starts it, playing while the match clock runs, and over
      once a flag falls; nothing changes it after that. White's and Black's
      devices both show the match as the room has it.
    forms: [the match, a match]
    model: [matchStatus, matchShown]

  - term: White and Black
    definition: >-
      The two sides of a match, each with a bank. White moves first.
    model: [Side]

  - term: start a match
    definition: >-
      Either White or Black starts an idle match, giving each side a bank;
      a match under way cannot be started again.
    forms: [starts a match, started a match, starting a match]
    model: [startMatch]

  - term: end the match
    definition: >-
      A match ends only when a flag falls. Nobody can end it any other way,
      least of all by claiming a flag that has not fallen.
    forms: [ends the match, ended the match, ending the match]

  - term: match clock
    definition: >-
      The room's own clock in a match. It runs down only the bank of the side
      to move, whatever anyone's device shows or claims.
    forms: [clock]
    model: [clockRuns, thinkingTime]

  - term: bank
    definition: >-
      The time a side has for the whole match, in ms. The match clock runs it
      down only while that side is to move.
    forms: [banks]
    model: [bank, whiteBank, blackBank]

  - term: time left
    definition: >-
      What is left of a side's bank, such as "White has 70 ms left". A move
      keeps it for the mover.
    forms: [ms left]

  - term: side to move
    definition: >-
      The side whose bank the match clock is running down. Only they can
      move; White is the side to move when a match starts.
    forms: [to move]
    model: [sideToMove]

  - term: move
    definition: >-
      The side to move moves: they keep their time left, and their opponent
      becomes the side to move. A move out of turn, or after a flag has
      fallen, does not count.
    forms: [moved, mover]
    model: [move]

  - term: opponent
    definition: >-
      The other side of the match: Black to White, White to Black.
    forms: [opponent's]
    model: [opponent]

  - term: flag
    definition: >-
      A side's flag falls the moment their bank runs out while they are to
      move; the room then flags them and ends the match, and their opponent
      wins on time. Claiming a flag that has not fallen changes nothing.
    forms: [flags, flagged, flag falls, flag fell, flag has fallen]
    model: [claimFlag]

  - term: win on time
    definition: >-
      The result when the opponent's flag falls: the match is over and both
      White and Black see who won.
    forms: [wins on time, won on time]
    model: [winner]
