# Connected people see the agreed Custom Game choices promptly.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: custom-game-choice-arrival
  displayName: Time for a Custom Game choice to reach another person
spec:
  description: >-
    Seconds from a connected creator's accepted choice until another
    connected person in the same space sees that choice.
  thresholdMetric:
    metricSource:
      type: product
      spec:
        measures: >-
          The seconds between an accepted Custom Game choice and that
          choice showing to another connected person in the space.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: custom-game-choices-arrive-promptly
  displayName: Custom Game choices arrive promptly
spec:
  description: >-
    At least 99 in every 100 accepted choices reach other connected
    people in the same space within five seconds over the last four weeks.
  service: chess
  indicatorRef: custom-game-choice-arrival
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: Almost every choice arrives within five seconds
      op: lte
      value: 5
      target: 0.99
