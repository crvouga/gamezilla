# The ubiquitous language of the Chess context: chess puzzles played in a
# space, and Custom Games. Chess rules are cited from the FIDE Laws of Chess, not redefined.
# Terms other contexts own are borrowed (from: <domain>) with the spelling the
# context map publishes.
context: Chess
purpose: >-
  Custom Games with configurable White and Black, and an endless feed of chess puzzles a person solves in their space, with
  friends watching, that keeps an honest puzzle rating and a game log of every
  puzzle played, online or offline.

terms:
  - term: pair people up
    from: matchmaking
  - term: matchmaking match
    from: matchmaking
    model: [matchFormed, MatchmakingMatch, matchedPeople, fromMatch]
  - term: person
    from: kernel
    model: [PlayPerson, currentPlay]
  - term: device
    from: kernel
    model: [PlayDevice]
  - term: connection
    from: kernel
    model: [online, loseConnection, comeBackOnline, connectionReturns]
  - term: environment
    from: kernel
  - term: block someone
    from: friends
  - term: account deletion
    from: profile
    model: [deletePlayAccount]
  - term: recently proven account
    from: profile
  # --- Borrowed -------------------------------------------------------------

  - term: guest
    from: profile
  - term: account
    from: profile
  - term: sign out
    from: profile
  - term: username
    from: profile
  - term: rename themselves
    from: profile
  - term: friends list
    from: friends
  - term: leave
    from: spaces
    model: [leaveSpace]
  - term: end a space
    from: spaces
  - term: sign in
    from: profile
  - term: paid access
    from: billing
  - term: control
    from: runtime
  - term: Plus
    from: billing
  - term: Plus member
    from: billing
  - term: free account
    from: billing
  - term: space
    from: spaces
    model: [Space, space]
  - term: host
    from: spaces
    model: [spaceHost]
  - term: join
    from: spaces
    model: [joinSpace]
  - term: space link
    from: spaces
  - term: lobby
    from: spaces
  - term: return to a space
    from: spaces
  - term: friend
    from: friends
  - term: Google
    from: profile
  - term: sounds
    from: runtime
    forms: [sound, silence, silent, turned sounds off, turned sounds on, turns sounds off, turns sounds on]
    model: [configurePuzzleSounds]

  # The shared kernel's "the app", named in this context's model.
  - term: the app
    from: kernel
    model: [reopenApp, closeApp]

  # --- Where a person is in a space ------------------------------------------

  - term: game
    definition: >-
      Something a space plays together, chosen by its host; everyone in the
      space is taken to it without doing anything. Chess is one.
    published: true

  - term: chess
    definition: >-
      The game whose puzzles this context is about. In a space, chess offers
      its chess choices; playing puzzles is one of them.
    published: true

  - term: space view
    definition: >-
      What a person in a space is looking at: the space's game choice, the
      chess choices, or the board. What a space plays belongs to the space,
      so everyone in it has the host's view.
    avoid: [screen, menu, page]
    model: [View, view]

  - term: game choice
    definition: >-
      Where a space's host picks the game the space plays, and where everyone
      in the space starts.
    model: [GameChoice, backToGameChoice]

  - term: chess choices
    definition: >-
      Chess's own starting point in a space, between the game choice and the
      board; a solver steps back here from the board and goes back to the
      puzzles from here.
    model: [ChessChoices]

  - term: board
    definition: >-
      The chessboard a puzzle is played on, as each person in the space sees
      it. It faces the solver's side, shows the last move, and shows the
      puzzle's state; a watcher's board agrees with the host's.
    model: [Board, playShown]
    published: true

  - term: play puzzles
    definition: >-
      Solve puzzles from the puzzle feed on the board in a space. A person
      opens puzzles from the game choice, and goes back to the puzzles from
      the chess choices, finding any unfinished puzzle as they left it.
    forms:
      - plays puzzles
      - playing puzzles
      - open puzzles
      - opens puzzles
      - opened puzzles
      - go back to the puzzles
      - goes back to the puzzles
    model: [openPuzzles, goBackToPuzzles]

  - term: leave the puzzle
    definition: >-
      Step back from the board to the chess choices. An unfinished puzzle
      waits, as it was, for the solver to go back to the puzzles; a finished
      one does not, and going back starts the next puzzle.
    forms: [leaves the puzzle, left the puzzle, leaving the puzzle]
    model: [leavePuzzle]

  # --- Puzzles and the feed --------------------------------------------------

  - term: puzzle
    definition: >-
      A chess position whose objective is to find the solution or deliver
      checkmate, played on the board. Each
      puzzle has a rating of its own, which is how hard it is.
    avoid: [problem, exercise]
    model: [puzzle, Puzzle, PuzzleSound, puzzleSound]
    published: true

  - term: puzzle's own rating
    definition: >-
      How hard a puzzle is, as a rating on the same scale as the puzzle
      rating. It is hidden while the puzzle is being solved, shows once the
      puzzle is over, and shows beside the puzzle in the game log.
    forms: [own rating]

  - term: puzzle pool
    definition: >-
      Every puzzle that can be served. The puzzle feed chooses from it.
    forms: [pool]

  - term: add puzzles
    definition: >-
      The team putting new puzzles into the puzzle pool. Only good puzzles
      get in; broken ones are turned away.
    forms:
      - adds puzzles
      - added puzzles
      - adding puzzles
      - started adding puzzles
      - finishes adding puzzles
      - finished adding puzzles
      - fails to add puzzles
      - failed to add puzzles
      - tries to add puzzles
      - offered to add puzzles
      - can add puzzles
      - allowed to add puzzles
      - puzzles were added
    avoid: [import, ingest, puzzle file]
    model:
      - PuzzleLoading
      - puzzleLoading
      - addPuzzles
      - finishAddingPuzzles
      - failAddingPuzzles

  - term: broken puzzle
    definition: >-
      A puzzle the team adds that cannot go in the pool: its line holds an
      illegal move, castles without the right to, or ends on the opponent's
      move; it starts from a position that could never happen in chess; or it
      copies a puzzle already in the pool. It never reaches anyone.
    forms: [broken puzzles, broken]
    avoid: [rejected puzzle, invalid puzzle, malformed]

  - term: low-quality puzzle
    definition: >-
      A puzzle below the quality bar: a popularity below 50, or played fewer
      than 5 times. The puzzle feed never serves one; a puzzle with a
      popularity of exactly 50 that was played exactly 5 times is served.
    forms: [quality bar, low-quality]

  - term: popularity
    definition: >-
      How much the people who played a puzzle liked it. A puzzle needs a
      popularity of at least 50 to be served.

  - term: retired puzzle
    definition: >-
      A puzzle taken out of the puzzle feed. It is never served again and its
      puzzle link no longer opens it, but it stays in the game log and still
      opens in review.
    forms: [retired]
    model: [retirePuzzle]

  - term: puzzle link
    definition: >-
      A link to one puzzle that a solver can share from the puzzle on their
      board, finished or not. Opening it puts that exact puzzle on the
      person's board: rated if they have never played it, unrated if they
      have. For a guest a rated one uses a puzzle start. A retired puzzle's
      link no longer opens it, and the person is told the puzzle is no longer
      available.
    forms:
      - puzzle links
      - puzzle link's
      - shares a puzzle link
      - shared a puzzle link
      - opens a puzzle link
    avoid: [puzzle address, permalink, deep link, puzzle URL]
    model: [sharePuzzleLink, openPuzzleLink, linkShared, linkRefusal]

  - term: puzzle feed
    definition: >-
      The endless run of puzzles a solver plays in their space: finish one and
      the next is ready at once, never the one just played. It serves unplayed
      puzzles in the rating window first, then the unplayed puzzle nearest
      the feed target; a puzzle played on one of the solver's devices is not
      served on another. Once every puzzle is played it comes round to the one
      attempted longest ago, unrated.
    forms: [feed, feed's]
    avoid: [queue, playlist]
    model: [feedChoice]

  - term: feed settings
    definition: >-
      A solver's choices for their puzzle feed: the history filter, a puzzle
      theme, and the feed target. Only a person with an account can change
      them; saved choices stick after the app closes and follow the person to
      their other devices. Editing previews choices; saving applies them.
      Closing without saving keeps the saved choices.
    forms: [feed choices, unsaved feed settings]
    model: [feedChoice, editing, startEditingFeed, previewFeedChoice, saveFeedChoices, discardFeedChoices]

  - term: history filter
    definition: >-
      Which puzzles the feed may serve by whether the solver has played them:
      "Unseen" (the default), "Any", "Seen" for played puzzles, or "Failed"
      for puzzles whose first attempt failed. "Failed" puzzles come back
      unrated; with no failed attempt the feed is empty and the solver is told
      why.
    forms: [feed history]

  - term: puzzle theme
    definition: >-
      A kind of puzzle, such as "zugzwang" or "fork". A puzzle has one or more
      themes; they are hidden while it is being solved and show once it is
      over. Limiting the feed to a theme serves only puzzles with it, sticks
      like other feed choices, and empties the feed when no puzzle fits.
    forms: [theme, theme filter, puzzle's themes]

  - term: feed target
    definition: >-
      The rating the puzzle feed serves puzzles near. It is automatic (the
      puzzle rating after the last result, plus the rating offset) or custom
      (a fixed rating from 400 to 3000).
    forms:
      - target
      - feed targets
      - automatic target
      - custom target
      - custom feed target
    avoid: [difficulty]

  - term: rating offset
    definition: >-
      How far above or below the puzzle rating an automatic feed target sits,
      in steps of 50, from −400 to +400.
    forms: [feed rating offset]

  - term: rating window
    definition: >-
      The ratings around the feed target the feed serves unplayed puzzles
      from: within 100 of the feed target once the puzzle rating has settled,
      within 200 while it is provisional. With no unplayed puzzle in it, the
      unplayed puzzle nearest the feed target comes next.
    avoid: [band]

  # --- Solving ---------------------------------------------------------------

  - term: solver
    definition: >-
      The person solving the puzzle on the board: the host, when a space has
      watchers. The board faces the solver's side.
    avoid: [puzzler]
    model: [Solver, solver]

  - term: attempt
    definition: >-
      One play of one puzzle, from its start until it is solved, failed or
      abandoned. The first wrong move is the attempt's outcome, and a retry
      continues the same attempt. Leaving the puzzle or closing the app does
      not end it.
    avoid: [session]
    model: [finish, finishAsAppCloses, finishAlongsideOtherDevice, Unfinished]

  - term: puzzle state
    definition: >-
      Where the puzzle on a board stands, as the board tells it: being solved
      (the solver is asked to find the next move), a wrong move played,
      solved, skipped, or its solution shown.
    model: [puzzleState]

  - term: line
    definition: >-
      A puzzle's whole sequence of moves, from the opponent's setup move to
      its end. "Move N of the line" is the position after its Nth move.

  - term: setup move
    definition: >-
      The opponent's first move of the line, already played when the puzzle
      opens.

  - term: opponent
    definition: >-
      The side the solver plays against. Its setup move and its replies play
      by themselves.

  - term: prompt
    definition: >-
      What the board asks the solver, such as "Your turn — find the best move
      for White". While the puzzle is being solved, the solver is asked to
      find the next move.
    forms: [prompted, asked to find the next move]

  - term: solution
    definition: >-
      The solver's moves in the line. Every correct way to finish counts:
      another mate on the final move, a faster mate, or the same moves in
      another order.

  - term: solution move
    definition: The next move of the solution, from where the board stands.
    forms: [asks to see the solution move, asked to see the solution move, correct move]
    model: [revealSolutionMove, trySolutionBeforeHint]

  - term: solve
    definition: >-
      Finish a puzzle with the solution or any legal checkmate. A solved puzzle is over, and
      its pieces can no longer be moved.
    forms: [solves, solved, solving]
    model: [solve, CleanSolve]
    published: true

  - term: wrong move
    definition: >-
      A legal move that is not the solution. The solver is told at once, the
      attempt is failed from then on, and pieces cannot be moved until a
      retry. It earns half credit, like a hint.
    forms: [wrong]
    avoid: [mistake, blunder]
    model: [playWrongMove, WrongMove]

  - term: hint
    definition: >-
      Help while solving: the first highlights the piece to move, the second
      shows the solution move. A puzzle solved after a hint earns half credit.
    forms: [asks for a hint, asks for another hint, asked for a hint]
    model: [HintedSolve, requestHint, help, tryHintAfterFinish, tryHintFromReview, tryHintBeforeRetry, tryEarlierHint]

  - term: half credit
    definition: >-
      What a solve after a hint earns toward the puzzle rating: the same
      rating change as a wrong move, and less than a clean solve.

  - term: retry the puzzle
    definition: >-
      After a wrong move, continue at the position already reached. After a
      solve, a shown solution or a skip, play the same puzzle from its start.
      It continues the same attempt, so its first outcome does not change.
    forms: [retries the puzzle, retried the puzzle, retrying the puzzle]
    model: [retry, retryAndSolve, tryRetryWhileSolving]

  - term: show the solution
    definition: >-
      Have the rest of the line play out on the board (the revealed
      solution). The puzzle is over and the attempt is failed.
    forms:
      - shows the solution
      - shown the solution
      - showing the solution
      - shown solution
      - revealed
      - revealed solution
      - revealed line
    model: [showSolution, ShownSolution, tryShowSolutionAfterFinish, tryShowSolutionFromReview]

  - term: skip
    definition: >-
      Give up on a puzzle being solved. It is over, and the attempt is
      abandoned.
    forms: [skips, skipped, skipping]
    model: [skip, Skipped, trySkipAfterFinish]

  - term: failed attempt
    definition: >-
      An attempt's outcome once a wrong move was played or the solution was
      shown, however the puzzle ends afterwards.
    avoid: [loss]

  - term: puzzle is over
    definition: >-
      A puzzle is over once it is solved, skipped or its solution shown. Its
      pieces can no longer be moved, and the host may move on.
    model: [isOver]

  - term: abandoned attempt
    definition: An attempt's outcome when the puzzle was skipped.

  - term: move on
    definition: >-
      Go from a puzzle that is over to the next puzzle in the feed, never the
      one just played. Only the host is offered it; asking twice at once
      still moves on one puzzle, and it works offline.
    forms:
      - moves on
      - moved on
      - moving on
      - asks for another puzzle
      - asks for the next puzzle
      - asking for the next puzzle
    model: [moveOn, moveOnTwiceAtOnce, moveOnOffered]

  - term: auto-advance
    definition: >-
      A solver's setting to move on by itself a set time after a solve.
    forms: [advance]

  - term: puzzle clock
    definition: >-
      How long the current attempt has run. It runs while the puzzle is being
      solved and stops when the puzzle is over.
    forms: [clock, seconds pass]
    model: [timePasses]

  - term: haptic
    definition: >-
      A buzz the solver feels from their device: the success haptic on a
      solve, the error haptic on a wrong move.

  # --- Watching --------------------------------------------------------------

  - term: watcher
    definition: >-
      Someone in a space watching its Custom Game, multiplayer game or the host's puzzle.
      In a Custom Game they have no accepted side and cannot move pieces. Their board agrees with
      the host's, even after arriving mid-puzzle or losing the connection. A
      watcher may make a suggestion but never drives the puzzle and is never
      rated for it.
    forms: [watch, watches, watched, watching]
    model: [shownMoves, shownWinner, canMove]
    avoid: [spectator, viewer, observer]

  - term: suggestion
    definition: >-
      A move a watcher proposes. The host and every watcher see it; it does
      not move the puzzle, and the host's next move clears it.
    forms: [suggest, suggests, suggested]
    model: [suggestMove]

  # --- Rating, stats and the game log ------------------------------------------

  - term: puzzle rating
    definition: >-
      A solver's running rating, moved by every rated attempt, online or
      offline. Every device shows the same one. A new solver starts at the
      seed rating, provisional. Solving a puzzle whose own rating is above
      the solver's gains more than solving an easier one; failing an easier
      puzzle costs more than failing a harder one. Time taken never changes
      it.
    forms: [rating, rating gain, puzzle ratings]
    avoid: [score, elo]
    model: [ratedResult]

  - term: seed rating
    definition: The puzzle rating every solver starts at, 1500.

  - term: rating change
    definition: >-
      How much one rated attempt moved the solver's puzzle rating. It shows as
      soon as the attempt's outcome is decided: "+N" after a solve, "−N"
      after a wrong move, a skip or a shown solution. An unrated attempt shows
      that it is unrated instead, and a watcher sees none.
    forms: [rating changes]
    avoid: [delta, rating diff, rating difference]

  - term: rating floor
    definition: >-
      400, the lowest a puzzle rating goes. Failing at the rating floor leaves
      the rating at 400.

  - term: rating ceiling
    definition: >-
      3000, the highest a puzzle rating goes. Solving at the rating ceiling
      leaves the rating at 3000.

  - term: provisional
    definition: >-
      A puzzle rating that has not yet settled, shown with a trailing "?"
      (for example "1500?"). It moves further for each puzzle than a settled
      rating does.

  - term: settle
    definition: >-
      A puzzle rating settles once enough rated attempts have been played; it
      then loses its "?".
    forms: [settles, settled, settling]

  - term: rated attempt
    definition: >-
      An attempt that moves the puzzle rating: a solver's first attempt at a
      puzzle, ever. A repeat of an already-played puzzle is unrated, and a
      watcher is never rated.
    forms: [rated, unrated, rated puzzle]
    model: [RatedPuzzle, rated]

  - term: stats
    definition: >-
      A solver's puzzle rating, puzzles played and solved, accuracy, and how
      the rating moved over time. They count each puzzle's rated attempt
      only.
    avoid: [statistics, scoreboard]
    model: [readStats, readStatsOnOtherDevice]

  - term: accuracy
    definition: The share of rated attempts solved, as a whole percentage.

  - term: game log
    definition: >-
      A solver's list of every puzzle they played, each recorded as solved,
      failed or abandoned with the puzzle's own rating and its rating change
      (or that it was unrated), and each opening in review.
    avoid: [puzzle history]
    model: [gameLog, PlayedPuzzle]

  - term: review
    definition: >-
      Stepping through a played puzzle's whole line from the game log. It
      opens on the final position; stepping one move animates and jumping
      snaps straight to a position. The current move is highlighted in the
      review's move list, in algebraic notation.
    forms: [reviews, reviewing, reviewed]
    avoid: [replay, analysis]
    model: [stepBackPosition, stepForwardPosition, position, chooseReviewPosition, tryReviewBeforeRetry, stepPuzzleSoundReview]

  # --- The daily puzzle limit --------------------------------------------------

  - term: daily puzzle limit
    definition: >-
      The 20 rated puzzles a guest may start in a day; free accounts and Plus
      members have none. A puzzle under way when it is reached can still be
      finished; the next does not start, and the guest is invited to sign in.
      It holds the same offline, and a new day brings a fresh allowance.
    forms: [puzzle limit, daily limit, limit, allowance, daily allowance]
    avoid: [quota, cap]

  - term: puzzle start
    definition: >-
      One use of a guest's daily puzzle limit, spent when a rated puzzle first
      starts. Going back to a puzzle already started spends none.
    model: [puzzleStarts]

  # --- Chess rules (FIDE) ------------------------------------------------------

  - term: move
    source: FIDE Laws of Chess, Article 3 (the moves of the pieces)
    forms: [moves, moved, moving, plays]
    model: [playCustomMove, ply, sideToMove, playCorrectContinuation, tryMoveAfterFinish, tryMoveFromReview, tryMoveBeforeRetry, playQuietPuzzleMove, playCapturePuzzleMove]
  - term: capture
    source: FIDE Laws of Chess, Article 3.1.1 (removing an opposing piece as part of a move)
    forms: [captures, captured]
  - term: piece
    source: FIDE Laws of Chess, Article 2.2
    forms: [rook, knight, bishop, queen, pawn, king]
    model: [choosePiece]
  - term: to move
    source: FIDE Laws of Chess, Article 1.1 (having the move)
  - term: illegal move
    model: [tryIllegalMove]
    source: FIDE Laws of Chess, Article 3.10
  - term: check
    source: FIDE Laws of Chess, Article 3.9
  - term: checkmate
    source: FIDE Laws of Chess, Article 5.1.1
    forms: [mate]
  - term: mate in two
    definition: >-
      A puzzle whose solver checkmates on their second move.
  - term: castling
    source: FIDE Laws of Chess, Article 3.8.2
    forms: [castle, castles]
  - term: en passant
    source: FIDE Laws of Chess, Article 3.7.3.1
  - term: promotion
    source: FIDE Laws of Chess, Article 3.7.5.1
    forms: [promote, promotes, promoting, asks which piece, asked which piece]
  - term: underpromotion
    source: FIDE Laws of Chess, Article 3.7.5.1 (promotion to a piece other than a queen)
  - term: capture-promotion
    source: FIDE Laws of Chess, Articles 3.7.5.1 and 3.1 (a promotion that captures)
  - term: algebraic notation
    source: FIDE Laws of Chess, Appendix C

  - term: keyboard
    from: runtime

  - term: multiplayer chess
    definition: >-
      An untimed game of ordinary chess between two people with
      accounts, played exclusively within spaces. People in either space
      may watch the same game, including guests, but only its matched people
      may move or resign. Each
      person can have one unfinished multiplayer game, across all devices.
      White starts; the people see their side, opponent and the same board.
      Either assignment of White and Black is allowed and remains fixed.
    forms: [multiplayer game, multiplayer games, multiplayer board]
    model: [PlayGame, playNumber, whiteSide, blackSide, playBoard, PlayBoard]
    published: true

  - term: find a chess opponent
    definition: >-
      From a space, ask matchmaking for another person available for an untimed multiplayer
      game. Everyone starts with a multiplayer rating of 1500, separate from
      puzzle ratings. This game is unrated: its result never changes either
      rating. The rating range grows as matchmaking defines it. Blocking in
      either direction prevents a new pairing. Signing out on one device
      leaves an accepted wait available on the person's other devices.
    forms: [finds a chess opponent, finding a chess opponent, chess opponent search, opponent search, search]
    model: [findOpponent, lookingForOpponent]

  - term: stop finding a chess opponent
    definition: >-
      Stop the person's current matchmaking wait, keeping any multiplayer
      game already formed. A person without a wait has nothing to stop.
    forms: [stops finding a chess opponent, stopped finding a chess opponent]
    model: [stopFindingOpponent]

  - term: open multiplayer chess
    definition: >-
      Within a space, see the person's current opponent search or most recent multiplayer
      game. A space can watch its host's multiplayer game, including a game
      against someone in another space. Coming back or opening it on another device never starts a
      second game. After a result, the person may ask for a new opponent.
    forms: [opens multiplayer chess, returns to multiplayer chess]
    model: [openMultiplayer]

  - term: multiplayer turn
    definition: >-
      The person whose side may move next. A legal move changes the board
      and passes the turn exactly once. A move attempted for a different
      board position, from another device or after the game is over never
      moves a piece. An offline person sees the last accepted board and
      cannot send a move or resignation for later.
    forms: [turn, turns, plays a multiplayer move, repeats a multiplayer move, plays, repeats that multiplayer move]
    model: [playMove, moveCount, turn]

  - term: multiplayer result
    definition: >-
      The permanent win or draw both people see when the multiplayer game
      is over. Checkmate wins for the mating side; resignation wins for the
      other side. Stalemate, insufficient mating material, the same position
      for the third time, or fifty moves by each side without a pawn move
      or capture automatically draw this casual game. Once over, the board
      cannot move. Disconnection alone never ends an untimed game.
    forms: [multiplayer game is over, multiplayer draw, multiplayer win]
    model: [PlayOutcome, NoPlay, OngoingPlay, WonPlay, DrawnPlay, playOutcome, PlayState, UnfinishedPlay, WonGame, DrawnGame, playState, winner]
    published: true

  - term: resign multiplayer chess
    definition: >-
      Give up the unfinished multiplayer game. Either person may resign
      regardless of turn; repeating the same resignation keeps its result.
      Confirming account deletion gives up that person's unfinished game
      and stops their opponent search before their account disappears.
    forms: [resigns multiplayer chess, resigned multiplayer chess]
    model: [resignPlay]

  - term: multiplayer rating
    definition: >-
      The strength used to seek an ordinary chess opponent, 1500 for everyone
      while multiplayer games are unrated. Puzzle ratings never supply it.

  - term: last known multiplayer board
    definition: >-
      The accepted board and result shown before a device went offline.
      They stay visible until a connection brings the accepted outcome back.

  - term: unfinished multiplayer game limit
    definition: >-
      Every account has at most one unfinished multiplayer game. Before
      seeking a new opponent, the person finishes that game. Free accounts
      and Plus members have the same allowance.

  # --- Custom Games --------------------------------------------------------

  - term: Custom Game
    definition: One unrated standard game of chess in a space, with White and Black each
      chosen as a person, a bot, an invitation, an open place or a closed side before start.
      The host is its creator and need not participate. The usual starting position is used;
      other variants and starting positions are not offered. The game may be timed or untimed.
      Every change needs a connection; agreed choices and moves remain available on return.
    forms:
    - Custom Games
    - Custom Game's
    model:
    - CustomGame
    - black
    - blackShown
    - createGame
    - creator
    - creatorShown
    - customGame
    - drawOfferedByShown
    - gameShown
    - incrementShown
    - minutesShown
    - outcomeShown
    - ready
    - readyShown
    - startsShown
    - status
    - statusShown
    - white
    - whiteShown
    - controllers
    - controlledStatus
    - controlledPly
    - controlledTurn
    - controlledOutcome
    - controlledShown
    - playControlledMove
    - resignControlledGame
    - cancelControlledGame
    - current
    published: true
  - term: creator
    definition: The host whose Custom Game it is. Only the creator creates, configures, starts,
      cancels or makes a rematch, including when watching two other participants. Leaving
      the space ends it and cancels unfinished games.
    model:
    - creator
  - term: side
    definition: White or Black in a Custom Game. Each has one choice of participant. One
      person cannot be accepted or invited on both sides.
    forms:
    - sides
    - White
    - Black
    model:
    - Side
    - Color
    - color
    - White
    - Black
    - white
    - black
  - term: participant
    definition: A person who accepted one side, or a bot chosen for one side. The creator
      is a participant only when accepted on a side. Watching never gives control of a participant.
    forms:
    - participants
    model:
    - Participant
    - ParticipantKind
    - PersonSide
    - BotSide
    - kind
    - person
  - term: bot
    definition: A chess opponent that plays legal moves by itself for its own side. Either
      or both sides may be bots, including identical bots. There are no strength or personality
      choices. A bot stops when the game ends.
    forms:
    - bots
    model:
    - botPlays
  - term: open place
    definition: An unoccupied side anybody already in the space may claim before start. Competing
      claims leave exactly one accepted person; either may win. A person must confirm readiness
      after claiming.
    forms:
    - open places
    model:
    - OpenPlace
    - openSide
    - claimSide
  - term: closed side
    definition: An unoccupied side nobody may claim until the creator opens it or chooses
      a participant. A closed side prevents starting.
    forms:
    - closed sides
    - closed
    - closes
    model:
    - ClosedSide
    - closeSide
  - term: invitation
    definition: A side reserved by the creator for a person already in the space, who alone
      may accept or decline it before start. It is not a participant until accepted. Declining
      or revoking makes the side open; replacement removes the offer. An earlier offer cannot
      survive new choices.
    forms:
    - invitations
    - invited
    - invites
    - reserved
    - revoked
    - revokes
    model:
    - InvitedSide
    - invite
    - acceptSide
    - declineSide
    - revokeSide
  - term: take a side
    definition: The creator choosing themselves for one side before start. Replacing a choice
      clears readiness; taking the same accepted side again changes nothing.
    forms:
    - takes
    - take
    model:
    - takeSide
  - term: assign a bot
    definition: The creator choosing a bot for one side before start. Replacing any earlier
      choice removes it and clears people's readiness; choosing the same bot again changes
      nothing.
    forms:
    - assigns
    - assigned
    - replaced
    - replaces
    model:
    - assignBot
  - term: release a side
    definition: An accepted person giving up their own side before start. It becomes an open
      place. After start leaving the space resigns instead of releasing.
    forms:
    - releases
    - released
    model:
    - releaseSide
  - term: readiness
    definition: A participating person agreeing to the current sides and time choice before
      start. Every changed choice clears all people's readiness. Bots need no confirmation.
      A person may withdraw readiness before start.
    forms:
    - ready
    - not ready
    - becomes ready
    - no longer ready
    model:
    - ready
    - becomeReady
    - becomeUnready
  - term: swap sides
    definition: The creator exchanging all of White's and Black's choices before start. Any
      people must become ready again.
    forms:
    - swaps
    - swapped
    model:
    - swapSides
  - term: Custom Game status
    definition: Whether a Custom Game is configuring, active, completed or cancelled. A new
      game follows a terminal game without reviving it.
    forms:
    - configuring
    - active
    - completed
    - cancelled
    - started
    - finished
    - startable
    model:
    - status
    - CustomGameStatus
    - Configuring
    - Active
    - Completed
    - Cancelled
    - playStatus
    - startGame
    - cancelGame
  - term: Custom Game choices
    definition: The sides and time choice agreed before start. Start requires two participants
      and every person ready. Starting freezes these choices. Choices that have since changed
      cannot be replaced by an earlier attempt.
    forms:
    - choices
    - earlier choices
    model:
    - started
  - term: time choice
    definition: An untimed game, or the same whole number of minutes from 1 to 180 for both
      sides with a whole number of seconds increment from 0 to 60. Untimed games have no
      increment; no delay or different times for the sides are offered.
    forms:
    - untimed
    - timed
    model:
    - chooseClock
    - clockLeft
    - customTimePasses
  - term: Custom Game outcome
    definition: 'The final result: White wins, Black wins, a draw or cancellation with no
      winner. Wins say checkmate, resignation or time. Every game is unrated and never changes
      puzzle progress. A finished result cannot be replaced by a later action.'
    forms:
    - winner
    - unrated
    - resignation
    - on time
    - wins
    model:
    - resignGame
    - resignCustomGame
    - cancelCustomGame
    - result
  - term: draw offer
    definition: One participating person asking the other to agree to a draw in an active
      game between two people. Only the other person accepts or declines; playing a move
      clears the offer. Bots are not offered draws.
    forms:
    - offered a draw
    - offers a draw
    - accepts the draw
    - declines the draw
    model:
    - offerDraw
    - acceptDraw
    - declineDraw
  - term: rematch
    definition: A separate configuring Custom Game after completion or cancellation, with
      accepted participants swapped and the same time choice. Invitations are not inherited
      and absent people become open places. People must agree again; the earlier game keeps
      its outcome and move list.
    forms:
    - rematches
    model:
    - rematch
  - term: Custom Game refusal
    definition: 'Why a person''s choice cannot take effect: authority, lifecycle, participant
      relationship, readiness, time choice, changed choices or no connection. No refused
      choice changes a side, starts play or happens later on its own.'
    forms:
    - refusal
    model:
    - refusal
  - term: Custom Game move list
    definition: The moves of one game in algebraic notation, kept with its final outcome.
      Reviewing a played move shows that position without moving the live game; a move that
      was never played cannot be reviewed.
    forms:
    - move list
  - term: side control
    definition: Who may move for a side in a Custom Game, exclusively its accepted person
      or chosen bot.
    forms:
    - control
    - controls
    - controller
  - term: people in the space
    definition: The people who already belong to the Custom Game's space; only they may be
      invited or claim a side.
    model:
    - peopleInSpace
  - term: listen to the app
    from: runtime
  - term: watch a Custom Game
    definition: A person already in the space following its game without controlling a side.
      Outside the space the game is unavailable.
    forms:
    - watches the Custom Game
    - watching the Custom Game
    - listens to the Custom Game
    - reviews
  - term: repetition
    definition: The same position with the same side to move and the same rights appearing
      again. The third appearance completes a Custom Game as a draw.
    forms:
    - repeated
    - second repetition
    - third repetition
  - term: personal-data export
    from: profile
  - term: personal data
    from: profile
  - term: stalemate
    definition: The side to move is not in check but has no legal move. The Custom Game ends
      as a draw.
  - term: mating material
    definition: Pieces remaining that can produce checkmate, including help from the other
      side's pieces. A bare king has none. Without it, running out of time or resignation
      cannot award a win.
    forms:
    - insufficient mating material
    - remaining material
    - bare king
    - bare kings
  - term: fifty moves
    definition: Fifty moves by each side without a pawn move or capture end a Custom Game
      as a draw. A legal mating move completes checkmate before this draw.
    forms:
    - fiftieth
    - quiet move
    - quiet moves
  - term: Puzzle Assistant
    definition: >-
      The talking character beside the board. Its observation explains the
      current puzzle without claiming a chess fact it cannot establish.
      Its words remain available without sound or movement.
    forms: [assistant, assistant's, commentary]
    model: [commentary, commentaryPuzzle]

  - term: observation
    definition: >-
      One useful, justified explanation of the board or a proposed move.
      A wrong move is described as a possibility because the board keeps
      the position before it. Puzzle labels alone never justify a claim.
    forms: [observations]
    model: [guidance]

  - term: hanging piece
    definition: >-
      A piece the opponent can legally capture without a legal recapture
      of that attacker. The assistant names the piece and its square.
    forms: [hanging knight, hanging rook, hanging bishop, hanging queen, hanging pawn]

  - term: fork
    definition: >-
      One piece attacks at least two opposing pieces at once. The assistant
      describes a knight fork only when two of its targets are kings,
      queens or rooks, and a pinned knight cannot make the claimed captures.
    forms: [forked]

  - term: mute
    definition: Stop the assistant's voice while keeping its words available.
    forms: [muted, mutes, unmute, unmutes]
    model: [muteAssistant, unmuteAssistant, assistantMuted]

  - term: reduced motion
    definition: A person's choice to avoid decorative movement in the app.

  - term: speech
    definition: The assistant's observation spoken aloud; it never delays play.
    forms: [speaking, speaks, spoken]

  - term: first result
    definition: >-
      The first solved, failed or abandoned outcome recorded for a solver's
      puzzle. If devices act apart, the outcome that reaches the account first
      is kept.
    model: [Result, result, Solved, Failed, Abandoned]
