  - term: keyboard
    from: runtime
    forms: [left arrow, right arrow]
  # --- Multiplayer chess -------------------------------------------------------

  - term: multiplayer chess
    definition: >-
      A rated game of ordinary chess between two people with accounts,
      played at the time control both of them chose, within spaces. People
      in either space may watch the same game, including guests, but only
      its matched people may move, resign or abort. It is separate from the
      puzzle a space is playing. Each person can have one unfinished
      multiplayer game, across all devices. White starts; both people see
      their colour, their multiplayer opponent, both multiplayer clocks and
      the same board. Colours follow the colour balance and stay fixed for
      the game. Each person and every watcher may flip the board or review
      an earlier position on their own device, which changes nothing for
      anyone else. Guests in either space see that same multiplayer move
      list, those same multiplayer clocks and the same multiplayer result.
      Copying the game record from either space, or from another device,
      copies that one game.
    forms: [multiplayer game, multiplayer games, multiplayer board, multiplayer boards]
    published: true

  - term: multiplayer opponent
    definition: >-
      The other person in someone's multiplayer game, shown with their
      username and their multiplayer rating for the game's speed.
    forms: [multiplayer opponents, multiplayer opponent's]
    published: true

  - term: time control
    definition: >-
      How fast a multiplayer game is played. Most are written as the minutes
      each side starts with plus the seconds of increment each move earns:
      1+0 and 2+1 (bullet); 3+0, 3+2, 5+0 and 5+3 (blitz); 10+0, 10+5 and
      15+10 (rapid); 30+0 and 30+20 (classical). A daily time control is
      written as the days each person has for every move: 1 day, 3 days or
      7 days per move (daily). Finding a chess opponent needs exactly one
      of these, and people are paired only with someone who chose the same
      one. No multiplayer game is untimed.
    forms:
      - time controls
      - increment
      - offered time control
      - daily time control
      - daily time controls
      - day per move
      - days per move
    avoid: [time format, game mode, pace]

  - term: find a chess opponent
    definition: >-
      From a space, ask matchmaking for another person available for a
      multiplayer game at one chosen time control. People are paired only
      with someone who chose the same time control, by their multiplayer
      ratings for its speed, with the rating range growing as matchmaking
      defines it. Blocking in either direction prevents a new pairing. A
      participant of an active Custom Game finishes it before finding a
      chess opponent. While looking, a person sees their time control and
      how long they have been looking. Signing out on one device leaves an
      accepted search available on the person's other devices.
    forms:
      - finds a chess opponent
      - finding a chess opponent
      - chess opponent
      - chess opponents
      - looking for a chess opponent
      - looking for chess opponents
      - looking for other chess opponents
      - began looking
      - chess opponent search
      - opponent search
      - search

  - term: colour balance
    definition: >-
      How many more of their finished multiplayer games a person has played
      as White than as Black; aborted games do not count. When two people
      are matched, the one with the greater colour balance plays Black; when
      the balances are equal, either may be White. A multiplayer rematch
      swaps the colours instead.
    forms: [colour balances, colour, colours]
    avoid: [color, side preference]

  - term: multiplayer turn
    definition: >-
      The person whose side may move next. A legal move changes the board,
      joins the multiplayer move list and passes the turn exactly once. A
      move for a position the device is not showing never moves a piece,
      nor does a move after the game is over. The person's other device
      can play the move for the position it is showing, and that move
      joins the multiplayer move list once. An offline person sees the
      last accepted board and cannot send a move, resignation, abort or offer
      for later.
    forms: [turn, turns, plays a multiplayer move, repeats a multiplayer move, plays, repeats that multiplayer move]

  - term: multiplayer move list
    definition: >-
      The moves of one multiplayer game in algebraic notation, shown to both
      people and every watcher and kept with its result. Choosing a move in
      it shows the earlier position after that move.
    forms: [multiplayer move lists]

  - term: multiplayer clock
    definition: >-
      The time each side has left in a multiplayer game, shown to both
      people and every watcher. Outside a daily game each side starts with the time control's
      minutes, and neither clock runs until both people have made their
      first move; then only the side to move spends time, even while they
      are disconnected, and each legal move adds the time control's
      increment to the person who made it. In a daily game the side to move
      has the time control's days for every move, counted from the moment it
      became their turn; White's days for the first move run from the start
      of the game. Making a move hands the full days to the other person:
      unused time is never saved up, and no move earns an increment. The
      side that is not to move shows the full days. A running clock that is
      nearly used up is shown as low on time. When shared play is unavailable
      to everyone, both clocks pause and everyone is told they are paused.
      This includes daily games and time allowed for the first moves.
      Resuming keeps the accepted board and time left, gives no increment
      for returning, and never rates an unfinished game. A person whose own
      device alone is offline continues to spend the ordinary time on turn.
    forms:
      - multiplayer clocks
      - seconds pass in multiplayer chess
      - second passes in multiplayer chess
      - seconds have passed in multiplayer chess
      - hours pass in multiplayer chess
      - day passes in multiplayer chess
      - days pass in multiplayer chess
      - day has passed in multiplayer chess
      - days have passed in multiplayer chess
    avoid: [timer]

  - term: run out of time
    definition: >-
      A multiplayer clock reaching zero for the side to move. That person
      loses at once, even if their move arrives at that moment, unless their
      multiplayer opponent cannot checkmate by any series of legal moves,
      which makes it a multiplayer draw (FIDE Laws of Chess, Article 6.9).
      In a daily game this holds once both people have made their first
      move; before that, the time running out is missing the first move.
    forms: [runs out of time, ran out of time, running out of time, has run out]

  - term: multiplayer result
    definition: >-
      The permanent win or draw both people see when the multiplayer game
      is over. Checkmate wins for the mating side; resignation wins for the
      other side; running out of time loses. An accepted multiplayer draw
      offer draws by agreement. Stalemate, insufficient mating material, the
      same position for the third time, or fifty moves by each side without
      a pawn move or capture draw the game automatically. Once over, the
      board cannot move. Disconnection alone never ends a game, but a
      disconnected person's multiplayer clock keeps running on their turn.
      An aborted game is over without a result.
    forms: [multiplayer game is over, multiplayer draw, multiplayer win, drawn, drawn by agreement, finished multiplayer game]
    published: true

  - term: offer a multiplayer rematch
    definition: >-
      After a finished multiplayer game, one of its two people asking the
      other to play again: a new multiplayer game between them at the same
      time control with colours swapped, without a new search. Offering a
      rematch back accepts it. An aborted game has none, and it is refused
      once either person is in another unfinished game. The offer ends when
      either person declines it or finds a chess opponent.
    forms:
      - offers a multiplayer rematch
      - offered a multiplayer rematch
      - offered someone a multiplayer rematch
      - multiplayer rematch
      - multiplayer rematch offer

  - term: accept the multiplayer rematch
    definition: >-
      The person offered a multiplayer rematch agreeing to it, which starts
      the new multiplayer game at once.
    forms: [accepts the multiplayer rematch, accepted the multiplayer rematch]

  - term: resign multiplayer chess
    definition: >-
      Give up the unfinished multiplayer game once both people have made
      their first move; before that, resigning is refused and the person is
      told to abort the multiplayer game instead. From then on either person
      may resign regardless of turn; repeating the same resignation keeps
      its result. Confirming account deletion gives up that person's
      unfinished game, or aborts it if both people have not yet moved, and
      stops their opponent search before their account disappears.
    forms: [resigns multiplayer chess, resigned multiplayer chess]

  - term: multiplayer rating
    definition: >-
      A person's strength at one speed of multiplayer chess. Every account
      has a separate bullet, blitz, rapid, classical and daily rating, each
      starting at 1500 and provisional until it settles; puzzle ratings never
      supply or receive it. Finding a chess opponent uses the rating for the chosen
      time control's speed. Every finished multiplayer game moves both
      people's rating for its speed once, as Mark Glickman's Glicko-2 rating
      system works it out; an aborted game moves none. Each person sees
      their multiplayer opponent's rating when the game starts and their own
      rating move after the result.
    source: Mark Glickman, "Example of the Glicko-2 system", Boston University (how a result moves the ratings)
    forms:
      - multiplayer ratings
      - bullet rating
      - blitz rating
      - rapid rating
      - classical rating
      - bullet ratings
      - blitz ratings
      - rapid ratings
      - classical ratings
      - daily rating
      - daily ratings
    avoid: [elo, ladder points]

  - term: last known multiplayer board
    definition: >-
      The accepted board, multiplayer clocks, offers and result shown before
      a device went offline. They stay visible until a connection brings the
      accepted outcome back.

  - term: earlier position
    definition: >-
      A position a game was in before its latest move. In a multiplayer
      game, whether unfinished, over or aborted, each of its people and
      every watcher can review any earlier position on their own device:
      choose a move in the multiplayer move list, step back or forward one
      move, which the keyboard's left and right arrows do too, or go to the
      start. Their board then shows that position, marked as an earlier
      position, and no piece can be moved on it; their multiplayer clocks,
      turn, offers and result keep showing the game as it really stands.
      Reviewing one is private to the device, never moves a piece and needs
      no connection: with none it uses the last known multiplayer board. A
      move accepted meanwhile joins the multiplayer move list and leaves
      the board on the position the person chose. A person listening to
      the app is told which earlier position they are reviewing.
    forms: [earlier positions]
    avoid: [past position, old position]

  - term: current position
    definition: >-
      The position after a game's latest accepted move: the game as it
      really stands. A multiplayer board shows it unless its person is
      reviewing an earlier position, and one step returns them to it. Once
      the game is over it is the final position.
    forms:
      - return to the current position
      - returns to the current position
      - returning to the current position
      - final position
    avoid: [live position, latest position]

  - term: game record
    definition: >-
      A finished multiplayer game written out the way other chess programs
      read one: White's and Black's usernames as everyone sees them now, or
      a stand-in name where one is shown; the multiplayer result, written
      1-0 when White won, 0-1 when Black won and 1/2-1/2 for a draw; the
      time control; and every move in algebraic notation. Once a multiplayer game is over
      with a multiplayer result, each of its people and anyone watching can
      copy its game record, or copy just its final position. A guest in
      either space, and either person on another device, copies that same
      one. Being idle or losing the connection adds nothing to it. An unfinished
      game offers neither, so nobody is handed an easy way to ask a chess
      program for help during the game, and an aborted game offers neither.
    source: Portable Game Notation for the game record and Forsyth-Edwards Notation for the final position
    forms: [game records, copy the game record, copies the game record, copy the final position, copies the final position, copied]
    avoid: [PGN, download]

  - term: flip the board
    definition: >-
      Turn one's own multiplayer board around to see it from the other
      side, and flip it back the same way. The two people's names,
      multiplayer ratings and multiplayer clocks change places with it, so
      each stays beside its own pieces. A multiplayer board starts from the
      person's own side, and a watcher's from White's side; every new
      multiplayer game, a multiplayer rematch too, starts that way again.
      Flipping is private to the device, never moves a piece or changes
      whose turn it is, and needs no connection.
    forms: [flips the board, flipped the board, flipping the board, flipping, flipped]
    avoid: [rotate, switch sides]

  # --- Custom Games --------------------------------------------------------

  - term: Custom Game
    definition: One unrated standard game of chess in a space, with White and Black each
      chosen as a person, a bot, an invitation, an open place or a closed side before start.
      The host is its creator and need not participate. The usual starting position is used;
      other variants and starting positions are not offered. The game may be timed or untimed.
      The host can create, configure and play without a connection when no other person holds
      a side or invitation. Choices involving another person need a connection.
      Agreed choices and moves remain available on return.
    forms:
    - Custom Games
    - Custom Game's
    published: true
  - term: side
    definition: White or Black in a Custom Game or a multiplayer game. In a Custom Game each
      has one choice of participant, and one person cannot be accepted or invited on both sides.
    forms:
    - sides
    - White
    - Black
  - term: participant
    definition: A person who accepted one side, or a bot chosen for one side. The creator
      is a participant only when accepted on a side. Watching never gives control of a participant.
    forms:
    - participants
  - term: bot
    definition: A chess opponent that plays legal moves by itself for its own side. Either
      or both sides may be bots, including identical bots. There are no strength or personality
      choices. A bot stops when the game ends.
    forms:
    - bots
  - term: closed side
    definition: An unoccupied side nobody may claim until the creator opens it or chooses
      a participant. A closed side prevents starting.
    forms:
    - closed sides
    - closed
    - closes
  - term: invitation
    definition: A side reserved by the creator for a person already in the space, who alone
      may accept or decline it before start. The invited person is shown it; nobody outside
      the space is. It is not a participant until accepted. Declining or revoking makes the
      side open and the invited person no longer sees it; replacement removes the offer. An
      earlier offer cannot survive new choices. The creator cannot invite someone when either
      of them has blocked the other, and is only told that person cannot be invited.
    forms:
    - invitations
    - invited
    - invites
    - reserved
    - revoked
    - revokes
  - term: take a side
    definition: The creator choosing themselves for one side before start. Replacing a choice
      clears readiness; taking the same accepted side again changes nothing.
    forms:
    - takes
    - take
  - term: assign a bot
    definition: The creator choosing a bot for one side before start. Replacing any earlier
      choice removes it and clears people's readiness; choosing the same bot again changes
      nothing.
    forms:
    - assigns
    - assigned
    - replaced
    - replaces
  - term: readiness
    definition: A participating person agreeing to the current sides and time choice before
      start. Every changed choice clears all people's readiness. Bots need no confirmation.
      A person may withdraw readiness before start.
    forms:
    - ready
    - not ready
    - becomes ready
    - become ready
    - no longer ready
  - term: swap sides
    definition: The creator exchanging all of White's and Black's choices before start. Any
      people must become ready again.
    forms:
    - swaps
    - swapped
    - swapping
  - term: Custom Game status
    definition: Whether a Custom Game is configuring, active, completed or cancelled. A new
      game follows a terminal game without reviving it.
    forms:
    - configuring
    - active
    - completed
    - cancelled
    - started
    - finished
    - startable
  - term: Custom Game choices
    definition: The sides and time choice agreed before start. Start requires two participants
      and every person ready. Starting freezes these choices. Choices that have since changed
      cannot be replaced by an earlier attempt.
    forms:
    - choices
    - earlier choices
  - term: time choice
    definition: An untimed game, or the same whole number of minutes from 1 to 180 for both
      sides with a whole number of seconds increment from 0 to 60. Untimed games have no
      increment; no delay or different times for the sides are offered.
    forms:
    - untimed
    - timed
  - term: Custom Game outcome
    definition: 'The final result: White wins, Black wins, a draw or cancellation with no
      winner. Wins say checkmate, resignation, time, or the other participant staying away.
      Every game is unrated and never changes puzzle progress. A finished result cannot be
      replaced by a later action.'
    forms:
    - winner
    - unrated
    - resignation
    - on time
    - wins
  - term: draw offer
    definition: One participating person asking the other to agree to a draw in an active
      game between two people. Only the other person accepts or declines; playing a move
      clears the offer. After a declined offer, the person who offered may offer again only
      once they have played their next move. Bots are not offered draws.
    forms:
    - offered a draw
    - offers a draw
    - accepts the draw
    - declines the draw
  - term: rematch
    definition: A separate configuring Custom Game after completion or cancellation, with
      accepted participants swapped and the same time choice. Invitations are not inherited
      and absent people become open places. People must agree again; the earlier game keeps
      its outcome and move list.
    forms:
    - rematches
  - term: Custom Game refusal
    definition: 'Why a person''s choice cannot take effect: authority, lifecycle, participant
      relationship, a block, readiness, time choice, a draw offer just declined, an opponent
      who may still return, changed choices or no connection. A refusal caused by a block
      never says who blocked whom. No refused choice changes a side, starts play or happens
      later on its own.'
    forms:
    - refusal
  - term: Custom Game move list
    definition: The moves of one game in algebraic notation, kept with its final outcome.
      Reviewing a played move shows that position without moving the live game; a move that
      was never played cannot be reviewed.
    forms:
    - move list
    published: true

  - term: side control
    definition: Who may move for a side in a Custom Game, exclusively its accepted person
      or chosen bot.
    forms:
    - control
    - controls
    - controller
  - term: listen to the app
    from: runtime
  - term: repetition
    definition: The same position with the same side to move and the same rights appearing
      again. The third appearance completes a Custom Game as a draw.
    forms:
    - repeated
    - second repetition
    - third repetition
  - term: stalemate
    definition: The side to move is not in check but has no legal move. The Custom Game ends
      as a draw.
  - term: mating material
    definition: Pieces remaining that can produce checkmate, including help from the other
      side's pieces. A bare king has none. Without it, running out of time cannot award a
      win; in a Custom Game, resignation cannot either.
    forms:
    - insufficient mating material
    - remaining material
    - bare king
    - bare kings
  - term: fifty moves
    definition: Fifty moves by each side without a pawn move or capture end a Custom Game
      as a draw. A legal mating move completes checkmate before this draw.
    forms:
    - fiftieth
    - quiet move
    - quiet moves
  - term: Puzzle Assistant
    definition: >-
      The talking character beside the board. Its observation explains the
      current puzzle without claiming a chess fact it cannot establish.
      Its words remain available without sound or movement.
    forms: [assistant, assistant's, commentary]
    model: [commentary, commentaryPuzzle]

  - term: observation
    definition: >-
      One useful, justified explanation of the board or a proposed move.
      A wrong move is described as a possibility because the board keeps
      the position before it. Puzzle labels alone never justify a claim.
    forms: [observations]
    model: [guidance]

  - term: hanging piece
    definition: >-
      A piece the opponent can legally capture without a legal recapture
      of that attacker. The assistant names the piece and its square.
    forms: [hanging knight, hanging rook, hanging bishop, hanging queen, hanging pawn]

  - term: fork
    definition: >-
      One piece attacks at least two opposing pieces at once. The assistant
      describes a knight fork only when two of its targets are kings,
      queens or rooks, and a pinned knight cannot make the claimed captures.
    forms: [forked]

  - term: mute
    definition: Stop the assistant's voice while keeping its words available.
    forms: [muted, mutes, unmute, unmutes]
    model: [muteAssistant, unmuteAssistant, assistantMuted]

  - term: reduced motion
    definition: A person's choice to avoid decorative movement in the app.

  - term: speech
    definition: The assistant's observation spoken aloud; it never delays play.
    forms: [speaking, speaks, spoken]

  - term: first result
    definition: >-
      The first solved, failed or abandoned outcome recorded for a solver's
      puzzle. If devices act apart, the outcome counted first is kept, and
      every device of the account shows it.

  - term: progress
    definition: >-
      How far a puzzle addition or a file save has advanced; accepted puzzles and completed writing remain available.

  - term: publish a file
    definition: >-
      Make the completed saved puzzle file available to be used.
    forms: [publishes]

  - term: resume a chess puzzle
    definition: >-
      Return to a chess puzzle at its kept position.
    forms: [resumed]

  - term: continue a puzzle addition
    definition: >-
      Keep adding puzzles until the addition finishes or is stopped.
    forms: [continues]
