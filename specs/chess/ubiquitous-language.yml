  # The shared kernel's "the app", named in this context's model.
  - term: the app
    from: kernel
    model: [reopenApp]

  # --- Where a person is in a space ------------------------------------------

  - term: game
    definition: >-
      Something a space plays together, chosen by its host; everyone in the
      space is taken to it without doing anything, on every device they
      have in the space. A guest cannot choose a different one. A later
      choice by the host replaces the earlier one everywhere in the space.
      Chess is one.
    published: true

  - term: chess
    definition: >-
      The game whose puzzles this context is about. In a space, chess offers
      its chess choices; playing puzzles is one of them. The host picks chess
      for the space; a guest cannot.
    published: true

  - term: space view
    definition: >-
      What a person in a space is looking at: the space's game choice, the
      chess choices, or the board. What a space plays belongs to the space,
      so everyone in it has the host's view, on every device they have in
      the space. Going idle does not change what the space is showing.
    avoid: [screen, menu, page]
    model: [View, view, Elsewhere]

  - term: game choice
    definition: >-
      Where a space's host picks the game the space plays, and where everyone
      in the space starts.
    model: [GameChoice, backToGameChoice]

  - term: chess choices
    definition: >-
      Chess's own starting point in a space, between the game choice and the
      board; a solver steps back here from the board and goes back to the
      puzzles from here.
    model: [ChessChoices]

  - term: board
    definition: >-
      The chessboard a puzzle is played on, as each person in the space sees
      it. It faces the solver's side, shows the last move, and shows the
      puzzle's state; a watcher's board agrees with the host's. In a Custom
      Game each participant's board faces their own side, and everyone
      else's board faces White.
    model: [Board]
    published: true

  - term: play puzzles
    definition: >-
      Solve puzzles from the puzzle feed on the board in a space. A person
      opens puzzles from the game choice, and goes back to the puzzles from
      the chess choices, finding any unfinished puzzle as they left it.
    forms:
      - plays puzzles
      - playing puzzles
      - open puzzles
      - opens puzzles
      - opened puzzles
      - go back to the puzzles
      - goes back to the puzzles
    model: [openPuzzles, goBackToPuzzles]

  - term: leave the puzzle
    definition: >-
      Step back from the board to the chess choices. An unfinished puzzle
      waits, as it was, for the solver to go back to the puzzles; a finished
      one does not, and going back starts the next puzzle.
    forms: [leaves the puzzle, left the puzzle, leaving the puzzle]
    model: [leavePuzzle]

  # --- Puzzles and the feed --------------------------------------------------

  - term: puzzle
    definition: >-
      A chess position whose objective is to find the solution or deliver
      checkmate, played on the board. Each
      puzzle has a rating of its own, which is how hard it is.
    avoid: [problem, exercise]
    model: [puzzle, PuzzleSound, puzzleSound]
    published: true

  - term: puzzle's own rating
    definition: >-
      How hard a puzzle is, as a rating on the same scale as the puzzle
      rating. It is hidden while the puzzle is being solved, shows once the
      puzzle is over, and shows beside the puzzle in the game log.
    forms: [own rating]

  - term: puzzle pool
    definition: >-
      Every puzzle that can be served. The puzzle feed chooses from it.
    forms: [pool]

  - term: add puzzles
    definition: >-
      The team putting chosen puzzles into the puzzle pool, updating puzzles
      already there instead of adding extra copies. Only good puzzles get
      in; broken ones are turned away. The team can follow the result or
      stop adding more while keeping the puzzles already added.
    forms:
      - adds puzzles
      - added puzzles
      - adding puzzles
      - started adding puzzles
      - finishes adding puzzles
      - finished adding puzzles
      - fails to add puzzles
      - failed to add puzzles
      - tries to add puzzles
      - offered to add puzzles
      - can add puzzles
      - allowed to add puzzles
      - puzzles were added
      - adds these puzzles again
      - updated puzzles
      - puzzles updated
      - puzzles were updated
      - follows adding puzzles
      - stops adding puzzles
      - stopped adding puzzles
      - stop adding puzzles
      - adds some of the puzzles
    avoid: [import, ingest, puzzle file]
    model:
      - PuzzleLoading
      - puzzleLoading
      - addPuzzles
      - finishAddingPuzzles
      - failAddingPuzzles
      - addSomePuzzles
      - stopAddingPuzzles
      - followAddingPuzzles
      - addingPuzzles
      - addingPuzzlesStatus
      - stoppingPuzzles
      - askToStopAddingPuzzles
      - cancelStoppingPuzzles
      - confirmStoppingPuzzles
      - finishStoppingPuzzles
      - failStoppingPuzzles
      - returnToLichessFile
      - followingAddingPuzzles
      - leavingAddingPuzzles
      - askToLeaveAddingPuzzles
      - cancelLeavingAddingPuzzles
      - confirmLeavingAddingPuzzles
      - leaveAddingPuzzles

  - term: Lichess file
    definition: >-
      The chosen puzzles the team saves once so every environment can add
      those puzzles without asking anyone to provide them again.
    forms:
      - saved Lichess file
      - saves a Lichess file
      - saved a Lichess file
      - provide a Lichess file
      - save another Lichess file
    model:
      - LichessFile
      - lichessFile
      - lichessFileSaved
      - savingLichessFile
      - needsLichessFile
      - checkLichessFile
      - finishCheckingLichessFile
      - failCheckingLichessFile
      - chooseLichessFile
      - saveLichessFile
      - finishSavingLichessFile
      - failSavingLichessFile
      - askToStopSavingLichessFile
      - cancelStoppingLichessFile
      - confirmStoppingLichessFile
      - anotherEnvironmentSavesLichessFile

  - term: broken puzzle
    definition: >-
      A puzzle the team adds that cannot go in the pool: its line holds an
      illegal move, castles without the right to, or ends on the opponent's
      move; it starts from a position that could never happen in chess; or it
      copies another puzzle already in the pool. It never reaches anyone.
    forms: [broken puzzles, broken]
    avoid: [rejected puzzle, invalid puzzle, malformed]

  - term: low-quality puzzle
    definition: >-
      A puzzle below the quality bar: a popularity below 50, or played fewer
      than 5 times. The puzzle feed never serves one; a puzzle with a
      popularity of exactly 50 that was played exactly 5 times is served.
    forms: [quality bar, low-quality]

  - term: popularity
    definition: >-
      How much the people who played a puzzle liked it. A puzzle needs a
      popularity of at least 50 to be served.

  - term: retired puzzle
    definition: >-
      A puzzle taken out of the puzzle feed. It is never served again, but
      it stays in the game log and still opens in review.
    forms: [retired]

  - term: puzzle feed
    definition: >-
      The endless run of puzzles a solver plays in their space: finish one and
      the next is ready at once, never the one just played. It serves unplayed
      puzzles in the rating window first, then the unplayed puzzle nearest
      the feed target; a puzzle played on one of the solver's devices is not
      served on another. Once every puzzle is played it comes round to the one
      attempted longest ago, unrated.
    forms: [feed, feed's]
    avoid: [queue, playlist]

  - term: feed settings
    definition: >-
      A solver's choices for their puzzle feed: the history filter, a puzzle
      theme, and the feed target. Only a person with an account can change
      them; saved choices stick after the app closes and follow the person to
      their other devices. Editing previews choices; saving applies them.
      Closing without saving keeps the saved choices.
    forms: [feed choices, unsaved feed settings]

  - term: history filter
    definition: >-
      Which puzzles the feed may serve by whether the solver has played them:
      "Unseen" (the default), "Any", "Seen" for played puzzles, or "Failed"
      for puzzles whose first attempt failed. "Failed" puzzles come back
      unrated; with no failed attempt the feed is empty and the solver is told
      why.
    forms: [feed history]

  - term: puzzle theme
    definition: >-
      A kind of puzzle, such as "zugzwang" or "fork". A puzzle has one or more
      themes; they are hidden while it is being solved and show once it is
      over. Limiting the feed to a theme serves only puzzles with it, sticks
      like other feed choices, and empties the feed when no puzzle fits.
    forms: [theme, theme filter, puzzle's themes]

  - term: feed target
    definition: >-
      The rating the puzzle feed serves puzzles near. It is automatic (the
      puzzle rating after the last result, plus the rating offset) or custom
      (a fixed rating from 400 to 3000).
    forms:
      - target
      - feed targets
      - automatic target
      - custom target
      - custom feed target
    avoid: [difficulty]

  - term: rating offset
    definition: >-
      How far above or below the puzzle rating an automatic feed target sits,
      in steps of 50, from −400 to +400.
    forms: [feed rating offset]

  - term: rating window
    definition: >-
      The ratings around the feed target the feed serves unplayed puzzles
      from: within 100 of the feed target once the puzzle rating has settled,
      within 200 while it is provisional. With no unplayed puzzle in it, the
      unplayed puzzle nearest the feed target comes next.
    avoid: [band]

  # --- Solving ---------------------------------------------------------------

  - term: solver
    definition: >-
      The person solving the puzzle on the board: the host, when a space has
      watchers. The board faces the solver's side.
    avoid: [puzzler]

  - term: attempt
    definition: >-
      One play of one puzzle, from its start until it is solved, failed or
      abandoned. The first wrong move is the attempt's outcome, and a retry
      continues the same attempt. Leaving the puzzle or closing the app does
      not end it.
    avoid: [session]

  - term: puzzle state
    definition: >-
      Where the puzzle on a board stands, as the board tells it: being solved
      (the solver is asked to find the next move), a wrong move played,
      solved, skipped, or its solution shown.
    model: [puzzleState]

  - term: line
    definition: >-
      A puzzle's whole sequence of moves, from the opponent's setup move to
      its end. "Move N of the line" is the position after its Nth move.

  - term: setup move
    definition: >-
      The opponent's first move of the line, already played when the puzzle
      opens.

  - term: opponent
    definition: >-
      The side the solver plays against in a puzzle; its setup move and its
      replies play by themselves. In multiplayer chess it is the multiplayer
      opponent.

  - term: prompt
    definition: >-
      What the board asks the solver, such as "Your turn — find the best move
      for White". While the puzzle is being solved, the solver is asked to
      find the next move.
    forms: [prompted, asked to find the next move]

  - term: solution
    definition: >-
      The solver's moves in the line. Every correct way to finish counts:
      another mate on the final move, a faster mate, or the same moves in
      another order.

  - term: solution move
    definition: The next move of the solution, from where the board stands.
    forms: [asks to see the solution move, asked to see the solution move, correct move]
    model: [revealSolutionMove, trySolutionBeforeHint]

  - term: solve
    definition: >-
      Finish a puzzle with the solution or any legal checkmate. A solved puzzle is over, and
      its pieces can no longer be moved.
    forms: [solves, solved, solving]
    model: [solve]
    published: true

  - term: wrong move
    definition: >-
      A legal move that is not the solution. The solver is told at once, the
      attempt is failed from then on, and pieces cannot be moved until a
      retry. It earns half credit, like a hint.
    forms: [wrong]
    avoid: [mistake, blunder]
    model: [playWrongMove]

  - term: hint
    definition: >-
      Help while solving: the first highlights the piece to move, the second
      shows the solution move. A puzzle solved after a hint earns half credit.
    forms: [asks for a hint, asks for another hint, asked for a hint]
    model: [requestHint, help, tryHintAfterFinish, tryHintFromReview, tryHintBeforeRetry, tryEarlierHint]

  - term: half credit
    definition: >-
      What a solve after a hint earns toward the puzzle rating: the same
      rating change as a wrong move, and less than a clean solve.

  - term: retry the puzzle
    definition: >-
      After a wrong move, continue at the position already reached. After a
      solve, a shown solution or a skip, play the same puzzle from its start.
      It continues the same attempt, so its first outcome does not change.
    forms: [retries the puzzle, retried the puzzle, retrying the puzzle]
    model: [retry, tryRetryWhileSolving]

  - term: show the solution
    definition: >-
      Have the rest of the line play out on the board (the revealed
      solution). The puzzle is over and the attempt is failed.
    forms:
      - shows the solution
      - shown the solution
      - showing the solution
      - shown solution
      - revealed
      - revealed solution
      - revealed line
    model: [showSolution, tryShowSolutionAfterFinish, tryShowSolutionFromReview]

  - term: skip
    definition: >-
      Give up on a puzzle being solved. It is over, and the attempt is
      abandoned.
    forms: [skips, skipped, skipping]
    model: [skip, trySkipAfterFinish]

  - term: failed attempt
    definition: >-
      An attempt's outcome once a wrong move was played or the solution was
      shown, however the puzzle ends afterwards.
    avoid: [loss]

  - term: puzzle is over
    definition: >-
      A puzzle is over once it is solved, skipped or its solution shown. Its
      pieces can no longer be moved, and the host may move on.
    model: [isOver]

  - term: abandoned attempt
    definition: An attempt's outcome when the puzzle was skipped.

  - term: move on
    definition: >-
      Go from a puzzle that is over to the next puzzle in the feed, never the
      one just played. Only the host is offered it; asking twice at once
      still moves on one puzzle, and it works offline.
    forms:
      - moves on
      - moved on
      - moving on
      - asks for another puzzle
      - asks for the next puzzle
      - asking for the next puzzle
    model: [moveOn, moveOnTwiceAtOnce, moveOnOffered]

  - term: auto-advance
    definition: >-
      A solver's setting to move on by itself a set time after a solve.
    forms: [advance]

  - term: puzzle clock
    definition: >-
      How long the current attempt has run. It runs while the puzzle is being
      solved and stops when the puzzle is over.
    forms: [clock, seconds pass]
    model: [timePasses]

  - term: haptic
    definition: >-
      A buzz the solver feels from their device: the success haptic on a
      solve, the error haptic on a wrong move.

  # --- Watching --------------------------------------------------------------

  - term: watcher
    definition: >-
      Someone in a space watching its Custom Game, multiplayer game or the host's puzzle.
      In a Custom Game they have no accepted side and cannot move pieces. Their board agrees with
      the host's, even after arriving mid-puzzle or losing the connection. A
      watcher may make a suggestion but never drives the puzzle and is never
      rated for it. In a multiplayer game a watcher may flip the board or
      review an earlier position on their own device, which changes nobody
      else's board.
    forms: [watch, watches, watched, watching]
    avoid: [spectator, viewer, observer]

  - term: suggestion
    definition: >-
      A move a watcher proposes. The host and every watcher see it; it does
      not move the puzzle, and the host's next move clears it.
    forms: [suggest, suggests, suggested]
    model: [suggestMove]

  # --- Rating, stats and the game log ------------------------------------------

  - term: puzzle rating
    definition: >-
      A solver's running rating, moved by every rated attempt, online or
      offline. Every device shows the same one. A new solver starts at the
      seed rating, provisional. Solving a puzzle whose own rating is above
      the solver's gains more than solving an easier one; failing an easier
      puzzle costs more than failing a harder one. Time taken never changes
      it.
    forms: [rating, rating gain, puzzle ratings]
    avoid: [score, elo]

  - term: seed rating
    definition: The puzzle rating every solver starts at, 1500.

  - term: rating change
    definition: >-
      How much one rated attempt moved the solver's puzzle rating. It shows as
      soon as the attempt's outcome is decided: "+N" after a solve, "−N"
      after a wrong move, a skip or a shown solution. An unrated attempt shows
      that it is unrated instead, and a watcher sees none.
    forms: [rating changes]
    avoid: [delta, rating diff, rating difference]

  - term: rating floor
    definition: >-
      400, the lowest a puzzle rating goes. Failing at the rating floor leaves
      the rating at 400.

  - term: rating ceiling
    definition: >-
      3000, the highest a puzzle rating goes. Solving at the rating ceiling
      leaves the rating at 3000.

  - term: provisional
    definition: >-
      A puzzle rating or multiplayer rating that has not yet settled, shown
      with a trailing "?" (for example "1500?"). A puzzle rating moves
      further for each puzzle than a settled rating does.

  - term: settle
    definition: >-
      A puzzle rating settles once enough rated attempts have been played,
      and a multiplayer rating once enough rated multiplayer games have been
      played at its speed; it then loses its "?".
    forms: [settles, settled, settling]

  - term: rated attempt
    definition: >-
      An attempt that moves the puzzle rating: a solver's first attempt at a
      puzzle, ever. A repeat of an already-played puzzle is unrated, and a
      watcher is never rated.
    forms: [rated, unrated, rated puzzle]

  - term: stats
    definition: >-
      A solver's puzzle rating, puzzles played and solved, accuracy, and how
      the rating moved over time. They count each puzzle's rated attempt
      only.
    avoid: [statistics, scoreboard]

  - term: accuracy
    definition: The share of rated attempts solved, as a whole percentage.

  - term: game log
    definition: >-
      A solver's list of every puzzle they played, each recorded as solved,
      failed or abandoned with the puzzle's own rating and its rating change
      (or that it was unrated), and each opening in review.
    avoid: [puzzle history]

  - term: review
    definition: >-
      Stepping through a played puzzle's whole line from the game log. It
      opens on the final position; stepping one move animates and jumping
      snaps straight to a position. The current move is highlighted in the
      review's move list, in algebraic notation. In a multiplayer game,
      reviewing is looking at an earlier position of that game on one's own
      device.
    forms: [reviews, reviewing, reviewed]
    avoid: [replay, analysis]
    model: [stepBackPosition, stepForwardPosition, position, chooseReviewPosition, tryReviewBeforeRetry]

  # --- The daily puzzle limit --------------------------------------------------

  - term: daily puzzle limit
    definition: >-
      The 20 rated puzzles a guest may start in a day; free accounts and Plus
      members have none. A puzzle under way when it is reached can still be
      finished; the next does not start, and the guest is invited to sign in.
      It holds the same offline, and a new day brings a fresh allowance.
    forms: [puzzle limit, daily limit, limit, allowance, daily allowance]
    avoid: [quota, cap]

  - term: puzzle start
    definition: >-
      One use of a guest's daily puzzle limit, spent when a rated puzzle first
      starts. Going back to a puzzle already started spends none.
    model: [puzzleStarts]

