# The ubiquitous language of the Chess context: chess puzzles played in a
# space, and Custom Games. Chess rules are cited from the FIDE Laws of Chess, not redefined.
# Terms other contexts own are borrowed (from: <domain>) with the spelling the
# context map publishes.
context: Chess
purpose: >-
  Custom Games with configurable White and Black, and an endless feed of chess puzzles a person solves in their space, with
  friends watching, that keeps an honest puzzle rating and a game log of every
  puzzle played, online or offline.

terms:
  - term: pair people up
    from: matchmaking
  - term: person
    from: kernel
  - term: device
    from: kernel
  - term: connection
    from: kernel
    model: [online, loseConnection, comeBackOnline, connectionReturns]
  - term: environment
    from: kernel
  - term: block someone
    from: friends
  - term: account deletion
    from: profile
