# live
# People can pay for Plus and see it on their account (Payments). The team
# checks it from outside on every one of its regular checks.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: payment-checks-passing
  displayName: The team's checks that find people can pay
spec:
  description: >-
    Of the team's regular checks from outside, the share in which paying
    worked and the account showed what was paid for. A check that did not
    run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which paying worked
            and the account showed it.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can pay.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: people-can-pay
  displayName: People can pay
  labels:
    tier: "1"
spec:
  description: >-
    People can pay. At least 99.99% of eligible outcomes meet
    this promise over the last seven days. Every failed check counts;
    missing evidence cannot establish that the promise is kept.
  service: billing
  indicatorRef: payment-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: At least 99.99% meet this promise
      target: 0.9999
      timeSliceTarget: 1
      timeSliceWindow: 1h
