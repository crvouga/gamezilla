# live
# People can pay for Plus and see it on their account (Payments). The team
# checks it from outside on every one of its regular checks.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: payment-checks-passing
  displayName: The team's checks that find people can pay
spec:
  description: >-
    Of the team's regular checks from outside, the share in which paying
    worked and the account showed what was paid for. A check that did not
    run is not a pass.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: product
        spec:
          measures: >-
            The team's regular checks from outside in which paying worked
            and the account showed it.
    total:
      metricSource:
        type: product
        spec:
          measures: >-
            Every one of the team's regular checks from outside of whether
            people can pay.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: people-can-pay
  displayName: People can pay
  labels:
    tier: "1"
spec:
  description: >-
    In at least 95 of every 100 hours in which the team checked, paying
    worked and the account showed it, judged over the last week. It matters
    to people, but they can still play while it is down, so it is held a
    little looser than the core of the game.
  service: billing
  indicatorRef: payment-checks-passing
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - displayName: In at least 95 of every 100 checked hours people can pay
      target: 0.95
      timeSliceTarget: 1
      timeSliceWindow: 1h
