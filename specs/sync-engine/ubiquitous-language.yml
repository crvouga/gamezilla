# The ubiquitous language of Sync engine: notes people write and share across
# devices and shared spaces, even offline. Sync engine stands alone (see the
# context map): it borrows nothing from another context. A shared space is not
# a Spaces space, and a notice here is not a Friends notice.
context: Sync engine
purpose: >-
  Notes people write and share, on every device they use and with everyone in
  a shared space, that show at once, survive the app crashing and being
  offline, and count exactly once.

terms:
  # --- Notes ------------------------------------------------------------------

  - term: note
    definition: >-
      A piece of writing a person keeps: a title (such as "Groceries") and a
      body (such as "milk"). A note shows at once on its writer's device and
      reaches everyone it is shared with.
    avoid: [memo, document]
    model: [Note, Notes, notes]

  - term: title
    definition: >-
      A note's name, such as "Groceries". Writing a note with a title that
      already exists replaces its body.
    model: [Title]

  - term: body
    definition: >-
      What a note says, such as "milk" in 'the note "Groceries" saying
      "milk"'.
    forms: [saying]

  - term: write
    definition: >-
      Write a note: give it a title and a body. Writing a note with a title
      that already exists replaces its body and makes the writer its owner;
      writing a deleted note again brings it back for everyone.
    forms: [writes, wrote, written, writing, writer, writer's]
    model: [Write, write]

  - term: delete a note
    definition: >-
      The owner of a note removes it for everyone. Only the owner of a note
      may delete it.
    forms:
      - deletes the note
      - deleted the note
      - deleting the note
      - delete the note
      - deleted note
      - deleting notes
    model: [Delete, deleteNote]

  - term: owner of a note
    definition: >-
      Whoever last wrote the note. Only they may delete it.
    forms: [owns, owned]
    model: [owners]

  - term: shared space
    definition: >-
      A group of people who share notes. Anyone can create one, join it, or
      leave it, even offline; every note written by someone in it reaches
      everyone in it. Joining a shared space that does not exist is refused.
    avoid: [space, group]
    model: [SpaceId, Membership, members, createSpace, CreateSpace, leaveSpace, LeaveSpace]

  - term: join a shared space
    definition: >-
      Become one of the people in a shared space, or come back to one: every
      note written in it, including those missed while away, reaches them.
    forms:
      - joins the shared space
      - joined the shared space
      - joining the shared space
      - rejoin
      - rejoins
      - rejoined
      - rejoining
    model: [joinSpace, JoinSpace]

  - term: leave a shared space
    definition: >-
      Stop being one of the people in a shared space. New notes written there
      stop reaching them, but they keep every note they already had.
    forms:
      - leaves the shared space
      - left the shared space
      - leave the shared space
      - leaving the shared space
      - leaves
      - left
      - leaving

  - term: end a shared space
    definition: >-
      A shared space coming to an end for everyone in it. New notes written
      for it reach nobody any more; everyone keeps the notes they had, and
      nobody's live updates for anything else are interrupted.
    forms: [end, ends, ended, ending]

  - term: open a shared space
    definition: >-
      Look at the notes of a shared space. Opening, or closing, one the
      person is not in shows them nothing of it and never costs them the
      notes they already have.
    forms: [opens, opened, opening, close, closes, closed, closing, not in]

  - term: catch up
    definition: >-
      The app fetching what it missed, so it shows the shared notes again.
      A device that cannot send cannot catch up until it can send again,
      though live updates still reach it.
    forms: [catches up, caught up, catching up]

  # --- Devices, connection, crashes -------------------------------------------

  - term: crash
    definition: >-
      The app stops without warning. When it reopens it still has every note
      it had, including notes that had not yet reached anyone else.
    forms: [crashes, crashed]
    model: [crashAndReopen, crashWhileSaving]

  - term: hear back
    definition: >-
      The app learning that a note it wrote has been kept for everyone. Word
      can get lost on the way back; the note still counts exactly once.
    forms: [hears back]
    model: [writeUnheard, hearBack]

  - term: online-only action
    definition: >-
      Something that truly needs a connection, such as writing an
      announcement. Tried offline, it tells the person it needs a connection,
      and it is not done later on its own.
    forms: [online-only actions]

  - term: announcement
    definition: >-
      A note that goes out to everyone in the shared space the moment it is
      written, so it can only be written while connected. Once written it
      shows like any other note.

  # --- Refused edits ------------------------------------------------------------

  - term: refused edit
    definition: >-
      Writing or deleting a note that the person's device accepted but that
      breaks the rules once it reaches everyone else, such as deleting a note
      offline that someone else has since written and so now owns. It is
      undone on its author's device and never reaches anyone else. A delete
      the device already knows is not allowed simply does not happen, and
      leaves no notice.
    forms: [was refused, been refused, refusal]

  - term: notice
    definition: >-
      A notice of a refused edit tells its author that their edit was refused.
      It stays until the author acknowledges it, and then it is gone. It
      survives the app updating, reopening, or having its data cleared; only
      signing the person out elsewhere takes it off the device.
    forms: [notices]
    model: [rejections]

  - term: acknowledge
    definition: >-
      The author of a refused edit says they have seen its notice, which
      then goes away.
    forms: [acknowledges, acknowledged, acknowledging]

  # --- Keeping notes in step ---------------------------------------------------

  - term: edit
    definition: >-
      Writing or deleting a note.
    forms: [edits]
    model: [Edit]

  - term: shared notes
    definition: >-
      The notes as everyone keeps them together: what every device shows once
      it is online and everything has settled. They take in each edit at most
      once, in the order its device made it, and refuse an edit that breaks
      the rules.
    model: [Shared, Received, History]

  - term: unsent
    definition: >-
      An edit made on a device that has not yet reached the shared notes. It
      shows on the device at once and waits there, in order, until it is
      sent.
    model: [Unsent, unsent]

  - term: folder
    definition: >-
      A named place a person files notes in. A note filed in a folder shows in
      that folder for everyone. Like a note, whoever wrote it last owns it,
      and only they may delete it.
    forms: [folders, file, files, filed, filing]
    model: [folders, writeFolder, WriteFolder, deleteFolder, DeleteFolder]

  - term: colour
    definition: >-
      A colour a note can be given, such as green, in versions of the app
      that have colours. A note keeps its colour through edits from earlier
      versions and through going back to an earlier version; the app shows
      it once it is on a version that has colours.
    forms: [colours, coloured, given the colour]

  - term: tag
    definition: >-
      A word a note can be given, such as "shopping", in versions of the app
      that tag notes. Like a colour, a note keeps its tags through earlier
      versions.
    forms: [tags, tagged]

  - term: checked note
    definition: >-
      A note that must pass a rule only everyone else can check before it
      counts, such as, in these examples, that a note may not say "refused".
      It shows on its writer's device at once and is saving until the answer
      comes: then it is saved, or it is refused and the note goes back to what
      it said before.
    forms: [checked notes]

  - term: saving
    definition: >-
      A checked note is saving while the app waits for the answer, and saved
      once it is kept for everyone.
    forms: [saved]

  # --- What can go wrong ------------------------------------------------------

  - term: connection
    from: kernel
    model: [online, goOffline, goOnline]

  - term: slow connection
    definition: >-
      A connection over which everything takes a noticeable moment to arrive,
      but nothing is lost.
    forms: [slow connections]

  - term: stalled network
    definition: >-
      A device's network stops carrying anything while the app still thinks
      it is online; it recovers later. Until then what the person writes waits
      on the device, and they see nothing new.
    forms:
      - stalled networks
      - network stalls
      - network has stalled
      - network recovers
    model: [networkStalls, networkRecovers]

  - term: hiccup
    definition: >-
      A save or a refresh that fails once on the way: an error, being asked
      to slow down, an answer cut off, garbled or lost, or a failure reported
      after the note was in fact kept. The app tries again on its own and the
      note counts once.
    forms: [hiccups]
    model: [writeThroughHiccup, refreshHiccup]

  - term: flaky connection
    definition: >-
      A connection that delays what it carries unevenly, so it arrives out of
      order. Nothing is lost; notes still reach everyone.
    model: [connectionFlaky]

  - term: app update
    definition: >-
      The app moving to another version, newer or older, including one that
      fetches every note again. The app keeps every note it had, including
      unsent ones, and stays in step with everyone.
    forms: [updates, updated, version, versions, earlier version]
    model: [appUpdates]

  - term: app data
    definition: >-
      What the app keeps on a device. If it is damaged or cleared, the app
      gets every note back from everyone else; unsent edits still show and
      are sent, and notices stay. An unsent edit that is itself damaged is
      refused, with a notice.
    model: [appDataDamaged, appDataCleared, unsentEditDamaged]

  - term: full device
    definition: >-
      A device with no room left to save. A note written on it is refused on
      the spot, and the person is told; nothing else changes.
    model: [writeWhileFull]

  - term: fails to open
    definition: >-
      The app does not open once; opened again, it has everything it had.
    model: [appFailsToOpen]

  - term: must update
    definition: >-
      The app is told it is too old to keep in step and must update first.
      Once updated it sends everything that waited on it.
    model: [appMustUpdate]

  - term: signed out elsewhere
    definition: >-
      The person's sign-in on a device is revoked from elsewhere, for example
      by signing out everywhere. The device forgets everything it kept for
      them, unsent edits and notices included, so nothing of theirs stays on
      it; once they sign in again it shows the shared notes.
    model: [signedOutElsewhere]

  - term: background
    definition: >-
      The app is in the background while the person uses something else. It
      catches up when it comes back to the front.
    model: [appBackgrounded]

  - term: sign-in expires
    definition: >-
      The person's sign-in runs out. The app signs in again on its own;
      nothing changes for the person.
    model: [signInExpires]

  - term: second window
    definition: >-
      Another window of the app open on the same device. It shares the
      device's notes; the person sees the same thing in both.
    model: [secondWindow]

  - term: wrong clock
    definition: >-
      A device whose clock runs hours or a day ahead or behind. It changes
      nothing about notes.
    model: [clockIsWrong]

  - term: live updates
    definition: >-
      How a note reaches other devices the moment it is written. Live updates
      can be lost, repeated, reordered, garbled, cut off, or stop for a while;
      notes still reach everyone, only later, and a note never shows without
      its text.
    model:
      - liveUpdatesDegrade
      - liveUpdatesGarbled
      - liveUpdatesPause
      - liveUpdateLost
      - liveCutOff
      - liveRestored

  - term: cannot send
    definition: >-
      A device that for a while can neither send nor refresh, though live
      updates still reach it. What the person writes meanwhile waits on the
      device and is sent once it can send again.
    model: [writeWhileSavesCut]

  - term: outage
    definition: >-
      For a while no device can reach anyone. Once it ends, every online
      device sends what waited on it; nothing anyone had is lost.
    model: [outage]

  - term: the team
    from: kernel
    model: [teamEdit, teamAddsNote, teamTidiesUp]
