# How quickly a note written on one device shows on the others: nearly every
# note (19 in 20) within a fifth of a second, even over slow connections.
# The same promise as "Notes arrive quickly", kept all the time.
apiVersion: openslo/v1
kind: SLI
metadata:
  name: note-arrival-time
  displayName: Time for a note to reach another device
spec:
  description: >-
    For each note a person writes, how long it takes, in thousandths of a
    second, from the moment they write it until it shows on another device
    of someone it is shared with.
  thresholdMetric:
    metricSource:
      type: product
      spec:
        measures: >-
          The time between a person writing a note on one device and that
          note showing on another device of someone in the same shared space.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-arrive-quickly
  displayName: Notes arrive quickly
spec:
  description: >-
    People never notice a wait for a note written on another device: nearly
    every note shows on the other devices within a fifth of a second.
  service: sync-engine
  indicatorRef: note-arrival-time
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: Nearly every note arrives within a fifth of a second
      op: lte
      value: 200
      target: 0.95
