# What the product is, and what must be proven automatically before a release
# of it is called product-equivalent and ready for production (the strategy in
# the rulebook beside this file, parts 11, 12, 18, 22, 23 and 25).
#
# The world is closed: every capability, contract, environment and release
# gate the product has is listed here, and every one listed must have an
# automated check that proves it. Something the product does that is missing
# here, or something listed here that nothing checks, fails the release.

product:
  # Every bounded context, one per folder beside this file.
  contexts:
    - auth
    - billing
    - feedback
    - chess
    - chess-board
    - developer-tools
    - db-indexes
    - friends
    - journeys
    - matchmaking
    - profile
    - room
    - runtime
    - spaces
    - statecharts
    - sync-engine

  # The kinds of person the product treats differently.
  tiers:
    - guest
    - free account
    - Plus member

  # Everything a person may or may not be allowed to do. Each is answered by
  # exactly one decision table, named by its decision.
  capabilities:
    - { id: delete their account, context: profile, decided by: privacy-access }
    - { id: take a personal-data export, context: profile, decided by: privacy-access }
    - { id: keep a friends list, context: friends, decided by: access }
    - { id: use people search, context: friends, decided by: access }
    - { id: get notifications, context: friends, decided by: access }
    - { id: see the billing plans, context: billing, decided by: access }
    - { id: subscribe, context: billing, decided by: access }
    - { id: use the billing portal, context: billing, decided by: access }
    - { id: wait for a match, context: matchmaking, decided by: access }
    - { id: see their matchmaking wait, context: matchmaking, decided by: access }
    - { id: stop waiting for a match, context: matchmaking, decided by: access }
    - { id: change their matchmaking range, context: matchmaking, decided by: access }
    - { id: watch multiplayer chess, context: chess, decided by: multiplayer-watch-access }
    - { id: play multiplayer chess, context: chess, decided by: access }
    - { id: start another multiplayer game, context: chess, decided by: unfinished-game-limit }
    - { id: resign multiplayer chess, context: chess, decided by: access }
    - { id: play puzzles, context: chess, decided by: access }
    - { id: customize the puzzle feed, context: chess, decided by: access }
    - { id: start a rated puzzle, context: chess, decided by: daily-puzzle-limit }
    - { id: add puzzles, context: chess, decided by: puzzle-management-access }
    - { id: create a Custom Game, context: chess, decided by: custom-game-access }
    - { id: configure a Custom Game, context: chess, decided by: custom-game-access }
    - { id: invite a Custom Game participant, context: chess, decided by: custom-game-access }
    - { id: configure a Custom Game bot, context: chess, decided by: custom-game-access }
    - { id: start a Custom Game, context: chess, decided by: custom-game-access }
    - { id: cancel a Custom Game, context: chess, decided by: custom-game-access }
    - { id: join a Custom Game, context: chess, decided by: custom-game-access }
    - { id: watch a Custom Game, context: chess, decided by: custom-game-access }
    - { id: play a Custom Game, context: chess, decided by: custom-game-access }
    - { id: create a space, context: spaces, decided by: access }
    - { id: join a space, context: spaces, decided by: access }
    - { id: host another open space, context: spaces, decided by: hosting-limit }
    - { id: leave the space, context: spaces, decided by: space-roles }
    - { id: rename a space, context: spaces, decided by: space-roles }
    - { id: end a space, context: spaces, decided by: space-roles }
    - { id: manage who is in the space, context: spaces, decided by: space-roles }
    - { id: make the game choice, context: spaces, decided by: space-roles }

  # Promises made to people outside the product that a rewrite must keep.
  public contracts:
    - id: reusable chessboard
      context: chess-board
      promise: >-
        An activity controls its chessboard position and settings; silence,
        interrupted gestures and motion remain correct when those change.
    - id: account privacy
      context: profile
      promise: >-
        A person can permanently delete their account and take a private
        copy of their personal data, with explicit retention and deadlines.
    - id: durable matchmaking outcomes
      context: matchmaking
      promise: >-
        Accepted waits keep their identity and outcome across devices and
        time away; a stale command never changes a newer wait.
    - id: private multiplayer games
      context: chess
      promise: >-
        A matchmaking match gives its two people one private multiplayer
        game, with the same lasting board, turns and result on their devices.
    - id: space links
      context: spaces
      promise: A space link keeps taking whoever opens it to that space.
    - id: app addresses
      context: runtime
      promise: >-
        Every address the app shows keeps working, and an address that leads
        nowhere says so and offers a way back.
    - id: older apps
      context: runtime
      promise: >-
        An app older than the one people are being served is told to update
        and keeps everything people saved on the device.
    - id: health report
      context: runtime
      promise: The team can always ask a live environment whether it is well.
    - id: test worlds and checkpoints
      context: developer-tools
      promise: >-
        The team can investigate named people's devices and restore a
        compatible checkpoint of a saved test world.
    - id: data notebooks
      context: developer-tools
      promise: >-
        The team can keep questions for a selected test world's device and
        see their answers or the reason a question failed.
    - id: automated test reports
      context: developer-tools
      promise: >-
        Every test report belongs to the edition its test run checked;
        recorded moments show captured evidence without inventing missing pictures.
    - id: release checks
      context: developer-tools
      promise: >-
        An edition passes only with a current automated pass for every
        required obligation; incomplete evidence fails the release check.

conformance:
  # Every kind of specification is required: each must have at least one
  # spec, and every spec of the kind must be checked against the product.
  behavior: required
  decisions: required
  dynamics: required
  structure: required
  objectives: required
  accessibility: required

# Where the product must behave as specified. Anywhere not listed is outside
# the product's promise, rather than untested.
environments:
  - id: a phone's web browser
    promise: >-
      The complete app on iOS phones in Safari, Chrome, Firefox and Edge,
      and Android phones in Chrome, Firefox, Edge and Samsung Internet.
      The current and previous major edition of each offered browser are supported.
  - id: a tablet's web browser
    promise: >-
      The complete app on iPadOS tablets in Safari, Chrome, Firefox and Edge,
      and Android tablets in Chrome, Firefox, Edge and Samsung Internet.
      The current and previous major edition of each offered browser are supported.
  - id: a computer's web browser
    promise: >-
      The complete app on Windows, macOS and Linux in Chrome, Firefox and
      Edge, and on macOS in Safari. The current and previous major edition
      of each offered browser are supported.
  - id: touch and pointer
    promise: Every capability is usable with touch on phones and tablets and with a pointer on computers.
  - id: portrait and landscape
    promise: >-
      People can turn their phone or tablet without losing progress or
      access to a control; computer windows can be narrowed or widened.
  - id: keyboard and listening
    promise: Every capability is usable with the keyboard alone and by listening to the app.
  - id: online
    promise: A device that can reach everyone else.
  - id: offline
    promise: A device that cannot, for as long as people keep using it.
  - id: an app one version behind
    promise: A device still running the previous version of the app.
  - id: English
    promise: The only language the app speaks.
  - id: UTC
    promise: >-
      The clock days and limits are counted by; the daily puzzle limit starts
      again at midnight UTC wherever a person is.

production readiness:
  manual testing allowed: false
  require:
    - specification validity
    - implementation conformance
    - permission enforcement
    - assembled system acceptance
    - accessibility conformance
    - production-safe synthetics
    - quality objectives
    - release engineering gates
    - completeness
  # Anything but a machine-evidenced pass is a failure.
  fail on:
    - manual
    - unknown
    - skipped
    - not run
    - missing evidence
    - stale evidence
    - missing automation

# Evidence a release needs that is about how this product is built, not what
# it does. The checks live outside this folder; each must exist and gate.
release gates:
  - dependency vulnerabilities
  - dependency consistency
  - leaked secrets
  - settings the app needs
  - release artifact limits
  - offline start
  - database evolution
  - infrastructure policy
  - workflow validity
  - type safety
  - lint
