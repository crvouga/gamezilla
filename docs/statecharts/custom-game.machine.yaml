  - specs/chess/custom-game-withdraw-readiness.feature
  - specs/chess/custom-game-control.qnt
  - specs/chess/custom-game-play.qnt
  - specs/chess/custom-game.qnt
  events: []
  context: chess
  eventKinds:
    A Custom Game clock expires: time
    A participant cancels before both people have moved: user
    A participant confirms readiness: user
    A participant leaves the space and resigns: user
    A participant loses connection: system
    A participant releases their own side before start: user
    A participant resigns the Custom Game: user
    A participant withdraws readiness: user
    A watcher creates a Custom Game: user
    Another person starts the game: user
    Another person tries releasing a participant’s side: user
    Assigns a permitted person or bot to a side: user
    Blocks a participant during the active game: user
    Both sides are filled and every person is ready for the current choices: system
