states:
  'Custom Game: Opening current Custom Game':
    id: 'Custom Game: Opening current Custom Game'
    meta:
      description: Opening observes the space's existing game, choices, moves and result. Navigation never creates a game or resets one already in progress.
      snapshot: Opening observes the space's existing game, choices, moves and result. Navigation never creates a game or resets one already in progress.
      confidence: assumed
      source:
      - specs/chess/custom-game-history.feature:5
      - specs/chess/custom-game-devices.feature:7
      - specs/chess/custom-game-devices.feature:24
      events: []
      checks: []
    'on':
      No unfinished Custom Game exists in the space:
        target: '#Custom Game: No unfinished Custom Game'
      Returns to a configuring Custom Game:
        target: '#Custom Game: Configuring'
      The current Custom Game choices are partly ready:
        target: '#Custom Game: Partly ready'
      The current Custom Game choices are fully ready:
        target: '#Custom Game: Ready to start'
      Returns to an active Custom Game:
        target: '#Custom Game: Playing'
      Returns to a finished Custom Game:
        target: '#Custom Game: Finished'
      The current Custom Game is cancelled:
        target: '#Custom Game: Cancelled'
      The host creates a Custom Game:
        target: '#Custom Game: Configuring'
      A watcher creates a Custom Game:
        target: '#Custom Game: Creator required'
      Creates another Custom Game before this one ends:
        target: '#Custom Game: Replacement refused'
  'Custom Game: No unfinished Custom Game':
    id: 'Custom Game: No unfinished Custom Game'
    meta:
      description: The host may create a Custom Game after the previous game finished or was cancelled.
      snapshot: The host may create a Custom Game after the previous game finished or was cancelled.
      confidence: assumed
      source:
      - specs/chess/custom-game-accessibility.feature:5
      - specs/chess/custom-game-accessibility.feature:19
      - specs/chess/custom-game-blocking.feature:5
      - specs/chess/custom-game-blocking.feature:28
      - specs/chess/custom-game-blocking.feature:45
      - specs/chess/custom-game-creation.feature:5
      - specs/chess/custom-game-creation.feature:20
      - specs/chess/custom-game-creation.feature:32
      - specs/chess/custom-game-play.feature:5
      - specs/chess/custom-game-play.feature:39
      - specs/chess/custom-game-play.feature:54
      - specs/chess/custom-game-play.feature:67
      - specs/chess/custom-game-play.feature:82
      - specs/chess/custom-game-privacy.feature:5
      - specs/chess/custom-game-privacy.feature:20
      - specs/chess/custom-game-privacy.feature:45
      events: []
      gherkin:
      - specs/chess/custom-game-accessibility.feature
      - specs/chess/custom-game-blocking.feature
      - specs/chess/custom-game-creation.feature
      - specs/chess/custom-game-play.feature
      - specs/chess/custom-game-privacy.feature
      checks:
      - The keyboard alone can choose a participant and start a ready game
      - Listening describes the sides, readiness and outcome
      - The creator cannot invite someone when either of them has blocked the other
      - Someone with a block between them and the creator cannot claim an open place in the creator's game
      - A block after the game has started does not end it
      - Only the host creates the space's Custom Game
      - Creating another game keeps an unfinished game
      - Every Custom Game starts with standard chess and is unrated
      - Only the participant to move plays legal moves
      - Bots play only their own turn and stop when the game ends
      - Checkmate ends the game immediately
      - A draw needs agreement or a drawn chess position
      - Finished moves can be reviewed without changing the result
      - Deleting the creator's account ends the space and cancels unfinished games
      - Deleting a participant releases a waiting side or resigns an active side
      - Personal-data exports include the person's retained Custom Games without another person's private data
    'on':
      Returns to a configuring Custom Game:
        target: '#Custom Game: Configuring'
      Returns to an active Custom Game:
        target: '#Custom Game: Playing'
      Returns to a finished Custom Game:
        target: '#Custom Game: Finished'
      The host creates a Custom Game:
        target: '#Custom Game: Configuring'
      A watcher creates a Custom Game:
        target: '#Custom Game: Creator required'
  'Custom Game: Custom Game connection required':
    id: 'Custom Game: Custom Game connection required'
    meta:
      description: Custom Game changes need a connection and cannot be queued to happen later on their own.
      snapshot: Custom Game changes need a connection and cannot be queued to happen later on their own.
      confidence: assumed
      source:
      - specs/chess/custom-game-connection.feature:5
      - specs/chess/custom-game-connection.feature:30
      - specs/chess/custom-game-connection.feature:48
      events: []
      gherkin:
      - specs/chess/custom-game-connection.feature
      checks:
      - Changes to a Custom Game need a connection and never happen later on their own
      - A returning person sees the current choices and outcome
      - Acknowledged choices survive closing the app
    'on':
      Connection returns to the current Custom Game choices:
        target: '#Custom Game: Configuring'
      Connection returns to partly ready Custom Game choices:
        target: '#Custom Game: Partly ready'
      Connection returns to fully ready Custom Game choices:
        target: '#Custom Game: Ready to start'
  'Custom Game: Creator required':
    id: 'Custom Game: Creator required'
    meta:
      description: Only the space’s host may create this Custom Game.
      snapshot: Only the space’s host may create this Custom Game.
      confidence: assumed
      source:
      - specs/chess/custom-game-access.feature:5
      - specs/chess/custom-game-access.feature:20
      - specs/chess/custom-game-access.feature:34
      - specs/chess/custom-game-devices.feature:5
      - specs/chess/custom-game-devices.feature:22
      events: []
      gherkin:
      - specs/chess/custom-game-access.feature
      - specs/chess/custom-game-devices.feature
      checks:
      - Everyone already in the space may watch the same Custom Game
      - Joining a space follows that space's rules before a side can be claimed
      - Paid access changes no Custom Game choice
      - The participating account controls the same side on each connected device
      - Reconnecting a device restores the current game without reviving its older board
    'on':
      Returns to Custom Game choices:
        target: '#Custom Game: No unfinished Custom Game'
  'Custom Game: Configuring':
    id: 'Custom Game: Configuring'
    meta:
      description: The creator chooses White, Black, people or bots and the clock; choices clear previous readiness.
      snapshot: The creator chooses White, Black, people or bots and the clock; choices clear previous readiness.
      confidence: assumed
      source:
      - specs/chess/custom-game-clock.feature:5
      - specs/chess/custom-game-clock.feature:24
      - specs/chess/custom-game-clock.feature:39
      - specs/chess/custom-game-clock.feature:53
      - specs/chess/custom-game-sides.feature:5
      - specs/chess/custom-game-sides.feature:17
      - specs/chess/custom-game-sides.feature:30
      - specs/chess/custom-game-sides.feature:46
      - specs/chess/custom-game-sides.feature:60
      - specs/chess/custom-game-withdraw-readiness.feature:5
      events: []
      gherkin:
      - specs/chess/custom-game-clock.feature
      - specs/chess/custom-game-sides.feature
      - specs/chess/custom-game-withdraw-readiness.feature
      checks:
      - A timed game uses whole minutes from one to one hundred eighty and an increment from zero to sixty seconds
      - Only the side to move spends time and a legal move adds its increment
      - Running out of time ends play even if a move arrives at that moment
      - The creator may choose an untimed game only before start
      - The creator changes participants only before start
      - One person controls at most one side
      - A creator may watch two other participants
      - Swapping sides requires people to become ready again
      - A closed side cannot be claimed
      - A person may withdraw readiness before start
    'on':
      Assigns a permitted person or bot to a side:
        target: '#Custom Game: Configuring'
      Changes the Custom Game clock:
        target: '#Custom Game: Configuring'
      Invites a permitted person to an open side:
        target: '#Custom Game: Invitation pending'
      Invites a person blocked by either side:
        target: '#Custom Game: Invitation refused'
      Takes a permitted open side:
        target: '#Custom Game: Configuring'
      Takes an open side with a block between the person and creator:
        target: '#Custom Game: Side choice refused'
      A participant releases their own side before start:
        target: '#Custom Game: Configuring'
      Another person tries releasing a participant’s side:
        target: '#Custom Game: Side choice refused'
      A participant confirms readiness:
        target: '#Custom Game: Partly ready'
      Starts with open places or unready participants:
        target: '#Custom Game: Start refused'
      The creator cancels the unstarted game:
        target: '#Custom Game: Cancelled'
      Chooses the same person for both sides:
        target: '#Custom Game: Side choice refused'
  'Custom Game: Invitation pending':
    id: 'Custom Game: Invitation pending'
    meta:
      description: The invited person chooses whether to take the offered side.
      snapshot: The invited person chooses whether to take the offered side.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      The invited person accepts a current invitation:
        target: '#Custom Game: Configuring'
      The invited person declines:
        target: '#Custom Game: Configuring'
      The creator revokes the invitation:
        target: '#Custom Game: Configuring'
      Someone tries an ended or another person’s invitation:
        target: '#Custom Game: Invitation refused'
  'Custom Game: Invitation refused':
    id: 'Custom Game: Invitation refused'
    meta:
      description: Only the current invited person may accept a live invitation for its open side.
      snapshot: Only the current invited person may accept a live invitation for its open side.
      confidence: assumed
      source:
      - specs/chess/custom-game-invitations.feature:5
      - specs/chess/custom-game-invitations.feature:18
      - specs/chess/custom-game-invitations.feature:39
      - specs/chess/custom-game-invitations.feature:55
      - specs/chess/custom-game-invitations.feature:68
      - specs/chess/custom-game-invitations.feature:82
      - specs/chess/custom-game-open-places.feature:5
      - specs/chess/custom-game-open-places.feature:19
      - specs/chess/custom-game-open-places.feature:31
      - specs/chess/custom-game-open-places.feature:56
      - specs/chess/custom-game-open-side.feature:5
      events: []
      gherkin:
      - specs/chess/custom-game-invitations.feature
      - specs/chess/custom-game-open-places.feature
      - specs/chess/custom-game-open-side.feature
      checks:
      - Only someone in the space can be invited
      - The invited person is shown the invitation and nobody outside the space is
      - Only the invited person accepts their current invitation
      - Declining releases the reserved side
      - Revoking an invitation removes its offer
      - Invitation races retain only one valid side relationship
      - An open place belongs to the first accepted claim
      - Releasing a side is the participant's own choice
      - After start no person may acquire or release a side
      - Competing claims cannot share an open place
      - Opening a side removes its earlier choice before start
    'on':
      Returns to Custom Game choices:
        target: '#Custom Game: Configuring'
  'Custom Game: Side choice refused':
    id: 'Custom Game: Side choice refused'
    meta:
      description: Side choices cannot duplicate a person or bypass the creator’s authority.
      snapshot: Side choices cannot duplicate a person or bypass the creator’s authority.
      confidence: assumed
      source:
      - specs/chess/custom-game-sides.feature:25
      - specs/chess/custom-game-open-places.feature:26
      - specs/chess/custom-game-sides.feature:67
      events: []
      gherkin:
      - specs/chess/custom-game-sides.feature
      - specs/chess/custom-game-open-places.feature
      checks: []
    'on':
      Corrects the Custom Game side choices:
        target: '#Custom Game: Configuring'
  'Custom Game: Partly ready':
    id: 'Custom Game: Partly ready'
    meta:
      description: Some participants agreed to the current choices; the remaining people must agree too.
      snapshot: Some participants agreed to the current choices; the remaining people must agree too.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Both sides are filled and every person is ready for the current choices:
        target: '#Custom Game: Ready to start'
      A participant withdraws readiness:
        target: '#Custom Game: Configuring'
      The creator changes the choices:
        target: '#Custom Game: Configuring'
      Changes Custom Game choices offline:
        target: '#Custom Game: Custom Game connection required'
      Starts before everyone is ready:
        target: '#Custom Game: Start refused'
  'Custom Game: Ready to start':
    id: 'Custom Game: Ready to start'
    meta:
      description: Both sides are filled and every person is ready for these choices.
      snapshot: Both sides are filled and every person is ready for these choices.
      confidence: assumed
      source:
      - specs/chess/custom-game-chess-rules.feature:5
      - specs/chess/custom-game-chess-rules.feature:20
      - specs/chess/custom-game-readiness.feature:5
      - specs/chess/custom-game-readiness.feature:19
      - specs/chess/custom-game-readiness.feature:35
      - specs/chess/custom-game-readiness.feature:62
      - specs/chess/custom-game-readiness.feature:79
      events: []
      gherkin:
      - specs/chess/custom-game-chess-rules.feature
      - specs/chess/custom-game-readiness.feature
      checks:
      - Promoting asks which piece and plays the piece chosen
      - Castling and en passant are legal moves, and castling through check is illegal
      - Every person confirms readiness for the current choices
      - Changing the choices clears each person's readiness
      - Only the creator starts a complete ready game
      - Starting again never restarts the same game
      - A start uses the choices the participants agreed to
    'on':
      The creator starts the agreed game:
        target: '#Custom Game: Playing'
      Another person starts the game:
        target: '#Custom Game: Start refused'
      A participant withdraws readiness:
        target: '#Custom Game: Partly ready'
      The creator changes the choices:
        target: '#Custom Game: Configuring'
  'Custom Game: Start refused':
    id: 'Custom Game: Start refused'
    meta:
      description: Starting explains the missing people, readiness, authority or changed choices and keeps the game
        intact.
      snapshot: Starting explains the missing people, readiness, authority or changed choices and keeps the game
        intact.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to Custom Game configuration:
        target: '#Custom Game: Configuring'
  'Custom Game: Playing':
    id: 'Custom Game: Playing'
    meta:
      description: The agreed Custom Game is active from the standard position with White first; it is unrated and
        the current participant controls the same side on their connected devices.
      snapshot: The agreed Custom Game is active from the standard position with White first; it is unrated and
        the current participant controls the same side on their connected devices.
      confidence: assumed
      source:
      - specs/chess/custom-game-identity.feature:5
      - specs/chess/custom-game-identity.feature:22
      - specs/chess/custom-game-position-draws.feature:5
      - specs/chess/custom-game-position-draws.feature:18
      - specs/chess/custom-game-position-draws.feature:31
      events: []
      gherkin:
      - specs/chess/custom-game-identity.feature
      - specs/chess/custom-game-position-draws.feature
      checks:
      - Signing in to the participating account restores its current side
      - Changing a username changes the person's name without changing their side
      - Stalemate completes the game as a draw
      - Insufficient mating material completes the game as a draw
      - Fifty moves by each side without a pawn move or capture complete the game as a draw
    'on':
      Plays a legal Custom Game move on their turn:
        target: '#Custom Game: Playing'
      Plays an illegal or wrong-turn Custom Game move:
        target: '#Custom Game: Move refused'
      Reaches Custom Game promotion:
        target: '#Custom Game: Choosing promotion'
      Offers a Custom Game draw:
        target: '#Custom Game: Draw offered'
      Offers a Custom Game draw against a bot:
        target: '#Custom Game: Draw unavailable'
      Custom Game checkmate occurs:
        target: '#Custom Game: Won result'
      A participant resigns the Custom Game:
        target: '#Custom Game: Finished'
      A participant resigns to a side unable to mate:
        target: '#Custom Game: Drawn result'
      A Custom Game clock expires:
        target: '#Custom Game: Finished'
      A Custom Game clock expires against a side unable to mate:
        target: '#Custom Game: Drawn result'
      Custom Game stalemate, insufficient material or automatic repetition occurs:
        target: '#Custom Game: Drawn result'
      Claims an available position draw:
        target: '#Custom Game: Drawn result'
      Claims a position draw before it is available:
        target: '#Custom Game: Move refused'
      Claims a win after the opponent was away for sixty seconds:
        target: '#Custom Game: Finished'
      Claims a win after sixty seconds without mating material:
        target: '#Custom Game: Drawn result'
      Claims a win after the opponent was away for only fifty-nine seconds:
        target: '#Custom Game: Away claim refused'
      Blocks a participant during the active game:
        target: '#Custom Game: Playing'
      The creator cancels the active Custom Game:
        target: '#Custom Game: Cancelled'
      A participant cancels before both people have moved:
        target: '#Custom Game: Cancelled'
      A participant leaves the space and resigns:
        target: '#Custom Game: Finished'
      A participant loses connection:
        target: '#Custom Game: Playing offline'
      Creates another Custom Game before this one ends:
        target: '#Custom Game: Replacement refused'
      Creates a rematch before this Custom Game ends:
        target: '#Custom Game: Replacement refused'
      Starts the already active Custom Game again:
        target: '#Custom Game: Playing'
      Tries acquiring or releasing a side after start:
        target: '#Custom Game: Playing'
      SignedIn:
        target: '#Custom Game: Playing'
      UsernameChanged:
        target: '#Custom Game: Playing'
  'Custom Game: Away claim refused':
    id: 'Custom Game: Away claim refused'
    meta:
      description: Only a participant may claim a win after the opponent has stayed away for at least sixty seconds;
        an earlier claim keeps the game active.
      snapshot: Only a participant may claim a win after the opponent has stayed away for at least sixty seconds;
        an earlier claim keeps the game active.
      confidence: assumed
      source:
      - specs/chess/custom-game-away.feature:5
      - specs/chess/custom-game-away.feature:21
      - specs/chess/custom-game-history.feature:5
      - specs/chess/custom-game-history.feature:19
      - specs/chess/custom-game-history.feature:33
      - specs/chess/custom-game-material.feature:5
      - specs/chess/custom-game-material.feature:20
      - specs/chess/custom-game-material.feature:33
      events: []
      gherkin:
      - specs/chess/custom-game-away.feature
      - specs/chess/custom-game-history.feature
      - specs/chess/custom-game-material.feature
      checks:
      - Being away never gives up a Custom Game on its own
      - After 60 seconds away, the other participant may claim the win
      - A new game and a rematch keep the earlier move list and result
      - A rematch inherits accepted people still in the space and bots
      - Reading an earlier game never grants control of the current game
      - Running out of time draws when the other side cannot mate with the remaining material
      - Resignation draws when the other side cannot mate with the remaining material
      - Claiming the win draws when the claimant cannot mate with the remaining material
    'on':
      Returns to the Custom Game board:
        target: '#Custom Game: Playing'
  'Custom Game: Move refused':
    id: 'Custom Game: Move refused'
    meta:
      description: A refused move does not advance the board, clock or turn.
      snapshot: A refused move does not advance the board, clock or turn.
      confidence: assumed
      source: *id001
      events: []
      checks: []
