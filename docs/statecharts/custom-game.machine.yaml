  'Custom Game: Choosing promotion':
    id: 'Custom Game: Choosing promotion'
    meta:
      description: The participant chooses Queen, Rook, Bishop or Knight for the promotion.
      snapshot: The participant chooses Queen, Rook, Bishop or Knight for the promotion.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Chooses the Custom Game promotion piece:
        target: '#Custom Game: Playing'
  'Custom Game: Draw offered':
    id: 'Custom Game: Draw offered'
    meta:
      description: Only the other participant may accept or decline the live draw offer. Play and clocks continue; a legal move clears it and an illegal move preserves it.
      snapshot: Only the other participant may accept or decline the live draw offer. Play and clocks continue; a legal move clears it and an illegal move preserves it.
      confidence: assumed
      source:
      - specs/chess/custom-game-draws.feature:5
      - specs/chess/custom-game-draws.feature:17
      - specs/chess/custom-game-draws.feature:32
      - specs/chess/custom-game-draws.feature:48
      - specs/chess/custom-game-draws.feature:63
      events: []
      gherkin:
      - specs/chess/custom-game-draws.feature
      checks:
