    Claims a win after the opponent was away for only fifty-nine seconds: user
    Claims a win after the opponent was away for sixty seconds: user
    Claims an available position draw: user
    Connection returns to a cancelled Custom Game: system
    Connection returns to a finished Custom Game: system
    Connection returns to an active Custom Game: system
    Connection returns to the current Custom Game choices: system
    Corrects the Custom Game side choices: user
    Creates a Custom Game rematch with swapped sides: user
    Creates a rematch before this Custom Game ends: user
    Creates another Custom Game before this one ends: user
    Custom Game checkmate occurs: system
    Custom Game stalemate, insufficient material or automatic repetition occurs: system
    Invites a permitted person to an open side: user
    Invites a person blocked by either side: user
    Offers a Custom Game draw: user
    Offers a Custom Game draw against a bot: user
    Offers the declined Custom Game draw again before moving: user
    The offering participant plays their next legal Custom Game move: user
    The other participant plays a legal Custom Game move after declining: user
    The offering participant tries declining their own Custom Game draw: user
    A Custom Game clock expires against a side unable to mate: time
    A participant resigns to a side unable to mate: user
    Claims a win after sixty seconds without mating material: user
    Plays a legal Custom Game move on their turn: user
    Plays an illegal or wrong-turn Custom Game move: user
    Reaches Custom Game promotion: user
    Returns to Custom Game choices: user
    Returns to Custom Game configuration: user
    Returns to a configuring Custom Game: user
    Returns to a finished Custom Game: user
    Returns to an active Custom Game: user
    Returns to the Custom Game board: user
    Returns to the Custom Game result: user
    Returns to the unfinished Custom Game: user
    Reviews the Custom Game’s moves: user
    SignedIn: system
    Someone tries an ended or another person’s invitation: user
    Starts a cancelled Custom Game: user
    Starts a finished Custom Game: user
    Starts before everyone is ready: user
    Starts the already active Custom Game again: user
    Starts with open places or unready participants: user
    Takes a permitted open side: user
    Takes an open side with a block between the person and creator: user
    The creator cancels the active Custom Game: user
    The creator cancels the unstarted game: user
    The creator changes the choices: user
    The creator revokes the invitation: user
    The creator starts the agreed game: user
