# Product behavior projection; authoritative rules remain in specs/.
id: inbox
initial: 'Inbox: Inbox'
meta:
  description: Inbox notices preserve an explicit choice and show when the underlying request has ended.
  snapshot: Inbox notices preserve an explicit choice and show when the underlying request has ended.
  confidence: assumed
  source: &id001
  - specs/README.md#context-map
  events: []
  context: friends
  eventKinds:
    Accepts the notice’s current request: user
    Archives the ended notice: user
    Archives the notice: user
    BecameFriends: system
    Declines the notice’s current request: user
    Dismisses the ended notice: user
    Dismisses the notice: user
    Filters notices: user
    Marks all notices read: user
    Opens a read notice: user
    Opens an ended request notice: user
    Opens an unread notice: user
    Opens the archive: user
    Reads the notice: user
    Returns to the inbox: user
    The inbox action fails: system
    The notice’s request ends: system
    Tries acting on the ended request: user
    Tries the inbox action again: user
states:
  'Inbox: Inbox':
    id: 'Inbox: Inbox'
    meta:
      routes:
      - '/notifications'
      description: The person sees their current inbox and available choices.
      snapshot: The person sees their current inbox and available choices.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Opens an unread notice:
        target: '#Inbox: Unread notice'
      Opens a read notice:
        target: '#Inbox: Read notice'
      Opens the archive:
        target: '#Inbox: Archive'
      Marks all notices read:
        target: '#Inbox: Inbox'
      Filters notices:
        target: '#Inbox: Inbox'
      Opens an ended request notice:
        target: '#Inbox: Ended request'
  'Inbox: Unread notice':
    id: 'Inbox: Unread notice'
    meta:
      description: This owned notice is unread and its current action is shown.
      snapshot: This owned notice is unread and its current action is shown.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Reads the notice:
        target: '#Inbox: Read notice'
      Accepts the notice’s current request:
        target: '#Inbox: Accepting an inbox request'
      Declines the notice’s current request:
        target: '#Inbox: Ended request'
      The notice’s request ends:
        target: '#Inbox: Ended request'
  'Inbox: Read notice':
    id: 'Inbox: Read notice'
    meta:
      description: Reading a notice does not invent an outcome for its request.
      snapshot: Reading a notice does not invent an outcome for its request.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Archives the notice:
        target: '#Inbox: Archive'
      Dismisses the notice:
        target: '#Inbox: Inbox'
      Accepts the notice’s current request:
        target: '#Inbox: Accepting an inbox request'
      The notice’s request ends:
        target: '#Inbox: Ended request'
  'Inbox: Accepting an inbox request':
    id: 'Inbox: Accepting an inbox request'
    meta:
      description: The current request is being accepted once for this person.
      snapshot: The current request is being accepted once for this person.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      BecameFriends:
        target: '#Inbox: Read notice'
      The inbox action fails:
        target: '#Inbox: Action failed'
      The notice’s request ends:
        target: '#Inbox: Ended request'
  'Inbox: Action failed':
    id: 'Inbox: Action failed'
    meta:
      description: The failed inbox action has an explanation without losing the notice.
      snapshot: The failed inbox action has an explanation without losing the notice.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Tries the inbox action again:
        target: '#Inbox: Accepting an inbox request'
  'Inbox: Ended request':
    id: 'Inbox: Ended request'
    meta:
      description: An ended or expired request cannot still be accepted.
      snapshot: An ended or expired request cannot still be accepted.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Dismisses the ended notice:
        target: '#Inbox: Inbox'
      Archives the ended notice:
        target: '#Inbox: Archive'
      Tries acting on the ended request:
        target: '#Inbox: Ended request'
  'Inbox: Archive':
    id: 'Inbox: Archive'
    meta:
      description: Archived notices keep their history and do not revive ended requests.
      snapshot: Archived notices keep their history and do not revive ended requests.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the inbox:
        target: '#Inbox: Inbox'
