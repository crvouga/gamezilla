# Product behavior projection; authoritative rules remain in specs/.
id: access
initial: 'Access: Access being confirmed'
meta:
  description: The signed-in account’s own access stays explicit across navigation and follows permission policy.
  snapshot: Paid access follows the current person across every place in the app and is decided by permission policy.
  confidence: assumed
  source: &id001
  - specs/billing/access.dmn
  - specs/system/access-sync.qnt
  - specs/system/membership-machine.qnt
  events: []
  context: billing
  eventKinds:
    PaidAccessStarted: system
    SignedIn: system
    PaidAccessEnded: system
    The current permission decision confirms free access: system
states:
  'Access: Free access':
    id: 'Access: Free access'
    meta:
      description: The current person has free limits; ordinary multiplayer and Custom Games are not governed by
        paid access.
      snapshot: The current person has free limits; ordinary multiplayer and Custom Games are not governed by paid
        access.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      PaidAccessStarted:
        target: '#Access: Paid access'
      SignedIn:
        target: '#Access: Access being confirmed'
  'Access: Paid access':
    id: 'Access: Paid access'
    meta:
      description: The current person’s confirmed paid access applies across their permitted features.
      snapshot: The current person’s confirmed paid access applies across their permitted features.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      PaidAccessEnded:
        target: '#Access: Free access'
      SignedIn:
        target: '#Access: Access being confirmed'
  'Access: Access being confirmed':
    id: 'Access: Access being confirmed'
    meta:
      description: The changed account’s own access is being confirmed; another person’s paid access cannot carry
        over.
      snapshot: The changed account’s own access is being confirmed; another person’s paid access cannot carry over.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      PaidAccessStarted:
        target: '#Access: Paid access'
      The current permission decision confirms free access:
        target: '#Access: Free access'
      PaidAccessEnded:
        target: '#Access: Free access'
      SignedIn:
        target: '#Access: Access being confirmed'
