# Product behavior projection; authoritative rules remain in specs/.
id: notebook
initial: 'Notebook: Notebook'
meta:
  description: Each selected device keeps its notebook questions and their answers.
  snapshot: Each selected device keeps its notebook questions and their answers.
  confidence: assumed
  source: &id001
  - specs/developer-tools/data-notebook.feature
  events: []
  context: developer-tools
  eventKinds:
    Adds a notebook question: user
    Duplicates a notebook question: user
    Removes a question while another remains: user
    Removes the last notebook question: user
    Returns to the notebook: user
    Runs a notebook question: user
    Runs the copied notebook question: user
    Runs the failed notebook question again: user
    Selects another device’s notebook: user
    The notebook answer fails: system
    The notebook answer succeeds: system
states:
  'Notebook: Notebook':
    id: 'Notebook: Notebook'
    meta:
      routes:
      - '/client/sql'
      description: The selected device’s saved questions remain separate from another device’s notebook.
      snapshot: The selected device’s saved questions remain separate from another device’s notebook.
      confidence: assumed
      source:
      - specs/developer-tools/data-notebook.feature:6
      - specs/developer-tools/data-notebook.feature:22
      - specs/developer-tools/data-notebook.feature:34
      - specs/developer-tools/data-notebook.feature:46
      events: []
      gherkin:
      - specs/developer-tools/data-notebook.feature
      checks:
      - Each selected device keeps its own data notebook
      - A duplicated question sits beside its original without answering automatically
      - A data notebook always keeps at least one question
      - Asking a question shows its answer or why it failed
    'on':
      Adds a notebook question:
        target: '#Notebook: Notebook'
      Duplicates a notebook question:
        target: '#Notebook: Copied question'
      Removes a question while another remains:
        target: '#Notebook: Notebook'
      Removes the last notebook question:
        target: '#Notebook: Last question retained'
      Runs a notebook question:
        target: '#Notebook: Answering a question'
      Selects another device’s notebook:
        target: '#Notebook: Notebook'
  'Notebook: Copied question':
    id: 'Notebook: Copied question'
    meta:
      description: The separate copy sits immediately after its original and waits to be answered.
      snapshot: The separate copy sits immediately after its original and waits to be answered.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Runs the copied notebook question:
        target: '#Notebook: Answering a question'
      Returns to the notebook:
        target: '#Notebook: Notebook'
  'Notebook: Last question retained':
    id: 'Notebook: Last question retained'
    meta:
      description: A notebook keeps at least one question, so its final question cannot be removed.
      snapshot: A notebook keeps at least one question, so its final question cannot be removed.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the notebook:
        target: '#Notebook: Notebook'
  'Notebook: Answering a question':
    id: 'Notebook: Answering a question'
    meta:
      description: The selected notebook question is being answered.
      snapshot: The selected notebook question is being answered.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      The notebook answer succeeds:
        target: '#Notebook: Answer available'
      The notebook answer fails:
        target: '#Notebook: Answer failed'
  'Notebook: Answer available':
    id: 'Notebook: Answer available'
    meta:
      description: The answer belongs to its question on this device’s notebook.
      snapshot: The answer belongs to its question on this device’s notebook.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the notebook:
        target: '#Notebook: Notebook'
  'Notebook: Answer failed':
    id: 'Notebook: Answer failed'
    meta:
      description: The failed answer explains why without losing the supplied question.
      snapshot: The failed answer explains why without losing the supplied question.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Runs the failed notebook question again:
        target: '#Notebook: Answering a question'
