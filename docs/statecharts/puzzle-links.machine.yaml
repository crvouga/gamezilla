# Product behavior projection; authoritative rules remain in specs/.
id: puzzle-links
initial: 'Puzzle Links: Opening a puzzle link'
meta:
  description: A shared puzzle link opens that puzzle with the permitted rated or practice behavior.
  snapshot: A shared puzzle link opens that puzzle with the permitted rated or practice behavior.
  confidence: assumed
  source: &id001
  - specs/chess/puzzle-link.feature
  - specs/chess/puzzle-link.qnt
  events: []
  context: chess
  eventKinds:
    Closes puzzle link sharing: user
    Connection returns: system
    Opens a puzzle link offline: user
    Plays the linked puzzle: user
    Practices the linked puzzle: user
    Returns from an unavailable puzzle link: user
    Shares this puzzle’s link: user
    SignedIn: system
    The linked puzzle is no longer available: system
    The linked puzzle is unplayed and today’s guest allowance is used: system
    The linked puzzle opens as rated: system
    The linked puzzle opens for practice: system
    The next UTC day starts: time
states:
  'Puzzle Links: Opening a puzzle link':
    id: 'Puzzle Links: Opening a puzzle link'
    meta:
      routes:
      - '/chess/puzzle/:puzzleId'
      description: The link identifies one puzzle and the current allowance determines how it opens.
      snapshot: The link identifies one puzzle and the current allowance determines how it opens.
      confidence: assumed
      source:
      - specs/chess/puzzle-link.feature:6
      - specs/chess/puzzle-link.feature:27
      - specs/chess/puzzle-link.feature:49
      - specs/chess/puzzle-link.feature:59
      events: []
      gherkin:
      - specs/chess/puzzle-link.feature
      checks:
      - A solver can share a puzzle link to the puzzle on their board, finished or not
      - Opening a puzzle link puts that exact puzzle on the board, rated only if it is the person's first attempt
      - A retired puzzle's link no longer opens it
      - A guest opening a puzzle link uses one puzzle start, and past the daily puzzle limit is asked to sign in
    'on':
      The linked puzzle opens as rated:
        target: '#Puzzle Links: Rated linked puzzle'
      The linked puzzle opens for practice:
        target: '#Puzzle Links: Practice linked puzzle'
      The linked puzzle is unplayed and today’s guest allowance is used:
        target: '#Puzzle Links: Linked puzzle allowance reached'
      Opens a puzzle link offline:
        target: '#Puzzle Links: Link needs connection'
      The linked puzzle is no longer available:
        target: '#Puzzle Links: Puzzle link unavailable'
  'Puzzle Links: Rated linked puzzle':
    id: 'Puzzle Links: Rated linked puzzle'
    meta:
      description: This linked puzzle counts under the person’s rated allowance.
      snapshot: This linked puzzle counts under the person’s rated allowance.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Plays the linked puzzle:
        target: '#Puzzles: Solving'
      Shares this puzzle’s link:
        target: '#Puzzle Links: Sharing a puzzle link'
  'Puzzle Links: Practice linked puzzle':
    id: 'Puzzle Links: Practice linked puzzle'
    meta:
      description: This linked puzzle is practice and does not consume another rated start.
      snapshot: This linked puzzle is practice and does not consume another rated start.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Practices the linked puzzle:
        target: '#Puzzles: Solving'
      Shares this puzzle’s link:
        target: '#Puzzle Links: Sharing a puzzle link'
  'Puzzle Links: Sharing a puzzle link':
    id: 'Puzzle Links: Sharing a puzzle link'
    meta:
      description: The shareable link identifies this puzzle rather than the next puzzle in a feed.
      snapshot: The shareable link identifies this puzzle rather than the next puzzle in a feed.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Closes puzzle link sharing:
        target: '#Puzzle Links: Opening a puzzle link'
  'Puzzle Links: Linked puzzle allowance reached':
    id: 'Puzzle Links: Linked puzzle allowance reached'
    meta:
      description: An unseen linked puzzle cannot start after the guest used twenty rated starts today.
      snapshot: An unseen linked puzzle cannot start after the guest used twenty rated starts today.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      SignedIn:
        target: '#Puzzle Links: Opening a puzzle link'
      The next UTC day starts:
        target: '#Puzzle Links: Opening a puzzle link'
  'Puzzle Links: Link needs connection':
    id: 'Puzzle Links: Link needs connection'
    meta:
      description: The link cannot load an unseen puzzle while offline.
      snapshot: The link cannot load an unseen puzzle while offline.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Connection returns:
        target: '#Puzzle Links: Opening a puzzle link'
  'Puzzle Links: Puzzle link unavailable':
    id: 'Puzzle Links: Puzzle link unavailable'
    meta:
      description: A removed puzzle cannot be revived through its old link.
      snapshot: A removed puzzle cannot be revived through its old link.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns from an unavailable puzzle link:
        target: '#App: Games'
