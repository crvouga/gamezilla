  snapshot: 'Explore the whole product from one chart: the current person and this device’s place change together.'
  confidence: assumed
  source: &id001
  - specs/README.md#context-map
  - specs/journeys/ubiquitous-language.yml
  - specs/system/whole-system.qnt
  - specs/system/product-state.qnt
  - specs/conformance.yaml
  - specs/journeys/critical-journeys.feature
  - specs/journeys/custom-game.feature
  - specs/journeys/join-and-offline.feature
  - specs/journeys/multiplayer-game.feature
  - specs/system/adversarial-examples.qnt
  - specs/system/boundary-assumptions.qnt
  - specs/system/client-image.qnt
  - specs/system/community.qnt
  - specs/system/fair-recovery.qnt
  - specs/system/identity-machine.qnt
  - specs/system/identity.qnt
  - specs/system/membership.qnt
  - specs/system/multiplayer.qnt
  - specs/system/notification-machine.qnt
  - specs/system/notifications.qnt
  - specs/system/offline-replication.qnt
  - specs/system/play.qnt
  - specs/system/privacy-lifecycle.qnt
  - specs/system/privacy.qnt
  - specs/system/public-profile.qnt
  - specs/system/puzzle-board.qnt
  - specs/system/recovery.qnt
  - specs/system/replication.qnt
  - specs/system/system-actions.qnt
  - specs/system/universe.qnt
