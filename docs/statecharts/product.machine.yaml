  context: system
  projection: Published facts refer to the current person, viewed space or selected relationship. Actor, ownership,
    clocks and durable data remain governed by the referenced specifications; navigation does not reset them.
states:
  Gamezilla:
    id: Gamezilla
    type: parallel
    meta:
      description: The person keeps their identity and current access while this device moves through the app.
      snapshot: The person keeps their identity and current access while this device moves through the app.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    states:
      Current person:
        id: Current person
        meta:
          description: The guest or deleted account has no paid access; a signed-in account carries its own independently
            confirmed access.
          snapshot: The guest or deleted account has no paid access; a signed-in account carries its own independently
            confirmed access.
          confidence: assumed
          source:
          - specs/journeys/critical-journeys.feature:8
          - specs/journeys/custom-game.feature:5
          - specs/journeys/custom-game.feature:30
          - specs/journeys/join-and-offline.feature:7
          - specs/journeys/join-and-offline.feature:19
          - specs/journeys/multiplayer-game.feature:6
          events: []
          gherkin:
          - specs/journeys/critical-journeys.feature
          - specs/journeys/custom-game.feature
          - specs/journeys/join-and-offline.feature
          - specs/journeys/multiplayer-game.feature
          checks:
          - The app's critical journeys reach their promised outcomes
          - A guest can choose a bot, play and finish the same Custom Game
          - Two people in one space can agree on sides, play and finish the same Custom Game
          - Anyone with a space link can join that open space
          - After the app has been opened once, it opens with no connection
          - Finding an opponent leads into the matched multiplayer game
        invoke:
          src: identity
          id: identity
      This device:
        id: This device
        meta:
          description: Only this device’s place changes when it navigates.
          snapshot: Only this device’s place changes when it navigates.
          confidence: assumed
          source: *id001
          events: []
          checks: []
        invoke:
          src: app
          id: app
