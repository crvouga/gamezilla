# Product behavior projection; authoritative rules remain in specs/.
id: sign-in
initial: 'Sign In: Choosing a method'
meta:
  description: Google and Apple identify the person; account matching always preserves the person’s choice.
  snapshot: Google and Apple identify the person; account matching always preserves the person’s choice.
  confidence: assumed
  source: &id001
  - specs/auth/at-google-and-apple.feature
  - specs/auth/matching-accounts.feature
  - specs/auth/provider-trouble.feature
  - specs/auth/sign-in-ends.feature
  - specs/auth/sign-in-methods.feature
  - specs/auth/sign-in.feature
  - specs/auth/stolen-sign-ins.feature
  - specs/profile/apple-sign-in.feature
  - specs/profile/finish-signing-in.feature
  - specs/profile/offline-sign-in.feature
  - specs/profile/sign-in-abandoned.feature
  - specs/auth/outside-accounts.qnt
  - specs/auth/private-apple-email.qnt
  events: []
  context: auth
  eventKinds:
    An invalid or stolen sign-in is refused: system
    Cancels signing in: user
    Chooses Apple where available online: user
    Chooses Google online: user
    Chooses a sign-in method offline: user
    Chooses an unavailable sign-in method: user
    Chooses another sign-in method: user
    Connection returns: system
    Keeps the accounts separate: user
    Proves a different account: user
    Proves the matching account: user
    Provider finds a match needing account proof: system
    Provider proves a new address with no match: system
    Provider proves a verified non-relay address match: system
    Provider proves an existing account: system
    Provider sign-in fails: system
    Provider sign-in is abandoned: system
    Returns to billing after signing in: user
    Returns to the profile after cancelling: user
    Returns to the puzzle after signing in: user
    Returns to their profile after signing in: user
    SignedIn: system
    Starts signing in again: user
    The ten-minute matching chance expires: time
    Tries provider sign-in again: user
    Tries proving the matching account again: user
states:
  'Sign In: Choosing a method':
    id: 'Sign In: Choosing a method'
    meta:
      description: Available sign-in methods are offered with the current profile preserved.
      snapshot: Available sign-in methods are offered with the current profile preserved.
      confidence: assumed
      source:
      - specs/auth/sign-in-ends.feature:8
      - specs/auth/sign-in-ends.feature:21
      - specs/auth/sign-in-methods.feature:7
      - specs/auth/sign-in-methods.feature:28
      - specs/auth/sign-in-methods.feature:44
      - specs/profile/offline-sign-in.feature:7
      events: []
      gherkin:
      - specs/auth/sign-in-ends.feature
      - specs/auth/sign-in-methods.feature
      - specs/profile/offline-sign-in.feature
      checks:
      - A sign-in lapses 30 days after it starts
      - Signing out everywhere signs out every device of one's own account, and only those
      - A sign-in method connects only when it is the account's first from that provider and no other account uses
        it
      - Connecting a sign-in method needs a connection
      - A removed sign-in method no longer gets into the account, and the last one cannot be removed
      - Signing out works offline and signing in works once the connection is back
    'on':
      Chooses Google online:
        target: '#Sign In: At Google or Apple'
      Chooses Apple where available online:
        target: '#Sign In: At Google or Apple'
      Chooses a sign-in method offline:
        target: '#Sign In: Connection required'
      Chooses an unavailable sign-in method:
        target: '#Sign In: Method unavailable'
      Cancels signing in:
        target: '#Sign In: Sign-in abandoned'
  'Sign In: At Google or Apple':
    id: 'Sign In: At Google or Apple'
    meta:
      description: The chosen provider is identifying the person.
      snapshot: The chosen provider is identifying the person.
      confidence: assumed
      source:
      - specs/auth/at-google-and-apple.feature:7
      - specs/auth/at-google-and-apple.feature:26
      - specs/auth/at-google-and-apple.feature:44
      - specs/auth/at-google-and-apple.feature:52
      - specs/auth/at-google-and-apple.feature:62
      - specs/auth/provider-trouble.feature:7
      - specs/auth/provider-trouble.feature:26
      - specs/profile/apple-sign-in.feature:7
      events: []
      gherkin:
      - specs/auth/at-google-and-apple.feature
      - specs/auth/provider-trouble.feature
      - specs/profile/apple-sign-in.feature
      checks:
      - Signing in with Apple works only while the Apple account exists and its holder lets the app use it
      - Stopping using Sign in with Apple signs the account out everywhere, but not for good
      - Deleting the only sign-in method of an account at Apple signs it out everywhere
      - A changed Google email address keeps the account
      - A hidden email address shows as a private Apple email address, with whether Apple forwards mail from it
      - While a provider is having trouble, signing in with it fails plainly and changes nothing
      - Once a provider recovers, signing in with it works again
      - Apple signs a person into the account their outside account belongs to
    'on':
      Provider proves an existing account:
        target: '#Sign In: Sign-in completed'
      Provider proves a new address with no match:
        target: '#Sign In: Sign-in completed'
      Provider proves a verified non-relay address match:
        target: '#Sign In: Sign-in completed'
      Provider finds a match needing account proof:
        target: '#Sign In: Confirming an account match'
      Provider sign-in fails:
        target: '#Sign In: Provider failed'
      Provider sign-in is abandoned:
        target: '#Sign In: Sign-in abandoned'
      An invalid or stolen sign-in is refused:
        target: '#Sign In: Sign-in refused'
  'Sign In: Confirming an account match':
    id: 'Sign In: Confirming an account match'
    meta:
      description: The person may prove the matching account or keep the accounts separate.
      snapshot: The person may prove the matching account or keep the accounts separate.
      confidence: assumed
      source:
      - specs/auth/matching-accounts.feature:8
      - specs/auth/matching-accounts.feature:22
      - specs/auth/matching-accounts.feature:37
      - specs/auth/matching-accounts.feature:45
      events: []
      gherkin:
      - specs/auth/matching-accounts.feature
      checks:
      - A new outside account becomes a sign-in method of a matching account at once only when both email addresses
        are verified
      - Only an outside account of the matching account confirms it
      - A person asked to confirm a matching account may keep the accounts separate instead
      - The chance to confirm a matching account lapses after 10 minutes
    'on':
      Proves the matching account:
        target: '#Sign In: Sign-in completed'
      Keeps the accounts separate:
        target: '#Sign In: Sign-in completed'
      Proves a different account:
        target: '#Sign In: Account proof refused'
      The ten-minute matching chance expires:
        target: '#Sign In: Match expired'
  'Sign In: Account proof refused':
    id: 'Sign In: Account proof refused'
    meta:
      description: The proof belongs to another account; the accounts remain separate.
      snapshot: The proof belongs to another account; the accounts remain separate.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Tries proving the matching account again:
        target: '#Sign In: Confirming an account match'
      Cancels signing in:
        target: '#Sign In: Sign-in abandoned'
  'Sign In: Match expired':
    id: 'Sign In: Match expired'
    meta:
      description: The chance to confirm this match has expired.
      snapshot: The chance to confirm this match has expired.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Starts signing in again:
        target: '#Sign In: Choosing a method'
  'Sign In: Provider failed':
    id: 'Sign In: Provider failed'
    meta:
      description: Signing in failed plainly and left the previous profile intact.
      snapshot: Signing in failed plainly and left the previous profile intact.
      confidence: assumed
      source:
      - specs/auth/sign-in.feature:6
      - specs/profile/finish-signing-in.feature:7
      events: []
      gherkin:
      - specs/auth/sign-in.feature
      - specs/profile/finish-signing-in.feature
      checks:
      - Signing in with Google lands the person back in the app they started from
      - A device shows a person signed in only once it shows their account
    'on':
      Tries provider sign-in again:
        target: '#Sign In: At Google or Apple'
      Cancels signing in:
        target: '#Sign In: Sign-in abandoned'
  'Sign In: Sign-in refused':
    id: 'Sign In: Sign-in refused'
    meta:
      description: Invalid or stolen proof gives no access to another person’s account.
      snapshot: Invalid or stolen proof gives no access to another person’s account.
      confidence: assumed
      source:
      - specs/auth/stolen-sign-ins.feature:10
      events: []
      gherkin:
      - specs/auth/stolen-sign-ins.feature
      checks:
      - A stolen sign-in gets into the account until the sign-in it was stolen from is over
    'on':
      Starts signing in again:
        target: '#Sign In: Choosing a method'
  'Sign In: Connection required':
    id: 'Sign In: Connection required'
    meta:
      description: Signing in needs a connection and leaves the current profile intact.
      snapshot: Signing in needs a connection and leaves the current profile intact.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Connection returns:
        target: '#Sign In: Choosing a method'
  'Sign In: Method unavailable':
    id: 'Sign In: Method unavailable'
    meta:
      description: The unavailable method cannot be chosen in this environment.
      snapshot: The unavailable method cannot be chosen in this environment.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Chooses another sign-in method:
        target: '#Sign In: Choosing a method'
  'Sign In: Sign-in completed':
    id: 'Sign In: Sign-in completed'
    meta:
      description: The proven account is ready and preserves the applicable profile.
      snapshot: The proven account is ready and preserves the applicable profile.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      SignedIn:
        target: '#Sign In: Sign-in completed'
      Returns to their profile after signing in:
        target: '#App: Profile'
      Returns to the puzzle after signing in:
        target: '#App: Puzzles'
      Returns to billing after signing in:
        target: '#App: Billing'
  'Sign In: Sign-in abandoned':
    id: 'Sign In: Sign-in abandoned'
    meta:
      description: The person keeps the profile they had before signing in.
      snapshot: The person keeps the profile they had before signing in.
      confidence: assumed
      source:
      - specs/profile/sign-in-abandoned.feature:7
      events: []
      gherkin:
      - specs/profile/sign-in-abandoned.feature
      checks:
      - Abandoning signing in keeps the guest's profile and permits signing in later
    'on':
      Returns to the profile after cancelling:
        target: '#App: Profile'
      Starts signing in again:
        target: '#Sign In: Choosing a method'
