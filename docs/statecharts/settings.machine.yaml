# Product behavior projection; authoritative rules remain in specs/.
id: settings
initial: 'Settings: Settings home'
meta:
  description: Device preferences survive closing the app; account and product choices remain reachable from Settings.
  snapshot: Device preferences survive closing the app; account and product choices remain reachable from Settings.
  confidence: assumed
  source: &id001
  - specs/runtime/accessibility.feature
  - specs/runtime/device-layouts.feature
  - specs/runtime/settings.feature
  events: []
  context: runtime
  eventKinds:
    Changes the sound preference: user
    Chooses a permitted theme: user
    Opens About: user
    Opens account privacy: user
    Opens appearance preferences: user
    Opens billing plans: user
    Opens connected sign-in methods: user
    Opens puzzle import: user
    Opens sound preferences: user
    Returns to Settings: user
states:
  'Settings: Settings home':
    id: 'Settings: Settings home'
    meta:
      routes:
      - '/more'
      description: Settings offers preferences, About and permitted account and product choices.
      snapshot: Settings offers preferences, About and permitted account and product choices.
      confidence: assumed
      source:
      - specs/runtime/accessibility.feature:7
      - specs/runtime/accessibility.feature:21
      - specs/runtime/accessibility.feature:29
      - specs/runtime/accessibility.feature:43
      - specs/runtime/settings.feature:7
      events: []
      gherkin:
      - specs/runtime/accessibility.feature
      - specs/runtime/settings.feature
      checks:
      - Every control says what it does to someone listening to the app
      - A picture that means something is described to someone listening to the app
      - Everything a person can do in the app, they can do with the keyboard alone
      - Settings takes the keyboard when it opens and gives it back where it was when the person comes back
      - Preferences stay on the device after the app closes and About shows the version of the app
    'on':
      Opens appearance preferences:
        target: '#Settings: Appearance'
      Opens sound preferences:
        target: '#Settings: Sounds'
      Opens About:
        target: '#Settings: About'
      Opens account privacy:
        target: '#App: Privacy'
      Opens billing plans:
        target: '#App: Billing'
      Opens connected sign-in methods:
        target: '#App: Sign-in methods'
      Opens puzzle import:
        target: '#App: Puzzle import'
  'Settings: Appearance':
    id: 'Settings: Appearance'
    meta:
      routes:
      - '/more/theme'
      description: Theme choices apply on this device and survive closing the app.
      snapshot: Theme choices apply on this device and survive closing the app.
      confidence: assumed
      source:
      - specs/runtime/device-layouts.feature:6
      events: []
      gherkin:
      - specs/runtime/device-layouts.feature
      checks:
      - Changing the available space keeps the person's place and work
    'on':
      Chooses a permitted theme:
        target: '#Settings: Appearance'
      Returns to Settings:
        target: '#Settings: Settings home'
  'Settings: Sounds':
    id: 'Settings: Sounds'
    meta:
      routes:
      - '/more/sound'
      description: Sound choices apply on this device and survive closing the app.
      snapshot: Sound choices apply on this device and survive closing the app.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Changes the sound preference:
        target: '#Settings: Sounds'
      Returns to Settings:
        target: '#Settings: Settings home'
  'Settings: About':
    id: 'Settings: About'
    meta:
      routes:
      - '/more/about'
      description: About identifies the version of the app on this device.
      snapshot: About identifies the version of the app on this device.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to Settings:
        target: '#Settings: Settings home'
