# Product behavior projection; authoritative rules remain in specs/.
id: puzzle-history
initial: 'Puzzle History: Puzzle results'
meta:
  description: Puzzle history and statistics show the person’s recorded attempts and skill without changing earlier
    outcomes.
  snapshot: Puzzle history and statistics show the person’s recorded attempts and skill without changing earlier
    outcomes.
  confidence: assumed
  source: &id001
  - specs/chess/deleted-account-progress.feature
  - specs/chess/puzzle-rating.feature
  - specs/chess/puzzle-stats-summary.feature
  - specs/chess/puzzle-stats.feature
  - specs/chess/puzzle-review.feature
  events: []
  context: chess
  eventKinds:
    A completed attempt is recorded: system
    AccountDeletionConfirmed: system
    Moves through the recorded attempt: user
    Opens a recorded puzzle attempt: user
    Opens the app as a new guest: user
    Returns to puzzle play: user
    Returns to puzzle results: user
    The person has no recorded attempts: system
states:
  'Puzzle History: Puzzle results':
    id: 'Puzzle History: Puzzle results'
    meta:
      description: The person sees their own puzzle statistics, recorded outcomes and current rating.
      snapshot: The person sees their own puzzle statistics, recorded outcomes and current rating.
      confidence: assumed
      source:
      - specs/chess/puzzle-rating.feature:7
      - specs/chess/puzzle-rating.feature:49
      - specs/chess/puzzle-rating.feature:69
      - specs/chess/puzzle-rating.feature:80
      - specs/chess/puzzle-rating.feature:109
      - specs/chess/puzzle-stats-summary.feature:8
      - specs/chess/puzzle-stats.feature:11
      events: []
      gherkin:
      - specs/chess/puzzle-rating.feature
      - specs/chess/puzzle-stats-summary.feature
      - specs/chess/puzzle-stats.feature
      checks:
      - The first rated attempt moves the puzzle rating once and every device shows that rating
      - Solving a harder puzzle gains more than solving an easier one, and failing an easier puzzle costs more than
        failing a harder one
      - A provisional rating moves further for each puzzle than a settled one
      - The puzzle rating never goes below the rating floor of 400 or above the rating ceiling of 3000
      - 'A solve after a hint earns half credit: the same as a wrong move, and less than a clean solve'
      - Stats show the rating, the puzzles played and solved, and the accuracy
      - Every puzzle in the game log shows its outcome, the puzzle's own rating and its rating change, or that it
        was unrated
    'on':
      Opens a recorded puzzle attempt:
        target: '#Puzzle History: Reviewing an attempt'
      A completed attempt is recorded:
        target: '#Puzzle History: Puzzle results'
      The person has no recorded attempts:
        target: '#Puzzle History: No attempts yet'
      AccountDeletionConfirmed:
        target: '#Puzzle History: Erased progress'
  'Puzzle History: Reviewing an attempt':
    id: 'Puzzle History: Reviewing an attempt'
    meta:
      description: A recorded attempt keeps its original result while its reached positions are reviewed.
      snapshot: A recorded attempt keeps its original result while its reached positions are reviewed.
      confidence: assumed
      source:
      - specs/chess/puzzle-review.feature:20
      - specs/chess/puzzle-review.feature:66
      - specs/chess/puzzle-review.feature:76
      - specs/chess/puzzle-stats.feature:11
      events: []
      checks: []
    'on':
      Moves through the recorded attempt:
        target: '#Puzzle History: Reviewing an attempt'
      Returns to puzzle results:
        target: '#Puzzle History: Puzzle results'
      AccountDeletionConfirmed:
        target: '#Puzzle History: Erased progress'
  'Puzzle History: No attempts yet':
    id: 'Puzzle History: No attempts yet'
    meta:
      description: A new person has the documented starting rating and no invented attempts.
      snapshot: A new person has the documented starting rating and no invented attempts.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to puzzle play:
        target: '#App: Puzzles'
      AccountDeletionConfirmed:
        target: '#Puzzle History: Erased progress'
  'Puzzle History: Erased progress':
    id: 'Puzzle History: Erased progress'
    meta:
      description: Deleted account progress cannot reappear after returning to the app.
      snapshot: Deleted account progress cannot reappear after returning to the app.
      confidence: assumed
      source:
      - specs/chess/deleted-account-progress.feature:7
      - specs/chess/deleted-account-progress.feature:24
      events: []
      gherkin:
      - specs/chess/deleted-account-progress.feature
      checks:
      - Account deletion erases the puzzle rating, game log, stats and saved feed choices on every device
      - Deleted progress never belongs to a later account and never comes back
    'on':
      Opens the app as a new guest:
        target: '#App: Spaces'
