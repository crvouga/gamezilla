# Product behavior projection; authoritative rules remain in specs/.
id: release
initial: 'Release: Release evidence'
meta:
  description: Release decisions require a current automated pass for every obligation of the same edition.
  snapshot: Release decisions require a current automated pass for every obligation of the same edition.
  confidence: assumed
  source: &id001
  - specs/developer-tools/release-check.feature
  events: []
  context: developer-tools
  eventKinds:
    Any evidence is missing, unknown, skipped, stale, manual or for another edition: system
    Any required obligation failed: system
    Checks a changed edition: user
    Every required obligation has a current automated pass: system
    Runs the release check: user
    Supplies new automated evidence and checks again: user
states:
  'Release: Release evidence':
    id: 'Release: Release evidence'
    meta:
      description: The edition’s obligations and their evidence are available to inspect.
      snapshot: The edition’s obligations and their evidence are available to inspect.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Runs the release check:
        target: '#Release: Checking release'
  'Release: Checking release':
    id: 'Release: Checking release'
    meta:
      description: The release check evaluates current automated evidence for this edition.
      snapshot: The release check evaluates current automated evidence for this edition.
      confidence: assumed
      source:
      - specs/developer-tools/release-check.feature:6
      - specs/developer-tools/release-check.feature:32
      events: []
      gherkin:
      - specs/developer-tools/release-check.feature
      checks:
      - Every required obligation needs a current automated pass
      - Evidence belongs to the edition it checks
    'on':
      Every required obligation has a current automated pass:
        target: '#Release: Release permitted'
      Any required obligation failed:
        target: '#Release: Release refused'
      Any evidence is missing, unknown, skipped, stale, manual or for another edition:
        target: '#Release: Release refused'
  'Release: Release permitted':
    id: 'Release: Release permitted'
    meta:
      description: The passing verdict identifies the edition approved by complete current automated evidence.
      snapshot: The passing verdict identifies the edition approved by complete current automated evidence.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Checks a changed edition:
        target: '#Release: Release evidence'
  'Release: Release refused':
    id: 'Release: Release refused'
    meta:
      description: Release is refused for the failed or unproven obligation; no manual sign-off replaces evidence.
      snapshot: Release is refused for the failed or unproven obligation; no manual sign-off replaces evidence.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Supplies new automated evidence and checks again:
        target: '#Release: Release evidence'
