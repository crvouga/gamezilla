# Product behavior projection; authoritative rules remain in specs/.
id: friends
initial: 'Friends: People and friends'
meta:
  description: Searching, asking, accepting, declining, cancelling, removing and blocking keep relationships explicit.
  snapshot: Searching, asking, accepting, declining, cancelling, removing and blocking keep relationships explicit.
  confidence: assumed
  source: &id001
  - specs/friends/friendships.als
  - specs/friends/deleted-account-friendships.feature
  - specs/friends/friend-block.feature
  - specs/friends/friend-profile.feature
  - specs/friends/friend-remove.feature
  - specs/friends/friend-request-accept.feature
  - specs/friends/friend-request-decline-cancel.feature
  - specs/friends/friend-request-inbox.feature
  - specs/friends/friends-gates.feature
  - specs/friends/friends-live-space.feature
  - specs/friends/friends-profile-changes.feature
  - specs/friends/people-search.feature
  - specs/friends/relationships-after-time-away.feature
  - specs/friends/social-needs-connection.feature
  - specs/friends/events.qnt
  - specs/friends/friendship.qnt
  - docs/statecharts/SPEC_CONFLICTS.md
  events: []
  context: friends
  eventKinds:
    Accepts the friend request: user
    BecameFriends: system
    Blocks this friend: user
    Blocks this person: user
    Cancels friend removal: user
    Confirms removing this friend: user
    Cancels the sent request: user
    Chooses to remove this friend: user
    Connection returns: system
    Connection returns after the friendship ended: system
    Connection returns with a new friend request: system
    Connection returns with the friendship intact: system
    Declines the friend request: user
    FriendshipEnded: system
    Opens a blocked person: user
    Opens a current friend: user
    Opens a matching person: user
    Opens a person with no relationship: user
    Opens the friend’s open space: user
    Receives a friend request: system
    Returns to the people list: user
    Searches different people: user
    Searches or changes friendship offline: user
    Searches people as a guest: user
    Searches people with an account online: user
    Searches text with no matches: user
    Sends a refused friend request: user
    Sends an allowed friend request: user
    SignedIn: system
    SpaceEnded: system
    SpaceOpened: system
    The other person declines the request: system
    The person goes offline with this friendship: system
    The request is no longer actionable: system
    The sender cancels the request: system
    Tries asking during the one-day wait: user
    Unblocks this person: user
    UsernameChanged: system
states:
  'Friends: People and friends':
    id: 'Friends: People and friends'
    meta:
      routes:
      - '/search'
      - '/profile/friends'
      description: The friends list and people search show only people the person may find.
      snapshot: The friends list and people search show only people the person may find.
      confidence: assumed
      source:
      - specs/friends/people-search.feature:7
      events: []
      gherkin:
      - specs/friends/people-search.feature
      checks:
      - People search finds other people by the start of their username regardless of letter case
    'on':
      Searches people with an account online:
        target: '#Friends: Search results'
      Searches people as a guest:
        target: '#Friends: Account required'
      Searches or changes friendship offline:
        target: '#Friends: Connection required'
      Opens a current friend:
        target: '#Friends: Friend'
      Opens a person with no relationship:
        target: '#Friends: Person to ask'
      Receives a friend request:
        target: '#Friends: Incoming request'
      Opens a blocked person:
        target: '#Friends: Blocked person'
      UsernameChanged:
        target: '#Friends: People and friends'
  'Friends: Account required':
    id: 'Friends: Account required'
    meta:
      description: Friend actions need an account under the current permission decision.
      snapshot: Friend actions need an account under the current permission decision.
      confidence: assumed
      source:
      - specs/friends/deleted-account-friendships.feature:6
      - specs/friends/deleted-account-friendships.feature:20
      - specs/friends/friend-remove.feature:7
      - specs/friends/friends-gates.feature:8
      - specs/friends/friends-gates.feature:26
      events: []
      gherkin:
      - specs/friends/deleted-account-friendships.feature
      - specs/friends/friend-remove.feature
      - specs/friends/friends-gates.feature
      checks:
      - Confirmed deletion removes the profile and its friendships
      - Waiting friend requests from or to a deleted account cannot be answered
      - Removing a friend ends the friendship for both people only after confirmation
      - A guest is asked to sign in
      - An empty friends list points at people search
    'on':
      SignedIn:
        target: '#Friends: People and friends'
  'Friends: Connection required':
    id: 'Friends: Connection required'
    meta:
      description: Social changes need a connection and leave the relationship unchanged.
      snapshot: Social changes need a connection and leave the relationship unchanged.
      confidence: assumed
      source:
      - specs/friends/friends-profile-changes.feature:8
      - specs/friends/friends-profile-changes.feature:29
      - specs/friends/social-needs-connection.feature:7
      events: []
      gherkin:
      - specs/friends/friends-profile-changes.feature
      - specs/friends/social-needs-connection.feature
      checks:
      - A person's current username reaches their friends list and people search
      - A username that is no longer allowed is never shown to or found by friends
      - People search and friend requests need a connection
    'on':
      Connection returns:
        target: '#Friends: People and friends'
  'Friends: Search results':
    id: 'Friends: Search results'
    meta:
      description: Matching visible people appear; blocked or deleted accounts cannot be found.
      snapshot: Matching visible people appear; blocked or deleted accounts cannot be found.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Opens a matching person:
        target: '#Friends: Person to ask'
      Searches text with no matches:
        target: '#Friends: No matching people'
  'Friends: No matching people':
    id: 'Friends: No matching people'
    meta:
      description: No permitted person matches the supplied search.
      snapshot: No permitted person matches the supplied search.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Searches different people:
        target: '#Friends: Search results'
  'Friends: Person to ask':
    id: 'Friends: Person to ask'
    meta:
      routes:
      - '/profile/user/:userId'
      description: The person may send an allowed friend request or block this person.
      snapshot: The person may send an allowed friend request or block this person.
      confidence: assumed
      source:
      - specs/friends/friend-block.feature:8
      - specs/friends/friend-block.feature:56
      - specs/friends/friend-request-accept.feature:7
      - specs/friends/friend-request-decline-cancel.feature:11
      - specs/friends/friend-request-decline-cancel.feature:26
      - specs/friends/friend-request-inbox.feature:9
      - specs/friends/friend-request-inbox.feature:22
      events: []
      gherkin:
      - specs/friends/friend-block.feature
      - specs/friends/friend-request-accept.feature
      - specs/friends/friend-request-decline-cancel.feature
      - specs/friends/friend-request-inbox.feature
      checks:
      - Blocking ends the friendship and hides the blocker
      - The blocker can undo a block
      - Accepting a friend request makes both people friends and tells the asker
      - Declining a friend request ends it, and asking again straight away is refused
      - Cancelling a friend request lets the asker ask again
      - A friend request reaches the person asked and an inbox needs an account
      - A friend request names its asker as everyone sees them
    'on':
      Returns to the people list:
        target: '#Friends: People and friends'
      Sends an allowed friend request:
        target: '#Friends: Outgoing request'
      Sends a refused friend request:
        target: '#Friends: Request refused'
      Blocks this person:
        target: '#Friends: Blocked person'
  'Friends: Outgoing request':
    id: 'Friends: Outgoing request'
    meta:
      description: A sent request waits for the other person’s choice.
      snapshot: A sent request waits for the other person’s choice.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Cancels the sent request:
        target: '#Friends: Person to ask'
      BecameFriends:
        target: '#Friends: Friend'
      The other person declines the request:
        target: '#Friends: Declined request wait'
  'Friends: Incoming request':
    id: 'Friends: Incoming request'
    meta:
      description: An incoming request can be accepted, declined or blocked.
      snapshot: An incoming request can be accepted, declined or blocked.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Accepts the friend request:
        target: '#Friends: Accepting a request'
      Declines the friend request:
        target: '#Friends: Declined request wait'
      Blocks this person:
        target: '#Friends: Blocked person'
      The sender cancels the request:
        target: '#Friends: Person to ask'
  'Friends: Accepting a request':
    id: 'Friends: Accepting a request'
    meta:
      description: The request is being accepted.
      snapshot: The request is being accepted.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      BecameFriends:
        target: '#Friends: Friend'
      The request is no longer actionable:
        target: '#Friends: Request refused'
  'Friends: Request refused':
    id: 'Friends: Request refused'
    meta:
      description: The request cannot proceed for the reason given; the relationship stays intact.
      snapshot: The request cannot proceed for the reason given; the relationship stays intact.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the people list:
        target: '#Friends: People and friends'
  'Friends: Declined request wait':
    id: 'Friends: Declined request wait'
    meta:
      description: A declined request cannot be sent again during the documented one-day wait.
      snapshot: A declined request cannot be sent again during the documented one-day wait.
      confidence: assumed
      source: *id001
      events: []
      checks: []
      hints:
      - The feature states a one-day wait, but specs/friends/friendship.qnt has no action ending that wait.
    'on':
      Tries asking during the one-day wait:
        target: '#Friends: Request refused'
      Returns to the people list:
        target: '#Friends: People and friends'
  'Friends: Friend':
    id: 'Friends: Friend'
    meta:
      description: The current friendship and a discoverable friend’s open space are shown.
      snapshot: The current friendship and a discoverable friend’s open space are shown.
      confidence: assumed
      source:
      - specs/friends/friend-profile.feature:11
      - specs/friends/friend-profile.feature:23
      - specs/friends/friends-live-space.feature:7
      events: []
      gherkin:
      - specs/friends/friend-profile.feature
      - specs/friends/friends-live-space.feature
      checks:
      - A profile says who someone is
      - A profile offers the same choices as search
      - The friends list shows open spaces a friend is in and stops showing them when they end
    'on':
      Chooses to remove this friend:
        target: '#Friends: Confirming removal'
      Blocks this friend:
        target: '#Friends: Blocked person'
      Opens the friend’s open space:
        target: '#App: Spaces'
      SpaceOpened:
        target: '#Friends: Friend'
      SpaceEnded:
        target: '#Friends: Friend'
      UsernameChanged:
        target: '#Friends: Friend'
      FriendshipEnded:
        target: '#Friends: Person to ask'
      The person goes offline with this friendship:
        target: '#Friends: Last known relationship'
  'Friends: Last known relationship':
    id: 'Friends: Last known relationship'
    meta:
      description: The offline list keeps the last relationships known to this device.
      snapshot: The offline list keeps the last relationships known to this device.
      confidence: assumed
      source:
      - specs/friends/relationships-after-time-away.feature:7
      - specs/friends/relationships-after-time-away.feature:17
      - specs/friends/relationships-after-time-away.feature:28
      events: []
      gherkin:
      - specs/friends/relationships-after-time-away.feature
      checks:
      - An offline friends list keeps the last relationships the person knew
      - Returning reflects removals made while away
      - Returning reveals friend requests sent while away
    'on':
      Connection returns with the friendship intact:
        target: '#Friends: Friend'
      Connection returns after the friendship ended:
        target: '#Friends: Person to ask'
      Connection returns with a new friend request:
        target: '#Friends: Incoming request'
  'Friends: Confirming removal':
    id: 'Friends: Confirming removal'
    meta:
      description: Removing the friendship needs confirmation.
      snapshot: Removing the friendship needs confirmation.
      confidence: assumed
      source:
      - specs/friends/friend-remove.feature:13
      - specs/friends/friend-remove.feature:17
      events: []
      checks: []
    'on':
      Cancels friend removal:
        target: '#Friends: Friend'
      Confirms removing this friend:
        target: '#Friends: Removing friend'
      FriendshipEnded:
        target: '#Friends: Person to ask'
  'Friends: Removing friend':
    id: 'Friends: Removing friend'
    meta:
      description: The confirmed removal is in progress; completion ends the friendship for both people and updates both friend counts.
      snapshot: The confirmed removal is in progress; completion ends the friendship for both people and updates both friend counts.
      confidence: assumed
      source:
      - specs/friends/friend-remove.feature:17
      events: []
      checks: []
    'on':
      FriendshipEnded:
        target: '#Friends: Person to ask'
  'Friends: Blocked person':
    id: 'Friends: Blocked person'
    meta:
      description: Blocking ends the relationship and its requests and prevents discovery between the two people.
      snapshot: Blocking ends the relationship and its requests and prevents discovery between the two people.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Unblocks this person:
        target: '#Friends: Person to ask'
      FriendshipEnded:
        target: '#Friends: Blocked person'
