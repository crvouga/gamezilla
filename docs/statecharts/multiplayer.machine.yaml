  'Multiplayer: Offline multiplayer':
    id: 'Multiplayer: Offline multiplayer'
    meta:
      description: The last known board stays visible; reconnection shows the current game and elapsed clock.
      snapshot: The last known board stays visible; reconnection shows the current game and elapsed clock.
      confidence: assumed
      source:
      - specs/chess/multiplayer-clock.feature:7
      - specs/chess/multiplayer-clock.feature:19
      - specs/chess/multiplayer-clock.feature:34
      - specs/chess/multiplayer-clock.feature:49
      - specs/chess/multiplayer-clock.feature:63
      events: []
      gherkin:
      - specs/chess/multiplayer-clock.feature
      checks:
      - Each side starts with the time control's minutes, and neither multiplayer clock runs until both people have
        made their first move
      - Only the side to move spends time, and a legal move adds the increment to the person who made it
      - Running out of time loses, even if a move arrives at that moment
      - Running out of time ends in a multiplayer draw when the multiplayer opponent cannot checkmate by any series
        of legal moves
      - A disconnected person's multiplayer clock keeps running on their turn
    'on':
      Connection returns to an active multiplayer game:
        target: '#Multiplayer: Playing multiplayer'
      Connection returns with a waiting multiplayer draw offer:
        target: '#Multiplayer: Draw offered'
      Connection returns to a finished multiplayer game:
        target: '#Multiplayer: Finished multiplayer'
  'Multiplayer: Finished multiplayer':
    id: 'Multiplayer: Finished multiplayer'
    initial: 'Multiplayer: Recorded result'
    meta:
      description: The result and the rating change for its speed are recorded once; other speeds’ ratings stay
