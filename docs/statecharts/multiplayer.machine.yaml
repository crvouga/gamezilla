# Product behavior projection; authoritative rules remain in specs/.
id: multiplayer
initial: 'Multiplayer: Opening own multiplayer'
meta:
  description: A private multiplayer game joins opponent search, timed play, results and rematch into one continuous
    flow.
  snapshot: A private multiplayer game joins opponent search, timed play, results and rematch into one continuous
    flow.
  confidence: assumed
  source: &id001
  - specs/chess/multiplayer-games.als
  - specs/chess/multiplayer-ready.openslo.yaml
  - specs/chess/multiplayer-watch-access.dmn
  - specs/chess/unfinished-game-limit.dmn
  - specs/chess/chess-opponent-policies.feature
  - specs/chess/find-an-opponent.feature
  - specs/chess/multiplayer-abort.feature
  - specs/chess/multiplayer-accessibility.feature
  - specs/chess/multiplayer-account-and-space.feature
  - specs/chess/multiplayer-being-matched.feature
  - specs/chess/multiplayer-clock.feature
  - specs/chess/multiplayer-colours.feature
  - specs/chess/multiplayer-draw-offers.feature
  - specs/chess/multiplayer-game-over.feature
  - specs/chess/multiplayer-in-spaces.feature
  - specs/chess/multiplayer-offline.feature
  - specs/chess/multiplayer-ratings.feature
  - specs/chess/multiplayer-recovery-and-privacy.feature
  - specs/chess/multiplayer-rematch.feature
  - specs/chess/multiplayer-time-controls.feature
  - specs/chess/play-multiplayer-chess.feature
  - specs/chess/multiplayer-spaces.qnt
  - specs/chess/multiplayer.qnt
  events: []
  context: chess
  eventKinds:
    A multiplayer clock expires: time
    A multiplayer participant loses connection: system
    A multiplayer player resigns: user
    Aborts within the permitted opening: user
    An incompatible or blocked opponent is excluded: system
    Both participants offer the multiplayer rematch: system
    Cancels finding an opponent: user
    Changes the search rating range: user
    Chooses the multiplayer promotion piece: user
    Connection returns: system
    Connection returns to a finished multiplayer game: system
    Connection returns to an active multiplayer game: system
    Finds an opponent as a guest: user
    Finds an opponent offline: user
    Finds an opponent with an account online: user
    MatchFormed: system
    Multiplayer checkmate occurs: system
    Multiplayer stalemate or another drawn position occurs: system
    Offers a multiplayer draw: user
    Offers the multiplayer draw back: user
    Repeats their waiting multiplayer draw offer: user
    The offering participant plays a legal multiplayer move: user
    The offered participant plays a legal multiplayer move: user
    The offering participant tries declining their own multiplayer draw: user
    Answers a multiplayer draw when none is waiting: user
    Resigns before both participants have moved: user
    The thirty-second first-move deadline expires: time
    A multiplayer clock expires against an opponent unable to mate: time
    Offers a permitted multiplayer rematch: user
    Offers a rematch while someone plays or searches elsewhere: user
    Plays a legal multiplayer move on their turn: user
    Plays a wrong-turn or illegal multiplayer move: user
    Reaches multiplayer promotion: user
    Requests a rematch after an aborted game: user
    Returns to a lasting multiplayer result: user
    Returns to an accepted multiplayer game: user
    Returns to an accepted opponent search: user
    Returns to multiplayer choices: user
    Returns to the multiplayer board: user
    Returns to the multiplayer result: user
    Reviews the multiplayer moves: user
    SignedIn: system
    Someone starts another search and ends the offer: system
    Starts another opponent search: user
    The offering participant tries accepting their own draw: user
    The offering participant tries accepting their own rematch: user
    The other participant accepts the multiplayer draw: system
    The other participant accepts the multiplayer rematch: system
    The other participant declines the multiplayer draw: system
    The other participant declines the multiplayer rematch: system
    Tries aborting after the opening: user
    Tries finding an opponent during an unfinished game: user
    No accepted opponent search or multiplayer game exists: system
    Returns to a multiplayer game with a waiting draw offer: system
    Connection returns with a waiting multiplayer draw offer: system
states:
  'Multiplayer: Opening own multiplayer':
    id: 'Multiplayer: Opening own multiplayer'
    meta:
      description: Opening observes the account's accepted search, current game or lasting result. These records belong to the account across devices and are not restarted by navigation.
      snapshot: Opening observes the account's accepted search, current game or lasting result. These records belong to the account across devices and are not restarted by navigation.
      confidence: assumed
      source:
      - specs/chess/find-an-opponent.feature:71
      - specs/chess/multiplayer-game-over.feature:9
      - specs/chess/multiplayer-account-and-space.feature:6
      events: []
      checks: []
    'on':
      No accepted opponent search or multiplayer game exists:
        target: '#Multiplayer: Choosing a time control'
      Returns to an accepted multiplayer game:
        target: '#Multiplayer: Playing multiplayer'
      Returns to a multiplayer game with a waiting draw offer:
        target: '#Multiplayer: Draw offered'
      Returns to a lasting multiplayer result:
        target: '#Multiplayer: Finished multiplayer'
      Returns to an accepted opponent search:
        target: '#Multiplayer: Finding an opponent'
      Finds an opponent with an account online:
        target: '#Multiplayer: Finding an opponent'
      Finds an opponent as a guest:
        target: '#Multiplayer: Multiplayer account required'
      Finds an opponent offline:
        target: '#Multiplayer: Multiplayer connection required'
      Tries finding an opponent during an unfinished game:
        target: '#Multiplayer: Search refused'
  'Multiplayer: Choosing a time control':
    id: 'Multiplayer: Choosing a time control'
    meta:
      description: Account holders choose a supported multiplayer time control before searching.
      snapshot: Account holders choose a supported multiplayer time control before searching.
      confidence: assumed
      source:
      - specs/chess/multiplayer-abort.feature:6
      - specs/chess/multiplayer-abort.feature:30
      - specs/chess/multiplayer-abort.feature:49
      - specs/chess/multiplayer-abort.feature:71
      - specs/chess/multiplayer-recovery-and-privacy.feature:6
      - specs/chess/multiplayer-recovery-and-privacy.feature:30
      - specs/chess/multiplayer-recovery-and-privacy.feature:48
      - specs/chess/multiplayer-time-controls.feature:6
      - specs/chess/multiplayer-time-controls.feature:25
      - specs/chess/multiplayer-time-controls.feature:39
      events: []
      gherkin:
      - specs/chess/multiplayer-abort.feature
      - specs/chess/multiplayer-recovery-and-privacy.feature
      - specs/chess/multiplayer-time-controls.feature
      checks:
      - Either person may abort the multiplayer game until both people have made their first move
      - Resigning is refused until both people have made their first move, and the person is told to abort instead
      - Missing the first move aborts the multiplayer game
      - An aborted game has no multiplayer result, moves no multiplayer rating and frees both people to find a chess
        opponent
      - An offline device keeps its last known board and the game unfinished
      - Only people in either space can see the game and only matched people can act
      - Confirmed account deletion stops searching, aborts a game not yet begun and otherwise gives up unfinished
        play
      - Finding a chess opponent needs one of the offered time controls
      - People are matched only with someone looking for the same time control
      - After a game is over or aborted, a person finds a new opponent at the same time control in one step
    'on':
      Returns to an accepted multiplayer game:
        target: '#Multiplayer: Playing multiplayer'
      Returns to a lasting multiplayer result:
        target: '#Multiplayer: Finished multiplayer'
      Returns to an accepted opponent search:
        target: '#Multiplayer: Finding an opponent'
      Finds an opponent with an account online:
        target: '#Multiplayer: Finding an opponent'
      Finds an opponent as a guest:
        target: '#Multiplayer: Multiplayer account required'
      Finds an opponent offline:
        target: '#Multiplayer: Multiplayer connection required'
      Tries finding an opponent during an unfinished game:
        target: '#Multiplayer: Search refused'
  'Multiplayer: Finding an opponent':
    id: 'Multiplayer: Finding an opponent'
    meta:
      description: The person sees their wait and may cancel it while keeping the chosen time control.
      snapshot: The person sees their wait and may cancel it while keeping the chosen time control.
      confidence: assumed
      source:
      - specs/chess/chess-opponent-policies.feature:6
      - specs/chess/chess-opponent-policies.feature:25
      - specs/chess/chess-opponent-policies.feature:37
      - specs/chess/find-an-opponent.feature:7
      - specs/chess/find-an-opponent.feature:27
      - specs/chess/find-an-opponent.feature:40
      - specs/chess/find-an-opponent.feature:56
      - specs/chess/find-an-opponent.feature:71
      - specs/chess/find-an-opponent.feature:84
      - specs/chess/multiplayer-game-over.feature:7
      - specs/chess/multiplayer-game-over.feature:27
      events: []
      gherkin:
      - specs/chess/chess-opponent-policies.feature
      - specs/chess/find-an-opponent.feature
      - specs/chess/multiplayer-game-over.feature
      checks:
      - Blocking in either direction stops two people from being matched
      - Paid access does not govern ordinary multiplayer chess
      - Multiplayer chess is separate from puzzles in a space
      - Finding a chess opponent needs an account and a connection
      - A person cannot seek a second chess opponent while a multiplayer game is unfinished
      - A participant of an active Custom Game finishes it before finding a chess opponent
      - One matchmaking match creates one multiplayer game for its two people
      - A person's search and game follow them across devices
      - Stopping an opponent search keeps any game already formed
      - No move is accepted once a multiplayer game is over or aborted
      - Once a multiplayer game is over or aborted, its people cannot resign, abort or offer a multiplayer draw,
        but can find a new opponent
    'on':
      MatchFormed:
        target: '#Multiplayer: Playing multiplayer'
      Cancels finding an opponent:
        target: '#Multiplayer: Choosing a time control'
      Changes the search rating range:
        target: '#Multiplayer: Finding an opponent'
      An incompatible or blocked opponent is excluded:
        target: '#Multiplayer: Finding an opponent'
  'Multiplayer: Multiplayer account required':
    id: 'Multiplayer: Multiplayer account required'
    meta:
      description: Private multiplayer chess needs an account.
      snapshot: Private multiplayer chess needs an account.
      confidence: assumed
      source:
      - specs/chess/multiplayer-accessibility.feature:6
      - specs/chess/multiplayer-accessibility.feature:35
      - specs/chess/multiplayer-account-and-space.feature:6
      - specs/chess/multiplayer-account-and-space.feature:20
      - specs/chess/multiplayer-account-and-space.feature:29
      - specs/chess/multiplayer-being-matched.feature:7
      - specs/chess/multiplayer-being-matched.feature:15
      - specs/chess/multiplayer-colours.feature:6
      - specs/chess/multiplayer-colours.feature:21
      - specs/chess/multiplayer-in-spaces.feature:6
      - specs/chess/multiplayer-in-spaces.feature:22
      - specs/chess/multiplayer-in-spaces.feature:41
      - specs/chess/multiplayer-in-spaces.feature:61
      - specs/chess/multiplayer-offline.feature:7
      - specs/chess/multiplayer-offline.feature:47
      - specs/chess/play-multiplayer-chess.feature:7
      - specs/chess/play-multiplayer-chess.feature:28
      - specs/chess/play-multiplayer-chess.feature:43
      - specs/chess/play-multiplayer-chess.feature:55
      - specs/chess/play-multiplayer-chess.feature:68
      - specs/chess/play-multiplayer-chess.feature:88
      events: []
      gherkin:
      - specs/chess/multiplayer-accessibility.feature
      - specs/chess/multiplayer-account-and-space.feature
      - specs/chess/multiplayer-being-matched.feature
      - specs/chess/multiplayer-colours.feature
      - specs/chess/multiplayer-in-spaces.feature
      - specs/chess/multiplayer-offline.feature
      - specs/chess/play-multiplayer-chess.feature
      checks:
      - Multiplayer chess works with the keyboard alone
      - A listener hears who they were matched with, the game, both multiplayer clocks, offers and the multiplayer
        result
      - Signing out on one device does not stop the account's accepted search
      - A multiplayer opponent's current username is shown
      - Spaces and friendships do not own the multiplayer game
      - A person looking for a chess opponent sees their time control and how long they have been looking
      - A matched person sees their multiplayer opponent's username and multiplayer rating, the time control and
        their colour
      - Of two matched people, the one with the greater colour balance plays Black
      - With equal colour balances either person may be White
      - Finding an opponent and playing multiplayer chess requires a space
      - Guests in either space watch the same multiplayer game
      - Watching a multiplayer game never grants a side
      - Guests see the multiplayer result only while in either space
      - An offline person sees their last known multiplayer board but cannot change the game
      - An offline person sees their last known search but cannot change it or a multiplayer rematch
      - Only a legal move by the person whose turn it is changes the board
      - A move sent twice or for an earlier position never moves the board twice
      - Once both people have made their first move, either person may resign an unfinished game
      - A multiplayer game that is over never accepts another move
      - Both people see every accepted move in the multiplayer move list, kept with the multiplayer result
      - A multiplayer game is drawn automatically by stalemate, repetition, insufficient mating material or fifty
        moves
    'on':
      SignedIn:
        target: '#Multiplayer: Choosing a time control'
  'Multiplayer: Multiplayer connection required':
    id: 'Multiplayer: Multiplayer connection required'
    meta:
      description: Starting multiplayer search needs a connection.
      snapshot: Starting multiplayer search needs a connection.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Connection returns:
        target: '#Multiplayer: Choosing a time control'
  'Multiplayer: Search refused':
    id: 'Multiplayer: Search refused'
    meta:
      description: Another unfinished game or competing wait prevents starting this search.
      snapshot: Another unfinished game or competing wait prevents starting this search.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to multiplayer choices:
        target: '#Multiplayer: Choosing a time control'
  'Multiplayer: Playing multiplayer':
    id: 'Multiplayer: Playing multiplayer'
    meta:
      description: Both participants see the assigned colours, whose turn it is, and the agreed clocks.
      snapshot: Both participants see the assigned colours, whose turn it is, and the agreed clocks.
