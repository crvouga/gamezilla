  'Multiplayer: Draw offered':
    id: 'Multiplayer: Draw offered'
    meta:
      description: The other participant may accept, decline or offer back to accept the draw. Their legal move declines it; its sender's legal move keeps it. Play and clocks continue.
      snapshot: The other participant may accept, decline or offer back to accept the draw. Their legal move declines it; its sender's legal move keeps it. Play and clocks continue.
      confidence: assumed
      source:
      - specs/chess/multiplayer-draw-offers.feature:7
      - specs/chess/multiplayer-draw-offers.feature:25
      - specs/chess/multiplayer-draw-offers.feature:49
      - specs/chess/multiplayer-draw-offers.feature:68
      events: []
      gherkin:
      - specs/chess/multiplayer-draw-offers.feature
      checks:
      - Either person may offer a multiplayer draw in an unfinished game
      - Only the person offered a multiplayer draw may accept it, and the game is then drawn by agreement
      - The person offered a multiplayer draw may decline it, and the game goes on
      - A move by the person offered a multiplayer draw declines it, and a move by the person who offered keeps
        it
    'on':
      The other participant accepts the multiplayer draw:
        target: '#Multiplayer: Drawn result'
      Offers the multiplayer draw back:
        target: '#Multiplayer: Drawn result'
      The other participant declines the multiplayer draw:
        target: '#Multiplayer: Playing multiplayer'
      The offering participant tries accepting their own draw:
        target: '#Multiplayer: Draw offered'
      The offering participant tries declining their own multiplayer draw:
