      - Every finished multiplayer game moves both people's rating for its speed exactly once
      - A multiplayer result never moves the multiplayer rating of another speed
      - Matchmaking pairs people up by their multiplayer rating for the chosen speed
    states:
      'Multiplayer: Recorded result':
        id: 'Multiplayer: Recorded result'
        meta:
          description: The recorded winner or draw, result reason and move list remain visible on the participant's devices.
          snapshot: The recorded winner or draw, result reason and move list remain visible on the participant's devices.
