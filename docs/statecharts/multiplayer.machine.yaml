        target: '#Multiplayer: Playing multiplayer'
      The thirty-second first-move deadline expires:
        target: '#Multiplayer: Aborted multiplayer'
  'Multiplayer: Abort refused':
    id: 'Multiplayer: Abort refused'
    meta:
