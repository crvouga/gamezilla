  'Multiplayer: Early resignation refused':
    id: 'Multiplayer: Early resignation refused'
    meta:
      description: Before both participants have moved, resignation is refused and the person is told to abort instead. Their unfinished game remains intact.
      snapshot: Before both participants have moved, resignation is refused and the person is told to abort instead. Their unfinished game remains intact.
      confidence: assumed
