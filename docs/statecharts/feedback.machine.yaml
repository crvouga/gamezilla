# Product behavior projection; authoritative rules remain in specs/.
id: feedback
initial: 'Feedback: Writing a draft'
meta:
  description: The person keeps a draft, optionally records reproduction, and sees submission and management outcomes.
  snapshot: The person keeps a draft, optionally records reproduction, and sees submission and management outcomes.
  confidence: assumed
  source: &id001
  - specs/feedback/availability.feature
  - specs/feedback/drafts.feature
  - specs/feedback/feedback-wizard.feature
  - specs/feedback/giving-feedback.feature
  - specs/feedback/managing-feedback.feature
  - specs/feedback/recording.feature
  events: []
  context: feedback
  eventKinds:
    A forbidden feedback change is refused: system
    Adds a nonblank feedback summary: user
    Attaches the reproduction recording: user
    Cancels deleting authored feedback: user
    Changes authored feedback writing: user
    Chooses a feedback kind: user
    Chooses a suggested feedback template: user
    Chooses an optional feedback template while keeping writing: user
    Chooses to delete authored feedback: user
    Closes the feedback wizard: user
    Confirms deleting authored feedback: user
    Continues feedback without a recording: user
    Copies feedback to keep for later: user
    Discards the reproduction recording: user
    Edits the feedback draft: user
    Edits the preserved feedback: user
    Feedback submission fails: system
    Feedback submission succeeds: system
    Formats the feedback writing: user
    Keeps an unknown template command in the writing: user
    Keeps local feedback offline: user
    Keeps local feedback while the app is unusable: user
    Local reporting cannot be reached: system
    Opens saved feedback: user
    Recording is unavailable: system
    Requests a reproduction recording: user
    Returns to saved feedback: user
    Sends blank feedback: user
    Sends nonblank feedback: user
    Sends the preserved feedback again: user
    Starts another feedback draft: user
    Stops recording the reproduction: user
    Tries keeping feedback again: user
    Writes a matching template command: user
states:
  'Feedback: Writing a draft':
    id: 'Feedback: Writing a draft'
    meta:
      description: Feedback writing stays intact when the person closes and returns to the wizard.
      snapshot: Feedback writing stays intact when the person closes and returns to the wizard.
      confidence: assumed
      source:
      - specs/feedback/drafts.feature:6
      - specs/feedback/drafts.feature:14
      - specs/feedback/drafts.feature:22
      - specs/feedback/drafts.feature:30
      - specs/feedback/drafts.feature:48
      - specs/feedback/feedback-wizard.feature:6
      - specs/feedback/feedback-wizard.feature:19
      - specs/feedback/feedback-wizard.feature:27
      - specs/feedback/feedback-wizard.feature:35
      - specs/feedback/giving-feedback.feature:6
      - specs/feedback/giving-feedback.feature:20
      - specs/feedback/giving-feedback.feature:34
      - specs/feedback/giving-feedback.feature:42
      - specs/feedback/giving-feedback.feature:55
      events: []
      gherkin:
      - specs/feedback/drafts.feature
      - specs/feedback/feedback-wizard.feature
      - specs/feedback/giving-feedback.feature
      checks:
      - Closing the wizard keeps its draft
      - Closing the app keeps drafts
      - New drafts keep other drafts
      - Trouble sending keeps the draft
      - Closing the app keeps reviewable recordings
      - The command palette opens the single feedback wizard
      - Feedback does not occupy the app until opened
      - A phone gives the wizard its full width
      - A computer keeps a movable widget
      - Feedback accepts freely arranged Markdown
      - Templates are optional and preserve existing writing
      - Formatting is visible while writing feedback
      - Writing a template command offers matching templates
      - Choosing a suggested template keeps existing writing
    'on':
      Chooses an optional feedback template while keeping writing:
        target: '#Feedback: Writing a draft'
      Formats the feedback writing:
        target: '#Feedback: Writing a draft'
      Writes a matching template command:
        target: '#Feedback: Template suggestions'
      Chooses a feedback kind:
        target: '#Feedback: Writing a draft'
      Adds a nonblank feedback summary:
        target: '#Feedback: Ready to send'
      Requests a reproduction recording:
        target: '#Feedback: Recording'
      Opens saved feedback:
        target: '#Feedback: Saved feedback'
      Closes the feedback wizard:
        target: '#App: Spaces'
      Keeps local feedback while the app is unusable:
        target: '#Feedback: Local feedback kept'
  'Feedback: Ready to send':
    id: 'Feedback: Ready to send'
    meta:
      description: The feedback has the supplied content and optional recording.
      snapshot: The feedback has the supplied content and optional recording.
      confidence: assumed
      source:
      - specs/feedback/recording.feature:6
      - specs/feedback/recording.feature:14
      - specs/feedback/recording.feature:28
      - specs/feedback/recording.feature:40
      events: []
      gherkin:
      - specs/feedback/recording.feature
      checks:
      - Opening Support never starts a recording
      - A stopped recording can be reviewed before sending feedback
      - A discarded recording is never sent
      - Video is helpful but never required
    'on':
      Sends nonblank feedback:
        target: '#Feedback: Sending'
      Sends blank feedback:
        target: '#Feedback: Blank feedback refused'
      Keeps local feedback offline:
        target: '#Feedback: Local feedback kept'
      Edits the feedback draft:
        target: '#Feedback: Writing a draft'
  'Feedback: Template suggestions':
    id: 'Feedback: Template suggestions'
    meta:
      description: Matching template commands offer optional templates while keeping all existing writing.
      snapshot: Matching template commands offer optional templates while keeping all existing writing.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Chooses a suggested feedback template:
        target: '#Feedback: Writing a draft'
      Keeps an unknown template command in the writing:
        target: '#Feedback: Writing a draft'
  'Feedback: Local feedback kept':
    id: 'Feedback: Local feedback kept'
    meta:
      description: The team can read the local feedback offline, after closing the app, or when the app is unusable;
        missing diagnostics do not block it.
      snapshot: The team can read the local feedback offline, after closing the app, or when the app is unusable;
        missing diagnostics do not block it.
      confidence: assumed
      source:
      - specs/feedback/availability.feature:6
      - specs/feedback/availability.feature:35
      - specs/feedback/availability.feature:49
      - specs/feedback/availability.feature:62
      events: []
      gherkin:
      - specs/feedback/availability.feature
      checks:
      - Support remains available when the app cannot help
      - Missing diagnostics never prevent feedback
      - Local feedback need no connection and survive closing the app
      - A feedback that cannot be sent remains available to keep
    'on':
      Opens saved feedback:
        target: '#Feedback: Saved feedback'
      Starts another feedback draft:
        target: '#Feedback: Writing a draft'
  'Feedback: Blank feedback refused':
    id: 'Feedback: Blank feedback refused'
    meta:
      description: Blank writing cannot be submitted and the draft remains available.
      snapshot: Blank writing cannot be submitted and the draft remains available.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Edits the feedback draft:
        target: '#Feedback: Writing a draft'
  'Feedback: Sending':
    id: 'Feedback: Sending'
    meta:
      description: The feedback is being kept with progress shown; available diagnostics help but are not required.
      snapshot: The feedback is being kept with progress shown; available diagnostics help but are not required.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Feedback submission succeeds:
        target: '#Feedback: Sent'
      Local reporting cannot be reached:
        target: '#Feedback: Copy available'
      Feedback submission fails:
        target: '#Feedback: Sending failed'
  'Feedback: Sending failed':
    id: 'Feedback: Sending failed'
    meta:
      description: Submission failed plainly and preserves the person’s writing.
      snapshot: Submission failed plainly and preserves the person’s writing.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Sends the preserved feedback again:
        target: '#Feedback: Sending'
      Edits the preserved feedback:
        target: '#Feedback: Writing a draft'
  'Feedback: Sent':
    id: 'Feedback: Sent'
    meta:
      description: The saved feedback is acknowledged and remains available to manage.
      snapshot: The saved feedback is acknowledged and remains available to manage.
      confidence: assumed
      source:
      - specs/feedback/managing-feedback.feature:6
      - specs/feedback/managing-feedback.feature:18
      - specs/feedback/managing-feedback.feature:35
      events: []
      gherkin:
      - specs/feedback/managing-feedback.feature
      checks:
      - Authors can read and change their feedback
      - Authors can delete drafts and reports deliberately
      - Drafts and reports share one management list
    'on':
      Starts another feedback draft:
        target: '#Feedback: Writing a draft'
      Opens saved feedback:
        target: '#Feedback: Saved feedback'
  'Feedback: Recording':
    id: 'Feedback: Recording'
    meta:
      description: The person is recording the actions that reproduce the reported trouble.
      snapshot: The person is recording the actions that reproduce the reported trouble.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Stops recording the reproduction:
        target: '#Feedback: Reviewing a recording'
      Recording is unavailable:
        target: '#Feedback: Recording unavailable'
  'Feedback: Reviewing a recording':
    id: 'Feedback: Reviewing a recording'
    meta:
      description: Recorded steps may be attached or discarded without replacing the writing.
      snapshot: Recorded steps may be attached or discarded without replacing the writing.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Attaches the reproduction recording:
        target: '#Feedback: Ready to send'
      Discards the reproduction recording:
        target: '#Feedback: Writing a draft'
  'Feedback: Recording unavailable':
    id: 'Feedback: Recording unavailable'
    meta:
      description: Recording is unavailable and the person can still describe the problem.
      snapshot: Recording is unavailable and the person can still describe the problem.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Continues feedback without a recording:
        target: '#Feedback: Writing a draft'
  'Feedback: Saved feedback':
    id: 'Feedback: Saved feedback'
    meta:
      description: Permitted feedback can be read and managed without exposing another person’s private material.
      snapshot: Permitted feedback can be read and managed without exposing another person’s private material.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Changes authored feedback writing:
        target: '#Feedback: Saved feedback'
      Chooses to delete authored feedback:
        target: '#Feedback: Confirming feedback deletion'
      A forbidden feedback change is refused:
        target: '#Feedback: Management refused'
  'Feedback: Confirming feedback deletion':
    id: 'Feedback: Confirming feedback deletion'
    meta:
      description: Deleting an authored draft or report requires confirmation.
      snapshot: Deleting an authored draft or report requires confirmation.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Confirms deleting authored feedback:
        target: '#Feedback: Writing a draft'
      Cancels deleting authored feedback:
        target: '#Feedback: Saved feedback'
  'Feedback: Management refused':
    id: 'Feedback: Management refused'
    meta:
      description: The feedback change is refused under the current permission decision.
      snapshot: The feedback change is refused under the current permission decision.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to saved feedback:
        target: '#Feedback: Saved feedback'
  'Feedback: Copy available':
    id: 'Feedback: Copy available'
    meta:
      description: When reporting cannot be reached the title and writing can be copied; no local save is claimed.
      snapshot: When reporting cannot be reached the title and writing can be copied; no local save is claimed.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Copies feedback to keep for later:
        target: '#Feedback: Writing a draft'
      Tries keeping feedback again:
        target: '#Feedback: Sending'
