# Product behavior projection; authoritative rules remain in specs/.
id: profile
initial: 'Profile: Viewing the profile'
meta:
  description: The person edits their public profile while refused edits leave the saved profile intact.
  snapshot: The person edits their public profile while refused edits leave the saved profile intact.
  confidence: assumed
  source: &id001
  - specs/profile/finding-a-person.feature
  - specs/profile/profile-edit.feature
  - specs/profile/username-rules.feature
  - specs/profile/devices.feature
  - specs/profile/sessions.feature
  - specs/profile/username-changes.qnt
  events: []
  context: profile
  eventKinds:
    Cancels editing the profile: user
    Cancels signing out: user
    Changes the refused username: user
    Chooses to sign out: user
    Confirms signing out: user
    Connection returns: system
    Edits the profile again: user
    Opens the profile on another device: user
    Opens account devices while signed in: user
    Opens account devices as a guest: user
    Signs out everywhere: user
    Another account device signs out: system
    Returns to their profile: user
    Saves a malformed or reserved username: user
    Saves a taken username: user
    Saves an allowed profile: user
    Saves the profile offline: user
    Saves too soon after renaming: user
    SignedOut: system
    Signing out fails: system
    Starts editing the profile: user
    Tries signing out again: user
    UsernameChanged: system
    The team stops allowing this saved username: system
    The team allows this saved username again: system
states:
  'Profile: Viewing the profile':
    id: 'Profile: Viewing the profile'
    meta:
      routes:
      - '/profile'
      - '/more/account'
      description: The current username, avatar and profile are shown.
      snapshot: The current username, avatar and profile are shown.
      confidence: assumed
      source:
      - specs/profile/profile-edit.feature:6
      - specs/profile/username-rules.feature:7
      - specs/profile/username-rules.feature:64
      events: []
      gherkin:
      - specs/profile/profile-edit.feature
      - specs/profile/username-rules.feature
      checks:
      - Saving changes a profile and leaving without saving keeps the saved profile
      - A saved username is unique and allowed and a refused username change keeps the saved username
      - A username the team stops allowing is kept but shows as a stand-in name until the person renames themselves
    'on':
      Chooses to sign out:
        target: '#Profile: Confirming sign out'
      Starts editing the profile:
        target: '#Profile: Editing the profile'
      Opens account devices while signed in:
        target: '#Profile: Account devices'
      Opens account devices as a guest:
        target: '#Profile: Devices need sign-in'
      Opens the profile on another device:
        target: '#Profile: Viewing the profile'
      UsernameChanged:
        target: '#Profile: Viewing the profile'
      The team stops allowing this saved username:
        target: '#Profile: Stand-in name'
  'Profile: Account devices':
    id: 'Profile: Account devices'
    meta:
      routes:
      - '/more/account/devices'
      description: Only this account's signed-in devices are listed and this device is identified. A device disappears from this list when it signs out.
      snapshot: Only this account's signed-in devices are listed and this device is identified. A device disappears from this list when it signs out.
      confidence: assumed
      source:
      - specs/profile/devices.feature:8
      - specs/profile/devices.feature:15
      events: []
      checks: []
    'on':
      Another account device signs out:
        target: '#Profile: Account devices'
      Signs out everywhere:
        target: '#Profile: Signing out everywhere'
      Returns to their profile:
        target: '#Profile: Viewing the profile'
  'Profile: Devices need sign-in':
    id: 'Profile: Devices need sign-in'
    meta:
      description: A guest is asked to sign in before seeing account devices; no account's device list is exposed.
      snapshot: A guest is asked to sign in before seeing account devices; no account's device list is exposed.
      confidence: assumed
      source:
      - specs/profile/devices.feature:22
      events: []
      checks: []
    'on':
      Returns to their profile:
        target: '#Profile: Viewing the profile'
  'Profile: Signing out everywhere':
    id: 'Profile: Signing out everywhere'
    meta:
      description: Signing out everywhere ends this account's device sessions. Other devices are signed out within one hundred fifty seconds; saved account data remains with the account.
      snapshot: Signing out everywhere ends this account's device sessions. Other devices are signed out within one hundred fifty seconds; saved account data remains with the account.
      confidence: assumed
      source:
      - specs/profile/sessions.feature:9
      events: []
      checks: []
    'on':
      SignedOut:
        target: '#Profile: Viewing the profile'
  'Profile: Stand-in name':
    id: 'Profile: Stand-in name'
    meta:
      description: The saved username is retained privately while the profile and public surfaces show a stand-in name, including on a device without a connection.
      snapshot: The saved username is retained privately while the profile and public surfaces show a stand-in name, including on a device without a connection.
      confidence: assumed
      source:
      - specs/profile/username-rules.feature:69
      - specs/profile/username-rules.feature:74
      - specs/profile/username-rules.feature:79
      - specs/profile/username-rules.feature:90
      events: []
      checks: []
    'on':
      Starts editing the profile:
        target: '#Profile: Editing the profile'
      The team allows this saved username again:
        target: '#Profile: Viewing the profile'
      UsernameChanged:
        target: '#Profile: Viewing the profile'
  'Profile: Confirming sign out':
    id: 'Profile: Confirming sign out'
    meta:
      description: The person chooses whether to sign this device out.
      snapshot: The person chooses whether to sign this device out.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Cancels signing out:
        target: '#Profile: Viewing the profile'
      Confirms signing out:
        target: '#Profile: Signing out'
  'Profile: Signing out':
    id: 'Profile: Signing out'
    meta:
      description: Signing out this device is in progress.
      snapshot: Signing out this device is in progress.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      SignedOut:
        target: '#Profile: Viewing the profile'
      Signing out fails:
        target: '#Profile: Sign-out failed'
  'Profile: Sign-out failed':
    id: 'Profile: Sign-out failed'
    meta:
      description: Signing out failed visibly and can be tried again.
      snapshot: Signing out failed visibly and can be tried again.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Tries signing out again:
        target: '#Profile: Signing out'
  'Profile: Editing the profile':
    id: 'Profile: Editing the profile'
    meta:
      routes:
      - '/profile/edit'
      - '/profile/handle'
      - '/profile/avatar'
      description: The person previews an avatar and supplies a username.
      snapshot: The person previews an avatar and supplies a username.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Saves an allowed profile:
        target: '#Profile: Profile saved'
      Saves a taken username:
        target: '#Profile: Username taken'
      Saves a malformed or reserved username:
        target: '#Profile: Username refused'
      Saves too soon after renaming:
        target: '#Profile: Rename wait required'
      Saves the profile offline:
        target: '#Profile: Connection required'
      Cancels editing the profile:
        target: '#Profile: Viewing the profile'
  'Profile: Profile saved':
    id: 'Profile: Profile saved'
    meta:
      description: The saved profile appears on this person’s devices and permitted public surfaces.
      snapshot: The saved profile appears on this person’s devices and permitted public surfaces.
      confidence: assumed
      source:
      - specs/profile/profile-edit.feature:8
      - specs/profile/profile-edit.feature:13
      - specs/profile/profile-edit.feature:18
      - specs/profile/profile-edit.feature:24
      events: []
      gherkin:
      - specs/profile/profile-edit.feature
      checks: []
    'on':
      Edits the profile again:
        target: '#Profile: Editing the profile'
      Returns to their profile:
        target: '#Profile: Viewing the profile'
  'Profile: Username taken':
    id: 'Profile: Username taken'
    meta:
      description: Someone else owns the chosen username; the saved profile is unchanged.
      snapshot: Someone else owns the chosen username; the saved profile is unchanged.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Changes the refused username:
        target: '#Profile: Editing the profile'
  'Profile: Username refused':
    id: 'Profile: Username refused'
    meta:
      description: The chosen username is not allowed; the saved profile is unchanged.
      snapshot: The chosen username is not allowed; the saved profile is unchanged.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Changes the refused username:
        target: '#Profile: Editing the profile'
  'Profile: Rename wait required':
    id: 'Profile: Rename wait required'
    meta:
      description: The next rename is refused until the documented waiting period ends.
      snapshot: The next rename is refused until the documented waiting period ends.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to their profile:
        target: '#Profile: Viewing the profile'
  'Profile: Connection required':
    id: 'Profile: Connection required'
    meta:
      description: Saving the profile needs a connection; the current profile remains visible.
      snapshot: Saving the profile needs a connection; the current profile remains visible.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Connection returns:
        target: '#Profile: Editing the profile'
