id: inspectors
initial: 'Inspectors: Contract inventory'
meta:
  description: Device and component inspection surfaces are visible in the product map, including where their complete observable contract still needs definition.
  confidence: assumed
  source:
  - specs/README.md#product-contract-inventory
  - specs/developer-tools/data-notebook.feature
  - specs/runtime/connected-services.feature
  - specs/profile/devices.feature
  context: developer-tools
  eventKinds:
    Reads sync inspection scope: user
    Reads client configuration scope: user
    Reads performance inspection scope: user
    Reads component exploration scope: user
    Reads individual device scope: user
    Reads the client event placeholder scope: user
    Returns to the inspection inventory: user
states:
  'Inspectors: Contract inventory':
    id: 'Inspectors: Contract inventory'
    meta:
      description: The device inspection and component-reference surfaces are part of the inventory. Choose one to see its purpose, address and missing contract rather than silently omitting it from the map.
      source:
      - specs/README.md#product-contract-inventory
      hints:
      - These are documentation choices in this explorer, not new player navigation or completed acceptance evidence.
    on:
      Reads sync inspection scope:
        target: '#Inspectors: Sync inspection'
      Reads client configuration scope:
        target: '#Inspectors: Client configuration'
      Reads performance inspection scope:
        target: '#Inspectors: Performance inspection'
      Reads component exploration scope:
        target: '#Inspectors: Component reference'
      Reads individual device scope:
        target: '#Inspectors: Individual device'
      Reads the client event placeholder scope:
        target: '#Inspectors: Client event placeholder'
  'Inspectors: Sync inspection':
    id: 'Inspectors: Sync inspection'
    meta:
      description: This device's sync inspection is at /more/sync; /more/server-status is currently a status placeholder. Offline recovery and keeping saved data have contracts; diagnostic controls, status details and their failure outcomes still need their own complete observable contract.
      routes:
      - /more/sync
      - /more/server-status
      source:
      - specs/sync-engine/notes-offline.feature
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
  'Inspectors: Client configuration':
    id: 'Inspectors: Client configuration'
    meta:
      description: The read-only client configuration surface is at /more/client-config. Connected services have contracts; the inspection screen's loading, missing configuration and failure outcomes still need a complete contract.
      route: /more/client-config
      source:
      - specs/runtime/connected-services.feature
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
  'Inspectors: Performance inspection':
    id: 'Inspectors: Performance inspection'
    meta:
      description: The device performance surface is at /more/performance. Its live monitor and metric meanings are present in the implementation but have no complete observable product contract yet.
      route: /more/performance
      source:
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
  'Inspectors: Component reference':
    id: 'Inspectors: Component reference'
    meta:
      description: The component reference is at /ui and an individual component at /ui/:component. Component exploration and team authoring are explicitly awaiting a complete observable contract in the product inventory.
      routes:
      - /ui
      - /ui/:component
      source:
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
  'Inspectors: Individual device':
    id: 'Inspectors: Individual device'
    meta:
      description: An individual account device has address /more/account/device/:deviceId. The owned device list is specified; this detail screen's separate choices and outcomes still need a complete contract.
      route: /more/account/device/:deviceId
      source:
      - specs/profile/devices.feature
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
  'Inspectors: Client event placeholder':
    id: 'Inspectors: Client event placeholder'
    meta:
      description: The /client/events surface is currently a placeholder pointing towards the testing tool. Investigation trails are separately specified; this placeholder has no completed event-inspection workflow to simulate.
      route: /client/events
      source:
      - specs/runtime/request-records.feature
      - specs/README.md#product-contract-inventory
    on:
      Returns to the inspection inventory:
        target: '#Inspectors: Contract inventory'
