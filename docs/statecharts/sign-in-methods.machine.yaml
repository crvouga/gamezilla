# Product behavior projection; authoritative rules remain in specs/.
id: sign-in-methods
initial: 'Sign In Methods: Connected methods'
meta:
  description: A person connects and removes sign-in methods without losing the last way into the account.
  snapshot: A person connects and removes sign-in methods without losing the last way into the account.
  confidence: assumed
  source: &id001
  - specs/profile/sign-in-methods.feature
  events: []
  context: profile
  eventKinds:
    Cancels connecting a method: user
    Cancels method removal: user
    Confirms method removal: user
    Connects a different provider with recent account proof: user
    Connects an already owned or same-provider method: user
    Connects without recent account proof: user
    Proves the current account again: user
    Provider confirms the connected method: system
    Provider refuses connecting the method: system
    Removes a method while another remains: user
    Removes the last method: user
    Returns to connected sign-in methods: user
states:
  'Sign In Methods: Connected methods':
    id: 'Sign In Methods: Connected methods'
    meta:
      routes:
      - '/more/account/providers'
      description: The account’s connected methods are shown.
      snapshot: The account’s connected methods are shown.
      confidence: assumed
      source:
      - specs/profile/sign-in-methods.feature:7
      events: []
      gherkin:
      - specs/profile/sign-in-methods.feature
      checks:
      - Sign-in methods belong to one account and its last sign-in method cannot be removed
    'on':
      Connects a different provider with recent account proof:
        target: '#Sign In Methods: Connecting a method'
      Connects without recent account proof:
        target: '#Sign In Methods: Proof required'
      Connects an already owned or same-provider method:
        target: '#Sign In Methods: Method refused'
      Removes a method while another remains:
        target: '#Sign In Methods: Confirming method removal'
      Removes the last method:
        target: '#Sign In Methods: Last method required'
  'Sign In Methods: Connecting a method':
    id: 'Sign In Methods: Connecting a method'
    meta:
      description: The chosen provider is proving the new method for this account.
      snapshot: The chosen provider is proving the new method for this account.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Provider confirms the connected method:
        target: '#Sign In Methods: Connected methods'
      Provider refuses connecting the method:
        target: '#Sign In Methods: Method refused'
      Cancels connecting a method:
        target: '#Sign In Methods: Connected methods'
  'Sign In Methods: Proof required':
    id: 'Sign In Methods: Proof required'
    meta:
      description: Connecting a method needs recent proof of the current account.
      snapshot: Connecting a method needs recent proof of the current account.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Proves the current account again:
        target: '#Sign In Methods: Connected methods'
  'Sign In Methods: Method refused':
    id: 'Sign In Methods: Method refused'
    meta:
      description: A method cannot move between accounts or replace the same provider’s method.
      snapshot: A method cannot move between accounts or replace the same provider’s method.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to connected sign-in methods:
        target: '#Sign In Methods: Connected methods'
  'Sign In Methods: Confirming method removal':
    id: 'Sign In Methods: Confirming method removal'
    meta:
      description: Removing this method requires confirmation and another connected method.
      snapshot: Removing this method requires confirmation and another connected method.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Confirms method removal:
        target: '#Sign In Methods: Connected methods'
      Cancels method removal:
        target: '#Sign In Methods: Connected methods'
  'Sign In Methods: Last method required':
    id: 'Sign In Methods: Last method required'
    meta:
      description: The last sign-in method stays connected so the person can return.
      snapshot: The last sign-in method stays connected so the person can return.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to connected sign-in methods:
        target: '#Sign In Methods: Connected methods'
