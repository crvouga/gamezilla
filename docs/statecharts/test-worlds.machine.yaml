# Product behavior projection; authoritative rules remain in specs/.
id: test-worlds
initial: 'Test Worlds: Selected device'
meta:
  description: The team selects independent devices, changes their arrangement and saves or restores compatible
    checkpoints.
  snapshot: The team selects independent devices, changes their arrangement and saves or restores compatible checkpoints.
  confidence: assumed
  source: &id001
  - specs/developer-tools/checkpoints.feature
  - specs/developer-tools/test-world-views.feature
  events: []
  context: developer-tools
  eventKinds:
    Cancels checkpoint deletion: user
    Chooses checkpoints for deletion: user
    Confirms checkpoint deletion: user
    Confirms removing incompatible checkpoints: user
    Opens test checkpoints: user
    Restores a compatible checkpoint: user
    Returns to test checkpoints: user
    Returns to the selected test device: user
    Saves the current test world as a checkpoint: user
    Selects an incompatible checkpoint: user
    Selects an unavailable test device: user
    Selects another available test device: user
    Shows one test device: user
    Shows several test devices: user
states:
  'Test Worlds: Selected device':
    id: 'Test Worlds: Selected device'
    meta:
      description: The selected person’s app is shown while other devices keep their own places.
      snapshot: The selected person’s app is shown while other devices keep their own places.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Selects another available test device:
        target: '#Test Worlds: Selected device'
      Selects an unavailable test device:
        target: '#Test Worlds: Selected device'
      Shows several test devices:
        target: '#Test Worlds: Several devices'
      Opens test checkpoints:
        target: '#Test Worlds: Checkpoints'
  'Test Worlds: Several devices':
    id: 'Test Worlds: Several devices'
    meta:
      description: Several people’s devices appear together without acting in their apps.
      snapshot: Several people’s devices appear together without acting in their apps.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Shows one test device:
        target: '#Test Worlds: Selected device'
      Opens test checkpoints:
        target: '#Test Worlds: Checkpoints'
  'Test Worlds: Checkpoints':
    id: 'Test Worlds: Checkpoints'
    meta:
      description: Saved checkpoints identify the test worlds they can restore.
      snapshot: Saved checkpoints identify the test worlds they can restore.
      confidence: assumed
      source:
      - specs/developer-tools/checkpoints.feature:6
      - specs/developer-tools/checkpoints.feature:19
      - specs/developer-tools/checkpoints.feature:27
      - specs/developer-tools/checkpoints.feature:39
      events: []
      gherkin:
      - specs/developer-tools/checkpoints.feature
      checks:
      - A compatible checkpoint restores its saved test world
      - Saving makes the current test world available as a checkpoint
      - Deleting checkpoints requires confirmation
      - Removing incompatible checkpoints keeps compatible checkpoints
    'on':
      Saves the current test world as a checkpoint:
        target: '#Test Worlds: Checkpoints'
      Restores a compatible checkpoint:
        target: '#Test Worlds: Restored world'
      Selects an incompatible checkpoint:
        target: '#Test Worlds: Incompatible checkpoint'
      Chooses checkpoints for deletion:
        target: '#Test Worlds: Confirming checkpoint deletion'
      Confirms removing incompatible checkpoints:
        target: '#Test Worlds: Checkpoints'
  'Test Worlds: Restored world':
    id: 'Test Worlds: Restored world'
    meta:
      description: The compatible checkpoint restored the saved people and their apps.
      snapshot: The compatible checkpoint restored the saved people and their apps.
      confidence: assumed
      source:
      - specs/developer-tools/test-world-views.feature:6
      - specs/developer-tools/test-world-views.feature:20
      events: []
      gherkin:
      - specs/developer-tools/test-world-views.feature
      checks:
      - Choosing a device shows that person's app
      - Changing how people are shown preserves their apps
    'on':
      Returns to the selected test device:
        target: '#Test Worlds: Selected device'
  'Test Worlds: Incompatible checkpoint':
    id: 'Test Worlds: Incompatible checkpoint'
    meta:
      description: This version of the app cannot restore the selected checkpoint.
      snapshot: This version of the app cannot restore the selected checkpoint.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to test checkpoints:
        target: '#Test Worlds: Checkpoints'
  'Test Worlds: Confirming checkpoint deletion':
    id: 'Test Worlds: Confirming checkpoint deletion'
    meta:
      description: Removing selected checkpoints requires confirmation.
      snapshot: Removing selected checkpoints requires confirmation.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Confirms checkpoint deletion:
        target: '#Test Worlds: Checkpoints'
      Cancels checkpoint deletion:
        target: '#Test Worlds: Checkpoints'
