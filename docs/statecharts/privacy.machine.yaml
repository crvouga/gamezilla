# Product behavior projection; authoritative rules remain in specs/.
id: privacy
initial: 'Privacy: Account privacy'
meta:
  description: A person proves their account before exporting personal data or confirming permanent deletion.
  snapshot: A person proves their account before exporting personal data or confirming permanent deletion.
  confidence: assumed
  source: &id001
  - specs/profile/accounts.als
  - specs/profile/privacy-access.dmn
  - specs/profile/account-deletion.feature
  - specs/profile/personal-data-export.feature
  - specs/profile/personal-data-retention.feature
  - specs/profile/account-privacy.qnt
  events: []
  context: profile
  eventKinds:
    Account deletion fails: system
    AccountDeletionConfirmed: system
    Another person tries downloading the export: user
    Cancels permanent account deletion: user
    Confirms permanent account deletion: user
    Connection returns: system
    Downloads the owned export with recent proof online: user
    Membership cancellation completes: system
    Membership cancellation remains pending: system
    Opens the app as a new guest: user
    Preparing the export fails: system
    Proves the current account again: user
    Requests a fresh export with recent proof: user
    Requests a privacy action offline: user
    Requests account privacy as a guest: user
    Requests an export with recent proof online: user
    Requests another export with recent proof: user
    Requests deletion with old proof: user
    Requests deletion with recent proof online: user
    Returns to account privacy: user
    Seven days pass after the export became ready: time
    SignedIn: system
    The complete export becomes ready within twenty-four hours: system
    Tries account deletion again: user
states:
  'Privacy: Account privacy':
    id: 'Privacy: Account privacy'
    meta:
      routes:
      - '/profile/privacy'
      description: Export and deletion choices are available according to account permission.
      snapshot: Export and deletion choices are available according to account permission.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Requests deletion with recent proof online:
        target: '#Privacy: Confirming deletion'
      Requests deletion with old proof:
        target: '#Privacy: Recent proof required'
      Requests an export with recent proof online:
        target: '#Privacy: Preparing an export'
      Requests a privacy action offline:
        target: '#Privacy: Connection required'
      Requests account privacy as a guest:
        target: '#Privacy: Account required'
  'Privacy: Recent proof required':
    id: 'Privacy: Recent proof required'
    meta:
      description: Privacy actions need proof of this account less than ten minutes old.
      snapshot: Privacy actions need proof of this account less than ten minutes old.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Proves the current account again:
        target: '#Privacy: Account privacy'
  'Privacy: Account required':
    id: 'Privacy: Account required'
    meta:
      description: A guest cannot export or delete an account they do not own.
      snapshot: A guest cannot export or delete an account they do not own.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      SignedIn:
        target: '#Privacy: Account privacy'
  'Privacy: Connection required':
    id: 'Privacy: Connection required'
    meta:
      description: Privacy actions need a connection and leave personal data intact.
      snapshot: Privacy actions need a connection and leave personal data intact.
      confidence: assumed
      source:
      - specs/profile/personal-data-retention.feature:6
      - specs/profile/personal-data-retention.feature:19
      - specs/profile/personal-data-retention.feature:32
      events: []
      gherkin:
      - specs/profile/personal-data-retention.feature
      checks:
      - Ordinary personal data is erased within 30 days of confirmed deletion
      - A retention exception has a specific purpose and end condition
      - Active accounts keep their personal data until the person chooses deletion
    'on':
      Connection returns:
        target: '#Privacy: Account privacy'
  'Privacy: Confirming deletion':
    id: 'Privacy: Confirming deletion'
    meta:
      description: The person is choosing whether to permanently delete their account.
      snapshot: The person is choosing whether to permanently delete their account.
      confidence: assumed
      source:
      - specs/profile/account-deletion.feature:6
      - specs/profile/account-deletion.feature:44
      - specs/profile/account-deletion.feature:66
      events: []
      gherkin:
      - specs/profile/account-deletion.feature
      checks:
      - Deletion requires a recently proven account and an explicit confirmation
      - A deleted account cannot be used on another device or recovered by signing in
      - Confirmation explains what ends and what may be retained
    'on':
      Confirms permanent account deletion:
        target: '#Privacy: Deleting the account'
      Cancels permanent account deletion:
        target: '#Privacy: Account privacy'
  'Privacy: Deleting the account':
    id: 'Privacy: Deleting the account'
    meta:
      description: Deletion is in progress; no success is claimed before confirmation.
      snapshot: Deletion is in progress; no success is claimed before confirmation.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      AccountDeletionConfirmed:
        target: '#Privacy: Deletion confirmed'
      Account deletion fails:
        target: '#Privacy: Deletion failed'
  'Privacy: Deletion failed':
    id: 'Privacy: Deletion failed'
    meta:
      description: Deletion failed visibly and the person can try again.
      snapshot: Deletion failed visibly and the person can try again.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Tries account deletion again:
        target: '#Privacy: Confirming deletion'
  'Privacy: Deletion confirmed':
    id: 'Privacy: Deletion confirmed'
    meta:
      description: Personal data is erased and the account cannot return; retained legal records give no access.
      snapshot: Personal data is erased and the account cannot return; retained legal records give no access.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Membership cancellation remains pending:
        target: '#Privacy: Cancellation pending'
      Membership cancellation completes:
        target: '#Privacy: Cancellation complete'
  'Privacy: Cancellation pending':
    id: 'Privacy: Cancellation pending'
    meta:
      description: Future membership charges must stop; the provider cancellation remains pending.
      snapshot: Future membership charges must stop; the provider cancellation remains pending.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Membership cancellation completes:
        target: '#Privacy: Cancellation complete'
  'Privacy: Cancellation complete':
    id: 'Privacy: Cancellation complete'
    meta:
      description: The provider cancellation is complete and the deleted account remains unusable.
      snapshot: The provider cancellation is complete and the deleted account remains unusable.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Opens the app as a new guest:
        target: '#App: Spaces'
  'Privacy: Preparing an export':
    id: 'Privacy: Preparing an export'
    meta:
      description: The owned personal-data export is being prepared.
      snapshot: The owned personal-data export is being prepared.
      confidence: assumed
      source:
      - specs/profile/personal-data-export.feature:6
      - specs/profile/personal-data-export.feature:25
      - specs/profile/personal-data-export.feature:45
      events: []
      gherkin:
      - specs/profile/personal-data-export.feature
      checks:
      - Only the recently proven account can ask for its export
      - An export covers all the person's retained personal data and is ready within 24 hours
      - Downloads belong to the proven account and expire after 7 days
    'on':
      The complete export becomes ready within twenty-four hours:
        target: '#Privacy: Export ready'
      Preparing the export fails:
        target: '#Privacy: Export failed'
  'Privacy: Export ready':
    id: 'Privacy: Export ready'
    meta:
      routes:
      - '/profile/privacy/export/:accountId'
      description: Only the owning account with recent proof can download this complete export.
      snapshot: Only the owning account with recent proof can download this complete export.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Downloads the owned export with recent proof online:
        target: '#Privacy: Export downloaded'
      Seven days pass after the export became ready:
        target: '#Privacy: Export expired'
      Another person tries downloading the export:
        target: '#Privacy: Download refused'
  'Privacy: Download refused':
    id: 'Privacy: Download refused'
    meta:
      description: Another person cannot download this account’s export.
      snapshot: Another person cannot download this account’s export.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to account privacy:
        target: '#Privacy: Account privacy'
  'Privacy: Export downloaded':
    id: 'Privacy: Export downloaded'
    meta:
      description: The person has their complete export without receiving another person’s data.
      snapshot: The person has their complete export without receiving another person’s data.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to account privacy:
        target: '#Privacy: Account privacy'
  'Privacy: Export failed':
    id: 'Privacy: Export failed'
    meta:
      description: The failed export has an explanation and allows another attempt.
      snapshot: The failed export has an explanation and allows another attempt.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Requests another export with recent proof:
        target: '#Privacy: Preparing an export'
  'Privacy: Export expired':
    id: 'Privacy: Export expired'
    meta:
      description: An expired export cannot be downloaded.
      snapshot: An expired export cannot be downloaded.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Requests a fresh export with recent proof:
        target: '#Privacy: Preparing an export'
