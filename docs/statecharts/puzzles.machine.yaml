states:
  'Puzzles: Opening puzzles':
    id: 'Puzzles: Opening puzzles'
    meta:
      description: A permitted start waits for the selected puzzle; unavailable starts explain why.
      snapshot: A permitted start waits for the selected puzzle; unavailable starts explain why.
      confidence: assumed
      source:
      - specs/chess/puzzle-accessibility.feature:6
      - specs/chess/puzzle-accessibility.feature:23
      - specs/chess/puzzle-accessibility.feature:51
      - specs/chess/puzzle-accessibility.feature:61
      - specs/chess/puzzle-limits-by-kind.feature:10
      - specs/chess/puzzle-objective.feature:6
      - specs/chess/puzzle-objective.feature:34
      - specs/chess/puzzle-selection.feature:6
      - specs/chess/puzzle-selection.feature:28
      - specs/chess/puzzle-selection.feature:55
      - specs/chess/puzzle-selection.feature:71
      - specs/chess/puzzle-selection.feature:81
      - specs/chess/puzzle-skip-clock.feature:7
      - specs/chess/puzzle-skip-clock.feature:37
      - specs/chess/puzzle-spectator.feature:12
      - specs/chess/puzzle-spectator.feature:43
      - specs/chess/puzzle-spectator.feature:52
      - specs/chess/puzzle-spectator.feature:68
      events: []
      gherkin:
      - specs/chess/puzzle-accessibility.feature
      - specs/chess/puzzle-limits-by-kind.feature
      - specs/chess/puzzle-objective.feature
      - specs/chess/puzzle-selection.feature
      - specs/chess/puzzle-skip-clock.feature
      - specs/chess/puzzle-spectator.feature
      checks:
      - Someone listening to the app hears the setup move, which side is to move, and each opponent reply
      - 'Someone listening to the app hears each result: a wrong move, a solve, the piece a hint picks, and the
        rating change'
      - A puzzle can be solved with the keyboard alone
      - Retry, hint, show the solution, skip and move on all work with the keyboard alone
      - The daily puzzle limit counts a guest's puzzle starts online and offline and starts again each day
      - Any legal checkmate solves the puzzle immediately
      - An alternate checkmate has the same durable result offline
      - 'The feed never serves a low-quality puzzle: one with a popularity below 50, or played fewer than 5 times'
      - 'While an unplayed puzzle fits the rating window, the next puzzle comes from it: within 100 of the feed
        target for a settled rating, within 200 for a provisional one'
      - With no unplayed puzzle in the rating window, the unplayed puzzle nearest the feed target comes next
      - The next puzzle is chosen around the puzzle rating after the last result
      - A puzzle played on one of the solver's devices is not served on their other device
      - A skipped puzzle is over, and the clock counts only time spent solving
      - Time taken never changes the puzzle rating
      - Only the host drives the puzzle, and only the host may move on
      - Only the host is rated for the puzzle
      - A watcher's view follows the host, on the board and off it
      - A suggestion is seen, and the host's move clears it
    'on':
      The puzzle becomes ready:
        target: '#Puzzles: Solving'
      Opens puzzles offline with no saved puzzle:
        target: '#Puzzles: Connection required'
      Resumes an unfinished saved puzzle:
        target: '#Puzzles: Solving'
      The saved attempt has a wrong-move result:
        target: '#Puzzles: Wrong move'
      The saved attempt is solved:
        target: '#Puzzles: Solved'
      The saved attempt was skipped:
