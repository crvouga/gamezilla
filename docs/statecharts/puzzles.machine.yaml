      The guest’s twenty rated starts are used today:
        target: '#Puzzles: Daily allowance reached'
      No suitable puzzle is available:
        target: '#Puzzles: No matching puzzle'
  'Puzzles: Solving':
    id: 'Puzzles: Solving'
    meta:
      description: Only the host drives this puzzle and is rated for it; its assistant, sound and visible remaining
        allowance belong to this attempt.
      snapshot: Only the host drives this puzzle and is rated for it; its assistant, sound and visible remaining
        allowance belong to this attempt.
      confidence: assumed
      source:
      - specs/chess/puzzle-assistant-accessibility.feature:6
      - specs/chess/puzzle-assistant-accessibility.feature:42
      - specs/chess/puzzle-assistant-context.feature:6
      - specs/chess/puzzle-assistant-context.feature:41
      - specs/chess/puzzle-assistant-context.feature:80
      - specs/chess/puzzle-assistant-context.feature:99
      - specs/chess/puzzle-assistant.feature:6
      - specs/chess/puzzle-assistant.feature:28
      - specs/chess/puzzle-assistant.feature:54
      - specs/chess/puzzle-assistant.feature:69
      - specs/chess/puzzle-attempt-resume.feature:10
      - specs/chess/puzzle-attempt-resume.feature:32
      - specs/chess/puzzle-attempt-resume.feature:46
      - specs/chess/puzzle-attempt-resume.feature:55
      - specs/chess/puzzle-attempt-resume.feature:63
      - specs/chess/puzzle-sound.feature:6
      - specs/chess/puzzle-sound.feature:71
      - specs/chess/puzzle-sound.feature:115
      events: []
      gherkin:
      - specs/chess/puzzle-assistant-accessibility.feature
      - specs/chess/puzzle-assistant-context.feature
      - specs/chess/puzzle-assistant.feature
      - specs/chess/puzzle-attempt-resume.feature
      - specs/chess/puzzle-sound.feature
      checks:
      - The assistant's observation is available without speech
      - Speech never hides required words or delays a move
      - Replacing the position replaces its commentary and interrupts its speech
      - Commentary belongs to the position being examined
      - An opponent reply cannot be described as the solver needing to escape check
      - Position review preserves completed play and can return to unfinished play
      - The assistant acknowledges what actually happened
      - Specific observations require proof from the position
      - The assistant gives one most useful observation
      - Help never changes the attempt's first result
      - An unfinished puzzle is the one waiting when the solver comes back
      - Moving on advances exactly one puzzle and works with no connection
      - Auto-advance moves on by itself after a solve
      - Going back from the chess choices reaches the game choice
      - Reopening keeps the board and its result until the solver moves on
      - Puzzle moves and captures follow the app's sounds preference
      - Sound changes preserve the puzzle and apply to its next move
      - A review's forward move follows the same app sounds preference
