# Product behavior projection; authoritative rules remain in specs/.
id: notes
initial: 'Notes: Notes'
meta:
  description: The framework example keeps owned and shared notes across offline work, conflicts, deletion and refused
    edits.
  snapshot: The framework example keeps owned and shared notes across offline work, conflicts, deletion and refused
    edits.
  confidence: assumed
  source: &id001
  - specs/sync-engine/note-delivery.openslo.yaml
  - specs/sync-engine/a-long-time-offline.feature
  - specs/sync-engine/checked-notes.feature
  - specs/sync-engine/note-conflicts.feature
  - specs/sync-engine/note-deleting.feature
  - specs/sync-engine/note-refused-edits.feature
  - specs/sync-engine/note-writing.feature
  - specs/sync-engine/notes-across-app-updates.feature
  - specs/sync-engine/notes-across-devices.feature
  - specs/sync-engine/notes-after-a-crash.feature
  - specs/sync-engine/notes-arrive-quickly.feature
  - specs/sync-engine/notes-offline.feature
  - specs/sync-engine/notes-saved-once.feature
  - specs/sync-engine/online-only-actions.feature
  - specs/sync-engine/shared-space-membership.feature
  - specs/sync-engine/note-conflicts.qnt
  - specs/sync-engine/note-recovery.qnt
  - specs/sync-engine/note-refusal-recovery.qnt
  - specs/sync-engine/note-replication.qnt
  events: []
  context: sync-engine
  eventKinds:
    An earlier copy arrives: system
    Another allowed edit wins the conflict: system
    Attempts an online-only action offline: user
    Attempts an unauthorised note edit: user
    Concurrent allowed edits are resolved: system
    Connection returns: system
    Connection returns and accepts the note: system
    Connection returns and refuses the edit: system
    Edits the note offline: user
    Edits the note online: user
    Loses shared-note membership: user
    Reads a permitted shared note: user
    Removes the note: user
    Removes the offline note: user
    Reopens after an app update or crash: user
    Returns after a long time offline: user
    Returns to owned notes: user
    Returns to the permitted notes: user
    Writes an allowed note offline: user
    Writes an allowed note online: user
    Writes another allowed note: user
states:
  'Notes: Notes':
    id: 'Notes: Notes'
    meta:
      description: The person sees notes within their own or permitted shared scope.
      snapshot: The person sees notes within their own or permitted shared scope.
      confidence: assumed
      source:
      - specs/sync-engine/checked-notes.feature:8
      - specs/sync-engine/checked-notes.feature:21
      - specs/sync-engine/notes-after-a-crash.feature:6
      - specs/sync-engine/notes-arrive-quickly.feature:7
      - specs/sync-engine/online-only-actions.feature:8
      events: []
      gherkin:
      - specs/sync-engine/checked-notes.feature
      - specs/sync-engine/notes-after-a-crash.feature
      - specs/sync-engine/notes-arrive-quickly.feature
      - specs/sync-engine/online-only-actions.feature
      checks:
      - A checked note shows at once, is saving until it is kept for everyone, and is then saved
      - A checked note that breaks the rule is refused and goes back to what it said before
      - A note already shown on a device survives the app closing unexpectedly
      - A shared note reaches the other people within moments
      - An online-only action is refused offline and never happens later on its own
    'on':
      Writes an allowed note online:
        target: '#Notes: Saved note'
      Writes an allowed note offline:
        target: '#Notes: Offline note'
      Reads a permitted shared note:
        target: '#Notes: Saved note'
      Attempts an unauthorised note edit:
        target: '#Notes: Edit refused'
      Attempts an online-only action offline:
        target: '#Notes: Connection required'
  'Notes: Saved note':
    id: 'Notes: Saved note'
    meta:
      description: The latest allowed note is visible across the person’s permitted devices.
      snapshot: The latest allowed note is visible across the person’s permitted devices.
      confidence: assumed
      source:
      - specs/sync-engine/note-conflicts.feature:10
      - specs/sync-engine/note-conflicts.feature:35
      - specs/sync-engine/note-deleting.feature:10
      - specs/sync-engine/note-deleting.feature:26
      - specs/sync-engine/note-refused-edits.feature:8
      - specs/sync-engine/note-refused-edits.feature:20
      - specs/sync-engine/note-refused-edits.feature:37
      - specs/sync-engine/notes-across-app-updates.feature:7
      - specs/sync-engine/notes-across-app-updates.feature:19
      - specs/sync-engine/notes-across-app-updates.feature:35
      - specs/sync-engine/notes-across-app-updates.feature:50
      - specs/sync-engine/notes-across-devices.feature:7
      - specs/sync-engine/notes-saved-once.feature:6
      events: []
      gherkin:
      - specs/sync-engine/note-conflicts.feature
      - specs/sync-engine/note-deleting.feature
      - specs/sync-engine/note-refused-edits.feature
      - specs/sync-engine/notes-across-app-updates.feature
      - specs/sync-engine/notes-across-devices.feature
      - specs/sync-engine/notes-saved-once.feature
      checks:
      - Hearing back about an earlier save preserves the note's later state
      - Signing back in preserves shared writing and forgets unsent writing from the ended sign-in
      - A note deleted by whoever owns it disappears for everyone
      - A deleted note written again comes back for everyone
      - A refused edit is undone and never reaches anyone else
      - The author of a refused edit is told until they acknowledge it
      - A notice stays until it is acknowledged, whatever happens to the app
      - An update keeps every note, even an update that fetches every note again
      - Going back to an earlier version keeps every note and stays connected
      - Going back to an earlier version keeps what the newer version gave notes
      - People on different versions keep in step, and nothing a newer version adds is lost
      - A person's devices all show their notes once they have a connection
      - A note shows exactly once however many times the app has to save it
    'on':
      Edits the note online:
        target: '#Notes: Saved note'
      Edits the note offline:
        target: '#Notes: Offline note'
      Removes the note:
        target: '#Notes: Removed note'
      Concurrent allowed edits are resolved:
        target: '#Notes: Saved note'
      Reopens after an app update or crash:
        target: '#Notes: Saved note'
      Loses shared-note membership:
        target: '#Notes: Scope ended'
  'Notes: Offline note':
    id: 'Notes: Offline note'
    meta:
      description: The person sees their allowed offline writing without waiting for another device.
      snapshot: The person sees their allowed offline writing without waiting for another device.
      confidence: assumed
      source:
      - specs/sync-engine/a-long-time-offline.feature:7
      - specs/sync-engine/note-writing.feature:7
      - specs/sync-engine/note-writing.feature:18
      - specs/sync-engine/note-writing.feature:25
      - specs/sync-engine/note-writing.feature:44
      - specs/sync-engine/note-writing.feature:55
      - specs/sync-engine/notes-offline.feature:11
      events: []
      gherkin:
      - specs/sync-engine/a-long-time-offline.feature
      - specs/sync-engine/note-writing.feature
      - specs/sync-engine/notes-offline.feature
      checks:
      - Notes filed offline in new folders all arrive in those folders
      - A note shows on its writer's device at once and is kept
      - A note reaches everyone it is shared with
      - A change to many notes at once reaches everyone
      - A note never shows without its text
      - A note never goes back to what it said before
      - A note written offline shows at once for its writer and reaches others later
    'on':
      Connection returns and accepts the note:
        target: '#Notes: Saved note'
      Connection returns and refuses the edit:
        target: '#Notes: Edit refused'
      Another allowed edit wins the conflict:
        target: '#Notes: Saved note'
      Removes the offline note:
        target: '#Notes: Removed note'
      Returns after a long time offline:
        target: '#Notes: Offline note'
  'Notes: Removed note':
    id: 'Notes: Removed note'
    meta:
      description: Removed notes do not reappear through late changes, another device or an app update.
      snapshot: Removed notes do not reappear through late changes, another device or an app update.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Writes another allowed note:
        target: '#Notes: Saved note'
      An earlier copy arrives:
        target: '#Notes: Removed note'
  'Notes: Edit refused':
    id: 'Notes: Edit refused'
    meta:
      description: The refusal explains why the attempted edit cannot become shared truth.
      snapshot: The refusal explains why the attempted edit cannot become shared truth.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the permitted notes:
        target: '#Notes: Notes'
  'Notes: Connection required':
    id: 'Notes: Connection required'
    meta:
      description: This action needs a connection; ordinary permitted offline writing remains available.
      snapshot: This action needs a connection; ordinary permitted offline writing remains available.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Connection returns:
        target: '#Notes: Notes'
  'Notes: Scope ended':
    id: 'Notes: Scope ended'
    meta:
      description: Leaving or losing shared membership prevents later shared notes being seen.
      snapshot: Leaving or losing shared membership prevents later shared notes being seen.
      confidence: assumed
      source:
      - specs/sync-engine/shared-space-membership.feature:9
      events: []
      gherkin:
      - specs/sync-engine/shared-space-membership.feature
      checks:
      - Leaving a shared space keeps earlier notes and stops later notes until the person rejoins
    'on':
      Returns to owned notes:
        target: '#Notes: Notes'
