# Product behavior projection; authoritative rules remain in specs/.
id: matchmaking
initial: 'Matchmaking: Not waiting'
meta:
  description: A person maintains one wait, compatible rating ranges and a durable complete-group outcome.
  snapshot: A person maintains one wait, compatible rating ranges and a durable complete-group outcome.
  confidence: assumed
  source: &id001
  - specs/matchmaking/searches.als
  - specs/matchmaking/availability-and-details.feature
  - specs/matchmaking/being-matched.feature
  - specs/matchmaking/changing-ranges.feature
  - specs/matchmaking/competing-waits.feature
  - specs/matchmaking/complete-groups.feature
  - specs/matchmaking/lasting-outcomes.feature
  - specs/matchmaking/pair-restrictions.feature
  - specs/matchmaking/rating-ranges.feature
  - specs/matchmaking/search-identity.feature
  - specs/matchmaking/waiting-for-a-match.feature
  - specs/matchmaking/waits-after-time-away.feature
  - specs/matchmaking/events.qnt
  - specs/matchmaking/matching.qnt
  events: []
  context: matchmaking
  eventKinds:
    A blocked or incompatible person is considered: system
    Begins another allowed wait: user
    Cancels the current wait: user
    Changes a valid matchmaking range: user
    Changes an invalid matchmaking range: user
    Connection returns to the accepted wait: system
    Connection returns to the complete match: system
    Corrects the matchmaking range: user
    Loses connection while waiting: system
    MatchFormed: system
    Only an incomplete group is available: system
    Opens the matched chess game: user
    Repeats the accepted wait from another device: user
    Returns after time away to the lasting match: user
    Returns after time away with a live wait: user
    Returns to matchmaking choices: user
    Starts a wait without permission or connection: user
    Starts an allowed matchmaking wait: user
    The growing rating range advances one second: time
    The person becomes unavailable: user
    Tries starting a second wait while already waiting: user
    Tries stopping an earlier wait after a new wait was accepted: user
    Tries stopping or changing the wait offline: user
states:
  'Matchmaking: Not waiting':
    id: 'Matchmaking: Not waiting'
    meta:
      description: No matchmaking wait is active for this person.
      snapshot: No matchmaking wait is active for this person.
      confidence: assumed
      source:
      - specs/matchmaking/availability-and-details.feature:7
      - specs/matchmaking/availability-and-details.feature:26
      - specs/matchmaking/availability-and-details.feature:40
      - specs/matchmaking/availability-and-details.feature:57
      - specs/matchmaking/being-matched.feature:7
      - specs/matchmaking/being-matched.feature:27
      - specs/matchmaking/waiting-for-a-match.feature:8
      - specs/matchmaking/waiting-for-a-match.feature:27
      - specs/matchmaking/waits-after-time-away.feature:7
      - specs/matchmaking/waits-after-time-away.feature:16
      - specs/matchmaking/waits-after-time-away.feature:43
      - specs/matchmaking/waits-after-time-away.feature:60
      events: []
      gherkin:
      - specs/matchmaking/availability-and-details.feature
      - specs/matchmaking/being-matched.feature
      - specs/matchmaking/waiting-for-a-match.feature
      - specs/matchmaking/waits-after-time-away.feature
      checks:
      - Becoming unavailable ends a wait without undoing a match
      - Becoming available again requires a new request to wait
      - Waiting details are private until people are matched
      - Different matching pools never pair people together
      - Two people are matched only when each accepts the other
      - A person can change their range while they are waiting
      - A person waits for one match at a time
      - A person can stop waiting until they are matched
      - Losing a connection keeps the device's last known wait
      - Waiting, stopping and changing a range need a connection
      - Losing a connection does not stop an accepted wait
      - Returning shows the accepted outcome of the wait
    'on':
      Starts an allowed matchmaking wait:
        target: '#Matchmaking: Waiting'
      Starts a wait without permission or connection:
        target: '#Matchmaking: Wait refused'
  'Matchmaking: Waiting':
    id: 'Matchmaking: Waiting'
    meta:
      description: The current wait has the chosen search identity and compatible rating range; a second request
        cannot replace it.
      snapshot: The current wait has the chosen search identity and compatible rating range; a second request cannot
        replace it.
      confidence: assumed
      source:
      - specs/matchmaking/changing-ranges.feature:6
      - specs/matchmaking/changing-ranges.feature:20
      - specs/matchmaking/changing-ranges.feature:34
      - specs/matchmaking/changing-ranges.feature:48
      - specs/matchmaking/rating-ranges.feature:7
      - specs/matchmaking/rating-ranges.feature:22
      - specs/matchmaking/rating-ranges.feature:47
      - specs/matchmaking/search-identity.feature:6
      - specs/matchmaking/search-identity.feature:19
      - specs/matchmaking/search-identity.feature:34
      - specs/matchmaking/search-identity.feature:53
      events: []
      gherkin:
      - specs/matchmaking/changing-ranges.feature
      - specs/matchmaking/rating-ranges.feature
      - specs/matchmaking/search-identity.feature
      checks:
      - A narrower range counts before the next pairing
      - Repeating an earlier range change keeps the latest accepted choice
      - A change for an earlier wait never changes the new wait
      - Choosing a growing range again keeps the age of the same wait
      - The edge of each person's range is accepted
      - A growing range starts at 50 points, grows 10 points each second and stops at 400 points
      - A new wait starts its range from the beginning
      - Asking from another device does not replace a wait
      - Stopping an earlier wait never stops a later wait
      - Repeating an earlier request keeps its earlier outcome
      - Only the person waiting can stop or change that wait
    'on':
      Changes a valid matchmaking range:
        target: '#Matchmaking: Waiting'
      Changes an invalid matchmaking range:
        target: '#Matchmaking: Range refused'
      Tries starting a second wait while already waiting:
        target: '#Matchmaking: Waiting'
      Repeats the accepted wait from another device:
        target: '#Matchmaking: Waiting'
      Tries stopping an earlier wait after a new wait was accepted:
        target: '#Matchmaking: Waiting'
      The person becomes unavailable:
        target: '#Matchmaking: Not waiting'
      Cancels the current wait:
        target: '#Matchmaking: Not waiting'
      MatchFormed:
        target: '#Matchmaking: Complete match'
      Only an incomplete group is available:
        target: '#Matchmaking: Waiting'
      The growing rating range advances one second:
        target: '#Matchmaking: Waiting'
      Loses connection while waiting:
        target: '#Matchmaking: Last known wait'
      A blocked or incompatible person is considered:
        target: '#Matchmaking: Waiting'
      Returns after time away with a live wait:
        target: '#Matchmaking: Waiting'
  'Matchmaking: Last known wait':
    id: 'Matchmaking: Last known wait'
    meta:
      description: Losing connection keeps the device’s last known wait and does not stop the accepted wait.
      snapshot: Losing connection keeps the device’s last known wait and does not stop the accepted wait.
      confidence: assumed
      source:
      - specs/matchmaking/lasting-outcomes.feature:6
      - specs/matchmaking/lasting-outcomes.feature:19
      - specs/matchmaking/lasting-outcomes.feature:32
      events: []
      gherkin:
      - specs/matchmaking/lasting-outcomes.feature
      checks:
      - Waiting has no time limit
      - A formed matchmaking match keeps the same identity and people
      - A person who is unavailable cannot start a wait
    'on':
      Tries stopping or changing the wait offline:
        target: '#Matchmaking: Last known wait'
      Connection returns to the accepted wait:
        target: '#Matchmaking: Waiting'
      Connection returns to the complete match:
        target: '#Matchmaking: Complete match'
  'Matchmaking: Wait refused':
    id: 'Matchmaking: Wait refused'
    meta:
      description: A missing permission, connection or competing game prevents this wait.
      snapshot: A missing permission, connection or competing game prevents this wait.
      confidence: assumed
      source:
      - specs/matchmaking/competing-waits.feature:6
      - specs/matchmaking/competing-waits.feature:21
      - specs/matchmaking/competing-waits.feature:36
      - specs/matchmaking/competing-waits.feature:57
      events: []
      gherkin:
      - specs/matchmaking/competing-waits.feature
      checks:
      - Earlier compatible waits have the first opportunity to be matched
      - A completed match uses each wait once
      - Stopping first prevents a match and being matched first keeps the match
      - Starting a later wait does not change an earlier match
    'on':
      Returns to matchmaking choices:
        target: '#Matchmaking: Not waiting'
  'Matchmaking: Range refused':
    id: 'Matchmaking: Range refused'
    meta:
      description: An invalid range leaves the current wait unchanged.
      snapshot: An invalid range leaves the current wait unchanged.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Corrects the matchmaking range:
        target: '#Matchmaking: Waiting'
  'Matchmaking: Complete match':
    id: 'Matchmaking: Complete match'
    meta:
      description: Every required participant has the same lasting complete match; no partial group is claimed.
      snapshot: Every required participant has the same lasting complete match; no partial group is claimed.
      confidence: assumed
      source:
      - specs/matchmaking/complete-groups.feature:7
      - specs/matchmaking/complete-groups.feature:20
      - specs/matchmaking/pair-restrictions.feature:6
      - specs/matchmaking/pair-restrictions.feature:19
      - specs/matchmaking/pair-restrictions.feature:32
      events: []
      gherkin:
      - specs/matchmaking/complete-groups.feature
      - specs/matchmaking/pair-restrictions.feature
      checks:
      - Every person in a group accepts every other person in it
      - A match has exactly the number of people each person asked for
      - People who cannot be matched together never form a new match
      - Removing a restriction permits waiting people to match
      - A new restriction does not undo a match already formed
    'on':
      Opens the matched chess game:
        target: '#Multiplayer: Playing multiplayer'
      Returns after time away to the lasting match:
        target: '#Matchmaking: Complete match'
      Begins another allowed wait:
        target: '#Matchmaking: Waiting'
