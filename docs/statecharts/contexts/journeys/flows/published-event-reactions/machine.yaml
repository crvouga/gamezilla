        meta:
          source:
          - specs/billing/events.qnt
          - specs/README.md:1112
          confidence: assumed
      SpaceOpened:
        target: Seeing an open space becomes visible only to people entitled to find it
        meta:
          source:
          - specs/spaces/events.qnt
          - specs/README.md:1112
          confidence: assumed
      PersonJoined:
        target: Seeing current presence changes for people who can view that space
        meta:
          source:
          - specs/spaces/events.qnt
          - specs/README.md:1112
          confidence: assumed
      PersonLeft:
        target: Seeing the person no longer appears as present in that space
        meta:
          source:
          - specs/spaces/events.qnt
          - specs/README.md:1112
          confidence: assumed
      SpaceEnded:
        target: Seeing the ended space is removed from live choices and an open participant view shows it ended
        meta:
          source:
          - specs/spaces/events.qnt
          - specs/README.md:1112
          confidence: assumed
      BecameFriends:
        target: Seeing the new friendship appears and may make a friend’s open space discoverable
        meta:
          source:
          - specs/friends/events.qnt
          - specs/README.md:1112
          confidence: assumed
