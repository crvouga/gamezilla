id: journeys-published-event-reactions
initial: Viewing Journeys with current information
meta:
  context: Journeys
  kind: flow
  owner: Journeys owner (not named in specs)
  tier: critical
  emits: []
  reactsTo:
  - SignedIn
  - SignedOut
  - UsernameChanged
  - PaidAccessStarted
  - PaidAccessEnded
  - SpaceOpened
  - PersonJoined
  - PersonLeft
  - SpaceEnded
  - BecameFriends
  - FriendshipEnded
  reviewStatus: draft; owner approval and execution adapters pending
  scope: Boundary contract reception; per-screen interruption outcomes remain owner review questions.
states:
  Viewing Journeys with current information:
    meta:
      description: The person is using a Journeys surface.
      snapshot: the-person-is-using-a-journeys-surface
      recognize: []
      checks:
      - The person is using a Journeys surface.
      events: []
      confidence: assumed
      source:
      - specs/README.md:1100
    'on':
      SignedIn:
        target: Seeing account-bound choices become available only where the current permission decision allows
          them
        meta:
          source:
          - specs/profile/events.qnt
          - specs/README.md:1112
          confidence: assumed
      SignedOut:
        target: Seeing account-only choices are denied and the person sees the current identity
        meta:
          source:
          - specs/profile/events.qnt
          - specs/README.md:1112
          confidence: assumed
      UsernameChanged:
        target: Seeing the person’s current name replaces their earlier name on affected public surfaces
        meta:
          source:
          - specs/profile/events.qnt
          - specs/README.md:1112
          confidence: assumed
      PaidAccessStarted:
        target: Seeing the next permission decision recognizes paid access
        meta:
          source:
          - specs/billing/events.qnt
          - specs/README.md:1112
          confidence: assumed
      PaidAccessEnded:
