journeys:
  A guest plays a move against a bot and resigns:
    description: A guest plays a move against a bot and resigns
    startingConditions:
    - a person opens the app on a fresh device
    - they are hosting a space
    events:
    - they start a Custom Game against a bot
    - they play e2-e4 in the Custom Game
    - they resign the Custom Game
    endsIn: their Custom Game is completed by resignation — 1 step 3
    checks:
    - their Custom Game is completed by resignation
    gherkin:
    - specs/journeys/custom-game.feature:9 — A guest plays a move against a bot and resigns
    exampleRow: []
  An offline guest cannot start the ready game:
    description: An offline guest cannot start the ready game
    startingConditions:
    - a person opens the app on a fresh device
    - they are hosting a space
    - they have a ready Custom Game against a bot
    - the device is offline
    events:
    - they start the Custom Game
    endsIn: they are told Custom Games need a connection — 2
    checks:
    - they are told Custom Games need a connection
    - their Custom Game has not started
    gherkin:
    - specs/journeys/custom-game.feature:21 — An offline guest cannot start the ready game
    exampleRow: []
  Someone who joined from the link accepts an invitation and becomes ready:
    description: Someone who joined from the link accepts an invitation and becomes ready
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    events:
    - Alice invites Bob to Black in a new Custom Game
    - Bob accepts Black in the Custom Game
    - Alice and Bob become ready for the Custom Game
    endsIn: The Custom Game is startable — 3 step 3
    checks:
    - The Custom Game is startable
    gherkin:
    - specs/journeys/custom-game.feature:32 — Someone who joined from the link accepts an invitation and becomes
      ready
    exampleRow: []
  Two people play a move and finish by resignation:
    description: Two people play a move and finish by resignation
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Alice and Bob are ready for a Custom Game with Bob as Black
    events:
    - Alice starts the Custom Game
    - Alice plays e2-e4 in the Custom Game
    - Bob resigns the Custom Game
    endsIn: both people see Alice wins the Custom Game by resignation — 4 step 3
    checks:
    - both people see Alice wins the Custom Game by resignation
    gherkin:
    - specs/journeys/custom-game.feature:41 — Two people play a move and finish by resignation
    exampleRow: []
