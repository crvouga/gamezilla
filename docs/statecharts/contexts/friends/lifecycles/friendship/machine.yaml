  Opening friendship:
    meta:
      description: The person is opening the friendship view.
      snapshot: the-person-is-opening-the-friendship-view
      recognize: []
      checks:
      - No final outcome is claimed before the opening result.
      events: []
      confidence: assumed
      source:
      - specs/friends/friendship.qnt
    'on':
      Opens with viewing a person to ask:
        target: Viewing a person to ask
        meta:
          action: init
          witness:
            trace: friends--friendship_16.itf.json
            step: 0
            seed: 42
          source:
          - specs/friends/friendship.qnt:104
  Viewing a person to ask:
    meta:
      description: The person is viewing a person to ask.
      snapshot: the-person-is-viewing-a-person-to-ask
      recognize: []
      checks:
      - Friendship is mutual, and connected friends see the same relationship.
      - A sent request is received on the other side once both are connected.
      - A blocked person cannot find the blocker once their connection returns.
      - Connected people see every change made while they were away.
      - An offline person keeps their last known relationships until returning.
      - A block leaves no friendship and no friend request between the two.
      - A friend request declined today is not still waiting.
      - With no connection, a person asks, answers, removes and blocks no further time. Their last known relationships
        remain available.
      events: []
      confidence: assumed
      source:
      - specs/friends/friendship.qnt
      quintPredicates:
      - friendshipStatus.get(("alice","bob")):
        - Stranger
        - []
        declined.contains(("alice","bob")): false
      invariants:
      - invFriendsBothWays
      - invRequestsPair
      - invBlockedCannotFind
      - invConnectedRelationshipsAgree
      - invOfflineKeepsLastKnown
      - invBlockEndsTies
      - invDeclinedIsNotWaiting
      - invOfflineDoesNoMore
      projectionReview: Confirm that omitted data do not enable an impossible stitched path.
