journeys:
  A friend's new name appears in an open friends list:
    description: A friend's new name appears in an open friends list
    startingConditions:
    - Alice and Bob are friends
    - Alice is viewing their friends list with Bob in it
    events:
    - Bob renames themselves to @robert_1
    endsIn: Alice sees @robert_1 appear in their friends list within 15 seconds — 1
    checks:
    - Alice sees @robert_1 appear in their friends list within 15 seconds
    - '@bob is gone from Alice''s open friends list'
    gherkin:
    - specs/friends/friends-profile-changes.feature:10 — A friend's new name appears in an open friends list
    exampleRow: []
  Search finds a renamed person by the new name:
    description: Search finds a renamed person by the new name
    startingConditions:
    - Alice and Bob are signed in
    - Bob has renamed themselves to @robert_1
    events:
    - Alice searches for 'robert_1'
    endsIn: Alice's search shows @robert_1 — 2
    checks:
    - Alice's search shows @robert_1
    gherkin:
    - specs/friends/friends-profile-changes.feature:17 — Search finds a renamed person by the new name
    exampleRow: []
  Search no longer finds a renamed person by the old name:
    description: Search no longer finds a renamed person by the old name
    startingConditions:
    - Alice and Bob are signed in
    - Bob has renamed themselves to @robert_1
    events:
    - Alice searches for 'bob'
    endsIn: Alice's search shows nobody — 3
    checks:
    - Alice's search shows nobody
    gherkin:
    - specs/friends/friends-profile-changes.feature:23 — Search no longer finds a renamed person by the old name
    exampleRow: []
  A friend whose username the team stops allowing is listed under a stand-in name:
    description: A friend whose username the team stops allowing is listed under a stand-in name
    startingConditions:
    - Alice and Bob are friends
    - Bob has renamed themselves to @chess_cheater
    - Alice is viewing their friends list with Bob in it
    events:
    - the team stops allowing the username @chess_cheater
    endsIn: Alice's friends list shows Bob under a stand-in name within 15 seconds — 4
    checks:
    - Alice's friends list shows Bob under a stand-in name within 15 seconds
    - Alice's friends list does not show @chess_cheater
    gherkin:
    - specs/friends/friends-profile-changes.feature:35 — A friend whose username the team stops allowing is listed
      under a stand-in name
    exampleRow: []
  Search does not find a person by a username that is no longer allowed:
    description: Search does not find a person by a username that is no longer allowed
    startingConditions:
    - Alice and Bob are friends
    - Bob has renamed themselves to @chess_cheater
    - the team has stopped allowing the username @chess_cheater
    events:
    - Alice searches for 'chess_cheater'
    endsIn: Alice cannot find Bob by @chess_cheater — 5
    checks:
    - Alice cannot find Bob by @chess_cheater
    gherkin:
    - specs/friends/friends-profile-changes.feature:41 — Search does not find a person by a username that is no
      longer allowed
    exampleRow: []
