journeys:
  Someone stops showing as there after losing the connection:
    description: Someone stops showing as there after losing the connection
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    events:
    - Bob loses the connection when Alice is hosting a space that Bob joined from the link
    endsIn: Alice sees 1 person in the space within 20 seconds — 1
    checks:
    - Alice sees 1 person in the space within 20 seconds
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:12 — Someone stops showing as there after losing the connection
    exampleRow: []
  Leaving after coming back leaves no trace:
    description: Leaving after coming back leaves no trace
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Bob has come back to the space after closing the app
    events:
    - Bob leaves the space
    endsIn: Alice sees 1 person in the space within 20 seconds — 2
    checks:
    - Alice sees 1 person in the space within 20 seconds
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:16 — Leaving after coming back leaves no trace
    exampleRow: []
  Someone whose connection comes back is there once:
    description: Someone whose connection comes back is there once
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Bob has lost the connection long enough to drop out of the space
    events:
    - the connection comes back when Alice is hosting a space that Bob joined from the link and Bob has lost the
      connection long enough to drop out of the space
    endsIn: Alice sees 2 people in the space within 20 seconds — 3
    checks:
    - Alice sees 2 people in the space within 20 seconds
    - Bob sees 2 people in the space within 20 seconds
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:23 — Someone whose connection comes back is there once
    exampleRow: []
  Closing the app and coming back returns Bob to the space once:
    description: Closing the app and coming back returns Bob to the space once
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Bob has closed and reopened the app
    events:
    - Bob opens the space link again
    endsIn: Bob is in the space — 4
    checks:
    - Bob is in the space
    - Alice sees 2 people in the space within 20 seconds
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:29 — Closing the app and coming back returns Bob to the space
      once
    exampleRow: []
  Someone offline when the space ends learns it ended once back online:
    description: Someone offline when the space ends learns it ended once back online
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    - Bob has lost the connection long enough to drop out of the space
    - Alice has ended the space
    events:
    - the connection comes back when Alice is hosting a space that Bob joined from the link and Bob has lost the
      connection long enough to drop out of the space and Alice has ended the space
    endsIn: Bob sees the space has ended within 20 seconds — 5
    checks:
    - Bob sees the space has ended within 20 seconds
    - Bob is not offered to join
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:37 — Someone offline when the space ends learns it ended once
      back online
    exampleRow: []
  Someone away does not see old presence as current:
    description: Someone away does not see old presence as current
    startingConditions:
    - Alice is hosting a space that Bob joined from the link
    events:
    - Bob loses the connection when Alice is hosting a space that Bob joined from the link
    endsIn: Alice sees 1 person in the space within 20 seconds — 1
    checks:
    - Bob sees 0 people in the space within 20 seconds
    gherkin:
    - specs/spaces/space-disconnect-reconnect.feature:48 — Someone away does not see old presence as current
    exampleRow: []
