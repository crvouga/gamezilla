    events:
    - Bob opens a link to a space that does not exist
    endsIn: Bob is told the space cannot be found within 15 seconds — 2
    checks:
    - Bob is told the space cannot be found within 15 seconds
    - Bob is offered the way back to Spaces
    gherkin:
