    exampleRow: []
  Someone who stepped out returns to the space once:
    description: Someone who stepped out returns to the space once
    startingConditions:
    - Alice and Bob are friends
    - Alice is hosting a space that Bob joined from the lobby
    - Bob has gone back to the lobby
    events:
    - Bob joins Alice's space from the lobby
    endsIn: Bob is in the space — 3
    checks:
    - Bob is in the space
    - Alice sees 2 people in the space within 20 seconds
    gherkin:
    - specs/spaces/space-links.feature:23 — Someone who stepped out returns to the space once
