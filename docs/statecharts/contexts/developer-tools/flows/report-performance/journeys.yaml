    exampleRow: []
  A slow step leads to the place where it happened:
    description: A slow step leads to the place where it happened
    startingConditions:
    - a test report records a slow step with a recorded moment
    events:
    - the team selects that step in the heatmap
    endsIn: the team sees that step's recorded moment — 5
    checks:
    - the team sees that step's recorded moment
