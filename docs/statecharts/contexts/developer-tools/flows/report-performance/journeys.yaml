journeys:
  A slow step stands out in the heatmap:
    description: A slow step stands out in the heatmap
    startingConditions:
    - a test report records a step that took longer than the chosen allowance
    events:
    - the team opens that test report's heatmap when a test report records a step that took longer than the chosen
      allowance
    endsIn: the team sees the recorded time for that step — 1
    checks:
    - the team sees the recorded time for that step
    - that step is marked as slow
    gherkin:
    - specs/developer-tools/report-performance.feature:8 — A slow step stands out in the heatmap
    exampleRow: []
  A step within the allowance is not marked as slow:
    description: A step within the allowance is not marked as slow
    startingConditions:
    - a test report records a step within the chosen allowance
    events:
    - the team opens that test report's heatmap when a test report records a step within the chosen allowance
    endsIn: that step is not marked as slow because it stayed within the allowance — 2
    checks:
    - that step is not marked as slow because it stayed within the allowance
    gherkin:
    - specs/developer-tools/report-performance.feature:14 — A step within the allowance is not marked as slow
    exampleRow: []
  A report without recorded time says measurements are unavailable:
    description: A report without recorded time says measurements are unavailable
    startingConditions:
    - a test report has no recorded time for its steps
    events:
    - the team opens that test report's heatmap when a test report has no recorded time for its steps
    endsIn: the team is told measurements are unavailable — 3
    checks:
    - the team is told measurements are unavailable
    gherkin:
    - specs/developer-tools/report-performance.feature:21 — A report without recorded time says measurements are
      unavailable
    exampleRow: []
  A report with recorded time offers its heatmap:
    description: A report with recorded time offers its heatmap
    startingConditions:
    - a test report records a step within the chosen allowance
    events:
    - the team opens that test report's heatmap when a test report records a step within the chosen allowance
    endsIn: that step is not marked as slow because it stayed within the allowance — 2
    checks:
    - the team sees the heatmap for its recorded steps
    gherkin:
