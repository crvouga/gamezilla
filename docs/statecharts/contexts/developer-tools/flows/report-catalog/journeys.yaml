journeys:
  Opening an edition shows that edition's test runs:
    description: Opening an edition shows that edition's test runs
    startingConditions:
    - two versions of the app have different completed test runs
    events:
    - the team opens the test reports for the earlier version of the app
    endsIn: the team sees the earlier version's test runs — 1
    checks:
    - the team sees the earlier version's test runs
    - the later version's test runs cannot appear as evidence for the earlier version
    gherkin:
    - specs/developer-tools/report-catalog.feature:9 — Opening an edition shows that edition's test runs
    exampleRow: []
  A completed test run can be read before all test runs finish:
    description: A completed test run can be read before all test runs finish
    startingConditions:
    - a version of the app has one completed test run and another still running
    events:
    - the team opens that version's test reports
    endsIn: the team can open the completed test run's test report — 2
    checks:
    - the team can open the completed test run's test report
    - the team sees that the other test run is still running
    gherkin:
    - specs/developer-tools/report-catalog.feature:18 — A completed test run can be read before all test runs finish
    exampleRow: []
  Returning to the same reports shows completed test runs once:
    description: Returning to the same reports shows completed test runs once
    startingConditions:
    - the team has already seen a completed test run while others are running
    events:
    - the team reopens that version's test reports
    endsIn: the completed test run appears exactly once — 3
    checks:
    - the completed test run appears exactly once
    gherkin:
    - specs/developer-tools/report-catalog.feature:24 — Returning to the same reports shows completed test runs
      once
    exampleRow: []
  Searching finds a named test run without regard to letter case:
    description: Searching finds a named test run without regard to letter case
    startingConditions:
    - the test reports include test run "Alice accepts a friend request"
    events:
    - the team finds test reports matching 'ALICE ACCEPTS'
    endsIn: the team sees test run "Alice accepts a friend request" — 4
    checks:
    - the team sees test run "Alice accepts a friend request"
    gherkin:
    - specs/developer-tools/report-catalog.feature:31 — Searching finds a named test run without regard to letter
      case
    exampleRow: []
  Searching for an absent name shows no matches:
    description: Searching for an absent name shows no matches
    startingConditions:
    - no test run has a name containing "Bob joins the club"
    events:
    - the team finds test reports matching 'Bob joins the club'
    endsIn: the team is told no test runs match the supplied text — 5
    checks:
    - the team is told no test runs match the supplied text
    gherkin:
    - specs/developer-tools/report-catalog.feature:36 — Searching for an absent name shows no matches
    exampleRow: []
  The failure view includes a failed test run:
    description: The failure view includes a failed test run
    startingConditions:
    - the test reports include a failed test run and a passing test run
    events:
    - the team shows failed test runs only when the test reports include a failed test run and a passing test run
    endsIn: the team sees the failed test run — 6
    checks:
    - the team sees the failed test run
    gherkin:
    - specs/developer-tools/report-catalog.feature:43 — The failure view includes a failed test run
    exampleRow: []
  The failure view excludes a passing test run:
    description: The failure view excludes a passing test run
    startingConditions:
    - the test reports include a failed test run and a passing test run
    events:
    - the team shows failed test runs only when the test reports include a failed test run and a passing test run
    endsIn: the team sees the failed test run — 6
    checks:
    - the passing test run cannot appear because it passed
    gherkin:
    - specs/developer-tools/report-catalog.feature:48 — The failure view excludes a passing test run
    exampleRow: []
