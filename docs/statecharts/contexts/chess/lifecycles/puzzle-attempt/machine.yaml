id: chess-puzzle-attempt-lifecycle
initial: Opening puzzle attempt
meta:
  context: Chess
  kind: lifecycle
  owner: Chess owner (not named in specs)
  tier: critical
  emits: []
  reactsTo: []
  reviewStatus: draft; owner approval and execution adapters pending
  quint:
  - specs/chess/puzzle-attempt.qnt
  abstraction: Finite user-visible projection of sampled valid traces; merged predicates may over-approximate combinations
    of hidden preconditions. This is not exhaustive model checking.
states:
  Opening puzzle attempt:
    meta:
      description: The person is opening the puzzle attempt view.
      snapshot: the-person-is-opening-the-puzzle-attempt-view
      recognize: []
      checks:
      - No final outcome is claimed before the opening result.
      events: []
      confidence: assumed
      source:
      - specs/chess/puzzle-attempt.qnt
    'on':
      Opens with choosing a game:
        target: Choosing a game
        meta:
          action: init
          witness:
            trace: chess--puzzle-attempt_7.itf.json
            step: 0
            seed: 42
          source:
          - specs/chess/puzzle-attempt.qnt:204
  Choosing a game:
    meta:
      description: The person is choosing a game.
      snapshot: the-person-is-choosing-a-game
      recognize: []
      checks:
      - The assistant always belongs to the puzzle visible on that device.
      - The assistant cannot contradict the board's outcome, including offline.
      - Muting keeps the same observation whenever the board is present.
      - A guest here never uses more than the daily allowance.
      - Moving on is offered only to the host, once the puzzle on the board is over.
      - Off the board, no puzzle and no puzzle state shows.
      - While every device has a connection, the watcher's board agrees with the host's.
      - With a device offline, the watcher keeps the board they had when the connection went.
      - Examining a position cannot go beyond the moves reached on that puzzle.
      - Reviewing an earlier position never attaches current-move guidance to it.
      - Help belongs to the board being examined; off the board it is absent.
      - A solved puzzle stays solved while its earlier positions are examined.
      events: []
      confidence: assumed
      source:
      - specs/chess/puzzle-attempt.qnt
      quintPredicates:
      - view.get("alice"): GameChoice
        puzzleState.get("alice"): none
        help: none
        guidance: none
      invariants:
      - invCommentaryBelongsToCurrentPuzzle
      - invCommentaryAgreesWithBoard
      - invMutedObservationRemains
      - invStartsWithinAllowance
      - invMoveOnOnlyWhenOver
      - invNothingOffTheBoard
      - invWatcherSeesTheHostsBoard
      - invOfflineWatcherKeepsTheBoard
      - invOnlyReachedPositions
      - invReviewGuidanceBelongsToPosition
      - invHelpBelongsToPosition
      - invSolvedReviewCannotReactivate
      projectionReview: Confirm that omitted data do not enable an impossible stitched path.
    'on':
      Connection returns resulting in choosing a game:
