    of hidden preconditions. This is not exhaustive model checking.
states:
  Opening custom game control:
    meta:
      description: The person is opening the custom game control view.
      snapshot: the-person-is-opening-the-custom-game-control-view
      recognize: []
      checks:
      - No final outcome is claimed before the opening result.
      events: []
      confidence: assumed
      source:
      - specs/chess/custom-game-control.qnt
    'on':
      Opens with playing a Custom Game:
        target: Playing a Custom Game
        meta:
          action: init
          witness:
            trace: chess--custom-game-control_14.itf.json
            step: 0
            seed: 42
          source:
          - specs/chess/custom-game-control.qnt:46
  Playing a Custom Game:
    meta:
      description: The person is playing a Custom Game.
      snapshot: the-person-is-playing-a-custom-game
      recognize: []
      checks:
      - A side has just its assigned person or bot, never shared control.
      - Every move came from the participant who controlled the preceding turn.
      - This allowed chess history alternates turns and includes its mating move.
      - Terminal games have a result, and that board and result never change.
      - People with a connection see the same game, whether playing or watching.
      - Offline people retain their last board while bots and other people play.
      events: []
      confidence: assumed
      source:
      - specs/chess/custom-game-control.qnt
      quintPredicates:
      - controlledStatus: active
        result: ''
      invariants:
      - invControllers
      - invOnlyControllerMoves
      - invControlledHistory
      - invControlledTerminal
      - invControlledAgreement
      - invControlledOffline
      projectionReview: Confirm that omitted data do not enable an impossible stitched path.
    'on':
      Resign controlled game resulting in playing a Custom Game:
        target: Playing a Custom Game
        meta:
          action: resignControlledGame
          witness:
            trace: chess--custom-game-control_3.itf.json
            step: 1
            seed: 42
            nondeterministicChoices:
