states:
  Opening custom game play:
    meta:
      description: The person is opening the custom game play view.
      snapshot: the-person-is-opening-the-custom-game-play-view
      recognize: []
      checks:
      - No final outcome is claimed before the opening result.
      events: []
      confidence: assumed
      source:
      - specs/chess/custom-game-play.qnt
    'on':
      Opens with playing a Custom Game:
        target: Playing a Custom Game
        meta:
          action: init
          witness:
            trace: chess--custom-game-play_19.itf.json
            step: 0
            seed: 42
          source:
          - specs/chess/custom-game-play.qnt:66
  Playing a Custom Game:
    meta:
      description: The person is playing a Custom Game.
      snapshot: the-person-is-playing-a-custom-game
      recognize: []
      checks:
      - Moves and turn remain those of one legal alternating game.
      - Only a terminal game has a final outcome.
      - A terminal board, result and clocks cannot change.
      - A checkmate includes the mating move; time losses never include it.
      - An active side still has time; neither clock is negative or gains time.
      - Everyone with a connection sees the same board and outcome.
      - Offline boards stay as they were when the connection went.
      - Only the creator cancels once each side has moved.
      - A win for staying away needs the other participant away for a full minute.
      - 'Being away never ends the game by itself: an away result always comes from a claim.'
      events: []
      confidence: assumed
      source:
      - specs/chess/custom-game-play.qnt
      quintPredicates:
      - playStatus: active
        result: ''
      invariants:
      - invTurnAndMoves
      - invFinalResult
      - invTerminalFrozen
      - invMatingMoveCounts
      - invClocks
      - invConnectedBoard
      - invOfflineBoard
      - invEarlyCancelOnly
      - invClaimNeedsAbsence
      - invAwayNeverResigns
      projectionReview: Confirm that omitted data do not enable an impossible stitched path.
    'on':
      Cancel custom game resulting in seeing a cancelled Custom Game:
