journeys:
  Enabled sounds accompany a puzzle move and its opponent reply:
    description: Enabled sounds accompany a puzzle move and its opponent reply
    startingConditions:
    - Alice is signed in
    - Alice has turned sounds on
    - Alice is solving the two-rook clearance puzzle
    events:
    - Alice plays a1-a5 when Alice is signed in and Alice has turned sounds on and Alice is solving the two-rook
      clearance puzzle
    endsIn: Alice hears the puzzle's move sounds — 1
    checks:
    - Alice hears the puzzle's move sounds
    - Alice is solving the puzzle at move 3 of the line
    gherkin:
    - specs/chess/puzzle-sound.feature:9 — Enabled sounds accompany a puzzle move and its opponent reply
    exampleRow: []
  Disabled sounds keep a puzzle move and its opponent reply silent:
    description: Disabled sounds keep a puzzle move and its opponent reply silent
    startingConditions:
    - Alice is signed in
    - Alice has turned sounds off
    - Alice is solving the two-rook clearance puzzle
    events:
    - Alice plays a1-a5 when Alice is signed in and Alice has turned sounds off and Alice is solving the two-rook
      clearance puzzle
    endsIn: Alice cannot hear puzzle sounds while the app's sounds are off — 2
    checks:
    - Alice cannot hear puzzle sounds while the app's sounds are off
    - Alice is solving the puzzle at move 3 of the line
    gherkin:
    - specs/chess/puzzle-sound.feature:18 — Disabled sounds keep a puzzle move and its opponent reply silent
    exampleRow: []
  Enabled sounds accompany the puzzle's capture:
    description: Enabled sounds accompany the puzzle's capture
    startingConditions:
    - Alice is signed in
    - Alice has turned sounds on
    - Alice is solving the en passant puzzle
    events:
    - Alice plays e5-d6 when Alice is signed in and Alice has turned sounds on and Alice is solving the en passant
      puzzle
    endsIn: Alice hears the puzzle's capture sound — 3
    checks:
    - Alice hears the puzzle's capture sound
    - Alice's puzzle is solved within 20 seconds
    gherkin:
    - specs/chess/puzzle-sound.feature:27 — Enabled sounds accompany the puzzle's capture
    exampleRow: []
  A resumed puzzle completes its capture feedback after sounds are enabled:
    description: A resumed puzzle completes its capture feedback after sounds are enabled
    startingConditions:
    - Alice is signed in
    - Alice has turned sounds off
    - Alice is solving the en passant puzzle
    - Alice has since turned sounds on and returned to that unfinished puzzle
    events:
    - Alice plays e5-d6 when Alice is signed in and Alice has turned sounds off and Alice is solving the en passant
      puzzle and Alice has since turned sounds on and returned to that unfinished puzzle
    endsIn: Alice hears the puzzle's capture sound — 4
    checks:
    - Alice hears the puzzle's capture sound
    - Alice's puzzle is solved within 20 seconds
    gherkin:
    - specs/chess/puzzle-sound.feature:36 — A resumed puzzle completes its capture feedback after sounds are enabled
    exampleRow: []
