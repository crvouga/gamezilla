  An enabled review sounds its next move:
    description: An enabled review sounds its next move
    startingConditions:
    - Alice is signed in
    - Alice has turned sounds on
    - Alice is reviewing the solved puzzle at move 3
    events:
    - Alice steps forward one move in the review when Alice is signed in and Alice has turned sounds on and Alice
      is reviewing the solved puzzle at move 3
    endsIn: Alice hears the review's move sound — 13
    checks:
    - Alice hears the review's move sound
    - Alice's review is at move 4 of 4, reached with animation
    gherkin:
    - specs/chess/puzzle-sound.feature:117 — An enabled review sounds its next move
    exampleRow: []
