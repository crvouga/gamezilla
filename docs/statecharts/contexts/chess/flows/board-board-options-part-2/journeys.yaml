journeys:
  Chosen square colors take effect without moving a piece:
    description: Chosen square colors take effect without moving a piece
    startingConditions:
    - Alice has selected the piece on e2
    events:
    - Alice's activity chooses green and cream board colors when Alice has selected the piece on e2
    endsIn: Alice sees green and cream squares — 1
    checks:
    - Alice sees green and cream squares
    - Alice still has e2 selected
    - Alice sees the White pawn remaining on e2
    gherkin:
    - specs/chess-board/board-options.feature:256 — Chosen square colors take effect without moving a piece
    exampleRow: []
  Changing colors preserves a held piece:
    description: Changing colors preserves a held piece
    startingConditions:
    - Alice is dragging the piece on e2
    events:
    - Alice's activity chooses green and cream board colors when Alice is dragging the piece on e2
    endsIn: Alice sees green and cream squares — 2
    checks:
    - Alice sees green and cream squares
    - Alice still holds the piece from e2
    gherkin:
    - specs/chess-board/board-options.feature:263 — Changing colors preserves a held piece
    exampleRow: []
  Changing colors preserves a pending promotion choice:
    description: Changing colors preserves a pending promotion choice
    startingConditions:
    - Alice has a pending White promotion from a7 to a8
    events:
    - Alice's activity chooses green and cream board colors when Alice has a pending White promotion from a7 to
      a8
    endsIn: Alice sees green and cream squares — 3
    checks:
    - Alice sees green and cream squares
    - Alice is still offered queen, rook, bishop and knight as the promotion choice
    gherkin:
    - specs/chess-board/board-options.feature:269 — Changing colors preserves a pending promotion choice
    exampleRow: []
  Restoring the earlier colors preserves selection and position:
    description: Restoring the earlier colors preserves selection and position
    startingConditions:
    - Alice has selected the piece on e2 with green and cream board colors
    events:
    - Alice's activity chooses brown and cream board colors
    endsIn: Alice sees brown and cream squares — 4
    checks:
    - Alice sees brown and cream squares
    - Alice still has e2 selected
    - Alice sees the White pawn remaining on e2
    gherkin:
    - specs/chess-board/board-options.feature:275 — Restoring the earlier colors preserves selection and position
    exampleRow: []
