    endsIn: Alice has a configuring Custom Game with no moves — 3
    checks:
    - Alice has a configuring Custom Game with no moves
    gherkin:
    - specs/chess/custom-game-creation.feature:22 — A new game follows a cancelled game
    exampleRow: []
  An active game cannot be replaced:
    description: An active game cannot be replaced
    startingConditions:
