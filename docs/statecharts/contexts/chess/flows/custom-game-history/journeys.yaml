journeys:
  A rematch leaves the earlier resignation available to review:
    description: A rematch leaves the earlier resignation available to review
    startingConditions:
    - Alice has a completed Custom Game after White's e4
    events:
    - Alice creates a rematch of the Custom Game when Alice has a completed Custom Game after White's e4
    endsIn: The earlier Custom Game still shows e4 and its resignation outcome — 1
    checks:
    - The earlier Custom Game still shows e4 and its resignation outcome
    - The new Custom Game has no moves
    gherkin:
    - specs/chess/custom-game-history.feature:7 — A rematch leaves the earlier resignation available to review
    exampleRow: []
  A new game cannot overwrite unfinished moves:
    description: A new game cannot overwrite unfinished moves
    startingConditions:
    - Alice has an active Custom Game after White's e4
    events:
    - Alice creates a Custom Game
    endsIn: Alice is told the Custom Game must finish or be cancelled first — 2
    checks:
    - Alice is told the Custom Game must finish or be cancelled first
    - The Custom Game move list shows e4
    gherkin:
    - specs/chess/custom-game-history.feature:13 — A new game cannot overwrite unfinished moves
    exampleRow: []
  A departed participant becomes an open place in the rematch:
    description: A departed participant becomes an open place in the rematch
    startingConditions:
    - Alice has a completed Custom Game between Alice as White and Bob as Black
    - Bob has left Alice's space
    events:
    - Alice creates a rematch of the Custom Game when Alice has a completed Custom Game between Alice as White and
      Bob as Black and Bob has left Alice's space
    endsIn: White is an open place and Black is Alice in the configuring Custom Game — 3
    checks:
    - White is an open place and Black is Alice in the configuring Custom Game
    gherkin:
    - specs/chess/custom-game-history.feature:21 — A departed participant becomes an open place in the rematch
    exampleRow: []
  A cancelled invitation cannot be inherited as a participant:
    description: A cancelled invitation cannot be inherited as a participant
    startingConditions:
    - Alice has a cancelled Custom Game that invited Bob to Black
    events:
    - Alice creates a rematch of the Custom Game when Alice has a cancelled Custom Game that invited Bob to Black
    endsIn: White is an open place and Black is Alice in the configuring Custom Game — 4
    checks:
    - White is an open place and Black is Alice in the configuring Custom Game
    - Neither side offers an invitation
    gherkin:
    - specs/chess/custom-game-history.feature:27 — A cancelled invitation cannot be inherited as a participant
    exampleRow: []
  A watcher reviews the earlier starting board:
    description: A watcher reviews the earlier starting board
    startingConditions:
    - Alice has a completed Custom Game between Alice as White and Bob as Black
    - Carol is in Alice's space
    events:
    - Carol reviews move 0 of the Custom Game
    endsIn: Carol sees the Custom Game starting board — 5
    checks:
    - Carol sees the Custom Game starting board
    gherkin:
    - specs/chess/custom-game-history.feature:35 — A watcher reviews the earlier starting board
    exampleRow: []
  An outsider cannot review an earlier game:
    description: An outsider cannot review an earlier game
    startingConditions:
    - Alice has a completed Custom Game between Alice as White and Bob as Black
    - Carol is outside Alice's space
    events:
    - Carol tries to watch the Custom Game
    endsIn: Carol cannot see the Custom Game — 6
    checks:
    - Carol cannot see the Custom Game
    gherkin:
    - specs/chess/custom-game-history.feature:41 — An outsider cannot review an earlier game
    exampleRow: []
