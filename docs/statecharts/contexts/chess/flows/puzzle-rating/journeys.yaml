  Solving a puzzle rated 1700 gains more than solving one rated 1300:
    description: Solving a puzzle rated 1700 gains more than solving one rated 1300
    startingConditions:
    - Alice and Bob are signed in
    - Alice's puzzle rating has settled at 1500
    - Bob's puzzle rating has settled at 1500
    - Bob has solved a puzzle rated 1300
    - Alice is solving a puzzle rated 1700
    events:
    - Alice solves the puzzle when Alice and Bob are signed in and Alice's puzzle rating has settled at 1500 and
      Bob's puzzle rating has settled at 1500 and Bob has solved a puzzle rated 1300 and Alice is solving a puzzle
      rated 1700
    endsIn: Alice's puzzle rating is above Bob's — 6
    checks:
    - Alice's puzzle rating is above Bob's
    gherkin:
    - specs/chess/puzzle-rating.feature:57 — Solving a puzzle rated 1700 gains more than solving one rated 1300
    exampleRow: []
  Failing a puzzle rated 1300 costs more than failing one rated 1700:
