  A puzzle solved offline counts once, on every device:
    description: A puzzle solved offline counts once, on every device
    startingConditions:
    - Alice is signed in
    - Alice is also signed in on another device
    - Alice is playing puzzles in their space
    - Alice has solved a puzzle while offline
    events:
    - the connection comes back
    endsIn: both of Alice's devices show the same puzzle rating within 30 seconds — 3
    checks:
    - both of Alice's devices show the same puzzle rating within 30 seconds
    - Alice's stats show 1 played, 1 solved, and 100% accuracy
    gherkin:
    - specs/chess/puzzle-rating.feature:23 — A puzzle solved offline counts once, on every device
    exampleRow: []
  A repeat of a played puzzle moves neither the rating nor the stats:
    description: A repeat of a played puzzle moves neither the rating nor the stats
    startingConditions:
    - the puzzle pool holds just three puzzles
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has solved 3 puzzles in a row
    - Alice's feed has come round to a puzzle they already played
    events:
    - Alice solves the puzzle when the puzzle pool holds just three puzzles and Alice is signed in and Alice is
      playing puzzles in their space and Alice has solved 3 puzzles in a row and Alice's feed has come round to
      a puzzle they already played
    endsIn: Alice's puzzle rating is still unchanged by the repeat because that puzzle is already rated — 4
    checks:
    - Alice's puzzle rating is still unchanged by the repeat because that puzzle is already rated
    - Alice's stats show 3 played, 3 solved, and 100% accuracy
    gherkin:
    - specs/chess/puzzle-rating.feature:32 — A repeat of a played puzzle moves neither the rating nor the stats
    exampleRow: []
