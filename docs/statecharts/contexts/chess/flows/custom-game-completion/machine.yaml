          condition:
          - Alice has a configuring Custom Game
          - Bob has left the space after releasing Black
          - Carol has claimed Black in the Custom Game
          example: Returning cannot recover a side already claimed
      Alice leaves the space:
        target: The Custom Game is cancelled with no winner — 13
        meta:
          source:
          - specs/chess/custom-game-completion.feature:86
          condition:
          - Alice has an active Custom Game between Alice as White and Bob as Black
          example: The host's departure ends an active game
      Alice ends the space:
        target: The Custom Game keeps its completed outcome — 14
        meta:
          source:
          - specs/chess/custom-game-completion.feature:91
          condition:
          - Alice has a completed Custom Game between Alice as White and Bob as Black
          example: Ending the space preserves an already completed result
      Alice creates a rematch of the Custom Game when Alice has a completed Custom Game between Alice as White and Bob as Black:
        target: White is Bob and Black is Alice in the configuring Custom Game — 15
        meta:
          source:
          - specs/chess/custom-game-completion.feature:98
          condition:
          - Alice has a completed Custom Game between Alice as White and Bob as Black
          example: A rematch swaps people and requires readiness again
      Alice creates a rematch of the Custom Game when Alice has an active Custom Game between Alice as White and Bob as Black:
        target: Alice is told the Custom Game must finish or be cancelled first — 16
        meta:
          source:
          - specs/chess/custom-game-completion.feature:104
          condition:
          - Alice has an active Custom Game between Alice as White and Bob as Black
          example: An unfinished game cannot have a rematch
