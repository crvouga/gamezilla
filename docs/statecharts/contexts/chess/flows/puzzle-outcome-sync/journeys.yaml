journeys:
  A puzzle finished offline by solving it cleanly is logged as solved, once:
    description: A puzzle finished offline by <finish> is logged as <outcome>, once
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has finished the puzzle offline by solving it cleanly
    events:
    - the connection comes back when Alice is signed in and Alice is playing puzzles in their space and Alice has
      finished the puzzle offline by solving it cleanly
    endsIn: Alice's game log records that puzzle as solved — 1
    checks:
    - Alice's game log records that puzzle as solved
    - Alice's stats show 1 played, 1 solved, and 100% accuracy
    gherkin:
