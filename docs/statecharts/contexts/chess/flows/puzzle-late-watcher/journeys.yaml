journeys:
  Someone who arrives mid-puzzle sees the host's current position:
    description: Someone who arrives mid-puzzle sees the host's current position
    startingConditions:
    - Alice and Bob are guests
    - Alice is hosting a space
    - Alice is playing puzzles in their space
    - Alice has played the next move of the solution
    events:
    - Bob joins the space from the link when Alice and Bob are guests and Alice is hosting a space and Alice is
      playing puzzles in their space and Alice has played the next move of the solution
    endsIn: Bob is watching Alice's puzzle within 15 seconds — 1
    checks:
    - Bob is watching Alice's puzzle within 15 seconds
    - Alice's and Bob's boards agree within 15 seconds
    gherkin:
    - specs/chess/puzzle-late-watcher.feature:15 — Someone who arrives mid-puzzle sees the host's current position
    exampleRow: []
  A watcher who loses the connection sees the host's position once back online:
    description: A watcher who loses the connection sees the host's position once back online
    startingConditions:
    - Alice and Bob are guests
    - Alice is hosting a space
    - Alice is playing puzzles in their space
    - Bob has joined the space from the link and is watching Alice's puzzle
    - Bob is offline
    - Alice has played the next move of the solution
    events:
    - the connection comes back
    endsIn: Alice's and Bob's boards agree within 20 seconds — 2
    checks:
    - Alice's and Bob's boards agree within 20 seconds
    gherkin:
    - specs/chess/puzzle-late-watcher.feature:21 — A watcher who loses the connection sees the host's position once
      back online
    exampleRow: []
  Someone who arrives after the host moved on sees the new puzzle:
    description: Someone who arrives after the host moved on sees the new puzzle
    startingConditions:
    - Alice and Bob are guests
    - Alice is hosting a space
    - Alice is playing puzzles in their space
    - Alice has solved the puzzle
    - Alice has moved on to the next puzzle
    events:
    - Bob joins the space from the link when Alice and Bob are guests and Alice is hosting a space and Alice is
      playing puzzles in their space and Alice has solved the puzzle and Alice has moved on to the next puzzle
    endsIn: Alice's and Bob's boards agree within 15 seconds — 3
    checks:
    - Alice's and Bob's boards agree within 15 seconds
    gherkin:
    - specs/chess/puzzle-late-watcher.feature:28 — Someone who arrives after the host moved on sees the new puzzle
    exampleRow: []
