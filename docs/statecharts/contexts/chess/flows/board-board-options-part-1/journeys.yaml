    events:
    - Alice's activity chooses a fixed width
    endsIn: Alice's chessboard has the activity's fixed width — 3
    checks:
    - Alice's chessboard has the activity's fixed width
    - Alice's chessboard has equal width and height
    gherkin:
    - specs/chess-board/board-options.feature:20 — Choosing a fixed width takes effect on an existing chessboard
    exampleRow: []
  Removing a fixed width restores the available width:
