journeys:
  Available space determines width when no fixed width is chosen:
    description: Available space determines width when no fixed width is chosen
    startingConditions:
    - Alice has a chessboard without a fixed width
    events:
    - Alice's activity narrows the available space when Alice has a chessboard without a fixed width
    endsIn: Alice's chessboard fills the available width — 1
    checks:
    - Alice's chessboard fills the available width
    - Alice's chessboard has equal width and height
    gherkin:
    - specs/chess-board/board-options.feature:8 — Available space determines width when no fixed width is chosen
    exampleRow: []
  A fixed width takes precedence over changing available space:
    description: A fixed width takes precedence over changing available space
    startingConditions:
    - Alice has a chessboard with the activity's fixed width
    events:
    - Alice's activity narrows the available space when Alice has a chessboard with the activity's fixed width
    endsIn: Alice's chessboard still has the activity's fixed width — 2
    checks:
    - Alice's chessboard still has the activity's fixed width
    - Alice's chessboard has equal width and height
    gherkin:
    - specs/chess-board/board-options.feature:14 — A fixed width takes precedence over changing available space
    exampleRow: []
  Choosing a fixed width takes effect on an existing chessboard:
