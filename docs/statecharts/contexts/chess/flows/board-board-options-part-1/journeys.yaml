  The smallest supported width offers a legal move:
    description: The smallest supported width offers a legal move
    startingConditions:
    - Alice has an interactive chessboard 196 pixels wide
    events:
    - Alice moves the piece from e2 to e4 when Alice has an interactive chessboard 196 pixels wide
    endsIn: Alice sees a White pawn on e4 — 5
    checks:
    - Alice sees a White pawn on e4
    - Alice's activity receives one move
    gherkin:
    - specs/chess-board/board-options.feature:32 — The smallest supported width offers a legal move
    exampleRow: []
  A supported width permits holding a piece before its destination is chosen:
    description: A supported width permits holding a piece before its destination is chosen
    startingConditions:
