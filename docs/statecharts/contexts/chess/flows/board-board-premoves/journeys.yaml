journeys:
  Selection queues a premove with a translucent destination preview:
    description: Selection queues a premove with a translucent destination preview
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves enabled
    events:
    - Alice queues the premove from d2 to d4 when Alice has a chessboard waiting for Black with premoves enabled
    endsIn: Alice sees a translucent White pawn preview on d4 — 1
    checks:
    - Alice sees a translucent White pawn preview on d4
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:8 — Selection queues a premove with a translucent destination preview
    exampleRow: []
  Dragging queues the same waiting-side premove:
    description: Dragging queues the same waiting-side premove
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves enabled
    events:
    - Alice drags a premove from d2 to d4
    endsIn: Alice sees a translucent White pawn preview on d4 — 2
    checks:
    - Alice sees a translucent White pawn preview on d4
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:15 — Dragging queues the same waiting-side premove
    exampleRow: []
  Repeating a waiting move keeps exactly one preview and queued move:
    description: Repeating a waiting move keeps exactly one preview and queued move
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice queues the premove from d2 to d4 when Alice has the premove from d2 to d4 queued while waiting for Black
    endsIn: Alice still sees exactly one translucent White pawn preview on d4 — 3
    checks:
    - Alice still sees exactly one translucent White pawn preview on d4
    - Alice sees only the premove from d2 to d4 queued
    - Alice hears no chessboard sounds
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:23 — Repeating a waiting move keeps exactly one preview and queued
      move
    exampleRow: []
  The waiting side may select a premove source:
    description: The waiting side may select a premove source
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves enabled
    events:
    - Alice selects the piece on d2 when Alice has a chessboard waiting for Black with premoves enabled
    endsIn: Alice has d2 selected — 4
    checks:
    - Alice has d2 selected
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:31 — The waiting side may select a premove source
    exampleRow: []
  Choosing the same waiting source again deselects it:
    description: Choosing the same waiting source again deselects it
    startingConditions:
    - Alice has d2 selected while waiting for Black with premoves enabled
    events:
    - Alice selects the piece on d2 when Alice has d2 selected while waiting for Black with premoves enabled
    endsIn: Alice sees no selection or legal destinations — 5
    checks:
    - Alice sees no selection or legal destinations
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:37 — Choosing the same waiting source again deselects it
    exampleRow: []
  Choosing another waiting piece changes the premove source:
    description: Choosing another waiting piece changes the premove source
    startingConditions:
    - Alice has d2 selected while waiting for Black with premoves enabled
    events:
    - Alice selects the piece on g1
    endsIn: Alice has g1 selected — 6
    checks:
    - Alice has g1 selected
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:44 — Choosing another waiting piece changes the premove source
    exampleRow: []
  Disabled premoves ignore waiting-side selection:
    description: Disabled premoves ignore waiting-side selection
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves disabled
    events:
    - Alice selects the piece on d2 when Alice has a chessboard waiting for Black with premoves disabled
    endsIn: Alice cannot select White's pawn while Black is to move — 7
    checks:
    - Alice cannot select White's pawn while Black is to move
    - Alice sees no selection or legal destinations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:51 — Disabled premoves ignore waiting-side selection
    exampleRow: []
  Disabled premoves refuse queueing a waiting-side move:
    description: Disabled premoves refuse queueing a waiting-side move
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves disabled
    events:
    - Alice queues the premove from d2 to d4 when Alice has a chessboard waiting for Black with premoves disabled
    endsIn: Alice cannot queue a premove while premoves are disabled — 8
    checks:
    - Alice cannot queue a premove while premoves are disabled
    - Alice sees no queued premoves
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:58 — Disabled premoves refuse queueing a waiting-side move
    exampleRow: []
  Enabling premoves permits a future waiting-side choice:
    description: Enabling premoves permits a future waiting-side choice
    startingConditions:
    - Alice has a chessboard waiting for Black with premoves disabled
    events:
    - Alice's board settings enable premoves
    endsIn: Alice can queue a premove while waiting for Black — 9
    checks:
    - Alice can queue a premove while waiting for Black
    gherkin:
    - specs/chess-board/board-premoves.feature:66 — Enabling premoves permits a future waiting-side choice
    exampleRow: []
  A legal opponent reply completes the first queued premove once:
    description: A legal opponent reply completes the first queued premove once
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice's activity supplies Black's reply from e7 to e5 when Alice has the premove from d2 to d4 queued while
      waiting for Black
    endsIn: Alice sees a White pawn on d4 — 10
    checks:
    - Alice sees a White pawn on d4
    - Alice sees no queued premoves
    - Alice's activity receives one move
    gherkin:
    - specs/chess-board/board-premoves.feature:73 — A legal opponent reply completes the first queued premove once
    exampleRow: []
  Two queued premoves keep the second waiting after the first reply:
    description: Two queued premoves keep the second waiting after the first reply
    startingConditions:
    - Alice has premoves from d2 to d4 then g1 to f3 queued while waiting for Black
    events:
    - Alice's activity supplies Black's reply from e7 to e5 when Alice has premoves from d2 to d4 then g1 to f3
      queued while waiting for Black
    endsIn: Alice sees a White pawn on d4 — 11
    checks:
    - Alice sees a White pawn on d4
    - Alice sees the White knight remaining on g1
    - Alice sees only the premove from g1 to f3 queued
    - Alice's activity receives one move
    gherkin:
    - specs/chess-board/board-premoves.feature:80 — Two queued premoves keep the second waiting after the first
      reply
    exampleRow: []
  The next opponent reply completes the next queued premove:
    description: The next opponent reply completes the next queued premove
    startingConditions:
    - Alice has completed the premove from d2 to d4 with g1 to f3 still queued
    events:
    - Alice's activity supplies Black's reply from g8 to f6
    endsIn: Alice sees a White knight on f3 — 12
    checks:
    - Alice sees a White knight on f3
    - Alice sees no queued premoves
    - Alice's activity receives one move
    gherkin:
    - specs/chess-board/board-premoves.feature:88 — The next opponent reply completes the next queued premove
    exampleRow: []
  An invalidated premove disappears without offering another move:
    description: An invalidated premove disappears without offering another move
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice's activity supplies a reply that invalidates the premove
    endsIn: Alice cannot complete the premove because it is no longer legal — 13
    checks:
    - Alice cannot complete the premove because it is no longer legal
    - Alice sees no queued premoves
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:95 — An invalidated premove disappears without offering another move
    exampleRow: []
  Choosing an empty square clears the queued premove:
    description: Choosing an empty square clears the queued premove
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice selects the empty square a3
    endsIn: Alice sees no queued premoves — 14
    checks:
    - Alice sees no queued premoves
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:104 — Choosing an empty square clears the queued premove
    exampleRow: []
  Escape clears two queued premoves and the waiting selection:
    description: Escape clears two queued premoves and the waiting selection
    startingConditions:
    - Alice has premoves from d2 to d4 then g1 to f3 queued while waiting for Black with d2 selected
    events:
    - Alice cancels premoves with Escape
    endsIn: Alice sees no queued premoves — 15
    checks:
    - Alice sees no queued premoves
    - Alice sees no selection or legal destinations
    - Alice sees the White pawn on d2 and knight on g1 without destination previews
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:111 — Escape clears two queued premoves and the waiting selection
    exampleRow: []
  A later opponent reply cannot execute cancelled premoves:
    description: A later opponent reply cannot execute cancelled premoves
    startingConditions:
    - Alice has cancelled two queued premoves and her d2 selection with Escape while waiting for Black
    events:
    - Alice's activity supplies Black's reply from e7 to e5 when Alice has cancelled two queued premoves and her
      d2 selection with Escape while waiting for Black
    endsIn: Alice sees a Black pawn on e5 — 16
    checks:
    - Alice sees a Black pawn on e5
    - Alice sees the White pawn on d2 and knight on g1 without destination previews
    - Alice sees no queued premoves
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:119 — A later opponent reply cannot execute cancelled premoves
    exampleRow: []
  A personal circle choice clears the queued premove:
    description: A personal circle choice clears the queued premove
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice marks e4 with a personal circle
    endsIn: Alice sees no queued premoves — 17
    checks:
    - Alice sees no queued premoves
    - Alice sees the White pawn remaining on d2
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:127 — A personal circle choice clears the queued premove
    exampleRow: []
  A refused personal circle clears every queued premove and preview:
    description: A refused personal circle clears every queued premove and preview
    startingConditions:
    - Alice has premoves from d2 to d4 then g1 to f3 queued while waiting for Black
    - Alice has personal annotations disabled
    events:
    - Alice marks h6 with a personal circle
    endsIn: Alice cannot add a personal annotation while they are disabled — 18
    checks:
    - Alice cannot add a personal annotation while they are disabled
    - Alice sees no queued premoves
    - Alice sees the White pawn on d2 and knight on g1 without destination previews
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:134 — A refused personal circle clears every queued premove and preview
    exampleRow: []
  Choosing the now empty source clears the next queued premove:
    description: Choosing the now empty source clears the next queued premove
    startingConditions:
    - Alice has completed the premove from d2 to d4 with g1 to f3 still queued
    events:
    - Alice selects the empty square d2
    endsIn: Alice sees no queued premoves — 19
    checks:
    - Alice sees no queued premoves
    - Alice sees the White knight remaining on g1
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:143 — Choosing the now empty source clears the next queued premove
    exampleRow: []
  Disabling premoves clears every waiting choice:
    description: Disabling premoves clears every waiting choice
    startingConditions:
    - Alice has premoves from d2 to d4 then g1 to f3 queued while waiting for Black
    events:
    - Alice's board settings disable premoves
    endsIn: Alice cannot keep a premove queued while premoves are disabled — 20
    checks:
    - Alice cannot keep a premove queued while premoves are disabled
    - Alice sees no queued premoves
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:150 — Disabling premoves clears every waiting choice
    exampleRow: []
  An unrelated position abandons every queued premove:
    description: An unrelated position abandons every queued premove
    startingConditions:
    - Alice has the premove from d2 to d4 queued while waiting for Black
    events:
    - Alice's activity replaces the position
    endsIn: Alice sees the replacement position — 21
    checks:
    - Alice sees the replacement position
    - Alice sees no queued premoves
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-premoves.feature:157 — An unrelated position abandons every queued premove
    exampleRow: []
