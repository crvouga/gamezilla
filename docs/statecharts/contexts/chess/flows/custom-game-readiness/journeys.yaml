journeys:
  The second person makes a complete game startable:
    description: The second person makes a complete game startable
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice is ready for the Custom Game
    events:
    - Bob becomes ready for the Custom Game
    endsIn: The Custom Game is startable — 1
    checks:
    - The Custom Game is startable
    gherkin:
    - specs/chess/custom-game-readiness.feature:7 — The second person makes a complete game startable
    exampleRow: []
  A watcher cannot become ready for a participant:
    description: A watcher cannot become ready for a participant
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Carol is in Alice's space
    events:
    - Carol becomes ready for the Custom Game
    endsIn: Carol is told only a participant may become ready — 2
    checks:
    - Carol is told only a participant may become ready
    gherkin:
    - specs/chess/custom-game-readiness.feature:13 — A watcher cannot become ready for a participant
    exampleRow: []
  A time choice requires renewed agreement:
    description: A time choice requires renewed agreement
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    events:
    - Alice chooses 5 minutes with 2 seconds increment for the Custom Game
    endsIn: Neither person is ready for the Custom Game — 3
    checks:
    - Neither person is ready for the Custom Game
    - The Custom Game has 5 minutes with 2 seconds increment
    gherkin:
    - specs/chess/custom-game-readiness.feature:21 — A time choice requires renewed agreement
    exampleRow: []
  A participant who is no longer ready stops the start:
    description: A participant who is no longer ready stops the start
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    - Bob is no longer ready for the Custom Game
    events:
    - Alice starts the Custom Game when Alice has a Custom Game between Alice as White and Bob as Black and Alice
      and Bob are ready for the Custom Game and Bob is no longer ready for the Custom Game
    endsIn: Alice is told every person must be ready — 4
    checks:
    - Alice is told every person must be ready
    gherkin:
    - specs/chess/custom-game-readiness.feature:28 — A participant who is no longer ready stops the start
    exampleRow: []
  Ready participants start one game:
    description: Ready participants start one game
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    events:
    - Alice starts the Custom Game when Alice has a Custom Game between Alice as White and Bob as Black and Alice
      and Bob are ready for the Custom Game
    endsIn: The Custom Game is active with White to move — 5
    checks:
    - The Custom Game is active with White to move
    gherkin:
    - specs/chess/custom-game-readiness.feature:37 — Ready participants start one game
    exampleRow: []
  An open place prevents start:
    description: An open place prevents start
    startingConditions:
    - Alice has a configuring Custom Game
    - Alice is ready for the Custom Game
    events:
    - Alice starts the Custom Game when Alice has a configuring Custom Game and Alice is ready for the Custom Game
    endsIn: Alice is told both sides need participants — 6
    checks:
    - Alice is told both sides need participants
    gherkin:
    - specs/chess/custom-game-readiness.feature:43 — An open place prevents start
    exampleRow: []
  An invitation prevents start:
    description: An invitation prevents start
    startingConditions:
    - Alice has a configuring Custom Game
    - Black in the Custom Game is reserved for Bob
    - Alice is ready for the Custom Game
    events:
    - Alice starts the Custom Game when Alice has a configuring Custom Game and Black in the Custom Game is reserved
      for Bob and Alice is ready for the Custom Game
    endsIn: Alice is told both sides need participants — 7
    checks:
    - Alice is told both sides need participants
    gherkin:
    - specs/chess/custom-game-readiness.feature:49 — An invitation prevents start
    exampleRow: []
  A participant cannot start instead of the creator:
    description: A participant cannot start instead of the creator
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    events:
    - Bob starts the Custom Game
    endsIn: Bob is told only the creator starts the Custom Game — 8
    checks:
    - Bob is told only the creator starts the Custom Game
    gherkin:
    - specs/chess/custom-game-readiness.feature:56 — A participant cannot start instead of the creator
    exampleRow: []
  Repeating an acknowledged start keeps the current board:
    description: Repeating an acknowledged start keeps the current board
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    events:
    - Alice starts the Custom Game when Alice has an active Custom Game between Alice as White and Bob as Black
    endsIn: The Custom Game remains active with no new game — 9
    checks:
    - The Custom Game remains active with no new game
    gherkin:
    - specs/chess/custom-game-readiness.feature:64 — Repeating an acknowledged start keeps the current board
    exampleRow: []
  A completed game cannot restart:
    description: A completed game cannot restart
    startingConditions:
    - Alice has a completed Custom Game between Alice as White and Bob as Black
    events:
    - Alice starts the Custom Game when Alice has a completed Custom Game between Alice as White and Bob as Black
    endsIn: Alice is told the Custom Game has finished — 10
    checks:
    - Alice is told the Custom Game has finished
    gherkin:
    - specs/chess/custom-game-readiness.feature:69 — A completed game cannot restart
    exampleRow: []
  A cancelled game cannot restart:
    description: A cancelled game cannot restart
    startingConditions:
    - Alice has a cancelled Custom Game
    events:
    - Alice starts the Custom Game when Alice has a cancelled Custom Game
    endsIn: Alice is told the Custom Game was cancelled — 11
    checks:
    - Alice is told the Custom Game was cancelled
    gherkin:
    - specs/chess/custom-game-readiness.feature:74 — A cancelled game cannot restart
    exampleRow: []
  Two starts produce one game:
    description: Two starts produce one game
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    events:
    - Alice starts the Custom Game twice at the same time
    endsIn: The Custom Game remains active with no new game — 12
    checks:
    - The Custom Game remains active with no new game
    gherkin:
    - specs/chess/custom-game-readiness.feature:81 — Two starts produce one game
    exampleRow: []
  A stale start cannot bypass changed choices:
    description: A stale start cannot bypass changed choices
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    - The Custom Game choices changed before Alice's start
    events:
    - Alice starts the Custom Game with the earlier choices
    endsIn: Alice is told the Custom Game choices have changed — 13
    checks:
    - Alice is told the Custom Game choices have changed
    gherkin:
    - specs/chess/custom-game-readiness.feature:87 — A stale start cannot bypass changed choices
    exampleRow: []
