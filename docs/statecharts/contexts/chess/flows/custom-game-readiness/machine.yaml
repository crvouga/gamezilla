    'on':
      Bob becomes ready for the Custom Game:
        target: The Custom Game is startable — 1
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:7
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice is ready for the Custom Game
          example: The second person makes a complete game startable
      Carol becomes ready for the Custom Game:
        target: Carol is told only a participant may become ready — 2
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:13
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Carol is in Alice's space
          example: A watcher cannot become ready for a participant
      Alice chooses 5 minutes with 2 seconds increment for the Custom Game:
        target: Neither person is ready for the Custom Game — 3
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:21
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          example: A time choice requires renewed agreement
      ? Alice starts the Custom Game when Alice has a Custom Game between Alice as White and Bob as Black and Alice
        and Bob are ready for the Custom Game and Bob is no longer ready for the Custom Game
      : target: Alice is told every person must be ready — 4
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:28
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          - Bob is no longer ready for the Custom Game
          example: A participant who is no longer ready stops the start
      ? Alice starts the Custom Game when Alice has a Custom Game between Alice as White and Bob as Black and Alice
        and Bob are ready for the Custom Game
      : target: The Custom Game is active with White to move — 5
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:37
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          example: Ready participants start one game
      Alice starts the Custom Game when Alice has a configuring Custom Game and Alice is ready for the Custom Game:
        target: Alice is told both sides need participants — 6
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:43
          condition:
          - Alice has a configuring Custom Game
          - Alice is ready for the Custom Game
          example: An open place prevents start
      ? Alice starts the Custom Game when Alice has a configuring Custom Game and Black in the Custom Game is reserved
        for Bob and Alice is ready for the Custom Game
      : target: Alice is told both sides need participants — 7
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:49
          condition:
          - Alice has a configuring Custom Game
          - Black in the Custom Game is reserved for Bob
          - Alice is ready for the Custom Game
          example: An invitation prevents start
      Bob starts the Custom Game:
        target: Bob is told only the creator starts the Custom Game — 8
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:56
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          example: A participant cannot start instead of the creator
      Alice starts the Custom Game when Alice has an active Custom Game between Alice as White and Bob as Black:
        target: The Custom Game remains active with no new game — 9
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:64
          condition:
          - Alice has an active Custom Game between Alice as White and Bob as Black
          example: Repeating an acknowledged start keeps the current board
      Alice starts the Custom Game when Alice has a completed Custom Game between Alice as White and Bob as Black:
        target: Alice is told the Custom Game has finished — 10
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:69
          condition:
          - Alice has a completed Custom Game between Alice as White and Bob as Black
          example: A completed game cannot restart
      Alice starts the Custom Game when Alice has a cancelled Custom Game:
        target: Alice is told the Custom Game was cancelled — 11
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:74
          condition:
          - Alice has a cancelled Custom Game
          example: A cancelled game cannot restart
      Alice starts the Custom Game twice at the same time:
        target: The Custom Game remains active with no new game — 12
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:81
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          example: Two starts produce one game
      Alice starts the Custom Game with the earlier choices:
        target: Alice is told the Custom Game choices have changed — 13
        meta:
          source:
          - specs/chess/custom-game-readiness.feature:87
          condition:
          - Alice has a Custom Game between Alice as White and Bob as Black
          - Alice and Bob are ready for the Custom Game
          - The Custom Game choices changed before Alice's start
          example: A stale start cannot bypass changed choices
