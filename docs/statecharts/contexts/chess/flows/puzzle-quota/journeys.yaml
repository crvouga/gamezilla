journeys:
  A guest's twentieth puzzle of the day still starts:
    description: A guest's twentieth puzzle of the day still starts
    startingConditions:
    - Alice is a guest who has played 19 puzzles today
    events:
    - Alice moves on to the next puzzle
    endsIn: Alice has a puzzle on the board — 1
    checks:
    - Alice has a puzzle on the board
    - Alice is not shown the puzzle limit
    gherkin:
    - specs/chess/puzzle-quota.feature:9 — A guest's twentieth puzzle of the day still starts
    exampleRow: []
  The next puzzle past the limit does not start:
    description: The next puzzle past the limit does not start
    startingConditions:
    - Alice is a guest who has finished today's last allowed puzzle
    events:
    - Alice asks for another puzzle
    endsIn: Alice is told no new puzzle can start because today's allowance is used within 15 seconds — 2
    checks:
    - Alice is told no new puzzle can start because today's allowance is used within 15 seconds
    - Alice has no puzzle on the board
    gherkin:
    - specs/chess/puzzle-quota.feature:15 — The next puzzle past the limit does not start
    exampleRow: []
  The puzzle on the board can still be finished once the limit is reached:
    description: The puzzle on the board can still be finished once the limit is reached
    startingConditions:
    - Alice is a guest who reached today's puzzle limit while solving a puzzle
    events:
    - Alice solves the puzzle
    endsIn: Alice's puzzle is solved — 3
    checks:
    - Alice's puzzle is solved
    - Alice is not shown the puzzle limit
    gherkin:
    - specs/chess/puzzle-quota.feature:24 — The puzzle on the board can still be finished once the limit is reached
    exampleRow: []
  Signing in lifts the limit and a puzzle is ready again:
    description: Signing in lifts the limit and a puzzle is ready again
    startingConditions:
    - Alice is a guest who has been shown today's puzzle limit
    - Alice is signed in with Google
    events:
    - Alice goes back to the puzzles when Alice is a guest who has been shown today's puzzle limit and Alice is
      signed in with Google
    endsIn: Alice has a puzzle on the board within 30 seconds — 4
    checks:
    - Alice has a puzzle on the board within 30 seconds
    - Alice is not shown the puzzle limit
    gherkin:
    - specs/chess/puzzle-quota.feature:33 — Signing in lifts the limit and a puzzle is ready again
    exampleRow: []
  Going back to a puzzle unfinished at the limit uses no further start:
    description: Going back to a puzzle unfinished at the limit uses no further start
    startingConditions:
    - Alice is a guest who reached today's puzzle limit while solving a puzzle
    - Alice has left the puzzle for the chess choices
    events:
    - Alice goes back to the puzzles when Alice is a guest who reached today's puzzle limit while solving a puzzle
      and Alice has left the puzzle for the chess choices
    endsIn: Alice is on the same puzzle as before — 5
    checks:
    - Alice is on the same puzzle as before
    - Alice is still asked to find the next move
    - Alice is not shown the puzzle limit
    gherkin:
    - specs/chess/puzzle-quota.feature:42 — Going back to a puzzle unfinished at the limit uses no further start
    exampleRow: []
  A puzzle open at the limit when the app closed is waiting on return:
    description: A puzzle open at the limit when the app closed is waiting on return
    startingConditions:
    - Alice is a guest who reached today's puzzle limit while solving a puzzle
    - Alice has closed and reopened the app
    events:
    - Alice returns to their space
    endsIn: Alice is asked to find the next move within 20 seconds — 6
    checks:
    - Alice is asked to find the next move within 20 seconds
    - Alice is on the same puzzle as before
    - Alice is not shown the puzzle limit
    gherkin:
    - specs/chess/puzzle-quota.feature:50 — A puzzle open at the limit when the app closed is waiting on return
    exampleRow: []
  Going back after the puzzle is over does not save a puzzle start for later:
    description: Going back after the puzzle is over does not save a puzzle start for later
    startingConditions:
    - Alice is a guest who has finished today's last allowed puzzle
    - Alice has left the puzzle for the chess choices
    events:
    - Alice goes back to the puzzles when Alice is a guest who has finished today's last allowed puzzle and Alice
      has left the puzzle for the chess choices
    endsIn: Alice is told no new puzzle can start because today's allowance is used within 15 seconds — 7
    checks:
    - Alice is told no new puzzle can start because today's allowance is used within 15 seconds
    - Alice has no puzzle on the board
    gherkin:
    - specs/chess/puzzle-quota.feature:58 — Going back after the puzzle is over does not save a puzzle start for
      later
    exampleRow: []
  Starting a puzzle shows the remaining allowance:
    description: Starting a puzzle shows the remaining allowance
    startingConditions:
    - Alice is a guest
    - Alice is hosting a space
    events:
    - Alice opens puzzles in their space
    endsIn: Alice can read that 19 rated puzzles remain today — 8
    checks:
    - Alice can read that 19 rated puzzles remain today
    gherkin:
    - specs/chess/puzzle-quota.feature:68 — Starting a puzzle shows the remaining allowance
    exampleRow: []
  Retrying uses none of the remaining allowance:
    description: Retrying uses none of the remaining allowance
    startingConditions:
    - Alice is a guest
    - Alice is playing puzzles in their space
    - Alice has played a wrong move
    events:
    - Alice retries the puzzle
    endsIn: Alice can read that 19 rated puzzles remain today — 9
    checks:
    - Alice can read that 19 rated puzzles remain today
    gherkin:
    - specs/chess/puzzle-quota.feature:75 — Retrying uses none of the remaining allowance
    exampleRow: []
