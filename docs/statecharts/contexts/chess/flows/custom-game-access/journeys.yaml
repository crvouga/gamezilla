journeys:
  A guest watches without taking a side:
    description: A guest watches without taking a side
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Carol is a guest in Alice's space
    events:
    - Carol watches the Custom Game
    endsIn: Carol sees the active Custom Game with White to move — 1
    checks:
    - Carol sees the active Custom Game with White to move
    - Carol cannot move pieces in the Custom Game
    gherkin:
    - specs/chess/custom-game-access.feature:7 — A guest watches without taking a side
    exampleRow: []
  An outsider cannot watch the game:
    description: An outsider cannot watch the game
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Carol is outside Alice's space
    events:
    - Carol tries to watch the Custom Game
    endsIn: Carol cannot see the Custom Game — 2
    checks:
    - Carol cannot see the Custom Game
    gherkin:
    - specs/chess/custom-game-access.feature:14 — An outsider cannot watch the game
    exampleRow: []
  A guest joining from the space link may take an open place:
    description: A guest joining from the space link may take an open place
    startingConditions:
    - Alice has a configuring Custom Game
    - Carol has joined Alice's space from the link
    events:
    - Carol claims Black in the Custom Game when Alice has a configuring Custom Game and Carol has joined Alice's
      space from the link
    endsIn: Black is Carol in the Custom Game — 3
    checks:
    - Black is Carol in the Custom Game
    gherkin:
    - specs/chess/custom-game-access.feature:22 — A guest joining from the space link may take an open place
    exampleRow: []
  An outsider cannot claim a side by knowing about it:
    description: An outsider cannot claim a side by knowing about it
    startingConditions:
    - Alice has a configuring Custom Game
    - Carol is outside Alice's space
    events:
    - Carol claims Black in the Custom Game when Alice has a configuring Custom Game and Carol is outside Alice's
      space
    endsIn: Carol is told they are not in the space — 4
    checks:
    - Carol is told they are not in the space
    gherkin:
    - specs/chess/custom-game-access.feature:28 — An outsider cannot claim a side by knowing about it
    exampleRow: []
  Free access keeps a bot game available:
    description: Free access keeps a bot game available
    startingConditions:
    - Alice is signed in
    - Alice has a configuring Custom Game
    - Alice's paid access has ended
    events:
    - Alice assigns a bot to Black in the Custom Game
    endsIn: Black is a bot in the Custom Game — 5
    checks:
    - Black is a bot in the Custom Game
    gherkin:
    - specs/chess/custom-game-access.feature:36 — Free access keeps a bot game available
    exampleRow: []
  Paid access does not let a watcher configure another person's game:
    description: Paid access does not let a watcher configure another person's game
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Carol is a Plus member in Alice's space
    events:
    - Carol assigns a bot to Black in the Custom Game
    endsIn: Carol is told only the creator configures the Custom Game — 6
    checks:
    - Carol is told only the creator configures the Custom Game
    gherkin:
    - specs/chess/custom-game-access.feature:43 — Paid access does not let a watcher configure another person's
      game
    exampleRow: []
