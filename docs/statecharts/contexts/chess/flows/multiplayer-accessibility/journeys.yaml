journeys:
  A person using the keyboard can seek a chess opponent:
    description: A person using the keyboard can seek a chess opponent
    startingConditions:
    - Alice has an account and is using the keyboard alone
    events:
    - Alice finds a chess opponent for 5+0 with the keyboard
    endsIn: Alice is looking for a chess opponent — 1
    checks:
    - Alice is looking for a chess opponent
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:9 — A person using the keyboard can seek a chess opponent
    exampleRow: []
  A person using the keyboard can move a piece and resign:
    description: A person using the keyboard can move a piece and resign
    startingConditions:
    - Alice is White after e4 and e5 in a 5+0 multiplayer game and is using the keyboard alone
    events:
    - Alice plays g1 to f3 as a multiplayer move with the keyboard
    endsIn: Bob has the multiplayer turn — 2
    checks:
    - Bob has the multiplayer turn
    - Alice can resign multiplayer chess with the keyboard
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:14 — A person using the keyboard can move a piece and resign
    exampleRow: []
  A person using the keyboard can abort a new game:
    description: A person using the keyboard can abort a new game
    startingConditions:
    - Alice is White in a new multiplayer game and is using the keyboard alone
    events:
    - Alice aborts the multiplayer game with the keyboard
    endsIn: both people see the multiplayer game was aborted — 3
    checks:
    - both people see the multiplayer game was aborted
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:20 — A person using the keyboard can abort a new game
    exampleRow: []
  A person using the keyboard can offer a multiplayer draw:
    description: A person using the keyboard can offer a multiplayer draw
    startingConditions:
    - Alice is White in a new multiplayer game and is using the keyboard alone
    events:
    - Alice offers a multiplayer draw with the keyboard
    endsIn: Bob is offered a multiplayer draw — 4
    checks:
    - Bob is offered a multiplayer draw
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:25 — A person using the keyboard can offer a multiplayer draw
    exampleRow: []
  A person using the keyboard can offer a multiplayer rematch:
    description: A person using the keyboard can offer a multiplayer rematch
    startingConditions:
    - Alice is using the keyboard alone after her 5+0 multiplayer game with Bob is over
    events:
    - Alice offers a multiplayer rematch with the keyboard
    endsIn: Bob is offered a multiplayer rematch — 5
    checks:
    - Bob is offered a multiplayer rematch
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:30 — A person using the keyboard can offer a multiplayer rematch
    exampleRow: []
  A listener hears who they were matched with:
    description: A listener hears who they were matched with
    startingConditions:
    - Alice is listening to the app while looking for a 3+2 chess opponent
    events:
    - a matchmaking match is formed for Alice and Bob
    endsIn: Alice hears she was matched with Bob, his blitz rating, the time control and her colour — 6
    checks:
    - Alice hears she was matched with Bob, his blitz rating, the time control and her colour
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:38 — A listener hears who they were matched with
    exampleRow: []
  A listener hears their side and the person whose turn it is:
    description: A listener hears their side and the person whose turn it is
    startingConditions:
    - Alice is White in a new multiplayer game and is listening to the app
    events:
    - Alice opens multiplayer chess when Alice is White in a new multiplayer game and is listening to the app
    endsIn: Alice hears she is White and has the multiplayer turn — 7
    checks:
    - Alice hears she is White and has the multiplayer turn
    - Alice hears what every multiplayer control does
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:43 — A listener hears their side and the person whose turn it
      is
    exampleRow: []
  A listener hears the time left on both multiplayer clocks:
    description: A listener hears the time left on both multiplayer clocks
    startingConditions:
    - Alice is listening to her unfinished multiplayer game with Bob
    events:
    - Alice opens multiplayer chess when Alice is listening to her unfinished multiplayer game with Bob
    endsIn: Alice hears the time left on both multiplayer clocks — 8
    checks:
    - Alice hears the time left on both multiplayer clocks
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:49 — A listener hears the time left on both multiplayer clocks
    exampleRow: []
  A listener hears a multiplayer draw offer:
    description: A listener hears a multiplayer draw offer
    startingConditions:
    - Alice is listening to her unfinished multiplayer game with Bob
    events:
    - Bob offers a multiplayer draw
    endsIn: Alice hears Bob offered her a multiplayer draw — 9
    checks:
    - Alice hears Bob offered her a multiplayer draw
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:54 — A listener hears a multiplayer draw offer
    exampleRow: []
  A listener hears that the game was aborted:
    description: A listener hears that the game was aborted
    startingConditions:
    - Alice is White in a new multiplayer game and is listening to the app
    events:
    - Bob aborts the multiplayer game
    endsIn: Alice hears the multiplayer game was aborted — 10
    checks:
    - Alice hears the multiplayer game was aborted
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:59 — A listener hears that the game was aborted
    exampleRow: []
  A listener hears a multiplayer rematch offer:
    description: A listener hears a multiplayer rematch offer
    startingConditions:
    - Alice is listening to the app after her 5+0 multiplayer game with Bob is over
    events:
    - Bob offers a multiplayer rematch
    endsIn: Alice hears Bob offered her a multiplayer rematch — 11
    checks:
    - Alice hears Bob offered her a multiplayer rematch
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:64 — A listener hears a multiplayer rematch offer
    exampleRow: []
  A listener hears an accepted multiplayer result:
    description: A listener hears an accepted multiplayer result
    startingConditions:
    - Alice is listening to her 5+0 multiplayer game with Bob after e4 and e5
    events:
    - Bob resigns multiplayer chess
    endsIn: Alice hears she won the multiplayer game — 12
    checks:
    - Alice hears she won the multiplayer game
    gherkin:
    - specs/chess/multiplayer-accessibility.feature:69 — A listener hears an accepted multiplayer result
    exampleRow: []
