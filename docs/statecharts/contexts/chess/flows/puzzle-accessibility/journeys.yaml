journeys:
  Opening a puzzle tells someone listening to the app the setup move and which side is to move:
    description: Opening a puzzle tells someone listening to the app the setup move and which side is to move
    startingConditions:
    - Alice is signed in
    - Alice is listening to the app
    events:
    - Alice opens the two-rook clearance puzzle
    endsIn: Alice hears the setup move a7-a6 — 1
    checks:
    - Alice hears the setup move a7-a6
    - Alice hears that White is to move
    gherkin:
    - specs/chess/puzzle-accessibility.feature:13 — Opening a puzzle tells someone listening to the app the setup
      move and which side is to move
    exampleRow: []
