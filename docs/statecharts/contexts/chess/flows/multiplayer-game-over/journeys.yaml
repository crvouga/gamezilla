journeys:
  A game drawn by agreement keeps its board and moves on another device:
    description: A game drawn by agreement keeps its board and moves on another device
    startingConditions:
    - Alice's 5+0 multiplayer game with Bob was drawn by agreement after e4 and e5
    events:
    - Alice opens multiplayer chess on another device
    endsIn: Alice sees the multiplayer game is drawn by agreement — 1
    checks:
    - Alice sees the multiplayer game is drawn by agreement
    - Alice sees the multiplayer move list "1. e4 e5"
    gherkin:
    - specs/chess/multiplayer-game-over.feature:9 — A game drawn by agreement keeps its board and moves on another
      device
    exampleRow: []
  No move is accepted after a draw by agreement:
    description: No move is accepted after a draw by agreement
    startingConditions:
    - Alice's 5+0 multiplayer game with Bob was drawn by agreement after e4 and e5
    events:
    - Alice plays g1 to f3 as a multiplayer move
    endsIn: Alice is told the multiplayer game is over — 2
    checks:
    - Alice is told the multiplayer game is over
    - both people still see the multiplayer move list "1. e4 e5"
    gherkin:
    - specs/chess/multiplayer-game-over.feature:15 — No move is accepted after a draw by agreement
    exampleRow: []
  No move is accepted in an aborted game:
    description: No move is accepted in an aborted game
    startingConditions:
    - Alice's 5+0 multiplayer game with Bob was aborted
    events:
    - Alice plays e2 to e4 as a multiplayer move
    endsIn: Alice is told the multiplayer game is over — 3
    checks:
    - Alice is told the multiplayer game is over
    - both people still see the multiplayer game was aborted
    gherkin:
    - specs/chess/multiplayer-game-over.feature:21 — No move is accepted in an aborted game
    exampleRow: []
  A person can find a new opponent after a draw by agreement:
    description: A person can find a new opponent after a draw by agreement
    startingConditions:
    - Alice's 5+0 multiplayer game with Bob was drawn by agreement after e4 and e5
    events:
    - Alice finds a new opponent
    endsIn: Alice is looking for a 5+0 chess opponent — 4
    checks:
    - Alice is looking for a 5+0 chess opponent
    gherkin:
    - specs/chess/multiplayer-game-over.feature:29 — A person can find a new opponent after a draw by agreement
    exampleRow: []
  A won game offers no resigning, aborting or draw offer:
    description: A won game offers no resigning, aborting or draw offer
    startingConditions:
    - Bob resigned multiplayer chess and Alice won
    events:
    - Alice opens multiplayer chess when Bob resigned multiplayer chess and Alice won
    endsIn: Alice cannot resign multiplayer chess, abort the multiplayer game or offer a multiplayer draw — 5
    checks:
    - Alice cannot resign multiplayer chess, abort the multiplayer game or offer a multiplayer draw
    gherkin:
    - specs/chess/multiplayer-game-over.feature:34 — A won game offers no resigning, aborting or draw offer
    exampleRow: []
  A game drawn by agreement offers no resigning, aborting or draw offer:
    description: A game drawn by agreement offers no resigning, aborting or draw offer
    startingConditions:
