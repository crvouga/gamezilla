  A person who has never played has no multiplayer game to act on:
    description: A person who has never played has no multiplayer game to act on
    startingConditions:
    - Alice has a free account and has never played a multiplayer game
    events:
    - Alice opens multiplayer chess when Alice has a free account and has never played a multiplayer game
    endsIn: Alice cannot resign multiplayer chess, abort the multiplayer game or offer a multiplayer draw — 8
    checks:
    - Alice cannot resign multiplayer chess, abort the multiplayer game or offer a multiplayer draw
    - Alice cannot find a new opponent or offer a multiplayer rematch
