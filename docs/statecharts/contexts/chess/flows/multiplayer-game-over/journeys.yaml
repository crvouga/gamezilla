    exampleRow: []
  An aborted game offers no resigning, aborting or draw offer:
    description: An aborted game offers no resigning, aborting or draw offer
    startingConditions:
    - Alice's 5+0 multiplayer game with Bob was aborted
    events:
    - Alice opens multiplayer chess when Alice's 5+0 multiplayer game with Bob was aborted
