journeys:
  A host finds an opponent from the space's chess choices:
    description: A host finds an opponent from the space's chess choices
    startingConditions:
    - Alice is signed in
    - Alice is hosting a space
    events:
    - Alice finds a chess opponent when Alice is signed in and Alice is hosting a space
    endsIn: Alice is looking for a chess opponent — 1
    checks:
    - Alice is looking for a chess opponent
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:8 — A host finds an opponent from the space's chess choices
    exampleRow: []
  A person outside a space cannot find a chess opponent:
    description: A person outside a space cannot find a chess opponent
    startingConditions:
    - Alice has a free account and a connection
    - Alice is outside a space
    events:
    - Alice finds a chess opponent when Alice has a free account and a connection and Alice is outside a space
    endsIn: Alice is told multiplayer chess needs a space — 2
    checks:
    - Alice is told multiplayer chess needs a space
    - Alice is not looking for a chess opponent
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:15 — A person outside a space cannot find a chess opponent
    exampleRow: []
  Guests in different spaces see the accepted multiplayer move:
    description: Guests in different spaces see the accepted multiplayer move
    startingConditions:
    - Alice and Bob have a multiplayer game in different spaces
    - Carol is a guest watching Alice's multiplayer game
    - Dave is a guest watching Bob's multiplayer game
    events:
    - Alice plays e2 to e4 as a multiplayer move when Alice and Bob have a multiplayer game in different spaces
      and Carol is a guest watching Alice's multiplayer game and Dave is a guest watching Bob's multiplayer game
    endsIn: Carol and Dave see the multiplayer pawn on e4 — 3
    checks:
    - Carol and Dave see the multiplayer pawn on e4
    - Carol and Dave cannot move multiplayer pieces
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:26 — Guests in different spaces see the accepted multiplayer move
    exampleRow: []
  A guest arriving after a move sees the current multiplayer board:
    description: A guest arriving after a move sees the current multiplayer board
    startingConditions:
    - Alice's multiplayer move e2 to e4 was accepted
    - Carol is a guest
    events:
    - Carol joins Alice's space
    endsIn: Carol sees the multiplayer pawn on e4 — 4
    checks:
    - Carol sees the multiplayer pawn on e4
    - Carol cannot move multiplayer pieces
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:34 — A guest arriving after a move sees the current multiplayer
      board
    exampleRow: []
  A matched host moves from their space:
    description: A matched host moves from their space
    startingConditions:
    - Alice and Bob have a multiplayer game in different spaces
    events:
    - Alice plays e2 to e4 as a multiplayer move when Alice and Bob have a multiplayer game in different spaces
    endsIn: both multiplayer boards show the white pawn on e4 — 5
    checks:
    - both multiplayer boards show the white pawn on e4
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:43 — A matched host moves from their space
    exampleRow: []
  A guest watching a multiplayer game cannot move:
    description: A guest watching a multiplayer game cannot move
    startingConditions:
    - Alice and Bob have a multiplayer game in different spaces
    - Carol is a guest watching Alice's multiplayer game
    events:
    - Carol plays e2 to e4 in Alice's multiplayer game
    endsIn: Carol is told only the matched people can move multiplayer pieces — 6
    checks:
    - Carol is told only the matched people can move multiplayer pieces
    - Alice and Bob keep the same multiplayer board
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:48 — A guest watching a multiplayer game cannot move
    exampleRow: []
  Someone outside either space cannot watch the multiplayer game:
    description: Someone outside either space cannot watch the multiplayer game
    startingConditions:
    - Alice and Bob have a multiplayer game in different spaces
    events:
    - Carol opens Alice's multiplayer game
    endsIn: Carol is told no multiplayer game is available to her — 7
    checks:
    - Carol is told no multiplayer game is available to her
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:56 — Someone outside either space cannot watch the multiplayer game
    exampleRow: []
  A guest sees the result shared by the matched people:
    description: A guest sees the result shared by the matched people
    startingConditions:
    - Alice is White and Bob is Black in a 5+0 multiplayer game after e4 and e5
    - Carol is a guest watching Alice's multiplayer game
    events:
    - Bob resigns multiplayer chess
    endsIn: Carol sees Alice won the multiplayer game — 8
    checks:
    - Carol sees Alice won the multiplayer game
    - Carol cannot move multiplayer pieces
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:64 — A guest sees the result shared by the matched people
    exampleRow: []
  A guest who leaves no longer sees the multiplayer board:
    description: A guest who leaves no longer sees the multiplayer board
    startingConditions:
    - Alice and Bob have a multiplayer game in different spaces
    - Carol is a guest watching Alice's multiplayer game
    events:
    - Carol leaves the space
    endsIn: Carol has no multiplayer board — 9
    checks:
    - Carol has no multiplayer board
    gherkin:
    - specs/chess/multiplayer-in-spaces.feature:71 — A guest who leaves no longer sees the multiplayer board
    exampleRow: []
