    checks:
    - Alice's puzzle is solved
    - Alice's game log records that puzzle as failed
    - Alice's stats show 1 played, 0 solved, and 0% accuracy
    gherkin:
    - specs/chess/puzzle-controls.feature:39 — A puzzle solved after a retry is still logged as failed
    exampleRow: []
  Retrying a solved puzzle keeps the solved outcome:
