    gherkin:
    - specs/chess/puzzle-controls.feature:22 — A puzzle can still be solved after both hints
    exampleRow: []
  A puzzle without a wrong move or a result offers no retry:
    description: A puzzle without a wrong move or a result offers no retry
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    events:
