    endsIn: Alice is not offered to retry — 4
    checks:
    - Alice is not offered to retry
    - Alice is still asked to find the next move
    gherkin:
    - specs/chess/puzzle-controls.feature:29 — A puzzle without a wrong move or a result offers no retry
    exampleRow: []
  Retrying after a wrong move lets Alice carry on solving:
    description: Retrying after a wrong move lets Alice carry on solving
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has played a wrong move
