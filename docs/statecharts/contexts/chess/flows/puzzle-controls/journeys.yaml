journeys:
  A first hint highlights the piece to move:
    description: A first hint highlights the piece to move
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    events:
    - Alice asks for a hint
    endsIn: Alice's hint highlights the piece to move — 1
    checks:
    - Alice's hint highlights the piece to move
    gherkin:
    - specs/chess/puzzle-controls.feature:13 — A first hint highlights the piece to move
    exampleRow: []
  A second hint shows the solution move:
    description: A second hint shows the solution move
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has taken a hint
    events:
    - Alice asks for another hint
    endsIn: Alice's hint shows the solution move — 2
    checks:
    - Alice's hint shows the solution move
    gherkin:
    - specs/chess/puzzle-controls.feature:17 — A second hint shows the solution move
    exampleRow: []
  A puzzle can still be solved after both hints:
    description: A puzzle can still be solved after both hints
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    - Alice has taken two hints
