  A block with someone else does not stop a claim:
    description: A block with someone else does not stop a claim
    startingConditions:
    - Alice has a configuring Custom Game
    - Bob is in Alice's space
    - Bob has blocked Carol
    events:
    - Bob claims Black in the Custom Game when Alice has a configuring Custom Game and Bob is in Alice's space and
      Bob has blocked Carol
    endsIn: Black is Bob in the Custom Game — 4
    checks:
    - Black is Bob in the Custom Game
    gherkin:
    - specs/chess/custom-game-blocking.feature:34 — A block with someone else does not stop a claim
    exampleRow: []
  A blocked person cannot claim the open place:
    description: A blocked person cannot claim the open place
    startingConditions:
    - Alice has a configuring Custom Game
    - Bob is in Alice's space
    - Alice has blocked Bob
    events:
    - Bob claims Black in the Custom Game when Alice has a configuring Custom Game and Bob is in Alice's space and
