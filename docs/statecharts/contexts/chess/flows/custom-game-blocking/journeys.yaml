journeys:
  A block with someone else does not stop an invitation:
    description: A block with someone else does not stop an invitation
    startingConditions:
    - Alice has a configuring Custom Game
    - Bob is in Alice's space
    - Alice has blocked Carol
    events:
    - Alice invites Bob to Black in the Custom Game when Alice has a configuring Custom Game and Bob is in Alice's
      space and Alice has blocked Carol
    endsIn: Black is reserved for Bob in the Custom Game — 1
    checks:
    - Black is reserved for Bob in the Custom Game
    gherkin:
