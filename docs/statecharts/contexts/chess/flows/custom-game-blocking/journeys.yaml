    - Bob is not told Alice blocked him
    gherkin:
    - specs/chess/custom-game-blocking.feature:39 — A blocked person cannot claim the open place
    exampleRow: []
  Blocking the other participant keeps the active game:
    description: Blocking the other participant keeps the active game
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    events:
    - Alice blocks Bob
    endsIn: The Custom Game remains active — 6
    checks:
    - The Custom Game remains active
    - Neither person has won the Custom Game
    gherkin:
    - specs/chess/custom-game-blocking.feature:48 — Blocking the other participant keeps the active game
    exampleRow: []
