journeys:
  Returning allows a fresh claim:
    description: Returning allows a fresh claim
    startingConditions:
    - Alice has a configuring Custom Game
    - Bob is in Alice's space
    - Bob has returned online after an offline claim was refused
    events:
    - Bob claims Black in the Custom Game when Alice has a configuring Custom Game and Bob is in Alice's space and
      Bob has returned online after an offline claim was refused
    endsIn: Black is Bob in the Custom Game — 1
    checks:
    - Black is Bob in the Custom Game
    gherkin:
    - specs/chess/custom-game-connection.feature:7 — Returning allows a fresh claim
    exampleRow: []
  An offline claim does not reserve a side:
    description: An offline claim does not reserve a side
    startingConditions:
    - Alice has a configuring Custom Game
    - Bob is in Alice's space
    - Bob is offline
    events:
    - Bob claims Black in the Custom Game when Alice has a configuring Custom Game and Bob is in Alice's space and
      Bob is offline
    endsIn: Bob is told Custom Games need a connection — 2
    checks:
    - Bob is told Custom Games need a connection
    - Black is an open place in the Custom Game
    gherkin:
    - specs/chess/custom-game-connection.feature:14 — An offline claim does not reserve a side
    exampleRow: []
  An offline start cannot launch later:
    description: An offline start cannot launch later
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    - Alice is offline
    events:
    - Alice starts the Custom Game
    endsIn: Alice is told Custom Games need a connection — 3
    checks:
    - Alice is told Custom Games need a connection
    - The Custom Game remains configuring
    gherkin:
    - specs/chess/custom-game-connection.feature:22 — An offline start cannot launch later
    exampleRow: []
  A returning watcher sees the game that started while they were away:
    description: A returning watcher sees the game that started while they were away
    startingConditions:
    - Alice has a Custom Game between Alice as White and Bob as Black
    - Alice and Bob are ready for the Custom Game
    - Bob is offline
    - Alice has started the Custom Game
    events:
    - the connection comes back when Alice has a Custom Game between Alice as White and Bob as Black and Alice and
      Bob are ready for the Custom Game and Bob is offline and Alice has started the Custom Game
    endsIn: Bob sees the active Custom Game with White to move — 4
    checks:
    - Bob sees the active Custom Game with White to move
    gherkin:
    - specs/chess/custom-game-connection.feature:32 — A returning watcher sees the game that started while they
      were away
    exampleRow: []
  A returning participant cannot revive a completed game:
    description: A returning participant cannot revive a completed game
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Bob is offline
    - Alice has resigned the Custom Game
    events:
    - the connection comes back when Alice has an active Custom Game between Alice as White and Bob as Black and
      Bob is offline and Alice has resigned the Custom Game
    endsIn: Bob sees the completed Custom Game — 5
    checks:
    - Bob sees the completed Custom Game
    - Bob cannot move pieces in the Custom Game
    gherkin:
    - specs/chess/custom-game-connection.feature:40 — A returning participant cannot revive a completed game
    exampleRow: []
  A bot choice is kept after reopening:
    description: A bot choice is kept after reopening
    startingConditions:
    - Alice has a configuring Custom Game
    - Black in the Custom Game is a bot
    events:
    - Alice closes and reopens the app
    endsIn: Black is a bot in the Custom Game — 6
    checks:
    - Black is a bot in the Custom Game
    gherkin:
    - specs/chess/custom-game-connection.feature:50 — A bot choice is kept after reopening
    exampleRow: []
  An earlier choice cannot overwrite a newer configuration:
    description: An earlier choice cannot overwrite a newer configuration
    startingConditions:
    - Alice has a configuring Custom Game
    - Black has since been replaced by a bot
    events:
    - Alice opens Black using earlier Custom Game choices
    endsIn: Alice is told the Custom Game choices have changed — 7
    checks:
    - Alice is told the Custom Game choices have changed
    - Black is a bot in the Custom Game
    gherkin:
    - specs/chess/custom-game-connection.feature:56 — An earlier choice cannot overwrite a newer configuration
    exampleRow: []
