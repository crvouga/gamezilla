journeys:
  A person on the team starts adding puzzles:
    description: A person on the team starts adding puzzles
    startingConditions:
    - Alice is signed in and on the team for this environment
    events:
    - Alice adds puzzles to this environment when Alice is signed in and on the team for this environment
    endsIn: Alice sees that this environment is adding puzzles — 1
    checks:
    - Alice sees that this environment is adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:8 — A person on the team starts adding puzzles
    exampleRow: []
  A person outside the team cannot add puzzles:
    description: A person outside the team cannot add puzzles
    startingConditions:
    - Alice is signed in and not on the team for this environment
    events:
    - Alice tries to add puzzles to this environment when Alice is signed in and not on the team for this environment
    endsIn: Alice is told only the team can add puzzles — 2
    checks:
    - Alice is told only the team can add puzzles
    - this environment is not adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:13 — A person outside the team cannot add puzzles
    exampleRow: []
  A ready environment starts adding puzzles:
    description: A ready environment starts adding puzzles
    startingConditions:
    - Alice is on the team for this environment
    - this environment is ready to add puzzles
    events:
    - Alice adds puzzles to this environment when Alice is on the team for this environment and this environment
      is ready to add puzzles
    endsIn: Alice sees that this environment is adding puzzles — 3
    checks:
    - Alice sees that this environment is adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:21 — A ready environment starts adding puzzles
    exampleRow: []
  Another addition is refused while one is in progress:
    description: Another addition is refused while one is in progress
    startingConditions:
    - Alice is on the team for this environment
    - this environment is adding puzzles
    events:
    - Alice tries to add puzzles to this environment when Alice is on the team for this environment and this environment
      is adding puzzles
    endsIn: Alice is told this environment is already adding puzzles — 4
    checks:
    - Alice is told this environment is already adding puzzles
    - this environment is still adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:27 — Another addition is refused while one is in progress
    exampleRow: []
  A team can start again after it finished adding puzzles:
    description: A team can start again after it finished adding puzzles
    startingConditions:
    - Alice is on the team for this environment
    - this environment finished adding puzzles
    events:
    - Alice adds puzzles to this environment when Alice is on the team for this environment and this environment
      finished adding puzzles
    endsIn: Alice sees that this environment is adding puzzles — 5
    checks:
    - Alice sees that this environment is adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:34 — A team can start again after it finished adding puzzles
    exampleRow: []
  A team can start again after it failed to add puzzles:
    description: A team can start again after it failed to add puzzles
    startingConditions:
    - Alice is on the team for this environment
    - this environment failed to add puzzles
    events:
    - Alice adds puzzles to this environment when Alice is on the team for this environment and this environment
      failed to add puzzles
    endsIn: Alice sees that this environment is adding puzzles — 6
    checks:
    - Alice sees that this environment is adding puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:40 — A team can start again after it failed to add puzzles
    exampleRow: []
  Adding puzzles changes this environment's puzzle pool:
    description: Adding puzzles changes this environment's puzzle pool
    startingConditions:
    - Alice is on the team for this environment
    events:
    - Alice adds puzzles to this environment when Alice is on the team for this environment
    endsIn: this environment's puzzle pool holds the added puzzles — 7
    checks:
    - this environment's puzzle pool holds the added puzzles
    gherkin:
    - specs/chess/puzzle-ingest.feature:48 — Adding puzzles changes this environment's puzzle pool
    exampleRow: []
  Adding puzzles leaves another environment unchanged:
    description: Adding puzzles leaves another environment unchanged
    startingConditions:
    - Alice is on the team for this environment
    - another environment has its own puzzle pool
    events:
    - Alice adds puzzles to this environment when Alice is on the team for this environment and another environment
      has its own puzzle pool
    endsIn: the other environment's puzzle pool is still unchanged — 8
    checks:
    - the other environment's puzzle pool is still unchanged
    gherkin:
    - specs/chess/puzzle-ingest.feature:53 — Adding puzzles leaves another environment unchanged
    exampleRow: []
  A finished addition reports what entered the puzzle pool:
    description: A finished addition reports what entered the puzzle pool
    startingConditions:
    - Alice is on the team for this environment
    - this environment is adding puzzles
    events:
    - this environment finishes adding puzzles
    endsIn: Alice sees how many puzzles were added — 9
    checks:
    - Alice sees how many puzzles were added
    - Alice sees how many puzzles were broken
    gherkin:
    - specs/chess/puzzle-ingest.feature:61 — A finished addition reports what entered the puzzle pool
    exampleRow: []
  A failed addition leaves the earlier puzzle pool available:
    description: A failed addition leaves the earlier puzzle pool available
    startingConditions:
    - Alice is on the team for this environment
    - this environment is adding puzzles
    events:
    - this environment fails to add puzzles
    endsIn: Alice is told adding puzzles failed and why — 10
    checks:
    - Alice is told adding puzzles failed and why
    - a solver can still play from the earlier puzzle pool
    gherkin:
    - specs/chess/puzzle-ingest.feature:68 — A failed addition leaves the earlier puzzle pool available
    exampleRow: []
  A finished addition appears when the connection returns:
    description: A finished addition appears when the connection returns
    startingConditions:
    - Alice is on the team for this environment
    - adding puzzles finished while Alice was offline
    events:
    - Alice's device comes back online
    endsIn: Alice sees how many puzzles were added — 11
    checks:
    - Alice sees how many puzzles were added
    - Alice sees how many puzzles were broken
    gherkin:
    - specs/chess/puzzle-ingest.feature:75 — A finished addition appears when the connection returns
    exampleRow: []
  Broken puzzles the team added are never served:
    description: Broken puzzles the team added are never served
    startingConditions:
    - the team has added seven puzzles, five of them broken
    - Alice is a guest
    - Alice is playing puzzles in their space
    events:
    - Alice plays through every puzzle the feed offers
    endsIn: none of the broken puzzles was served to Alice — 12
    checks:
    - none of the broken puzzles was served to Alice
    gherkin:
    - specs/chess/puzzle-ingest.feature:85 — Broken puzzles the team added are never served
    exampleRow: []
