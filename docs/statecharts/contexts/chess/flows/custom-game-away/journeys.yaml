journeys:
  A participant who comes back before any claim continues the game:
    description: A participant who comes back before any claim continues the game
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Bob has been away from the Custom Game for 10 minutes
    events:
    - the connection comes back
    endsIn: Bob sees the active Custom Game with White to move — 1
    checks:
    - Bob sees the active Custom Game with White to move
    - Neither person has won the Custom Game
    gherkin:
    - specs/chess/custom-game-away.feature:8 — A participant who comes back before any claim continues the game
    exampleRow: []
  An away participant's clock keeps running:
    description: An away participant's clock keeps running
    startingConditions:
    - Alice has an active Custom Game with 1 minute and 0 seconds increment
    - Alice is away from the Custom Game
    events:
    - 60 seconds pass
    endsIn: Bob wins the Custom Game on time — 2
    checks:
    - Bob wins the Custom Game on time
    gherkin:
    - specs/chess/custom-game-away.feature:15 — An away participant's clock keeps running
    exampleRow: []
  White claims the win after Black stayed away for 60 seconds:
    description: White claims the win after Black stayed away for 60 seconds
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Bob has been away from the Custom Game for 60 seconds
    events:
    - Alice claims the win in the Custom Game when Alice has an active Custom Game between Alice as White and Bob
      as Black and Bob has been away from the Custom Game for 60 seconds
    endsIn: Alice wins the Custom Game because Bob stayed away — 3
    checks:
    - Alice wins the Custom Game because Bob stayed away
    gherkin:
    - specs/chess/custom-game-away.feature:23 — White claims the win after Black stayed away for 60 seconds
    exampleRow: []
  A claim after 59 seconds away is refused:
    description: A claim after 59 seconds away is refused
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Bob has been away from the Custom Game for 59 seconds
    events:
    - Alice claims the win in the Custom Game when Alice has an active Custom Game between Alice as White and Bob
      as Black and Bob has been away from the Custom Game for 59 seconds
    endsIn: Alice is told Bob may still return — 4
    checks:
    - Alice is told Bob may still return
    - The Custom Game remains active
    gherkin:
    - specs/chess/custom-game-away.feature:29 — A claim after 59 seconds away is refused
    exampleRow: []
  A watcher cannot claim the win:
    description: A watcher cannot claim the win
    startingConditions:
    - Alice has an active Custom Game between Alice as White and Bob as Black
    - Bob has been away from the Custom Game for 60 seconds
    - Carol is in Alice's space
    events:
    - Carol claims the win in the Custom Game
    endsIn: Carol is told only a participant may claim the win — 5
    checks:
    - Carol is told only a participant may claim the win
    - The Custom Game remains active
    gherkin:
    - specs/chess/custom-game-away.feature:36 — A watcher cannot claim the win
    exampleRow: []
  A claim cannot replace a completed outcome:
    description: A claim cannot replace a completed outcome
    startingConditions:
    - Alice has a completed Custom Game between Alice as White and Bob as Black
    - Bob is offline
    events:
    - Alice claims the win in the Custom Game when Alice has a completed Custom Game between Alice as White and
      Bob as Black and Bob is offline
    endsIn: Alice is told the Custom Game has finished — 6
    checks:
    - Alice is told the Custom Game has finished
    - The Custom Game keeps its completed outcome
    gherkin:
    - specs/chess/custom-game-away.feature:44 — A claim cannot replace a completed outcome
    exampleRow: []
