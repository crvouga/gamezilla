        meta:
          source:
          - specs/chess/puzzle-assistant.feature:21
          condition:
          - Alice is signed in
          - Alice is solving the puzzle with more than one mate on the final move
          example: A wrong move receives a diagnosis rather than praise
      Alice plays a wrong move exposing the knight:
        target: Alice's assistant explains that the knight could be captured without a recapture — 4
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:30
          condition:
          - Alice is signed in
          - Alice is solving the puzzle with an exposed knight
          example: The assistant identifies a hanging knight after a wrong move
      Alice plays the quiet wrong move when Alice is signed in and Alice is solving the puzzle with a defended knight:
        target: Alice's assistant cannot claim a hanging knight — 5
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:36
          condition:
          - Alice is signed in
          - Alice is solving the puzzle with a defended knight
          example: A defended knight is not described as hanging
      Alice plays the quiet wrong move when Alice is signed in and Alice is solving the puzzle with a knight fork threat:
        target: Alice's assistant explains the knight fork of king and queen — 6
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:42
          condition:
          - Alice is signed in
          - Alice is solving the puzzle with a knight fork threat
          example: A wrong move allowing a knight fork identifies its targets
      Alice plays a wrong move:
        target: Alice's assistant cannot claim a fork — 7
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:48
          condition:
          - Alice is signed in
          - Alice is solving the castling puzzle labelled as a fork
          example: A puzzle theme cannot invent a fork
      Alice opens that puzzle:
        target: Alice's assistant explains that the king must escape check — 8
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:57
          condition:
          - Alice is signed in
          - Alice's puzzle starts in check with a hanging piece
          example: Check takes priority over a tactical opportunity
      ? Alice plays the quiet wrong move when Alice is signed in and Alice's puzzle offers checkmate and a wrong
        move exposes a knight
      : target: Alice's assistant draws attention to an available checkmate — 9
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:63
          condition:
          - Alice is signed in
          - Alice's puzzle offers checkmate and a wrong move exposes a knight
          example: Missing checkmate takes priority over a hanging piece
      Alice asks for a hint:
        target: Alice's assistant explains the highlighted solution piece — 10
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:71
          condition:
          - Alice is signed in
          - Alice is playing puzzles in their space
          example: Taking a hint explains the offered help
      Alice shows the solution:
        target: Alice's assistant explains that the solution is shown — 11
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:77
          condition:
          - Alice is signed in
          - Alice is playing puzzles in their space
          example: Showing the solution is never praised as a clean solve
