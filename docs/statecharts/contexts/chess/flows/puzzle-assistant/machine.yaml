          condition:
          - Alice is signed in
          - Alice is solving the two-rook clearance puzzle
          example: A correct continuation receives encouragement
      Alice plays the move a7-a8:
        target: Alice's assistant acknowledges checkmate — 2
        meta:
          source:
          - specs/chess/puzzle-assistant.feature:14
          condition:
          - Alice is signed in
          - Alice is solving the puzzle with more than one mate on the final move
          example: An alternate checkmate receives success commentary
      Alice plays the move a7-a6:
