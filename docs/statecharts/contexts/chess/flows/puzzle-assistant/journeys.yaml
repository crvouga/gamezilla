journeys:
  A correct continuation receives encouragement:
    description: A correct continuation receives encouragement
    startingConditions:
    - Alice is signed in
    - Alice is solving the two-rook clearance puzzle
    events:
    - Alice plays the move a1-a5
    endsIn: Alice's assistant acknowledges a correct continuation — 1
    checks:
    - Alice's assistant acknowledges a correct continuation
    gherkin:
    - specs/chess/puzzle-assistant.feature:8 — A correct continuation receives encouragement
    exampleRow: []
  An alternate checkmate receives success commentary:
    description: An alternate checkmate receives success commentary
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with more than one mate on the final move
    events:
    - Alice plays the move a7-a8
    endsIn: Alice's assistant acknowledges checkmate — 2
    checks:
    - Alice's assistant acknowledges checkmate
    - Alice's assistant cannot call the move wrong
    gherkin:
    - specs/chess/puzzle-assistant.feature:14 — An alternate checkmate receives success commentary
    exampleRow: []
  A wrong move receives a diagnosis rather than praise:
    description: A wrong move receives a diagnosis rather than praise
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with more than one mate on the final move
    events:
    - Alice plays the move a7-a6
    endsIn: Alice's assistant draws attention to an available checkmate — 3
    checks:
    - Alice's assistant draws attention to an available checkmate
    - Alice's assistant cannot praise a solved puzzle
    gherkin:
    - specs/chess/puzzle-assistant.feature:21 — A wrong move receives a diagnosis rather than praise
    exampleRow: []
  The assistant identifies a hanging knight after a wrong move:
    description: The assistant identifies a hanging knight after a wrong move
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with an exposed knight
    events:
    - Alice plays a wrong move exposing the knight
    endsIn: Alice's assistant explains that the knight could be captured without a recapture — 4
    checks:
    - Alice's assistant explains that the knight could be captured without a recapture
    gherkin:
    - specs/chess/puzzle-assistant.feature:30 — The assistant identifies a hanging knight after a wrong move
    exampleRow: []
  A defended knight is not described as hanging:
    description: A defended knight is not described as hanging
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with a defended knight
    events:
    - Alice plays the quiet wrong move when Alice is signed in and Alice is solving the puzzle with a defended knight
    endsIn: Alice's assistant cannot claim a hanging knight — 5
    checks:
    - Alice's assistant cannot claim a hanging knight
    gherkin:
    - specs/chess/puzzle-assistant.feature:36 — A defended knight is not described as hanging
    exampleRow: []
  A wrong move allowing a knight fork identifies its targets:
    description: A wrong move allowing a knight fork identifies its targets
    startingConditions:
    - Alice is signed in
    - Alice is solving the puzzle with a knight fork threat
    events:
    - Alice plays the quiet wrong move when Alice is signed in and Alice is solving the puzzle with a knight fork
      threat
    endsIn: Alice's assistant explains the knight fork of king and queen — 6
    checks:
    - Alice's assistant explains the knight fork of king and queen
    gherkin:
    - specs/chess/puzzle-assistant.feature:42 — A wrong move allowing a knight fork identifies its targets
    exampleRow: []
  A puzzle theme cannot invent a fork:
    description: A puzzle theme cannot invent a fork
    startingConditions:
    - Alice is signed in
    - Alice is solving the castling puzzle labelled as a fork
    events:
    - Alice plays a wrong move
    endsIn: Alice's assistant cannot claim a fork — 7
    checks:
    - Alice's assistant cannot claim a fork
    gherkin:
    - specs/chess/puzzle-assistant.feature:48 — A puzzle theme cannot invent a fork
    exampleRow: []
  Check takes priority over a tactical opportunity:
    description: Check takes priority over a tactical opportunity
    startingConditions:
    - Alice is signed in
    - Alice's puzzle starts in check with a hanging piece
    events:
    - Alice opens that puzzle
    endsIn: Alice's assistant explains that the king must escape check — 8
    checks:
    - Alice's assistant explains that the king must escape check
    gherkin:
    - specs/chess/puzzle-assistant.feature:57 — Check takes priority over a tactical opportunity
    exampleRow: []
  Missing checkmate takes priority over a hanging piece:
    description: Missing checkmate takes priority over a hanging piece
    startingConditions:
    - Alice is signed in
    - Alice's puzzle offers checkmate and a wrong move exposes a knight
    events:
    - Alice plays the quiet wrong move when Alice is signed in and Alice's puzzle offers checkmate and a wrong move
      exposes a knight
    endsIn: Alice's assistant draws attention to an available checkmate — 9
    checks:
    - Alice's assistant draws attention to an available checkmate
    gherkin:
    - specs/chess/puzzle-assistant.feature:63 — Missing checkmate takes priority over a hanging piece
    exampleRow: []
  Taking a hint explains the offered help:
    description: Taking a hint explains the offered help
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    events:
    - Alice asks for a hint
    endsIn: Alice's assistant explains the highlighted solution piece — 10
    checks:
    - Alice's assistant explains the highlighted solution piece
    gherkin:
    - specs/chess/puzzle-assistant.feature:71 — Taking a hint explains the offered help
    exampleRow: []
  Showing the solution is never praised as a clean solve:
    description: Showing the solution is never praised as a clean solve
    startingConditions:
    - Alice is signed in
    - Alice is playing puzzles in their space
    events:
    - Alice shows the solution
    endsIn: Alice's assistant explains that the solution is shown — 11
    checks:
    - Alice's assistant explains that the solution is shown
    - Alice's assistant cannot praise a solved puzzle
    gherkin:
    - specs/chess/puzzle-assistant.feature:77 — Showing the solution is never praised as a clean solve
    exampleRow: []
