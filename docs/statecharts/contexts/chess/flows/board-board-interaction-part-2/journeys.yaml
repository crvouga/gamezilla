    - Alice hears no chessboard sounds
    gherkin:
    - specs/chess-board/board-interaction.feature:254 — Silent stalemate preserves its result without any sound
    exampleRow: []
  A checkmated chessboard refuses another move:
    description: A checkmated chessboard refuses another move
    startingConditions:
    - Alice has a chessboard with Black checkmated
    events:
    - Alice selects the piece on h8 when Alice has a chessboard with Black checkmated
    endsIn: Alice is not offered another move because Black is checkmated — 4
    checks:
    - Alice is not offered another move because Black is checkmated
    - Alice sees no selection or legal destinations
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-interaction.feature:261 — A checkmated chessboard refuses another move
    exampleRow: []
  A stalemated chessboard refuses another move:
