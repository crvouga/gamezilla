journeys:
  Silent checkmate preserves its announcement without any sound:
    description: Silent checkmate preserves its announcement without any sound
    startingConditions:
    - Alice has a silent chessboard ready for White to checkmate Black by moving the queen from g6 to g7
    events:
    - Alice moves the piece from g6 to g7
    endsIn: Alice is told Black is checkmated — 1
    checks:
    - Alice is told Black is checkmated
    - Alice hears no chessboard sounds
    gherkin:
    - specs/chess-board/board-interaction.feature:239 — Silent checkmate preserves its announcement without any
      sound
    exampleRow: []
  Stalemate announces its result without check feedback:
    description: Stalemate announces its result without check feedback
    startingConditions:
    - Alice has a chessboard ready for White to stalemate Black by moving the queen from f5 to g6
    events:
    - Alice moves the piece from f5 to g6 when Alice has a chessboard ready for White to stalemate Black by moving
      the queen from f5 to g6
    endsIn: Alice is told Black is stalemated — 2
    checks:
    - Alice is told Black is stalemated
    - Alice sees neither king marked as in check
    - Alice hears one move sound followed by one end sound with no check sound
    gherkin:
    - specs/chess-board/board-interaction.feature:246 — Stalemate announces its result without check feedback
    exampleRow: []
  Silent stalemate preserves its result without any sound:
    description: Silent stalemate preserves its result without any sound
