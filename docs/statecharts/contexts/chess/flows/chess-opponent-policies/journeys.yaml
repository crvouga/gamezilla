journeys:
  People who have not blocked each other can be matched:
    description: People who have not blocked each other can be matched
    startingConditions:
    - Alice and Bob are looking for 5+0 chess opponents
    events:
    - a matchmaking match is formed for Alice and Bob
    endsIn: Alice and Bob have the same multiplayer game — 1
    checks:
    - Alice and Bob have the same multiplayer game
    gherkin:
    - specs/chess/chess-opponent-policies.feature:8 — People who have not blocked each other can be matched
    exampleRow: []
  Blocking before they are matched keeps both people seeking other chess opponents:
    description: Blocking before they are matched keeps both people seeking other chess opponents
    startingConditions:
    - Alice and Bob are looking for 5+0 chess opponents
    - Alice blocked Bob
    events:
    - matchmaking pairs people up
    endsIn: Alice and Bob are still looking for other chess opponents — 2
    checks:
    - Alice and Bob are still looking for other chess opponents
    - Bob is not told Alice blocked him
    gherkin:
    - specs/chess/chess-opponent-policies.feature:13 — Blocking before they are matched keeps both people seeking
      other chess opponents
    exampleRow: []
  A block after they were matched does not erase the game:
    description: A block after they were matched does not erase the game
    startingConditions:
    - Alice blocked Bob after their multiplayer game was formed
    events:
    - Alice opens multiplayer chess when Alice blocked Bob after their multiplayer game was formed
    endsIn: Alice keeps her multiplayer game with Bob — 3
    checks:
    - Alice keeps her multiplayer game with Bob
    gherkin:
    - specs/chess/chess-opponent-policies.feature:20 — A block after they were matched does not erase the game
    exampleRow: []
  A Plus member can find a chess opponent:
    description: A Plus member can find a chess opponent
    startingConditions:
    - Alice is a Plus member with a connection
    events:
    - Alice finds a chess opponent for 5+0 when Alice is a Plus member with a connection
    endsIn: Alice is looking for a chess opponent — 4
    checks:
    - Alice is looking for a chess opponent
    gherkin:
    - specs/chess/chess-opponent-policies.feature:27 — A Plus member can find a chess opponent
    exampleRow: []
  Losing paid access does not remove an opponent search:
    description: Losing paid access does not remove an opponent search
    startingConditions:
    - Alice no longer has paid access while she was looking for a chess opponent
    events:
    - Alice opens multiplayer chess when Alice no longer has paid access while she was looking for a chess opponent
    endsIn: Alice is still looking for a chess opponent — 5
    checks:
    - Alice is still looking for a chess opponent
    gherkin:
    - specs/chess/chess-opponent-policies.feature:32 — Losing paid access does not remove an opponent search
    exampleRow: []
  Returning after looking for an opponent keeps the space's puzzle as it was:
    description: Returning after looking for an opponent keeps the space's puzzle as it was
    startingConditions:
    - Alice and Bob are playing a puzzle in a space
    events:
    - Alice finds a chess opponent for 5+0 when Alice and Bob are playing a puzzle in a space
    - Alice returns to the puzzle in the space
    endsIn: Bob keeps the same puzzle in the space — 6 step 2
    checks:
    - Bob keeps the same puzzle in the space
    gherkin:
    - specs/chess/chess-opponent-policies.feature:39 — Returning after looking for an opponent keeps the space's
      puzzle as it was
    exampleRow: []
  A multiplayer result does not move a puzzle rating:
    description: A multiplayer result does not move a puzzle rating
    startingConditions:
    - Alice's puzzle rating has settled at 1700
    - Alice is White and Bob is Black in a 5+0 multiplayer game after e4 and e5
    events:
    - Alice resigns multiplayer chess
    endsIn: Alice's puzzle rating is still 1700 — 7
    checks:
    - Alice's puzzle rating is still 1700
    gherkin:
    - specs/chess/chess-opponent-policies.feature:45 — A multiplayer result does not move a puzzle rating
    exampleRow: []
