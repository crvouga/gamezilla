journeys:
  A capture settles on the destination:
    description: A capture settles on the destination
    startingConditions:
    - Alice has a chessboard ready for a capture
    events:
    - Alice moves the piece from e4 to d5
    endsIn: Alice sees a White pawn on d5 — 1
    checks:
    - Alice sees a White pawn on d5
    - Alice sees no captured piece after the animation
    gherkin:
    - specs/chess-board/board-motion.feature:9 — A capture settles on the destination
    exampleRow: []
  A replacement position clears a capture remnant immediately:
    description: A replacement position clears a capture remnant immediately
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's activity replaces the position
    endsIn: Alice sees no capture remnant — 2
    checks:
    - Alice sees no capture remnant
    - Alice sees the replacement position
    gherkin:
    - specs/chess-board/board-motion.feature:16 — A replacement position clears a capture remnant immediately
    exampleRow: []
  A completed capture keeps its destination and removes its remnant:
    description: A completed capture keeps its destination and removes its remnant
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice waits for the animation to finish
    endsIn: Alice sees no unfinished animation — 3
    checks:
    - Alice sees no unfinished animation
    - Alice sees no capture remnant
    - Alice sees the White pawn remaining on d5
    gherkin:
    - specs/chess-board/board-motion.feature:22 — A completed capture keeps its destination and removes its remnant
    exampleRow: []
  Confirming the same capture preserves its current arrival:
    description: Confirming the same capture preserves its current arrival
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's activity supplies the same position again
    endsIn: Alice sees the current capture still animating — 4
    checks:
    - Alice sees the current capture still animating
    - Alice sees its capture remnant
    - Alice sees the White pawn remaining on d5
    gherkin:
    - specs/chess-board/board-motion.feature:29 — Confirming the same capture preserves its current arrival
    exampleRow: []
  An opponent reply preserves a capture still arriving at its valid destination:
    description: An opponent reply preserves a capture still arriving at its valid destination
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's activity supplies Black's reply from g8 to f6
    endsIn: Alice sees a Black knight on f6 — 5
    checks:
    - Alice sees a Black knight on f6
    - Alice sees the White pawn remaining on d5
    - Alice sees the current capture still animating
    - Alice sees its capture remnant
    gherkin:
    - specs/chess-board/board-motion.feature:40 — An opponent reply preserves a capture still arriving at its valid
      destination
    exampleRow: []
  A rapid legal capture sequence settles at its final position without losing move order:
    description: A rapid legal capture sequence settles at its final position without losing move order
    startingConditions:
    - Alice has played e2-e4, d7-d5, e4-d5, d8-d5 and b1-c3 without waiting for their arrivals
    events:
    - Alice moves the piece from d5 to a5
    endsIn: Alice sees the completed position after those six moves — 6
    checks:
    - Alice sees the completed position after those six moves
    - Alice sees no capture remnant
    - Alice sees no unfinished animation
    - Alice's activity receives those six moves exactly once each in order
    gherkin:
    - specs/chess-board/board-motion.feature:48 — A rapid legal capture sequence settles at its final position without
      losing move order
    exampleRow: []
  An old arrival cannot restore pieces after turning and replacement:
    description: An old arrival cannot restore pieces after turning and replacement
    startingConditions:
    - Alice's capture from e4 to d5 was interrupted by turning the chessboard
    - Alice's activity has supplied the replacement position
    events:
    - Alice's earlier interrupted arrival finishes when Alice's capture from e4 to d5 was interrupted by turning
      the chessboard and Alice's activity has supplied the replacement position
    endsIn: Alice sees the replacement position — 7
    checks:
    - Alice sees the replacement position
    - Alice sees no capture remnant
    - Alice sees no unfinished animation
    gherkin:
    - specs/chess-board/board-motion.feature:56 — An old arrival cannot restore pieces after turning and replacement
    exampleRow: []
  An earlier capture cannot finish a newer capture at the same destination:
    description: An earlier capture cannot finish a newer capture at the same destination
    startingConditions:
    - Alice's earlier capture from e4 to d5 was interrupted by a replacement
    - Alice's capture from e4 to d5 is animating again
    events:
    - Alice's earlier interrupted arrival finishes when Alice's earlier capture from e4 to d5 was interrupted by
      a replacement and Alice's capture from e4 to d5 is animating again
    endsIn: Alice sees the current capture still animating — 8
    checks:
    - Alice sees the current capture still animating
    - Alice sees its capture remnant
    - Alice sees the White pawn remaining on d5
    gherkin:
    - specs/chess-board/board-motion.feature:64 — An earlier capture cannot finish a newer capture at the same destination
    exampleRow: []
  An earlier arrival cannot bring back a closed chessboard:
    description: An earlier arrival cannot bring back a closed chessboard
    startingConditions:
    - Alice's capture from e4 to d5 was interrupted by closing the chessboard
    events:
    - Alice's earlier interrupted arrival finishes when Alice's capture from e4 to d5 was interrupted by closing
      the chessboard
    endsIn: Alice cannot see the chessboard because it is closed — 9
    checks:
    - Alice cannot see the chessboard because it is closed
    - Alice hears no chessboard sounds
    gherkin:
    - specs/chess-board/board-motion.feature:72 — An earlier arrival cannot bring back a closed chessboard
    exampleRow: []
  An earlier arrival cannot alter a newly opened chessboard:
    description: An earlier arrival cannot alter a newly opened chessboard
    startingConditions:
    - Alice's capture from e4 to d5 was interrupted by closing the chessboard
    - Alice's activity has started another chessboard at the normal opening
    events:
    - Alice's earlier interrupted arrival finishes when Alice's capture from e4 to d5 was interrupted by closing
      the chessboard and Alice's activity has started another chessboard at the normal opening
    endsIn: Alice still sees the position before White's first move — 10
    checks:
    - Alice still sees the position before White's first move
    - Alice sees no capture remnant
    - Alice sees no unfinished animation
    gherkin:
    - specs/chess-board/board-motion.feature:78 — An earlier arrival cannot alter a newly opened chessboard
    exampleRow: []
  A move animates when motion is enabled:
    description: A move animates when motion is enabled
    startingConditions:
    - Alice has an interactive chessboard
    events:
    - Alice moves the piece from g1 to f3
    endsIn: Alice sees the knight slide from g1 to f3 — 11
    checks:
    - Alice sees the knight slide from g1 to f3
    gherkin:
    - specs/chess-board/board-motion.feature:88 — A move animates when motion is enabled
    exampleRow: []
  Reduced motion interrupts a running slide:
    description: Reduced motion interrupts a running slide
    startingConditions:
    - Alice's move from g1 to f3 is animating
    events:
    - Alice's board settings enable reduced motion when Alice's move from g1 to f3 is animating
    endsIn: Alice sees no unfinished animation — 12
    checks:
    - Alice sees no unfinished animation
    - Alice still sees a White knight on f3
    gherkin:
    - specs/chess-board/board-motion.feature:94 — Reduced motion interrupts a running slide
    exampleRow: []
  Reduced motion interrupts a capture remnant:
    description: Reduced motion interrupts a capture remnant
    startingConditions:
    - Alice's capture from e4 to d5 is animating
    events:
    - Alice's board settings enable reduced motion when Alice's capture from e4 to d5 is animating
    endsIn: Alice sees no capture remnant — 13
    checks:
    - Alice sees no capture remnant
    - Alice sees the White pawn remaining on d5
    gherkin:
    - specs/chess-board/board-motion.feature:100 — Reduced motion interrupts a capture remnant
    exampleRow: []
  Showing a chessboard does not replay a completed move:
    description: Showing a chessboard does not replay a completed move
    startingConditions:
    - Alice has a hidden chessboard after capturing from e4 to d5
    events:
    - Alice's chessboard becomes visible
    endsIn: Alice sees no unfinished animation — 14
    checks:
    - Alice sees no unfinished animation
    - Alice sees no capture remnant
    - Alice sees the White pawn remaining on d5
    gherkin:
    - specs/chess-board/board-motion.feature:110 — Showing a chessboard does not replay a completed move
    exampleRow: []
