journeys:
  A Black quiet move or capture waits for choice in either orientation:
    description: A Black quiet move or capture waits for choice in either orientation
    startingConditions:
    - Alice has a chessboard facing White with Black's pawn on a2 ready to promote and White's knight on b1
    events:
    - Alice moves the piece from a2 to a1 when Alice has a chessboard facing White with Black's pawn on a2 ready
      to promote and White's knight on b1
    endsIn: Alice is offered queen, rook, bishop and knight as the promotion choice — 1
    checks:
    - Alice is offered queen, rook, bishop and knight as the promotion choice
    - Alice sees the Black pawn remaining on a2
    - Alice sees the White knight remaining on b1
    - Alice's activity receives no moves
    gherkin:
    - specs/chess-board/board-black-promotion.feature:11 — A Black quiet move or capture waits for choice in either
      orientation
    exampleRow:
    - '7'
