journeys:
  A Plus member is offered to manage their membership, not to subscribe again:
    description: A Plus member is offered to manage their membership, not to subscribe again
    startingConditions:
    - Alice has subscribed to Plus
    events:
    - Alice views the billing plans when Alice has subscribed to Plus
    endsIn: Alice is offered to manage their membership — 1
    checks:
    - Alice is offered to manage their membership
    - Alice is not offered to subscribe
    gherkin:
    - specs/billing/billing-plans.feature:11 — A Plus member is offered to manage their membership, not to subscribe
      again
    exampleRow: []
  Leaving checkout without paying keeps free access:
    description: Leaving checkout without paying keeps free access
    startingConditions:
    - Alice is signed in with Google
    events:
    - Alice leaves checkout without paying
    endsIn: Alice has free access — 2
    checks:
    - Alice has free access
    - Alice is offered to subscribe
    gherkin:
    - specs/billing/billing-plans.feature:17 — Leaving checkout without paying keeps free access
    exampleRow: []
  Subscribing on one device gives paid access on the other:
    description: Subscribing on one device gives paid access on the other
    startingConditions:
    - Alice is signed in with Google
    - Alice is also signed in on another device
    events:
    - Alice subscribes to Plus
    endsIn: Alice's other device has paid access within 30 seconds — 3
    checks:
    - Alice's other device has paid access within 30 seconds
    gherkin:
    - specs/billing/billing-plans.feature:23 — Subscribing on one device gives paid access on the other
    exampleRow: []
  Subscribing needs a connection and says so:
    description: Subscribing needs a connection and says so
    startingConditions:
    - Alice is signed in with Google
    - Alice is offline
    events:
    - Alice views the billing plans when Alice is signed in with Google and Alice is offline
    endsIn: Alice is told subscribing needs a connection — 4
    checks:
    - Alice is told subscribing needs a connection
    gherkin:
    - specs/billing/billing-plans.feature:29 — Subscribing needs a connection and says so
    exampleRow: []
