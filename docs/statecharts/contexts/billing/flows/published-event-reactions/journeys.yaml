journeys:
  SignedIn is received:
    description: The receiving context updates the visible facts it owns.
    events:
    - SignedIn
    endsIn: Seeing account-bound choices become available only where the current permission decision allows them
    startingConditions:
    - Seed an authorized affected person and an affected aggregate.
  SignedOut is received:
    description: The receiving context updates the visible facts it owns.
    events:
    - SignedOut
    endsIn: Seeing account-only choices are denied and the person sees the current identity
    startingConditions:
    - Seed an authorized affected person and an affected aggregate.
  AccountDeletionConfirmed is received:
    description: The receiving context updates the visible facts it owns.
    events:
    - AccountDeletionConfirmed
    endsIn: Seeing the deleted account cannot be used or shown; retained legal records confer no access
    startingConditions:
    - Seed an authorized affected person and an affected aggregate.
