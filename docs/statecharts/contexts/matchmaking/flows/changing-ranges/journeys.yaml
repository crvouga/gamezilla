journeys:
  Alice may narrow a waiting range:
    description: Alice may narrow a waiting range
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 200 points
    events:
    - Alice narrows her range to 5 points
    endsIn: Alice sees her change counted — 1
    checks:
    - Alice sees her change counted
    - Alice accepts nobody more than 5 points away
    gherkin:
    - specs/matchmaking/changing-ranges.feature:8 — Alice may narrow a waiting range
    exampleRow: []
  Narrowing before pairing prevents the wider match:
    description: Narrowing before pairing prevents the wider match
    startingConditions:
    - Alice and Bob are waiting with ratings 50 points apart
    - Alice narrowed her range to 5 points
    events:
    - matchmaking pairs people up
    endsIn: Alice and Bob are still waiting — 2
    checks:
    - Alice and Bob are still waiting
    gherkin:
    - specs/matchmaking/changing-ranges.feature:14 — Narrowing before pairing prevents the wider match
    exampleRow: []
  Repeating the latest change keeps the same range:
    description: Repeating the latest change keeps the same range
    startingConditions:
    - Alice widened her waiting range to 200 points
    events:
    - Alice repeats that range change
    endsIn: Alice accepts anyone within 200 points — 3
    checks:
    - Alice accepts anyone within 200 points
    gherkin:
    - specs/matchmaking/changing-ranges.feature:22 — Repeating the latest change keeps the same range
    exampleRow: []
  An earlier wide change cannot overwrite a later narrow choice:
    description: An earlier wide change cannot overwrite a later narrow choice
    startingConditions:
    - Alice widened her waiting range to 200 points
    - Alice then narrowed the same wait to 5 points
    events:
    - Alice repeats her earlier wide range change
    endsIn: Alice is told that earlier change already counted — 4
    checks:
    - Alice is told that earlier change already counted
    - Alice accepts nobody more than 5 points away
    gherkin:
    - specs/matchmaking/changing-ranges.feature:27 — An earlier wide change cannot overwrite a later narrow choice
    exampleRow: []
  A person may change their current wait:
    description: A person may change their current wait
    startingConditions:
    - Alice is waiting with a range of 5 points
    events:
    - Alice widens her range to 200 points
    endsIn: Alice sees her change counted — 5
    checks:
    - Alice sees her change counted
    gherkin:
    - specs/matchmaking/changing-ranges.feature:36 — A person may change their current wait
    exampleRow: []
  A delayed change for a stopped wait cannot widen a later wait:
    description: A delayed change for a stopped wait cannot widen a later wait
    startingConditions:
    - Alice stopped her earlier wait
    - Alice is waiting again with a range of 5 points
    events:
    - Alice widens the range of her earlier wait to 200 points
    endsIn: Alice is told her earlier wait has ended — 6
    checks:
    - Alice is told her earlier wait has ended
    - Alice accepts nobody more than 5 points away
    gherkin:
    - specs/matchmaking/changing-ranges.feature:41 — A delayed change for a stopped wait cannot widen a later wait
    exampleRow: []
  A growing range chosen for an older wait includes its waiting age:
    description: A growing range chosen for an older wait includes its waiting age
    startingConditions:
    - Alice is waiting with a range of 5 points and has waited 35 seconds
    events:
    - Alice changes her range to a growing range when Alice is waiting with a range of 5 points and has waited 35
      seconds
    endsIn: Alice accepts anyone within 400 points — 7
    checks:
    - Alice accepts anyone within 400 points
    gherkin:
    - specs/matchmaking/changing-ranges.feature:50 — A growing range chosen for an older wait includes its waiting
      age
    exampleRow: []
  Choosing a growing range does not accept beyond its maximum:
    description: Choosing a growing range does not accept beyond its maximum
    startingConditions:
    - Alice is waiting with a range of 5 points and has waited 60 seconds
    events:
    - Alice changes her range to a growing range when Alice is waiting with a range of 5 points and has waited 60
      seconds
    endsIn: Alice cannot be matched with someone 401 points away — 8
    checks:
    - Alice cannot be matched with someone 401 points away
    gherkin:
    - specs/matchmaking/changing-ranges.feature:55 — Choosing a growing range does not accept beyond its maximum
    exampleRow: []
