journeys:
  Alice's other device sees the wait she already has:
    description: Alice's other device sees the wait she already has
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 200 points
    events:
    - Alice opens matchmaking on another device
    endsIn: Alice's other device shows the same wait — 1
    checks:
    - Alice's other device shows the same wait
    gherkin:
    - specs/matchmaking/search-identity.feature:8 — Alice's other device sees the wait she already has
    exampleRow: []
  Asking on another device cannot replace Alice's details:
    description: Asking on another device cannot replace Alice's details
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 200 points
    events:
    - Alice waits for a match with a rating of 1500 on another device
    endsIn: Alice is told she is already waiting — 2
    checks:
    - Alice is told she is already waiting
    - Alice's wait shows her name and a rating of 1000
    gherkin:
    - specs/matchmaking/search-identity.feature:13 — Asking on another device cannot replace Alice's details
    exampleRow: []
  Alice can wait again after stopping:
    description: Alice can wait again after stopping
    startingConditions:
    - Alice has stopped waiting
    events:
    - Alice waits for a match with a rating of 1500
    endsIn: Alice is waiting — 3
    checks:
    - Alice is waiting
    - Alice's wait shows her name and a rating of 1500
    gherkin:
    - specs/matchmaking/search-identity.feature:21 — Alice can wait again after stopping
    exampleRow: []
  Alice's earlier device cannot stop her later wait:
    description: Alice's earlier device cannot stop her later wait
    startingConditions:
    - Alice has stopped waiting
    - Alice is waiting again on another device
    events:
    - Alice stops her earlier wait
    endsIn: Alice is told there was nothing to stop — 4
    checks:
    - Alice is told there was nothing to stop
    - Alice is still waiting
    gherkin:
    - specs/matchmaking/search-identity.feature:27 — Alice's earlier device cannot stop her later wait
    exampleRow: []
  Repeating a request for a waiting match keeps the same wait:
    description: Repeating a request for a waiting match keeps the same wait
    startingConditions:
    - Alice is waiting for a match
    events:
    - Alice repeats her earlier request for a match when Alice is waiting for a match
    endsIn: Alice has the same wait — 5
    checks:
    - Alice has the same wait
    gherkin:
    - specs/matchmaking/search-identity.feature:36 — Repeating a request for a waiting match keeps the same wait
    exampleRow: []
  Repeating a stopped request cannot start it again:
    description: Repeating a stopped request cannot start it again
    startingConditions:
    - Alice has stopped waiting
    events:
    - Alice repeats her earlier request for a match when Alice has stopped waiting
    endsIn: Alice is not waiting for a match — 6
    checks:
    - Alice is not waiting for a match
    - Alice is told her earlier wait has ended
    gherkin:
    - specs/matchmaking/search-identity.feature:41 — Repeating a stopped request cannot start it again
    exampleRow: []
  Repeating a matched request cannot start another wait:
    description: Repeating a matched request cannot start another wait
    startingConditions:
    - Alice has been matched with Bob
    events:
    - Alice repeats her earlier request for a match when Alice has been matched with Bob
    endsIn: Alice is matched with Bob — 7
    checks:
    - Alice is matched with Bob
    - Alice is told her earlier wait has ended
    gherkin:
    - specs/matchmaking/search-identity.feature:47 — Repeating a matched request cannot start another wait
    exampleRow: []
  Alice can stop her wait from another device:
    description: Alice can stop her wait from another device
    startingConditions:
    - Alice is waiting for a match
    events:
    - Alice stops waiting on another device
    endsIn: Alice sees she stopped waiting — 8
    checks:
    - Alice sees she stopped waiting
    - Alice is not waiting for a match
    gherkin:
    - specs/matchmaking/search-identity.feature:55 — Alice can stop her wait from another device
    exampleRow: []
  Bob cannot stop Alice's wait:
    description: Bob cannot stop Alice's wait
    startingConditions:
    - Alice is waiting for a match
    events:
    - Bob tries to stop Alice's wait
    endsIn: Bob is told there was nothing to stop — 9
    checks:
    - Bob is told there was nothing to stop
    - Alice is still waiting
    gherkin:
    - specs/matchmaking/search-identity.feature:61 — Bob cannot stop Alice's wait
    exampleRow: []
  Bob cannot change Alice's range:
    description: Bob cannot change Alice's range
    startingConditions:
    - Alice is waiting with a rating of 1000, accepting anyone within 5 points
    events:
    - Bob tries to widen Alice's range to 200 points
    endsIn: Bob is told his change did not count — 10
    checks:
    - Bob is told his change did not count
    - Alice accepts nobody more than 5 points away
    gherkin:
    - specs/matchmaking/search-identity.feature:67 — Bob cannot change Alice's range
    exampleRow: []
