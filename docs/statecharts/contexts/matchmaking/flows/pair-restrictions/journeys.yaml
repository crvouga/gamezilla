journeys:
  A restriction prevents a close pair from matching:
    description: A restriction prevents a close pair from matching
    startingConditions:
    - Alice and Bob are waiting within each other's ranges
    events:
    - Alice and Bob become unable to be matched together when Alice and Bob are waiting within each other's ranges
    endsIn: Alice and Bob are still waiting — 1
    checks:
    - Alice and Bob are still waiting
    - Alice and Bob cannot be matched together
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:8 — A restriction prevents a close pair from matching
    exampleRow: []
  Unrestricted compatible people are matched:
    description: Unrestricted compatible people are matched
    startingConditions:
    - Alice and Bob are waiting within each other's ranges
    events:
    - matchmaking pairs people up when Alice and Bob are waiting within each other's ranges
    endsIn: Alice and Bob are matched with each other — 2
    checks:
    - Alice and Bob are matched with each other
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:14 — Unrestricted compatible people are matched
    exampleRow: []
  A waiting pair can match after their restriction is removed:
    description: A waiting pair can match after their restriction is removed
    startingConditions:
    - Alice and Bob are waiting but cannot be matched together
    events:
    - Alice and Bob can be matched together again when Alice and Bob are waiting but cannot be matched together
    endsIn: Alice and Bob can be matched together — 3
    checks:
    - Alice and Bob can be matched together
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:22 — A waiting pair can match after their restriction is removed
    exampleRow: []
  Removing a restriction never revives a stopped wait:
    description: Removing a restriction never revives a stopped wait
    startingConditions:
    - Alice stopped waiting while she and Bob could not be matched together
    events:
    - Alice and Bob can be matched together again when Alice stopped waiting while she and Bob could not be matched
      together
    endsIn: Alice is not waiting — 4
    checks:
    - Alice is not waiting
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:27 — Removing a restriction never revives a stopped wait
    exampleRow: []
  An existing match stays when a restriction arises:
    description: An existing match stays when a restriction arises
    startingConditions:
    - Alice and Bob are matched with each other
    events:
    - Alice and Bob become unable to be matched together when Alice and Bob are matched with each other
    endsIn: Alice and Bob keep the same match — 5
    checks:
    - Alice and Bob keep the same match
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:34 — An existing match stays when a restriction arises
    exampleRow: []
  The same restriction prevents a later match:
    description: The same restriction prevents a later match
    startingConditions:
    - Alice and Bob cannot be matched together
    - Alice and Bob are waiting within each other's ranges
    events:
    - matchmaking pairs people up when Alice and Bob cannot be matched together and Alice and Bob are waiting within
      each other's ranges
    endsIn: Alice and Bob are still waiting — 6
    checks:
    - Alice and Bob are still waiting
    gherkin:
    - specs/matchmaking/pair-restrictions.feature:39 — The same restriction prevents a later match
    exampleRow: []
