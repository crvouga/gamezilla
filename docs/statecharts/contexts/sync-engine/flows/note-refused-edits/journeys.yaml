journeys:
  Deleting offline a note someone else has since written is undone and reaches nobody else:
    description: Deleting offline a note someone else has since written is undone and reaches nobody else
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Bob has written the note "Groceries" saying "milk"
    - Bob's app is offline
    - Bob has deleted the note "Groceries"
    - Alice has written the note "Groceries" saying "eggs"
    events:
    - Bob's app comes back online when Alice and Bob are in the shared space 'Trip' and Bob has written the note
      'Groceries' saying 'milk' and Bob's app is offline and Bob has deleted the note 'Groceries' and Alice has
      written the note 'Groceries' saying 'eggs'
    endsIn: Bob sees the note "Groceries" saying "eggs" — 1
    checks:
    - Bob sees the note "Groceries" saying "eggs"
    - Alice sees the note "Groceries" saying "eggs"
    gherkin:
    - specs/sync-engine/note-refused-edits.feature:10 — Deleting offline a note someone else has since written is
      undone and reaches nobody else
    exampleRow: []
  The author of a refused edit gets a notice of the refusal:
    description: The author of a refused edit gets a notice of the refusal
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Bob has written the note "Groceries" saying "milk"
    - Bob's app is offline
    - Bob has deleted the note "Groceries"
    - Alice has written the note "Groceries" saying "eggs"
    events:
    - Bob's app comes back online when Alice and Bob are in the shared space 'Trip' and Bob has written the note
      'Groceries' saying 'milk' and Bob's app is offline and Bob has deleted the note 'Groceries' and Alice has
      written the note 'Groceries' saying 'eggs'
    endsIn: Bob sees the note "Groceries" saying "eggs" — 1
    checks:
    - Bob has a notice that deleting the note "Groceries" was refused
    gherkin:
    - specs/sync-engine/note-refused-edits.feature:22 — The author of a refused edit gets a notice of the refusal
    exampleRow: []
  An acknowledged notice of a refused edit is gone:
    description: An acknowledged notice of a refused edit is gone
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Bob has been refused deleting the note "Groceries"
    events:
    - Bob acknowledges the notice about the note 'Groceries'
    endsIn: Bob has no notices — 3
    checks:
    - Bob has no notices
    gherkin:
    - specs/sync-engine/note-refused-edits.feature:31 — An acknowledged notice of a refused edit is gone
    exampleRow: []
  A notice of a refused edit stays when the app updates to a version that fetches every note again:
    description: A notice of a refused edit stays when the app <change>
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Bob has been refused deleting the note "Groceries"
    events:
    - Bob's app updates to a version that fetches every note again
    endsIn: Bob has a notice that deleting the note "Groceries" was refused — 4
    checks:
    - Bob has a notice that deleting the note "Groceries" was refused
    gherkin:
    - specs/sync-engine/note-refused-edits.feature:40 — A notice of a refused edit stays when the app <change>
    exampleRow:
    - '29'
  A notice of a refused edit stays when the app has its data cleared:
    description: A notice of a refused edit stays when the app <change>
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Bob has been refused deleting the note "Groceries"
    events:
    - Bob's app has its data cleared
    endsIn: Bob has a notice that deleting the note "Groceries" was refused — 5
    checks:
    - Bob has a notice that deleting the note "Groceries" was refused
    gherkin:
    - specs/sync-engine/note-refused-edits.feature:40 — A notice of a refused edit stays when the app <change>
    exampleRow:
    - '30'
