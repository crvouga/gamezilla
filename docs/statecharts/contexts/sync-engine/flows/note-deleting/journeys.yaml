journeys:
  A note deleted by the person who wrote it disappears for everyone:
    description: A note deleted by the person who wrote it disappears for everyone
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice has written the note "Groceries" saying "milk"
    - the note "Groceries" has reached Bob
    events:
    - Alice deletes the note 'Groceries'
    endsIn: Alice does not see the note "Groceries" — 1
    checks:
    - Alice does not see the note "Groceries"
    - Bob does not see the note "Groceries"
    gherkin:
    - specs/sync-engine/note-deleting.feature:12 — A note deleted by the person who wrote it disappears for everyone
    exampleRow: []
  Whoever last wrote a note owns it and may delete it:
    description: Whoever last wrote a note owns it and may delete it
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice has written the note "Groceries" saying "milk"
    - Bob has written the note "Groceries" saying "eggs"
    events:
    - Bob deletes the note 'Groceries'
    endsIn: Bob does not see the note "Groceries" — 2
    checks:
    - Bob does not see the note "Groceries"
    - Alice does not see the note "Groceries"
    gherkin:
    - specs/sync-engine/note-deleting.feature:19 — Whoever last wrote a note owns it and may delete it
    exampleRow: []
  A deleted note written again comes back for everyone with the new text:
    description: A deleted note written again comes back for everyone with the new text
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice has written the note "Groceries" saying "milk"
    - Alice has deleted the note "Groceries"
    events:
    - Alice writes the note 'Groceries' saying 'eggs'
    endsIn: Alice sees the note "Groceries" saying "eggs" — 3
    checks:
    - Alice sees the note "Groceries" saying "eggs"
    - Bob sees the note "Groceries" saying "eggs"
    gherkin:
    - specs/sync-engine/note-deleting.feature:28 — A deleted note written again comes back for everyone with the
      new text
    exampleRow: []
