journeys:
  After a crash the app still shows every note it had:
    description: After a crash the app still shows every note it had
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice has written the note "Groceries" saying "milk"
    - Bob has written the note "Hotel" saying "Main St"
    - the note "Hotel" has reached Alice
    events:
    - Alice's app crashes and reopens when Alice and Bob are in the shared space 'Trip' and Alice has written the
      note 'Groceries' saying 'milk' and Bob has written the note 'Hotel' saying 'Main St' and the note 'Hotel'
      has reached Alice
    endsIn: Alice sees the note "Groceries" saying "milk" — 1
    checks:
    - Alice sees the note "Groceries" saying "milk"
    - Alice sees the note "Hotel" saying "Main St"
    gherkin:
    - specs/sync-engine/notes-after-a-crash.feature:11 — After a crash the app still shows every note it had
    exampleRow: []
  A note written offline before a crash still reaches others:
    description: A note written offline before a crash still reaches others
    startingConditions:
    - Alice and Bob are in the shared space "Trip"
    - Alice's app is offline
    - Alice has written the note "Groceries" saying "milk"
    events:
    - Alice's app crashes and reopens when Alice and Bob are in the shared space 'Trip' and Alice's app is offline
      and Alice has written the note 'Groceries' saying 'milk'
    - Alice's app comes back online
    endsIn: Alice sees the note "Groceries" saying "milk" — 2 step 2
    checks:
    - Alice sees the note "Groceries" saying "milk"
    - Bob sees the note "Groceries" saying "milk"
    gherkin:
    - specs/sync-engine/notes-after-a-crash.feature:19 — A note written offline before a crash still reaches others
    exampleRow: []
