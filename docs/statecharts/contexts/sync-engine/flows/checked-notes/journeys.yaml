  A checked note is saved once it is kept for everyone:
    description: A checked note is saved once it is kept for everyone
    startingConditions: []
    events:
    - Alice writes the checked note 'Groceries' saying 'milk' when A checked note is saved once it is kept for everyone
    endsIn: Alice's app says the note "Groceries" is saved — 2
    checks:
    - Alice's app says the note "Groceries" is saved
    - the note "Groceries" is kept for everyone saying "milk"
    gherkin:
    - specs/sync-engine/checked-notes.feature:16 — A checked note is saved once it is kept for everyone
    exampleRow: []
  Refused writing never replaces another person's shared note:
    description: Refused writing never replaces another person's shared note
    startingConditions:
    - Alice and Bob have slow connections
    - Alice has written the checked note "Groceries" saying "milk"
    - the note "Groceries" has reached Bob
    - Alice's app will not hear back about its next save
    events:
    - Alice writes the checked note 'Groceries' saying 'refused' when Alice and Bob have slow connections and Alice
      has written the checked note 'Groceries' saying 'milk' and the note 'Groceries' has reached Bob and Alice's
      app will not hear back about its next save
    endsIn: Bob never sees the note "Groceries" saying "refused" — 3
    checks:
    - Bob never sees the note "Groceries" saying "refused"
    gherkin:
    - specs/sync-engine/checked-notes.feature:24 — Refused writing never replaces another person's shared note
    exampleRow: []
  A checked note that breaks the rule is refused:
    description: A checked note that breaks the rule is refused
    startingConditions: []
    events:
    - Alice writes the checked note 'Groceries' saying 'refused' when A checked note that breaks the rule is refused
    endsIn: Alice's app says the note "Groceries" was refused — 4
    checks:
    - Alice's app says the note "Groceries" was refused
    - Alice does not see the note "Groceries"
    - the note "Groceries" is not kept for everyone
    gherkin:
    - specs/sync-engine/checked-notes.feature:33 — A checked note that breaks the rule is refused
    exampleRow: []
  By the time a refusal is reported, the note already says what it said before:
    description: By the time a refusal is reported, the note already says what it said before
    startingConditions:
    - Alice has written the checked note "Groceries" saying "milk"
    events:
    - Alice writes the checked note 'Groceries' saying 'refused' when Alice has written the checked note 'Groceries'
      saying 'milk'
    endsIn: the moment Alice's app says the note "Groceries" was refused, it shows the note saying "milk" — 5
    checks:
    - the moment Alice's app says the note "Groceries" was refused, it shows the note saying "milk"
    - the note "Groceries" is kept for everyone saying "milk"
    gherkin:
    - specs/sync-engine/checked-notes.feature:40 — By the time a refusal is reported, the note already says what
      it said before
    exampleRow: []
