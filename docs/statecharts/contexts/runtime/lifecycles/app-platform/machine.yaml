  Viewing spaces:
    meta:
      description: The person is viewing spaces.
      snapshot: the-person-is-viewing-spaces
      recognize: []
      checks:
      - 'Checking machinery: the app always runs on at least one machine, and never more than MAX_CAPACITY.'
