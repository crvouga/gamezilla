journeys:
  Signing out everywhere signs Alice out on their other device too:
    description: Signing out everywhere signs Alice out on their other device too
    startingConditions:
    - Alice is signed in with Google
    - Alice is also signed in on another device
    events:
    - Alice signs out everywhere
    endsIn: Alice is signed out — 1
    checks:
    - Alice is signed out
    - Alice's other device is signed out within 150 seconds
    gherkin:
    - specs/profile/sessions.feature:9 — Signing out everywhere signs Alice out on their other device too
    exampleRow: []
  Stopping Sign in with Apple for the app signs Alice out:
    description: Stopping Sign in with Apple for the app signs Alice out
    startingConditions:
    - Alice is signed in with Apple
    events:
    - Alice stops using Sign in with Apple for the app
    endsIn: Alice is signed out within 150 seconds — 2
    checks:
    - Alice is signed out within 150 seconds
    gherkin:
    - specs/profile/sessions.feature:16 — Stopping Sign in with Apple for the app signs Alice out
    exampleRow: []
  After stopping Sign in with Apple, Apple still opens the same account:
    description: After stopping Sign in with Apple, Apple still opens the same account
    startingConditions:
    - Alice has stopped using Sign in with Apple for the app
    events:
    - Alice signs in with Apple
    endsIn: Alice is signed into the same account — 3
    checks:
    - Alice is signed into the same account
    gherkin:
    - specs/profile/sessions.feature:21 — After stopping Sign in with Apple, Apple still opens the same account
    exampleRow: []
  Deleting the Apple account that is Alice's only sign-in method signs Alice out:
    description: Deleting the Apple account that is Alice's only sign-in method signs Alice out
    startingConditions:
    - Alice is signed in with Apple
    events:
    - Alice deletes their Apple account when Alice is signed in with Apple
    endsIn: Alice is signed out within 150 seconds — 4
    checks:
    - Alice is signed out within 150 seconds
    gherkin:
    - specs/profile/sessions.feature:26 — Deleting the Apple account that is Alice's only sign-in method signs Alice
      out
    exampleRow: []
  Deleting a connected Apple account makes Google the only sign-in method:
    description: Deleting a connected Apple account makes Google the only sign-in method
    startingConditions:
    - Alice has connected Apple to their account
    events:
    - Alice deletes their Apple account when Alice has connected Apple to their account
    endsIn: Alice is still signed into the same account — 5
    checks:
    - Alice is still signed into the same account
    - Alice's sign-in methods are Google within 20 seconds
    gherkin:
    - specs/profile/sessions.feature:32 — Deleting a connected Apple account makes Google the only sign-in method
    exampleRow: []
