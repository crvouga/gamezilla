journeys:
  Abandoning signing in offline does not stop signing in once back online:
    description: Abandoning signing in offline does not stop signing in once back online
    startingConditions:
    - Alice is a guest
    - Alice is offline
    - Alice has abandoned signing in with Apple
    - the connection has come back
    events:
    - Alice signs in with Apple
    endsIn: Alice has a signed-in account — 1
    checks:
    - Alice has a signed-in account
    gherkin:
    - specs/profile/offline-sign-in.feature:9 — Abandoning signing in offline does not stop signing in once back
      online
    exampleRow: []
  Signing out works without a connection:
    description: Signing out works without a connection
    startingConditions:
    - Alice is signed in with Google
    - Alice is offline
    events:
    - Alice signs out
    endsIn: Alice is signed out — 2
    checks:
    - Alice is signed out
    gherkin:
    - specs/profile/offline-sign-in.feature:17 — Signing out works without a connection
    exampleRow: []
  After signing out offline, Alice can sign back in once online:
    description: After signing out offline, Alice can sign back in once online
    startingConditions:
    - Alice is signed in with Google
    - Alice is offline
    - Alice has signed out
    - the connection has come back
    events:
    - Alice signs in with Google
    endsIn: Alice is signed into the same account — 3
    checks:
    - Alice is signed into the same account
    gherkin:
    - specs/profile/offline-sign-in.feature:23 — After signing out offline, Alice can sign back in once online
    exampleRow: []
