      description: The person is at the place where sign in and out.
      snapshot: the-person-is-at-the-place-where-sign-in-and-out
      recognize: []
      checks:
      - The journey’s starting facts are in place.
      events: []
      confidence: assumed
      source:
      - specs/profile/sign-in.feature:2
    'on':
      ? Alice signs in with Google when Alice is a guest and Alice's username is @alice_guest and Alice has saved
        an avatar with seed 'harbor' and style 'Bottts'
      : target: Alice's profile shows @alice_guest — 1
        meta:
          source:
          - specs/profile/sign-in.feature:10
          condition:
          - Alice is a guest
          - Alice's username is @alice_guest
          - Alice has saved an avatar with seed "harbor" and style "Bottts"
          example: A guest keeps their profile when signing in
      Alice signs out:
        target: Alice is signed out — 2
        meta:
          source:
          - specs/profile/sign-in.feature:18
          condition:
          - Alice is signed in with Google
          example: Signing out signs this device out
      ? Alice signs in with Google when Alice is signed in with Google and Alice's username is @alice_account and
        Alice has signed out
      : target: Alice's profile shows @alice_account — 3
        meta:
          source:
          - specs/profile/sign-in.feature:23
          condition:
          - Alice is signed in with Google
          - Alice's username is @alice_account
          - Alice has signed out
          example: Signing back in brings back the account's profile
      Alice's account opens on another device:
        target: Alice's other device shows @alice_laptop — 4
        meta:
          source:
          - specs/profile/sign-in.feature:30
          condition:
          - Alice is signed in
          - Alice's username is @alice_laptop
          example: A new device shows the account's current username
      Alice renames themselves to @alice_second on their other device:
        target: Alice's profile shows @alice_second within 15 seconds — 5
        meta:
          source:
          - specs/profile/sign-in.feature:36
          condition:
          - Alice is signed in
          - Alice is also signed in on another device
          example: A username change on one device reaches the other
