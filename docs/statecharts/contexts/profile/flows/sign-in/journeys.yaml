journeys:
  A guest keeps their profile when signing in:
    description: A guest keeps their profile when signing in
    startingConditions:
    - Alice is a guest
    - Alice's username is @alice_guest
    - Alice has saved an avatar with seed "harbor" and style "Bottts"
    events:
    - Alice signs in with Google when Alice is a guest and Alice's username is @alice_guest and Alice has saved
      an avatar with seed 'harbor' and style 'Bottts'
    endsIn: Alice's profile shows @alice_guest — 1
    checks:
    - Alice's profile shows @alice_guest
    - Alice's saved avatar has seed "harbor"
    gherkin:
    - specs/profile/sign-in.feature:10 — A guest keeps their profile when signing in
    exampleRow: []
  Signing out signs this device out:
    description: Signing out signs this device out
    startingConditions:
    - Alice is signed in with Google
    events:
    - Alice signs out
    endsIn: Alice is signed out — 2
    checks:
    - Alice is signed out
    gherkin:
    - specs/profile/sign-in.feature:18 — Signing out signs this device out
    exampleRow: []
  Signing back in brings back the account's profile:
    description: Signing back in brings back the account's profile
    startingConditions:
    - Alice is signed in with Google
    - Alice's username is @alice_account
    - Alice has signed out
    events:
    - Alice signs in with Google when Alice is signed in with Google and Alice's username is @alice_account and
      Alice has signed out
    endsIn: Alice's profile shows @alice_account — 3
    checks:
    - Alice's profile shows @alice_account
    gherkin:
    - specs/profile/sign-in.feature:23 — Signing back in brings back the account's profile
    exampleRow: []
  A new device shows the account's current username:
    description: A new device shows the account's current username
    startingConditions:
    - Alice is signed in
    - Alice's username is @alice_laptop
    events:
    - Alice's account opens on another device
    endsIn: Alice's other device shows @alice_laptop — 4
    checks:
    - Alice's other device shows @alice_laptop
    gherkin:
    - specs/profile/sign-in.feature:30 — A new device shows the account's current username
    exampleRow: []
  A username change on one device reaches the other:
    description: A username change on one device reaches the other
    startingConditions:
    - Alice is signed in
    - Alice is also signed in on another device
    events:
    - Alice renames themselves to @alice_second on their other device
    endsIn: Alice's profile shows @alice_second within 15 seconds — 5
    checks:
    - Alice's profile shows @alice_second within 15 seconds
    gherkin:
    - specs/profile/sign-in.feature:36 — A username change on one device reaches the other
    exampleRow: []
