journeys:
  A sign-in lasts 29 days:
    description: A sign-in lasts 29 days
    startingConditions:
    - Dave is signed in with their Apple account
    events:
    - 29 days pass
    endsIn: Dave is still signed in — 1
    checks:
    - Dave is still signed in
    gherkin:
    - specs/auth/sign-in-ends.feature:13 — A sign-in lasts 29 days
    exampleRow: []
  A sign-in lapses after 30 days:
    description: A sign-in lapses after 30 days
    startingConditions:
    - Dave is signed in with their Apple account
    events:
    - 30 days pass
    endsIn: Dave is signed out — 2
    checks:
    - Dave is signed out
    gherkin:
    - specs/auth/sign-in-ends.feature:17 — A sign-in lapses after 30 days
    exampleRow: []
  Signing out everywhere signs Bob out on every device:
    description: Signing out everywhere signs Bob out on every device
    startingConditions:
    - Bob is signed in with their Google account
    - Bob is also signed in on a second device
    events:
    - Bob signs out everywhere when Bob is signed in with their Google account and Bob is also signed in on a second
      device
    endsIn: Bob is signed out — 3
    checks:
    - Bob is signed out
    - Bob's second device is signed out
    gherkin:
    - specs/auth/sign-in-ends.feature:27 — Signing out everywhere signs Bob out on every device
    exampleRow: []
  Signing out everywhere keeps other accounts signed in:
    description: Signing out everywhere keeps other accounts signed in
    startingConditions:
    - Bob is signed in with their Google account
    - Bob is also signed in on a second device
    - Alice is signed in with their Google account
    events:
    - Bob signs out everywhere when Bob is signed in with their Google account and Bob is also signed in on a second
      device and Alice is signed in with their Google account
    endsIn: Bob's second device is signed out — 4
    checks:
    - Bob's second device is signed out
    - Alice is still signed in
    gherkin:
    - specs/auth/sign-in-ends.feature:32 — Signing out everywhere keeps other accounts signed in
    exampleRow: []
