journeys:
  Alice connects Apple to their account:
    description: Alice connects Apple to their account
    startingConditions:
    - Alice is signed in with their Google account
    events:
    - Alice connects Apple when Alice is signed in with their Google account
    endsIn: Alice's sign-in methods are Google and Apple — 1
    checks:
    - Alice's sign-in methods are Google and Apple
    gherkin:
    - specs/auth/sign-in-methods.feature:9 — Alice connects Apple to their account
    exampleRow: []
  A second Google account cannot be connected:
    description: A second Google account cannot be connected
    startingConditions:
    - Alice is signed in with their Google account
    events:
    - Alice tries to connect a second Google account
    endsIn: Alice is told the account already has Google — 2
    checks:
    - Alice is told the account already has Google
    - Alice's sign-in methods are still Google
    gherkin:
    - specs/auth/sign-in-methods.feature:14 — A second Google account cannot be connected
    exampleRow: []
  Connecting on a device Dave used never reaches Dave's account:
    description: Connecting on a device Dave used never reaches Dave's account
    startingConditions:
    - Dave has opened their sign-in methods on a shared device
    - Dave has signed out on that device
    - Alice has signed in with Google on that device
    events:
    - Alice tries to connect Dave's Apple account
    endsIn: Alice is told that Apple account belongs to another account — 3
    checks:
    - Alice is told that Apple account belongs to another account
    - Alice is still signed into their own account
    gherkin:
    - specs/auth/sign-in-methods.feature:20 — Connecting on a device Dave used never reaches Dave's account
    exampleRow: []
  Alice connects Apple once their device is back online:
    description: Alice connects Apple once their device is back online
    startingConditions:
    - Alice is signed in with their Google account
    - Alice's device has lost its connection
    - Alice's device is back online
    events:
    - Alice connects Apple when Alice is signed in with their Google account and Alice's device has lost its connection
      and Alice's device is back online
    endsIn: Alice's sign-in methods are Google and Apple — 4
    checks:
    - Alice's sign-in methods are Google and Apple
    gherkin:
    - specs/auth/sign-in-methods.feature:34 — Alice connects Apple once their device is back online
    exampleRow: []
  Connecting Apple offline changes no sign-in method:
    description: Connecting Apple offline changes no sign-in method
    startingConditions:
    - Alice is signed in with their Google account
    - Alice's device has lost its connection
    events:
    - Alice tries to connect Apple
    endsIn: Alice is told connecting failed — 5
    checks:
    - Alice is told connecting failed
    - Alice's sign-in methods are still Google
    gherkin:
    - specs/auth/sign-in-methods.feature:39 — Connecting Apple offline changes no sign-in method
    exampleRow: []
  Alice removes Apple from their account:
    description: Alice removes Apple from their account
    startingConditions:
    - Alice has connected Apple to their account
    events:
    - Alice removes Apple from their account
    endsIn: Alice's sign-in methods are Google — 6
    checks:
    - Alice's sign-in methods are Google
    gherkin:
    - specs/auth/sign-in-methods.feature:46 — Alice removes Apple from their account
    exampleRow: []
  A removed Apple account signs into a new account:
    description: A removed Apple account signs into a new account
    startingConditions:
    - Alice has connected Apple to their account
    - Alice has removed Apple from their account
    events:
    - Alice signs in with Apple on another device
    endsIn: Alice's other device is signed into a different account — 7
    checks:
    - Alice's other device is signed into a different account
    gherkin:
    - specs/auth/sign-in-methods.feature:51 — A removed Apple account signs into a new account
    exampleRow: []
  Alice cannot remove their last sign-in method:
    description: Alice cannot remove their last sign-in method
    startingConditions:
    - Alice is signed in with their Google account
    events:
    - Alice tries to remove Google from their account
    endsIn: Alice is told the last sign-in method cannot be removed — 8
    checks:
    - Alice is told the last sign-in method cannot be removed
    - Alice's sign-in methods are still Google
    gherkin:
    - specs/auth/sign-in-methods.feature:57 — Alice cannot remove their last sign-in method
    exampleRow: []
