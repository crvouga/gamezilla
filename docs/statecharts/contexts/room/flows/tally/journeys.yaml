journeys:
  Adding one shows for everyone:
    description: Adding one shows for everyone
    startingConditions:
    - Alice and Bob are in the room
    events:
    - Alice adds one to the tally when Alice and Bob are in the room
    endsIn: everyone sees a tally of 1 — 1
    checks:
    - everyone sees a tally of 1
    gherkin:
    - specs/room/tally.feature:13 — Adding one shows for everyone
    exampleRow: []
  Taking one off shows for everyone:
    description: Taking one off shows for everyone
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one to the tally 2 times
    events:
    - Bob takes one off the tally
    endsIn: everyone sees a tally of 1 — 2
    checks:
    - everyone sees a tally of 1
    gherkin:
    - specs/room/tally.feature:17 — Taking one off shows for everyone
    exampleRow: []
  Changes Alice and Bob make in turn all count:
    description: Changes Alice and Bob make in turn all count
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one to the tally
    - Bob has added one to the tally
    events:
    - Alice adds one to the tally when Alice and Bob are in the room and Alice has added one to the tally and Bob
      has added one to the tally
    endsIn: everyone sees a tally of 3 — 3
    checks:
    - everyone sees a tally of 3
    gherkin:
    - specs/room/tally.feature:22 — Changes Alice and Bob make in turn all count
    exampleRow: []
  A change made offline shows at once only for its maker:
    description: A change made offline shows at once only for its maker
    startingConditions:
    - Alice and Bob are in the room
    - Alice's phone is offline
    events:
    - Alice adds one to the tally when Alice and Bob are in the room and Alice's phone is offline
    endsIn: Alice sees a tally of 1 — 4
    checks:
    - Alice sees a tally of 1
    - Bob still sees a tally of 0
    gherkin:
    - specs/room/tally.feature:30 — A change made offline shows at once only for its maker
    exampleRow: []
  A change made offline reaches everyone once its maker is back online:
    description: A change made offline reaches everyone once its maker is back online
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one to the tally while offline
    events:
    - Alice's phone comes back online
    endsIn: everyone sees a tally of 1 — 5
    checks:
    - everyone sees a tally of 1
    gherkin:
    - specs/room/tally.feature:36 — A change made offline reaches everyone once its maker is back online
    exampleRow: []
  A waiting change reaches everyone once its maker reopens the app:
    description: A waiting change reaches everyone once its maker reopens the app
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one to the tally while offline
    - Alice's app has closed unexpectedly
    events:
    - Alice reopens the app
    endsIn: everyone sees a tally of 1 — 6
    checks:
    - everyone sees a tally of 1
    gherkin:
    - specs/room/tally.feature:44 — A waiting change reaches everyone once its maker reopens the app
    exampleRow: []
  A change whose maker did not hear back counts once:
    description: A change whose maker did not hear back counts once
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one while the room became unavailable
    events:
    - the room is available again
    endsIn: everyone sees a tally of 1 — 7
    checks:
    - everyone sees a tally of 1
    gherkin:
    - specs/room/tally.feature:53 — A change whose maker did not hear back counts once
    exampleRow: []
  A later change keeps an interrupted earlier change:
    description: A later change keeps an interrupted earlier change
    startingConditions:
    - Alice and Bob are in the room
    - Alice has added one while the room became unavailable
    - the room is available again
    events:
    - Bob adds one to the tally
    endsIn: everyone sees a tally of 2 — 8
    checks:
    - everyone sees a tally of 2
    gherkin:
    - specs/room/tally.feature:58 — A later change keeps an interrupted earlier change
    exampleRow: []
