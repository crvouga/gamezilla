  context: Room
  kind: flow
  owner: Room owner (not named in specs)
  tier: standard
  emits: []
  reactsTo: []
  reviewStatus: draft; owner approval and execution adapters pending
  codeCandidates: []
  scope: Observable example branches; continuous navigation is in the context’s primary flows and lifecycle projections.
states:
  Viewing Timed match:
    meta:
      description: The person is at the place where timed match.
      snapshot: the-person-is-at-the-place-where-timed-match
      recognize: []
      checks:
      - The journey’s starting facts are in place.
      events: []
      confidence: assumed
      source:
      - specs/room/match-clock.feature:2
    'on':
      White starts a match with 10 seconds for White and 8 seconds for Black:
        target: White is to move — 1
        meta:
          source:
          - specs/room/match-clock.feature:10
          condition:
          - White and Black are in the room
          example: Starting a match gives each player their time with White to move
      Black starts a match with 20 seconds for White and 20 seconds for Black:
        target: the match is still playing with White to move — 2
        meta:
          source:
          - specs/room/match-clock.feature:16
          condition:
          - White and Black have started a match with 10 seconds for White and 10 seconds for Black
          - 3 seconds have passed
          example: A match that is playing cannot be started again
      White starts a match with 10 seconds for White and 10 seconds for Black:
        target: White and Black still see Black win on time — 3
        meta:
          source:
          - specs/room/match-clock.feature:23
          condition:
          - White and Black have started a match with 4 seconds for White and 4 seconds for Black
          - 5 seconds have passed
          example: A match that is over cannot be started again
      6 seconds pass:
        target: White and Black both see Black win on time — 4
        meta:
          source:
          - specs/room/match-clock.feature:31
          condition:
          - White and Black have started a match with 5 seconds for White and 8 seconds for Black
          example: White loses on time when White's time runs out
      4 seconds pass when White and Black have started a match with 5 seconds for White and 8 seconds for Black:
        target: the match is still playing with White to move — 5
        meta:
          source:
          - specs/room/match-clock.feature:36
          condition:
          - White and Black have started a match with 5 seconds for White and 8 seconds for Black
          example: The match plays on while the player to move has time left
      11 seconds pass:
        target: White and Black both see White win on time — 6
        meta:
          source:
          - specs/room/match-clock.feature:42
          condition:
          - White and Black have started a match with 10 seconds for White and 10 seconds for Black
          - White has moved after 3 seconds
          example: Black loses on time when Black's own time runs out
      ? 4 seconds pass when White and Black have started a match with 10 seconds for White and 10 seconds for Black
        and White has moved after 3 seconds
      : target: White has 7 seconds left and Black has 6 seconds left — 7
        meta:
          source:
          - specs/room/match-clock.feature:51
          condition:
          - White and Black have started a match with 10 seconds for White and 10 seconds for Black
          - White has moved after 3 seconds
          example: White's time stands still while Black is to move
      ? White moves when White and Black have started a match with 10 seconds for White and 10 seconds for Black
        and 3 seconds have passed
      : target: Black is to move — 8
        meta:
          source:
          - specs/room/match-clock.feature:59
          condition:
          - White and Black have started a match with 10 seconds for White and 10 seconds for Black
          - 3 seconds have passed
          example: A move keeps the mover's time left and passes the clock to the opponent
      Black moves:
        target: the match is still playing with White to move — 9
        meta:
          source:
          - specs/room/match-clock.feature:66
          condition:
          - White and Black have started a match with 10 seconds for White and 10 seconds for Black
          example: Black cannot move while White is to move
      White moves when White and Black are in the room:
        target: the match has still not started — 10
        meta:
          source:
          - specs/room/match-clock.feature:71
          condition:
          - White and Black are in the room
          example: Nobody can move before the match starts
      ? White moves when White and Black have started a match with 4 seconds for White and 4 seconds for Black and
        White's phone has been offline for 5 seconds
      : target: White is told the move came too late — 11
        meta:
          source:
          - specs/room/match-clock.feature:76
          condition:
          - White and Black have started a match with 4 seconds for White and 4 seconds for Black
          - White's phone has been offline for 5 seconds
          example: A move after the mover has run out of time is too late
      White's phone comes back online:
        target: White and Black both see Black win on time — 12
        meta:
          source:
          - specs/room/match-clock.feature:85
          condition:
          - White and Black have started a match with 4 seconds for White and 4 seconds for Black
          - White's phone has been offline for 5 seconds
          example: White sees the result once back online after running out of time
      Black claims White has run out of time:
        target: the match is still playing with White to move — 13
        meta:
          source:
          - specs/room/match-clock.feature:93
          condition:
          - White and Black have started a match with 8 seconds for White and 8 seconds for Black
          example: A claim before the opponent's time has run out changes nothing
      9 seconds pass:
        target: White and Black both see Black win on time — 14
        meta:
          source:
          - specs/room/match-clock.feature:98
          condition:
          - White and Black have started a match with 8 seconds for White and 8 seconds for Black
          - Black has claimed White has run out of time
          example: The match is still won on time after an early claim
