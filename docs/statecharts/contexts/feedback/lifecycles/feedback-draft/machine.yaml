id: feedback-feedback-draft
initial: Writing feedback
meta:
  context: Product feedback
  kind: lifecycle
  owner: Product feedback owner (not named in specs)
  tier: standard
  emits: []
  reactsTo: []
  reviewStatus: draft; owner approval and execution adapters pending
  assumedLifecycle: There is no feedback Quint model; product and engineering must confirm these code-derived phases.
states:
  Writing feedback:
    meta:
      description: Writing feedback.
      snapshot: writing-feedback
      recognize: []
      checks:
      - Writing feedback.
      events: []
      confidence: assumed
      source:
      - pkgs/feedback-client/src/controller.ts
    'on':
      Sends nonblank feedback:
        target: Sending feedback
        meta:
          source:
          - pkgs/feedback-client/src/controller.ts
  Sending feedback:
    meta:
      description: Sending feedback.
      snapshot: sending-feedback
      recognize: []
      checks:
      - Sending feedback.
      events: []
      confidence: assumed
      source:
      - pkgs/feedback-client/src/controller.ts
    'on':
      Reporting saves the feedback:
        target: Feedback kept
        meta:
          source:
          - pkgs/feedback-client/src/controller.ts
      Reporting fails:
        target: Told sending failed
        meta:
          source:
          - pkgs/feedback-client/src/controller.ts
  Feedback kept:
    meta:
      description: Feedback kept.
      snapshot: feedback-kept
      recognize: []
      checks:
      - Feedback kept.
      events: []
      confidence: assumed
      source:
      - pkgs/feedback-client/src/controller.ts
    'on':
      Starts another draft:
        target: Writing feedback
        meta:
          source:
          - pkgs/feedback-client/src/controller.ts
  Told sending failed:
    meta:
      description: Told sending failed.
      snapshot: told-sending-failed
      recognize: []
      checks:
      - Told sending failed.
      events: []
      confidence: assumed
      source:
      - pkgs/feedback-client/src/controller.ts
    'on':
      Sends the preserved writing again:
        target: Sending feedback
        meta:
          source:
          - pkgs/feedback-client/src/controller.ts
