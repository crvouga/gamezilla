# Product behavior projection; authoritative rules remain in specs/.
id: tools
initial: 'Tools: Tool home'
meta:
  description: The testing tool reaches test worlds, notebooks, reports, release evidence and the framework example
    apps.
  snapshot: The testing tool reaches test worlds, notebooks, reports, release evidence and the framework example
    apps.
  confidence: assumed
  source: &id001
  - specs/README.md#context-map
  - docs/statecharts/SPEC_CONFLICTS.md
  events: []
  context: developer-tools
  eventKinds:
    Opens automated reports: user
    Opens data notebooks: user
    Opens database maintenance evidence: user
    Opens environment information: user
    Opens release evidence: user
    Opens test worlds: user
    Opens the chessboard example: user
    Opens the matchmaking example: user
    Opens the notes example: user
    Opens the room example: user
    Returns to the testing tool: user
    Reads device and component inspection scope: user
states:
  'Tools: Tool home':
    id: 'Tools: Tool home'
    meta:
      routes:
      - '/harness'
      description: The team can choose a test world, evidence or an independent framework example.
      snapshot: The team can choose a test world, evidence or an independent framework example.
      confidence: assumed
      source: *id001
      events: []
      checks: []
      hints:
      - Room, notes, matchmaking, chessboard and maintenance are independently scoped framework contracts, grouped
        for exploration; these links are not promises of player tabs.
    'on':
      Opens test worlds:
        target: '#Tools: Test worlds'
      Opens data notebooks:
        target: '#Tools: Data notebook'
      Opens automated reports:
        target: '#Tools: Automated reports'
      Opens release evidence:
        target: '#Tools: Release check'
      Opens environment information:
        target: '#Tools: Environment'
      Opens the notes example:
        target: '#Tools: Notes example'
      Opens the room example:
        target: '#Tools: Room example'
      Opens the matchmaking example:
        target: '#Tools: Matchmaking example'
      Opens the chessboard example:
        target: '#Tools: Chessboard example'
      Opens database maintenance evidence:
        target: '#Tools: Database maintenance'
      Reads device and component inspection scope:
        target: '#Tools: Inspection scope'
  'Tools: Inspection scope':
    id: 'Tools: Inspection scope'
    meta:
      description: Device inspection and component exploration remain visible even where their observable contract needs definition.
      source:
      - specs/README.md#product-contract-inventory
    invoke:
