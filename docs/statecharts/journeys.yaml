  New guest to first puzzle outcome:
    description: A newcomer opens Spaces, hosts a space and solves the first chess puzzle.
    startingConditions:
    - Fresh device; guest profile; no hosted space; one solvable puzzle available; no account required.
    events:
    - Alice opens the app
    - Creates a space below the hosting limit
    - Space creation succeeds
    - SpaceOpened
    - Opens puzzles with an available start
    - The next puzzle becomes ready
    - Solves the puzzle
    contractEvents:
    - SpaceOpened
    legs:
    - chart: contexts/runtime/flows/app-shell/machine.json
      events:
      - Alice opens the app
      endsIn: Alice sees the tabs — 1
    - chart: contexts/spaces/flows/hosting-and-joining/machine.json
      events:
      - Creates a space below the hosting limit
      - Space creation succeeds
      endsIn: Hosting the open space
      publishes:
      - SpaceOpened
    - chart: contexts/chess/flows/puzzle-solving-and-recovery/machine.json
      events:
      - SpaceOpened
      - Opens puzzles with an available start
      - The next puzzle becomes ready
      - Solves the puzzle
      endsIn: Seeing a solved puzzle
    executionStatus: Each contextual path is replayable as a declarative leg composition. The seeded app and event
      adapters have not been executed.
  Deletion ends social presence and future charges:
    description: Deletion withdraws the account, completes provider cancellation and reaches the downstream visibility
      contracts.
    startingConditions:
    - Alice owns an active account with recent proof, a hosted space, a membership and a friendship with Bob; Bob
      is observing the affected space and social surfaces.
    events:
    - Requests deletion with proof less than ten minutes old
    - Confirms permanent deletion
    - Deletion is confirmed
    - AccountDeletionConfirmed
    - Provider cancellation remains pending
    - Provider cancellation completes
    - SpaceEnded
    - SignedOut
    contractEvents:
    - AccountDeletionConfirmed
    - SpaceEnded
    - SignedOut
    legs:
    - chart: contexts/profile/flows/account-privacy/machine.json
      events:
      - Requests deletion with proof less than ten minutes old
      - Confirms permanent deletion
      - Deletion is confirmed
      - Provider cancellation remains pending
      - Provider cancellation completes
      endsIn: Membership cancellation complete
      publishes:
      - AccountDeletionConfirmed
      - SignedOut
    - chart: contexts/spaces/flows/published-event-reactions/machine.json
      events:
      - AccountDeletionConfirmed
      endsIn: Seeing the deleted account cannot be used or shown; retained legal records confer no access
      publishes:
      - SpaceEnded
      publicationCondition: Alice is the host of an open space; the context owner must approve the complete downstream
        delivery contract.
    - chart: contexts/friends/flows/published-event-reactions/machine.json
      events:
      - AccountDeletionConfirmed
      endsIn: Seeing the deleted account cannot be used or shown; retained legal records confer no access
    executionStatus: All contextual paths replay; the complete event publication timing and real application adapters
      still require owner review.
