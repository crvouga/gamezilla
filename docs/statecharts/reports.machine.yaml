# Product behavior projection; authoritative rules remain in specs/.
id: reports
initial: 'Reports: Report catalogue'
meta:
  description: The team explores every spec and its current automated evidence, including missing or unavailable
    reports.
  snapshot: The team explores every spec and its current automated evidence, including missing or unavailable reports.
  confidence: assumed
  source: &id001
  - specs/developer-tools/recorded-moments.feature
  - specs/developer-tools/report-catalog.feature
  - specs/developer-tools/report-explorer.feature
  - specs/developer-tools/report-navigation.feature
  - specs/developer-tools/report-performance.feature
  events: []
  context: developer-tools
  eventKinds:
    Changes the report search: user
    Explores specs and report parts: user
    Moves past the first or final recorded moment: user
    Moves to the next failed moment and wraps if needed: user
    Moves to the next recorded moment within the report: user
    Moves to the previous recorded moment within the report: user
    Opens a completed test report: user
    Opens a spec with no completed evidence: user
    Opens a valid recorded moment address: user
    Opens an out-of-range recorded moment address: user
    Opens this spec’s completed report: user
    Reads completed performance evidence: user
    Reports are unavailable: system
    Returns to the report catalogue: user
    Returns to the spec evidence: user
    Searches matching report names: user
    Searches report names with no match: user
    Shows failed reports only: user
    Shows the recorded control: user
    Tries opening reports again after they become available: user
states:
  'Reports: Report catalogue':
    id: 'Reports: Report catalogue'
    meta:
      routes:
      - '/reports'
      description: Reports are grouped by the edition they checked; partial completed evidence remains visible.
      snapshot: Reports are grouped by the edition they checked; partial completed evidence remains visible.
      confidence: assumed
      source:
      - specs/developer-tools/report-explorer.feature:6
      - specs/developer-tools/report-explorer.feature:21
      - specs/developer-tools/report-explorer.feature:33
      - specs/developer-tools/report-explorer.feature:45
      events: []
      gherkin:
      - specs/developer-tools/report-explorer.feature
      checks:
      - Every spec remains available whether or not it has a test report
      - Independently completed report parts combine for the same version of the app
      - A report part without completed evidence explains its absence
      - Unavailable test reports explain the problem and allow another attempt
    'on':
      Opens a completed test report:
        target: '#Reports: Recorded moment'
      Searches matching report names:
        target: '#Reports: Report catalogue'
      Searches report names with no match:
        target: '#Reports: No matching reports'
      Shows failed reports only:
        target: '#Reports: Report catalogue'
      Explores specs and report parts:
        target: '#Reports: Spec evidence'
      Reports are unavailable:
        target: '#Reports: Reports unavailable'
  'Reports: No matching reports':
    id: 'Reports: No matching reports'
    meta:
      description: No test run matches the supplied report name.
      snapshot: No test run matches the supplied report name.
      confidence: assumed
      source:
      - specs/developer-tools/recorded-moments.feature:6
      - specs/developer-tools/recorded-moments.feature:19
      - specs/developer-tools/recorded-moments.feature:32
      - specs/developer-tools/recorded-moments.feature:44
      - specs/developer-tools/report-catalog.feature:6
      - specs/developer-tools/report-catalog.feature:15
      - specs/developer-tools/report-catalog.feature:29
      - specs/developer-tools/report-catalog.feature:41
      - specs/developer-tools/report-navigation.feature:6
      - specs/developer-tools/report-navigation.feature:28
      - specs/developer-tools/report-navigation.feature:40
      - specs/developer-tools/report-performance.feature:6
      - specs/developer-tools/report-performance.feature:19
      - specs/developer-tools/report-performance.feature:31
      events: []
      gherkin:
      - specs/developer-tools/recorded-moments.feature
      - specs/developer-tools/report-catalog.feature
      - specs/developer-tools/report-navigation.feature
      - specs/developer-tools/report-performance.feature
      checks:
      - Opening a test report starts at its first failure or its final recorded moment
      - Each person's picture is from the selected recorded moment or an earlier one
      - A missing picture never becomes a guessed picture
      - A recorded action highlights only the control it actually recorded
      - A test report belongs to the edition its test run checked
      - Finished test runs appear while other test runs are still running
      - Finding test runs matches their names against supplied text
      - Filtering by failure shows failed test runs only
      - Moving among recorded moments stops at the first and final recorded moments
      - Moving among failures wraps to the first failure and keeps a passing report in place
      - An address selects a recorded moment when that moment exists
      - A heatmap shows recorded time and marks steps beyond the chosen allowance
      - Missing measurements never become evidence that a step was quick
      - Choosing a measured step shows its recorded moment
    'on':
      Changes the report search:
        target: '#Reports: Report catalogue'
  'Reports: Reports unavailable':
    id: 'Reports: Reports unavailable'
    meta:
      description: Unavailable reports explain the problem and offer another attempt.
      snapshot: Unavailable reports explain the problem and offer another attempt.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Tries opening reports again after they become available:
        target: '#Reports: Report catalogue'
  'Reports: Spec evidence':
    id: 'Reports: Spec evidence'
    meta:
      routes:
      - '/reports/:sha'
      description: Every spec is available even when evidence is missing; another edition’s pass supplies no evidence
        here.
      snapshot: Every spec is available even when evidence is missing; another edition’s pass supplies no evidence
        here.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Opens this spec’s completed report:
        target: '#Reports: Recorded moment'
      Opens a spec with no completed evidence:
        target: '#Reports: Evidence missing'
      Reads completed performance evidence:
        target: '#Reports: Performance evidence'
  'Reports: Evidence missing':
    id: 'Reports: Evidence missing'
    meta:
      description: Missing, unperformed or stale evidence remains visible and supplies no passing claim.
      snapshot: Missing, unperformed or stale evidence remains visible and supplies no passing claim.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the spec evidence:
        target: '#Reports: Spec evidence'
  'Reports: Performance evidence':
    id: 'Reports: Performance evidence'
    meta:
      description: The measured outcome belongs to this edition and can be inspected without inventing measurements.
      snapshot: The measured outcome belongs to this edition and can be inspected without inventing measurements.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Returns to the spec evidence:
        target: '#Reports: Spec evidence'
  'Reports: Recorded moment':
    id: 'Reports: Recorded moment'
    meta:
      description: A report opens at its first failure or final moment and shows only pictures from that moment
        or earlier.
      snapshot: A report opens at its first failure or final moment and shows only pictures from that moment or
        earlier.
      confidence: assumed
      source: *id001
      events: []
      checks: []
    'on':
      Moves to the next recorded moment within the report:
        target: '#Reports: Recorded moment'
      Moves to the previous recorded moment within the report:
        target: '#Reports: Recorded moment'
      Moves past the first or final recorded moment:
        target: '#Reports: Recorded moment'
      Moves to the next failed moment and wraps if needed:
        target: '#Reports: Recorded moment'
      Opens a valid recorded moment address:
        target: '#Reports: Recorded moment'
      Opens an out-of-range recorded moment address:
        target: '#Reports: Recorded moment'
      Shows the recorded control:
        target: '#Reports: Recorded moment'
      Returns to the report catalogue:
        target: '#Reports: Report catalogue'
