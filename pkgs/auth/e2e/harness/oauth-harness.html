<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auth OAuth harness</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      button { padding: 0.75rem 1rem; font-size: 1rem; }
      #error { color: #b91c1c; margin-top: 1rem; white-space: pre-wrap; }
      #token { margin-top: 1rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Auth OAuth harness</h1>
    <button id="sign-in-google" data-testid="harness-sign-in-google">Sign in with Google</button>
    <div id="error" data-testid="harness-error"></div>
    <div id="token" data-testid="harness-token"></div>
    <script>
      const API = 'http://127.0.0.1:4178';
      const CALLBACK = 'http://127.0.0.1:4178/oauth-callback';

      function launchUrl(provider) {
        const url = new URL(`${API}/auth/oauth/launch`);
        url.searchParams.set('provider', provider);
        url.searchParams.set('callbackUrl', CALLBACK);
        return url.toString();
      }

      async function exchangeCode(code) {
        const res = await fetch(`${API}/auth/session`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        if (!res.ok) throw new Error(`exchange failed: ${res.status}`);
        const body = await res.json();
        return body.token;
      }

      function parseCode(resultUrl) {
        try {
          return new URL(resultUrl).searchParams.get('code');
        } catch {
          return null;
        }
      }

      async function runOauth(provider) {
        const errorEl = document.getElementById('error');
        const tokenEl = document.getElementById('token');
        errorEl.textContent = '';
        tokenEl.textContent = '';
        const url = launchUrl(provider);
        const popup = window.open(url, 'auth', 'width=480,height=640');
        if (popup == null) {
          errorEl.textContent =
            'Popup window was blocked by the browser or failed to open. This can happen in mobile browsers when the window.open() method was invoked too long after a user input was fired.';
          return;
        }
        const code = await new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener('message', onMessage);
            reject(new Error('Sign-in timed out. Please try again.'));
          }, 30_000);
          function onMessage(event) {
            if (event.data?.type !== 'oauth-complete') return;
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            resolve(event.data.code);
          }
          window.addEventListener('message', onMessage);
          const closedTimer = setInterval(() => {
            if (popup.closed) {
              clearInterval(closedTimer);
              clearTimeout(timer);
              window.removeEventListener('message', onMessage);
              reject(new Error("Sign-in was cancelled or didn't finish."));
            }
          }, 100);
        }).catch((err) => {
          errorEl.textContent = err.message;
          return null;
        });
        if (code == null) return;
        const token = await exchangeCode(code);
        tokenEl.textContent = token;
      }

      document.getElementById('sign-in-google').addEventListener('click', () => {
        void runOauth('google');
      });
    </script>
  </body>
</html>
