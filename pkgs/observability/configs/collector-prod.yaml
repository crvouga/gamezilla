extensions:
  bearertokenauth/ingest:
    token: ${env:OBSERVABILITY_INGEST_TOKEN}
  health_check:
    endpoint: 0.0.0.0:13133
    path: /ready

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/ingest
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/ingest

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  transform/allowlist:
    error_mode: propagate
    trace_statements:
      - 'keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "app.build.sha"])'
      - 'keep_keys(span.attributes, ["user.id", "session.id", "db.system.name", "db.operation.name", "db.query.text", "code.file.path", "code.function.name", "exception.type", "exception.message", "exception.stacktrace", "http.request.method", "http.route", "http.response.status_code", "app.mutation.id", "app.device.id", "app.build.sha", "app.sync.batch_size", "app.clock_skew_ms", "app.interaction.outcome", "app.interaction.type", "app.interaction.target", "app.log.severity", "app.log.message", "app.log.name", "app.error.trace_id", "app.room.connection_id", "app.room.message_bytes", "app.room.module", "app.room.outcome", "app.room.topic"])'
      - 'keep_keys(spanevent.attributes, ["exception.type", "exception.message", "exception.stacktrace", "app.mutation.id", "app.device.id", "app.log.severity", "app.log.message", "app.log.name", "app.error.trace_id"])'
  batch:
    send_batch_size: 512
    timeout: 1s

exporters:
  otlp_http/backend:
    endpoint: ${env:OBSERVABILITY_BACKEND_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:OBSERVABILITY_BACKEND_AUTHORIZATION}
    sending_queue:
      enabled: true
      queue_size: 4096
    retry_on_failure:
      enabled: true

service:
  extensions: [bearertokenauth/ingest, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [otlp_http/backend]
