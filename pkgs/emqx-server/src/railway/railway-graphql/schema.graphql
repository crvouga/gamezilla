    """
    afterLimit: Int

    """
    Target date time to look for logs
    """
    anchorDate: String

    """
    Oldest date to look for logs before the anchor
    """
    beforeDate: String

    """
    Limit the number of logs returned before the anchor
    """
    beforeLimit: Int
    environmentId: String!

    """
    Filter logs using a query syntax
