## Node ##
node {
  name = "emqx@127.0.0.1"
  cookie = "emqx_local"
  data_dir = "data"
}

## Dashboard + HTTP API ##
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

## MQTT TCP ##
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

## MQTT WebSocket (/mqtt) ##
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

## Session / offline mqueue ##
## Clients use MQTT 5 sessionExpiryInterval (600s). Broker default below
## applies to non-MQTT5 clients and caps queue length for offline drain.
mqtt {
  session_expiry_interval = 10m
  max_mqueue_len = 1000
  mqueue_default_priority = lowest
  mqueue_store_qos0 = false
}

## Auth ##
## Local broker uses password_based only. Bootstrap CSV is written next to
## the data dir by startEmqxServer; absolute path is also set via env.
authentication = [
  {
    mechanism = "password_based"
    backend = "built_in_database"
    enable = true
  }
]

## JWT ACL is authoritative when present. Local keeps no_match=allow so
## password_based contract-test clients (no JWT ACL) still work. Production
## should set no_match = deny once all app clients use JWT.
authorization {
  no_match = "allow"
  deny_action = "ignore"
}

## API keys bootstrap file (key:secret per line) ##
api_key {
  bootstrap_file = "data/api-keys.bootstrap"
}
