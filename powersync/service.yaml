# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json

_type: cloud
name: development
region: us

replication:
  connections:
    - type: postgresql
      hostname: !env PS_DATABASE_HOST
      port: !env PS_DATABASE_PORT::number
      database: !env PS_DATABASE_NAME
      username: !env PS_DATABASE_USER
      password:
        secret: !env PS_DATABASE_PASSWORD
      sslmode: verify-full

client_auth:
  jwks:
    keys:
      - kty: RSA
        kid: powersync
        alg: RS256
        use: sig
        n: !env POWERSYNC_JWT_N
        e: !env POWERSYNC_JWT_E
  additional_audiences:
    - !env POWERSYNC_URL
