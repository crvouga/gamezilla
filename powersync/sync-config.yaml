config:
  edition: 3

streams:
  devices:
    priority: 1
    auto_subscribe: true
    query: |
      SELECT * FROM devices
      WHERE id = auth.user_id()
         OR id IN (
           SELECT device_id FROM account_sessions
           WHERE account_id = auth.user_id()
         )

  accounts:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM accounts WHERE id = auth.user_id()

  account_providers:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM account_providers WHERE account_id = auth.user_id()

  account_sessions:
    priority: 1
    auto_subscribe: true
    query: |
      SELECT * FROM account_sessions
      WHERE account_id = auth.user_id()
         OR device_id = auth.user_id()

  profiles:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  spaces:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM spaces
      WHERE host_id = auth.user_id()
         OR id IN (
           SELECT space_id FROM space_memberships
           WHERE guest_id = auth.user_id() AND left_at IS NULL
         )

  space_memberships:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM space_memberships
      WHERE guest_id = auth.user_id()
         OR space_id IN (
           SELECT id FROM spaces WHERE host_id = auth.user_id()
         )

  client_config:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM client_config

  chess_puzzle_profiles:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_profiles WHERE owner_id = auth.user_id()

  chess_puzzle_interactions:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_interactions WHERE owner_id = auth.user_id()

  chess_puzzles:
    priority: 3
    accept_potentially_dangerous_queries: true
    query: |
      SELECT * FROM chess_puzzles
      WHERE rating / 400 = CAST(subscription.parameter('rating_band') AS INTEGER)

  entity_store_catalog:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id IS NULL

  entity_store_owner:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id = auth.user_id()
