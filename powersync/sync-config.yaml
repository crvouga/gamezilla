config:
  edition: 3

streams:
  devices:
    priority: 1
    auto_subscribe: true
    query: |
      SELECT * FROM devices
      WHERE id = auth.user_id()
         OR user_id = auth.user_id()

  users:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM users WHERE id = auth.user_id()

  external_accounts:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM external_accounts WHERE user_id = auth.user_id()

  profiles:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  spaces:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM spaces
      WHERE host_id = auth.user_id()
         OR id IN (
           SELECT space_id FROM space_memberships
           WHERE guest_id = auth.user_id() AND left_at IS NULL
         )

  space_memberships:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM space_memberships
      WHERE guest_id = auth.user_id()
         OR space_id IN (
           SELECT id FROM spaces WHERE host_id = auth.user_id()
         )

  client_config:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM client_config

  chess_puzzle_profiles:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_profiles WHERE owner_id = auth.user_id()

  chess_puzzle_interactions:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_interactions WHERE owner_id = auth.user_id()

  chess_puzzles:
    priority: 3
    auto_subscribe: true
    accept_potentially_dangerous_queries: true
    query: |
      SELECT
        id,
        fen,
        moves,
        rating,
        rating_deviation,
        popularity,
        nb_plays,
        themes,
        game_url,
        opening_tags
      FROM chess_puzzles
      WHERE sync_pool = true

  friend_requests:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friend_requests
      WHERE from_user_id = auth.user_id()
         OR to_user_id = auth.user_id()

  friendships:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friendships
      WHERE user_low = auth.user_id()
         OR user_high = auth.user_id()

  user_blocks:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM user_blocks
      WHERE blocker_id = auth.user_id()

  friend_profile_cache:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friend_profile_cache
      WHERE owner_id = auth.user_id()

  entity_store_catalog:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id IS NULL

  entity_store_owner:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id = auth.user_id()

  inbox_interactions:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM inbox_interactions
      WHERE user_id = auth.user_id()
        AND active = true
