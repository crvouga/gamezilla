config:
  edition: 3

streams:
  devices:
    priority: 1
    auto_subscribe: true
    query: |
      SELECT * FROM devices
      WHERE id = auth.user_id()
         OR user_id = auth.user_id()

  users:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM users WHERE id = auth.user_id()

  external_accounts:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM external_accounts WHERE user_id = auth.user_id()

  profiles:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  spaces:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM spaces
      WHERE host_member_id = auth.user_id()
         OR host_member_id = auth.parameter('device_id')
         OR id IN (
           SELECT space_id FROM space_memberships
           WHERE left_at IS NULL
             AND (
               member_id = auth.user_id()
               OR member_id = auth.parameter('device_id')
             )
         )
         OR id IN (
           SELECT space_id FROM space_participations
           WHERE left_at IS NULL
             AND device_id = auth.parameter('device_id')
         )
         OR (
           visibility = 'public'
           AND ended_at IS NULL
         )
         OR (
           visibility = 'friends'
           AND ended_at IS NULL
           AND host_account_id IS NOT NULL
           AND (
             host_account_id IN (
               SELECT user_high FROM friendships
               WHERE user_low = auth.user_id()
             )
             OR host_account_id IN (
               SELECT user_low FROM friendships
               WHERE user_high = auth.user_id()
             )
           )
         )
         OR id IN (
           SELECT space_id FROM space_invites
           WHERE invitee_account_id = auth.user_id()
             AND revoked_at IS NULL
             AND (expires_at IS NULL OR expires_at > datetime('now'))
         )

  space_invites:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM space_invites
      WHERE invitee_account_id = auth.user_id()
         OR created_by_account_id = auth.user_id()

  # On-demand join target: hydrate one space (+ matching invite) when the
  # viewer opens a join/deep-link that is outside the auto-subscribe scope
  # (private link invites). Client must pass space_id and invite_token
  # (empty string when no invite).
  space_join:
    priority: 2
    accept_potentially_dangerous_queries: true
    with:
      joinable_space: |
        SELECT id FROM spaces
        WHERE id = subscription.parameter('space_id')
          AND (
            host_member_id = auth.user_id()
            OR host_member_id = auth.parameter('device_id')
            OR id IN (
              SELECT space_id FROM space_memberships
              WHERE left_at IS NULL
                AND (
                  member_id = auth.user_id()
                  OR member_id = auth.parameter('device_id')
                )
            )
            OR id IN (
              SELECT space_id FROM space_participations
              WHERE left_at IS NULL
                AND device_id = auth.parameter('device_id')
            )
            OR (
              visibility = 'public'
              AND ended_at IS NULL
            )
            OR (
              visibility = 'friends'
              AND ended_at IS NULL
              AND host_account_id IS NOT NULL
              AND (
                host_account_id IN (
                  SELECT user_high FROM friendships
                  WHERE user_low = auth.user_id()
                )
                OR host_account_id IN (
                  SELECT user_low FROM friendships
                  WHERE user_high = auth.user_id()
                )
              )
            )
            OR id IN (
              SELECT space_id FROM space_invites
              WHERE token = subscription.parameter('invite_token')
                AND revoked_at IS NULL
                AND (expires_at IS NULL OR expires_at > datetime('now'))
                AND use_count < max_uses
                AND (
                  invitee_account_id IS NULL
                  OR invitee_account_id = auth.user_id()
                )
            )
          )
    queries:
      - SELECT * FROM spaces WHERE id IN joinable_space
      - |
        SELECT * FROM space_invites
        WHERE space_id IN joinable_space
          AND token = subscription.parameter('invite_token')
          AND revoked_at IS NULL
          AND (expires_at IS NULL OR expires_at > datetime('now'))
          AND use_count < max_uses
          AND (
            invitee_account_id IS NULL
            OR invitee_account_id = auth.user_id()
          )

  space_memberships:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM space_memberships
      WHERE member_id = auth.user_id()
         OR member_id = auth.parameter('device_id')
         OR space_id IN (
           SELECT id FROM spaces
           WHERE host_member_id = auth.user_id()
              OR host_member_id = auth.parameter('device_id')
              OR id IN (
                SELECT space_id FROM space_memberships
                WHERE left_at IS NULL
                  AND (
                    member_id = auth.user_id()
                    OR member_id = auth.parameter('device_id')
                  )
              )
              OR id IN (
                SELECT space_id FROM space_participations
                WHERE left_at IS NULL
                  AND device_id = auth.parameter('device_id')
              )
         )

  space_participations:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM space_participations
      WHERE device_id = auth.parameter('device_id')
         OR member_id = auth.user_id()
         OR member_id = auth.parameter('device_id')
         OR space_id IN (
           SELECT space_id FROM space_memberships
           WHERE left_at IS NULL
             AND (
               member_id = auth.user_id()
               OR member_id = auth.parameter('device_id')
             )
         )
         OR space_id IN (
           SELECT id FROM spaces
           WHERE host_member_id = auth.user_id()
              OR host_member_id = auth.parameter('device_id')
         )

  client_config:
    priority: 1
    auto_subscribe: true
    query: SELECT * FROM client_config

  chess_puzzle_profiles:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_profiles WHERE owner_id = auth.user_id()

  chess_puzzle_interactions:
    priority: 2
    auto_subscribe: true
    query: SELECT * FROM chess_puzzle_interactions WHERE owner_id = auth.user_id()

  # Entire small pool (~4k rows) auto-subscribes. Band filtering for *picking*
  # stays client-side; parameterized band streams downloaded ops but never
  # applied (hasSynced stuck false, local row count 0).
  chess_puzzles:
    priority: 1
    auto_subscribe: true
    accept_potentially_dangerous_queries: true
    query: |
      SELECT
        id,
        fen,
        moves,
        rating,
        rating_deviation,
        popularity,
        nb_plays,
        themes,
        game_url,
        opening_tags
      FROM chess_puzzle_sync_pool

  friend_requests:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friend_requests
      WHERE from_user_id = auth.user_id()
         OR to_user_id = auth.user_id()

  friendships:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friendships
      WHERE user_low = auth.user_id()
         OR user_high = auth.user_id()

  user_blocks:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM user_blocks
      WHERE blocker_id = auth.user_id()

  friend_profile_cache:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM friend_profile_cache
      WHERE owner_id = auth.user_id()

  entity_store_catalog:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id IS NULL

  entity_store_owner:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM entity_store
      WHERE owner_id = auth.user_id()

  inbox_interactions:
    priority: 2
    auto_subscribe: true
    query: |
      SELECT * FROM inbox_interactions
      WHERE user_id = auth.user_id()
        AND active = true
