name: Check

# Run title, identical shape in every workflow (enforced by
# libs/tools/scripts/workflow-run-names.test.ts):
#   <Workflow> · <trigger>
run-name: "Check · ${{ github.event_name == 'pull_request' && format('pr #{0}', github.event.pull_request.number) || 'manual' }}"

permissions:
  contents: read
  actions: write
  id-token: write

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  TURBO_UI: stream

concurrency:
  group: check-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # One allocation and setup. Exact-input cache hits reuse their published
  # reports; misses publish as their tasks finish. The verdict includes reports.
  check:
    name: check
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 30
    env:
      SECRETS_ENV: dev
      SECRETS_IDENTITY_ID: ${{ vars.SECRETS_IDENTITY_ID }}
      GH_EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.depot/actions/setup
        with:
          ui-quality: 'true'

      - uses: ./.depot/actions/secrets-auth
        with:
          identity-id: ${{ vars.SECRETS_IDENTITY_ID }}
          project-id: ${{ vars.SECRETS_PROJECT_ID }}
          environment: dev

      - name: Runner resources
        run: |
          bun -e 'console.log(JSON.stringify({ cpus: require("node:os").availableParallelism(), memoryBytes: require("node:os").totalmem(), arch: process.arch }))'

      # Explicit setup verifies the installed model or downloads its pinned
      # checkpoint. The model exceeds the shared cache's artifact size limit.
      - name: Prepare visual model
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/tools/scripts/turbo-ci-run.ts @apps/product#prepare:ui-quality-model

      - name: check
        id: check
        timeout-minutes: 25
        # Apply after secrets injection. On this 16-core runner, cold runs at
        # 12 slots beat 16/20 with less memory and preserve all task coverage.
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- env TURBO_CACHE=local:rw,remote:rw TURBO_CONCURRENCY=12 bun run libs/tools/scripts/turbo-ci-run.ts --publish-reports check

      - name: Upload queryable trace artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: observability-traces-${{ github.run_id }}
          path: |
            apps/*/.cache/harness-report/*/traces/*.ndjson
            libs/*/.cache/harness-report/*/traces/*.ndjson
            pkgs/*/.cache/harness-report/*/traces/*.ndjson
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Upload turbo run summary
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: turbo-summary-${{ github.run_id }}
          path: |
            .turbo/runs/*.json
            .turbo/report-runs/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Upload visual quality evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: ui-quality-${{ github.run_id }}
          path: apps/product/.cache/ui-quality/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Write workflow summary
        if: always() && !cancelled()
        env:
          WORKFLOW_JOB: check
          WORKFLOW_OUTCOME: ${{ steps.check.outcome }}
        run: bun run libs/tools/scripts/write-workflow-summary.ts

      - name: Prune stale spec reports
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run libs/secrets/src/scripts/secrets-run.ts -- bun run libs/harness/scripts/report-cleanup.ts --apply
