# https://github.com/gitleaks/gitleaks#configuration
title = "product monorepo gitleaks config"

[extend]
useDefault = true

# False positive: OpenTofu adoption ids in the environment files. A Cloudflare
# import id is `<32-hex account id>/<hex resource id>` — public identifiers,
# not credentials — and the `"api"` custom-domain key makes the default
# `generic-api-key` rule score it. Only that exact id shape, only in the env
# files, is allowed; a real secret in these files is still caught.
[[allowlists]]
description = "Cloudflare resource ids in libs/infra-shared-ts/tofu env files"
paths = ['''(?:^|/)libs/infra-shared-ts/tofu/envs/[a-z0-9-]+\.tfvars\.json$''']
regexes = ['''"[a-z_]+":\s*"[0-9a-f]{32}/[0-9a-f]{32,40}"''']
regexTarget = "line"

# The OAuth handoff regression uses this fixed signing fixture only against
# its in-memory database. Match both the exact fixture and its one test file;
# other values in that file and this value elsewhere remain scanned.
[[allowlists]]
description = "Fixed in-memory OAuth handoff signing fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^pkgs/auth-inhouse-server-ts/tests/oauth-cross-origin-handoff\.test\.ts$''']
regexes = ['''^handoff-test-secret-0123456789abcdef$''']
regexTarget = "secret"

# False positive: a Word Tiles lexicon key names a public word list and the
# first 12 hex digits of its published checksum (`enable1.90ef7a729517`), and
# the `key:` field makes the default `generic-api-key` rule score it. Only that
# key shape, only in the lexicon module, is allowed.
[[allowlists]]
description = "Word Tiles lexicon keys (word list id and checksum prefix)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^libs/word-tiles-shared-ts/src/word-tiles-lexicon\.ts$''']
regexes = ['''^\s*key:\s*'[a-z0-9]+\.[0-9a-f]{12}',?$''']
regexTarget = "line"

# False positive: harness snapshots record the in-memory world of synthetic
# users (alice@harness.local, bob@harness.local). Their session tokens were
# minted by that throwaway in-process server and authorize nothing anywhere.
# Only the session-token keys, only in harness fixture snapshots, are allowed.
[[allowlists]]
description = "Synthetic harness session tokens in fixture snapshots"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^libs/[a-z0-9-]+-harness-ts/fixtures/snapshots/[a-z0-9-]+\.json$''']
regexes = ['''^\s*"(?:sessionToken|[{}a-z0-9-]+\.auth\.bearer)":\s*"[^"]+",?$''']
regexTarget = "line"

# False positive: a generated alert rule's `key` is the SLO's name plus the
# first eight hex digits of its hash (`slo-04e3515b`), not a credential.
[[allowlists]]
description = "SLO rule keys in the generated alert rules"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^libs/infra-shared-ts/tofu/modules/observability-views/alert-rules\.generated\.json$''']
regexes = ['''^\s*"key":\s*"slo-[0-9a-f]{8}",?$''']
regexTarget = "line"
